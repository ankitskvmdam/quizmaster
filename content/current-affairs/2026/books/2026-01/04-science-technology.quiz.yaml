- slug: ca-2601-sci-01
  difficulty: easy
  stem: "Which ISRO launch vehicle mission failed in January 2026 while carrying the EOS-N1 (Anvesha) satellite?"
  options: { A: "GSLV-F16", B: "LVM3-M6", C: "SSLV-D4", D: "PSLV-C62" }
  answer: D
  explanation: "PSLV-C62 failed with EOS-N1 (Anvesha) and 15 co-passenger satellites on board; the fault was in the third stage."
