  stem: "The first full moon of 2026, seen in early January, was popularly called the"
  options: { A: "Wolf Supermoon", B: "Harvest Supermoon", C: "Strawberry Moon", D: "Blue Moon" }
  answer: A
  explanation: "January's full moon is called the Wolf Moon; in 2026 it was also a supermoon, as the Moon was near perigee."
