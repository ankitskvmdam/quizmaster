- slug: ca-2601-bih-14
  difficulty: hard
  stem: "According to an RBI study of State finances released in January 2026, which State has the lowest median age?"
  options: { A: "Bihar", B: "Uttar Pradesh", C: "Jharkhand", D: "Kerala" }
