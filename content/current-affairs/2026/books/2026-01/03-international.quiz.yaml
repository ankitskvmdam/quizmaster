- slug: ca-2601-int-10
  difficulty: hard
  stem: "The Board of Peace for Gaza was set up under which UN Security Council resolution?"
  options: { A: "Resolution 1267", B: "Resolution 1373", C: "Resolution 2334", D: "Resolution 2803" }
  answer: D
  explanation: "The Board of Peace for Gaza was established under UN Security Council Resolution 2803 of 2025, with Donald Trump as its chair."
  tags: ["2026-01"]

- slug: ca-2601-int-11
  difficulty: hard
  stem: "Under the India–EU Free Trade Agreement, the EU is to open what share of its tariff lines to India?"
  options: { A: "75 per cent", B: "85 per cent", C: "97 per cent", D: "100 per cent" }
  answer: C
  explanation: "The EU will open 97 per cent of its tariff lines, while India will open 92.1 per cent of its own."
  tags: ["2026-01"]

- slug: ca-2601-int-12
  difficulty: hard
  stem: "'Pax Silica', which India is to be invited to join, is a US-led grouping concerned with"
  options: { A: "peace in West Asia", B: "the silicon and AI supply chain", C: "Arctic shipping routes", D: "nuclear disarmament" }
  answer: B
  explanation: "Pax Silica is a US-led coalition for a secure supply chain in silicon (chips) and artificial intelligence."
