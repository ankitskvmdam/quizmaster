  stem: "India and which country are marking 2026 as a 'Dual Year of Culture, Tourism and AI'?"
  options: { A: "Spain", B: "Germany", C: "Israel", D: "Vietnam" }
  answer: A
  explanation: "India and Spain, marking 70 years of diplomatic ties, declared 2026 their Dual Year of Culture, Tourism and AI."
