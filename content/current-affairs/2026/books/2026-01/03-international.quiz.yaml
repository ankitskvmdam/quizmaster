- slug: ca-2601-int-14
  difficulty: hard
  stem: "The Shaksgam Valley, where India objected to Chinese construction, was handed to China by Pakistan under an agreement of"
  options: { A: "1954", B: "1971", C: "1993", D: "1963" }
  answer: D
  explanation: "Pakistan ceded the Shaksgam Valley to China under their boundary agreement of 1963, which India does not accept."
