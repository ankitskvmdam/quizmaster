# Section 10 — Bihar Current Affairs (July 2026)
- slug: ca-2607-bih-01
  difficulty: easy
  stem: "Bihar's first river-linking project, the Belwa–Minapur Link Channel, is in which district?"
  options: { A: "Sitamarhi", B: "Sheohar", C: "Muzaffarpur", D: "East Champaran" }
  answer: B
  explanation: "The 68.80 km channel in Sheohar joins the Bagmati and the Burhi Gandak at a cost of Rs 130 crore."
  tags: ["2026-07"]

- slug: ca-2607-bih-02
  difficulty: easy
  stem: "Jhandu Kumar, who won India's first medal at the 2026 Commonwealth Games, competed in"
  options: { A: "Para-powerlifting", B: "Weightlifting", C: "Wrestling", D: "Boxing" }
  answer: A
  explanation: "Jhandu Kumar of Harnaut, Nalanda, won bronze in men's heavyweight para-powerlifting with 190 kg."
  tags: ["2026-07"]

- slug: ca-2607-bih-03
