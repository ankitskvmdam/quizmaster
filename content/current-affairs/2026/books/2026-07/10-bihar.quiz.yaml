  stem: "The Bihar Prison and Correctional Services Bill, 2026 replaces the"
  options: { A: "Prisoners Act, 1900", B: "Model Prisons Act, 2023", C: "Bihar Jail Manual, 2012", D: "Prisons Act, 1894" }
  answer: D
  explanation: "The Bill approved by the State Cabinet on 20 July 2026 replaces the Prisons Act, 1894."
  tags: ["2026-07"]

- slug: ca-2607-bih-04
  difficulty: easy
  stem: "A banyan tree about 700 years old, found to be the oldest accurately dated banyan, is in"
  options: { A: "Gaya", B: "Bhagalpur", C: "Munger", D: "Rajgir" }
  answer: C
  explanation: "The tree in Munger was dated by the BSIP using radiocarbon (AMS) methods."
  tags: ["2026-07"]

