  stem: "Which three districts of Bihar stopped mass drug administration against filariasis after clearing TAS-1?"
  options: { A: "Araria, Madhepura and Supaul", B: "Purnia, Katihar and Kishanganj", C: "Gaya, Nawada and Jamui", D: "Siwan, Saran and Gopalganj" }
  answer: A
  explanation: "Araria, Madhepura and Supaul cleared the first Transmission Assessment Survey; the national elimination target is 2027."
