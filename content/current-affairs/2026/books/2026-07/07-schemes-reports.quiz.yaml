# Section 7 — Government Schemes, Reports & Indices (July 2026)
- slug: ca-2607-sch-01
  difficulty: easy
  stem: "The VB-G RAM G Act, 2025, which came into force on 1 July 2026, replaced"
  options: { A: "PM-KISAN", B: "MGNREGA", C: "PMAY-Gramin", D: "DAY-NRLM" }
  answer: B
  explanation: "The VB-G RAM G Act replaced MGNREGA and guarantees 125 days of work."
  tags: ["2026-07"]

- slug: ca-2607-sch-02
  difficulty: easy
  stem: "Which State topped NITI Aayog's first Investment Friendliness Index 2026?"
  options: { A: "Gujarat", B: "Maharashtra", C: "Tamil Nadu", D: "Karnataka" }
  answer: A
  explanation: "Gujarat was first with 56.6, followed by Maharashtra and Tamil Nadu."
  tags: ["2026-07"]

- slug: ca-2607-sch-03
  difficulty: easy
  stem: "How many days of work does the VB-G RAM G Act, 2025 guarantee?"
  options: { A: "100 days", B: "150 days", C: "125 days", D: "200 days" }
  answer: C
  explanation: "The Act guarantees 125 days of work, with a wage floor of Rs 300 a day."
  tags: ["2026-07"]

