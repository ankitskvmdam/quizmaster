- slug: ca-2607-eco-02
  difficulty: easy
  stem: "Which industry was added to the Index of Core Industries in the new series with base year 2022-23?"
  options: { A: "Iron ore", B: "Aluminium", C: "Copper", D: "Bauxite" }
  answer: A
  explanation: "Iron ore became the ninth core industry; the eight earlier ones continue."
