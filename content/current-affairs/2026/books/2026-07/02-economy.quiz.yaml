- slug: ca-2607-eco-03
  difficulty: easy
  stem: "In July 2026 GST completed how many years since its launch?"
  options: { A: "Seven", B: "Eight", C: "Ten", D: "Nine" }
  answer: D
  explanation: "GST was launched in 2017 and completed nine years; gross collections reached Rs 22.27 lakh crore in 2025-26."
