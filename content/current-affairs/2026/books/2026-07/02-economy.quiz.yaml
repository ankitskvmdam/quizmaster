# Section 2 — Economy & Banking (July 2026)
- slug: ca-2607-eco-01
  difficulty: easy
  stem: "The India–UK Comprehensive Economic and Trade Agreement (CETA) came into effect on"
  options: { A: "1 July 2026", B: "10 July 2026", C: "15 July 2026", D: "26 July 2026" }
  answer: C
  explanation: "The CETA and its companion Double Contribution Convention took effect on 15 July 2026."
