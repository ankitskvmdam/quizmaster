  stem: "Which is India's deepest freshwater lake?"
  options: { A: "Wular Lake", B: "Dal Lake", C: "Loktak Lake", D: "Manasbal Lake" }
  answer: D
  explanation: "Manasbal Lake in Ganderbal, Jammu and Kashmir, is India's deepest freshwater lake."
