- slug: ca-2607-env-05
  difficulty: medium
  stem: "In July 2026 the Supreme Court quashed the 2021 office memorandum that allowed"
  options: { A: "Mining in tiger reserves", B: "Sand mining without permits", C: "Diversion of forest land for roads", D: "Ex post facto environmental clearances" }
  answer: D
  explanation: "The Court struck down the 2021 office memorandum that allowed projects to get environmental clearance after they had started."
  tags: ["2026-07"]

- slug: ca-2607-env-06
  difficulty: medium
  stem: "In the seventh draft notification on the Western Ghats Ecologically Sensitive Area, which State has the largest area?"
  options: { A: "Kerala", B: "Maharashtra", C: "Karnataka", D: "Tamil Nadu" }
  answer: C
  explanation: "Karnataka has the largest area (20,668 sq km) and Gujarat the smallest (449 sq km) of the 56,825.7 sq km in six States."
  tags: ["2026-07"]

