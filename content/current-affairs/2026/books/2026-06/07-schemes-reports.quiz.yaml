# Section 7 — Government Schemes, Reports & Indices (June 2026)
- slug: ca-2606-sch-01
  difficulty: easy
  stem: "The VB-G RAM G scheme, in force from 1 July 2026, replaces which programme?"
  options: { A: "PM Awas Yojana – Gramin", B: "Deendayal Antyodaya Yojana – NRLM", C: "MGNREGS", D: "PM Gram Sadak Yojana" }
  answer: C
  explanation: "VB-G RAM G replaces the Mahatma Gandhi National Rural Employment Guarantee Scheme and guarantees 125 days of work."
  tags: ["2026-06"]

- slug: ca-2606-sch-02
  difficulty: easy
  stem: "PM SVANidhi, which completed six years in June 2026, is a loan scheme for"
  options: { A: "street vendors", B: "small farmers", C: "weavers", D: "fishermen" }
  answer: A
  explanation: "PM SVANidhi, launched on 1 June 2020, gives collateral-free loans to street vendors."
  tags: ["2026-06"]

- slug: ca-2606-sch-03
  difficulty: easy
  stem: "How many days of wage employment in a year does VB-G RAM G guarantee to a rural household?"
  options: { A: "100", B: "125", C: "150", D: "200" }
  answer: B
  explanation: "The guarantee rises from 100 days under MGNREGS to 125 days."
  tags: ["2026-06"]

