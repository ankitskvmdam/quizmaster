# Section 1 — Polity & Governance (June 2026)
- slug: ca-2606-pol-01
  difficulty: easy
  stem: "In June 2026 the Supreme Court held that which of the following is a fundamental right?"
  options: { A: "The right to walk on safe, demarcated footpaths", B: "The right to free public transport", C: "The right to park on public roads", D: "The right to free internet access" }
  answer: A
  explanation: "The Court held that walking on safe, demarcated footpaths is a fundamental right under Article 19(1)(d) read with Article 21."
  tags: ["2026-06"]

- slug: ca-2606-pol-02
  difficulty: easy
  stem: "The 11th Governing Council meeting of NITI Aayog was chaired by the"
  options: { A: "President of India", B: "Prime Minister", C: "Union Finance Minister", D: "Vice Chairperson of NITI Aayog" }
  answer: B
  explanation: "The Prime Minister chairs the Governing Council of NITI Aayog; its 11th meeting had the theme 'Inclusive Human Development for Viksit Bharat @2047'."
  tags: ["2026-06"]

- slug: ca-2606-pol-03
  difficulty: easy
  stem: "The Mekedatu dam project, opposed by a resolution of the Tamil Nadu Assembly, is proposed on which river?"
  options: { A: "Krishna", B: "Godavari", C: "Cauvery", D: "Tungabhadra" }
  answer: C
  explanation: "Mekedatu is Karnataka's proposed dam on the Cauvery; the Tamil Nadu Assembly unanimously opposed it."
  tags: ["2026-06"]

- slug: ca-2606-pol-04
  difficulty: easy
  stem: "According to the Ministry of External Affairs' clarification, an Indian passport is"
  options: { A: "conclusive proof of citizenship", B: "proof of residence only", C: "valid only with a voter ID card", D: "a travel document and not conclusive proof of citizenship" }
  answer: D
  explanation: "The Ministry said a passport is a travel document and does not conclusively prove citizenship."
  tags: ["2026-06"]

