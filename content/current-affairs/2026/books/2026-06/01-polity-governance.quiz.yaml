- slug: ca-2606-pol-11
  difficulty: hard
  stem: "In the footpath judgment, the Supreme Court linked the right to walk mainly to which Article, read with Article 21?"
  options: { A: "Article 14", B: "Article 19(1)(g)", C: "Article 25", D: "Article 19(1)(d)" }
  answer: D
  explanation: "Article 19(1)(d) guarantees the freedom to move freely throughout the territory of India; the Court read it with Article 21."
  tags: ["2026-06"]

