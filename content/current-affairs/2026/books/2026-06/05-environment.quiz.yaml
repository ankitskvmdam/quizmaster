# Section 5 — Environment & Ecology (June 2026)
- slug: ca-2606-env-01
  difficulty: easy
  stem: "Which wetland was announced as India's 100th Ramsar site on 5 June 2026?"
  options: { A: "Shekha Jheel, Aligarh", B: "Jai Prakash Narayan Bird Sanctuary (Surha Tal), Ballia", C: "Kanwar Lake, Begusarai", D: "Sambhar Lake, Rajasthan" }
  answer: B
  explanation: "Surha Tal in Ballia, Uttar Pradesh, an oxbow lake of the Ganga, became India's 100th Ramsar site."
