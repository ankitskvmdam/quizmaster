# Section 3 — International Relations (February 2026)
- slug: ca-2602-int-01
  difficulty: easy
  stem: "Under the India–US trade understanding of February 2026, the US reciprocal tariff on Indian goods was reduced to"
  options: { A: "10 per cent", B: "15 per cent", C: "18 per cent", D: "20 per cent" }
  answer: C
  explanation: "The reciprocal tariff was cut from 25 per cent to 18 per cent, and the extra 25 per cent duty linked to Russian oil was removed."
