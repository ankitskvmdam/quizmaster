- slug: ca-2602-sch-09
  difficulty: medium
  stem: "India aims to eliminate lymphatic filariasis by"
  options: { A: "2026", B: "2027", C: "2030", D: "2047" }
  answer: B
  explanation: "The mass drug administration campaign in 12 States supports the target of eliminating the disease by 2027."
  tags: ["2026-02"]

- slug: ca-2602-sch-10
  difficulty: hard
  stem: "The Mission for Aatmanirbharta in Pulses has an outlay of"
  options: { A: "Rs 11,440 crore", B: "Rs 6,839 crore", C: "Rs 20,000 crore", D: "Rs 24,000 crore" }
  answer: A
  explanation: "The mission has Rs 11,440 crore for 2025-26 to 2030-31 and targets 350 lakh tonnes of pulses by 2030-31."
  tags: ["2026-02"]

- slug: ca-2602-sch-11
  difficulty: hard
  stem: "Which State's Jugal Kishore Nagar Village Committee ranked first in the Panchayat Advancement Index 2.0?"
  options: { A: "Kerala", B: "Gujarat", C: "Telangana", D: "Tripura" }
  answer: D
