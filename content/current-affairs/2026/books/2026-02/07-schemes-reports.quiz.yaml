# Section 7 — Government Schemes, Reports & Indices (February 2026)
- slug: ca-2602-sch-01
  difficulty: easy
  stem: "The PM RAHAT scheme, launched in February 2026, provides cashless treatment to"
  options: { A: "road accident victims", B: "cancer patients", C: "senior citizens above 70", D: "construction workers" }
  answer: A
  explanation: "PM RAHAT gives road accident victims cashless treatment of up to Rs 1.5 lakh for the first 7 days."
  tags: ["2026-02"]

- slug: ca-2602-sch-02
  difficulty: easy
  stem: "What was India's rank in the Corruption Perceptions Index 2025?"
  options: { A: "45th", B: "80th", C: "91st", D: "96th" }
  answer: C
  explanation: "India ranked 91st of 182 countries with a score of 39, up from 96th in 2024."
  tags: ["2026-02"]

- slug: ca-2602-sch-03
  difficulty: easy
  stem: "The Corruption Perceptions Index is published by"
  options: { A: "the World Bank", B: "Transparency International", C: "the World Economic Forum", D: "Amnesty International" }
  answer: B
  explanation: "Transparency International publishes the index; Denmark topped the 2025 edition."
  tags: ["2026-02"]

- slug: ca-2602-sch-04
  difficulty: easy
  stem: "The target for Lakhpati Didis was doubled in February 2026 to"
  options: { A: "2 crore", B: "4 crore", C: "5 crore", D: "6 crore" }
  answer: D
  explanation: "The target was raised from 3 crore to 6 crore Lakhpati Didis by March 2029."
  tags: ["2026-02"]

- slug: ca-2602-sch-05
  difficulty: medium
  stem: "The Urban Challenge Fund, approved by the Union Cabinet, has central assistance of"
  options: { A: "Rs 25,000 crore", B: "Rs 50,000 crore", C: "Rs 1 lakh crore", D: "Rs 4 lakh crore" }
  answer: C
  explanation: "The fund of the Ministry of Housing and Urban Affairs has central assistance of Rs 1 lakh crore for 2025-26 to 2030-31."
  tags: ["2026-02"]

- slug: ca-2602-sch-06
  difficulty: medium
  stem: "Bharat-VISTAAR, whose first phase was launched in Jaipur, is"
  options: { A: "a rural housing scheme", B: "an AI-based advisory system for farmers", C: "a crop insurance portal", D: "a highway expansion plan" }
  answer: B
  explanation: "Bharat-VISTAAR is a multilingual AI advisory system for farmers; its helpline number is 155261."
  tags: ["2026-02"]

- slug: ca-2602-sch-07
  difficulty: medium
  stem: "Sampoornata Abhiyan 2.0, for aspirational districts and blocks, was launched by"
  options: { A: "the Ministry of Rural Development", B: "the Ministry of Panchayati Raj", C: "the Ministry of Home Affairs", D: "NITI Aayog" }
  answer: D
  explanation: "NITI Aayog runs the campaign from 28 January to 14 April 2026 in 112 Aspirational Districts and 513 Aspirational Blocks."
  tags: ["2026-02"]

- slug: ca-2602-sch-08
  difficulty: medium
  stem: "India ranked 45th in the Network Readiness Index 2025. Who releases this index?"
  options: { A: "Portulans Institute", B: "International Telecommunication Union", C: "World Economic Forum", D: "UNCTAD" }
  answer: A
  explanation: "The Portulans Institute releases the index; India rose four places to 45th."
