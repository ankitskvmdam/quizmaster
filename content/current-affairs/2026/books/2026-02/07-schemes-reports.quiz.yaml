- slug: ca-2602-sch-13
  difficulty: hard
  stem: "The second phase of the Vibrant Villages Programme covers about how many border villages?"
  options: { A: "662", B: "1,954", C: "2,967", D: "4,800" }
  answer: B
  explanation: "VVP-II covers 1,954 border villages in 17 States with an outlay of Rs 6,839 crore."
