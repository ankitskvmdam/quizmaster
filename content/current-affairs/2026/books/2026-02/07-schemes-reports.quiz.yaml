  tags: ["2026-02"]

- slug: ca-2602-sch-12
  difficulty: hard
  stem: "'Bhasha Matters' is the title of a 2025 report on education in India brought out by"
  options: { A: "NCERT", B: "UNICEF", C: "UNESCO", D: "NITI Aayog" }
  answer: C
  explanation: "It is UNESCO's seventh State of the Education Report for India, on mother-tongue and multilingual education."
