  stem: "Which country announced its withdrawal from OPEC and OPEC+ with effect from 1 May 2026?"
  options: { A: "Saudi Arabia", B: "The UAE", C: "Kuwait", D: "Iraq" }
  answer: B
  explanation: "The UAE announced that it would leave OPEC and OPEC+ from 1 May 2026, leaving OPEC with 11 active members."
