# Section 3 — International Relations (April 2026)
- slug: ca-2604-int-01
  difficulty: easy
  stem: "Which country mediated the two-week ceasefire between the United States and Iran in April 2026?"
  options: { A: "Pakistan", B: "Qatar", C: "Oman", D: "Türkiye" }
  answer: A
  explanation: "Pakistan mediated the two-week ceasefire, which is being called the Islamabad Accord."
