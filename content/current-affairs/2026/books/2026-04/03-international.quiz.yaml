  stem: "With which country did India sign a Free Trade Agreement in April 2026 that brings a commitment to invest USD 20 billion in India?"
  options: { A: "Australia", B: "Chile", C: "New Zealand", D: "Oman" }
  answer: C
  explanation: "Under the India–New Zealand FTA, New Zealand committed to invest USD 20 billion in India over 15 years."
