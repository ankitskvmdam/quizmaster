- slug: ca-2604-bih-01
  difficulty: easy
  stem: "Who was sworn in as the Chief Minister of Bihar on 15 April 2026?"
  options: { A: "Vijay Kumar Sinha", B: "Bijendra Prasad Yadav", C: "Samrat Choudhary", D: "Vijay Kumar Chaudhary" }
  answer: C
  explanation: "Samrat Choudhary took the oath on 15 April 2026 and became the first BJP Chief Minister of Bihar."
