# Section 1 — Polity & Governance (May 2026)
- slug: ca-2605-pol-01
  difficulty: easy
  stem: "Who took oath in May 2026 as the first BJP Chief Minister of West Bengal?"
  options: { A: "Dilip Ghosh", B: "Suvendu Adhikari", C: "Sukanta Majumdar", D: "Samik Bhattacharya" }
  answer: B
  explanation: "Suvendu Adhikari was sworn in on 9 May 2026 at the Brigade Parade Ground, Kolkata, after the BJP won 206 seats."
  tags: ["2026-05"]

- slug: ca-2605-pol-02
  difficulty: easy
  stem: "Which party emerged as the single largest party in the Tamil Nadu Assembly election of 2026?"
  options: { A: "DMK", B: "AIADMK", C: "BJP", D: "Tamilaga Vettri Kazhagam (TVK)" }
  answer: D
  explanation: "TVK, led by Vijay, won 108 of 234 seats; Vijay was sworn in as Chief Minister on 10 May 2026."
