# Section 2 — Economy & Banking (May 2026)
- slug: ca-2605-eco-01
  difficulty: easy
  stem: "Who was appointed Deputy Governor of the Reserve Bank of India in May 2026, succeeding T. Rabi Sankar?"
  options: { A: "Rohit Jain", B: "Swaminathan J.", C: "Poonam Gupta", D: "M. Rajeshwar Rao" }
  answer: A
  explanation: "Rohit Jain, earlier an Executive Director of the RBI, was appointed Deputy Governor for three years."
