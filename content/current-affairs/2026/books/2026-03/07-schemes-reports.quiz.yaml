# Section 7 — Government Schemes, Reports & Indices (March 2026)
- slug: ca-2603-sch-01
  difficulty: easy
  stem: "Which country topped the World Happiness Report 2026?"
  options: { A: "Denmark", B: "Iceland", C: "Costa Rica", D: "Finland" }
  answer: D
  explanation: "Finland was ranked first for the 9th year in a row; India was 116th."
