- slug: ca-2603-sch-02
  difficulty: easy
  stem: "The Cabinet in March 2026 extended the Jal Jeevan Mission up to"
  options: { A: "March 2027", B: "December 2028", C: "March 2030", D: "December 2031" }
  answer: B
  explanation: "The mission, now called JJM 2.0, was extended to December 2028 with a total outlay of Rs 8.69 lakh crore."
