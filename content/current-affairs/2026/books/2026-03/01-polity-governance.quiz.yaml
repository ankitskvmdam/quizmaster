  stem: "Under which Article can the Chief Election Commissioner be removed only in the manner of a Supreme Court judge?"
  options: { A: "Article 61", B: "Article 338B", C: "Article 324(5)", D: "Article 124(2)" }
  answer: C
  explanation: "Article 324(5) protects the Chief Election Commissioner; in March 2026 the Opposition considered a removal motion against CEC Gyanesh Kumar."
