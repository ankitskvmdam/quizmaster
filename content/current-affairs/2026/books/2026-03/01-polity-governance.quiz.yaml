  stem: "In March 2026 the Supreme Court allowed passive euthanasia for the first time for a particular patient. The case was that of"
  options: { A: "Aruna Shanbaug", B: "Prabhu Kumar", C: "Chinthada Anand", D: "Harish Rana" }
  answer: D
  explanation: "The Court allowed withdrawal of life support for Harish Rana, applying its Common Cause (2018) guidelines to an individual for the first time."
