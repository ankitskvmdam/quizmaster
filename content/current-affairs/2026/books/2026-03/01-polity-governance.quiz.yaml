# Section 1 — Polity & Governance (March 2026)
- slug: ca-2603-pol-01
  difficulty: easy
  stem: "Who became the Lieutenant Governor of Delhi in the reshuffle of March 2026?"
  options: { A: "Vinai Kumar Saxena", B: "Taranjit Singh Sandhu", C: "Kavinder Gupta", D: "R.N. Ravi" }
  answer: B
  explanation: "Former diplomat Taranjit Singh Sandhu became Lieutenant Governor of Delhi; Vinai Kumar Saxena moved from Delhi to Ladakh."
