- slug: ca-2603-pol-09
  difficulty: hard
  stem: "While giving adoptive mothers maternity leave whatever the child's age, the Supreme Court struck down a provision of the"
  options: { A: "Maternity Benefit Act, 1961", B: "Juvenile Justice Act, 2015", C: "Code on Wages, 2019", D: "Code on Social Security, 2020" }
  answer: D
  explanation: "The Court struck down Section 60(4) of the Code on Social Security, 2020, which limited the benefit by the age of the adopted child."
  tags: ["2026-03"]

- slug: ca-2603-pol-10
  difficulty: hard
  stem: "In which case did the Supreme Court hold in March 2026 that Scheduled Caste status is lost on conversion to a religion other than Hinduism, Sikhism or Buddhism?"
  options: { A: "Prabhu Kumar v. State of Himachal Pradesh", B: "Chinthada Anand v. State of Andhra Pradesh", C: "Common Cause v. Union of India", D: "Vikash Kumar v. UPSC" }
  answer: B
  explanation: "In Chinthada Anand v. State of Andhra Pradesh the Court held that SC status is open only to those professing Hinduism, Sikhism or Buddhism."
  tags: ["2026-03"]

