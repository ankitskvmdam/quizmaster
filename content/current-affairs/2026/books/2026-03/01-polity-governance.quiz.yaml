  stem: "The 'guillotine', used by the Lok Sabha in March 2026, refers to"
  options: { A: "ending a debate by a closure motion", B: "putting all remaining Demands for Grants to vote together without discussion", C: "the lapse of a Bill when the House is dissolved", D: "suspending a member for disorderly conduct" }
  answer: B
  explanation: "By the guillotine the Lok Sabha passed Demands for Grants of over Rs 53 lakh crore for 2026-27 without discussing each of them."
