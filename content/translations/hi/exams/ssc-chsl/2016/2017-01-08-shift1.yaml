  - slug: chsl-2017-01-08-s1-q021
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्युहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 और आव्यूह-II की 5 से 9 है। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए 'F' को 32, 42 आदि द्वारा दर्शाया जा सकता है तथा 'M' को 88, 68 आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए शब्द 'DOWN' के लिए समूह को पहचानना है।

      **Matrix-I / आव्यूह - I**

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | I | N | U | H | E |
      | 1 | U | I | N | L | L |
      | 2 | W | G | I | N | E |
      | 3 | W | W | F | I | U |
      | 4 | W | W | F | N | E |

      **Matrix-II / आव्यूह - II**

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | I | D | D | R | O |
      | 6 | O | I | I | M | D |
      | 7 | O | D | G | I | O |
      | 8 | D | M | T | M | I |
      | 9 | D | D | D | M | D |

      *(चित्र: Question printed as an image: instructions plus two 5×5 letter matrices (Matrix-I rows/columns 0–4, Matrix-II rows/columns 5–9), transcribed as tables in the stem.)*
    options:
      A: 76, 59, 21, 33
      B: 95, 79, 40, 43
      C: 99, 57, 30, 42
      D: 69, 65, 20, 85
    answer: B
    explanation: As per SSC's official answer.
