  - slug: chsl-2017-01-07-s1-q021
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्युहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 और आव्यूह-II की 5 से 9 है। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए 'N' को 21, 67 आदि द्वारा दर्शाया जा सकता है तथा 'R' को 66, 57 आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए शब्द 'HUNT' के लिए समूह को पहचानना है।

      **Matrix-I / आव्यूह - I**

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | T | R | A | N | B |
      | 1 | W | U | N | H | U |
      | 2 | E | N | S | G | U |
      | 3 | N | Y | P | U | M |
      | 4 | H | T | U | F | A |

      **Matrix-II / आव्यूह - II**

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | T | A | R | I | H |
      | 6 | X | R | N | W | B |
      | 7 | C | S | Y | E | U |
      | 8 | S | N | T | M | S |
      | 9 | G | B | E | R | H |

      *(चित्र: Question printed as an image: instructions plus two 5×5 letter matrices (Matrix-I rows/columns 0–4, Matrix-II rows/columns 5–9), transcribed as tables in the stem.)*
    options:
      A: 40, 33, 03, 88
      B: 99, 23, 56, 00
      C: 59, 42, 12, 79
      D: 13, 11, 30, 41
    answer: D
    explanation: As per SSC's official answer.
