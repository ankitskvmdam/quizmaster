  - slug: chsl-2017-01-07-s1-q011
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में, दो कथन दिए गए हैं जिनके आगे दो निष्कर्ष I और II निकाले गए हैं। आपको मानना है कि कथन सत्य है चाहे वे सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होते हों। आपको निर्णय करना है कि दिए गए निष्कर्षों में से कौन सा/कौन से निश्चित रूप से कथनों द्वारा सही निकाला जा सकता है/सकते हैं, यदि कोई हो।

      कथनः

      (I) कुछ स्कूटर, ट्रक हैं।

      (II) सभी ट्रक, रेलगाड़ी हैं।

      निष्कर्षः

      (I) कुछ स्कूटर, रेलगाड़ी हैं।

      (II) कोई ट्रक, स्कूटर नहीं है।
    options:
      A: निष्कर्ष I सही है
      B: निष्कर्ष II सही है
      C: न तो I और न ही II सही है
      D: I और II दोनों सही हैं
    answer: A
    explanation: As per SSC's official answer.
    tags:
      - reasoning
