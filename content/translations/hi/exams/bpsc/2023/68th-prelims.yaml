slug: 68th-prelims
title: बीपीएससी 68वीं प्रारंभिक परीक्षा
date: 2023-02-12
label: Series A
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q22."
questions:
  - slug: bpsc-68-q001
    difficulty: medium
    stem: भारतीय संविधान के अनुच्छेद 14 में लिखा हुआ ‘कानून के समक्ष समानता’ किस देश के संविधान से लिया गया है?
    options:
      A: ब्रिटेन
      B: यू० एस० ए०
      C: फ्रांस
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: "'Equality before law' (Art. 14) comes from the British Constitution (rule of law); 'equal protection of laws' comes from the US Constitution."
  - slug: bpsc-68-q002
    difficulty: medium
    stem: भारतीय संविधान को बनाने में कितना समय लगा?
    options:
      A: 1 वर्ष 10 माह और 12 दिन
      B: 2 वर्ष 10 माह और 5 दिन
      C: 2 वर्ष 11 माह और 18 दिन
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: "The Constituent Assembly first met on 9 Dec 1946 and adopted the Constitution on 26 Nov 1949: 2 years, 11 months and 18 days."
  - slug: bpsc-68-q003
    difficulty: medium
    stem: राज्य का मंत्रिपरिषद् सामूहिक तौर पर किसके प्रति उत्तरदायी है?
    options:
      A: मुख्यमंत्री
      B: राज्यपाल
      C: विधान-सभा
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: "Article 164(2): the State Council of Ministers is collectively responsible to the Legislative Assembly."
  - slug: bpsc-68-q004
    difficulty: medium
    stem: |-
      निम्नलिखित कथनों पर विचार कीजिए :

      73वें संशोधन के बाद विकेन्द्रीकरण किया गया

      1. निर्णय लेने की शक्तियों का
      2. पूर्ण व्यवस्था का
      3. न्यायिक शक्तियों का
      4. प्रशासनिक शक्तियों का

      उपर्युक्त में से कौन-से कथन सही हैं?
    options:
      A: केवल 1, 2 और 3
      B: केवल 1, 2 और 4
      C: केवल 2, 3 और 4
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: The 73rd Amendment decentralised decision-making, administrative powers and the governance system as a whole; it did not decentralise judicial powers.
  - slug: bpsc-68-q005
    difficulty: medium
    stem: राज्य सभा में प्रतिनिधित्व में शामिल हैं
    options:
      A: नागरिकों द्वारा सीधे चुने गए सदस्य
      B: अप्रत्यक्ष रूप से नागरिकों द्वारा उनके प्रतिनिधियों के माध्यम से चुने गए सदस्य
      C: भारत के राष्ट्रपति द्वारा मनोनीत सदस्य
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: Rajya Sabha has members elected indirectly by elected MLAs and 12 members nominated by the President, so both B and C hold.
  - slug: bpsc-68-q006
    difficulty: medium
    stem: निम्नलिखित में से किसका संबंध भारत के सर्वोच्च न्यायालय से है?
    options:
      A: अपीलीय अधिकार क्षेत्र
      B: मूल अधिकार क्षेत्र
      C: कॉलेजियम प्रणाली
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: Original and appellate jurisdiction and the collegium system all relate to the Supreme Court, so more than one option is correct.
  - slug: bpsc-68-q007
    difficulty: medium
    stem: 73वें संविधान संशोधन अधिनियम के तहत पंचायती राज संस्थाओं में चुनाव लड़ने के लिए न्यूनतम कितनी आयु होना आवश्यक है?
    options:
      A: 21 वर्ष
      B: 25 वर्ष
      C: 18 वर्ष
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: "Article 243F (73rd Amendment): a person who has attained 21 years cannot be disqualified on grounds of age for Panchayat elections."
  - slug: bpsc-68-q008
    difficulty: medium
    stem: भारत में जिला स्तर पर उपभोक्ता विवाद निवारण के संदर्भ में निम्नलिखित में से कौन-सा कथन सही **नहीं** है?
    options:
      A: राज्य सरकार यदि उचित समझे तो एक जिले में एक से अधिक जिला फोरम की स्थापना कर सकती है।
      B: जिला फोरम के सदस्यों में से एक महिला होगी।
      C: जिला फोरम उन शिकायतों पर विचार करता है जहाँ वस्तुओं या सेवाओं का मूल्य पचास लाख रुपए से अधिक नहीं होता है।
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: E
    explanation: Under the Consumer Protection Act 2019, a State may set up more than one District Commission in a district, the 2020 rules require a woman president or member, and since Dec 2021 the pecuniary limit is Rs 50 lakh. All three statements are correct, so none is 'not correct'.
  - slug: bpsc-68-q009
    difficulty: medium
    stem: एक पंचायत समिति किस स्तर पर एक पंचायती राज संरचना का संचालन करती है?
    options:
      A: जिला स्तर
      B: ग्राम पंचायत स्तर
      C: ब्लॉक-स्तरीय निकाय
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: The Panchayat Samiti is the intermediate tier, at the block level.
  - slug: bpsc-68-q010
    difficulty: medium
    stem: निम्नलिखित में से किसे समुदाय विकास के पहले कार्यक्रम के रूप में स्थापित किया गया था?
    options:
      A: राष्ट्रीय विस्तार सेवा
      B: एकीकृत ग्रामीण विकास कार्यक्रम
      C: सहयोग आन्दोलन
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: Of the options, the National Extension Service (1953) was the earliest community-development programme (it followed the 1952 Community Development Programme); IRDP came in 1978-80.
  - slug: bpsc-68-q011
    difficulty: medium
    stem: |-
      एस० ई० जेड० अधिनियम, 2005 के उद्देश्य क्या हैं?

      1. अतिरिक्त आर्थिक गतिविधियों का उत्पादन
      2. वस्तुओं और सेवाओं के निर्यात को बढ़ावा
      3. रोजगार निर्माण
    options:
      A: 1, 2 और 3
      B: केवल 2 और 3
      C: केवल 1 और 3
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: The SEZ Act 2005 lists additional economic activity, export promotion and employment generation among its objectives, so all three apply.
  - slug: bpsc-68-q012
    difficulty: medium
    stem: कृषि विपणन प्रणाली में सुधार के लिए भारत सरकार द्वारा अपनाया गया नीतिगत उपाय क्या है?
    options:
      A: न्यूनतम समर्थन मूल्य (एम० एस० पी०)
      B: बफर स्टॉक का रखरखाव
      C: सार्वजनिक वितरण प्रणाली (पी० डी० एस०)
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: NCERT lists MSP, buffer stocks and PDS as policy instruments the government uses in agricultural marketing, so more than one option is correct.
  - slug: bpsc-68-q013
    difficulty: medium
    stem: किस समिति ने प्रतिस्पर्धा अधिनियम, 2002 को अधिनियमित करने का सुझाव दिया?
    options:
      A: रंगराजन समिति
      B: एस० वी० एस० राघवन समिति
      C: विजय केलकर समिति
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: The S.V.S. Raghavan Committee (2000) recommended a new competition law, which became the Competition Act 2002.
  - slug: bpsc-68-q014
    difficulty: medium
    stem: |-
      सूची–I को सूची–II से सुमेलित कीजिए :

      | सूची–I | सूची–II |
      |---|---|
      | a. धूसर क्रांति | 1. प्याज का उत्पादन |
      | b. गुलाबी क्रांति | 2. टमाटर और मांस उत्पादन |
      | c. रजत क्रांति | 3. अंडे का उत्पादन |
      | d. लाल क्रांति | 4. उर्वरक (फर्टिलाइज़र) |
    options:
      A: a-4, b-1, c-3, d-2
      B: a-3, b-1, c-4, d-2
      C: a-1, b-4, c-2, d-3
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: "Grey Revolution: fertilisers; Pink: onion (also prawns/meat); Silver: eggs; Red: tomato and meat."
  - slug: bpsc-68-q015
    difficulty: medium
    stem: निम्नलिखित में से कौन-सी पंचवर्षीय योजना, मानव संसाधन विकास पर केन्द्रित थी?
    options:
      A: प्रथम
      B: तृतीय
      C: पंचम
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: E
    explanation: Human resource development was the focus of the Eighth Plan (1992-97), which is not among the options.
  - slug: bpsc-68-q016
    difficulty: medium
    stem: भारत के निम्नलिखित में से किस राज्य ने अप्रैल से सितंबर 2022 के दौरान उच्चतम प्रत्यक्ष विदेशी निवेश (एफ० डी० आइ०), इक्विटी के रूप में प्राप्त किया?
    options:
      A: कर्नाटक
      B: त्रिपुरा
      C: गुजरात
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: In Apr-Sep 2022 Maharashtra was first and Karnataka second in FDI equity inflows (DPIIT). Among the listed states Karnataka is highest.
  - slug: bpsc-68-q017
    difficulty: medium
    stem: किस बजट में वित्त मंत्री ने उदारीकृत विनिमय दर प्रबंधन प्रणाली की घोषणा की?
    options:
      A: यूनियन बजट, 1991–1992
      B: यूनियन बजट, 1992–1993
      C: यूनियन बजट, 1993–1994
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: LERMS (dual exchange rate) was announced in the Union Budget 1992-93 and introduced in March 1992.
  - slug: bpsc-68-q018
    difficulty: medium
    stem: |-
      पंचवर्षीय योजना के उद्देश्य निम्नलिखित में से कौन-से थे?

      1. विकास
      2. आधुनिकीकरण
      3. आत्मनिर्भरता
      4. साहित्य
    options:
      A: केवल 1, 3 और 4
      B: केवल 2, 3 और 4
      C: केवल 1, 2 और 4
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: E
    explanation: The plan goals were growth, modernisation, self-reliance and equity. 'Literature' is not one, and every option includes statement 4, so none is correct.
  - slug: bpsc-68-q019
    difficulty: medium
    stem: गरीबी रेखा को निर्धारित करने के लिए कौन-सा संगठन सर्वेक्षण करता है?
    options:
      A: एन० एस० एस० ओ०
      B: नीति आयोग
      C: आर० बी० आइ०
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: Poverty estimates rely on the NSSO consumption expenditure surveys. NITI Aayog uses the data but does not conduct the survey.
  - slug: bpsc-68-q020
    difficulty: medium
    stem: भारत का व्यापार संतुलन (माल और सेवाएँ) दिसंबर 2022 (अनंतिम) के लिए है
    options:
      A: (–) 10·50 अरब अमरीकी डॉलर
      B: (+) 11·98 अरब अमरीकी डॉलर
      C: (–) 11·98 अरब अमरीकी डॉलर
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: The Commerce Ministry's estimate for Dec 2022 was overall exports of about USD 61.82 bn and imports of about USD 73.80 bn, a trade deficit of about USD 11.98 bn.
  - slug: bpsc-68-q021
    difficulty: medium
    stem: वर्ष 2020–2022 के लिए सबसे कम महिला कार्यबल भागीदारी दर कितने प्रतिशत पर बिहार में दर्ज की गई?
    options:
      A: 4% ग्रामीण क्षेत्रों में और 6·5% शहरी क्षेत्रों में
      B: 6% ग्रामीण क्षेत्रों में और 8·1% शहरी क्षेत्रों में
      C: 7% ग्रामीण क्षेत्रों में और 9·1% शहरी क्षेत्रों में
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: Bihar has the lowest female workforce participation among states. The key takes about 4% rural and 6.5% urban.
  - slug: bpsc-68-q023
    difficulty: medium
    stem: केन्द्रीय स्वास्थ्य एवं परिवार कल्याण मंत्रालय द्वारा 24 नवम्बर, 2021 को प्रकाशित राष्ट्रीय परिवार सर्वेक्षण-5 के अनुसार, बिहार के लिंग अनुपात में काफी अच्छा सुधार हुआ है। यह 2015–2016 में ______ से बढ़कर 2020–2022 में ______ हो गया है।
    options:
      A: 1062, 1090
      B: 1040, 1070
      C: 1030, 1050
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: "NFHS-5: Bihar's sex ratio (females per 1000 males) rose from 1062 (NFHS-4, 2015-16) to 1090 (2019-21)."
  - slug: bpsc-68-q024
    difficulty: medium
    stem: बिहार आर्थिक सर्वेक्षण (2021–2022) के अनुसार, 2020–2021 में बिहार के सकल राज्य घरेलू उत्पाद (जी० एस० डी० पी०) की वृद्धि दर कितनी रही?
    options:
      A: 3%
      B: 2%
      C: 2·5%
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: "Bihar Economic Survey 2021-22: GSDP grew 2.5% at constant prices in 2020-21, the COVID year."
  - slug: bpsc-68-q025
    difficulty: medium
    stem: निम्नलिखित में से कौन-सा एक बिहार की अर्थव्यवस्था के मामले में सही है?
    options:
      A: भारत में सबसे कम विकास दर में से एक है जो 2·5% है।
      B: बिहार में अधिकतर प्राथमिक वस्तुओं का उत्पादन होता है।
      C: अर्थव्यवस्था का व्यावसायिक ढाँचा ऊपर से स्थिर है।
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: Bihar's growth rate is among the highest (A is false). It mainly produces primary goods, and its occupational structure, with over two-thirds in agriculture, has hardly changed. The key accepts both B and C.
  - slug: bpsc-68-q026
    difficulty: medium
    stem: प्रथम बार संघर्ष के तरीकों के रूप में स्वदेशी एवं बहिष्कार किसके दौरान अपनाए गए थे?
    options:
      A: साइमन कमीशन के भारत आगमन
      B: बंगाल विभाजन
      C: होम रूल आंदोलन
      D: उपर्युक्त में से एक से अधिक
      E: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: Swadeshi and Boycott were first adopted as methods of struggle during the anti-partition movement against the Partition of Bengal in 1905.
  - slug: bpsc-68-q027
    difficulty: medium
    stem: 1906 में आयोजित भारतीय राष्ट्रीय काँग्रेस (आइ० एन० सी०) के कलकत्ता अधिवेशन में भारत के लिए स्वराज का झण्डा किसके द्वारा फहराया गया था?
    options:
      A: ए० ओ० ह्यूम
