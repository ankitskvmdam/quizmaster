slug: 69th-prelims
title: बीपीएससी 69वीं प्रारंभिक परीक्षा
date: 2023-09-30
label: Series A
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q33, Q60, Q122."
questions:
  - slug: bpsc-69-q001
    difficulty: medium
    stem: |-
      निम्नलिखित में से कौन-सी तकनीकें 5G मोबाइल संचार नेटवर्क द्वारा सक्षम की जाएँगी?

      1. इंटरनेट ऑफ थिंग्स
      2. एज कम्प्यूटिंग
      3. नेटवर्क स्लाइसिंग

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: केवल 1 और 2
      B: केवल 2 और 3
      C: केवल 1 और 3
      D: 1, 2 और 3
    answer: D
    explanation: 5G's low latency and high capacity enable IoT, edge computing and network slicing, so all three are correct.
  - slug: bpsc-69-q002
    difficulty: medium
    stem: |-
      सूची–I को सूची–II से सुमेलित कीजिए :

      | सूची–I (अंतरिक्ष मिशन) | सूची–II (खोज) |
      |---|---|
      | a. कैसिनी-ह्यूजेंस | 1. बृहस्पति |
      | b. जूनो | 2. शनि और उसके वलय |
      | c. आर्टेमिस | 3. शुक्र |
      | d. वेरिटास | 4. मानव अंतरिक्ष उड़ान—चंद्रमा से मंगल ग्रह तक |

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: a-2, b-1, c-4, d-3
      B: a-3, b-1, c-4, d-2
      C: a-2, b-3, c-4, d-1
      D: a-3, b-1, c-2, d-4
    answer: A
    explanation: Cassini-Huygens studied Saturn, Juno studies Jupiter, Artemis is NASA's Moon-to-Mars human programme, VERITAS is a Venus mission.
  - slug: bpsc-69-q003
    difficulty: medium
    stem: |-
      सूची–I को सूची–II से सुमेलित कीजिए :

      | सूची–I (कपड़ा) | सूची–II (उत्पत्ति) |
      |---|---|
      | a. लिनेन | 1. नारियल का पौधा |
      | b. जटा (कॉयर) | 2. सन का पौधा |
      | c. मोहायर | 3. बत्तख और गीज़ के पंख |
      | d. डाउन | 4. अंगोरा बकरी |

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: a-1, b-3, c-2, d-4
      B: a-4, b-3, c-1, d-2
      C: a-2, b-1, c-4, d-3
      D: a-4, b-1, c-3, d-2
    answer: C
    explanation: Linen comes from flax, coir from coconut husk, mohair from the Angora goat, and down from duck and goose feathers.
  - slug: bpsc-69-q004
    difficulty: medium
    stem: |-
      निम्नलिखित कथनों पर विचार कीजिए :

      1. टेनियासिस एक आँतों का संक्रमण है, जो टेपवर्म की तीन प्रजातियों—टेनिया सोलियम, टेनिया सगीनाटा और टेनिया एशियाटिका के कारण होता है।
      2. जब मस्तिष्क में सिस्ट विकसित हो जाते हैं, तो इस स्थिति को न्यूरोसिस्टिसर्कोसिस (एन० सी० सी०) कहा जाता है।

      उपर्युक्त में से कौन-सा/से कथन सही है/हैं?
    options:
      A: केवल 1
      B: केवल 2
      C: 1 और 2 दोनों
      D: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: Taeniasis is caused by T. solium, T. saginata and T. asiatica (WHO); larval cysts in the brain cause neurocysticercosis. Both are correct.
  - slug: bpsc-69-q005
    difficulty: medium
    stem: |-
      निम्नलिखित में से कौन-सी कम्प्यूटर भाषाएँ हैं?

      1. कोबरा
      2. पाइथन
      3. स्किरल
      4. जावा

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: केवल 1 और 2
      B: केवल 3 और 4
      C: केवल 1, 2 और 3
      D: उपर्युक्त सभी
    answer: D
    explanation: Cobra, Python, Squirrel and Java are all programming languages.
  - slug: bpsc-69-q006
    difficulty: medium
    stem: हाल ही में समाचारों में देखी गई चैट-जी० पी० टी० में, जी० पी० टी० का पूर्ण रूप क्या है?
    options:
      A: ग्लूटामिक पाइरुविक ट्रांसएमिनेज़
      B: जी० यू० आइ० डी० पार्टिशन टेबल
      C: ग्रूव्ड पेगबोर्ड टेस्ट
      D: जेनरेटिव प्री-ट्रेंड ट्रांसफॉर्मर
    answer: D
    explanation: GPT stands for Generative Pre-trained Transformer.
  - slug: bpsc-69-q007
    difficulty: medium
    stem: |-
      निम्नलिखित में से कौन-से जीभ के स्वाद नहीं हैं?

      1. मीठा
      2. कड़वा
      3. नमकीन
      4. मसालेदार
      5. उमामी
      6. खट्टा
      7. तीखा

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: 2, 5 और 7
      B: 1, 3 और 4
      C: 4 और 7
      D: 3 और 6
    answer: C
    explanation: The five basic tastes are sweet, bitter, salty, umami and sour; spicy and pungent are pain/chemesthetic sensations, not tastes.
  - slug: bpsc-69-q008
    difficulty: medium
    stem: |-
      निम्नलिखित में से कौन-से जोड़े सही सुमेलित हैं?

      1. एनोरेक्सिया : नींद सम्बन्धी विकार
      2. इनसोम्निया : खाने का विकार
      3. डिस्पनिया : साँस की तकलीफ
      4. एनोस्मिया : गंध की आंशिक या पूर्ण हानि

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: केवल 1 और 2
      B: केवल 2 और 3
      C: केवल 3 और 4
      D: उपर्युक्त सभी
    answer: C
    explanation: Anorexia is an eating disorder and insomnia a sleep disorder (pairs 1 and 2 are swapped); dyspnoea and anosmia are matched correctly.
  - slug: bpsc-69-q009
    difficulty: medium
    stem: ब्रह्मांड में, पल्सर क्या हैं?
    options:
      A: तारों का एक समूह
      B: घूमते न्यूट्रॉन तारे
      C: किसी तारे का विस्फोट
      D: किसी तारे द्वारा उत्सर्जित रेडियो तरंगें
    answer: B
    explanation: Pulsars are rapidly rotating, highly magnetised neutron stars that emit beams of radiation.
  - slug: bpsc-69-q010
    difficulty: medium
    stem: प्रयोगशाला में विकसित हीरे (एल० जी० डी०) के संदर्भ में, हीरे के बीज के रूप में किसका उपयोग किया जाता है?
    options:
      A: सफेद नीलम
      B: मोइसानाइट
      C: ग्रेफ़ाइट
      D: क्यूबिक ज़िरकोनिया (सी० जेड०)
    answer: C
    explanation: The key gives graphite, the carbon feedstock that is turned into diamond under high pressure and temperature. The seed itself is usually a diamond plate, so the wording is loose.
  - slug: bpsc-69-q011
    difficulty: medium
    stem: बुलेट-प्रूफ जैकेट बनाने के लिए उपयोग किया जाने वाला ‘फाइबर’ क्या है?
    options:
      A: नायलॉन
      B: टेरिलीन
      C: ट्वीड
      D: केवलर
    answer: D
    explanation: Kevlar, an aramid fibre with very high tensile strength, is used in bulletproof jackets.
  - slug: bpsc-69-q012
    difficulty: medium
    stem: |-
      एच० एम० एक्स० का/के पूर्ण रूप क्या है/हैं?

      1. हाई मेल्टिंग एक्सप्लोसिव
      2. हाई-डेंसिटी मोनोएटॉमिक ज़ेनॉन
      3. हेज मोनेटाइज़िंग ज़ेनोकरेंसी
      4. हर मैजस्टीस एक्सप्लोसिव

      नीचे दिए गए कूट का प्रयोग कर सही उत्तर चुनिए।
    options:
      A: 1 और 2
      B: 2 और 3
      C: केवल 1
      D: 1 और 4
    answer: C
    explanation: |-
      **Disputed.** BPSC's final key says C; our check suggests D.

      The key accepts only 'High Melting Explosive'. 'Her Majesty's Explosive' is another widely quoted expansion, which would make D right; the key's remark says the other names don't change the compound.
  - slug: bpsc-69-q013
    difficulty: medium
    stem: अक्टूबर 2022 में लॉन्च किए गए टेस्ला के ह्यूमनॉइड रोबोट का नाम क्या है?
    options:
      A: सोफिया
      B: एटलस
      C: पेपर
      D: ऑप्टिमस
    answer: D
    explanation: Tesla showed its humanoid robot Optimus at AI Day in October 2022.
  - slug: bpsc-69-q014
    difficulty: medium
    stem: ‘मैनहट्टन परियोजना’ क्या है?
    options:
      A: एक अनुसंधान और विकास उपक्रम, जिसने पहले परमाणु हथियार का उत्पादन किया
      B: दुनिया की सबसे बड़ी कला-नीलामी में से एक
      C: न्यूयॉर्क सिटी में एक रियल एस्टेट परियोजना
      D: एक प्रसिद्ध थीम पार्क
    answer: A
    explanation: The Manhattan Project was the US-led WWII programme that produced the first nuclear weapons.
  - slug: bpsc-69-q015
    difficulty: medium
    stem: अवतल दर्पण द्वारा बनाया गया प्रतिबिम्ब वास्तविक, उल्टा और वस्तु के आकार के बराबर होता है। वस्तु की स्थिति कैसी होनी चाहिए?
    options:
      A: फोकस पर
      B: वक्रता के केन्द्र पर
      C: फोकस और वक्रता केन्द्र के बीच
      D: वक्रता केन्द्र से परे
    answer: B
    explanation: For a concave mirror, an object at the centre of curvature forms a real, inverted, same-size image at C.
  - slug: bpsc-69-q016
    difficulty: medium
    stem: फोटोइलेक्ट्रिक सेल एक ऐसा उपकरण है, जो कि
    options:
      A: प्रकाश ऊर्जा को विद्युत् ऊर्जा में बदलता है
      B: विद्युत् ऊर्जा को प्रकाश ऊर्जा में बदलता है
      C: प्रकाश ऊर्जा का भंडारण करता है
      D: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: A photoelectric cell converts light energy into electrical energy.
  - slug: bpsc-69-q017
    difficulty: medium
    stem: विलयन/विलायक के प्रति इकाई आयतन या प्रति इकाई द्रव्यमान में उपस्थित विलेय की मात्रा को रसायन में किस रूप में जाना जाता है?
    options:
      A: विलेय का संघटन
      B: विलायक की सांद्रता
      C: विलेय की सांद्रता
      D: विलयन की सांद्रता
    answer: D
    explanation: The amount of solute per unit volume or mass of solution is the concentration of the solution.
  - slug: bpsc-69-q018
    difficulty: medium
    stem: कोविड टीकाएँ, प्रतिरक्षी प्रतिक्रिया को कैसे उत्तेजित करते हैं?
    options:
      A: जीवित क्षीण SARS-CoV-2 वायरस प्रवेश कराके
      B: एक वास्तविक SARS-CoV-2 वायरस प्रवेश कराके
      C: SARS-CoV-2 वायरस का एक हानिरहित टुकड़ा प्रवेश कराके
      D: SARS-CoV-2 वायरस के खिलाफ एंटीबॉडी प्रवेश कराके
    answer: A
    explanation: |-
      **Disputed.** BPSC's final key says A; our check suggests C.

      The key says vaccines work by introducing live attenuated virus. That is not how the main COVID vaccines work. They present a harmless piece (the spike protein or its mRNA), which is option C.
  - slug: bpsc-69-q019
    difficulty: medium
    stem: निम्नलिखित में से कौन-सा तरल बिजली का कुचालक है?
    options:
      A: नमकीन पानी
      B: संतरे का रस
      C: नींबू का रस
      D: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: Salt water, orange juice and lemon juice all contain ions and conduct electricity, so none of them is a bad conductor.
  - slug: bpsc-69-q020
    difficulty: medium
    stem: डी० एन० ए० डबल हेलिक्स संरचना की खोज किसके द्वारा की गई थी?
    options:
      A: जेम्स वॉटसन और फ्रांसिस क्रिक
      B: रोज़लिंड फ्रैंकलिन और मौरिस विल्किंस
      C: लिनस पॉलिंग
      D: ग्रेगर मेंडल
    answer: A
    explanation: Watson and Crick proposed the double-helix model of DNA in 1953.
  - slug: bpsc-69-q021
    difficulty: medium
    stem: अलग-अलग द्रव्यमान की दो वस्तुएँ चंद्रमा की सतह के पास स्वतंत्र रूप से गिरने से क्या होगा?
    options:
      A: अलग-अलग त्वरण होगा
      B: उनके जड़त्व में परिवर्तन होगा
      C: किसी भी क्षण एक ही वेग होगा
      D: समान परिमाण के बल का अनुभव होगा
    answer: C
    explanation: All bodies have the same acceleration in free fall, so if dropped together they have the same velocity at every instant. Their forces differ because their masses differ.
  - slug: bpsc-69-q022
    difficulty: medium
    stem: वेक्टर टीके प्रतिरोधक शक्ति प्रदान करने के लिए कैसे काम करते हैं?
    options:
      A: किसी कमजोर या निष्क्रिय वायरस को शरीर में प्रवेश कराकर
      B: शरीर में रोगजनकों पर सीधे हमला कर और उन्हें नष्ट कर
      C: वायरस को किसी भिन्न वायरस के संशोधित संस्करण में रखकर
      D: सीधे कोशिकाओं में प्रवेश कराकर और उन्हें स्पाइक प्रोटीन बनाने में सक्षम बनाकर
    answer: C
    explanation: Vector vaccines put a gene of the target virus into a modified, harmless virus such as an adenovirus.
  - slug: bpsc-69-q023
    difficulty: medium
    stem: लगातार नई परत जोड़ने वाली प्रक्रिया निम्नलिखित में से कौन-सी है?
    options:
      A: निम्नस्खलन (सबडक्शन)
      B: भूकंप
      C: समुद्रतल का फैलाव
      D: संवहन
    answer: C
    explanation: New oceanic crust is continually created at mid-ocean ridges by seafloor spreading.
  - slug: bpsc-69-q024
    difficulty: medium
    stem: “भूपटल के टुकड़े मेंटल में गति द्वारा निरंतर, धीमी गति से प्रवाहित होते हैं।” इस सिद्धांत को क्या कहा जाता है?
    options:
      A: महाद्वीपीय बहाव सिद्धांत
      B: पैंजिया सिद्धांत
      C: प्लेट टेक्टॉनिक्स सिद्धांत
      D: प्लेट सीमा सिद्धांत
    answer: C
    explanation: Plate tectonics holds that lithospheric plates move slowly, driven by movements in the mantle.
  - slug: bpsc-69-q025
    difficulty: medium
    stem: ‘एम० आर० एन० ए० (mRNA)’ पद का विस्तारित रूप क्या है, जो महामारी की शुरुआत से ही व्यापक रूप से चर्चा में रहा है?
    options:
      A: मैसेंजर राइबोन्यूक्लिक ऐसिड
      B: म्यूटेंट राइबोन्यूक्लिक ऐसिड
      C: मॉडिफाइड राइबोन्यूक्लिक ऐसिड
      D: नेमोनिक राइबोन्यूक्लिक ऐसिड
    answer: A
    explanation: mRNA stands for messenger ribonucleic acid.
  - slug: bpsc-69-q026
    difficulty: medium
    stem: AC करेन्ट को कैसे उत्पन्न करते हैं?
    options:
      A: चोक कुंडली द्वारा
      B: डायनामो द्वारा
      C: ट्रांसफॉर्मर द्वारा
      D: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: An AC dynamo (alternator) produces alternating current; a transformer only changes the voltage of an existing AC supply.
  - slug: bpsc-69-q027
    difficulty: medium
    stem: धारा घनत्व होता है
    options:
      A: एक अदिश राशि
      B: एक सदिश राशि
      C: विमाविहीन
      D: उपर्युक्त में से कोई नहीं
    answer: B
    explanation: Current density J has both magnitude and direction, so it is a vector (I = ∫J·dA).
  - slug: bpsc-69-q028
    difficulty: medium
    stem: मेडिकल केमिस्ट्री में दवाओं का वर्गीकरण किस आधार पर सबसे अधिक उपयोगी है?
    options:
      A: औषधीय प्रभाव
      B: आण्विक लक्ष्य
      C: रासायनिक संरचना
      D: उपर्युक्त में से कोई नहीं
