source: BPSC official question booklet and final answer key (bpsc.bihar.gov.in).
questions:
  - slug: bpsc-66-q001
    difficulty: medium
    stem: मांसपेशियों में दर्द के उपचार में उपयोग किया जाने वाला विकिरण है
    options:
      A: इंफ्रारेड
      B: माइक्रोवेव
      C: यू० वी०
      D: एक्स-रे
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Infrared radiation produces heat in tissues, so infrared lamps are used to relieve muscle ache.
  - slug: bpsc-66-q002
    difficulty: medium
    stem: दो समानान्तर प्रतिरोध वाले सर्किट का कुल प्रतिरोध 1·403 किलो-ओम है। यदि एक प्रतिरोधक का मान 2·0 किलो-ओम है, तो दूसरे प्रतिरोधक का मान होगा
    options:
      A: 1·403 किलो-ओम
      B: 2·0 किलो-ओम
      C: 3·403 किलो-ओम
      D: 4·70 किलो-ओम
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: 1/R2 = 1/1.403 - 1/2.0 = 0.2128 per kilo-ohm, so R2 = 4.70 kilo-ohm.
  - slug: bpsc-66-q003
    difficulty: medium
    stem: गर्म करने पर एक अर्धचालक का प्रतिरोध
    options:
      A: बढ़ता है
      B: घटता है
      C: वही रहता है
      D: पहले बढ़ता है फिर घटता है
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: "A semiconductor has a negative temperature coefficient: heating frees more charge carriers, so resistance decreases."
  - slug: bpsc-66-q004
    difficulty: medium
    stem: फैराडे स्थिरांक
    options:
      A: इलेक्ट्रोलाइट की मात्रा पर निर्भर करता है
      B: इलेक्ट्रोलाइट में पारित विद्युत्-धारा पर निर्भर करता है
      C: विलायक के आयतन पर निर्भर करता है जिसमें इलेक्ट्रोलाइट घोला गया है
      D: सार्वभौमिक स्थिरांक है
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Faraday constant (about 96,485 C/mol) is the charge of one mole of electrons, a universal constant.
  - slug: bpsc-66-q005
    difficulty: medium
    stem: "'प्रकाश-वर्ष' किसकी इकाई है?"
    options:
      A: समय
      B: गति
      C: दूरी
      D: प्रकाश की तीव्रता
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: A light-year is the distance light travels in one year (about 9.46 x 10^12 km).
  - slug: bpsc-66-q006
    difficulty: medium
    stem: जब प्रकाश एक माध्यम से दूसरे में जाता है, तो निम्न में से कौन-सी/सा **नहीं** बदलती/बदलता है?
    options:
      A: वेग/गति
      B: तरंगदैर्घ्य
      C: आवृत्ति
      D: अपवर्तनांक
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Frequency is set by the source and stays the same; speed and wavelength change on refraction.
  - slug: bpsc-66-q007
    difficulty: medium
    stem: विद्युत्-चुम्बकीय तरंगों का वेग होता है
    options:
      A: 3×10⁸ m s⁻¹
      B: 3×10⁷ m s⁻¹
      C: 3×10⁶ m s⁻¹
      D: 3×10⁵ m s⁻¹
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: All electromagnetic waves travel in vacuum at c = 3 x 10^8 m/s.
  - slug: bpsc-66-q008
    difficulty: medium
    stem: पहला आदमी, जिसने चाँद पर अपना पैर रखा था, है
    options:
      A: लीओनोव
      B: नील आर्मस्ट्रॉन्ग
      C: माइकेल कॉलिंस
      D: जेम्स वैन ऐलन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Neil Armstrong (Apollo 11, 20 July 1969) was the first person to step on the Moon.
  - slug: bpsc-66-q009
    difficulty: medium
    stem: प्लूटोनियम न्यूक्लाइड (₉₄Pu²⁴²) के नाभिक में न्यूट्रॉनों की संख्या होती है
    options:
      A: "94"
      B: "148"
      C: "242"
      D: "336"
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Neutrons = mass number - atomic number = 242 - 94 = 148.
  - slug: bpsc-66-q010
    difficulty: medium
    stem: सबसे ज्यादा श्यानता होती है
    options:
      A: जल की
      B: वायु की
      C: खून की
      D: शहद की
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Honey is far more viscous than blood, water or air.
  - slug: bpsc-66-q011
    difficulty: medium
    stem: दूध किसका घटिया स्रोत है?
    options:
      A: कैल्सियम
      B: प्रोटीन
      C: विटामिन C
      D: कार्बोहाइड्रेट
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Milk is rich in calcium, protein and carbohydrate (lactose) but has very little vitamin C.
  - slug: bpsc-66-q012
    difficulty: medium
    stem: पुलिस द्वारा नशे में गाड़ी चलाने वाले की साँस की जाँच के लिये फिल्टर पेपर पर क्या होता है?
    options:
      A: पोटैशियम डाइक्रोमेट–सल्फ्यूरिक अम्ल
      B: पोटैशियम परमैंगनेट–सल्फ्यूरिक अम्ल
      C: सिल्वर नाइट्रेट लेपित सिलिका जेल
      D: हल्दी
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: The breathalyser uses acidified potassium dichromate, which turns from orange to green when it oxidises ethanol.
  - slug: bpsc-66-q013
    difficulty: medium
    stem: ग्लूकोज को एथिल अल्कोहल में किस एंजाइम द्वारा बदल दिया जाता है?
    options:
      A: माल्टेज
      B: इन्वर्टेज
      C: जाइमेज
      D: डायस्टेज
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Zymase (from yeast) ferments glucose into ethyl alcohol and CO2.
  - slug: bpsc-66-q014
    difficulty: medium
    stem: चूने का पानी किसके द्वारा दुधिया हो जाता है?
    options:
      A: CO
      B: CO₂
      C: O₂
      D: O₃
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: CO2 forms insoluble calcium carbonate with limewater, turning it milky.
  - slug: bpsc-66-q015
    difficulty: medium
    stem: पेट्रोल तथा डीजल के अधूरे जलने से उत्पन्न होती है
    options:
      A: नाइट्रिक ऑक्साइड
      B: नाइट्रोजन डाइऑक्साइड
      C: कार्बन डाइऑक्साइड
      D: कार्बन मोनोऑक्साइड
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Incomplete combustion of hydrocarbon fuels in limited oxygen produces carbon monoxide.
  - slug: bpsc-66-q016
    difficulty: medium
    stem: एक घोल का pH, 3 से 6 बदलता है। इसमें H⁺ आयन की सान्द्रता
    options:
      A: 3 गुना बढ़ जायेगी
      B: 3 गुना कम हो जायेगी
      C: 10 गुना कम हो जायेगी
      D: 1000 गुना कम हो जायेगी
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: "[H+] = 10^-pH, so going from pH 3 to pH 6 lowers [H+] by 10^3 = 1000 times."
  - slug: bpsc-66-q017
    difficulty: medium
    stem: रेत और नैफ्थलीन के मिश्रण को किसके द्वारा अलग किया जा सकता है?
    options:
      A: ऊर्ध्वपातन (सब्लिमेशन)
      B: आसवन (डिस्टिलेशन)
      C: क्रोमैटोग्राफी
      D: आंशिक आसवन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Naphthalene sublimes on heating while sand does not, so sublimation separates them.
  - slug: bpsc-66-q018
    difficulty: medium
    stem: बेंजीन में सिग्मा और पाई बन्ध की संख्या होती है
    options:
      A: 3, 3
      B: 3, 6
      C: 12, 3
      D: 12, 6
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Benzene has 6 C-C and 6 C-H sigma bonds (12) and 3 pi bonds.
  - slug: bpsc-66-q019
    difficulty: medium
    stem: यूरिया में उपस्थित होने वाले तत्त्व हैं
    options:
      A: C, H, O
      B: C, N, O
      C: C, H, N
      D: C, H, N, O
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Urea, CO(NH2)2, contains carbon, hydrogen, nitrogen and oxygen.
  - slug: bpsc-66-q020
    difficulty: medium
    stem: निम्न में से कौन-सा ऊष्मा का सबसे अधिक कुचालक है?
    options:
      A: ताँबा
      B: सीसा
      C: पारा
      D: जस्ता
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
