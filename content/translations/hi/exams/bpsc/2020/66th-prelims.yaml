    explanation: Mercury's thermal conductivity (about 8 W/m K) is the lowest of these metals; lead is about 35, zinc about 116, copper about 400.
  - slug: bpsc-66-q021
    difficulty: medium
    stem: विटामिन, जो रक्त के थक्के बनाने में प्रभावी होता है, है
    options:
      A: विटामिन A
      B: विटामिन B
      C: विटामिन D
      D: विटामिन K
