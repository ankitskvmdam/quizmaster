  - slug: bpsc-66-q022
    difficulty: medium
    stem: महिला सेक्स हॉर्मोन है
    options:
      A: एस्ट्रोजन
      B: ऐन्ड्रोजन
      C: इन्सुलिन
      D: ऑक्सीटोसिन
