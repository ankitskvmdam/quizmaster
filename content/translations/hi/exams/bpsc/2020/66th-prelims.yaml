    answer: A
    explanation: Estrogen is the principal female sex hormone; androgens are male hormones.
  - slug: bpsc-66-q023
    difficulty: medium
    stem: पार्किन्सन बीमारी के उपचार के विकास के लिये किसको नोबेल पुरस्कार दिया गया?
    options:
      A: आर्वीड कार्लसन
      B: जॉन एफ० एंडर्स
      C: रॉबर्ट बी० लफलीन
      D: वाल्टर कोहन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Arvid Carlsson shared the 2000 Nobel Prize in Physiology or Medicine for discovering dopamine's role, which led to L-DOPA treatment of Parkinson's disease.
  - slug: bpsc-66-q024
    difficulty: medium
    stem: थाइरॉइड ग्रंथि की खराबी किसकी कमी के कारण होती है?
    options:
      A: विटामिन A
      B: कैल्सियम
      C: आयोडीन
