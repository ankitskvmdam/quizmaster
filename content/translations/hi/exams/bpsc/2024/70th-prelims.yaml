slug: 70th-prelims
title: बीपीएससी 70वीं प्रारंभिक परीक्षा
date: 2024-12-13
label: Series E
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q58, Q101, Q114, Q117."
questions:
  - slug: bpsc-70-q001
    difficulty: medium
    stem: निम्नलिखित में से कौन-सा लोहे का अयस्क है ?
    options:
      A: बॉक्साइट
      B: सिनेबार
      C: पाइरॉइट
      D: लिमोनाइट
    answer: D
    explanation: Limonite (hydrated iron oxide) is an iron ore; bauxite is aluminium ore, cinnabar is mercury ore and pyrite (FeS2) is mined for sulphur, not iron.
  - slug: bpsc-70-q002
    difficulty: medium
    stem: लावा के ठंडा होने और ठोस होने से किस प्रकार की चट्टान बनती है ?
    options:
      A: तलछटी
      B: इग्नियस
      C: रूपान्तरित
      D: क्रिस्टल
    answer: B
    explanation: Igneous rocks form when magma or lava cools and solidifies.
  - slug: bpsc-70-q003
    difficulty: medium
    stem: संसद में “कटौती प्रस्ताव” का क्या उद्देश्य होता है ?
    options:
      A: सरकार के दैनिक वित्तिय खर्चों पर रोक
      B: सरकार के बजट प्रस्तावों के खर्चों में कटौती का प्रस्ताव प्रस्तुत करना
      C: सरकार के अनुदान पर रोक
      D: भारत की संचित निधि से अनुदान पर रोक
    answer: B
    explanation: A cut motion is moved in the Lok Sabha to reduce the amount of a demand for grant in the budget.
  - slug: bpsc-70-q004
    difficulty: medium
    stem: अंग्रेजों ने राजधानी को दिल्ली कब स्थानांतरित किया ?
    options:
      A: "1912"
      B: "1913"
      C: "1911"
      D: उपरोक्त में एक से अधिक
    answer: A
    explanation: The transfer of the capital from Calcutta to Delhi was announced at the Delhi Durbar on 12 December 1911 and took effect in 1912; the key takes 1912 as the year of the actual shift.
  - slug: bpsc-70-q005
    difficulty: medium
    stem: लोकसभा में आंग्ल-भारतीय समुदाय के प्रतिनिधित्व की क्या स्थिती है ?
    options:
      A: राष्ट्रपति द्वारा दो आंग्ल-भारतीय मनोनीत किए जाते हैं
      B: 104वें संविधानिक संशोधन द्वारा उनका मनोनीत करना समाप्त कर दिया गया है
      C: राष्ट्रपति द्वारा एक आंग्ल-भारतीय मनोनीत किया जाता है
      D: वे उनकी आबादी के अनुसार मनोनीत होते हैं
    answer: B
    explanation: The 104th Constitutional Amendment Act, 2019 ended the nomination of two Anglo-Indian members to the Lok Sabha (Art. 331) from January 2020.
  - slug: bpsc-70-q006
    difficulty: medium
    stem: फरवरी 2024 में विश्व व्यापार संगठन (डब्ल्यूटीओ) का 13वां मंत्रिस्तरीय सम्मेलन कहाँ आयोजित किया गया था ?
    options:
      A: अबू धाबी
      B: अर्जेंटीना
      C: स्विट्ज़रलैंड
      D: इंडोनेशिया
    answer: A
    explanation: The WTO's 13th Ministerial Conference (MC13) was held in Abu Dhabi, UAE, in February-March 2024.
  - slug: bpsc-70-q007
    difficulty: medium
    stem: फ्रेंच ओपन टेनिस टूर्नामेंट 2024 में पुरुष एकल का खिताब किसने जीता ?
    options:
      A: अलेक्जेंडर ज्वेरेव
      B: नोवाक जोकोविच
      C: कार्लोस अलकराज
      D: डेनियल मेदवेदेव
    answer: C
    explanation: Carlos Alcaraz beat Alexander Zverev in the 2024 French Open men's singles final.
  - slug: bpsc-70-q008
    difficulty: medium
    stem: मार्च 2024 में किए गए बदलावों के बाद, वरिष्ठ नागरिकों के लिए डाक मतपत्र द्वारा मतदान करने की पात्रता आयु क्या है ?
    options:
      A: 80 वर्ष
      B: 85 वर्ष
      C: 90 वर्ष
      D: 82 वर्ष
    answer: B
    explanation: The March 2024 amendment to the Conduct of Election Rules raised the age for the absentee-voter postal ballot option for senior citizens from 80 to 85 years.
  - slug: bpsc-70-q009
    difficulty: medium
    stem: 2024-25 के केंद्रीय बजट भाषण में, ‘आत्मनिर्भरता’ (स्वावलंबन) के लक्ष्य के तहत किस तेलबीज को शामिल **नहीं** किया गया है ?
    options:
      A: नारियल
      B: तिल
      C: मूँगफली
      D: सोयाबीन
    answer: A
    explanation: The 2024-25 Budget speech named mustard, groundnut, sesame, soybean and sunflower for oilseed 'atmanirbharta'; coconut was not among them.
  - slug: bpsc-70-q010
    difficulty: medium
    stem: निम्नलिखित में से कौन-सा जोड़ा विस्थापन प्रतिक्रिया देगा ?
    options:
      A: NaCl विलयन और कॉपर धातु
      B: AgNO₃ विलयन और कॉपर धातु
      C: MgCl₂ विलयन और एल्यूमिनियम धातु
      D: FeSO₄ विलयन और सिल्वर धातु
    answer: B
    explanation: Copper is more reactive than silver, so it displaces silver from AgNO3 solution; the other pairs have the less reactive metal.
  - slug: bpsc-70-q011
    difficulty: medium
    stem: बिहुला महोत्सव विशेष रूप से प्रत्येक वर्ष अगस्त के महीने में बिहार के निम्नलिखित में से किस जिले में मनाया जाता है ?
    options:
      A: पटना
      B: भागलपुर
      C: दरभंगा
      D: सीतामढ़ी
    answer: B
    explanation: Bihula (Bishahari) puja, linked to the Bihula-Bishahari folk tale, is celebrated mainly in Bhagalpur (Anga region) in August.
  - slug: bpsc-70-q012
    difficulty: medium
    stem: उष्मा स्थानांतरण जिसके लिए किसी माध्यम की आवश्यकता **नहीं** होती है, कहलाता है
    options:
      A: प्रतिबिंब
      B: विकिरण
      C: संवहन
      D: संचालन
    answer: B
    explanation: Radiation transfers heat by electromagnetic waves and needs no medium.
  - slug: bpsc-70-q013
    difficulty: medium
    stem: निम्नलिखित में से कौन-सा अम्ल पेट में स्त्रावित होता है ?
    options:
      A: नाइट्रीक अम्ल
      B: सल्फ्यूरिक अम्ल
      C: हाइड्रोक्लोरिक अम्ल
      D: फॉस्फोरिक अम्ल
    answer: C
    explanation: The gastric glands secrete hydrochloric acid in the stomach.
  - slug: bpsc-70-q014
    difficulty: medium
    stem: रामकृष्ण मिशन की स्थापना किसके द्वारा की गई थी ?
    options:
      A: 1899 में विद्यासागर
      B: 1899 में स्वामी विवेकानंद
      C: 1897 में स्वामी विवेकानंद
      D: उपरोक्त में एक से अधिक
    answer: C
    explanation: Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897.
  - slug: bpsc-70-q015
    difficulty: medium
    stem: हाल ही में उद्घाटन किया गया राष्ट्रीय डॉल्फिन अनुसंधान केंद्र बिहार के किस शहर में स्थित है ?
    options:
      A: पटना
      B: दरभंगा
      C: गया
      D: मुंगेर
    answer: A
    explanation: The National Dolphin Research Centre, India's first, was inaugurated in Patna in 2024 on the Patna University campus by the Ganga.
  - slug: bpsc-70-q016
    difficulty: medium
    stem: संविधान का कौन-सा अनुच्छेद किसी सांसद के लाभकारी पद पर रोक लगाता है ?
    options:
      A: अनुच्छेद 102 (1) (b)
      B: अनुच्छेद 102 (1) (c)
      C: अनुच्छेद 102 (1) (a)
      D: अनुच्छेद 102 (1) (d)
    answer: C
    explanation: Art. 102(1)(a) disqualifies a member who holds an office of profit under the Government of India or a state government.
  - slug: bpsc-70-q017
    difficulty: medium
    stem: जून 2024 में चंद्रमा के अंधेरे हिस्से से मिट्टी लाने वाला पहला देश कौन-सा बना ?
    options:
      A: चीन
      B: यूएसए
      C: भारत
      D: फ्रांस
    answer: A
    explanation: China's Chang'e-6 returned the first samples from the far side of the Moon in June 2024.
  - slug: bpsc-70-q018
    difficulty: medium
    stem: |-
      निम्नलिखित भारत की पर्वत श्रेणियाँ हैं

      1. गारों पहाडियाँ
      2. नन्दादेवी
      3. कामेत
      4. के²

      निम्नलिखित में से इनका पूर्व से पश्चिम सही क्रम क्या है ?
    options:
      A: 4 3 1 2
      B: 3 4 2 1
      C: 1 2 3 4
      D: 2 1 4 3
    answer: C
    explanation: "From east to west: Garo Hills (Meghalaya), Nanda Devi (~80.0 E), Kamet (~79.6 E), K2 (~76.5 E), i.e. 1 2 3 4."
  - slug: bpsc-70-q019
    difficulty: medium
    stem: निम्नलिखित में से कौन राष्ट्रपति बनने से पूर्व लोकसभा अध्यक्ष रहे थे ?
    options:
      A: वी. वी. गिरी
      B: ज्ञानी जैल सिंह
      C: ए. पी. जे. अब्दुल कलाम
      D: नीलम संजीवा रेड्डी
    answer: D
    explanation: Neelam Sanjiva Reddy was Lok Sabha Speaker (1967-69, 1977) before becoming President in 1977.
  - slug: bpsc-70-q020
    difficulty: medium
    stem: “करो या मरो” का नारा किसने और कब दिया ?
    options:
      A: सुभाषचंद्र बोस ने भारत छोड़ों आंदोलन के दौरान
      B: जवाहर लाल नेहरू ने असहयोग आंदोलन के दौरान
      C: गाँधीजी ने भारत छोड़ों आंदोलन के दौरान
      D: उपरोक्त में एक से अधिक
    answer: C
    explanation: Gandhiji gave the call 'Do or Die' in his Quit India speech at Gowalia Tank, Bombay, on 8 August 1942.
  - slug: bpsc-70-q021
    difficulty: medium
    stem: समुद्र-तल केबल आधारित चेन्नई-अंडमान और निकोबार (CANI) परियोजना का उद्घाटन और राष्ट्र को समर्पण प्रधानमंत्री श्री नरेंद्र मोदी द्वारा कब किया गया ?
    options:
      A: 10 अगस्त, 2019
      B: 15 अगस्त, 2022
      C: 10 अगस्त, 2020
      D: 26 जनवरी, 2023
    answer: C
    explanation: PM Modi inaugurated the Chennai-Andaman & Nicobar submarine optical fibre cable on 10 August 2020.
  - slug: bpsc-70-q022
    difficulty: medium
    stem: “न्यू लैम्पस फॉर द ओल्ड” किसने लिखा है ?
    options:
      A: सुरेन्द्रनाथ
      B: अरविन्दो घोष
      C: मोतीलाल घोष
      D: उपरोक्त में एक से अधिक
    answer: B
    explanation: Aurobindo Ghosh wrote the series 'New Lamps for Old' in Indu Prakash (1893-94), criticising the moderate Congress.
  - slug: bpsc-70-q023
    difficulty: medium
    stem: किस लोकसभा सीट में, भारत के विशेष रूप से कमजोर जनजातीय समूहों (पीवीटीजी) में से एक, शोम्पेन जनजाति ने पहली बार अप्रैल 2024 में मतदान के अपने लोकतांत्रिक अधिकार का प्रयोग किया ?
    options:
      A: विजयनगरम, आंध्र प्रदेश
      B: त्रिपुरा पूर्व
      C: अंडमान और निकोबार
      D: तुरा
    answer: C
    explanation: The Shompen of Great Nicobar voted for the first time in the Andaman and Nicobar Islands Lok Sabha seat in April 2024.
  - slug: bpsc-70-q024
    difficulty: medium
    stem: लगभग 200 वर्षों तक तटस्थ रहने के बाद, मार्च 2024 में निम्नलिखित में से कौन-सा देश आधिकारिक तौर पर नाटो में शामिल हो गया ?
    options:
      A: उत्तर मैसेडोनिया
      B: स्वीडन
      C: फिनलैंड
      D: आइसलैंड
    answer: B
    explanation: Sweden, neutral since the Napoleonic era, became NATO's 32nd member on 7 March 2024 (Finland joined in 2023).
  - slug: bpsc-70-q025
    difficulty: medium
    stem: किस मीटर का उपयोग वाहन द्वारा तय की गई दूरी को मापने के लिए किया जाता है । ______ के रूप में जाना जाता है ।
    options:
      A: स्पीडोमीटर
      B: एमीटर
      C: ओडो मीटर
      D: क्रोनोमीटर
    answer: C
    explanation: An odometer records the distance travelled by a vehicle; a speedometer shows speed.
  - slug: bpsc-70-q026
    difficulty: medium
    stem: मुस्लिम लीग ने “प्रत्यक्ष कार्यवाही दिवस” कब मनाया ?
    options:
      A: 14 अगस्त 1946
      B: 15 अगस्त 1947
      C: 16 अगस्त 1946
      D: उपरोक्त में एक से अधिक
    answer: C
    explanation: The Muslim League observed Direct Action Day on 16 August 1946, leading to the Calcutta killings.
  - slug: bpsc-70-q027
    difficulty: medium
    stem: 2023 में मोबाईल फोन के निर्माण में भारत की स्थिति क्या है ?
    options:
      A: 2 रा
      B: 10 वां
      C: 4 था
      D: 15 वां
    answer: A
    explanation: India became the world's second-largest mobile phone manufacturer, after China.
  - slug: bpsc-70-q028
    difficulty: medium
    stem: 42वें संशोधन द्वारा कौन-से दो शब्द प्रस्तावना में जोडे गए ?
    options:
      A: गणराज्य एवं धर्मनिरपेक्ष
      B: प्रजातान्त्रिक एवं समाजवादी
      C: धर्मनिरपेक्ष एवं समाजवादी
      D: समाजवादी एवं प्रभुसत्तासम्पन्न
    answer: C
    explanation: The 42nd Amendment (1976) added 'Socialist', 'Secular' and 'Integrity' to the Preamble.
  - slug: bpsc-70-q029
    difficulty: medium
    stem: परमाणु की संरचना के लिए एक मॉडल प्रस्तावित करने वाले पहले व्यक्ति कौन थे ?
    options:
      A: रदरफोर्ड
      B: ई. गोल्डस्टिन
      C: जे. जे. थॉमसन
      D: नील्स बोहर
    answer: C
    explanation: J. J. Thomson proposed the first atomic model (the 'plum pudding' model, 1904), before Rutherford and Bohr.
  - slug: bpsc-70-q030
    difficulty: medium
    stem: सांख्यिकी और कार्यक्रम कार्यान्वयन मंत्रालय के औद्योगिक उत्पादन सूचकांक (IIP) के आंकड़ों के अनुसार, वित्तीय वर्ष 2023 में किन सूचकांकों में महत्वपूर्ण वृद्धि देखी गई ?
    options:
      A: उपभोक्ता वस्तु और पूंजी वस्तु
      B: उपभोक्ता वस्तु और बुनियादी ढाँचा/निर्माण वस्तु
      C: पूंजी वस्तु और बुनियादी ढाँचा/निर्माण वस्तु
      D: विनिर्माण और उपभोक्ता वस्तु
    answer: C
    explanation: IIP data for FY2023 showed the strongest growth in capital goods and infrastructure/construction goods, driven by public capex.
  - slug: bpsc-70-q031
    difficulty: medium
    stem: मंत्री परिषद की संख्या को किस संविधानिक संशोधन द्वारा, लोकसभा सदस्यों की संख्या का 15 प्रतिशत, तय किया गया ?
    options:
      A: 95वाँ संशोधन
      B: 92वाँ संशोधन
      C: 93वाँ संशोधन
      D: 91वाँ संशोधन
    answer: D
    explanation: The 91st Amendment (2003) capped the Council of Ministers at 15% of the Lok Sabha's strength (Art. 75(1A)).
  - slug: bpsc-70-q032
    difficulty: medium
    stem: अप्रैल 2024 में, संयुक्त राष्ट्र सुरक्षा परिषद के कितने सदस्यों ने फ़िलिस्तीन को संयुक्त राष्ट्र का पूर्ण सदस्य बनने की अनुमति देने के प्रस्ताव को या तो अस्वीकार कर दिया या मतदान से अनुपस्थित रहे ?
    options:
      A: "2"
      B: "6"
      C: "5"
      D: "3"
    answer: D
    explanation: On 18 April 2024 the resolution got 12 votes; the USA vetoed and the UK and Switzerland abstained, 3 members in all.
  - slug: bpsc-70-q033
    difficulty: medium
    stem: रुचिरा कंबोज, जो संयुक्त राष्ट्र में भारतीय राजदूत बनने वाली पहली महिला थी, जो हाल ही में सेवानिवृत्त हुई, के बारे में निम्नलिखित में से कौन-सा सत्य है ?
    options:
      A: वह विश्व मामलों की भारतीय परिषद की सदस्य थी
      B: वह नीति आयोग की सदस्य थी
      C: वह संयुक्त राज्य अमेरिका में पहली महिला भारतीय राजदूत थी
