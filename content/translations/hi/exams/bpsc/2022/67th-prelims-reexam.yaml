questions:
  - slug: bpsc-67re-q001
    difficulty: medium
    stem: 1946 ई० में गठित अंतरिम सरकार के मंत्रिमण्डल में श्रम विभाग किसे सौंपा गया था?
    options:
      A: सैयद अली ज़हीर
      B: जगजीवन राम
      C: डॉ० राजेन्द्र प्रसाद
      D: डॉ० अनुग्रह नारायण सिंह
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Jagjivan Ram held the Labour portfolio in the Interim Government formed on 2 September 1946.
  - slug: bpsc-67re-q002
    difficulty: medium
    stem: 1942 ई० में, किस त्योहार के अवसर पर जयप्रकाश नारायण हजारीबाग जेल से निकल भागे?
    options:
      A: दीपावली
      B: बैसाखी
      C: होली
      D: दशहरा
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: JP and five companions scaled the walls of Hazaribagh Central Jail on Deepawali night, 9 November 1942.
  - slug: bpsc-67re-q003
    difficulty: medium
    stem: डॉ० राजेन्द्र प्रसाद को संविधान सभा का सभापति चुना गया
    options:
      A: दिसम्बर 1946 ई० में
      B: सितम्बर 1946 ई० में
      C: अक्तूबर 1946 ई० में
      D: नवम्बर 1946 ई० में
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Dr. Rajendra Prasad was elected permanent Chairman (President) of the Constituent Assembly on 11 December 1946.
  - slug: bpsc-67re-q004
    difficulty: medium
    stem: "'सीमान्त गाँधी' के नाम से कौन जाने जाते हैं?"
    options:
      A: अब्दुल गफ्फार खाँ
      B: एम० ए० जिन्ना
      C: शौकत अली
      D: अबुल कलाम आज़ाद
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Khan Abdul Ghaffar Khan, leader of the Khudai Khidmatgars in the NWFP, was called 'Frontier Gandhi'.
  - slug: bpsc-67re-q005
    difficulty: medium
    stem: झाँसी की रानी लक्ष्मीबाई की मृत्यु कहाँ पर हुई थी?
    options:
      A: झाँसी
      B: लखनऊ
      C: कानपुर
      D: ग्वालियर
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Rani Laxmibai fell fighting the British at Kotah-ki-Serai near Gwalior on 18 June 1858.
  - slug: bpsc-67re-q006
    difficulty: medium
    stem: बंगाल विभाजन के विषय में किसने कहा था, "विभाजन हमारे ऊपर बम की तरह गिरा"?
    options:
      A: चित्तरंजन दास
      B: सुरेन्द्रनाथ बनर्जी
      C: गोपाल कृष्ण गोखले
      D: बिपिनचन्द्र पाल
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Surendranath Banerjee wrote that the partition announcement 'fell like a bombshell'.
  - slug: bpsc-67re-q007
    difficulty: medium
    stem: सरदार ऊधम सिंह ने किसे मारा था?
    options:
      A: सॉन्डर्स
      B: जनरल डायर
      C: कर्जन वायली
      D: माइकल ओ-ड्वायर
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Udham Singh shot Sir Michael O'Dwyer, Punjab's Lt. Governor at the time of Jallianwala Bagh, in London in 1940.
  - slug: bpsc-67re-q008
    difficulty: medium
    stem: "'बारदोली सत्याग्रह' का सफल नेतृत्व किसने किया?"
    options:
      A: जवाहरलाल नेहरू
      B: वल्लभभाई पटेल
      C: मोतीलाल नेहरू
      D: जे० बी० कृपलानी
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Vallabhbhai Patel led the 1928 Bardoli Satyagraha and earned the title 'Sardar'.
  - slug: bpsc-67re-q009
    difficulty: medium
    stem: इनमें से कौन 1946 ई० में भारत भेजे गए कैबिनेट मिशन का एक सदस्य **नहीं** था?
    options:
      A: लॉर्ड पेथिक लॉरेन्स
      B: सर स्टैफोर्ड क्रिप्स
      C: रैम्ज़े मैक्डोनाल्ड
      D: ए० वी० अलेक्जेन्डर
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: The Cabinet Mission comprised Pethick-Lawrence, Stafford Cripps and A. V. Alexander; Ramsay MacDonald was not a member.
  - slug: bpsc-67re-q010
    difficulty: medium
    stem: प्रसिद्ध 'गाँधी-इरविन समझौता' किस वर्ष हुआ था?
    options:
      A: 1932 ई०
      B: 1929 ई०
      C: 1930 ई०
      D: 1931 ई०
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: The Gandhi-Irwin Pact was signed on 5 March 1931.
  - slug: bpsc-67re-q011
    difficulty: medium
    stem: भारतीय राष्ट्रीय काँग्रेस ने किस सत्र में पूर्ण स्वाधीनता का प्रस्ताव पारित किया था?
    options:
      A: 1931 ई०, कराची
      B: 1920 ई०, नागपुर
      C: 1924 ई०, बेलगाँव
      D: 1929 ई०, लाहौर
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: The Purna Swaraj resolution was passed at the Lahore Session of December 1929 under Nehru.
  - slug: bpsc-67re-q012
    difficulty: medium
    stem: सुभाष चन्द्र बोस ने निकोबार द्वीप को नया नाम _____ दिया था।
    options:
      A: नवोदय द्वीप
      B: स्वराज द्वीप
      C: शहीद द्वीप
      D: बलिदान द्वीप
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: B
    explanation: Bose renamed the Andaman as 'Shaheed' and the Nicobar as 'Swaraj' islands in 1943.
  - slug: bpsc-67re-q013
    difficulty: medium
    stem: फरवरी 1922 ई० में पुलिस चौकी में आग लगाने की घटना से सम्बन्धित 'चौरी चौरा' किस राज्य में है?
    options:
      A: उत्तर प्रदेश
      B: राजस्थान
      C: मध्य प्रदेश
      D: बिहार
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Chauri Chaura is in Gorakhpur district, Uttar Pradesh.
  - slug: bpsc-67re-q014
    difficulty: medium
    stem: खुदीराम बोस ने किस स्थान पर किंग्सफोर्ड की हत्या का प्रयास किया था?
    options:
      A: गया
      B: पटना
      C: दरभंगा
      D: मुजफ्फरपुर
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Khudiram Bose and Prafulla Chaki attacked a carriage they took to be Kingsford's at Muzaffarpur in 1908.
  - slug: bpsc-67re-q015
    difficulty: medium
    stem: "'आज़ाद दस्ता' बिहार में किस आन्दोलन के दौरान सक्रिय रहा?"
    options:
      A: भारत छोड़ो आन्दोलन
      B: चंपारण सत्याग्रह
      C: असहयोग आन्दोलन
      D: सविनय अवज्ञा आन्दोलन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Azad Dasta was the underground guerrilla wing organised by JP during the Quit India Movement.
  - slug: bpsc-67re-q016
    difficulty: medium
    stem: 100 और 500 के बीच कितनी संख्याएँ 4, 5 और 6 से विभाज्य हैं?
    options:
      A: "8"
      B: "5"
      C: "6"
      D: "7"
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: LCM of 4, 5, 6 is 60; multiples between 100 and 500 are 120, 180, ..., 480, i.e. 7 numbers.
  - slug: bpsc-67re-q017
    difficulty: medium
    stem: "70 कि० ग्रा० के मिश्रण में बालू और सीमेंट का अनुपात 4 : 1 है। मिश्रण में कितना बालू और मिला दिया जाय कि उसमें बालू और सीमेंट का अनुपात 6 : 1 हो जाय?"
    options:
      A: 32 कि० ग्रा०
      B: 24 कि० ग्रा०
      C: 28 कि० ग्रा०
      D: 30 कि० ग्रा०
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Sand 56 kg, cement 14 kg; for 6:1 sand must be 84 kg, so add 28 kg.
  - slug: bpsc-67re-q018
    difficulty: medium
    stem: ₹ 150 प्रति दर्जन की दर से सन्तरे बेचने पर शशि को 25% की हानि होती है। 20% का लाभ पाने के लिए उसे उन्हें किस दर से बेचना चाहिए?
    options:
      A: ₹ 250 प्रति दर्जन
      B: ₹ 220 प्रति दर्जन
      C: ₹ 230 प्रति दर्जन
      D: ₹ 240 प्रति दर्जन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: SP 150 = 75% of CP, so CP = 200; 20% profit needs SP = 240 per dozen.
  - slug: bpsc-67re-q019
    difficulty: medium
    stem: एक समचतुर्भुज के विकर्णों की लम्बाइयाँ 10 से० मी० और 24 से० मी० हैं। इसका परिमाप है
    options:
      A: 60 से० मी०
      B: 48 से० मी०
      C: 52 से० मी०
      D: 56 से० मी०
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Half-diagonals 5 and 12 give side 13 cm; perimeter = 4 x 13 = 52 cm.
  - slug: bpsc-67re-q020
    difficulty: medium
    stem: 140 मीटर लम्बी रेलगाड़ी 60 कि० मी०/घण्टा की चाल से जा रही है और एक कुत्ता उसी दिशा में रेलगाड़ी के समान्तर 18 कि० मी०/घण्टा की चाल से दौड़ रहा है। रेलगाड़ी, कुत्ते को पार कर लेगी
    options:
      A: 12½ सेकण्ड में
      B: 10 सेकण्ड में
      C: 11 सेकण्ड में
      D: 12 सेकण्ड में
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Relative speed 42 km/h = 35/3 m/s; time = 140 / (35/3) = 12 s.
  - slug: bpsc-67re-q021
    difficulty: medium
    stem: एक घड़ी सुबह ठीक 6 बजे सेट की जाती है। यह घड़ी 24 घण्टे में 10 मिनट आगे बढ़ जाती है। जब दूसरे दिन यह घड़ी 11 बजे पूर्वाह्न इंगित करती है, तो सही समय क्या होगा?
    options:
      A: पूर्वाह्न 10 बजकर 54 मिनट
      B: पूर्वाह्न 10 बजे
      C: पूर्वाह्न 10 बजकर 48 मिनट
      D: पूर्वाह्न 10 बजकर 50 मिनट
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Clock shows 29 h elapsed; true time = 29 x 24/(24 1/6) = 28.8 h = 28 h 48 min after 6 a.m., i.e. 10:48 a.m.
  - slug: bpsc-67re-q022
    difficulty: medium
    stem: 5 और 6 बजे के बीच किस समय घड़ी की दोनों सुइयाँ एक साथ होंगी?
    options:
      A: 5 बजकर 28 मिनट
      B: 5 बजकर 26 मिनट
      C: 5 बजकर 27 मिनट
      D: 5 बजकर 27 3/11 मिनट
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Hands coincide at (60/11) x 5 = 27 3/11 minutes past 5.
  - slug: bpsc-67re-q023
    difficulty: medium
    stem: अनिल और सुमन मिलकर किसी काम को 12 दिनों में कर सकते हैं, जिसे अनिल अकेला 20 दिनों में कर सकता है। यदि सुमन को अकेले यह काम करना पड़े, तो वह लेगा
    options:
      A: 30 दिन
      B: 27 दिन
      C: 28 दिन
      D: 29 दिन
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Suman's rate = 1/12 - 1/20 = 1/30, so 30 days.
  - slug: bpsc-67re-q024
    difficulty: medium
    stem: 55 विद्यार्थियों की एक कक्षा में, 34 को क्रिकेट खेलना पसन्द है और 26 को बैडमिंटन खेलना पसन्द है। साथ ही,, प्रत्येक विद्यार्थी दो खेलों में से कम-से-कम एक खेल खेलना पसन्द करता है। कितने विद्यार्थी क्रिकेट और बैडमिंटन दोनों खेलना पसन्द करते हैं?
    options:
      A: "6"
      B: "3"
      C: "4"
      D: "5"
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: D
    explanation: Both = 34 + 26 - 55 = 5.
  - slug: bpsc-67re-q025
    difficulty: medium
    stem: वे दो प्राकृतिक संख्याएँ कौन-सी हैं, जिनका गुणनफल 2400 है और जिनके वर्गों का योगफल 5200 है?
    options:
      A: 60, 40
      B: 120, 20
      C: 80, 30
      D: 75, 32
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: 60 x 40 = 2400 and 3600 + 1600 = 5200.
  - slug: bpsc-67re-q026
    difficulty: medium
    stem: पौधे अपना पोषक तत्त्व मुख्यतया किससे प्राप्त करते हैं?
    options:
      A: मृदा
      B: पर्णहरित
      C: वायुमंडल
      D: प्रकाश
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Plants absorb their mineral nutrients mainly from the soil through roots.
  - slug: bpsc-67re-q027
    difficulty: medium
    stem: पाइन, फर, स्प्रुस, सेडार, लार्च एवं साइप्रस आदि मशहूर लकड़ी उत्पादक पौधों में से, बहुत से भारत के पहाड़ी क्षेत्रों में भी पाये जाते हैं। ये सभी क्या कहलाते हैं?
    options:
      A: द्विबीजपत्री
      B: आवृतबीजी
      C: अनावृतबीजी
      D: एकबीजपत्री
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Pine, fir, spruce, cedar, larch and cypress are conifers, i.e. gymnosperms.
  - slug: bpsc-67re-q028
    difficulty: medium
    stem: निम्न जोड़ों में से कौन-सा जोड़ा सही सुमेलित है?
    options:
      A: मलेरिया—क्लोरोक्वीन
      B: स्कर्वी—थायमीन
      C: ट्यूबरकुलोसिस—ए० टी० एस०
      D: टिटेनस—बी० सी० जी०
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: A
    explanation: Chloroquine is an antimalarial; scurvy is vitamin C deficiency, BCG is for TB and ATS for tetanus.
  - slug: bpsc-67re-q029
    difficulty: medium
    stem: लाल रक्त कणिकाविहीन जन्तु है
    options:
      A: मोर
      B: मेंढक
      C: केंचुआ
      D: सर्प
      E: उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक
    answer: C
    explanation: Earthworm haemoglobin is dissolved in plasma; it has no red blood cells.
  - slug: bpsc-67re-q030
