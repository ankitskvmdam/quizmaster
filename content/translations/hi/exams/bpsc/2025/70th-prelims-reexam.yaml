slug: 70th-prelims-reexam
title: बीपीएससी 70वीं प्रारंभिक परीक्षा (पुनर्परीक्षा)
date: 2025-01-04
label: Series I
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q5, Q13, Q79, Q91."
questions:
  - slug: bpsc-70re-q001
    difficulty: medium
    stem: दुनिया की सर्वाधिक प्राचीन सभ्यता कौन-सी है ?
    options:
      A: इजिप्सियन
      B: मेसापोटामिया (इराक)
      C: चाइनीज
      D: सिंधु घाटी
    answer: B
    explanation: Mesopotamian (Sumerian) civilization, from about 3500 BCE, is generally taken as the oldest; Egyptian and Indus civilizations came slightly later.
  - slug: bpsc-70re-q002
    difficulty: medium
    stem: दो तरलों A तथा B को मिलाने पर आदर्श तरल प्राप्त करने के लिए
    options:
      A: मिश्रण की तापीय धारिता शून्य होनी चाहिए
      B: मिश्रण की एन्ट्रॉपी शून्य होनी चाहिए
      C: मिश्रण की मुक्त ऊर्जा शून्य होनी चाहिए
      D: उपर्युक्त में से कोई नहीं
    answer: A
    explanation: An ideal solution obeys Raoult's law, so the enthalpy (and volume) of mixing is zero; entropy of mixing is positive and free energy of mixing is negative.
  - slug: bpsc-70re-q003
    difficulty: medium
    stem: |-
      निम्नलिखित शृंखला में ? के स्थान पर क्या आएगा ?

      117, 98, 80, 64, ?, 42
    options:
      A: "51"
      B: "55"
      C: "46"
      D: "48"
    answer: A
    explanation: The differences are 19, 18, 16, 13, 9 (they shrink by 1, 2, 3, 4), so 64 - 13 = 51 and 51 - 9 = 42.
  - slug: bpsc-70re-q004
    difficulty: medium
    stem: भारत सरकार अधिनियम 1935 के तहत बिहार विधान परिषद के प्रथम निर्वाचित सभापति कौन थे ?
    options:
      A: राजेंद्र प्रसाद
      B: राय बहादुर सतीश चंद्र
      C: राजीव रंजन सिन्हा
      D: उपरोक्त में से एक से अधिक
    answer: C
    explanation: Rajiv Ranjan Prasad Sinha is named as the first elected Chairman of the Bihar Legislative Council set up under the 1935 Act. (The council's own site says Rai Bahadur Satish Chandra Sinha was first appointed Chairman by the Governor, but the question asks who was elected.)
  - slug: bpsc-70re-q006
    difficulty: medium
    stem: भारत में किस क्षेत्र को वैश्वीकरण से सबसे अधिक लाभ हुआ है ?
    options:
      A: विनिर्माण
      B: कृषि
      C: सभी क्षेत्रों को समान रूप से लाभ हुआ है
      D: सेवाएँ
    answer: D
    explanation: After the 1991 liberalisation the services sector (IT, telecom, finance) gained most, and it now contributes over half of India's GDP.
  - slug: bpsc-70re-q007
    difficulty: medium
    stem: जब टीके के द्वारा शरीर में एन्टीजन प्रवेश करता है तब संक्रमण से लड़ने के लिए एन्टीबाडी की उत्पत्ति होती है
    options:
      A: केवल टी कोशिकाओं द्वारा
      B: बी एवं टी दोनों कोशिकाओं द्वारा
      C: केवल बी कोशिकाओं द्वारा
      D: उपर्युक्त में से कोई नहीं
    answer: C
    explanation: Antibodies are made only by B lymphocytes, which become plasma cells. T cells help them and kill infected cells but make no antibodies.
  - slug: bpsc-70re-q008
    difficulty: medium
    stem: केन्द्र और राज्य के मध्य विवादों का समाधान भारत के सर्वोच्च न्यायालय के किस क्षेत्राधिकार के अन्तर्गत आता है ?
    options:
      A: परामर्शी क्षेत्राधिकार
      B: संवैधानिक क्षेत्राधिकार
      C: प्रारम्भिक क्षेत्राधिकार
      D: अपीलीय क्षेत्राधिकार
    answer: C
    explanation: Article 131 gives the Supreme Court exclusive original jurisdiction over disputes between the Centre and the States.
  - slug: bpsc-70re-q009
    difficulty: medium
    stem: "किस अखबार ने भारतीय राष्ट्रीय काँग्रेस की संभावित भविष्य की भूमिका के बारे में निम्नलिखित लिखा : ‘... हमारे देश की भावी संसद का केंद्र है ... और यह हमारे देशवासियों के लिए अकल्पनीय परिमाण की भलाई की ओर ले जाएगा’ ?"
    options:
      A: द टाइम्स ऑफ इंडिया
      B: द इंडियन मिरर
      C: द न्यूयॉर्क टाइम्स
      D: उपरोक्त में से एक से अधिक
    answer: B
    explanation: The Indian Mirror welcomed the founding of the Congress in 1885 as the nucleus of a future Indian Parliament.
  - slug: bpsc-70re-q010
    difficulty: medium
    stem: |-
      निम्नलिखित आकृति में कितने त्रिभुज हैं ?

      *(चित्र: A large triangle with its apex at the top. Inside it, a line runs from the apex down to a point on the base (a little right of the middle of the base). A second straight line runs from the bottom-left vertex up to a point on the right side, crossing the first line about halfway down it. A third segment joins that crossing point to the bottom-right vertex. No other lines.)*
    options:
      A: "10"
      B: "8"
      C: "14"
      D: "12"
    answer: D
    explanation: "With apex A, base BC, D on the base, E on side AC and P where AD meets BE, the triangles are ABC, ABD, ABE, ABP, ACD, ACP, AEP, BCE, BCP, BDP, CDP and CEP: 12 in all."
  - slug: bpsc-70re-q011
    difficulty: medium
    stem: मध्य प्रदेश की सर्वाधिक लम्बी सीमा किस राज्य के साथ है ?
    options:
      A: उत्तर प्रदेश
      B: राजस्थान
      C: आंध्र प्रदेश
      D: महाराष्ट्र
    answer: A
    explanation: Uttar Pradesh shares Madhya Pradesh's longest boundary, along its whole northern and north-eastern side. Most sources say so, though a few name Maharashtra.
  - slug: bpsc-70re-q012
    difficulty: medium
    stem: 1917 में चंपारण सत्याग्रह का नेतृत्व किसने किया ?
    options:
      A: सरदार पटेल
      B: महात्मा गांधी
      C: सुभाष चंद्र बोस
      D: जवाहरलाल नेहरू
    answer: B
    explanation: Mahatma Gandhi led the Champaran Satyagraha of 1917 against the tinkathia indigo system, his first satyagraha in India.
  - slug: bpsc-70re-q014
    difficulty: medium
    stem: 2024 में किसे भारतरत्न दिया गया ?
    options:
      A: चन्द्रशेखर
      B: प्रणब मुखर्जी
      C: एम. एस. स्वामीनाथन
      D: सी. एन. आर. राव
    answer: C
    explanation: The 2024 Bharat Ratna went to M. S. Swaminathan, Karpoori Thakur, Charan Singh, P. V. Narasimha Rao and L. K. Advani. Pranab Mukherjee received it in 2019 and C. N. R. Rao in 2014.
  - slug: bpsc-70re-q015
    difficulty: medium
    stem: एक्स-रे का एक गुण यह है कि उन्हें विक्षेपित किया जा सकता है
    options:
      A: केवल चुम्बकीय क्षेत्र से
      B: विद्युत एवं चुम्बकीय दोनों क्षेत्र के साथ
      C: केवल विद्युत क्षेत्र से
      D: उपर्युक्त में से कोई नहीं
    answer: D
    explanation: X-rays are electromagnetic waves with no charge, so neither electric nor magnetic fields deflect them.
  - slug: bpsc-70re-q016
    difficulty: medium
    stem: |-
      नवीकरणीय ऊर्जा का अर्थ है

      1. सौर ऊर्जा से उत्पादित बिजली
      2. थर्मल प्लांट से उत्पादित बिजली
      3. कोयले से उत्पादित बिजली
      4. पवन ऊर्जा से उत्पादित बिजली

      नीचे दिए गए विकल्पों में से सही उत्तर चुनें :
    options:
      A: केवल 1, 2 और 3
      B: केवल 1 और 3
      C: केवल 1, 3 और 4
      D: केवल 1 और 4
    answer: D
    explanation: Solar and wind power are renewable. Thermal and coal-based power come from fossil fuels.
  - slug: bpsc-70re-q017
    difficulty: medium
    stem: "निम्नलिखित में से किस अधिनियम ने बिहार के एकसदनीय विधानमंडल को द्विसदनीय में बदल दिया : बिहार विधान सभा और बिहार विधान परिषद ?"
    options:
      A: भारत सरकार अधिनियम 1935
      B: भारत सरकार अधिनियम 1919
      C: भारत सरकार अधिनियम 1909
      D: उपरोक्त में से एक से अधिक
    answer: B
    explanation: |-
      **Disputed.** BPSC's final key says B; our check suggests A.

      The key gives B (Government of India Act 1919). This is doubtful: the 1935 Act made Bihar's legislature bicameral, with the Assembly and Council first meeting in 1937. (Wikipedia's Bihar Legislative Council page does credit the 1919 Act.)
  - slug: bpsc-70re-q018
    difficulty: medium
    stem: दक्षिणी अमेरिका महाद्वीप का सबसे प्राचीन पर्वत कौन-सा है ?
    options:
      A: एण्डीज पर्वत
      B: ब्राज़ील पर्वत
      C: टुमक-हूमक
      D: पैकारैमा
    answer: D
    explanation: The key gives Pacaraima, part of the Guiana Highlands on the Precambrian Guiana Shield. Mount Roraima's rocks there are among the oldest on Earth, whereas the Andes are young fold mountains.
  - slug: bpsc-70re-q020
    difficulty: medium
    stem: निम्नलिखित में से किस राज्य को लॉर्ड डलहौजी के हडप नीति के तहत शामिल **नहीं** किया गया था ?
    options:
      A: संभलपुर
      B: सतारा
      C: जयपुर
      D: नागपुर
    answer: C
    explanation: Satara (1848), Sambalpur (1849) and Nagpur (1854) were annexed under the Doctrine of Lapse. Jaipur was never annexed.
  - slug: bpsc-70re-q021
    difficulty: medium
    stem: बिहार के किस जिले में गेहूँ का उत्पादन सर्वाधिक होता है ?
    options:
      A: रोहतास
      B: पटना
      C: भोजपुर
      D: जहानाबाद
    answer: A
    explanation: Rohtas, in the canal-irrigated Sone command area, is Bihar's leading wheat-producing district.
  - slug: bpsc-70re-q022
    difficulty: medium
    stem: मैदान में खेले जाने वाला कौन-सा खेल दुनिया में सर्वाधिक लोक प्रिय है ?
    options:
      A: सोसर (फुटबाल)
      B: क्रिकेट
      C: वौलीबाल
      D: होकी
