  - slug: bpsc-70re-q023
    difficulty: medium
    stem: ‘पावर्टी एण्ड अन-ब्रिटिश रूल इन इण्डिया’ पुस्तक 1901 में किसके द्वारा प्रकाशित की गई थी ?
    options:
      A: आर. सी. दत्त
      B: फीरोजशाह मेहता
      C: एस. एन. बनर्जी
      D: दादाभाई नौरोजी
    answer: D
    explanation: Dadabhai Naoroji published 'Poverty and Un-British Rule in India' in 1901, setting out his drain theory.
  - slug: bpsc-70re-q024
    difficulty: medium
    stem: कलकत्ता में फोर्ट विलियम कॉलेज की स्थापना
    options:
      A: 1800 ई. में केवल भारतीय सिविल सेवकों को प्रशिक्षित करने के लिए की गई थी
      B: 1800 ई. में सिविल सेवकों को भारतीय भाषाओं में प्रशिक्षित करने हेतु की गई थी
      C: 1802 ई. में भारतीय संस्कृति और परंपरा को समझने के लिए की गई थी
      D: 1802 ई. में भारतीय भाषाओं में ऐतिहासिक शोध के लिए की गई थी
    answer: B
    explanation: Wellesley founded Fort William College in 1800 to train British civil servants in Indian languages and customs.
  - slug: bpsc-70re-q025
    difficulty: medium
    stem: अशोक के स्तम्भ पर कौन-सी लिपि लिखी गई है ?
    options:
      A: पाली
      B: संस्कृत
      C: सामरी
      D: ब्राह्मी
