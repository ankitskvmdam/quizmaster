  - slug: bpsc-71-q014
    difficulty: medium
    stem: नागी पक्षी अभयारण्य स्थल को महत्वपूर्ण पक्षी और जैव विविधता क्षेत्र (IBA) के रूप में किस संगठन ने मान्यता दी?
