slug: 71st-prelims
title: बीपीएससी 71वीं प्रारंभिक परीक्षा
date: 2025-09-13
label: Series E
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q11, Q69, Q75, Q96, Q118."
questions:
  - slug: bpsc-71-q001
    difficulty: medium
    stem: निम्नलिखित प्रश्न में, नीचे दिए हुए चार शब्दों में तीन में एक प्रकार की समानता है तथा चौथा भिन्न है। भिन्न शब्द को ज्ञात करें।
    options:
      A: सुक्ष्मदर्शी यन्त्र
      B: दूरबीन
      C: स्टैथोस्कोप (परिश्रावक)
      D: परिदर्शी यंत्र
    answer: C
    explanation: Microscope, telescope and periscope are optical instruments for seeing; a stethoscope is for listening.
  - slug: bpsc-71-q002
    difficulty: medium
    stem: SPRING को कोड में UNUFRC लिखा जाता है। उसी कोड भाषा में MOBILE शब्द को कैसे लिखेंगे?
    options:
      A: OMEFPA
      B: OMPGNC
      C: MPQSUL
      D: SEGRFT
    answer: A
    explanation: "Letter shifts are +2, −2, +3, −3, +4, −4 (S→U, P→N, R→U, I→F, N→R, G→C). Applied to MOBILE: M→O, O→M, B→E, I→F, L→P, E→A = OMEFPA."
  - slug: bpsc-71-q003
    difficulty: medium
    stem: मुकेश ने अपने मित्र से कहा, “रीता मेरे पुत्र की पत्नी की बेटी की माँ है।” मुकेश का रीता के साथ क्या रिश्ता है?
    options:
      A: पिता
      B: दामाद
      C: बेटा
      D: ससुर
    answer: D
    explanation: Mukesh’s son’s wife’s daughter is his granddaughter; her mother Rita is his son’s wife (daughter-in-law), so Mukesh is her father-in-law.
  - slug: bpsc-71-q004
    difficulty: medium
    stem: राम उत्तर दिशा में जाता है, फिर दाएं मुड़ता है, फिर दुबारा दाएं चलता है और अन्त में बाएं जाता है। अब राम किस दिशा में है?
    options:
      A: पूर्व
      B: दक्षिण
      C: उत्तर
      D: पश्चिम
    answer: A
    explanation: North → right = East → right = South → left = East.
  - slug: bpsc-71-q005
    difficulty: medium
    stem: अंग्रेजी वर्णमाला क्रम में लिखते हुए, निम्नलिखित में से कौन सा नाम सबसे अंत में आएगा?
    options:
      A: Mahinder
      B: Mohinder
      C: Mohender
      D: Mahendra
    answer: B
    explanation: "Alphabetical order: Mahendra, Mahinder, Mohender, Mohinder; Mohinder comes last."
  - slug: bpsc-71-q006
    difficulty: medium
    stem: 39 विद्यार्थियों की कक्षा में नितिन जोगिन्द्र से 7 रैंक (श्रेणी) आगे है। यदि जोगिन्द्र का रैंक अंतिम से 17 वाँ है तो नितिन का रैंक आरम्भ से कितना है?
    options:
      A: 17 वाँ
      B: 15 वाँ
      C: 18 वाँ
      D: 16 वाँ
    answer: D
    explanation: Joginder is 17th from the last in 39, i.e. 39 − 17 + 1 = 23rd from the start; Nitin, 7 ranks ahead, is 16th.
  - slug: bpsc-71-q007
    difficulty: medium
    stem: "यदि + का अर्थ ×, × का अर्थ −, ÷ का अर्थ + तथा − का अर्थ ÷, तब 175 − 25 ÷ 5 + 20 × 3 + 10 के समान है:"
    options:
      A: "77"
      B: "87"
      C: "140"
      D: "70"
    answer: A
    explanation: "After substitution: 175 ÷ 25 + 5 × 20 − 3 × 10 = 7 + 100 − 30 = 77."
  - slug: bpsc-71-q008
    difficulty: medium
    stem: राहुल की आयु सीमा से 3 गुणा अधिक है। चार वर्ष पूर्व लक्ष्मी की आयु राहुल से दुगणी थी। अगले चार वर्षों में राहुल 31 वर्ष का हो जाएगा। सीमा तथा लक्ष्मी की वर्तमान आयु क्या हैं?
    options:
      A: 10, 50
      B: 9, 52
      C: 9, 45
      D: 9, 50
    answer: D
    explanation: Rahul is 31 − 4 = 27, so Seema is 9. Four years ago Laxmi was 2 × 23 = 46, so she is 50 now.
  - slug: bpsc-71-q009
    difficulty: medium
    stem: |-
      निम्नलिखित विकल्पों से लुप्त संख्या ज्ञात करें।

      | 28 | 20 | 7 |
      |---|---|---|
      | 84 | ? | 12 |
      | 45 | 25 | 9 |

      *(चित्र: A 3×3 grid of numbers (rows: 28 20 7 / 84 ? 12 / 45 25 9), reproduced as a table.)*
    options:
      A: "30"
      B: "35"
      C: "20"
      D: "25"
    answer: B
    explanation: "In each row (first ÷ third) × 5 = middle: 28/7 × 5 = 20, 45/9 × 5 = 25, so 84/12 × 5 = 35."
  - slug: bpsc-71-q010
    difficulty: medium
    stem: RAIN को कोड में 8\$%6 लिखा जाता है तथा MORE को 7#8@ दर्शाया जाता है। उसी कोड भाषा में REMAIN को कैसे दर्शाया जाएगा?
    options:
      A: "@\\$86%7"
      B: "%7@%6#"
      C: 86@\$#7
      D: 8@7\$%6
    answer: D
    explanation: From the codes R=8, A=\$, I=%, N=6, M=7, E=@, so REMAIN = 8@7\$%6.
  - slug: bpsc-71-q012
    difficulty: medium
    stem: कोसी–मेची लिंक परियोजना से बिहार के कौन–कौन से जिलों को लाभ होगा?
    options:
      A: पटना, नालंदा, गया, सिवान
      B: दरभंगा, मुजफ्फरपुर, सीतामढ़ी, बेगूसराय
      C: अररिया, पूर्णिया, किशनगंज, कटिहार
      D: उपरोक्त में से एक से अधिक
    answer: C
    explanation: "The Kosi–Mechi intra-state link irrigates the Mahananda basin in north-east Bihar: Araria, Purnea, Kishanganj and Katihar."
  - slug: bpsc-71-q013
    difficulty: medium
    stem: किन भारतीय भाषाओं को शास्त्रीय भाषा का दर्जा प्राप्त है?
    options:
      A: तेलुगु
      B: मराठी
      C: बंगाली
      D: उपरोक्त में से एक से अधिक
