source: "SSC candidate response sheet with the official answer marked (via https://docs.aglasem.com/view/17030a92-9e92-11e9-9913-e470b83c4461). Left out (picture-only options or incomplete in the source): Q7, Q8, Q9, Q16, Q19, Q21, Q22, Q23, Q24, Q64."
questions:
  - slug: cgl-2017-08-21-s1-q001
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित शब्द को चुनिए।

      गाय : बछड़ा :: मुर्गी : ?
    options:
      A: चूज़ा
      B: मुर्गा
      C: अंडा
      D: मक्खी
    answer: A
    explanation: A calf is the young one of a cow; the young one of a hen is a chick.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q002
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित अक्षरों को चुनिए।

      DHL : AEI :: QUY : ?
    options:
      A: MQU
      B: NRV
      C: OSW
      D: PTX
    answer: B
    explanation: "Each letter moves 3 places back: D→A, H→E, L→I. So Q→N, U→R, Y→V gives NRV."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q003
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित संख्या को चुनिए।

      0.5 : 2 :: 0.125 : ?
    options:
      A: "6"
      B: "16"
      C: "8"
      D: "12"
    answer: C
    explanation: 2 is the reciprocal of 0.5; the reciprocal of 0.125 is 8.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q004
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम शब्द को चुनिए।
    options:
      A: पुस्तक
      B: पन्ना
      C: कलम
      D: डायरी
    answer: C
    explanation: A book, a page and a diary are made of paper and written on; a pen is the writing tool.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q005
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम अक्षरों को चुनिए।
    options:
      A: EGI
      B: MOQ
      C: UWY
      D: NLJ
    answer: D
    explanation: EGI, MOQ and UWY go forward in steps of 2; NLJ goes backward in steps of 2.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q006
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम संख्या को चुनिए।
    options:
      A: "47"
      B: "41"
      C: "59"
      D: "63"
    answer: D
    explanation: 47, 41 and 59 are prime numbers; 63 = 7 × 9 is not.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q010
    difficulty: medium
    stem: मीतू का जन्मदिन 8 मार्च बुधवार को है। उसी वर्ष ऋतु का जन्मदिन सप्ताह के किस दिन को आएगा यदि ऋतु का जन्म 10 जुलाई को हुआ है?
    options:
      A: सोमवार
      B: बुधवार
      C: शुक्रवार
      D: शनिवार
    answer: A
    explanation: From 8 March to 10 July is 23 + 30 + 31 + 30 + 10 = 124 days, which is 5 odd days. Wednesday + 5 = Monday.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q012
    difficulty: medium
    stem: |-
      निम्नलिखित विकल्पों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों का प्रयोग करके नहीं बनाया जा सकता:

      DUPLICATE
    options:
      A: PLATE
      B: DUCTILE
      C: LUCID
      D: TEAM
    answer: D
    explanation: DUPLICATE has no letter M, so TEAM cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q013
    difficulty: medium
    stem: यदि PRIMATE को किसी कोड में MOFJXQB लिखा जाता है, तो COW को उसी कोड में क्या लिखा जाएगा?
    options:
      A: ZLT
      B: EDC
      C: RFV
      D: TGB
    answer: A
    explanation: Each letter moves 3 places back (P→M, R→O, I→F, ...). So C→Z, O→L, W→T gives ZLT.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q014
    difficulty: medium
    stem: |-
      किसी कोड भाषा में, '+' का मतलब '×' है, '−' का मतलब '+' है, '×' का मतलब '÷' है और '÷' का मतलब '−' है। निम्नलिखित प्रश्न का उत्तर क्या है?

      11 + 50 − 150 ÷ 200 = ?
    options:
      A: "200"
      B: "500"
      C: "250"
      D: "50"
    answer: B
    explanation: "After swapping the signs: 11 × 50 + 150 − 200 = 550 + 150 − 200 = 500."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q015
    difficulty: medium
    stem: यदि 7×1=12; 5×4=2; 6×4=4; तो 7×4 = ? का मान ज्ञात कीजिये।
    options:
      A: "8"
      B: "6"
      C: "11"
      D: "28"
    answer: B
    explanation: "The rule is (a − b) × 2: 7×1 → 6 × 2 = 12, 5×4 → 1 × 2 = 2, 6×4 → 2 × 2 = 4. So 7×4 → 3 × 2 = 6."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q017
    difficulty: medium
    stem: एक व्यक्ति 7 कि.मी. पूर्व की ओर साइकिल चलाता है, फिर दक्षिण की ओर मुड़कर 12 कि.मी. साइकिल चलाता है, फिर पश्चिम की ओर मुड़कर 7 कि.मी. साइकिल चलाता है और फिर अपनी बाईं ओर मुड़कर 10 कि.मी. साइकिल चलाता है। वह अपनी प्रारंभिक स्थिति से अब कहां है?
    options:
      A: 22 कि.मी. दक्षिण
      B: 2 कि.मी. दक्षिण
      C: 22 कि.मी. पूर्व
      D: 2 कि.मी. पूर्व
    answer: A
    explanation: The 7 km east and 7 km west cancel. Turning left while heading west means heading south, so he is 12 + 10 = 22 km south.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q018
    difficulty: medium
    stem: |-
      प्रश्न में दो कथन दिये गये हैं जिसके आगे दो निष्कर्ष I और II निकाले गये हैं। आपको मानना है कि दोनो कथन सत्य है चाहे वह सामान्यत: ज्ञात तथ्यों से भिन्न प्रतीत होते हों। आपको निर्णय करना है कि दिए गए निष्कर्षों में से कौन-सा/कौन-से निश्चित रूप से कथन द्वारा सही निकाला जा सकता है/सकते हैं, यदि कोई हो।

      कथन 1: सभी स्टील लोहा है।  
      कथन 2: कोई लोहा ठोस नहीं है।

      निष्कर्ष I : कोई स्टील ठोस नहीं है।  
      निष्कर्ष II : कुछ लोहा स्टील है।
    options:
      A: केवल निष्कर्ष I सही है
      B: केवल निष्कर्ष II सही है
      C: दोनों निष्कर्ष I और II सही है
      D: ना तो निष्कर्ष I सही है ना ही निष्कर्ष II
    answer: C
    explanation: All steel is iron and no iron is solid, so no steel is solid (I). By conversion, "all steel is iron" gives "some iron is steel" (II). Both follow.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q020
    difficulty: medium
    stem: |-
      निम्नलिखित आकृति में, वर्ग एथलीट्स को दर्शाता है, त्रिभुज इंजीनियर्स को दर्शाता है, वृत्त पिताओं को दर्शाता है और आयत उद्यमियों को दर्शाता है। अक्षरों का कौन सा समूह उन एथलीट्स को दर्शाता है जो या तो उद्यमी हैं या पिता हैं?

      *(चित्र: Overlapping shapes: a triangle (A alone at its top, B where it overlaps the square), a square (C alone; D where it overlaps the circle), a long horizontal rectangle at bottom-left (G alone; F inside the square; E inside square, circle and rectangle; H inside rectangle and circle below the square), and a circle at right (I alone).)*
    options:
      A: F,E,D
      B: D,E,F,G,H,I
      C: G,H,I
      D: E,H
    answer: A
    explanation: The athletes (square) who are also fathers (circle) or entrepreneurs (rectangle) are in regions D, E and F.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्यूहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 और आव्यूह-II की 5 से 9 है। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदहारण के लिए 'Y' को 55, 87 आदि द्वारा दर्शाया जा सकता है तथा 'Z' को 14, 01 आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए शब्द 'VERY' के लिए समूह को पहचानना है।

      आव्यूह - I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | W | Z | G | T | D |
      | 1 | S | R | W | G | Z |
      | 2 | X | F | S | D | E |
      | 3 | Q | V | C | S | F |
      | 4 | A | T | Q | Q | A |

      आव्यूह - II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | Y | N | L | I | Y |
      | 6 | H | I | P | J | I |
      | 7 | B | K | O | N | O |
      | 8 | U | M | Y | B | P |
      | 9 | J | O | H | L | K |

      *(चित्र: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 01,43,21,78
      B: 31,24,11,87
      C: 11,20,66,85
      D: 88,56,43,20
    answer: B
    explanation: In option B, 31 = V, 24 = E, 11 = R and 87 = Y, which spells VERY.
    tags:
      - reasoning
