questions:
  - slug: cgl-2017-08-17-s2-q001
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित शब्द को चुनिए।

      कार्यालय : सहकर्मी :: घर : ?
    options:
      A: आराम
      B: काम
      C: दोस्त
      D: परिवार
    answer: D
    explanation: You meet colleagues at the office and family at home.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q002
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित अक्षरों को चुनिए।

      XVT : RPN :: LJH : ?
    options:
      A: FDB
      B: ECA
      C: KIG
      D: QOM
    answer: A
    explanation: "Each letter moves back 6 places: X→R, V→P, T→N. So L→F, J→D, H→B = FDB."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q003
    difficulty: medium
    stem: |-
      दिए गए विकल्पों में से संबंधित संख्या को चुनिए।

      0.04 : 0.2 :: 0.09 : ?
    options:
      A: "0.3"
      B: "0.6"
      C: "0.9"
      D: "2"
    answer: A
    explanation: "0.04 = 0.2², so the second term is the square root of the first: √0.09 = 0.3."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q004
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम शब्द को चुनिए।
    options:
      A: कुर्सी
      B: बैंच
      C: बिस्तर
      D: सोफा
    answer: C
    explanation: Chair, bench and sofa are for sitting; a bed is for sleeping.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q005
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम अक्षरों को चुनिए।
    options:
      A: CEG
      B: UXZ
      C: ORT
      D: ILN
    answer: A
    explanation: UXZ, ORT and ILN step forward by +3, +2. CEG steps by +2, +2, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q006
    difficulty: medium
    stem: दिए गए विकल्पों में से विषम संख्या को चुनिए।
    options:
      A: "75"
      B: "65"
      C: "82"
      D: "85"
    answer: C
    explanation: 75, 65 and 85 are multiples of 5; 82 is not.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q010
    difficulty: medium
    stem: दिवित का जन्मदिन शुक्रवार 30 जून को है। यदि समर का जन्म 15 नवंबर को हुआ था तो उसी वर्ष समर का जन्मदिन सप्ताह में किस दिन होगा?
    options:
      A: मंगलवार
      B: शुक्रवार
      C: बुधवार
      D: शनिवार
    answer: C
    explanation: From 30 June to 15 November is 31 + 31 + 30 + 31 + 15 = 138 days = 19 weeks + 5 days. Friday + 5 = Wednesday.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q012
    difficulty: medium
    stem: |-
      निम्नलिखित विकल्पों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों का प्रयोग करके नहीं बनाया जा सकता:

      RECLINES
    options:
      A: SINCE
      B: RELIC
      C: LINER
      D: SCARE
    answer: D
    explanation: RECLINES has no A, so SCARE cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q013
    difficulty: medium
    stem: यदि REGAINS को किसी कोड में QDFZHMR लिखा जाता है, तो PRY को उसी कोड में क्या लिखा जाएगा?
    options:
      A: BJX
      B: OQX
      C: LFT
      D: PSU
    answer: B
    explanation: Each letter moves back one place (R→Q, E→D, …), so PRY → OQX.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q014
    difficulty: medium
    stem: |-
      किसी कोड भाषा में, '+' का मतलब 'x' है, '-' का मतलब '+' है, 'x' का मतलब '÷' है और '÷' का मतलब '-' है। निम्नलिखित प्रश्न का उत्तर क्या है?

      45 x 5 + 2 - 20 = ?
    options:
      A: "17"
      B: "81"
      C: "38"
      D: "64"
    answer: C
    explanation: "After swapping the signs: 45 ÷ 5 × 2 + 20 = 18 + 20 = 38."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q015
    difficulty: medium
    stem: यदि 5@1=60; 12@8=200; 16@2=180; तो 16@10 = ? का मान ज्ञात कीजिये।
    options:
      A: "32"
      B: "11"
      C: "9"
      D: "260"
    answer: D
    explanation: "The rule is (a + b) × 10: (5 + 1) × 10 = 60, (12 + 8) × 10 = 200, (16 + 2) × 10 = 180. So (16 + 10) × 10 = 260."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q017
    difficulty: medium
    stem: दो महिलाएं A और B एक मॉल में खरीददारी कर रही हैं। वे एक ही बिंदु से शुरूआत करती हैं। A पश्चिम की ओर 150 मीटर तक चलती है, फिर अपनी बाईं ओर मुड़ जाती है और 160 मीटर तक चलती है। B पूर्व की ओर 140 मीटर तक चलती है, फिर दक्षिण की ओर मुड़ जाती है और 160 मीटर तक चलती है, फिर अपनी बाईं ओर मुड़ जाती है और 120 मीटर तक चलती है। A की स्थिति से अब B कहां पर है?
    options:
      A: 410 मीटर पश्चिम
      B: 410 मीटर पूर्व
      C: 170 मीटर पूर्व
      D: 170 मीटर पश्चिम
    answer: B
    explanation: A ends 150 m west and 160 m south. B ends 140 + 120 = 260 m east and 160 m south. On the same line, B is 150 + 260 = 410 m east of A.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q018
    difficulty: medium
    stem: |-
      प्रश्न में एक कथन दिया गया है जिसके आगे दो तर्क I और II दिए गये हैं। आपको मानना है कि कथन सत्य है चाहे वह सामान्यत: ज्ञात तथ्यों से भिन्न प्रतीत होता हो। आपको निर्णय करना है की दिए गए तर्कों में से कौन-सा/कौन-से तर्क मज़बूत हैं, यदि कोई हो।

      कथन: क्या सार्वजनिक स्थानों पर पान खाना दंडनीय होना चाहिए?

      तर्क I: हां, लोग पान खाने के बाद थूकते हैं और सार्वजनिक स्थानों को गंदा करते हैं।  
      तर्क II: नहीं, भारतीयों को पान खाना पसंद है।
    options:
      A: यदि केवल तर्क I मज़बूत है।
      B: यदि केवल तर्क II मज़बूत है।
      C: यदि दोनों तर्क I और II मज़बूत हैं।
      D: यदि ना तो तर्क I और ना ही तर्क II मजबूत है।
    answer: A
    explanation: Argument I gives a real public-hygiene reason. Argument II is only a matter of liking, so it is weak.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q020
    difficulty: medium
    stem: |-
      निम्नलिखित आकृति में, वर्ग दृष्टिमितिज्ञों को दर्शाता है, त्रिभुज चित्रकारों को दर्शाता है, वृत्त शाकाहारीयों को दर्शाता है और आयत पुरुषों को दर्शाता है। अक्षरों का कौन सा समूह चित्रकारों को दर्शाता है जो या तो पुरुष हैं या शाकाहारी हैं?

      *(चित्र: Overlapping shapes: a square and a triangle overlap; a circle at the lower left overlaps both; a long rectangle at the top right overlaps the top-right corner of the square. Letters: A in the square and rectangle only; G in the rectangle only; D in the square only (right of the triangle); C in the triangle and square only; B in the triangle, square and circle; E in the triangle and circle only; F in the circle only. No region is labelled H.)*
    options:
      A: D,F
      B: E,B
      C: H,G,F
      D: A,C,E
    answer: B
    explanation: Painters are in the triangle. The triangle overlaps the circle (vegetarians) in regions B and E; it does not reach the rectangle (men).
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्यूहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 और आव्यूह-II की 5 से 9 है। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए 'K' को 42, 34 आदि द्वारा दर्शाया जा सकता है तथा 'Z' को 96, 79 आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए गए शब्द 'ROAD' के लिए समूह को पहचानना है।

      आव्यूह - I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | L | K | A | F | H |
      | 1 | K | I | I | C | D |
      | 2 | J | E | E | E | F |
      | 3 | M | I | A | E | K |
      | 4 | M | B | K | C | G |

      आव्यूह - II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | Q | S | R | U | Z |
      | 6 | S | R | O | V | T |
      | 7 | O | U | V | S | Z |
      | 8 | V | Y | T | Y | S |
      | 9 | Y | Z | O | U | V |

      *(चित्र: Two 5 × 5 letter matrices (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: 24,14,67,76
      B: 30,22,86,56
      C: 66,67,02,14
      D: 13,43,56,86
    answer: C
    explanation: "R = 66, O = 67, A = 02, D = 14, all correct in option C. The other options fail at once (A: 24 = F; B: 30 = M; D: 13 = C)."
    tags:
      - reasoning
