    difficulty: medium
    stem: ΔPQR में, PS तथा PT क्रमशः ∠QPR तथा ∠QPS के द्विभाजक हैं। यदि ∠QPT = 30°, PT = 9 से.मी. तथा TR = 15 से.मी. है, तो ΔPTR का क्षेत्रफल (से.मी.² में) कितना होगा?
    options:
      A: "36"
      B: "54"
      C: "72"
      D: "216"
    answer: B
    explanation: ∠QPS = 60°, so ∠QPR = 120° and ∠TPR = 120 − 30 = 90°. Then PR = √(15² − 9²) = 12, and the area is ½ × 9 × 12 = 54 cm².
