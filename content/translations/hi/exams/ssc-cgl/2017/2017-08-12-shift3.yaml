    stem: (sec⁴ A – tan² A) – (tan⁴ A + sec² A) का सरलीकृत मान क्या है?
    options:
      A: –1
      B: –1/2
      C: "0"
      D: "1"
    answer: C
    explanation: sec⁴A − tan⁴A = (sec²A + tan²A)(sec²A − tan²A) = sec²A + tan²A. Subtracting (tan²A + sec²A) leaves 0.
