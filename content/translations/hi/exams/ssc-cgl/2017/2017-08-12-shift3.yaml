questions:
  - slug: cgl-2017-08-12-s3-q001
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित शब्द को चुनिए।

      पुस्तक : पन्ने : : महाद्वीप : ?
    options:
      A: जल
      B: जंगल
      C: देशो
      D: भूमि
    answer: C
    explanation: A book is made up of pages; a continent is made up of countries.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q002
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित अक्षरों को चुनिए।

      JKLM : IIII : : PQRS : ?
    options:
      A: PPPP
      B: OOOO
      C: TTTT
      D: OOPP
    answer: B
    explanation: "Each letter moves back 1, 2, 3, 4 places: J−1, K−2, L−3, M−4 = IIII. So P−1, Q−2, R−3, S−4 = OOOO."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q003
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित संख्या को चुनिए।

      4 : 17 : : 7 : ?
    options:
      A: "49"
      B: "50"
      C: "51"
      D: "52"
    answer: B
    explanation: "The rule is n² + 1: 4² + 1 = 17, so 7² + 1 = 50."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q004
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम शब्द युग्म को चुनिए।
    options:
      A: "उदास : आशामय"
      B: "आनन्दित : अति आनन्दित"
      C: "ऊँचा : विशाल"
      D: "पगडंडी : पथमार्ग"
    answer: A
    explanation: "Happy : Ecstatic, High : Giant and Trail : Pathway are pairs of similar meaning (or degree). Sad : Hopeful are opposite in sense, so it is the odd pair."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q005
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम अक्षरों को चुनिए।
    options:
      A: FHJ
      B: LNQ
      C: JLN
      D: NPR
    answer: B
    explanation: FHJ, JLN and NPR step forward by +2, +2. In LNQ the steps are +2, +3, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q006
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम संख्या युग्म को चुनिए।
    options:
      A: 11 – 121
      B: 13 – 169
      C: 19 – 391
      D: 21 – 441
    answer: C
    explanation: 11² = 121, 13² = 169 and 21² = 441, but 19² = 361, not 391.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q007
    difficulty: medium
    stem: |-
      निम्नलिखित शब्दों को शब्दकोश में आने वाले क्रम के अनुसार लिखें।

      1. Feeble  
      2. From  
      3. Floor  
      4. Foam  
      5. Fluorescent
    options:
      A: "13542"
      B: "15342"
      C: "13524"
      D: "15324"
    answer: A
    explanation: "Dictionary order: Feeble, Floor, Fluorescent, Foam, From = 1, 3, 5, 4, 2."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q010
    difficulty: medium
    stem: एक व्यक्ति की और संकेत करते हुए रीतिका ने कहा, ''वह मेरे दादाजी के एकमात्र पुत्र का पुत्र है।'' रीतिका उस व्यक्ति से किस प्रकार संबंधित है?
    options:
      A: बुआ
      B: बहन
      C: माता
      D: पत्नी
    answer: B
    explanation: The only son of Ritika's grandfather is her father, so the man is her father's son, her brother. Ritika is his sister.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q011
    difficulty: medium
    stem: चार पुस्तकों में पुस्तक 1, पुस्तक 2 से दोगुनी भारी है। पुस्तक 3 का भार पुस्तक 2 के भार का आधा है। पुस्तक 4 का भार पुस्तक 2 की तुलना में 60 ग्राम अधिक है लेकिन पुस्तक 1 की तुलना में 60 ग्राम कम है। कौन सी पुस्तक सबसे भारी है?
    options:
      A: पुस्तक 1
      B: पुस्तक 2
      C: पुस्तक 3
      D: पुस्तक 4
    answer: A
    explanation: Let Book 2 = x. Then Book 1 = 2x and Book 4 = x + 60 = 2x − 60, so x = 120. Book 1 = 240 g is the heaviest.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q012
    difficulty: medium
    stem: |-
      दिए गए प्रश्न में, निम्नलिखित विकल्पों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों का प्रयोग करके नहीं बनाया जा सकता है।

      Improvement
    options:
      A: Rope
      B: Trim
      C: Important
      D: Prove
    answer: C
    explanation: IMPROVEMENT has no letter A, so 'Important' cannot be formed. Rope, Trim and Prove can.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q013
    difficulty: medium
    stem: एक विशिष्ट कोड भाषा में, "MASTER" को "682145" लिखा जाता है तथा "STAMP" को "21869" लिखा जाता है। इस कोड भाषा में "PASTE" को किस प्रकार लिखा जाएगा?
    options:
      A: "82145"
      B: "98214"
      C: "69218"
      D: "95184"
    answer: B
    explanation: "From the two codes: M=6, A=8, S=2, T=1, E=4, R=5, P=9. So PASTE = 9 8 2 1 4 = 98214."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q014
    difficulty: medium
    stem: |-
      यदि "K" का अर्थ "गुणा" है, "M" का अर्थ "घटाव" है, "J" का अर्थ "जोड़" है तथा "L" का अर्थ "भाग" है, तो

      44 M 24 K 56 L 14 J 60 = ?
    options:
      A: "16"
      B: "72"
      C: "8"
      D: "140"
    answer: C
    explanation: "Replacing the letters: 44 − 24 × 56 ÷ 14 + 60 = 44 − 96 + 60 = 8."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q015
    difficulty: medium
    stem: यदि 27 (15) 33 तथा 41 (13) 53 हो, तो 26 (A) 35 में, 'A' का मान क्या है?
    options:
      A: "16"
      B: "13"
      C: "14"
      D: "11"
    answer: A
    explanation: "The middle number is the sum of all the digits: 2+7+3+3 = 15 and 4+1+5+3 = 13. So 2+6+3+5 = 16."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q016
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से प्रश्न चिन्ह (?) के स्थान पर आने वाली संख्या को चुनिए।

      | 3 | 2 |
      |---|---|
      | 5 | 4 |
      | 1 | 7 |

      | 1 | 2 |
      |---|---|
      | 7 | 6 |
      | 4 | 2 |

      | 2 | 1 |
      |---|---|
      | 3 | 11 |
      | 1 | ? |

      *(चित्र: Three separate 3-row × 2-column number grids printed side by side (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: "2"
      B: "4"
      C: "6"
      D: "8"
    answer: B
    explanation: "In each grid the six numbers add up to 22: 3+2+5+4+1+7 = 22 and 1+2+7+6+4+2 = 22. So 2+1+3+11+1+? = 22, which gives 4."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q017
    difficulty: medium
    stem: |-
      दी गई आकृति में कितने त्रिभुज हैं?

      *(चित्र: A square with both its diagonals drawn. On each of its four sides an isosceles triangle points outward (up, down, left, right), forming a four-pointed star. A vertical line runs from the top apex to the bottom apex and a horizontal line runs from the left apex to the right apex, both through the centre of the square.)*
    options:
      A: "28"
      B: "36"
      C: "40"
      D: "48"
    answer: B
    explanation: The square with both diagonals and both midlines holds 16 triangles. Each outward triangle adds 5 more (its two halves, itself, and two triangles joining its apex to a corner and the centre), so 16 + 4 × 5 = 36.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q018
    difficulty: medium
    stem: |-
      नीचे दिए गए प्रत्येक प्रश्न में कुछ कथन और उनके बाद उन कथनों पर आधारित कुछ निष्कर्ष दिए गए हैं, हालांकि उनमें सामान्य ज्ञात तथ्यों से भिन्नता हो सकती है। सभी निष्कर्ष पढ़ें और फिर निर्धारित करें कि दिए गए कौन से निष्कर्ष दिए गए कथनों के आधार पर युक्तिसंगत हैं।

      कथनः

      I. कुछ पेन पेसिंल हैं।  
      II. कुछ पेन रबर हैं।

      निष्कर्षः

      I. कुछ पेसिंल रबर हैं।  
      II. सभी रबर पेन हैं।
    options:
      A: केवल निष्कर्ष (I) सही है।
      B: केवल निष्कर्ष (II) सही है।
      C: दोनों ही निष्कर्ष सही है।
      D: न तो निष्कर्ष (I) न ही निष्कर्ष (II) सही है।
    answer: D
    explanation: Two 'some' statements with the middle term 'pens' give no definite link between pencils and erasers, and 'some pens are erasers' does not mean all erasers are pens. Neither conclusion follows.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q019
    difficulty: medium
    stem: |-
      नीचे एक घन की दो अवस्थाएँ दर्शायी गयी है। प्रतीक चिह्न ‘δ’ के विपरीत फलक पर कौन सा प्रतीक चिह्न आयेगा?

      *(चित्र: Two views of a cube. View 1: top δ, front ∞, right α. View 2: top β, front θ, right α.)*
    options:
      A: δ
      B: θ
      C: β या θ
      D: β
    answer: D
    explanation: α stays on the right in both views, so the cube has only been rolled about the α axis. A roll that brings two new faces (β, θ) to top and front is a half-turn, which puts the old bottom on top. So β is on the face opposite δ.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q020
    difficulty: medium
    stem: |-
      दी गई आकृति में, कितने गत्ते के डिब्बे जो सफेद नहीं हैं?

      *(चित्र: Venn-type figure: a triangle labelled ‘Cardboard / गत्ता’, a circle labelled ‘Box / डिब्बा’ and a rectangle labelled ‘White / सफेद’. Numbers: 12 in triangle only; 6 in triangle and circle only; 4 in circle only; 7 in all three; 10 in circle and rectangle only; 9 in triangle and rectangle only; 5 in rectangle only (left part); 8 in rectangle only (right corner).)*
    options:
      A: "6"
      B: "13"
      C: "7"
      D: "9"
    answer: A
    explanation: Cardboard boxes are the region shared by the triangle and the circle. The part outside the White rectangle holds 6.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्यूहों में है। **आव्यूह-I** के स्तम्भ और पंक्ति की संख्या 0 से 4 है और **आव्यूह-II** की 5 से 9। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए ‘E’ को 23, 41, आदि द्वारा दर्शाया जा सकता है तथा ‘P’ को 56, 97, आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए गए शब्द “GREAT” के लिए समूह को पहचानना है।

      आव्यूह-I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | E | R | G | L | O |
      | 1 | G | L | E | O | R |
      | 2 | R | O | L | E | G |
      | 3 | L | G | O | R | E |
      | 4 | O | E | R | G | L |

      आव्यूह-II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | M | P | S | T | A |
      | 6 | P | S | T | A | M |
      | 7 | T | M | A | S | P |
      | 8 | S | A | M | P | T |
      | 9 | A | T | P | M | S |

      *(चित्र: Two 5 × 5 letter matrices (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: 10, 14, 00, 59, 97
      B: 31, 33, 41, 67, 76
      C: 43, 01, 23, 95, 89
      D: 24, 42, 11, 86, 95
    answer: C
    explanation: "G = 43, R = 01, E = 23, A = 95, T = 89 are all correct in option C. Every other option has a wrong letter (A: 97 = P; B: 67 = T; D: 11 = L)."
    tags:
      - reasoning
