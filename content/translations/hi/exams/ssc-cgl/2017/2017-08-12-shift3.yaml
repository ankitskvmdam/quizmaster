  - slug: cgl-2017-08-12-s3-q069
    difficulty: medium
    stem: "[2/(cot A – tan A)] का सरलीकृत मान क्या है?"
    options:
      A: sin A cos A
      B: tan 2A
      C: tan² A
      D: sin² A cos² A
    answer: B
    explanation: 2/(cot A − tan A) = 2 sin A cos A/(cos²A − sin²A) = sin 2A/cos 2A = tan 2A.
