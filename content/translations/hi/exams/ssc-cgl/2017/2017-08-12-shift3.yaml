  - slug: cgl-2017-08-12-s3-q070
    difficulty: medium
    stem: √[(cosec A – 1)/(cosec A + 1)] का सरलीकृत मान क्या है?
    options:
      A: cosec A
      B: sec A – tan A
      C: cosec ²A
      D: tan A – cosec A
    answer: B
    explanation: (cosec A − 1)/(cosec A + 1) = (1 − sin A)/(1 + sin A). Its square root is (1 − sin A)/cos A = sec A − tan A.
