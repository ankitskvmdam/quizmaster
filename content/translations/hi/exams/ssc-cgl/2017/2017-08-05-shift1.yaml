    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q013
    difficulty: medium
    stem: एक विशिष्ट कोड भाषा में, "BAD" को "7" लिखा जाता है तथा "SAP" को "9" लिखा जाता है। इस कोड भाषा में "BAN" को किस प्रकार लिखा जाएगा?
    options:
      A: "8"
      B: "3"
      C: "4"
      D: "6"
    answer: A
    explanation: "Add the letter positions and then the digits: BAD = 2+1+4 = 7, SAP = 19+1+16 = 36 → 9. BAN = 2+1+14 = 17 → 1+7 = 8."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q014
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में, किन्ही दो गणितीय संक्रियाओं को आपस में परस्पर बदलकर दिए गए समीकरण को सही कीजिए।

      9 x 3 + 8 ÷ 4 – 7 = 28
    options:
      A: x तथा –
      B: + तथा –
      C: ÷ तथा +
      D: x तथा ÷
    answer: D
    explanation: Swapping × and ÷ gives 9 ÷ 3 + 8 × 4 − 7 = 3 + 32 − 7 = 28.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q015
    difficulty: medium
    stem: |-
      यदि 4 * 5 % 3 = 8000 तथा 2 * 3 % 2 = 36 हो, तो

      4 * 3 % 3 = ?
    options:
      A: "432"
      B: "1728"
      C: "36"
      D: "144"
    answer: B
    explanation: "a * b % c means (a × b)^c: (4×5)³ = 8000 and (2×3)² = 36. So (4×3)³ = 1728."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q016
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से प्रश्न चिन्ह (?) के स्थान पर आने वाली संख्या को चुनिए।

      | आकृति | ऊपर | बाएँ | केंद्र | दाएँ | नीचे |
      |---|---|---|---|---|---|
      | 1 | 3 | 2 | 31 | 1 | 5 |
      | 2 | 4 | 2 | 145 | 6 | 3 |
      | 3 | 2 | 1 | ? | 7 | 5 |

      *(चित्र: Three plus-shaped (cross) number figures printed as an image; each has a centre cell with cells above, left, right and below. Reproduced as a table.)*
    options:
      A: "43"
      B: "49"
      C: "59"
      D: "71"
    answer: D
    explanation: "Centre = (top × left) × (right × bottom) + 1: (3×2)(1×5)+1 = 31 and (4×2)(6×3)+1 = 145, so (2×1)(7×5)+1 = 71."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q017
    difficulty: medium
    stem: |-
      दी गई आकृति में कितने त्रिभुज हैं?

      *(चित्र: A square with an isosceles triangle on its top side and another on its bottom side (an elongated hexagon). Lines drawn: both diagonals of the square, and a vertical line from the top apex to the bottom apex through the centre of the square.)*
    options:
      A: "20"
      B: "22"
      C: "28"
      D: "32"
    answer: B
    explanation: Count 3 triangles in each end triangle (6), 12 inside the square (6 small, 2 made of two small ones, and 4 half-squares) and 4 that join an apex to the centre (such as apex–corner–centre). The total is 22.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q018
    difficulty: medium
    stem: |-
      नीचे दिए गए प्रत्येक प्रश्न में कुछ कथन और उनके बाद उन कथनों पर आधारित कुछ निष्कर्ष दिए गए हैं, हालांकि उनमें सामान्य ज्ञात तथ्यों से भिन्नता हो सकती है। सभी निष्कर्ष पढ़ें और फिर निर्धारित करें कि दिए गए कौन से निष्कर्ष दिए गए कथनों के आधार पर युक्तिसंगत हैं।

      कथनः  
      I. कुछ कलम पेसिंल हैं।  
      II. सभी पेसिंल रबर हैं।

      निष्कर्षः  
      I. कुछ कलम रबर हैं।  
      II. कोई कलम रबर नहीं हैं।  
      III. कुछ रबर पेसिंल हैं।
    options:
      A: केवल निष्कर्ष (II) सही है।
      B: केवल निष्कर्ष (I) तथा निष्कर्ष (II) सही हैं।
      C: केवल निष्कर्ष (I) तथा निष्कर्ष (III) सही हैं।
      D: कोई भी निष्कर्ष सही नहीं है।
    answer: C
    explanation: Some pens are pencils and all pencils are erasers, so some pens are erasers (I). 'All pencils are erasers' also gives 'some erasers are pencils' (III). II contradicts I.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q019
    difficulty: medium
    stem: |-
      नीचे एक घन की तीन अवस्थाएँ दर्शायी गयी है। रोमन अंक ‘I’ के विपरीत फलक पर कौन सा रोमन अंक आयेगा?

      *(चित्र: Three views of a cube (top / front / right face): cube 1 = II / I / IV; cube 2 = III / I / V; cube 3 = V / II / VI.)*
    options:
      A: VI
      B: IV
      C: II
      D: V
    answer: A
    explanation: Face I is seen next to II, IV, III and V, so the face opposite I is VI.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q020
    difficulty: medium
    stem: |-
