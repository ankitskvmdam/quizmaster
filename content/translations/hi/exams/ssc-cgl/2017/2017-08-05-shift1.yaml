      - reasoning
  - slug: cgl-2017-08-05-s1-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि दिए गए दो आव्यूहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 है और आव्यूह-II की 5 से 9। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए ‘K’ को 01, 34, आदि द्वारा दर्शाया जा सकता है तथा ‘P’ को 65, 99, आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए शब्द “BLAND” के लिए समूह को पहचानना है।

      आव्यूह-I

      | | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | A | K | B | L | C |
      | 1 | B | A | C | K | L |
      | 2 | L | C | K | B | A |
      | 3 | C | B | L | A | K |
      | 4 | K | L | A | C | B |

      आव्यूह-II

      | | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | N | O | P | S | D |
      | 6 | P | D | S | N | O |
      | 7 | O | P | N | D | S |
      | 8 | D | S | O | P | N |
      | 9 | S | N | D | O | P |

      *(चित्र: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 10, 14, 00, 68, 79
      B: 31, 41, 33, 96, 86
      C: 44, 20, 42, 88, 59
      D: 23, 32, 24, 55, 66
    answer: D
    explanation: In D, 23 = B, 32 = L and 24 = A (Matrix-I), and 55 = N and 66 = D (Matrix-II), which spells BLAND.
    tags:
      - reasoning
