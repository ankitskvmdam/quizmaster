  - slug: cgl-2017-08-05-s1-q002
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित अक्षरों को चुनिए।

      NPBG : OQCH : : AJOT : ?
    options:
      A: BKPU
      B: BUPK
      C: BHKP
      D: HBKU
    answer: A
    explanation: Each letter moves one place forward (N→O, P→Q, B→C, G→H), so AJOT becomes BKPU.
