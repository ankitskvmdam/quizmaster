  - slug: cgl-2017-08-05-s1-q010
    difficulty: medium
    stem: यदि 'P 3 Q' का अर्थ 'P, Q की पुत्री है' , 'P 5 Q' का अर्थ 'P, Q का पिता है', 'P 7 Q' का अर्थ 'P, Q की माता है' तथा 'P 9 Q' का अर्थ 'P, Q की बहन है', तो J 3 L 9 N 3 O 5 K में, J, K से किस प्रकार संबंधित है?
    options:
      A: माता
      B: पत्नी
      C: भांजी
      D: पुत्री
    answer: C
    explanation: J is L's daughter; L and N are daughters of O, and O is K's father, so L is K's sister. J is therefore K's niece.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q011
    difficulty: medium
    stem: राखी की सगाई 10 वर्ष पहले हुई थी। राखी की वर्तमान आयु उसकी सगाई के समय की आयु की 5/3 है। यदि राखी की माँ की वर्तमान आयु उसकी वर्तमान आयु की दोगुनी हैं, तो राखी की सगाई के समय उसकी माँ की आयु (वर्षों में) क्या थी?
    options:
      A: "50"
      B: "40"
      C: "30"
      D: "60"
    answer: B
    explanation: If her present age is p, then p = (5/3)(p − 10), so p = 25. Her mother is 50 now, so she was 50 − 10 = 40 at the engagement.
    tags:
      - reasoning
