  - slug: cgl-2017-08-09-s2-q013
    difficulty: medium
    stem: एक विशिष्ट कोड भाषा में, "RAIN" को "OHBQ" लिखा जाता है। इस कोड भाषा में "SUMMER" को किस प्रकार लिखा जाएगा?
    options:
      A: QFLNTT
      B: QDLLTR
      C: SFNNVT
      D: SDNLVR
    answer: D
    explanation: "Reverse the word, then shift the letters +1, −1 alternately: RAIN → NIAR → OHBQ. SUMMER → REMMUS → SDNLVR."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q014
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में किन्ही दो संख्याओं को परस्पर बदलकर दिये गए समीकरण को सही कीजिए।

      8 x 3 ÷ 4 + 9 – 5 = 16
    options:
      A: 3 तथा 4
      B: 4 तथा 8
      C: 5 तथा 3
      D: 5 तथा 9
    answer: C
    explanation: Swapping 5 and 3 gives 8 × 5 ÷ 4 + 9 − 3 = 10 + 9 − 3 = 16.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q015
    difficulty: medium
    stem: यदि (2)# * 4 = 2 तथा (4)# * 4 = 16 हैं, तो (6)# * A = 18 में, A का मान क्या है?
    options:
      A: "12"
      B: "14"
      C: "16"
      D: "20"
    answer: A
    explanation: "(x)# * y means x³ ÷ y: 8/4 = 2 and 64/4 = 16. So 216/A = 18 gives A = 12."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q016
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से प्रश्न चिह्न (?) के स्थान पर आने वाली संख्या को चुनिए।

      | आकृति | ऊपर | बाएँ | केंद्र | दाएँ | नीचे |
      |---|---|---|---|---|---|
      | 1 | 2 | 1 | 41 | 5 | 3 |
      | 2 | 3 | 4 | 159 | 6 | 2 |
      | 3 | 7 | 5 | ? | 3 | 2 |

      *(चित्र: Three plus-shaped (cross) number figures printed as an image; each has a centre cell with cells above, left, right and below. Reproduced as a table.)*
    options:
      A: "189"
      B: "227"
      C: "277"
      D: "339"
    answer: B
    explanation: "Centre = product + sum of the four numbers: 2·1·5·3 + 11 = 41 and 3·4·6·2 + 15 = 159, so 7·5·3·2 + 17 = 227."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q017
    difficulty: medium
    stem: |-
      दी गई आकृति में कितने त्रिभुज हैं?

      *(चित्र: An isosceles trapezium (longer side at the bottom). Two vertical lines drop from the two top corners to the base, making a rectangle in the middle with a right triangle on each side; both diagonals of the middle rectangle are drawn.)*
    options:
      A: "8"
      B: "10"
      C: "12"
      D: "14"
    answer: C
    explanation: There are 2 side right triangles and 8 in the middle rectangle with its diagonals (4 small, 4 half-rectangles). Each side triangle also joins a diagonal half to make 2 larger ones, so the total is 12.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q018
    difficulty: medium
    stem: |-
      नीचे दिए गए प्रश्न में कुछ कथन और उनके बाद उन कथनों पर आधारित कुछ निष्कर्ष दिए गए हैं, हालांकि उनमें सामान्य ज्ञात तथ्यों से भिन्नता हो सकती है। सभी निष्कर्ष पढ़ें और फिर निर्धारित करें कि दिए गए कौन से निष्कर्ष, दिए गए कथनों के आधार पर युक्तिसंगत हैं।

      कथनः  
      I. सभी रैकेट बैट हैं।  
      II. सभी बैट विकेट हैं।

      निष्कर्षः  
      I. कुछ विकेट रैकेट हैं।  
      II. सभी विकेट रैकेट हैं।
    options:
      A: केवल निष्कर्ष (I) सही है।
      B: केवल निष्कर्ष (II) सही है।
      C: न तो निष्कर्ष (I) न ही निष्कर्ष (II) सही है।
      D: दोनों ही निष्कर्ष सही है।
    answer: A
    explanation: All rackets are bats and all bats are wickets, so all rackets are wickets, and hence some wickets are rackets (I). II does not follow.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसा कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या-समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसा कि नीचे दिए गए दो आव्यूहों में है। आव्यूह-I के स्तम्भ और पंक्ति की संख्या 0 से 4 दी गई है, और आव्यूह-II की 5 से 9। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया गया है। उदाहरण के लिए ‘X’ को 21, 44, आदि द्वारा दर्शाया जा सकता है तथा ‘R’ को 67, 98, आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको प्रश्न में दिए गए शब्द “CREEP” के लिए समूह को पहचानना है।

      आव्यूह-I

      | | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | E | C | P | X | T |
      | 1 | C | P | X | T | E |
      | 2 | P | X | T | E | C |
      | 3 | X | T | E | C | P |
      | 4 | T | E | C | P | X |

      आव्यूह-II

      | | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | R | L | N | O | M |
      | 6 | O | M | R | L | N |
      | 7 | L | N | O | M | R |
      | 8 | M | R | L | N | O |
      | 9 | N | O | M | R | L |

      *(चित्र: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 10, 79, 23, 32, 42
      B: 24, 55, 14, 41, 12
      C: 33, 86, 32, 13, 43
      D: 42, 98, 41, 00, 34
    answer: D
    explanation: In D, 42 = C (Matrix-I), 98 = R (Matrix-II), and 41 = E, 00 = E and 34 = P (Matrix-I), which spells CREEP.
    tags:
      - reasoning
