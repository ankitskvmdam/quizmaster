      5. Destitute
    options:
      A: "13245"
      B: "15243"
      C: "32451"
      D: "45231"
    answer: A
    explanation: "Dictionary order: Decollete (1), Decorous (3), Desecrate (2), Desipicable (4), Destitute (5), i.e. 13245."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q008
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में अक्षरों का कौन सा समूह खाली स्थानों पर क्रमवार रखने से दी गई अक्षर श्रृंखला को पूरा करेगा?

      a _ bc _ a _ bcdabc _ da _ cd _
    options:
      A: acbddb
      B: adbcbd
      C: cabddc
      D: ddcbbc
    answer: B
    explanation: "Filling a, d, b, c, b, d gives aabcd / abbcd / abccd / abcdd: each block doubles the next letter in turn."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q010
    difficulty: medium
    stem: "आज से 5 वर्ष के बाद, A तथा B की आयु का अनुपात 7 : 5 हो जाएगा तथा उनकी आयु का अन्तर 4 वर्ष होगा। क्रमशः A तथा B की वर्तमान आयु (वर्षों में) क्या हैं?"
    options:
      A: 5, 9
      B: 6, 5
      C: 9, 5
      D: 9, 6
    answer: C
    explanation: "After 5 years the ages are 7k and 5k with a difference of 2k = 4, so k = 2: 14 and 10. The present ages are 9 and 5."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q011
    difficulty: medium
    stem: एक बिन्दु से, लोकेश दक्षिण की ओर चलना आरंभ करता है तथा 30 मीटर चलने के बाद वह अपने दायें मुड़कर 20 मीटर चलता है, वह फिर दायें मुड़कर 30 मीटर चलता है। अंततः वह अपने बायें ओर मुड़ता है तथा 40 मीटर चलता है। वह अपने आरंभिक स्थान से किस दिशा में है?
    options:
      A: उत्तर-पश्चिम
      B: पूर्व
      C: पश्चिम
      D: दक्षिण
    answer: C
    explanation: South 30, right (west) 20, right (north) 30 brings him back level with the start, 20 m west; left (west) 40 more puts him 60 m due west.
    tags:
      - reasoning
