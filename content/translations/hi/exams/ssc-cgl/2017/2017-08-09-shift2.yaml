questions:
  - slug: cgl-2017-08-09-s2-q001
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित शब्द को चुनिए।

      पंचांग: तिथि : : सूची: ?
    options:
      A: लेखक का नाम
      B: शब्दावली
      C: विषय-वस्तु
      D: सारांश
    answer: C
    explanation: A calendar is a list of dates; an index is likewise a list of the book's contents (topics) with page numbers.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q002
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित संख्या को चुनिए।

      ACOUSTIC : 91 : : RENOUNCE : ?
    options:
      A: "95"
      B: "99"
      C: "105"
      D: "109"
    answer: A
    explanation: "Sum of letter positions: ACOUSTIC = 1+3+15+21+19+20+9+3 = 91, and RENOUNCE = 18+5+14+15+21+14+3+5 = 95."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q003
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में दिए गए विकल्पों में से संबंधित संख्या को चुनिए।

      243 : 819 : : 163 : ?
    options:
      A: "487"
      B: "563"
      C: "572"
      D: "593"
    answer: A
    explanation: "Add the square of the product of the digits: 243 + (2×4×3)² = 243 + 576 = 819, so 163 + (1×6×3)² = 163 + 324 = 487."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q004
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम शब्द को चुनिए।
    options:
      A: बैडमिंटन
      B: टेबल टेनिस
      C: क्रिकेट
      D: हॉकी
    answer: A
    explanation: Badminton is played with a shuttlecock; table tennis, cricket and hockey use a ball.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q005
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम अक्षरों को चुनिए।
    options:
      A: ACFJ
      B: RTWA
      C: NPSV
      D: HJMQ
    answer: C
    explanation: ACFJ, RTWA (W+4 wraps round to A) and HJMQ go up by +2, +3, +4; NPSV goes up by +2, +3, +3.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q006
    difficulty: medium
    stem: निम्नलिखित प्रश्न में दिए गए विकल्पों में से विषम संख्या समूह को चुनिए।
    options:
      A: (4, 16, 48)
      B: (6, 36, 90)
      C: (8, 64, 160)
      D: (12, 144, 360)
    answer: A
    explanation: In the others the third number is 2.5 × the square (36×2.5 = 90, 64×2.5 = 160, 144×2.5 = 360); in (4, 16, 48) it is 3 × 16.
    tags:
      - reasoning
