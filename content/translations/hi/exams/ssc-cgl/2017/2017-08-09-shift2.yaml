    difficulty: medium
    stem: |-
      दिए गए प्रश्न में, निम्नलिखित विकल्पों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों का प्रयोग करके नहीं बनाया जा सकता है।

