  - slug: cgl-2016-09-10-s2-q002
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      BECD:GJHI :: LOMN:?
    options:
      A: PSRQ
      B: PQRS
      C: QTSR
      D: QTRS
    answer: D
    explanation: "Each letter moves 5 places forward: B→G, E→J, C→H, D→I. So L→Q, O→T, M→R, N→S gives QTRS."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q003
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      27:125 :: 64:?
    options:
      A: "162"
      B: "216"
      C: "273"
      D: "514"
    answer: B
    explanation: 27 = 3³ and 125 = 5³ (cube of the number two higher). 64 = 4³, so the answer is 6³ = 216.
    tags:
      - reasoning
