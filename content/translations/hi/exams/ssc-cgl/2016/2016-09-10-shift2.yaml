      सांय 7 बजे से 8 बजे के बीच पार्क की गई साईकिलों की संख्या में सबसे अधिक कमी प्रतिशत क्या है ?

      *(चित्र: Bar graph "Number of parked bicycles" against Time: 9 am 95, 10 am 75, 11 am 85, 12 noon 65, 1 pm 75,
      2 pm 55, 3 pm 65, 4 pm 45, 5 pm 55, 6 pm 35, 7 pm 45, 8 pm 25.)*
    options:
      A: "30"
      B: "38"
      C: "42"
      D: "45"
    answer: D
    explanation: From 45 to 25 the fall is 20/45 ≈ 44.4%; the nearest option is 45.
