    stem: यदि REDUCE= 56, RECYCLE = 71 हो, तो REUSE किसके बराबर होगा ?
    options:
      A: "65"
      B: "68"
      C: "69"
      D: "70"
    answer: B
    explanation: "The code is the sum of letter positions: REDUCE = 18+5+4+21+3+5 = 56. REUSE = 18+5+21+19+5 = 68."
