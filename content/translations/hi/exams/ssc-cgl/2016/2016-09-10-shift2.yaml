  - slug: cgl-2016-09-10-s2-q025
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में विकल्पों में दिए गए संख्या-समूह, अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसे कि नीचे दिए गए दो आव्यूहों में हैं। आव्यूह I के सतम्भ और पंक्ति की संख्या 0 से 4 तक दी गई है, और आव्यूह II के 5 से 9 तक, इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए, B को 00, 13 आदि द्वारा दर्शाया जा सकता है तथा O को 56, 68आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको दिए शब्द '**TEAR**' के लिए समूह को पहचानना है।

      MATRIX 1

      |   | 0 | 1 | 2 | 3 | 5 |
      |---|---|---|---|---|---|
      | 0 | B | C | D | E | A |
      | 1 | D | E | A | B | C |
      | 2 | C | D | E | A | B |
      | 3 | A | B | C | D | E |
      | 4 | E | A | B | C | D |

      MATRIX 2

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | R | O | N | T | U |
      | 6 | T | U | R | O | N |
      | 7 | O | N | T | U | R |
      | 8 | U | R | O | N | T |
      | 9 | N | T | U | R | O |
    options:
      A: 58,34,21,67
      B: 96,11,26,12
      C: 65,40,23,79
      D: 77,58,21,98
    answer: C
    explanation: In option C, 65 = T, 40 = E, 23 = A and 79 = R, which spells TEAR.
    tags:
      - reasoning
