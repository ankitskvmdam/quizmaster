  - slug: cgl-2016-09-02-s3-q002
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      BDCE : GIHJ :: QSRT : ?
    options:
      A: VWXY
      B: UWMX
      C: VXWY
      D: UWNX
    answer: C
    explanation: "Each letter moves 5 places forward: B→G, D→I, C→H, E→J. So Q, S, R, T → V, X, W, Y."
