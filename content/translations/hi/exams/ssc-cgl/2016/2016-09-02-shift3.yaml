  - slug: cgl-2016-09-02-s3-q013
    difficulty: medium
    stem: |-
      यदि A=1,  
      CAT=60 हो,  
      तो MAN=?
    options:
      A: "27"
      B: "90"
      C: "180"
      D: "182"
    answer: D
    explanation: "Multiply the letters' positions: CAT = 3 × 1 × 20 = 60, so MAN = 13 × 1 × 14 = 182."
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q014
    difficulty: medium
    stem: |-
      यदि 'P'का अर्थ '+', है, 'Q' का अर्थ 'x', 'R' का अर्थ '÷', और 'S' का अर्थ '−' हो, तो  
      44Q9R12S6Q4P16=?
    options:
      A: "25"
      B: "36"
      C: "112"
      D: "12"
    answer: A
    explanation: 44 × 9 ÷ 12 − 6 × 4 + 16 = 33 − 24 + 16 = 25.
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q015
    difficulty: medium
    stem: |-
      यदि 84+96=4842 हो,  
      तो 36+78= ?
    options:
      A: "3918"
      B: "3678"
      C: "3819"
      D: "1839"
    answer: A
    explanation: "Halve each number and write them in reverse order: 96/2 = 48 and 84/2 = 42 give 4842. So 78/2 = 39 and 36/2 = 18 give 3918."
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q017
