      - reasoning
  - slug: cgl-2016-09-02-s3-q003
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      9 : 162 :: 8 : ?
    options:
      A: "96"
      B: "112"
      C: "128"
      D: "160"
    answer: C
    explanation: 9 × 9 × 2 = 162, so 8 × 8 × 2 = 128.
