  - slug: cgl-2016-09-02-s3-q018
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में एक या दो वक्तव्य दिये गये है, जिसके आगे दो निष्कर्ष/मान्यताएं, I और II निकाले गये हैं। आपको विचार करना है कि वक्तव्य सत्य है चाहे वह सामान्यतः शर्त तथ्यों से भिन्न प्रतीत होता हो। आपको निर्णय करना है कि दिए गए वक्तव्य में से कोन-सा निश्चित रूप से सही निष्कर्ष/मान्यता निकाला जा सकता है ?

      कथन :

      I) गुणवत्ता का एक मुल्य होता है।  
      II) भारत शिक्षा केलिए काफी धन का आवंटन कर रहा है।

      निर्णय:

      I) भारत में शिक्षा की गुणवत्ता में सुधार होगा।  
      II) केवल निधीयन से ही शिक्षा की गुणवत्ता को बढ़ाया जा सकता है।
    options:
      A: केवल निष्कर्ष I सही है।
      B: केवल निष्कर्ष II सही है।
      C: निष्कर्ष I और II दोनों सही हैं।
      D: ना तो निष्कर्ष I सही है और ना ही II सही है।
    answer: A
    explanation: Quality costs money and India is spending a lot, so quality should improve (I). Nothing says funding alone is enough (II).
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q019
    difficulty: medium
    stem: |-
