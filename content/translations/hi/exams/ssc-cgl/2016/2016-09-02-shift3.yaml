  - slug: cgl-2016-09-02-s3-q007
    difficulty: medium
    stem: |-
      निम्नलिखित शब्दों को शब्दकोश में दिए गए क्रम के अनुसार लिखिए ।

      1. Diffident 2. Difficult 3.Different 4.Diffidence
    options:
      A: 1,2,3,4
      B: 3,2,4,1
      C: 2,1,3,4
      D: 3,2,1,4
    answer: B
    explanation: "Differ- < Diffic- < Diffid-, and Diffidence < Diffident. Order: Different, Difficult, Diffidence, Diffident = 3, 2, 4, 1."
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q011
    difficulty: medium
    stem: यदि तीन क्रमागत संख्याओं का योग 15 है, तो मध्य संख्या का वर्ग क्या होग?
    options:
      A: "16"
      B: "25"
      C: "36"
      D: "9"
    answer: B
    explanation: Three consecutive numbers that add up to 15 are 4, 5 and 6. The middle number is 5, and 5² = 25.
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q012
    difficulty: medium
    stem: |-
      निम्नलिखित विकल्पों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों का प्रयोग करके नहीं बनाया जा सकता।

