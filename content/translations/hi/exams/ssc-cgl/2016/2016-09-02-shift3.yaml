      *(चित्र: A wide triangle with apex above a point left of centre on the base. A vertical line runs from the apex to the base. From each lower corner a line rises to a point on the vertical line about halfway up. From the foot of the vertical line, two lines rise diagonally: one up-left to the left side and one up-right to the right side, each crossing one of the lines from the corners.)*
    options:
      A: "18"
      B: "13"
      C: "9"
      D: "5"
    answer: A
    explanation: "Count by the eight lines (three sides, the vertical, two corner-to-midpoint lines and two lines from the foot): 18 triangles in all."
    tags:
      - reasoning
  - slug: cgl-2016-09-02-s3-q025
    difficulty: medium
    stem: |-
      एक शब्द केवल एक संख्या-समूह द्वारा दर्शाया गया है, जैसे कि विकल्पों में से किसी एक में दिया गया है। विकल्पों में दिए गए संख्या समूह अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसे कि नीचे दिए गए दो आव्यूहों में हैं। आव्यूह I के स्तंभ और पंक्ति की संख्या 0 से 4 और आव्यूह II की 5 से 9 दी गई है। इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए 'A' को 02, 10 आदि द्वारा दर्शाया जा सकता है तथा 'B ' को 57, 65 आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको दिए हुए शब्द 'FADE' के लिए समूह को पहचानना है।

      MATRIX - I

      | | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | I | E | A | O | U |
      | 1 | A | O | U | I | E |
      | 2 | E | I | O | U | A |
      | 3 | O | U | E | A | I |
      | 4 | U | A | I | E | O |

      MATRIX - II

      | | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | F | D | B | G | H |
      | 6 | B | G | H | F | D |
      | 7 | D | F | G | H | B |
      | 8 | G | H | D | B | F |
      | 9 | H | B | F | G | D |

      *(चित्र: The two matrices are printed as an image; transcribed as tables.)*
    options:
      A: 76, 02, 75, 32
      B: 68,20,57, 14
      C: 55, 33, 65, 23
      D: 89, 10, 96, 41
    answer: A
    explanation: F = 76, A = 02, D = 75 and E = 32. Every pair in option A matches.
    tags:
      - reasoning
