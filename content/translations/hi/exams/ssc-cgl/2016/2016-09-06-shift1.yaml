  - slug: cgl-2016-09-06-s1-q002
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      DCEF : QPRS :: XWYZ : ?
    options:
      A: SRQP
      B: NMOP
      C: STOV
      D: IMGF
    answer: B
    explanation: DCEF, QPRS and XWYZ all follow the pattern n, n−1, n+1, n+2 (e.g. D, C, E, F). Of the options, only NMOP follows it.
    tags:
      - reasoning
  - slug: cgl-2016-09-06-s1-q003
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      121 : 12 :: 25 : ?
    options:
      A: "5"
      B: "6"
      C: "7"
      D: "8"
    answer: B
    explanation: 121 = 11², and 11 + 1 = 12. In the same way 25 = 5², and 5 + 1 = 6.
    tags:
      - reasoning
