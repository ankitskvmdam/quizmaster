  - slug: cgl-2016-09-06-s1-q015
    difficulty: medium
    stem: |-
      कुछ समीकरण एक निश्चित प्रणाली से हल किए गए हैं। उसी आधार पर दिए गए विकल्पों में से सही उत्तर चुनकर लिखिए ?

