  - slug: cgl-2016-09-06-s1-q018
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में एक या दो वक्तव्य दिये गये हैं, जिसके आगे दो निष्कर्ष/मान्यताएँ, I और II निकाले गये हैं। आपको मानना है कि वक्तव्य सत्य है चाहे वह सामान्यतः शर्त तथ्यों से भिन्न प्रतीत होता हो। आपको निर्णय करना है कि दिए गए वक्तव्य में से कौनसा निश्चित रूप से सही निष्कर्ष/मान्यता निकाला जा सकता है ?

      वक्तव्य : 1. कोई आदमी बन्दर नहीं है।

      2. हरि आदमी है।

      निष्कर्ष : I. हरि बन्दर नहीं है।

      II.सभी आदमी हरि नहीं है।
    options:
      A: केवल निष्कर्ष I सही है।
      B: केवल निष्कर्ष II सही है।
      C: निष्कर्ष I और II दोनों सही हैं।
      D: ना तो निष्कर्ष I सही है और ना ही निष्कर्ष II सही है।
    answer: A
    explanation: No man is a monkey and Hari is a man, so Hari is not a monkey. Nothing follows about whether all men are Hari.
    tags:
      - reasoning
