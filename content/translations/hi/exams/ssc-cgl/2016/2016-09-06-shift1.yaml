    options:
      A: "689"
      B: "698"
      C: "968"
      D: "986"
    answer: B
    explanation: "Write the 1st, 3rd and 2nd numbers in that order: 8, 0, 5 → 805 and 7, 6, 4 → 764. So 6, 9, 8 → 698."
