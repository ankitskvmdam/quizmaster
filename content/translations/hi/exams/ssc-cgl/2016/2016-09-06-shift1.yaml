      निम्नलिखित पाई चार्ट में किसी देश द्वारा किसी वर्ष विशेष में विभिन्न खेलकूदों पर खर्च की गई राशि दर्शायी गई है। पाई चार्ट का अध्ययन कीजिए और प्रश्नों के उत्तर दिजिए ।

      यदि वर्ष के दौरान क्रिकेट पर Rs. 20,00,000 की राशि खर्च की गई तो टेनिस पर कितनी राशि खर्च की गई ?

      *(चित्र: Pie chart of spending on sports: Tennis 10%, Golf 12½%, Basket ball 12½%, Foot ball 15%, Hockey 15%,
      Cricket 25%, Others 10%.)*
    options:
      A: Rs. 8,00,000
      B: Rs.10,00,000
      C: Rs. 80,00,000
      D: Rs. 40,00,000
    answer: A
    explanation: "Tennis : cricket = 10 : 25, so tennis = 20,00,000 × 10/25 = Rs. 8,00,000."
