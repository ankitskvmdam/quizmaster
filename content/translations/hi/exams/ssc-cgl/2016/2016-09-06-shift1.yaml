      B: पीला
      C: नारंगी
      D: सफेद
    answer: C
    explanation: Green is shown next to Red, Blue, Yellow and White. The only colour left, Orange, must be opposite it.
    tags:
      - reasoning
  - slug: cgl-2016-09-06-s1-q025
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में विकल्पों में दिए गए संख्या-समूह, अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसे कि नीचे दिए गए दो आव्यूहों में हैं। आव्यूह I के सतम्भ और पंक्ति की संख्या 0 से 4 तक दी गई है, और आव्यूह II के 5 से 9 तक, इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए, U को 01, 12, आदि द्वारा दर्शाया जा सकता है तथा L को 56, 67,आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको दिए शब्द 'SPARE' के लिए समूह को पहचानना है।

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | S | U | P | E | R |
      | 1 | R | S | U | P | E |
      | 2 | E | R | S | U | P |
      | 3 | P | E | R | S | U |
      | 4 | U | P | E | R | S |

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | G | L | A | N | D |
      | 6 | D | G | L | A | N |
      | 7 | N | D | G | L | A |
      | 8 | A | N | D | G | L |
      | 9 | L | A | N | D | G |
    options:
      A: 22, 41, 85, 32, 14
      B: 12, 24, 21, 68, 14
      C: 44, 78, 67, 32, 42
      D: 33, 30, 43, 40,43
    answer: A
    explanation: S = 22, P = 41, A = 85, R = 32 and E = 14. Every pair in option A matches.
    tags:
      - reasoning
