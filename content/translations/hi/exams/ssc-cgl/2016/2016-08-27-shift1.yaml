    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q033
    difficulty: medium
    stem: किस कारण से वायु के बुलबुले तरल पदार्थ में उठते हैं ?
    options:
      A: पृष्ट-तनाव और आसंजन
      B: श्यानता और उत्पलव
      C: तरल पदार्थ पर वायु प्रवाह और उत्पलव
      D: उत्क्षेप और पृष्ठ तनाव
    answer: B
