source: "SSC candidate response sheet with the official answer marked (via aglasem.com — https://docs.aglasem.com/view/5a3f1e1c-dab7-11ed-9b4d-0a5e36bc6706). Left out (picture-only options or incomplete in the source): Q16, Q21, Q22, Q23, Q24, Q65, Q72, Q73, Q74, Q75."
questions:
  - slug: cgl-2016-08-27-s1-q001
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      गधा : रेंकना : बन्दर : ?
    options:
      A: चहकना
      B: चिंघाड़ना
      C: गरजना
      D: घुरघुराना
    answer: A
    explanation: "A donkey brays and a monkey chatters: each animal is paired with the sound it makes."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q002
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      ABDE : FGIJ :: IJLM : ?
    options:
      A: NOQR
      B: NOPQ
      C: NMOP
      D: NPQR
    answer: A
    explanation: "Each letter moves 5 places forward: A→F, B→G, D→I, E→J. So I, J, L, M → N, O, Q, R."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q003
    difficulty: medium
    stem: |-
      दिये गये विकल्पों में से संबन्धित शब्द/अक्षरों/संख्या को चुनिए।

      1 : 8 :: ? :64
    options:
      A: "25"
      B: "36"
      C: "30"
      D: "27"
    answer: D
    explanation: "1 : 8 is 1³ : 2³, so the pair is consecutive cubes: 3³ : 4³ = 27 : 64."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q004
    difficulty: medium
    stem: दिये गए विकल्पों में से विषम शब्द/ अक्षर/ संख्या युग्म छांटिए।
    options:
      A: Swimming
      B: Sailing
      C: Diving
      D: Driving
    answer: D
    explanation: Swimming, sailing and diving all happen in water; driving happens on land.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q005
    difficulty: medium
    stem: दिये गए विकल्पों में से विषम शब्द/ अक्षर/ संख्या युग्म छांटिए।
    options:
      A: RGTF
      B: MLOK
      C: CTES
      D: VDZC
    answer: D
    explanation: In RGTF, MLOK and CTES the 1st→3rd letter is +2 and the 2nd→4th is −1 (R→T, G→F). In VDZC, V→Z is +4, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q006
    difficulty: medium
    stem: दिये गए विकल्पों में से विषम शब्द/ अक्षर/ संख्या युग्म छांटिए।
    options:
      A: "443"
      B: "633"
      C: "821"
      D: "245"
    answer: B
    explanation: The digits of 443, 821 and 245 each add up to 11; the digits of 633 add up to 12.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q007
    difficulty: medium
    stem: |-
      निम्नलिखित शब्दों को शब्दकोश में दिए गए क्रम के अनुसार लिखिए।

      1. Dyke 2. Dwindle 3. Dwell 4. Dye
    options:
      A: 3,2,4,1
      B: 1,3,4,2
      C: 2,1,3,4
      D: 3,4,2,1
    answer: A
    explanation: "Dwell, Dwindle, Dye, Dyke: 'Dwe' comes before 'Dwi', and both come before 'Dy'; 'Dye' comes before 'Dyk'. Order 3, 2, 4, 1."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q008
    difficulty: medium
    stem: |-
      सही विकल्प चुनकर सीरीज में प्रश्न चिन्ह के स्थान पर लिखिए।

      DHL, PTX, BFJ, ?
    options:
      A: KOS
      B: NRV
      C: NPS
      D: NRU
    answer: B
    explanation: "Each group's letters are 4 apart (D-H-L), and the first letter moves 12 places each time: D→P→B→N (wrapping after Z). So N, R, V."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q009
    difficulty: medium
    stem: |-
      सीरीज में गलत संख्या छांटिए।

      28, 33, 31, 36, 34, 29
    options:
      A: "33"
      B: "36"
      C: "34"
      D: "29"
    answer: D
    explanation: "The series alternates +5, −2: 28, 33, 31, 36, 34, then 34 + 5 = 39. So 29 is wrong."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q011
    difficulty: medium
    stem: सत्या का जन्मदिन 15 अगस्त को और मीना का जन्मदिन 25 जून को आता है। यदि मीना का जन्मदिन बुधवार को था, तो सत्या का जन्मदिन उसी वर्ष कौन से दिन था ?
    options:
      A: शुक्रवार
      B: सोमवार
      C: मंगलवार
      D: शनिवार
    answer: A
    explanation: From 25 June to 15 August is 5 + 31 + 15 = 51 days = 7 weeks + 2 days. Wednesday + 2 = Friday.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q012
    difficulty: medium
    stem: |-
      निम्नलिखित शब्दों में से वह शब्द चुनिए जो दिए गए शब्द के अक्षरों के प्रयोग से बनाया जा सकता है ?

      AMPLIFICATION
    options:
      A: ACTOR
      B: MANOR
      C: CHAMP
      D: MANIA
    answer: D
    explanation: AMPLIFICATION has M, A (twice), N and I, so MANIA can be formed. The others need R or H, which are not in the word.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q013
    difficulty: medium
    stem: अगर BLACKSMITH का कोड CNBELUNKUJ हो तो CHILDREN का कोड क्या होगा ?
    options:
      A: DIJMESFO
      B: DJJNETFP
      C: DJINETEP
      D: DJJNETEP
    answer: B
    explanation: "Letters move alternately +1 and +2: B→C, L→N, A→B, C→E … So C H I L D R E N → D J J N E T F P."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q014
    difficulty: medium
    stem: |-
      यदि 17 +17 = 2895

      18 +18 = 3245

      19 + 19 = 3615

      हो तो 23 + 23 = ?
    options:
      A: "5765"
      B: "2565"
      C: "4005"
      D: "5295"
    answer: D
    explanation: "The result is the square followed by 5: 17² = 289 → 2895. So 23² = 529 → 5295."
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q015
    difficulty: medium
    stem: यदि (=) का मतलब (÷), (+) का मतलब (−), (x) का मतलब (=), (−) का मतलब (+), और (÷) का मतलब (ₓ) हो, तो सही समीकरण ज्ञात कीजिए ?
    options:
      A: 8 ÷ 4 + 1 − 5 = 6 x 4
      B: 4 x 6 ÷ 4 + 4 = 7
      C: 5 ÷ 3 − 25 + 20 = 20 x 39
      D: 96 ÷ 2 x 6 ÷105 + 1
    answer: C
    explanation: After swapping the signs, option C reads 5 × 3 + 25 − 20 ÷ 20 = 39, i.e. 15 + 25 − 1 = 39, which is true.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q017
    difficulty: medium
    stem: एक आदमी 9 कि.मी.पूर्व की ओर उसके बाद 12 कि.मी. दक्षिण की ओर जाता है। उसके प्रारम्भ और अन्तिम बिन्दु के बीच की दूरी ज्ञात कीजिए ?
    options:
      A: 8 कि.मी.
      B: 6 कि.मी.
      C: 15 कि.मी.
      D: 7.5 कि.मी.
    answer: C
    explanation: The two legs are at right angles, so the distance is √(9² + 12²) = √225 = 15 km.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q018
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में एक या दो वक्तव्य दिये गये है, जिसके आगे दो निष्कर्ष/मान्यताएं, I और II निकाले गये हैं। आपको विचार करना है कि वक्तव्य सत्य है चाहे वह सामान्यतः शर्त तथ्यों से भिन्न प्रतीत होता हो। आपको निर्णय करना है कि दिए गए वक्तव्य में से कोन-सा निश्चित रूप से सही निष्कर्ष/मान्यता निकाला जा सकता है ?

      कथन : गरीबी, सामाजिक अव्यवस्था का लक्षण एवं परिणाम है।

      निष्कर्ष : I. गरीबी सामाजिक व्यवस्था का एक प्रकार है।

      II. गरीबी सामाजिक व्यवस्था से सम्बन्धित है।
    options:
      A: केवल निष्कर्ष I सही है।
      B: केवल निष्कर्ष II सही है।
      C: दोनों निष्कर्ष I और II सही हैं।
      D: ना तो निष्कर्ष I सही है और ना ही निष्कर्ष II
    answer: D
    explanation: The statement is about social disorder. It does not say that poverty is a kind of social order, or that it is linked to social order, so neither assumption is implicit.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q019
    difficulty: medium
    stem: |-
      वर्ग ABCD में कितने वर्ग हैं ?

      *(चित्र: Square ABCD (A top-left, B top-right, C bottom-right, D bottom-left) divided into a 4 × 4 grid of equal small squares.)*
    options:
      A: "16"
      B: "17"
      C: "26"
      D: "30"
    answer: D
    explanation: A 4 × 4 grid has 16 + 9 + 4 + 1 = 30 squares (1×1, 2×2, 3×3 and 4×4).
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q020
    difficulty: medium
    stem: |-
      वह कौन सा भाग है जो दर्शाता है कि जो अभिनेता है वह गायक भी है।

      *(चित्र: Three overlapping rectangles labelled by arrows: 'College Students' (upper-left rectangle), 'Actors' (right rectangle) and 'Singers' (narrow vertical rectangle at the lower left). Regions: a = college students only; b = college students and actors only; d = college students and singers only; c = college students, actors and singers; e = actors and singers only; f = actors only; g = singers only.)*
    options:
      A: a
      B: b
      C: c
      D: f
    answer: C
    explanation: Actors who are also singers lie in the overlap of the Actors and Singers rectangles, which is regions c and e. Of the options, only c is offered.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q025
    difficulty: medium
    stem: |-
      निम्नलिखित प्रश्न में विकल्पों में दिए गए संख्या-समूह, अक्षरों के दो वर्गों द्वारा दर्शाए गए हैं, जैसे कि नीचे दिए गए दो आव्यूहों में हैं। आव्यूह I के सतम्भ और पंक्ति की संख्या 0 से 4 तक दी गई है, और आव्यूह II के 5 से 9 तक, इन आव्यूहों से एक अक्षर को पहले उसकी पंक्ति और बाद में स्तम्भ संख्या द्वारा दर्शाया जा सकता है। उदाहरण के लिए, G को 04, 40, आदि द्वारा दर्शाया जा सकता है तथा K को 56, 75, आदि द्वारा दर्शाया जा सकता है। इसी तरह से आपको दिए शब्द 'NILE' के लिए समूह को पहचानना है।

      Matrix - I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | C | D | E | F | G |
      | 1 | F | G | C | D | E |
      | 2 | D | E | F | G | C |
      | 3 | E | F | G | C | D |
      | 4 | G | C | D | E | F |

      Matrix - II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | H | K | L | I | N |
      | 6 | I | N | H | K | L |
      | 7 | K | L | I | N | H |
      | 8 | L | I | N | H | K |
      | 9 | N | H | K | L | I |
    options:
      A: 56, 58, 03, 02
      B: 59, 77, 85, 43
      C: 56, 62, 03, 02
      D: 57, 60, 10, 02
    answer: B
    explanation: N = 59 (row 5, column 9), I = 77, L = 85 and E = 43. Every pair in option B matches.
    tags:
      - reasoning
  - slug: cgl-2016-08-27-s1-q026
    difficulty: medium
    stem: टपकन सिद्धांत (आपमात्रीय सिद्धांत) निम्नलिखित में से किस पर आर्थिक वृद्धि के प्रभाव को नजर अंदाज करता है ?
    options:
      A: निवेश
      B: बचत
      C: आय वितरण
      D: उपयोग
    answer: C
    explanation: The trickle-down theory assumes that the gains of growth reach the poor on their own, so it ignores how income is distributed.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q027
    difficulty: medium
    stem: भारत के नियंत्रक-महालेखापरीक्षक निम्नलिखित में से किसकी प्राप्तियों और व्यय की लेखापरीक्षा नहीं करते ?
    options:
      A: केंद्र सरकार
      B: स्थानीय निकाय
      C: राज्य सरकार
      D: सरकारी कम्पनियां
    answer: B
    explanation: The CAG audits the accounts of the Union, the States and government companies. Local bodies are mainly audited by the state Local Fund Audit departments.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q028
    difficulty: medium
    stem: काकोरी षडयंत्र मामला किस वर्ष में हुआ ?
    options:
      A: "1925"
      B: "1924"
      C: "1926"
      D: "1927"
    answer: A
    explanation: The Kakori train robbery by HRA revolutionaries took place on 9 August 1925.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q029
    difficulty: medium
    stem: ताज महल को 'संगमरमर में स्वप्न'(a dream in marble) कहा जाता है ? किस स्मारक को ' पत्थर में स्वप्न' कहा जाता है ?
    options:
      A: रंग महल
      B: पंच महल
      C: लाल किला
      D: बहाई मन्दिर
    answer: B
    explanation: Fatehpur Sikri, where the Panch Mahal stands, is called 'a dream in stone'. Of the options, the Panch Mahal is the one that matches.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q030
    difficulty: medium
    stem: भारत में लिंग अनुपात की गणना कैसे की जाती है ?
    options:
      A: प्रति हजार स्त्रियों पर पुरुषों की संख्या
      B: प्रति हजार पुरुषों पर स्त्रियों की संख्या
      C: प्रति सौ स्त्रियों पर पुरुषों की संख्या
      D: प्रति सौ पुरुषों पर स्त्रियों की संख्या
    answer: B
    explanation: In India the sex ratio is the number of females per 1000 males.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q031
    difficulty: medium
    stem: सहचर कोशिकाएं निम्नलिखित में से सिर्फ किसमें है ?
    options:
      A: ब्रायोफाइट
      B: टेरिडोफाइट्स
      C: एन्जियोस्पर्म (आवृतबीजी)
      D: जिम्नोस्पर्म (अनावृतबीजी)
    answer: C
    explanation: Companion cells, which go with sieve tubes in phloem, are found only in angiosperms.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q032
    difficulty: medium
    stem: निम्नलिखित में से क्या विद्युत-रोधी है ?
    options:
      A: तांबा
      B: लकड़ी
      C: पारद
      D: एल्युमिनियम
    answer: B
