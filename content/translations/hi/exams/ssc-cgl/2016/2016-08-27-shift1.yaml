    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q034
    difficulty: medium
    stem: जियोलाइट क्या है ?
    options:
      A: हाइड्रेटेड फेरिक ऑक्साइड
      B: हाइड्रेटेड सोडियम एल्युमिनियम सिलिकेट
      C: सोडियम हेक्सामेटा फॉस्फेट
      D: सोडियम टेट्राबोरेट
    answer: B
