    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q035
    difficulty: medium
    stem: किस कारण से तरल पदार्थों के क्वथनांक (boiling point) में भिन्नता होती हैं ?
    options:
      A: दाब में भिन्नता
      B: तापमान में भिन्नता
      C: आयतन में भिन्नता
      D: घनत्व में भिन्नता
    answer: A
    explanation: A liquid boils when its vapour pressure equals the outside pressure, so its boiling point changes with pressure.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q036
    difficulty: medium
    stem: विश्व में प्रदूषण का सबसे बड़ा स्रोत कौन-सा है ?
    options:
      A: शाकनाशी और कीटनाशी
      B: आटोमोबाइल से निकलने वाला धुआं
      C: कूड़ा और कचरा
      D: औद्योगिक बहिःस्राव
    answer: C
    explanation: Sewage and garbage are the largest source of pollution in the world.
    tags:
      - general-awareness
  - slug: cgl-2016-08-27-s1-q037
    difficulty: medium
    stem: निम्नलिखित राज्यों में से सर्वोच्च साक्षरता दर किस राज्य में है ?
    options:
      A: उड़िसा
      B: पंजाब
      C: महाराष्ट्र
      D: मिज़ोरम
    answer: D
    explanation: Mizoram's literacy rate (about 91% in the 2011 Census) is much higher than that of Odisha, Punjab or Maharashtra.
