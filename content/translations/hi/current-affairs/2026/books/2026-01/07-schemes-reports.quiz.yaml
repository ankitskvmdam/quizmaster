  answer: D
  explanation: "विश्व आर्थिक मंच वैश्विक जोखिम रिपोर्ट प्रकाशित करता है; 2026 के संस्करण में भू-आर्थिक टकराव को सबसे बड़ा जोखिम माना गया।"
  tags: ["2026-01"]

- slug: ca-2601-sch-02
