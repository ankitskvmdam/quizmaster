# खंड 7 — सरकारी योजनाएँ, रिपोर्ट एवं सूचकांक (जनवरी 2026)
- slug: ca-2601-sch-01
  difficulty: easy
  stem: "वैश्विक जोखिम रिपोर्ट (Global Risks Report) कौन-सा संगठन प्रकाशित करता है?"
