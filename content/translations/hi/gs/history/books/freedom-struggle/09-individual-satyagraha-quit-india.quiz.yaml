- slug: fs-qim-19
  difficulty: hard
  stem: "बिहार में पहले व्यक्तिगत सत्याग्रही कौन थे?"
  options: { A: "श्रीकृष्ण सिन्हा", B: "अनुग्रह नारायण सिन्हा", C: "राजेंद्र प्रसाद", D: "जयप्रकाश नारायण" }
