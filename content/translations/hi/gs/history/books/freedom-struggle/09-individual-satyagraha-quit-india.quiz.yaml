- slug: fs-qim-18
  difficulty: hard
  stem: "हजारीबाग जेल से भागने के बाद जयप्रकाश नारायण ने 'आज़ाद दस्ता' कहाँ संगठित किया?"
  options: { A: "छोटानागपुर का पठार", B: "कैमूर की पहाड़ियाँ", C: "नेपाल की तराई", D: "पूर्वी यू.पी. का बलिया" }
