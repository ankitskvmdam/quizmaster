- slug: fs-qim-14
  difficulty: medium
  stem: "1940 का अगस्त प्रस्ताव (August Offer) किस वायसराय ने रखा?"
  options: { A: "लॉर्ड विलिंगडन", B: "लॉर्ड वेवेल", C: "लॉर्ड लिनलिथगो", D: "लॉर्ड इरविन" }
  answer: C
  explanation: "लॉर्ड लिनलिथगो ने 8 अगस्त 1940 को अगस्त प्रस्ताव रखा; कांग्रेस ने इसे अस्वीकार कर दिया।"

- slug: fs-qim-15
  difficulty: medium
  stem: "9 अगस्त 1942 को गिरफ्तारी के बाद गांधी को कहाँ रखा गया?"
  options: { A: "आगा खाँ महल, पूना", B: "अहमदनगर किला", C: "यरवदा जेल, पूना", D: "बाँकीपुर जेल, पटना" }
