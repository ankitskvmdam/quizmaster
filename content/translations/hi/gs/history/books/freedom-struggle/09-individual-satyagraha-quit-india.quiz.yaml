- slug: fs-qim-16
  difficulty: medium
  stem: "निम्नलिखित में से किसने सतारा की 'प्रति सरकार' का नेतृत्व किया?"
  options: { A: "चित्तू पांडे", B: "सियाराम सिंह", C: "यूसुफ मेहरअली", D: "नाना पाटिल" }
  answer: D
  explanation: "नाना पाटिल ने वाई.बी. चव्हाण के साथ सतारा की प्रति सरकार का नेतृत्व किया। चित्तू पांडे बलिया की समानांतर सरकार के प्रमुख थे।"

- slug: fs-qim-17
  difficulty: hard
  stem: "पटना सचिवालय पर झंडा फहराने का प्रयास करते हुए 7 विद्यार्थी किस तिथि को गोली से शहीद हुए?"
