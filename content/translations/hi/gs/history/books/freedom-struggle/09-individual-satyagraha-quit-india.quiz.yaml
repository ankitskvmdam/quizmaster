# खंड 9 — व्यक्तिगत सत्याग्रह और भारत छोड़ो आंदोलन
# ---------- विगत वर्षों के प्रश्न ----------
- slug: fs-qim-01
  difficulty: medium
  stem: "भारत छोड़ो आंदोलन के दौरान निम्नलिखित में से कौन हजारीबाग जेल से भाग निकला?"
  options: { A: "सच्चिदानंद सिन्हा", B: "जयप्रकाश नारायण", C: "जगजीवन राम", D: "रफ़ी अहमद किदवई", E: "उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक" }
  answer: B
  explanation: "जयप्रकाश नारायण नवंबर 1942 में दीपावली की रात हजारीबाग केंद्रीय जेल से भाग निकले। BPSC ने यह परीक्षा रद्द कर दी थी, इसलिए इसकी कोई आधिकारिक उत्तर कुंजी नहीं है।"
  source: "BPSC 67th Prelims (cancelled sitting)"

- slug: fs-qim-02
  difficulty: medium
  stem: "1940 में विनोबा भावे ने व्यक्तिगत सत्याग्रह कहाँ से शुरू किया?"
  options: { A: "गुजरात के खेड़ा जिले के नडियाद से", B: "पवनार, महाराष्ट्र से", C: "पुन्नप्रा-वायलार, केरल से", D: "उपर्युक्त में से एक से अधिक", E: "उपर्युक्त में से कोई नहीं" }
  answer: B
  explanation: "पहले व्यक्तिगत सत्याग्रही विनोबा भावे ने अक्टूबर 1940 में वर्धा के निकट पवनार से सत्याग्रह शुरू किया।"
  source: "BPSC 68th Prelims"

- slug: fs-qim-03
  difficulty: easy
  stem: "“करो या मरो” (DO OR DIE) का नारा किसने और कब दिया?"
  options: { A: "सुभाष चंद्र बोस ने भारत छोड़ो आंदोलन के दौरान", B: "जवाहरलाल नेहरू ने असहयोग आंदोलन के दौरान", C: "गांधीजी ने भारत छोड़ो आंदोलन के दौरान", D: "उपर्युक्त में से एक से अधिक" }
  answer: C
  explanation: "गांधी ने भारत छोड़ो आंदोलन के आरंभ में 8 अगस्त 1942 को बंबई के ग्वालिया टैंक में अपने भाषण में 'करो या मरो' का आह्वान किया।"
  source: "BPSC 70th Prelims"

- slug: fs-qim-04
  difficulty: hard
  stem: "भारत छोड़ो आंदोलन के दौरान कई स्थानों पर समानांतर ‘राष्ट्रीय सरकार’ स्थापित की गई। निम्नलिखित में से कौन-सा सही सुमेलित **नहीं** है?"
  options: { A: "प्रति सरकार – सतारा (महाराष्ट्र)", B: "रैयती सरकार – खेड़ा (गुजरात)", C: "जातीय सरकार – तामलुक (बंगाल)", D: "प्रजा मंडल – तालचेर (उड़ीसा)" }
  answer: B
  explanation: "समानांतर सरकारें सतारा (प्रति सरकार), तामलुक (जातीय सरकार), तालचेर और बलिया में बनीं; खेड़ा में कोई नहीं बनी।"
  source: "BPSC 70th Prelims"

- slug: fs-qim-05
  difficulty: easy
  stem: "“हम या तो भारत को स्वतंत्र कराएँगे या इस प्रयास में मर मिटेंगे …” यह किसने कहा?"
  options: { A: "जवाहरलाल नेहरू", B: "महात्मा गांधी", C: "अबुल कलाम आज़ाद", D: "वी.डी. सावरकर" }
  answer: B
  explanation: "ये शब्द गांधी के 8 अगस्त 1942 के 'करो या मरो' भाषण के हैं, जिससे भारत छोड़ो आंदोलन शुरू हुआ।"
  source: "BPSC 71st Prelims"

- slug: fs-qim-06
  difficulty: medium
  stem: "निम्नलिखित स्वतंत्रता सेनानियों में से किसने भारत छोड़ो आंदोलन के दौरान मुंबई के ग्वालिया टैंक मैदान में भारतीय ध्वज फहराया?"
  options: { A: "अरुणा आसफ अली", B: "सरोजिनी नायडू", C: "तारा रानी श्रीवास्तव", D: "मातंगिनी हाजरा" }
  answer: A
  explanation: "नेताओं की गिरफ्तारी के बाद अरुणा आसफ अली ने 9 अगस्त 1942 को ग्वालिया टैंक मैदान में झंडा फहराया।"
  source: "SSC CGL 2021"

- slug: fs-qim-07
  difficulty: hard
  stem: "निम्नलिखित में से कौन स्वतंत्रता आंदोलन के भारत छोड़ो चरण का एकमात्र ऐसा शहीद था जिसे फाँसी दी गई?"
  options: { A: "पोट्टि श्रीरामुलु", B: "सेनापति बापट", C: "कुशल कोंवर", D: "कन्हैयालाल माणिकलाल मुंशी" }
  answer: C
  explanation: "असम के कुशल कोंवर को 1943 में फाँसी दी गई; उन्हें भारत छोड़ो आंदोलन का एकमात्र ऐसा शहीद माना जाता है जिसे फाँसी हुई।"
  source: "SSC CGL 2021"

- slug: fs-qim-08
  difficulty: easy
  stem: "सी.आर. फॉर्मूला (C R Formula) किस नेता ने दिया?"
  options: { A: "तिलक", B: "सी. आर. दास", C: "महात्मा गांधी", D: "सी. राजगोपालाचारी" }
  answer: D
  explanation: "1944 का सी.आर. फॉर्मूला, जो कांग्रेस और मुस्लिम लीग के बीच समझौते की योजना थी, सी. राजगोपालाचारी ने रखा।"
  source: "SSC CGL 2019"

# ---------- नए प्रश्न ----------
- slug: fs-qim-09
  difficulty: easy
  stem: "1940 में विनोबा भावे के बाद दूसरे व्यक्तिगत सत्याग्रही कौन थे?"
  options: { A: "जवाहरलाल नेहरू", B: "वल्लभभाई पटेल", C: "राजेंद्र प्रसाद", D: "मौलाना अबुल कलाम आज़ाद" }
  answer: A
  explanation: "विनोबा भावे पहले व्यक्तिगत सत्याग्रही थे और जवाहरलाल नेहरू दूसरे।"

- slug: fs-qim-10
  difficulty: easy
  stem: "अखिल भारतीय कांग्रेस समिति ने 8 अगस्त 1942 को भारत छोड़ो प्रस्ताव किस नगर में पारित किया?"
  options: { A: "वर्धा", B: "इलाहाबाद", C: "रामगढ़", D: "बंबई" }
  answer: D
  explanation: "प्रस्ताव 8 अगस्त 1942 को बंबई के ग्वालिया टैंक मैदान में पारित हुआ। कार्यसमिति की बैठक इससे पहले वर्धा में हुई थी।"

- slug: fs-qim-11
  difficulty: easy
  stem: "भारत छोड़ो आंदोलन के दौरान बंबई से गुप्त कांग्रेस रेडियो किसने चलाया?"
  options: { A: "अरुणा आसफ अली", B: "सुचेता कृपलानी", C: "उषा मेहता", D: "कनकलता बरुआ" }
  answer: C
  explanation: "उषा मेहता ने 1942 में बंबई से भूमिगत कांग्रेस रेडियो चलाया।"

- slug: fs-qim-12
  difficulty: easy
  stem: "क्रिप्स मिशन किस वर्ष भारत आया?"
  options: { A: "1942", B: "1940", C: "1944", D: "1946" }
  answer: A
  explanation: "सर स्टैफर्ड क्रिप्स मार्च 1942 में भारत आए; मिशन विफल रहा और वे अप्रैल 1942 में लौट गए।"

- slug: fs-qim-13
  difficulty: medium
  stem: "\"उत्तर-दिनांकित चेक\" (post-dated cheque) कथन गांधी की निम्नलिखित में से किस पर प्रतिक्रिया से जुड़ा है?"
  options: { A: "अगस्त प्रस्ताव", B: "सांप्रदायिक पंचाट", C: "सी.आर. फॉर्मूला", D: "क्रिप्स प्रस्ताव" }
  answer: D
