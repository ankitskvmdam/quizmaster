- slug: fs-ncm-02
  difficulty: hard
  stem: |
    नगरों में असहयोग आंदोलन के संबंध में निम्नलिखित में से कौन-से कथन सही **नहीं** हैं?

    1. आंदोलन में केवल उच्च जाति के और धनी लोगों ने भाग लिया।
    2. परिषद चुनावों का बहिष्कार मद्रास की जस्टिस पार्टी ने भी किया।
    3. हज़ारों छात्रों ने सरकार-नियंत्रित विद्यालय छोड़ दिए, प्रधानाध्यापकों और शिक्षकों ने त्यागपत्र दे दिए और वकीलों ने वकालत छोड़ दी।
  options: { A: "केवल 1 और 3", B: "केवल 2 और 3", C: "केवल 1 और 2", D: "उपर्युक्त में से एक से अधिक", E: "उपर्युक्त में से कोई नहीं" }
  answer: C
  explanation: "कथन 1 गलत है क्योंकि नगरों में मध्य वर्ग ने भाग लिया। कथन 2 गलत है क्योंकि मद्रास की जस्टिस पार्टी ने परिषद चुनाव लड़ा। कथन 3 सही है।"
  source: "BPSC 68th Prelims"

- slug: fs-ncm-03
  difficulty: medium
