# खंड 6 — असहयोग आंदोलन और स्वराज पार्टी
# ---------- विगत वर्षों के प्रश्न ----------
- slug: fs-ncm-01
  difficulty: easy
  stem: "1923 में स्वराज पार्टी की स्थापना किसने की?"
  options: { A: "महात्मा गांधी", B: "वल्लभभाई पटेल", C: "सी. आर. दास और मोतीलाल नेहरू", D: "बी. आर. अंबेडकर", E: "उपर्युक्त में से कोई नहीं/उपर्युक्त में से एक से अधिक" }
