  stem: "1 अगस्त 1920 को, जिस दिन असहयोग आंदोलन शुरू हुआ, किस नेता का निधन हुआ?"
  options: { A: "गोपाल कृष्ण गोखले", B: "बाल गंगाधर तिलक", C: "दादाभाई नौरोजी", D: "फिरोज़शाह मेहता" }
  answer: B
