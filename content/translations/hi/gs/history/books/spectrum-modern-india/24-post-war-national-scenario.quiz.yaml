    1. महाशक्तियों के रूप में उभरे अमेरिका और सोवियत संघ, दोनों भारत की स्वतंत्रता के पक्ष में थे।
    2. पिछले चुनाव केंद्र और प्रांतों, दोनों के लिए 1937 में हुए थे।
