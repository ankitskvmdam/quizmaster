    2. प्रांतों को पूर्ण स्वायत्तता और अवशिष्ट शक्तियाँ प्राप्त होनी थीं।
    3. 10 वर्ष बाद कोई प्रांत समूह या संघ के संविधान पर पुनर्विचार की माँग करने के लिए स्वतंत्र होता।
    4. कोई प्रांत पहले आम चुनावों से पहले ही समूह से बाहर आने के लिए स्वतंत्र था।

