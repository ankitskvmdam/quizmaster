    2. नेहरू ने इसमें भारतीय राष्ट्रीय कांग्रेस की ओर से नहीं, बल्कि व्यक्तिगत हैसियत से भाग लिया था।
    3. नेहरू, अन्य लोगों के साथ आइंस्टीन और जॉर्ज लैंसबरी सहित, इसके मानद अध्यक्षों में से एक थे।

