- slug: smi-10-h01
  difficulty: hard
  stem: |
    इंडियन एसोसिएशन ऑफ कलकत्ता के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. इसने इंडियन लीग का स्थान लिया।
