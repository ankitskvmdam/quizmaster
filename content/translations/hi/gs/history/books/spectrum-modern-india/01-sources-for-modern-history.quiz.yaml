  stem: |
    अंग्रेज़ों के अतिरिक्त अन्य यूरोपीय शक्तियों के अभिलेखों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. चंद्रनगर और पांडिचेरी के फ्रांसीसी अभिलेख, फ्रांसीसियों द्वारा ये बस्तियाँ छोड़ने से पहले, पेरिस ले जाए गए।
