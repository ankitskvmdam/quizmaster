  stem: |
    न्यायिक सुधारों के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. वारेन हेस्टिंग्स के समय सदर निज़ामत अदालत मुर्शिदाबाद में एक उप-निज़ाम के अधीन कार्य करती थी।
    2. कॉर्नवालिस ने सदर निज़ामत अदालत को इलाहाबाद स्थानांतरित किया।
    3. कॉर्नवालिस के समय कलेक्टर केवल राजस्व प्रशासन के लिए उत्तरदायी रह गया, उसके पास कोई मजिस्ट्रेटी कार्य नहीं रहे।

    उपर्युक्त कथनों में से कौन-सा/से सही है/हैं?
  options: { A: "केवल 1 और 3", B: "केवल 1", C: "केवल 2 और 3", D: "1, 2 और 3", E: "उपर्युक्त में से कोई नहीं" }
  answer: A
  explanation: "कॉर्नवालिस ने सदर निज़ामत अदालत को कलकत्ता स्थानांतरित किया; इलाहाबाद में सदर अदालतें बेंटिक के समय स्थापित हुईं।"
  source: "Spectrum (2019-20), pp. 521-522"
  tags: [bpsc]

- slug: smi-26-h10
  difficulty: hard
  stem: |
    कॉर्नवालिस के समय स्थापित दीवानी अदालतों के क्रम में निम्नलिखित को निम्नतम से उच्चतम तक व्यवस्थित कीजिए:

    1. रजिस्ट्रार की अदालत
    2. सदर दीवानी अदालत
    3. मुंसिफ़ की अदालत
    4. सर्किट अदालत
  options: { A: "1, 3, 4, 2", B: "3, 1, 4, 2", C: "3, 4, 1, 2", D: "3, 1, 2, 4", E: "उपर्युक्त में से कोई नहीं" }
  answer: B
  explanation: "क्रम था: मुंसिफ़ की अदालत, रजिस्ट्रार की अदालत, ज़िला अदालत, सर्किट अदालत, सदर दीवानी अदालत और अंत में किंग-इन-काउंसिल।"
  source: "Spectrum (2019-20), p. 522"
  tags: [bpsc]

- slug: smi-26-h11
  difficulty: hard
  stem: |
    निम्नलिखित को कालानुक्रम में व्यवस्थित कीजिए:

    1. भारतीय दंड संहिता
    2. दंड प्रक्रिया संहिता
    3. सिविल प्रक्रिया संहिता
    4. सर्वोच्च न्यायालय और सदर अदालतों का उच्च न्यायालयों में विलय
  options: { A: "3, 1, 2, 4", B: "1, 3, 2, 4", C: "1, 2, 3, 4", D: "3, 2, 1, 4" }
  answer: A
  explanation: "सिविल प्रक्रिया संहिता 1859, भारतीय दंड संहिता 1860, दंड प्रक्रिया संहिता 1861, उच्च न्यायालय 1865।"
  source: "Spectrum (2019-20), p. 523"
  tags: [ssc]

- slug: smi-26-h12
  difficulty: hard
  stem: |
    1882 के रिपन के प्रस्ताव के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. स्थानीय निकायों में गैर-सरकारी सदस्यों का बहुमत होना था।
    2. इन निकायों के अध्यक्ष गैर-सरकारी व्यक्ति होने थे।
    3. ऋण लेने और नए कर लगाने के लिए अब भी सरकारी कार्यपालिका की स्वीकृति आवश्यक थी।
    4. लॉर्ड कर्ज़न ने बाद में इसके अनुरूप स्थानीय निकायों पर सरकारी नियंत्रण घटाया।

    उपर्युक्त कथनों में से कौन-से सही हैं?
  options: { A: "केवल 1 और 2", B: "केवल 1, 2 और 3", C: "केवल 2, 3 और 4", D: "1, 2, 3 और 4", E: "उपर्युक्त में से कोई नहीं" }
  answer: B
  explanation: "साम्राज्यवाद के 'महापुरोहित' लॉर्ड कर्ज़न ने वास्तव में स्थानीय निकायों पर सरकारी नियंत्रण बढ़ाने के कदम उठाए।"
  source: "Spectrum (2019-20), pp. 528-529"
  tags: [bpsc]

- slug: smi-26-h13
  difficulty: hard
  stem: "साइमन कमीशन (मई 1930) ने किन प्रांतों को छोड़कर अन्यत्र ग्राम पंचायतों की प्रगति के अभाव की ओर संकेत किया?"
  options: { A: "बंबई, बंगाल और बिहार", B: "पंजाब, संयुक्त प्रांत और मद्रास", C: "संयुक्त प्रांत, बंगाल और मद्रास", D: "मद्रास, बंबई और बिहार", E: "उपर्युक्त में से एक से अधिक" }
  answer: C
  explanation: "आयोग ने पाया कि संयुक्त प्रांत, बंगाल और मद्रास को छोड़कर ग्राम पंचायतों की प्रगति बहुत कम थी, और स्थानीय निकायों पर अधिक प्रांतीय नियंत्रण का सुझाव दिया।"
  source: "Spectrum (2019-20), p. 531"
  tags: [bpsc]

- slug: smi-26-h14
  difficulty: hard
  stem: |
    ब्रिटिश शासन के अधीन सेना के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. 1859 और 1879 के आयोगों ने 1857 से पहले के 14 प्रतिशत की तुलना में एक-तिहाई श्वेत सेना पर बल दिया।
    2. भारतीयों को 1914 से कमीशन प्राप्त पदों पर आने की अनुमति दी गई।
    3. विद्रोह में भाग लेने वाले अवध, बिहार, मध्य भारत और दक्षिण भारत के सैनिकों को गैर-लड़ाकू घोषित किया गया।
    4. 1926 में भारतीय सैंडहर्स्ट समिति ने 1952 तक 50 प्रतिशत भारतीयकृत अधिकारी संवर्ग की परिकल्पना की।

    उपर्युक्त कथनों में से कौन-से सही हैं?
  options: { A: "केवल 1 और 3", B: "केवल 2 और 4", C: "केवल 1, 2 और 3", D: "केवल 1, 3 और 4", E: "उपर्युक्त में से कोई नहीं" }
  answer: D
  explanation: "1914 तक कोई भारतीय अधिकतम सूबेदार के पद तक पहुँच सकता था; भारतीयों को कमीशन प्राप्त पदों पर केवल 1918 से अनुमति मिली।"
  source: "Spectrum (2019-20), pp. 519-520"
  tags: [bpsc]

- slug: smi-26-h15
  difficulty: hard
  stem: |
    भारतीय परिषद अधिनियम, 1861 के अंतर्गत विधान परिषद के संबंध में निम्नलिखित कथनों पर विचार कीजिए:

    1. वायसराय छह से बारह अतिरिक्त सदस्य जोड़ सकता था, जिनमें कम से कम आधे गैर-सरकारी होने थे।
    2. इसका बजट पर नियंत्रण था, परंतु यह कार्यपालिका के कार्यों पर चर्चा नहीं कर सकती थी।
    3. वायसराय आपात स्थिति में छह महीने की वैधता वाले अध्यादेश जारी कर सकता था।

    उपर्युक्त कथनों में से कौन-सा/से सही है/हैं?
  options: { A: "केवल 1", B: "केवल 1 और 3", C: "केवल 2 और 3", D: "1, 2 और 3", E: "उपर्युक्त में से कोई नहीं" }
  answer: B
  explanation: "1861 की विधान परिषद का बजट पर कोई नियंत्रण नहीं था; कथन 1 और 3 सही हैं।"
  source: "Spectrum (2019-20), p. 526"
  tags: [bpsc]
