# Modern — practice questions (Lota Rebellion note)
# ---------- EASY ----------
- slug: note-lota-e01
  difficulty: easy
  stem: "बिहार का लोटा विद्रोह मुख्य रूप से किस जेल के कैदियों से जुड़ा है?"
  options: { A: "पटना जेल", B: "भागलपुर जेल", C: "मुज़फ़्फ़रपुर जेल", D: "गया जेल", E: "उपर्युक्त में से कोई नहीं" }
  answer: C
  explanation: "यह विरोध तिरहुत की मुज़फ़्फ़रपुर जेल के कैदियों में भड़का, जिनके समर्थन में वहाँ के शहरवासी और रैयत निकल आए।"
  source: "Heritage Times (M. Sajjad); Sanskriti IAS BPSC notes"
  tags: [bpsc]

- slug: note-lota-e02
  difficulty: easy
  stem: "लोटा विद्रोह में कैदियों ने विरोध किया क्योंकि उनके किस धातु के लोटों के स्थान पर मिट्टी के बर्तन दिए गए?"
  options: { A: "पीतल", B: "लोहा", C: "चाँदी", D: "एल्युमिनियम", E: "उपर्युक्त में से कोई नहीं" }
  answer: A
  explanation: "जेल अधिकारियों ने कैदियों के पीतल के लोटे वापस लेकर उनके स्थान पर मिट्टी के बर्तन दिए।"
  source: "Heritage Times (M. Sajjad); Sanskriti IAS BPSC notes"
  tags: [bpsc]

# ---------- MEDIUM ----------
- slug: note-lota-m01
  difficulty: medium
  stem: "बिहार में लोटा विद्रोह का तात्कालिक कारण क्या था?"
  options: { A: "कैदियों को दिए जाने वाले भोजन पर नया कर", B: "कैदियों का बिहार से बाहर की जेलों में स्थानांतरण", C: "जेल के बाहर सड़कों पर कैदियों से बेगार", D: "कैदियों के पीतल के लोटों के स्थान पर मिट्टी के बर्तन देना", E: "उपर्युक्त में से एक से अधिक" }
  answer: D
  explanation: "कैदियों ने उस आदेश के विरुद्ध विद्रोह किया जिसमें उनके पीतल के लोटों के स्थान पर मिट्टी के बर्तन दिए गए; उन्होंने इसे अपने धर्म और जाति पर आघात माना।"
  source: "Heritage Times (M. Sajjad); EduRev BPSC notes"
  tags: [bpsc]

- slug: note-lota-m02
  difficulty: medium
  stem: "ब्रिटिश अधिकारियों ने अंततः लोटा विद्रोह पर क्या प्रतिक्रिया दी?"
  options: { A: "उन्होंने सेना से इसे कुचल दिया और मिट्टी के बर्तन जारी रखे", B: "उन्होंने आदेश वापस ले लिया और फिर से पीतल के लोटों की अनुमति दी", C: "उन्होंने मुज़फ़्फ़रपुर जेल बंद कर दी", D: "उन्होंने केवल हिंदू कैदियों को पीतल के लोटों की अनुमति दी", E: "उपर्युक्त में से कोई नहीं" }
  answer: B
  explanation: "कैदियों और जनता के विरोध के सामने सरकार ने अपना आदेश वापस ले लिया और पीतल के लोटों की फिर से अनुमति दी गई।"
  source: "Heritage Times (M. Sajjad); Sanskriti IAS BPSC notes"
  tags: [bpsc]

# ---------- HARD ----------
- slug: note-lota-h01
  difficulty: hard
  stem: "1857 के विद्रोह से पहले जेलों में पीतल के लोटों के स्थान पर मिट्टी के बर्तन देने का विरोध वर्तमान बिहार की किस/किन जेल/जेलों से दर्ज हुआ?"
  options: { A: "मुज़फ़्फ़रपुर", B: "आरा", C: "पटना", D: "पूर्णिया", E: "उपर्युक्त में से एक से अधिक" }
  answer: E
  explanation: "विवरणों में मुज़फ़्फ़रपुर (तिरहुत) और आरा (शाहाबाद) दोनों के नाम हैं; मुज़फ़्फ़रपुर के विरोध को सबसे अधिक जन-समर्थन मिला।"
  source: "Heritage Times (M. Sajjad); EduRev BPSC notes"
  tags: [bpsc]

- slug: note-lota-h02
  difficulty: hard
  stem: |
    लोटा विद्रोह के संबंध में निम्नलिखित कथनों पर विचार कीजिए:
    1. कैदियों ने अपने पीतल के लोटों के बदले जाने को अपनी धार्मिक और जातिगत भावनाओं पर आघात माना।
    2. मुज़फ़्फ़रपुर के शहरवासी और रैयत कैदियों के समर्थन में निकल आए।
    3. यह मेरठ में 1857 का विद्रोह शुरू होने के बाद भड़का।

    उपर्युक्त कथनों में से कौन-सा/से सही है/हैं?
  options: { A: "केवल 1", B: "केवल 2", C: "केवल 1 और 2", D: "1, 2 और 3", E: "उपर्युक्त में से कोई नहीं" }
  answer: C
  explanation: "कथन 1 और 2 सही हैं। लोटा विद्रोह 1857 के विद्रोह से पहले हुआ था, उसके शुरू होने के बाद नहीं।"
  source: "Heritage Times (M. Sajjad); Sanskriti IAS BPSC notes"
  tags: [bpsc]
