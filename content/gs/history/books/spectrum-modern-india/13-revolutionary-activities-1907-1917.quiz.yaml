# Chapter 13 — First Phase of Revolutionary Activities (1907-1917) (book pp. 282-293)
# ---------- EASY ----------
- slug: smi-13-e01
  difficulty: easy
  stem: "In 1908, a bomb was thrown at Muzaffarpur at a carriage supposed to be carrying the judge Kingsford. Who threw it?"
  options: { A: "Barindra Kumar Ghosh and Ullaskar Dutt", B: "Prafulla Chaki and Khudiram Bose", C: "Satyendranath Bose and Kanailal Dutta", D: "Rashbehari Bose and Sachin Sanyal", E: "More than one of the above" }
  answer: B
  explanation: "In 1908 Prafulla Chaki and Khudiram Bose threw a bomb at the carriage at Muzaffarpur; Kingsford was not in it."
  source: "Spectrum (2019-20), p. 284"
  tags: [bpsc]

- slug: smi-13-e02
  difficulty: easy
  stem: "The Anushilan Samiti of Calcutta (1902) was founded by"
