  options: { A: "22", B: "37", C: "45", D: "370" }
  answer: A
  explanation: "When the passengers refused to board the Punjab-bound train, 22 persons died in the clash at Budge Budge near Calcutta."
  source: "Spectrum (2019-20), p. 289"
  tags: [ssc]

# ---------- MEDIUM ----------
- slug: smi-13-m01
  difficulty: medium
  stem: "The Alipore conspiracy case, in which Aurobindo and Barindra Ghosh were tried, was also called the"
  options: { A: "Delhi conspiracy case", B: "Nasik conspiracy case", C: "Manicktolla bomb conspiracy", D: "Barrah conspiracy" }
  answer: C
  explanation: "The Alipore case was variously called the Manicktolla bomb conspiracy or Muraripukur conspiracy, after Barindra Ghosh's house on Muraripukur Road in Manicktolla."
  source: "Spectrum (2019-20), p. 284"
  tags: [ssc]

- slug: smi-13-m02
  difficulty: medium
  stem: |
    Match List I (journal) with List II (person associated):

    | List I | List II |
    |---|---|
    | a. Punjabee | 1. Madam Bhikaji Cama |
    | b. Bharat Mata | 2. Shyamji Krishnavarma |
    | c. Bande Mataram | 3. Ajit Singh |
    | d. The Indian Sociologist | 4. Lala Lajpat Rai |
  options: { A: "a-3, b-4, c-1, d-2", B: "a-4, b-3, c-2, d-1", C: "a-4, b-1, c-3, d-2", D: "a-4, b-3, c-1, d-2", E: "None of the above" }
  answer: D
  explanation: "Lajpat Rai brought out Punjabee, Ajit Singh's group had Bharat Mata, Madam Cama brought out Bande Mataram, and Shyamji Krishnavarma The Indian Sociologist."
  source: "Spectrum (2019-20), pp. 287-288"
  tags: [bpsc]

- slug: smi-13-m03
  difficulty: medium
  stem: |
    Arrange the following events in Maharashtra in chronological order:

    1. Killing of A.M.T. Jackson, Collector of Nasik
    2. Murder of Rand by the Chapekar brothers
    3. Formation of Mitra Mela by Savarkar and his brother
    4. Organisation of the Ramosi Peasant Force
  options: { A: "4, 2, 3, 1", B: "4, 3, 2, 1", C: "2, 4, 3, 1", D: "4, 2, 1, 3", E: "None of the above" }
  answer: A
  explanation: "Ramosi Peasant Force (1879), Rand murdered (1897), Mitra Mela (1899), Jackson killed (1909)."
  source: "Spectrum (2019-20), p. 286"
  tags: [bpsc]

- slug: smi-13-m04
  difficulty: medium
  stem: "A.M.T. Jackson, Collector of Nasik and a well-known indologist, was killed in 1909 by"
  options: { A: "Madanlal Dhingra", B: "Anant Lakshman Kanhere", C: "Damodar Chapekar", D: "Kanailal Dutta" }
  answer: B
  explanation: "Jackson was killed by Anant Lakshman Kanhere, a member of Abhinav Bharat."
  source: "Spectrum (2019-20), p. 286"
  tags: [ssc]

- slug: smi-13-m05
  difficulty: medium
  stem: "Who was known to be behind the plan of the 1912 bomb attack on Viceroy Hardinge but evaded arrest, reportedly in disguise?"
  options: { A: "Sachin Sanyal", B: "Basant Kumar Biswas", C: "Rashbehari Bose", D: "Avadh Behari" }
  answer: C
  explanation: "After the Delhi Conspiracy trial, Rashbehari Bose was known as the person behind the plan but evaded arrest, it is said, in a disguise."
  source: "Spectrum (2019-20), p. 285"
  tags: [ssc]

- slug: smi-13-m06
  difficulty: medium
  stem: "According to the book, the Defence of India Act of March 1915 was passed primarily to"
  options: { A: "intern radical pan-Islamists such as the Ali brothers", B: "suppress the Anushilan Samiti in Bengal", C: "punish the Singapore mutineers", D: "smash the Ghadr movement" }
  answer: D
  explanation: "The Defence of India Act, passed in March 1915, was meant primarily to smash the Ghadr movement."
  source: "Spectrum (2019-20), p. 290"
  tags: [ssc]

- slug: smi-13-m07
  difficulty: medium
  stem: "Which two events of 1914 encouraged the Ghadrites' plans for a revolt in India?"
  options: { A: "The Komagata Maru incident and the outbreak of the First World War", B: "The Singapore mutiny and the Delhi Conspiracy trial", C: "Montagu's statement and the outbreak of the First World War", D: "The Komagata Maru incident and the founding of the Berlin Committee" }
  answer: A
  explanation: "The book names two events of 1914 — the Komagata Maru incident and the outbreak of the First World War."
  source: "Spectrum (2019-20), p. 289"
  tags: [ssc]

- slug: smi-13-m08
  difficulty: medium
  stem: "The Berlin Committee for Indian Independence (1915) was established by"
  options: { A: "Raja Mahendra Pratap, Barkatullah and Obaidullah Sindhi", B: "Virendranath Chattopadhyay, Bhupendranath Dutta and Lala Hardayal", C: "Shyamji Krishnavarma, Savarkar and Madanlal Dhingra", D: "Rashbehari Bose, Abani Mukherji and Sachin Sanyal" }
  answer: B
  explanation: "It was set up by Virendranath Chattopadhyay, Bhupendranath Dutta, Lala Hardayal and others with German foreign office help; Mahendra Pratap's group went on the Kabul mission."
  source: "Spectrum (2019-20), p. 290"
  tags: [ssc]

- slug: smi-13-m09
  difficulty: medium
  stem: "Bagha Jatin revitalised the links between the central Jugantar organisation in Calcutta and other places in"
  options: { A: "Punjab, Delhi and United Provinces", B: "Assam and Eastern Bengal only", C: "Maharashtra and Gujarat", D: "Bengal, Bihar and Orissa", E: "None of the above" }
  answer: D
  explanation: "Jatin revitalised links between Calcutta and other places in Bengal, Bihar and Orissa; Rashbehari Bose's society covered Punjab, Delhi and UP."
  source: "Spectrum (2019-20), p. 285"
  tags: [bpsc]

- slug: smi-13-m10
  difficulty: medium
  stem: "The Ghadrites fixed February 21, 1915 as the date for an armed revolt in the garrisons of"
  options: { A: "Lahore, Amritsar and Delhi", B: "Meerut, Lahore and Rawalpindi", C: "Ferozepur, Lahore and Rawalpindi", D: "Ferozepur, Ambala and Meerut", E: "More than one of the above" }
  answer: C
  explanation: "The revolt was fixed for February 21, 1915 in Ferozepur, Lahore and Rawalpindi garrisons, but was foiled by treachery."
  source: "Spectrum (2019-20), p. 290"
  tags: [bpsc]

# ---------- HARD ----------
- slug: smi-13-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Muzaffarpur bomb incident:

    1. It took place in 1908.
    2. Prafulla Chaki was tried and hanged, while Khudiram Bose shot himself dead.
    3. The judge Kingsford was not in the carriage, and two British ladies were killed instead.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "It was the reverse: Prafulla Chaki shot himself dead and Khudiram Bose was tried and hanged."
  source: "Spectrum (2019-20), p. 284"
  tags: [bpsc]

- slug: smi-13-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Alipore conspiracy case:

    1. Aurobindo Ghosh was acquitted, the judge condemning the flimsy evidence against him.
    2. Barindra Ghosh and Ullaskar Dutt were sentenced to death, later commuted to life imprisonment.
    3. The approver Narendra Gosain was shot dead in jail by Satyendranath Bose and Kanailal Dutta.

    Which of the statements given above is/are correct?
  options: { A: "1, 2 and 3", B: "1 and 2 only", C: "2 and 3 only", D: "1 and 3 only", E: "None of the above" }
  answer: A
  explanation: "All three are stated in the book: Aurobindo was acquitted, Barindra (head) and Ullaskar (bomb maker) had death sentences commuted, and Gosain was shot by two co-accused."
  source: "Spectrum (2019-20), pp. 284-285"
  tags: [bpsc]

- slug: smi-13-h03
  difficulty: hard
  stem: |
    **Assertion (A):** Rashbehari Bose escaped to Japan in 1915 after the Ghadr plan for revolt failed.

    **Reason (R):** Rashbehari Bose had been transported for life after the failure of the February 1915 plan.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "Rashbehari Bose fled to Japan in 1915; it was Sachin Sanyal who was transported for life."
  source: "Spectrum (2019-20), p. 290"
  tags: [bpsc]

- slug: smi-13-h04
  difficulty: hard
  stem: |
    Consider the following statements about the Ghadr movement:

    1. Earlier activists had set up a 'Swadesh Sevak Home' at Vancouver and 'United India House' at Seattle.
    2. The Ghadr was finally established in 1913.
    3. Its achievement lay in the realm of ideology, preaching militant nationalism with a completely secular approach.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book; politically and militarily, however, the Ghadr failed for lack of organised leadership."
  source: "Spectrum (2019-20), pp. 289-290"
  tags: [bpsc]

- slug: smi-13-h05
  difficulty: hard
  stem: |
    **Assertion (A):** The Punjab political dacoities of January-February 1915 had a somewhat new social content.

    **Reason (R):** In at least three of the five main cases, the raiders targeted the moneylenders and the debt records before decamping with the cash.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book cites the targeting of moneylenders and debt records as the new social content of these dacoities."
  source: "Spectrum (2019-20), p. 290"
  tags: [bpsc]

- slug: smi-13-h06
  difficulty: hard
  stem: |
    Consider the following statements about the mutiny in Singapore:

    1. It took place on February 15, 1915.
    2. It involved the Punjabi Muslim 5th Light Infantry and the 36th Sikh battalion.
    3. After it was crushed, 45 persons were executed and 41 transported for life.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "37 persons were executed after the Singapore mutiny; 45 is the number hanged after the failed Ghadr revolt in India."
  source: "Spectrum (2019-20), p. 291"
  tags: [bpsc]

- slug: smi-13-h07
  difficulty: hard
  stem: |
    Which of the following are given in the book as reasons for the temporary respite in revolutionary activity after the First World War?

    1. Release of prisoners held under the Defence of India Rules
    2. Atmosphere of conciliation after Montagu's August 1917 statement
    3. Arrival of Gandhi with the programme of non-violent non-cooperation

    Select the correct answer using the codes given below.
  options: { A: "1 only", B: "1 and 2 only", C: "1, 2 and 3", D: "2 and 3 only", E: "None of the above" }
  answer: C
  explanation: "The book lists all three: release of prisoners, conciliation after Montagu's statement and talk of reforms, and Gandhi's new programme."
  source: "Spectrum (2019-20), p. 291"
  tags: [bpsc]

- slug: smi-13-h08
  difficulty: hard
  stem: |
    Consider the following statements about Indian revolutionaries abroad:

    1. Madam Bhikaji Cama, a Parsi revolutionary, operated from Paris and Geneva.
    2. After 1909, Virendranath Chattopadhyaya chose Berlin as his base.
    3. A mission of Raja Mahendra Pratap Singh, Barkatullah and Obaidullah Sindhi went to Kabul to organise a 'provisional Indian government'.
    4. Savarkar was extradited in 1910 and transported for life in the Delhi conspiracy case.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Savarkar was transported for life in the Nasik conspiracy case, not the Delhi conspiracy case; the other statements are correct."
  source: "Spectrum (2019-20), pp. 288, 291"
  tags: [bpsc]

- slug: smi-13-h09
  difficulty: hard
  stem: "Which one of the following was NOT among those convicted and executed at the end of the Delhi Conspiracy trial?"
  options: { A: "Basant Kumar Biswas", B: "Rashbehari Bose", C: "Amir Chand", D: "Avadh Behari", E: "More than one of the above" }
  answer: B
  explanation: "Basant Kumar Biswas, Amir Chand and Avadh Behari were executed; Rashbehari Bose evaded arrest."
  source: "Spectrum (2019-20), p. 285"
  tags: [bpsc]

- slug: smi-13-h10
  difficulty: hard
  stem: |
    Consider the following statements about extremism in the Punjab:

    1. Ajit Singh, Bhagat Singh's uncle, organised the Anjuman-i-Mohisban-i-Watan in Lahore with its journal Bharat Mata.
    2. Before turning to extremism, Ajit Singh's group urged non-payment of revenue and water rates among Chenab colonists and Bari Doab peasants.
    3. In May 1907 the government banned political meetings and deported Lala Lajpat Rai and Bhai Parmanand.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "In May 1907 Lajpat Rai and Ajit Singh were deported, not Bhai Parmanand; statements 1 and 2 are correct."
  source: "Spectrum (2019-20), p. 287"
  tags: [bpsc]
