- slug: smi-13-e09
  difficulty: easy
  stem: "In their methods, the early Indian revolutionaries chose to follow the footsteps of"
  options: { A: "Mazzini's Young Italy", B: "the Russian nihilists or the Irish nationalists", C: "the French socialists", D: "the rebels of 1857" }
  answer: B
  explanation: "Finding mass revolution or subverting the Army impractical, they followed the Russian nihilists or Irish nationalists, relying on individual heroic actions."
  source: "Spectrum (2019-20), p. 283"
  tags: [ssc]

- slug: smi-13-e10
  difficulty: easy
