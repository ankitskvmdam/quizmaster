  tags: [bpsc]

- slug: smi-06-h13
  difficulty: hard
  stem: |
    Consider the following statements about the peasants and the Revolt of 1857:
    1. Peasant participation was active in all areas affected by the revolt.
    2. In Avadh, land was restored to the taluqdars, and the peasants could not avail of the 1859 Bengal Rent Act.
    3. In some regions, peasants had to pay an additional cess as punishment for taking part in the revolt.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 2 and 3 are correct. Peasant participation was active only in some areas, mainly western Uttar Pradesh."
  source: "Spectrum (2019-20), p. 153"
  tags: [bpsc]

- slug: smi-06-h14
  difficulty: hard
  stem: "How many rebellions took place among the Moplahs of Malabar between 1836 and 1854?"
  options: { A: "Twelve", B: "Eighteen", C: "Twenty-two", D: "Thirty-two" }
  answer: C
  explanation: "Twenty-two rebellions took place between 1836 and 1854, though none proved successful."
  source: "Spectrum (2019-20), p. 153"
  tags: [ssc]

