- slug: smi-06-h10
  difficulty: hard
  stem: |
    Consider the following statements about the tribal revolts of the north-eastern frontier under British rule:
    1. They were not forest-based or agrarian revolts, as these tribals were generally in control of land and forest.
    2. They continued for a longer time than the non-frontier tribal movements.
    3. Sanskritisation movements were widespread among the north-eastern frontier tribals in the colonial period.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 2 are correct. Sanskritisation movements were almost totally absent in the north-east frontier region in the colonial period."
  source: "Spectrum (2019-20), p. 154"
  tags: [bpsc]

- slug: smi-06-h11
  difficulty: hard
  stem: "The struggle in Gumsur, which continued after the death of Dhananjay Bhanj, ended in February 1837 with the arrest of"
  options: { A: "Strikara Bhanj", B: "Jagannath Deo", C: "Narayan Deo", D: "Doora Bisayi" }
