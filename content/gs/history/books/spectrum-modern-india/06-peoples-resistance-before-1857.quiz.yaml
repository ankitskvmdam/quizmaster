  explanation: "The struggle lasted till February 1837, when Doora Bisayi, a formidable leader, was arrested and the Gumsur zamindari was forfeited."
  source: "Spectrum (2019-20), p. 144"
  tags: [ssc]

- slug: smi-06-h12
  difficulty: hard
  stem: |
    Match the urban protests (List I) with the tax that provoked them (List II):

    | List I | List II |
    |---|---|
    | a. Benares, 1810 | 1. Salt duty |
    | b. Surat, 1814 | 2. House tax |
    | c. Bareilly, 1816 | 3. Police tax |
  options: { A: "a-1, b-2, c-3", B: "a-2, b-3, c-1", C: "a-3, b-1, c-2", D: "a-2, b-1, c-3", E: "None of the above" }
  answer: D
  explanation: "Benares (1810) protested a house tax, Surat (1814) the salt duty, and Bareilly (1816) the police tax and municipal taxes."
