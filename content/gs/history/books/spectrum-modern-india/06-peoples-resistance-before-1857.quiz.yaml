# ---------- HARD ----------
- slug: smi-06-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Kol Mutiny (1831):
    1. The Kols were inhabitants of Chhotanagpur, which covered Ranchi, Singhbhum, Hazaribagh, Palamau and western Manbhum.
    2. The trouble began with large-scale transfers of land from Kol headmen to outsiders.
    3. The Kol rebels killed or burnt about ten thousand outsiders.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. The book says the Kol rebels killed or burnt about a thousand outsiders, not ten thousand."
  source: "Spectrum (2019-20), p. 156"
  tags: [bpsc]

- slug: smi-06-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Santhal Rebellion:
    1. The Santhals were mainly a hunting people who had always lived on the hilltops of the Rajmahal hills.
    2. It began against zamindars and money-lenders, who had police support, and later turned into an anti-British movement.
    3. The Santhals proclaimed an end to Company rule.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 2 and 3 are correct. The book calls the Santhals an agricultural people who had fled to settle in the plains of the Rajmahal hills."
  source: "Spectrum (2019-20), p. 157"
  tags: [bpsc]

- slug: smi-06-h03
  difficulty: hard
  stem: |
    **Assertion (A):** After 1849 the English dominion in India became the sole target of the Wahabis' attacks.

    **Reason (R):** The Sikh kingdom of Punjab, against which the Wahabis had declared jihad, was defeated and incorporated into the Company's dominion in 1849.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says that after the defeat of the Sikh ruler and the incorporation of Punjab in 1849, the English became the Wahabis' sole target, so R explains A."
  source: "Spectrum (2019-20), p. 151"
  tags: [bpsc]

- slug: smi-06-h04
  difficulty: hard
  stem: |
    Consider the following statements about the Ho and Munda uprisings:
    1. The first Ho revolt continued till 1827, when the Ho tribals were forced to submit.
    2. In 1831 the Hos, joined by the Mundas of Chotanagpur, protested against the newly introduced farming revenue policy and the entry of Bengalis.
    3. Though the revolt was extinguished in 1832, the Ho operations continued till 1837.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book's account of the Ho and Munda uprisings (1820-1837)."
  source: "Spectrum (2019-20), p. 157"
  tags: [bpsc]

- slug: smi-06-h05
  difficulty: hard
  stem: |
    Consider the following statements about the Chuar uprisings:
    1. In 1768, when Jagannath Singh, zamindar of Ghatsila, rose with thousands of Chuars, the Company government capitulated.
    2. The 1771 rising of the Chuar sardars Shyam Ganjan, Subla Singh and Dubraj also forced the Company to capitulate.
    3. Some historians consider the term 'Chuar' derogatory and call it the Revolt of the Jungle Mahal.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Statements 1 and 3 are correct. The 1771 rising of the Chuar sardars was suppressed."
  source: "Spectrum (2019-20), p. 156"
  tags: [bpsc]

- slug: smi-06-h06
  difficulty: hard
  stem: |
    Consider the following statements about the Paika Rebellion:
    1. The Paiks enjoyed rent-free land tenures on a hereditary basis for military service and policing.
    2. The spark was the arrival of a body of Khonds from Gumsur into Khurda territory in March 1817.
    3. The rebellion failed to secure any relief for the people of the province.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Statements 1 and 2 are correct. The book says the rebellion won large remissions of arrears, reduced assessments and a new settlement on fixed tenures."
  source: "Spectrum (2019-20), pp. 148-149"
  tags: [bpsc]

- slug: smi-06-h07
  difficulty: hard
  stem: "Whose betrayal led to the capture of Kattabomman after he fled into the Pudukottai forests?"
  options: { A: "Marathu Pandian", B: "Oomathurai", C: "Ettappan, Raja of Pudukottai", D: "Subramania Pillai" }
  answer: C
  explanation: "Ettappan, the Raja of Pudukottai, made an agreement with the British, which led to Kattabomman's capture and hanging."
  source: "Spectrum (2019-20), p. 144"
  tags: [ssc]

- slug: smi-06-h08
  difficulty: hard
  stem: "The poligars of North Arcot rebelled between 1803 and 1805 when they were deprived of their right to collect"
  options: { A: "chauth", B: "kaval fees", C: "sardeshmukhi", D: "salt duty" }
