# ---------- HARD ----------
- slug: smi-15-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Champaran Satyagraha:

    1. Gandhi was joined by Rajendra Prasad, Mazhar-ul-Haq, Mahadeo Desai, Narhari Parekh and J.B. Kripalani.
    2. The government appointed a committee to go into the matter and nominated Gandhi as a member.
    3. Within a decade, the planters left the area.
    4. It was the occasion of Gandhi's first hunger strike in India.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "Gandhi's first hunger strike was during the Ahmedabad Mill Strike (1918); the other three statements are from the book."
  source: "Spectrum (2019-20), p. 317"
  tags: [bpsc]

- slug: smi-15-h02
  difficulty: hard
  stem: |
    Which of the following are named in the book as popular leaders associated with the Champaran Satyagraha?

    1. Brajkishore Prasad
    2. Anugrah Narayan Sinha
    3. Ramnavmi Prasad
    4. Ravi Shankar Vyas

    Select the correct answer using the codes given below.
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Ravi Shankar Vyas was one of the Gandhians who organised the Kheda Satyagraha, not Champaran."
  source: "Spectrum (2019-20), pp. 317, 319"
  tags: [bpsc]

- slug: smi-15-h03
  difficulty: hard
  stem: |
    **Assertion (A):** Towards the end of the nineteenth century, the European planters of Champaran demanded high rents and illegal dues from the peasants.

    **Reason (R):** German synthetic dyes had replaced indigo, and the planters wanted to maximise profits before the peasants could shift to other crops.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says that when synthetic dyes replaced indigo, the planters demanded high rents and illegal dues to maximise profits before peasants switched crops."
  source: "Spectrum (2019-20), p. 317"
  tags: [bpsc]

- slug: smi-15-h04
  difficulty: hard
  stem: |
