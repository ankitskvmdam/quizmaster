    1. Ministers had to resign if a no-confidence motion was passed against them, while executive councillors were not responsible to the legislature.
    2. Sixty per cent of the members of the provincial legislative councils were to be elected.
    3. Women were given the right to vote.
    4. If a legislative council rejected the budget, the governor could not restore it.

    Which of the statements given above are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "70 per cent of provincial council members were to be elected, and the governor could restore a rejected budget."
  source: "Spectrum (2019-20), pp. 308-309"
  tags: [bpsc]

- slug: smi-15-h05
  difficulty: hard
  stem: |
    Consider the following statements about the central government under the Government of India Act, 1919:

    1. Three of the eight members of the viceroy's executive council were to be Indians.
    2. The Council of State had a tenure of five years and had only male members.
    3. Seventy-five per cent of the budget was still not votable.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1, 2 and 3", D: "2 and 3 only", E: "None of the above" }
  answer: C
  explanation: "All three are stated in the book; the Central Legislative Assembly had a tenure of three years."
  source: "Spectrum (2019-20), pp. 309-310"
  tags: [bpsc]

