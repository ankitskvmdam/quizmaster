  explanation: "All three statements are made in the book's account of the Kheda Satyagraha."
  source: "Spectrum (2019-20), pp. 318-319"
  tags: [bpsc]

- slug: smi-15-h08
  difficulty: hard
  stem: |
    Consider the following statements about the Jallianwala Bagh massacre:

    1. According to official British Indian sources, 379 were identified dead and about 1,100 wounded.
    2. The Indian National Congress estimated more than 1,500 killed and about 1,000 injured.
    3. It is precisely known that 1,650 bullets were fired into the crowd.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The Congress estimated about 1,000 killed and more than 1,500 injured — statement 2 reverses the figures."
  source: "Spectrum (2019-20), p. 323"
  tags: [bpsc]

- slug: smi-15-h09
  difficulty: hard
  stem: |
    Which of the following were Indian members of the Hunter Committee?

    1. Motilal Nehru
    2. M.R. Jayakar
    3. Abbas Tyabji

    Select the correct answer using the codes given below.
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
