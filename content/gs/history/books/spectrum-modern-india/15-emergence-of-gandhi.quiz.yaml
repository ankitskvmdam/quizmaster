# ---------- MEDIUM ----------
- slug: smi-15-m01
  difficulty: medium
  stem: "Under the tinkathia system in Champaran, the European planters forced peasants to grow indigo on what part of their land?"
  options: { A: "1/4", B: "3/20", C: "3/10", D: "1/20", E: "More than one of the above" }
  answer: B
  explanation: "The planters forced peasants to grow indigo on 3/20 part of the total land, called the tinkathia system."
  source: "Spectrum (2019-20), p. 317"
  tags: [bpsc]

- slug: smi-15-m02
  difficulty: medium
  stem: "As a compromise with the Champaran planters, Gandhi agreed that the peasants be compensated for what share of the money illegally taken from them?"
  options: { A: "50 per cent", B: "35 per cent", C: "25 per cent", D: "20 per cent", E: "More than one of the above" }
  answer: C
  explanation: "Gandhi got the tinkathia system abolished and, as a compromise, agreed that only 25 per cent of the money taken be compensated."
  source: "Spectrum (2019-20), p. 317"
  tags: [bpsc]

- slug: smi-15-m03
  difficulty: medium
  stem: "In the Ahmedabad mill dispute (1918), Gandhi asked the workers to demand a wage increase of"
  options: { A: "20 per cent", B: "25 per cent", C: "50 per cent", D: "35 per cent" }
  answer: D
  explanation: "Workers wanted 50 per cent and owners offered 20; Gandhi asked for 35 per cent, which the tribunal finally awarded."
  source: "Spectrum (2019-20), p. 318"
  tags: [ssc]

