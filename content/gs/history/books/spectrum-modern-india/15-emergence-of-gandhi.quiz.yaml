  tags: [bpsc]

- slug: smi-15-h10
  difficulty: hard
  stem: |
    Consider the following statements about the Rowlatt Act:

    1. It was passed in March 1919 as an extension of the Defence of India Regulations Act, 1915.
    2. Suspects were to be tried by a special cell of three high court judges, with no court of appeal above it.
    3. It was based on the recommendations of a commission headed by Lord William Hunter.
    4. Both the bills introduced in the Imperial Legislative Council were passed.

    Which of the statements given above are correct?
  options: { A: "1 only", B: "1, 2 and 3 only", C: "2 and 4 only", D: "1 and 2 only", E: "None of the above" }
  answer: D
  explanation: "The Rowlatt Commission was headed by Sir Sidney Rowlatt, and one of the two bills was dropped."
  source: "Spectrum (2019-20), p. 320"
  tags: [bpsc]

- slug: smi-15-h11
  difficulty: hard
  stem: |
    Consider the following statements about Gandhi in South Africa:

    1. He formed the Passive Resistance Association to defy the law requiring Indians to carry registration certificates.
    2. A poll tax of three pounds was imposed on all ex-indentured Indians.
    3. The Tolstoy Farm was set up in Natal in 1904, inspired by John Ruskin's Unto This Last.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "It was the Phoenix Farm that was set up in Natal in 1904 under Ruskin's influence; Tolstoy Farm was founded in 1910."
  source: "Spectrum (2019-20), pp. 313-314"
  tags: [bpsc]

- slug: smi-15-h12
  difficulty: hard
  stem: |
    Consider the following statements about the aftermath of the Jallianwala Bagh massacre:

    1. The Hunter Committee's final report, released in March 1920, unanimously condemned Dyer's actions.
    2. The Hunter Committee did not impose any penal or disciplinary action on Dyer.
    3. The House of Lords passed a motion in support of Dyer.
    4. Winston Churchill called the massacre 'one of the worst outrages in the whole of our history'.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "Churchill called it 'monstrous'; the 'worst outrages' remark was by former prime minister H.H. Asquith."
  source: "Spectrum (2019-20), pp. 325-326"
  tags: [bpsc]
