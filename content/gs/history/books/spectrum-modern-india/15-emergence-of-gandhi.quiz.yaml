  difficulty: hard
  stem: |
    **Assertion (A):** Soon after his return to India in 1915, Gandhi joined the Home Rule agitation.

    **Reason (R):** Gandhi was convinced that the only technique capable of meeting the nationalist aims was non-violent satyagraha.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: D
  explanation: "Gandhi was not in favour of the Home Rule agitation, as Britain was at war; he did believe only non-violent satyagraha could meet nationalist aims."
  source: "Spectrum (2019-20), p. 316"
  tags: [bpsc]

- slug: smi-15-h07
  difficulty: hard
  stem: |
    Consider the following statements about the Kheda Satyagraha (1918):

    1. Gandhi was mainly its spiritual head, while Vallabhbhai Patel, Narahari Parikh, Mohanlal Pandya and Ravi Shankar Vyas gave the political leadership.
    2. The government finally agreed to suspend the tax for that year and the next, reduce the increase in rate and return the confiscated property.
    3. The Gujarat Sabha had petitioned for suspension of the revenue assessment for the year 1919.

    Which of the statements given above is/are correct?
  options: { A: "1, 2 and 3", B: "1 and 2 only", C: "2 only", D: "1 and 3 only", E: "None of the above" }
