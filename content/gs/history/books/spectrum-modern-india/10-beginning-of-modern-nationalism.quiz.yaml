  difficulty: hard
  stem: "Which of the following was NOT one of the pre-Congress campaigns listed in the book?"
  options: { A: "Against the imposition of import duty on cotton (1875)", B: "For the right to join volunteer corps", C: "In support of the Ilbert Bill", D: "For an All India Fund for Political Agitation" }
  answer: A
  explanation: "The 1875 campaign was FOR the imposition of import duty on cotton; the other three are listed as pre-Congress campaigns."
  source: "Spectrum (2019-20), p. 246"
  tags: [ssc]

- slug: smi-10-h05
  difficulty: hard
  stem: |
    Consider the following statements about the unification of India under British rule:

    1. The British created a larger state than that of the Mauryas or the great Mughals.
    2. The Indian provinces were under 'indirect' British rule while the princely states were under 'direct' rule.
    3. Railways, roads and telegraph were developed mainly for administrative convenience, military defence and economic penetration.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 3 are correct. Provinces were under 'direct' rule and princely states under 'indirect' rule."
  source: "Spectrum (2019-20), p. 240"
  tags: [bpsc]

- slug: smi-10-h06
  difficulty: hard
  stem: |
    Consider the following statements about the Indian press:

    1. In 1877 there were about 169 newspapers published in vernacular languages.
    2. The circulation of these vernacular newspapers reached about 1,00,000.
    3. The unprecedented growth of Indian-owned newspapers took place in the first half of the nineteenth century.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Statements 1 and 2 are correct. The unprecedented growth came in the second half of the nineteenth century."
  source: "Spectrum (2019-20), p. 241"
  tags: [bpsc]

- slug: smi-10-h07
  difficulty: hard
  stem: |
    Consider the following statements about political associations before the Indian National Congress:

    1. Most associations of the early half of the nineteenth century were dominated by wealthy and aristocratic elements.
    2. They were local or regional in character and mostly demanded reforms through long petitions to the British Parliament.
    3. Associations of the second half of the century were increasingly dominated by the educated middle class.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book; later associations led by lawyers, journalists, doctors and teachers had a wider agenda."
  source: "Spectrum (2019-20), pp. 243-244"
  tags: [bpsc]

- slug: smi-10-h08
  difficulty: hard
  stem: |
    **Assertion (A):** The Indian Association of Calcutta was, in a way, a forerunner of the Indian National Congress as an all-India nationalist organisation.

    **Reason (R):** It sponsored an all-India conference in Calcutta in December 1883, attended by more than a hundred delegates from different parts of the country.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says that because the association sponsored this all-India conference (28-30 December 1883), it was in a way a forerunner of the INC."
  source: "Spectrum (2019-20), p. 245"
  tags: [bpsc]

- slug: smi-10-h09
  difficulty: hard
  stem: |
    The book treats Indian nationalism as a product of a mix of factors. Which of the following are among them?

    1. Worldwide upsurge of nationalism and self-determination initiated by the American Revolution
    2. Indian Renaissance
    3. Offshoot of modernisation initiated by the British in India
    4. Strong reaction to British imperialist policies in India

    Select the correct answer using the codes given below:
  options: { A: "1, 2 and 3 only", B: "2, 3 and 4 only", C: "1 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "The worldwide upsurge of nationalism and self-determination is credited to the French Revolution, not the American Revolution; the other three are listed."
  source: "Spectrum (2019-20), pp. 239-240"
  tags: [bpsc]

- slug: smi-10-h10
  difficulty: hard
  stem: "The Poona Sarvajanik Sabha was founded with the object of"
  options: { A: "stimulating the sense of nationalism amongst the people", B: "serving as a bridge between the government and the people", C: "collecting and disseminating information on the actual condition of the people of British India", D: "influencing public men in England to promote Indian welfare" }
  answer: B
  explanation: "The Poona Sarvajanik Sabha aimed to serve as a bridge between the government and the people; the other aims belong to the Indian League, Bengal British India Society and East India Association."
  source: "Spectrum (2019-20), p. 245"
  tags: [ssc]
