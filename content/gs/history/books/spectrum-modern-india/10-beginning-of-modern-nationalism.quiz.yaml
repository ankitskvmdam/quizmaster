  source: "Spectrum (2019-20), p. 245"
  tags: [ssc]

- slug: smi-10-m03
  difficulty: medium
  stem: |
    Arrange the following associations in chronological order of their founding:

    1. East India Association
    2. Bengal British India Society
    3. Indian League
    4. British Indian Association
  options: { A: "2, 1, 4, 3", B: "2, 4, 1, 3", C: "4, 2, 1, 3", D: "2, 4, 3, 1", E: "None of the above" }
  answer: B
  explanation: "Bengal British India Society (1843), British Indian Association (1851), East India Association (1866), Indian League (1875)."
  source: "Spectrum (2019-20), p. 244"
  tags: [bpsc]

- slug: smi-10-m04
  difficulty: medium
  stem: |
    Match List I (association) with List II (founder):

    | List I | List II |
    |---|---|
    | a. Indian League | 1. Mahadeo Govind Ranade |
    | b. East India Association | 2. Surendranath Banerjea |
    | c. Poona Sarvajanik Sabha | 3. Sisir Kumar Ghosh |
    | d. Indian Association of Calcutta | 4. Dadabhai Naoroji |
  options: { A: "a-3, b-4, c-1, d-2", B: "a-4, b-3, c-1, d-2", C: "a-3, b-4, c-2, d-1", D: "a-2, b-4, c-1, d-3", E: "None of the above" }
  answer: A
  explanation: "Indian League — Sisir Kumar Ghosh; East India Association — Dadabhai Naoroji; Poona Sarvajanik Sabha — M.G. Ranade; Indian Association — Surendranath Banerjea (with Ananda Mohan Bose)."
  source: "Spectrum (2019-20), pp. 244-245"
  tags: [bpsc]

- slug: smi-10-m05
  difficulty: medium
  stem: "What did Ripon's Government seek to achieve through the Ilbert Bill?"
  options: { A: "Raising the maximum age for the I.C.S. examination", B: "Repealing the Vernacular Press Act", C: "Holding the civil service examination simultaneously in England and India", D: "Abolishing judicial disqualification based on race distinctions" }
  answer: D
  explanation: "The Ilbert Bill sought to abolish 'judicial disqualification based on race distinctions' and give Indian members of the covenanted civil service the same powers as Europeans."
  source: "Spectrum (2019-20), p. 243"
  tags: [ssc]

- slug: smi-10-m06
  difficulty: medium
  stem: "Which of the following was an Indian scholar whose historical research helped rediscover India's past?"
  options: { A: "Max Mueller", B: "Monier Williams", C: "R.G. Bhandarkar", D: "Sassoon" }
  answer: C
  explanation: "The book names R.G. Bhandarkar, R.L. Mitra and later Swami Vivekananda as Indian scholars; Max Mueller, Monier Williams, Roth and Sassoon were European."
  source: "Spectrum (2019-20), p. 242"
  tags: [ssc]

- slug: smi-10-m07
  difficulty: medium
  stem: "The Charter Act of 1853, which added six members to the governor-general's council for legislative purposes, partially accepted the suggestions petitioned by the"
  options: { A: "British Indian Association", B: "Indian Association of Calcutta", C: "East India Association", D: "Landholders' Society", E: "More than one of the above" }
  answer: A
  explanation: "The British Indian Association's petition demands were partially accepted when the Charter Act of 1853 added six members to the governor-general's council for legislative purposes."
  source: "Spectrum (2019-20), p. 244"
  tags: [bpsc]

- slug: smi-10-m08
  difficulty: medium
  stem: "Which of the following was NOT among Lytton's reactionary measures listed in the book?"
  options: { A: "The Vernacular Press Act (1878)", B: "The Ilbert Bill", C: "The Delhi Durbar of 1877", D: "The Arms Act (1878)" }
  answer: B
  explanation: "The Ilbert Bill came under Ripon's Government; the Press Act, Arms Act and the 1877 Delhi Durbar were Lytton's measures."
  source: "Spectrum (2019-20), p. 243"
  tags: [ssc]

- slug: smi-10-m09
  difficulty: medium
  stem: "Who described the new Indian middle class as 'a minority of Indian society, but a dynamic minority'?"
  options: { A: "Max Mueller", B: "Monier Williams", C: "Swami Vivekananda", D: "Percival Spear" }
  answer: D
  explanation: "The book quotes Percival Spear describing the new middle class as a well-integrated all-India class and 'a dynamic minority'."
  source: "Spectrum (2019-20), p. 242"
  tags: [ssc]

- slug: smi-10-m10
  difficulty: medium
  stem: "Among national liberation movements abroad, which one in particular deeply influenced Indian nationalists, according to the book?"
  options: { A: "Greece", B: "Italy", C: "Ireland", D: "Portugal" }
  answer: C
  explanation: "The book says the liberation movements of Greece and Italy in general and of Ireland in particular deeply influenced the nationalists."
  source: "Spectrum (2019-20), p. 243"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-10-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Indian Association of Calcutta:

    1. It superseded the Indian League.
    2. Its membership fee was kept low to attract the poorer sections.
    3. It was founded by senior leaders of the British Indian Association to strengthen its pro-landlord policies.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. It was founded by younger nationalists discontented with the conservative and pro-landlord policies of the British Indian Association."
  source: "Spectrum (2019-20), p. 245"
  tags: [bpsc]

- slug: smi-10-h02
  difficulty: hard
  stem: |
    The British Indian Association's petition to the British Parliament (for the renewed Charter) demanded which of the following?

    1. A separate legislature of a popular character
    2. Separation of executive from judicial functions
    3. Abolition of salt duty, abkari and stamp duties
    4. An increase in the salaries of higher officers

    Select the correct answer using the codes given below:
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "The petition sought a popular legislature, separation of executive and judicial functions, abolition of salt, abkari and stamp duties, and a REDUCTION in salaries of higher officers."
  source: "Spectrum (2019-20), p. 244"
  tags: [bpsc]

- slug: smi-10-h03
  difficulty: hard
  stem: |
    **Assertion (A):** Ripon had to modify the Ilbert Bill, almost defeating its original purpose.

    **Reason (R):** The Indian members of the covenanted civil service strongly opposed the bill.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "Ripon modified the bill because of stiff opposition from the European community; the bill was meant to give Indian members of the covenanted civil service equal powers."
  source: "Spectrum (2019-20), p. 243"
  tags: [bpsc]

