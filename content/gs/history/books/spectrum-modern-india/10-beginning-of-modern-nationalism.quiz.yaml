- slug: smi-10-m02
  difficulty: medium
  stem: "The Indian Association of Calcutta (1876) was founded by younger nationalists of Bengal led by"
  options: { A: "Sisir Kumar Ghosh and Dadabhai Naoroji", B: "Mahadeo Govind Ranade and Pherozshah Mehta", C: "Badruddin Tyabji and K.T. Telang", D: "Surendranath Banerjea and Ananda Mohan Bose" }
