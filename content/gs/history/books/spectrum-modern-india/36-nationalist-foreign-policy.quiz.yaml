# ---------- MEDIUM ----------
- slug: smi-36-m01
  difficulty: medium
  stem: |
    Arrange the following British expeditions, opposed by the nationalists, in chronological order:

    1. Annexation of Burma
    2. Invasion of Tibet under Curzon
    3. Second Afghan War
    4. Dispatch of troops to suppress Col. Arabi's uprising in Egypt

    Select the correct answer using the codes given below:
  options: { A: "3-4-1-2", B: "4-3-1-2", C: "3-1-4-2", D: "4-3-2-1", E: "None of the above" }
  answer: A
  explanation: "Second Afghan War (1878-80), troops to Egypt (1882), annexation of Burma (1885), invasion of Tibet (1903)."
  source: "Spectrum (2019-20), p. 620"
  tags: [bpsc]

- slug: smi-36-m02
  difficulty: medium
  stem: |
    Match List I (pioneering leader of NAM) with List II (country):

    | List I | List II |
    |---|---|
    | a. Josip Broz Tito | 1. Ghana |
    | b. Gamal Abdel Nasser | 2. Indonesia |
    | c. Sukarno | 3. Egypt |
    | d. Kwame Nkrumah | 4. Yugoslavia |
  options: { A: "a-4, b-2, c-3, d-1", B: "a-3, b-4, c-2, d-1", C: "a-4, b-3, c-2, d-1", D: "a-4, b-3, c-1, d-2", E: "None of the above" }
  answer: C
  explanation: "Tito — Yugoslavia, Nasser — Egypt, Sukarno — Indonesia, Nkrumah — Ghana; with Nehru they are the five pioneers of NAM."
  source: "Spectrum (2019-20), p. 626"
  tags: [bpsc]

