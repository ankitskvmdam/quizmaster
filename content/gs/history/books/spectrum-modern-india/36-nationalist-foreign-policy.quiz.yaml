# ---------- HARD ----------
- slug: smi-36-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Congress stand on the Palestine issue:

    1. The Congress lent support to the Palestinians.
    2. It expressed sympathy with the Jews.
    3. It supported the partition of Palestine as the only practical solution.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The Congress supported the Palestinians and sympathised with the Jews, but opposed partition and wanted direct Jewish-Arab settlement without Western intervention."
  source: "Spectrum (2019-20), p. 622"
  tags: [bpsc]

- slug: smi-36-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Congress of Oppressed Nationalities, Brussels (1927):

    1. It was organised by political exiles and revolutionaries from Asia, Africa and Latin America.
    2. Nehru attended it in his personal capacity and not on behalf of the Indian National Congress.
    3. Nehru was one of its honorary presidents, along with Einstein and George Lansbury among others.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Nehru attended on behalf of the Indian National Congress; statements 1 and 3 are stated in the book."
  source: "Spectrum (2019-20), p. 621"
  tags: [bpsc]

- slug: smi-36-h03
  difficulty: hard
  stem: |
    Consider the following statements about the five criteria of non-alignment laid down by the Preparatory Committee of the first non-aligned conference:

    1. A country should not be a member of multilateral military alliances concluded in the context of super-power conflicts.
    2. A country that has conceded military bases to a foreign power can never qualify as non-aligned.
    3. A country should not be a member of any bilateral or regional defence arrangement.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Military bases and bilateral/regional defence arrangements were allowed provided they were not in the context of super-power conflicts or politics."
  source: "Spectrum (2019-20), p. 626"
  tags: [bpsc]

- slug: smi-36-h04
  difficulty: hard
  stem: |
    Consider the following statements about India's international engagement before independence:

    1. India signed the Versailles Treaty, largely as a result of having contributed more than a million soldiers to the First World War.
    2. In the 1920s, India was a founding member of the League of Nations and the International Labour Organisation.
    3. At independence, India was a signatory to some 600 treaties.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated on p. 619 as evidence of India's diplomatic engagement under colonial rule."
  source: "Spectrum (2019-20), p. 619"
  tags: [bpsc]

- slug: smi-36-h05
  difficulty: hard
  stem: |
    Consider the following statements about the pan-Asian feeling among nationalists during 1880-1914:

    1. Japan was an inspiration as an example of industrial development.
    2. The nationalists welcomed Japan's participation in the international suppression of the I-Ho-Tuan uprising.
    3. The defeat of Czarist Russia by Japan exploded the myth of European superiority.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The nationalists condemned, not welcomed, Japan's participation in suppressing the I-Ho-Tuan uprising."
  source: "Spectrum (2019-20), pp. 620-621"
  tags: [bpsc]

- slug: smi-36-h06
  difficulty: hard
  stem: |
    Consider the following statements based on the boxed 'Historical Perspective on Panchsheel':

    1. T.N. Kaul, then in the external affairs ministry, took the initiative to mention the principles at the outset of his draft text of the agreement.
    2. As a compromise, Zhou suggested the five principles could appear in the preamble rather than prominently in the main text.
    3. In the classical language, the word 'sheel' means 'principle'.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The box says that in classical usage 'sheel' means 'character', not 'principle'; the term was taken from Indonesian usage."
  source: "Spectrum (2019-20), p. 624"
  tags: [bpsc]

- slug: smi-36-h07
  difficulty: hard
  stem: |
    Consider the following statements about the global situation India faced after independence, as described in the book:

    1. The USSR followed the US with its own nuclear test in 1949.
    2. China was aligned with the Soviet Union till the mid-fifties.
    3. It was the Soviet Union that tried hardest to incorporate the newly independent countries into its strategic grouping.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1 and 2 only", E: "None of the above" }
  answer: D
  explanation: "The Soviet Union then lacked the economic or military capability to influence the new nations; it was the West that tried to bring them into its strategic grouping."
  source: "Spectrum (2019-20), pp. 625-626"
  tags: [bpsc]

- slug: smi-36-h08
  difficulty: hard
  stem: |
    **Assertion (A):** Non-alignment is not to be confused with neutrality.

    **Reason (R):** A neutral state remains passive and has no opinions on issues, whereas non-alignment involves positive and constructive opinions on international issues, in war as well as peace.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book distinguishes the two exactly this way: neutrality is passivity, mainly in war, while non-alignment is active in both war and peace."
  source: "Spectrum (2019-20), p. 627"
  tags: [bpsc]

