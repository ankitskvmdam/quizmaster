  options: { A: "Kashmir and Alwar", B: "Hyderabad and Mysore", C: "Baroda and Bhopal", D: "Patiala and Rewa" }
  answer: A
  explanation: "The book notes that this phase of the movement coincided with upsurges in Kashmir and Alwar."
  source: "Spectrum (2019-20), p. 389"
  tags: [ssc]

- slug: smi-19-h12
  difficulty: hard
  stem: |
    Consider the following statements about the views of Gandhi and Ambedkar:

    1. Ambedkar advocated a parliamentary system of government for independent India.
    2. In Gandhi's perception, it was purity of means that determined the end.
    3. Ambedkar viewed the untouchables as an integral part of the Hindu whole.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. It was Gandhi who saw untouchables as part of the Hindu whole; Ambedkar called them a 'political minority'."
  source: "Spectrum (2019-20), pp. 396, 398-399"
  tags: [bpsc]

