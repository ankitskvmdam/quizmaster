  difficulty: medium
  stem: "At the end of the Second Round Table Conference, Ramsay MacDonald announced two Muslim-majority provinces. They were"
  options: { A: "Punjab and Sindh", B: "NWFP and Bengal", C: "NWFP and Sindh", D: "Sindh and Baluchistan", E: "None of the above" }
