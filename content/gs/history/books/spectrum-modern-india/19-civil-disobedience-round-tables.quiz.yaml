  tags: [bpsc]

- slug: smi-19-m03
  difficulty: medium
  stem: "Which of the following was listed among the 'specific peasant demands' in Gandhi's eleven demands?"
  options: { A: "Reduce rupee-sterling exchange ratio to 1s 4d", B: "Introduce textile protection", C: "Abolish salt tax and government's salt monopoly", D: "Introduce total prohibition" }
  answer: C
  explanation: "The peasant demands were a 50 per cent cut in land revenue and abolition of the salt tax; 1s 4d and textile protection were bourgeois demands, prohibition a general one."
  source: "Spectrum (2019-20), pp. 370-371"
  tags: [ssc]

- slug: smi-19-m04
  difficulty: medium
  stem: "After Gandhi's arrest in May 1930, the Congress Working Committee sanctioned the no-chowkidara-tax campaign in"
  options: { A: "zamindari areas", B: "ryotwari areas", C: "the Central Provinces", D: "the North-West Frontier Province" }
  answer: A
  explanation: "The CWC sanctioned non-payment of revenue in ryotwari areas, no-chowkidara tax in zamindari areas and forest law violation in the Central Provinces."
  source: "Spectrum (2019-20), p. 373"
  tags: [ssc]

- slug: smi-19-m05
  difficulty: medium
  stem: "Which industrial town saw the fiercest response to Gandhi's arrest, where textile workers set up a virtual parallel government?"
  options: { A: "Ahmedabad", B: "Peshawar", C: "Bombay", D: "Sholapur" }
  answer: D
  explanation: "In Sholapur textile workers struck from May 7, 1930 and set up a virtual parallel government, dislodged only by martial law."
  source: "Spectrum (2019-20), p. 375"
  tags: [ssc]

- slug: smi-19-m06
  difficulty: medium
  stem: "During the Civil Disobedience Movement in Bihar, administration collapsed in the Barhee region of which district?"
  options: { A: "Saran", B: "Munger", C: "Champaran", D: "Hazaribagh", E: "More than one of the above" }
  answer: B
  explanation: "By November 1930 sales of foreign cloth and liquor fell sharply and administration collapsed in parts such as the Barhee region of Munger."
  source: "Spectrum (2019-20), p. 374"
  tags: [bpsc]

- slug: smi-19-m07
  difficulty: medium
  stem: "Bonga Majhi and Somra Majhi, influenced by Gandhism, led a movement combining socio-religious reform along 'sanskritising' lines in"
  options: { A: "Hazaribagh", B: "Midnapur", C: "Champaran", D: "Kheda", E: "More than one of the above" }
  answer: A
  explanation: "In the Chhotanagpur tribal belt, Bonga Majhi and Somra Majhi led such a movement in Hazaribagh, asking followers to give up meat and liquor and use khadi."
  source: "Spectrum (2019-20), pp. 374-375"
  tags: [bpsc]

- slug: smi-19-m08
  difficulty: medium
  stem: "Which of the following demands of Gandhi was turned down by the viceroy in the Gandhi-Irwin Pact?"
  options: { A: "Right to make salt in coastal villages for personal consumption", B: "Release of political prisoners not convicted of violence", C: "Public inquiry into police excesses", D: "Withdrawal of emergency ordinances" }
  answer: C
  explanation: "Irwin turned down a public inquiry into police excesses and commutation of Bhagat Singh's death sentence; the other three were agreed to."
  source: "Spectrum (2019-20), p. 379"
  tags: [ssc]

- slug: smi-19-m09
  difficulty: medium
  stem: "Where did a section of the Garhwal Rifles soldiers refuse to fire on an unarmed crowd in 1930?"
  options: { A: "Sholapur", B: "Peshawar", C: "Dharasana", D: "Calicut" }
  answer: B
  explanation: "In Peshawar, after mass demonstrations in April 1930, a section of the Garhwal Rifles refused to fire on an unarmed crowd."
  source: "Spectrum (2019-20), p. 375"
  tags: [ssc]

- slug: smi-19-m10
  difficulty: medium
  stem: "Under the Poona Pact, seats reserved for the depressed classes in the provincial legislatures were increased to"
  options: { A: "71", B: "78", C: "18", D: "147" }
  answer: D
  explanation: "The Poona Pact raised the depressed classes' reserved seats from 71 to 147 in provincial legislatures and to 18 per cent of the Central Legislature."
  source: "Spectrum (2019-20), p. 392"
  tags: [ssc]

- slug: smi-19-m11
  difficulty: medium
  stem: "In Assam, a successful student strike in May 1930 was organised against the"
  options: { A: "Cunningham Circular", B: "Lothian Committee", C: "Rowlatt Act", D: "Arms Act" }
