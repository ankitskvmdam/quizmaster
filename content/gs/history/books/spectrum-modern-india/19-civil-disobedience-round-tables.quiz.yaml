- slug: smi-19-h14
  difficulty: hard
  stem: "On his way to the Karachi session (1931), Gandhi was greeted with black flag demonstrations organised by"
  options: { A: "the Khudai Khidmatgars", B: "the Hindu Mahasabha", C: "the Muslim League", D: "the Punjab Naujawan Bharat Sabha" }
  answer: D
  explanation: "The Punjab Naujawan Bharat Sabha protested his failure to secure commutation of the death sentence of Bhagat Singh and his comrades."
  source: "Spectrum (2019-20), p. 381"
  tags: [ssc]

- slug: smi-19-h15
  difficulty: hard
  stem: |
    Consider the following statements about the truce period (March-December 1931):

    1. In the United Provinces, the Congress led a movement for rent reduction and against summary evictions.
    2. In the NWFP, severe repression was unleashed against the Khudai Khidmatgars.
    3. In September 1931, there was a firing incident on political prisoners in Hijli Jail.

    Which of the statements given above is/are correct?
  options: { A: "1, 2 and 3", B: "1 and 2 only", C: "2 and 3 only", D: "1 and 3 only", E: "None of the above" }
  answer: A
  explanation: "All three are stated in the book as activities that kept the spirit of defiance alive during the truce."
  source: "Spectrum (2019-20), p. 388"
  tags: [bpsc]
