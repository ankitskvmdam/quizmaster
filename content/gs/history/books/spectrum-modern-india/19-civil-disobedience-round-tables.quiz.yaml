# ---------- HARD ----------
- slug: smi-19-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Lahore session of the Congress (December 1929):

    1. Jawaharlal Nehru was made president mainly due to Gandhi's backing, though 15 out of 18 Provincial Congress Committees had opposed him.
    2. It decided that the Round Table Conference was to be boycotted.
    3. The tricolour flag was hoisted at midnight on the banks of the river Sutlej.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Statements 1 and 2 are correct. The flag was hoisted on the banks of the river Ravi on December 31, 1929."
  source: "Spectrum (2019-20), pp. 368-369"
  tags: [bpsc]

- slug: smi-19-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Civil Disobedience Movement in Bihar and Chhotanagpur:

    1. Manufacture of salt on a large scale was not practicable in landlocked Bihar, so a no-chaukidari tax agitation replaced the salt satyagraha.
    2. Most big zamindars actively participated in the movement.
    3. The Santhals were reported to be taking up illegal distillation of liquor under the banner of Gandhi.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Statements 1 and 3 are correct. Most big zamindars stayed loyal to the government; it was small landlords and better-off tenants who participated."
  source: "Spectrum (2019-20), pp. 374-375"
  tags: [bpsc]

- slug: smi-19-h03
  difficulty: hard
  stem: |
    **Assertion (A):** Bengal provided the largest number of arrests during the Civil Disobedience Movement.

    **Reason (R):** Muslim participation in the movement in Bengal was very high.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "Bengal did provide the largest number of arrests and the highest violence, but the book notes there was little participation of Muslims there."
  source: "Spectrum (2019-20), p. 374"
  tags: [bpsc]

- slug: smi-19-h04
  difficulty: hard
  stem: |
    Consider the following statements about the Gandhi-Irwin Pact:

    1. The government conceded the right to make salt in coastal villages for personal consumption, but not for sale.
    2. The government agreed to return all confiscated lands, including those already sold to third parties.
    3. Gandhi agreed to participate in the next Round Table Conference.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 3 are correct. Only lands not yet sold to third parties were to be returned."
  source: "Spectrum (2019-20), p. 379"
  tags: [bpsc]

- slug: smi-19-h05
  difficulty: hard
  stem: |
    Consider the following statements comparing the Civil Disobedience Movement with the Non-Cooperation Movement:

    1. The number of people imprisoned was about three times more in the Civil Disobedience Movement.
    2. A major labour upsurge coincided with the Civil Disobedience Movement.
    3. Forms of protest involving the intelligentsia, such as lawyers giving up practice, declined.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 3 are correct; the book says no major labour upsurge coincided with the Civil Disobedience Movement."
  source: "Spectrum (2019-20), pp. 380-381"
  tags: [bpsc]

- slug: smi-19-h06
  difficulty: hard
  stem: |
    Consider the following provisions said to be part of the Communal Award (1932):

    1. Separate electorates for the depressed classes were to be provided for a period of 20 years.
    2. Except in the NWFP, 3 per cent seats were to be reserved for women in all provinces.
    3. Seven seats in the province of Bombay were to be allocated for the Marathas.
    4. The existing seats of the provincial legislatures were to be halved.

    Which of the above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Statements 1, 2 and 3 are correct. Under the Award, the existing seats of the provincial legislatures were to be doubled, not halved."
  source: "Spectrum (2019-20), pp. 390-391"
  tags: [bpsc]

- slug: smi-19-h07
  difficulty: hard
  stem: |
    Match List I (group represented at the First Round Table Conference) with List II (representative) as given in the book:

    | List I | List II |
    |---|---|
    | a. Depressed Classes | 1. Henry Gidney |
    | b. Women | 2. N.M. Joshi |
    | c. Labour | 3. Rettamalai Srinivasan |
