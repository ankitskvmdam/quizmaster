  tags: [ssc]

- slug: smi-19-h09
  difficulty: hard
  stem: |
    Consider the following statements about the circumstances of the Second Round Table Conference (1931):

    1. Lord Irwin had been replaced by Lord Willingdon as viceroy.
    2. Just before it began, the Labour government in England had been replaced by a National Government.
    3. The Secretary of State for India at the time was Wedgewood Benn.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1, 2 and 3", D: "1 and 2 only", E: "None of the above" }
