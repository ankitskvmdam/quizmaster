  difficulty: medium
  stem: "Which of the following was part of the Karachi Resolution on National Economic Programme rather than the Resolution on Fundamental Rights?"
  options: { A: "Universal adult franchise", B: "Free and compulsory primary education", C: "Neutrality of state in religious matters", D: "State ownership and control of key industries, mines and means of transport", E: "None of the above" }
