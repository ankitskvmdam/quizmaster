- slug: smi-19-h10
  difficulty: hard
  stem: |
    Which of the following were conditions put forward in the Delhi Manifesto (November 2, 1929) for attending the Round Table Conference?

    1. The conference should formulate a constitution for implementing dominion status, and the basic principle of dominion status should be immediately accepted.
