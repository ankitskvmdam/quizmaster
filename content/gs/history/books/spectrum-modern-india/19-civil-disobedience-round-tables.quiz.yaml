  tags: [bpsc]

- slug: smi-19-h08
  difficulty: hard
  stem: "At the Second Round Table Conference, V.V. Giri was one of the representatives of"
  options: { A: "Industry", B: "Labour", C: "the Liberals", D: "the Justice Party" }
  answer: B
  explanation: "Labour at the Second RTC was represented by N.M. Joshi, B. Shiva Rao and V.V. Giri; industry by G.D. Birla, Purshottamdas Thakurdas and Maneckji Dadabhoy."
