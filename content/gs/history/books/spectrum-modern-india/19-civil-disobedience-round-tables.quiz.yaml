# ---------- MEDIUM ----------
- slug: smi-19-m01
  difficulty: medium
  stem: |
    Arrange the following events in chronological order:

    1. Delhi Manifesto
    2. Irwin's Declaration
    3. Start of the Dandi March
    4. Hoisting of the tricolour on the banks of the Ravi by Jawaharlal Nehru
  options: { A: "1, 2, 4, 3", B: "2, 1, 3, 4", C: "1, 2, 3, 4", D: "2, 1, 4, 3", E: "None of the above" }
  answer: D
  explanation: "Irwin's Declaration (October 31, 1929), Delhi Manifesto (November 2, 1929), flag on the Ravi (December 31, 1929), Dandi March began (March 12, 1930)."
  source: "Spectrum (2019-20), pp. 367-372"
  tags: [bpsc]

- slug: smi-19-m02
  difficulty: medium
  stem: |
    Match List I (region) with List II (leader of salt satyagraha there) as given in the book:

    | List I | List II |
    |---|---|
    | a. Tamil Nadu | 1. K. Kelappan |
    | b. Malabar | 2. Ambika Kant Sinha |
    | c. Orissa | 3. C. Rajagopalachari |
    | d. Patna | 4. Gopalbandhu Chaudhuri |
  options: { A: "a-3, b-4, c-1, d-2", B: "a-3, b-1, c-4, d-2", C: "a-1, b-3, c-4, d-2", D: "a-3, b-1, c-2, d-4", E: "None of the above" }
