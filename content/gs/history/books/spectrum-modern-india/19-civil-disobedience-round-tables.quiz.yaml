  difficulty: hard
  stem: |
    **Assertion (A):** The peasants of Gujarat were disappointed with the Gandhi-Irwin Pact.

    **Reason (R):** The viceroy turned down the demand for commutation of the death sentence of Bhagat Singh and his comrades.
