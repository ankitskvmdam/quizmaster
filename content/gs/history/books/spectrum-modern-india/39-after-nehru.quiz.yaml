# ---------- EASY ----------
- slug: smi-39-e01
  difficulty: easy
  stem: "Who was appointed interim prime minister immediately after Jawaharlal Nehru's death in 1964?"
  options: { A: "Morarji Desai", B: "Gulzarilal Nanda", C: "K. Kamaraj", D: "Lal Bahadur Shastri" }
  answer: B
  explanation: "Immediately after Nehru's death, Gulzarilal Nanda was appointed interim prime minister pending the election of a new Congress parliamentary leader."
  source: "Spectrum (2019-20), p. 653"
  tags: [ssc]

- slug: smi-39-e02
  difficulty: easy
  stem: "The slogan 'Jai Jawan Jai Kisan' was given by"
  options: { A: "Lal Bahadur Shastri", B: "Jawaharlal Nehru", C: "Indira Gandhi", D: "Morarji Desai" }
  answer: A
  explanation: "Shastri gave the slogan during the war with Pakistan, linking the soldier's role in security with the farmer's role in food security."
  source: "Spectrum (2019-20), p. 657"
  tags: [ssc]

- slug: smi-39-e03
  difficulty: easy
  stem: "On which date was the Tashkent Declaration signed by Ayub Khan and Lal Bahadur Shastri?"
  options: { A: "23 September 1965", B: "5 August 1965", C: "10 January 1966", D: "25 February 1966" }
  answer: C
  explanation: "The Tashkent Declaration was signed on January 10, 1966, with the mediation of Alexei Kosygin."
  source: "Spectrum (2019-20), p. 662"
  tags: [ssc]

- slug: smi-39-e04
  difficulty: easy
  stem: "The National Dairy Development Board (NDDB) was established in 1965 at"
  options: { A: "Kanjari", B: "New Delhi", C: "Ahmedabad", D: "Anand" }
  answer: D
  explanation: "Impressed by the Amul milk cooperative, Shastri wanted it replicated; as a result the NDDB was established at Anand in 1965."
  source: "Spectrum (2019-20), p. 659"
  tags: [ssc]

- slug: smi-39-e05
  difficulty: easy
  stem: "On January 19, 1966, Indira Gandhi became which prime minister of India (the first woman to hold the post)?"
  options: { A: "Second", B: "Third", C: "Fourth", D: "Fifth" }
  answer: B
  explanation: "The book says Indira Gandhi became the third prime minister of India on January 19, 1966, the first woman to occupy the post."
  source: "Spectrum (2019-20), p. 666"
  tags: [ssc]

- slug: smi-39-e06
  difficulty: easy
  stem: "In the Congress split of 1969, the 'R' in Indira Gandhi's Congress (R) stood for"
  options: { A: "Reformists", B: "Radicals", C: "Requisitionists", D: "Ruling" }
  answer: C
  explanation: "Indira Gandhi's faction was Congress (R), R for 'Requisitionists'; the other group was Congress (O), O for 'Organisation'."
  source: "Spectrum (2019-20), p. 667"
  tags: [ssc]

- slug: smi-39-e07
  difficulty: easy
  stem: "What was the catchy slogan of the Congress (R) in the 1971 general elections?"
  options: { A: "Garibi Hatao", B: "Indira Hatao", C: "Jai Jawan Jai Kisan", D: "Total Revolution" }
  answer: A
  explanation: "Congress (R) campaigned on 'Garibi Hatao' (Remove Poverty), while the Grand Alliance's cry was 'Indira Hatao'."
  source: "Spectrum (2019-20), p. 668"
  tags: [ssc]

- slug: smi-39-e08
  difficulty: easy
  stem: "India's first nuclear test at Pokhran on May 18, 1974 was code-named"
  options: { A: "Operation Trident", B: "Operation Meghdoot", C: "Fat Man", D: "Smiling Buddha" }
  answer: D
  explanation: "Officially Pokhran I, the underground test of May 18, 1974 was code-named 'Smiling Buddha'."
  source: "Spectrum (2019-20), p. 703"
  tags: [ssc]

- slug: smi-39-e09
  difficulty: easy
  stem: "The internal Emergency of June 1975 was proclaimed under which provision of the Constitution?"
  options: { A: "Article 356", B: "Article 360", C: "Article 352(1)", D: "Article 365" }
  answer: C
  explanation: "President Fakhruddin Ali Ahmed declared a State of Emergency due to internal disorder under Article 352(1) on June 25-26, 1975."
  source: "Spectrum (2019-20), p. 670"
  tags: [ssc]

- slug: smi-39-e10
  difficulty: easy
  stem: "Who signed the Instrument of Surrender on India's behalf at the Ramna Race Course, Dacca, on December 16, 1971?"
  options: { A: "Sam Manekshaw", B: "Jagjit Singh Aurora", C: "S.N. Kohli", D: "Nilakanta Krishnan" }
  answer: B
  explanation: "It was signed between Lt Gen Jagjit Singh Aurora, GOC-in-C of the Indian Eastern Command, and Lt Gen A.A.K. Niazi."
  source: "Spectrum (2019-20), p. 696"
  tags: [ssc]

- slug: smi-39-e11
  difficulty: easy
  stem: "Who became India's first non-Congress prime minister in March 1977?"
  options: { A: "Morarji Desai", B: "Charan Singh", C: "Jagjivan Ram", D: "Atal Behari Vajpayee" }
  answer: A
  explanation: "Chosen by Acharya Kripalani and Jayaprakash Narayan, Morarji Desai took the oath as prime minister on March 23, 1977."
  source: "Spectrum (2019-20), p. 704"
  tags: [ssc]

- slug: smi-39-e12
  difficulty: easy
  stem: "Bindeshwari Prasad Mandal, chairman of the Second Backward Classes Commission (1979), had earlier been the chief minister of"
  options: { A: "Uttar Pradesh", B: "Madhya Pradesh", C: "Orissa", D: "Bihar", E: "More than one of the above" }
  answer: D
  explanation: "The Mandal Commission, appointed by the Janata government in January 1979, was named after its chairman B.P. Mandal, a former chief minister of Bihar."
  source: "Spectrum (2019-20), p. 712"
  tags: [bpsc]

- slug: smi-39-e13
  difficulty: easy
  stem: "Operation Meghdoot, launched by India in April 1984, concerned"
  options: { A: "the Golden Temple, Amritsar", B: "the Rann of Kachchh", C: "the Siachen Glacier", D: "Karachi port" }
  answer: C
  explanation: "To free the Siachen Glacier from Pakistani domination, India launched Operation Meghdoot in April 1984."
  source: "Spectrum (2019-20), p. 715"
  tags: [ssc]

- slug: smi-39-e14
  difficulty: easy
  stem: "In April 1984, Rakesh Sharma flew aboard Soyuz T-11 to which space station?"
  options: { A: "Salyut 7", B: "Mir", C: "Skylab", D: "Salyut 6" }
  answer: A
  explanation: "On April 2, 1984, Sharma flew on Soyuz T-11 with two Soviet cosmonauts to the space station Salyut 7."
  source: "Spectrum (2019-20), p. 715"
  tags: [ssc]

- slug: smi-39-e15
  difficulty: easy
  stem: "In May 1977 Harijans were burnt to death in a Bihar village; Indira Gandhi visited it, travelling the last stretch on an elephant. Name the village."
  options: { A: "Naxalbari", B: "Belchi", C: "Chikmagalur", D: "Medak", E: "More than one of the above" }
  answer: B
  explanation: "The violence was in Belchi, a village in Bihar; Indira Gandhi reached it partly on an elephant and built her image as a friend of the poor."
  source: "Spectrum (2019-20), pp. 705-706"
  tags: [bpsc]

- slug: smi-39-e16
  difficulty: easy
  stem: "The Bhopal gas tragedy of December 3, 1984 was caused by the leak of which gas from the Union Carbide pesticide plant?"
  options: { A: "Methyl isocyanate", B: "Phosgene", C: "Chlorine", D: "Hydrogen cyanide" }
  answer: A
  explanation: "The book says a leak of toxic methyl isocyanate (MIC) gas from Union Carbide's pesticide plant at Bhopal killed thousands."
  source: "Spectrum (2019-20), p. 721"
  tags: [ssc]

- slug: smi-39-e17
  difficulty: easy
  stem: "In which year was the anti-defection law passed, as one of the first acts of Rajiv Gandhi as prime minister?"
  options: { A: "1984", B: "1985", C: "1986", D: "1987" }
  answer: B
  explanation: "Rajiv Gandhi got the anti-defection law passed in January 1985."
  source: "Spectrum (2019-20), p. 725"
  tags: [ssc]

- slug: smi-39-e18
  difficulty: easy
  stem: "Who became chief minister when Mizoram became the 23rd state of India in February 1987?"
  options: { A: "Subhash Ghisingh", B: "Sant Harcharan Singh Longowal", C: "Laldenga", D: "Farooq Abdullah" }
  answer: C
  explanation: "The Mizo National Front under Laldenga came to power, and he became chief minister of Mizoram, the 23rd state, in February 1987."
  source: "Spectrum (2019-20), p. 723"
  tags: [ssc]

- slug: smi-39-e19
  difficulty: easy
  stem: "On which date did the prime minister announce that Rs 500 and Rs 1,000 notes would cease to be legal tender (demonetisation)?"
  options: { A: "August 15, 2016", B: "January 1, 2017", C: "November 26, 2016", D: "November 8, 2016" }
  answer: D
  explanation: "On November 8, 2016, the prime minister announced in a sudden address that Rs 500 and Rs 1,000 notes would cease to be legal tender from midnight."
  source: "Spectrum (2019-20), p. 784"
  tags: [ssc]

- slug: smi-39-e20
  difficulty: easy
  stem: "Which prime minister announced in Parliament on August 7, 1990 that the Mandal Commission report would be implemented, with 27 per cent reservation for OBCs in central government services?"
  options: { A: "Chandra Shekhar", B: "V.P. Singh", C: "Rajiv Gandhi", D: "P.V. Narasimha Rao", E: "More than one of the above" }
  answer: B
  explanation: "V.P. Singh announced on August 7, 1990 that his government had accepted the Mandal Commission report."
  source: "Spectrum (2019-20), p. 738"
  tags: [bpsc]

- slug: smi-39-e21
  difficulty: easy
  stem: "Which chief minister had L.K. Advani arrested in 1990 to stop his Ram Rath Yatra from reaching Ayodhya?"
  options: { A: "Mulayam Singh Yadav", B: "Kalyan Singh", C: "Lalu Prasad Yadav", D: "Devi Lal", E: "More than one of the above" }
  answer: C
  explanation: "Bihar chief minister Lalu Prasad Yadav had Advani arrested and placed under preventive detention when the procession passed through Bihar."
  source: "Spectrum (2019-20), p. 739"
  tags: [bpsc]

- slug: smi-39-e22
  difficulty: easy
  stem: "In which year did Lalu Prasad Yadav leave the Janata Dal and form the Rashtriya Janata Dal?"
  options: { A: "1990", B: "1994", C: "1999", D: "1997", E: "More than one of the above" }
  answer: D
  explanation: "After the Fodder Scam case, Lalu Yadav left the party and formed the Rashtriya Janata Dal in July 1997."
  source: "Spectrum (2019-20), p. 752"
  tags: [bpsc]

- slug: smi-39-e23
  difficulty: easy
  stem: "When Narasimha Rao made Manmohan Singh finance minister in 1991, what post was Manmohan Singh holding?"
  options: { A: "Chairman of the University Grants Commission", B: "Governor of the Reserve Bank of India", C: "Deputy Chairman of the Planning Commission", D: "Chief Economic Adviser" }
  answer: A
  explanation: "The book says Manmohan Singh, a non-political economist, was then Chairman of the University Grants Commission."
  source: "Spectrum (2019-20), p. 742"
  tags: [ssc]

- slug: smi-39-e24
  difficulty: easy
  stem: "How many subjects are in the Eleventh Schedule, which the 73rd Constitutional Amendment added for Panchayats?"
  options: { A: "18", B: "22", C: "29", D: "12" }
  answer: C
  explanation: "The 73rd Amendment inserted Part IX and a new Eleventh Schedule covering 29 subjects within the functions of the Panchayats."
  source: "Spectrum (2019-20), p. 744"
  tags: [ssc]

- slug: smi-39-e25
  difficulty: easy
  stem: "May 11, the date of the 1998 Pokhran nuclear tests, is celebrated in India as"
  options: { A: "National Technology Day", B: "National Science Day", C: "National Space Day", D: "National Unity Day" }
  answer: A
  explanation: "The book notes that May 11 is celebrated as National Technology Day."
  source: "Spectrum (2019-20), p. 754"
  tags: [ssc]

- slug: smi-39-e26
  difficulty: easy
  stem: "What was the Indian Air Force's operation in the Kargil war of 1999 called?"
  options: { A: "Operation Vijay", B: "Operation Shakti", C: "Operation Safed Sagar", D: "Operation Black Thunder" }
  answer: C
  explanation: "The army and the air force acted together; the air force's operation was called 'Safed Sagar'. Operation Vijay was the overall operation that recaptured the peaks."
  source: "Spectrum (2019-20), p. 755"
  tags: [ssc]

- slug: smi-39-e27
  difficulty: easy
  stem: "When it started in 2006, how many days of paid labour a year did the National Rural Employment Guarantee Act guarantee to rural households?"
  options: { A: "150 days", B: "120 days", C: "90 days", D: "100 days" }
  answer: D
  explanation: "NREGA, started in 2006, guaranteed rural households 100 days of paid labour a year, with one-third of the work mandated for women."
  source: "Spectrum (2019-20), p. 761"
  tags: [ssc]

- slug: smi-39-e28
  difficulty: easy
  stem: "India's surgical strikes of September 29, 2016 across the Line of Control were in retaliation for a terrorist attack on an army camp in which sector?"
  options: { A: "Uri", B: "Pathankot", C: "Pulwama", D: "Baramulla" }
  answer: A
  explanation: "After terrorists attacked the army camp in the Uri sector on September 18, 2016, India carried out surgical strikes on September 29, 2016."
  source: "Spectrum (2019-20), p. 791"
  tags: [ssc]

- slug: smi-39-e29
  difficulty: easy
  stem: "On which date did the Government of India announce the formation of the NITI Aayog in place of the Planning Commission?"
  options: { A: "August 15, 2014", B: "January 1, 2015", C: "May 26, 2014", D: "October 2, 2014" }
  answer: B
  explanation: "The union cabinet scrapped the Planning Commission in August 2014, and the formation of NITI Aayog was announced on January 1, 2015."
  source: "Spectrum (2019-20), p. 779"
  tags: [ssc]

- slug: smi-39-e30
  difficulty: easy
  stem: "According to the book, after the death of Ambedkar, the Dalits found a leader in"
  options: { A: "Kanshi Ram", B: "Mayawati", C: "Laldenga", D: "Jagjivan Ram", E: "More than one of the above" }
  answer: D
  explanation: "The Congress had always drawn Dalit votes, and after Ambedkar's death the Dalits found a leader in Jagjivan Ram. Kanshi Ram and Mayawati came later, with the BSP."
  source: "Spectrum (2019-20), p. 750"
  tags: [bpsc]

