  source: "Spectrum (2019-20), pp. 732-734"
  tags: [bpsc]

- slug: smi-39-m18
  difficulty: medium
  stem: "Which minister of state, who had opposed a private member's bill on the Shah Bano issue, resigned in protest when the Muslim Women (Protection of Rights on Divorce) Bill was passed in 1986?"
  options: { A: "Arif Mohammed Khan", B: "Arun Nehru", C: "V.P. Singh", D: "Mufti Mohammad Sayeed" }
  answer: A
  explanation: "Arif Mohammed Khan, minister of state in the home ministry, opposed exempting Muslims from Section 125 CrPC and resigned when the 1986 bill was passed."
  source: "Spectrum (2019-20), p. 729"
  tags: [ssc]

- slug: smi-39-m19
  difficulty: medium
  stem: "The March 1986 agreement with AB Bofors for four hundred 155mm howitzer guns was worth about"
  options: { A: "470 million US dollars", B: "285 million US dollars (about Rs 1500 crore)", C: "Rs 64 crore", D: "60 billion US dollars" }
  answer: B
  explanation: "The Bofors deal was worth 285 million dollars (about Rs 1500 crore). Rs 64 crore was the alleged bribe; 470 million dollars was the Bhopal settlement."
  source: "Spectrum (2019-20), p. 730"
  tags: [ssc]

- slug: smi-39-m20
  difficulty: medium
  stem: "Which of the following was NOT a part or product of Rajiv Gandhi's National Policy on Education, 1986?"
  options: { A: "Operation Blackboard", B: "Navodaya Vidyalayas", C: "Indira Gandhi National Open University", D: "Sarva Shiksha Abhiyan" }
  answer: D
  explanation: "Operation Blackboard, IGNOU and the Navodaya Vidyalayas came from the 1986 NPE. The Sarva Shiksha Abhiyan was an NDA (1999-2004) initiative."
  source: "Spectrum (2019-20), pp. 728, 757"
  tags: [ssc]

- slug: smi-39-m21
  difficulty: medium
  stem: "As the V.P. Singh government was about to fall, Chandra Shekhar and Devi Lal left the Janata Dal and formed the"
  options: { A: "Jan Morcha", B: "Lok Dal", C: "Samajwadi Janata Party", D: "National Front" }
  answer: C
  explanation: "Chandra Shekhar and Devi Lal formed the Samajwadi Janata Party; with Congress support from outside, Chandra Shekhar became PM with just 64 MPs."
  source: "Spectrum (2019-20), p. 740"
  tags: [ssc]

- slug: smi-39-m22
  difficulty: medium
  stem: "P.V. Narasimha Rao had not contested the 1991 elections. After becoming prime minister, he entered the Lok Sabha through a by-election from"
  options: { A: "Sriperumbudur", B: "Nandyal", C: "Hyderabad", D: "Warangal" }
  answer: B
  explanation: "After being sworn in as PM, Rao won a by-election from Nandyal in Andhra Pradesh."
  source: "Spectrum (2019-20), p. 742"
  tags: [ssc]

- slug: smi-39-m23
  difficulty: medium
  stem: |
    Match List I (initiative) with List II (prime minister under whom it began):

    | List I | List II |
    |---|---|
    | A. Jawahar Rozgar Yojana | 1. Manmohan Singh |
    | B. Look East Policy | 2. Atal Bihari Vajpayee |
    | C. Pradhan Mantri Gram Sadak Yojana | 3. P.V. Narasimha Rao |
    | D. National Rural Employment Guarantee Act | 4. Rajiv Gandhi |
  options: { A: "A-4, B-3, C-2, D-1", B: "A-3, B-4, C-2, D-1", C: "A-4, B-3, C-1, D-2", D: "A-1, B-3, C-2, D-4", E: "None of the above" }
  answer: A
  explanation: "Jawahar Rozgar Yojana — Rajiv Gandhi (1989); Look East — Rao; PMGSY — Vajpayee's NDA; NREGA — Manmohan Singh's UPA (2006)."
  source: "Spectrum (2019-20), pp. 727, 745, 756, 761"
  tags: [bpsc]

- slug: smi-39-m24
  difficulty: medium
  stem: "Which Constitution amendment act, enacted in 2016, made it possible to launch the Goods and Services Tax?"
  options: { A: "99th", B: "100th", C: "101st", D: "102nd" }
  answer: C
  explanation: "The Constitution (One Hundred and First Amendment) Act was enacted in 2016, after ratification by the states, and GST could then be launched."
  source: "Spectrum (2019-20), p. 786"
  tags: [ssc]

- slug: smi-39-m25
  difficulty: medium
  stem: "Which of the following was NOT one of the principles of the Gujral Doctrine?"
  options: { A: "No South Asian country will allow its territory to be used against the interest of another country of the region", B: "With neighbours like Nepal, Bangladesh, Bhutan, Maldives and Sri Lanka, India insists on strict reciprocity", C: "All South Asian countries will settle their disputes through peaceful bilateral negotiations", D: "None will interfere in the internal affairs of another" }
  answer: B
  explanation: "The first principle says the opposite: with these neighbours India does not ask for reciprocity but gives all it can in good faith and trust."
  source: "Spectrum (2019-20), p. 752"
  tags: [ssc]

- slug: smi-39-m26
  difficulty: medium
  stem: "The first NDA government under Vajpayee lost a confidence vote by a single vote on April 17, 1999 after which party withdrew from the alliance?"
  options: { A: "AIADMK", B: "DMK", C: "Telugu Desam Party", D: "Asom Gana Parishad" }
  answer: A
  explanation: "The government lasted until April 1999, when the AIADMK withdrew from the NDA; it lost the no-confidence motion of April 17, 1999 by one vote."
  source: "Spectrum (2019-20), p. 753"
  tags: [ssc]

- slug: smi-39-m27
  difficulty: medium
  stem: "Doklam, the site of the 2017 India–China stand-off, lies at the junction of India, China and ______, and is strategic for India because it is close to the ______."
  options: { A: "Nepal; Siliguri Corridor", B: "Bhutan; Siliguri Corridor", C: "Bhutan; Srinagar–Leh highway", D: "Nepal; Srinagar–Leh highway" }
  answer: B
  explanation: "Doklam lies at the junction of India, Bhutan and China and is close to the Siliguri Corridor, which links mainland India with the north-east."
  source: "Spectrum (2019-20), p. 793"
  tags: [ssc]

- slug: smi-39-m28
  difficulty: medium
  stem: "Under the RTE Act, 2009, private schools other than minority institutions must admit children from weaker and disadvantaged sections up to what share of their incoming class?"
  options: { A: "25 per cent", B: "27 per cent", C: "33 per cent", D: "50 per cent" }
  answer: A
  explanation: "All private schools except recognised minority institutions must enrol such children up to 25 per cent of the incoming class, chosen by simple random selection."
  source: "Spectrum (2019-20), p. 767"
  tags: [ssc]

- slug: smi-39-m29
  difficulty: medium
  stem: "When did India and the US finally sign the civil nuclear agreement, after approvals from the IAEA, the Nuclear Suppliers Group and the US Congress?"
  options: { A: "July 2005", B: "March 2006", C: "July 2008", D: "October 2008" }
  answer: D
  explanation: "Negotiations began in July 2005 and the declaration came during Bush's 2006 visit, but the agreement was signed only in October 2008; July 2008 was the trust vote."
  source: "Spectrum (2019-20), p. 761"
  tags: [ssc]

- slug: smi-39-m30
  difficulty: medium
  stem: "According to the book, the UPA government in its second term had to shelve the bill for 33 per cent reservation for women in legislatures because its own allies refused to support it — especially which party?"
  options: { A: "Samajwadi Party", B: "Bahujan Samaj Party", C: "Rashtriya Janata Dal", D: "Trinamool Congress", E: "More than one of the above" }
  answer: C
  explanation: "The bill was introduced in the Rajya Sabha, but the government shelved it because its own allies, especially the Rashtriya Janata Dal, refused to support it."
  source: "Spectrum (2019-20), p. 767"
  tags: [bpsc]

# ---------- HARD ----------
- slug: smi-39-h01
  difficulty: hard
  stem: |
    Consider the following statements about the JP movement:

    1. Jayaprakash Narayan called for 'Total Revolution' against the system that he said had forced people to become corrupt.
    2. He demanded that the Congress government in Bihar resign and the assembly be dissolved.
    3. The left opposition parties rallied behind him while the non-left parties kept away.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are in the book; it was the non-left opposition parties that rallied behind JP."
  source: "Spectrum (2019-20), p. 669"
  tags: [bpsc]

- slug: smi-39-h02
  difficulty: hard
  stem: |
    **Assertion (A):** In the 1977 elections the Congress did well in the south, winning most of its 150-odd seats there.

    **Reason (R):** The south escaped much of the Emergency excesses, and the pro-poor programmes were better implemented there than in the north.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says the Congress got most of its 150-odd seats in the south and that the results reflected the south escaping the excesses and better pro-poor implementation."
  source: "Spectrum (2019-20), pp. 676-677"
  tags: [bpsc]

- slug: smi-39-h03
  difficulty: hard
  stem: |
    Consider the following provisions of the Forty-second Amendment (1976):

    1. 'Socialist' and 'secular' were added to the Preamble.
    2. The term of the Lok Sabha was extended from five to six years.
    3. The duration of president's rule without Parliament's approval was extended from six months to one year.
    4. A national emergency could be proclaimed for a part of the territory of India.

    Which of the above is/are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: D
  explanation: "All four are listed in the book among the sweeping changes of the 42nd Amendment, the 'mini constitution'."
  source: "Spectrum (2019-20), p. 685"
  tags: [bpsc]

- slug: smi-39-h04
  difficulty: hard
  stem: |
    Consider the following statements about the Forty-fourth Amendment (1978):

    1. The president could proclaim Emergency only on the written advice of the cabinet, not the prime minister alone.
    2. Articles 20 and 21 would never be suspended even during an emergency.
    3. It restored the right to property (Article 31) as a Fundamental Right.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 2 are correct; the 44th Amendment deleted Article 31 from the Fundamental Rights, making property just a legal right."
  source: "Spectrum (2019-20), pp. 709-710"
  tags: [bpsc]

- slug: smi-39-h05
  difficulty: hard
  stem: |
    Consider the following statements about the Tashkent Declaration:

    1. It was signed at Tashkent, then the capital of the Kazakh republic of the Soviet Union.
    2. Armed personnel were to be withdrawn by 25 February 1966 to positions held before 5 August 1965.
    3. It included a no-war pact between India and Pakistan.

    Which of the statements given above is/are correct?
  options: { A: "2 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Only 2 is correct. Tashkent is the capital of Uzbekistan, and critics faulted the Declaration precisely for not including a no-war pact."
  source: "Spectrum (2019-20), pp. 662-663"
  tags: [bpsc]

- slug: smi-39-h06
  difficulty: hard
  stem: "As Union home minister, Lal Bahadur Shastri formed the Committee on Prevention of Corruption, on whose recommendations the Central Vigilance Commission was set up. Who headed that committee?"
  options: { A: "L.K. Jha", B: "S. Bhoothalingam", C: "K. Santhanam", D: "Dharma Vira" }
  answer: C
  explanation: "The Committee on Prevention of Corruption was headed by K. Santhanam; the CVC was established on its recommendations. Jha, Bhoothalingam and Dharma Vira were in Shastri's economic team."
  source: "Spectrum (2019-20), p. 655"
  tags: [ssc]

- slug: smi-39-h07
  difficulty: hard
  stem: |
    Consider the following statements about the foundations of the Green Revolution under Shastri:

    1. Dr B.P. Pal became the first scientist to head the reorganised Indian Council of Agricultural Research.
    2. M.S. Swaminathan of the IARI made the government aware of the high-yielding wheat varieties developed by Norman Borlaug's team in Mexico.
    3. Under the Subramaniam-Freeman accord (Rome, November 1965), India committed to ending food grain imports by 1971.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book's account of how Shastri and C. Subramaniam laid the foundations of the Green Revolution."
  source: "Spectrum (2019-20), p. 658"
  tags: [bpsc]

- slug: smi-39-h08
  difficulty: hard
  stem: |
    Consider the following statements about Charan Singh as prime minister (1979):

    1. He gave the prime minister's Independence Day speech from the Red Fort.
    2. Indira Gandhi withdrew support because he refused to make Sanjay Gandhi a minister.
    3. He remained caretaker prime minister until fresh elections could take place.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "1 and 3 are correct. Indira Gandhi withdrew support because he would not disband the special courts set up to prosecute her."
  source: "Spectrum (2019-20), pp. 707-708"
  tags: [bpsc]

- slug: smi-39-h09
  difficulty: hard
  stem: |
    Consider the following statements about Mizoram:

    1. In 1966 the Mizo National Front under Laldenga demanded sovereign independence of Greater Mizoram.
    2. Air force strikes were carried out in Aizawl, the only time the IAF was used this way in civilian Indian territory.
    3. Mizoram became a full-fledged state in January 1972.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "1 and 2 are correct. In January 1972 Mizoram became a Union Territory; it became a full state only in 1987 under Rajiv Gandhi."
  source: "Spectrum (2019-20), p. 681"
  tags: [bpsc]

- slug: smi-39-h10
  difficulty: hard
  stem: "According to the book, why did Indira Gandhi nationalise the oil companies in 1973?"
  options: { A: "To counter the 1973 oil crisis", B: "Foreign-owned oil companies refused to supply fuel to Indian forces in the 1971 war", C: "To fund the Twenty Point Programme", D: "On the recommendation of the Shivaraman Committee" }
  answer: B
  explanation: "Foreign-owned oil companies refused fuel to the Indian forces during the 1971 war, so the oil companies were nationalised in 1973."
  source: "Spectrum (2019-20), p. 687"
  tags: [ssc]

- slug: smi-39-h11
  difficulty: hard
  stem: |
    Consider the following statements about Sikkim:

    1. Sikkim had become a protectorate of India in 1950.
    2. The Chogyal, failing to suppress the Sikkim Congress's movement for greater political rights, turned to India.
    3. Sikkim became the 22nd state of India in May 1975 after the Thirty-sixth Amendment.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are in the book; a 1975 referendum backed merger, and Sikkim became the 22nd state after the 36th Amendment."
  source: "Spectrum (2019-20), p. 682"
  tags: [bpsc]

- slug: smi-39-h12
  difficulty: hard
  stem: |
    Match List I (Constitutional Amendment) with List II (provision):

    | List I | List II |
    |---|---|
    | a. 24th (1971) | 1. Giving effect to certain directive principles cannot be challenged as inconsistent with certain fundamental rights |
    | b. 25th (1972) | 2. Satisfaction of the president or governor in declaring emergency cannot be challenged in court |
    | c. 38th (1975) | 3. Parliament authorised to amend any provision of the Constitution |
    | d. 39th (1975) | 4. Election disputes of president, vice-president, speaker and prime minister only before a special court |
  options: { A: "a-3, b-2, c-1, d-4", B: "a-1, b-3, c-2, d-4", C: "a-3, b-1, c-2, d-4", D: "a-4, b-1, c-2, d-3", E: "None of the above" }
  answer: C
  explanation: "24th overcame Golaknath by letting Parliament amend any provision; 25th protected directive principles; 38th barred review of emergency satisfaction; 39th moved top election disputes to a special court."
  source: "Spectrum (2019-20), pp. 683-684"
  tags: [bpsc]

- slug: smi-39-h13
  difficulty: hard
  stem: "The roots of the Siachen conflict lay in the lack of demarcation beyond which map coordinate?"
  options: { A: "Teram Kangri", B: "Gyong La", C: "Saltoro", D: "NJ9842" }
  answer: D
  explanation: "The conflict arose from the lack of proper demarcation beyond the map coordinate known as NJ9842."
  source: "Spectrum (2019-20), p. 715"
  tags: [ssc]

- slug: smi-39-h14
  difficulty: hard
  stem: |
    Consider the following statements about the Punjab crisis:

    1. The Akalis brought out the Anandpur Resolution in 1973.
    2. Akali legislators resigned en masse from the state assembly on Independence Day 1983.
    3. Jarnail Singh Bhindranwale was the head of the Damdami Taksal.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "1 and 3 are correct. The Akali legislators resigned en masse on Republic Day of 1983."
  source: "Spectrum (2019-20), p. 717"
  tags: [bpsc]

- slug: smi-39-h15
  difficulty: hard
  stem: "After the June 1977 state assembly elections, which of the following pairs (state - government formed) is NOT correctly matched?"
  options: { A: "Bihar - Janata Party", B: "Punjab - Janata Party and Akali Dal coalition", C: "Tamil Nadu - DMK", D: "West Bengal - Left coalition under Jyoti Basu", E: "None of the above" }
  answer: C
  explanation: "In Tamil Nadu the AIADMK swept the polls and M.G. Ramachandran formed the government; the other pairs are correct."
  source: "Spectrum (2019-20), p. 704"
  tags: [bpsc]

- slug: smi-39-h16
  difficulty: hard
  stem: |
    Consider the following statements about the Mandal Commission and its implementation:

    1. The Mandal Commission submitted its report in December 1980.
    2. The Supreme Court's November 1992 verdict upholding the reservation order was unanimous.
    3. The Supreme Court laid down that reservations in all should not exceed 50 per cent and that the caste criterion should not apply to promotions.
    4. The Narasimha Rao government's order of September 1991 gave preference to the poorer sections of the OBCs within the 27 per cent.

    Which of the statements given above are correct?
  options: { A: "1 and 3 only", B: "1, 3 and 4 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "Statement 2 is wrong: seven judges upheld the order and three dissented, saying impersonal criteria rather than caste should be used."
  source: "Spectrum (2019-20), pp. 737-739"
  tags: [bpsc]

- slug: smi-39-h17
  difficulty: hard
  stem: |
    **Assertion (A):** The protests against the implementation of the Mandal Commission recommendations in 1990 were intense in the north, while the south was not affected.

    **Reason (R):** In the south, reservation had long been in place, the industrial sector offered alternative jobs, and the proportion of upper castes in the population was lower.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book explains that the south was unaffected because reservation had been in place for some time, youngsters relied less on government jobs, and upper castes formed a smaller share of the population."
  source: "Spectrum (2019-20), p. 738"
  tags: [bpsc]

- slug: smi-39-h18
  difficulty: hard
  stem: |
    Consider the following statements about the Liberhan Commission:

    1. It was a one-man commission appointed ten days after the Babri Masjid demolition.
    2. It submitted its report in June 2009, when the UPA was in government.
    3. It held 68 people culpable, including L.K. Advani, Atal Bihari Vajpayee and Kalyan Singh.
    4. It criticised the Narasimha Rao government for not imposing president's rule in Uttar Pradesh before December 6, 1992.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "The report apparently did not criticise Rao and accepted his contention that president's rule could not legally be imposed in UP before the event."
  source: "Spectrum (2019-20), pp. 747-748"
  tags: [bpsc]

- slug: smi-39-h19
  difficulty: hard
  stem: |
    Consider the following statements about the JMM bribery case linked to the Narasimha Rao government:

    1. In the no-confidence motion of July 1993, some members of the Jharkhand Mukti Morcha and the Janata Dal (Ajit Singh group) voted against the motion, saving the government.
    2. A special court convicted Narasimha Rao and Buta Singh.
    3. On appeal, both were cleared of the charges in 2002.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book; the conviction was overturned mainly because of doubts about the credibility of Mahato, who said he had taken the bribe."
  source: "Spectrum (2019-20), p. 748"
  tags: [bpsc]

- slug: smi-39-h20
  difficulty: hard
  stem: |
    Consider the following statements about the Fodder Scam episode during the Gujral government:

    1. The Governor of Bihar gave the CBI permission to take up a corruption case against Chief Minister Lalu Prasad Yadav.
    2. Prime Minister I.K. Gujral personally told Lalu Yadav to resign.
    3. The Gujral government fell because Lalu Yadav's new party withdrew its support.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Statement 3 is wrong: Lalu's new Rashtriya Janata Dal supported the United Front, so the government did not fall. It fell when the Congress withdrew support over the Jain Commission report."
  source: "Spectrum (2019-20), pp. 752-753"
  tags: [bpsc]

- slug: smi-39-h21
  difficulty: hard
  stem: "The report of the Jain Commission, tabled in November 1997, led the Congress to withdraw support from the Gujral government. What had the commission inquired into?"
  options: { A: "The Babri Masjid demolition", B: "The anti-Sikh riots of 1984", C: "Kickbacks in the Bofors deal", D: "The conspiracy aspects of Rajiv Gandhi's assassination" }
  answer: D
  explanation: "The Jain Commission inquired into the conspiracy behind Rajiv Gandhi's assassination; it criticised the DMK, and Gujral refused to drop the DMK ministers. The Liberhan Commission probed the Babri demolition."
  source: "Spectrum (2019-20), p. 753"
  tags: [ssc]

- slug: smi-39-h22
  difficulty: hard
  stem: |
    Consider the following statements about Pokhran II (Operation Shakti):

    1. India conducted a series of five nuclear explosions in May 1998.
    2. A.P.J. Abdul Kalam, then head of DRDO, and R. Chidambaram, then Director of the Department of Atomic Energy, were the main scientists involved.
    3. Pakistan responded with its Chagai I and II tests in June 1998.
    4. The US implemented the Glenn Amendment for the first time.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2 and 4 only", E: "None of the above" }
  answer: D
  explanation: "Pakistan's Chagai I and II tests were also in May 1998; in June the UN Security Council adopted a resolution condemning both countries' tests."
  source: "Spectrum (2019-20), p. 754"
  tags: [bpsc]

- slug: smi-39-h23
  difficulty: hard
  stem: |
    Consider the following statements about the Kargil war of 1999:

    1. The Indian Army first learnt of the incursion from a group of shepherds in May 1999.
    2. Tiger Hill in the Drass sector was crucial because it overlooked the Srinagar–Leh highway.
    3. The Indian forces were permitted to cross the Line of Control to cut off the intruders.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The book states that the military were told clearly that they were not to cross the Line of Control, so statement 3 is wrong."
  source: "Spectrum (2019-20), pp. 755-756"
  tags: [bpsc]

- slug: smi-39-h24
  difficulty: hard
  stem: |
    Consider the following statements about the NDA government of 1999-2004:

    1. It got the Fiscal Responsibility and Budget Management Act passed in 2003.
    2. It upgraded the Disinvestment Commission into a ministry.
    3. Its new telecom policy moved from a revenue-share fee to a high fixed licence fee.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The new telecom policy did the reverse: it shifted from a high fixed licence fee to a revenue-share fee."
  source: "Spectrum (2019-20), p. 757"
  tags: [bpsc]

