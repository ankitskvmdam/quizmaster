- slug: smi-39-m01
  difficulty: medium
  stem: |
    Arrange the following agreements in chronological order:

    1. Tashkent Declaration
    2. Simla Agreement
    3. Indo-Soviet Treaty of Peace, Friendship and Cooperation
    4. Bandaranaike-Shastri accord
  options: { A: "4, 1, 2, 3", B: "1, 4, 3, 2", C: "4, 1, 3, 2", D: "4, 3, 1, 2", E: "None of the above" }
  answer: C
  explanation: "Bandaranaike-Shastri accord 1964, Tashkent Declaration January 1966, Indo-Soviet Treaty August 1971, Simla Agreement July 1972."
  source: "Spectrum (2019-20), pp. 660, 662, 694, 697"
  tags: [bpsc]

- slug: smi-39-m02
  difficulty: medium
  stem: |
    Match List I (person) with List II (role as given in the book):

    | List I | List II |
    |---|---|
    | a. Raja Ramanna | 1. Eastern Naval Command chief who blockaded East Pakistan, 1971 |
    | b. Homi Sethna | 2. BARC Director who guided the Pokhran I device |
    | c. S.N. Kohli | 3. Western Naval Command chief behind Operation Trident |
    | d. Nilakanta Krishnan | 4. Atomic Energy Commission Chairman who oversaw Pokhran I |
  options: { A: "a-4, b-2, c-3, d-1", B: "a-2, b-4, c-1, d-3", C: "a-2, b-3, c-4, d-1", D: "a-2, b-4, c-3, d-1", E: "None of the above" }
  answer: D
  explanation: "Ramanna (BARC Director) guided the device and Sethna (AEC Chairman) oversaw it; Kohli led the Western Naval Command's attack on Karachi and Krishnan the Eastern Naval Command's blockade."
  source: "Spectrum (2019-20), pp. 695-696, 703"
  tags: [bpsc]

- slug: smi-39-m03
  difficulty: medium
  stem: "Which party supported the Emergency 'to thwart right reactionary forces' and later regretted its position?"
  options: { A: "Communist Party of India", B: "Communist Party (Marxist)", C: "Congress (O)", D: "Bharatiya Lok Dal" }
  answer: A
  explanation: "The CPI supported the Emergency and later regretted it; the CPM opposed it and some of its members were jailed."
  source: "Spectrum (2019-20), p. 674"
  tags: [ssc]

- slug: smi-39-m04
  difficulty: medium
  stem: "Who became the first principal secretary to a prime minister in India?"
  options: { A: "L.K. Jha", B: "P.N. Haksar", C: "P.N. Dhar", D: "T.N. Kaul" }
  answer: B
  explanation: "L.K. Jha was Shastri's secretary, but the real expansion of the PM's secretariat came under Indira Gandhi with P.N. Haksar as the first principal secretary."
  source: "Spectrum (2019-20), pp. 656, 683"
  tags: [ssc]

- slug: smi-39-m05
  difficulty: medium
  stem: "The Agricultural Prices Commission and the Food Corporation of India came into being in"
  options: { A: "October 1964", B: "June 1966", C: "January 1965", D: "July 1969" }
  answer: C
  explanation: "As incentives for the new farm technology under Shastri, the APC and FCI came into being in January 1965."
  source: "Spectrum (2019-20), p. 658"
  tags: [ssc]

- slug: smi-39-m06
  difficulty: medium
  stem: "How many private banks were nationalised in July 1969, and how many more in 1980?"
  options: { A: "14 and 6", B: "6 and 14", C: "14 and 8", D: "20 and 6" }
  answer: A
  explanation: "Indira Gandhi nationalised fourteen major private banks by ordinance in July 1969; another six were nationalised in 1980."
  source: "Spectrum (2019-20), p. 686"
  tags: [ssc]

- slug: smi-39-m07
  difficulty: medium
  stem: "Privy purses of former princely rulers were abolished in 1971 by which Constitutional Amendment?"
  options: { A: "Twenty-fourth", B: "Twenty-fifth", C: "Twenty-sixth", D: "Thirty-eighth" }
  answer: C
  explanation: "The 1969 attempt failed in the Rajya Sabha; privy purses were abolished only with the Twenty-sixth Amendment in 1971, which inserted Article 363-A."
  source: "Spectrum (2019-20), pp. 687-688"
  tags: [ssc]

- slug: smi-39-m08
  difficulty: medium
  stem: "Which of the following was NOT one of the parties that came together to form the Janata Party for the 1977 elections?"
  options: { A: "Jan Sangh", B: "Bharatiya Lok Dal", C: "Socialist Party", D: "Communist Party of India", E: "More than one of the above" }
  answer: D
  explanation: "The Jan Sangh, Congress (O), Bharatiya Lok Dal and the Socialist Party formed the Janata Party; the CPI was an ally of the Congress."
  source: "Spectrum (2019-20), p. 676"
  tags: [bpsc]

- slug: smi-39-m09
  difficulty: medium
  stem: "In February 1977 Jagjivan Ram left Indira Gandhi's Congress to form the Congress for Democracy along with"
  options: { A: "Charan Singh and Raj Narain", B: "Nandini Satpathy and Hemvati Nandan Bahuguna", C: "Chandra Shekhar and Asoka Mehta", D: "Morarji Desai and Charan Singh" }
  answer: B
  explanation: "Jagjivan Ram, Nandini Satpathy and H.N. Bahuguna formed the CFD, which allied with Janata and merged with it after the elections."
  source: "Spectrum (2019-20), p. 676"
  tags: [ssc]

- slug: smi-39-m10
  difficulty: medium
  stem: "Which Constitutional Amendment replaced the term 'internal disturbances' with 'armed rebellion' as a ground for imposing Emergency?"
  options: { A: "Forty-second", B: "Forty-third", C: "Thirty-eighth", D: "Forty-fourth" }
  answer: D
  explanation: "The Forty-fourth Amendment (1978) made imposing Emergency harder, including replacing 'internal disturbances' with 'armed rebellion'."
  source: "Spectrum (2019-20), p. 709"
  tags: [ssc]

- slug: smi-39-m11
  difficulty: medium
  stem: "The movement in Bihar that Jayaprakash Narayan took up in 1974 had begun as"
  options: { A: "a series of student protests", B: "the all-India railway strike", C: "a peasant agitation against land ceilings", D: "the Nav Nirman movement", E: "More than one of the above" }
  answer: A
  explanation: "The Bihar movement began as student protests and was soon taken up by JP on the larger issue of corruption in high places; Nav Nirman was in Gujarat."
  source: "Spectrum (2019-20), p. 669"
  tags: [bpsc]

- slug: smi-39-m12
  difficulty: medium
  stem: "The Nav Nirman movement (December 1973-March 1974) forced the resignation of which chief minister?"
  options: { A: "Ajoy Mukherjee", B: "Chimanbhai Patel", C: "C.N. Annadurai", D: "Nandini Satpathy", E: "More than one of the above" }
  answer: B
  explanation: "The Nav Nirman movement in Gujarat led to the resignation of CM Chimanbhai Patel and president's rule in the state."
  source: "Spectrum (2019-20), p. 669"
  tags: [bpsc]

- slug: smi-39-m13
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. Sikkim becomes the 22nd state of India
    2. Haryana carved out of Punjab
    3. Nagaland becomes a separate state
    4. Union Territory of Mizoram comes into being
  options: { A: "2, 3, 4, 1", B: "3, 2, 4, 1", C: "3, 2, 1, 4", D: "3, 4, 2, 1", E: "None of the above" }
  answer: B
  explanation: "Nagaland 1963, Haryana 1966, Mizoram UT January 1972, Sikkim as 22nd state May 1975."
  source: "Spectrum (2019-20), pp. 681-682"
  tags: [bpsc]

- slug: smi-39-m14
  difficulty: medium
  stem: "At Simla in 1972, India wanted a 'no-war pact' with Pakistan but had to settle for"
  options: { A: "a 'renunciation of force' by both sides", B: "a plebiscite in Kashmir", C: "a joint defence agreement", D: "UN supervision of the Line of Control" }
  answer: A
  explanation: "India wanted a 'no-war pact' but had to agree to a 'renunciation of force'; the agreement (not a treaty) was signed on July 2, 1972."
  source: "Spectrum (2019-20), p. 697"
  tags: [ssc]

- slug: smi-39-m15
  difficulty: medium
  stem: "During Operation Blue Star, the army storming Harmandir Sahib was under the command of"
  options: { A: "A.S. Vaidya", B: "K. Sundarji", C: "Shubeg Singh", D: "K.S. Brar" }
  answer: D
  explanation: "Major General K.S. Brar commanded the troops under the direction of General K. Sundarji; Army Chief A.S. Vaidya had recommended the operation."
  source: "Spectrum (2019-20), p. 718"
  tags: [ssc]

- slug: smi-39-m16
  difficulty: medium
  stem: |
    Arrange the following events of the Rajiv Gandhi years in chronological order:

    1. Mizoram became the 23rd state of India
    2. Rajiv Gandhi–Longowal agreement on Punjab
    3. Operation Black Thunder at the Golden Temple
    4. Assam Accord with the All Assam Students Union
  options: { A: "2, 1, 4, 3", B: "4, 2, 1, 3", C: "2, 4, 1, 3", D: "2, 4, 3, 1", E: "None of the above" }
  answer: C
  explanation: "Punjab accord (July 1985), Assam Accord (August 15, 1985), Mizoram statehood (February 1987), Operation Black Thunder (May 1988)."
  source: "Spectrum (2019-20), p. 723"
  tags: [bpsc]

- slug: smi-39-m17
  difficulty: medium
  stem: |
    Match List I (operation under Rajiv Gandhi) with List II (where it was carried out):

    | List I | List II |
    |---|---|
    | A. Flowers are Blooming | 1. Quaid Post, Siachen |
    | B. Cactus | 2. Seychelles |
    | C. Poomalai | 3. Jaffna, Sri Lanka (air-drop of relief) |
    | D. Rajiv | 4. Maldives |
  options: { A: "A-2, B-3, C-4, D-1", B: "A-4, B-2, C-3, D-1", C: "A-2, B-4, C-1, D-3", D: "A-2, B-4, C-3, D-1", E: "None of the above" }
