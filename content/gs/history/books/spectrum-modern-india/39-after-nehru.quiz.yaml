- slug: smi-39-h27
  difficulty: hard
  stem: |
    Match List I (law under the NDA government) with List II (feature):

    | List I | List II |
    |---|---|
    | A. Insolvency and Bankruptcy Code, 2016 | 1. A regulator in every state; every project must register with it |
    | B. Benami Transactions (Prohibition) Amendment Act, 2016 | 2. Provisional attachment and confiscation of property; jail of one to seven years |
    | C. Real Estate (Regulation and Development) Act, 2016 | 3. A person who flees the country to avoid due process can have property confiscated and auctioned |
    | D. Fugitive Economic Offenders Act, 2018 | 4. Replaced overlapping provisions of laws such as SICA 1985 and the Sarfaesi Act |
  options: { A: "A-4, B-2, C-3, D-1", B: "A-4, B-2, C-1, D-3", C: "A-2, B-4, C-1, D-3", D: "A-3, B-2, C-1, D-4", E: "None of the above" }
  answer: B
  explanation: "IBC consolidated insolvency laws (SICA, Sarfaesi, etc.); the Benami Act allows attachment and 1-7 years' jail; RERA sets up state regulators; FEOA allows confiscation of fugitives' property."
