- slug: smi-39-h29
  difficulty: hard
  stem: |
    Consider the following statements about the 2019 general election, as described in the book:

    1. The NDA won 353 seats, with the BJP alone winning 303.
    2. The Congress won 52 seats, better than its 44 seats in 2014.
    3. President Pranab Mukherjee administered the oath of office to Narendra Modi on May 30, 2019.
    4. Narendra Modi was the first BJP leader to be elected a second time after completing a five-year tenure.

    Which of the statements given above are correct?
  options: { A: "1, 2 and 4 only", B: "1 and 2 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: A
  explanation: "President Ram Nath Kovind administered the oath in 2019; Pranab Mukherjee had sworn Modi in in 2014. Before Modi, only Nehru and Indira Gandhi (both Congress) had achieved the re-election feat."
  source: "Spectrum (2019-20), pp. 777, 799-800"
  tags: [bpsc]

