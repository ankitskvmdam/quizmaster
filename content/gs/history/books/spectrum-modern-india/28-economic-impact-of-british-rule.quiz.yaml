# Chapter 28 — Economic Impact of British Rule in India (book pp. 541-556)
# ---------- EASY ----------
- slug: smi-28-e01
  difficulty: easy
  stem: "Which Charter Act allowed one-way free trade for British citizens, flooding the Indian market with cheap machine-made imports?"
  options: { A: "Charter Act of 1793", B: "Charter Act of 1813", C: "Charter Act of 1833", D: "Charter Act of 1853" }
  answer: B
  explanation: "Cheap machine-made imports flooded India after the Charter Act of 1813 allowed one-way free trade for British citizens."
  source: "Spectrum (2019-20), p. 541"
  tags: [ssc]

- slug: smi-28-e02
  difficulty: easy
  stem: "The first cotton textile mill in India, set up in Bombay in 1853, was established by"
  options: { A: "Jamsetji Tata", B: "Dwarkanath Tagore", C: "Walchand Hirachand", D: "Cowasjee Nanabhoy" }
  answer: D
  explanation: "The book states the first cotton textile mill was set up in 1853 in Bombay by Cowasjee Nanabhoy."
  source: "Spectrum (2019-20), p. 547"
  tags: [ssc]

- slug: smi-28-e03
  difficulty: easy
  stem: "Tariffs of nearly how much were imposed on Indian textiles so that Indian cloth could no longer be cheap in Europe?"
  options: { A: "80 per cent", B: "50 per cent", C: "60 per cent", D: "100 per cent" }
  answer: A
  explanation: "Tariffs of nearly 80 per cent were imposed on Indian textiles, and after 1820 European markets were virtually closed to Indian exports."
  source: "Spectrum (2019-20), pp. 541-542"
  tags: [ssc]

- slug: smi-28-e04
  difficulty: easy
  stem: "The theory of economic drain was put forward in which book?"
  options: { A: "The Economic History of India", B: "An Era of Darkness", C: "Poverty and UnBritish Rule in India", D: "India Reform Tract" }
  answer: C
  explanation: "Dadabhai Naoroji put forward the drain theory in Poverty and UnBritish Rule in India."
  source: "Spectrum (2019-20), p. 548"
  tags: [ssc]

- slug: smi-28-e05
  difficulty: easy
  stem: "'The Economic History of India' was written by"
  options: { A: "Dadabhai Naoroji", B: "Romesh Chandra Dutt", C: "Mahadeo Govind Ranade", D: "G.V. Joshi" }
  answer: B
  explanation: "The book lists Romesh Chandra Dutt (The Economic History of India) among the early economic analysts."
  source: "Spectrum (2019-20), pp. 548-549"
  tags: [ssc]

- slug: smi-28-e06
  difficulty: easy
  stem: "Which Marxist historian identified three overlapping stages in the history of imperialist rule in India?"
  options: { A: "Rajni Palme Dutt", B: "Romesh Chandra Dutt", C: "Angus Maddison", D: "D.H. Buchanan" }
  answer: A
  explanation: "Marxist historians, especially Rajni Palme Dutt, identified three overlapping stages of colonialism in India."
  source: "Spectrum (2019-20), p. 552"
  tags: [ssc]

- slug: smi-28-e07
  difficulty: easy
  stem: "According to historians quoted in the book, India's share of the world economy at the beginning of the eighteenth century was about"
  options: { A: "3 per cent", B: "13 per cent", C: "23 per cent", D: "33 per cent" }
  answer: C
  explanation: "India had some 23 per cent of the world economy in the early 18th century, which fell to some 3 per cent at independence."
  source: "Spectrum (2019-20), p. 541"
  tags: [ssc]

- slug: smi-28-e08
  difficulty: easy
  stem: "According to the book, about how many people died in famines in India between 1850 and 1900?"
  options: { A: "1 crore", B: "1.5 crore", C: "3.5 crore", D: "2.8 crore", E: "More than one of the above" }
  answer: D
  explanation: "Between 1850 and 1900, about 2.8 crore people died in famines, which the book links to poverty caused by colonial forces."
  source: "Spectrum (2019-20), p. 544"
  tags: [bpsc]

- slug: smi-28-e09
  difficulty: easy
  stem: "Who said, 'The misery hardly finds a parallel in the history of commerce; the bones of cotton weavers are bleaching the plains of north India'?"
  options: { A: "William Bentinck", B: "Macaulay", C: "D.H. Buchanan", D: "John Sullivan" }
  answer: A
  explanation: "The book quotes William Bentinck on the misery of the ruined cotton weavers."
  source: "Spectrum (2019-20), p. 542"
  tags: [ssc]

- slug: smi-28-e10
  difficulty: easy
  stem: "Who described the British system as 'a sponge, drawing up all the good things from the banks of the Ganges, and squeezing them down on the banks of the Thames'?"
  options: { A: "Sir George Wingate", B: "William Bentinck", C: "Macaulay", D: "John Sullivan", E: "More than one of the above" }
  answer: D
  explanation: "The 'sponge' remark is by John Sullivan, President, Board of Revenue, Madras."
  source: "Spectrum (2019-20), p. 550"
  tags: [bpsc]

- slug: smi-28-e11
  difficulty: easy
  stem: "The book describes the moderate phase of the freedom struggle, the 'seed-time' of the national movement, as the period"
  options: { A: "1857-1885", B: "1875-1905", C: "1905-1918", D: "1918-1935" }
  answer: B
  explanation: "Economic agitation stimulated national consciousness during the moderate phase (1875-1905), the seed-time of the national movement, as stated in this chapter."
  source: "Spectrum (2019-20), p. 552"
  tags: [ssc]

- slug: smi-28-e12
  difficulty: easy
  stem: "The first stage of colonialism, the Period of Merchant Capital or East India Company's Domination, is dated by the book as"
  options: { A: "1600-1757", B: "1813-1858", C: "1757-1813", D: "1858-1905", E: "More than one of the above" }
  answer: C
  explanation: "The first stage — Monopoly Trade and Direct Appropriation, or the Period of East India Company's Domination — covers 1757-1813."
  source: "Spectrum (2019-20), p. 553"
  tags: [bpsc]

# ---------- MEDIUM ----------
- slug: smi-28-m01
  difficulty: medium
  stem: |
    Match List I (statement quoted in the book) with List II (author):

    | List I | List II |
    |---|---|
    | a. 'The armour of the isolated self-sufficient village was pierced by the steel rail' | 1. Angus Maddison |
    | b. Taxes spent abroad 'might as well be thrown into the sea' | 2. Macaulay |
    | c. 'There can be no denial that there was a substantial outflow which lasted for 190 years' | 3. D.H. Buchanan |
    | d. 'The servants of the Company forced the natives to buy dear and sell cheap' | 4. Sir George Wingate |
  options: { A: "a-3, b-1, c-4, d-2", B: "a-3, b-4, c-1, d-2", C: "a-2, b-4, c-1, d-3", D: "a-4, b-3, c-2, d-1", E: "None of the above" }
  answer: B
  explanation: "The steel-rail remark is D.H. Buchanan's, 'thrown into the sea' is Sir George Wingate's, the 190-year outflow is Angus Maddison's and 'buy dear and sell cheap' is Macaulay's."
  source: "Spectrum (2019-20), pp. 542, 545, 550-551"
  tags: [bpsc]

- slug: smi-28-m02
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. First jute mill at Rishra (Bengal)
    2. Law refusing to treat Indian-built ships as 'British-registered vessels'
    3. Slump in cotton prices that hit cultivators
    4. First cotton textile mill in Bombay
  options: { A: "2-1-4-3", B: "4-2-1-3", C: "2-4-1-3", D: "4-1-2-3" }
  answer: C
  explanation: "The ship-registration law came in 1814, the Bombay cotton mill in 1853, the Rishra jute mill in 1855 and the cotton price slump in 1866."
  source: "Spectrum (2019-20), pp. 545-547"
  tags: [ssc]

- slug: smi-28-m03
  difficulty: medium
  stem: "Which of the following correctly describes the British laws that ruined Indian shipping?"
  options: { A: "1813: ships below 350 tonnes barred from sailing between India and Britain; 1814: Indian-built ships not treated as 'British-registered vessels'", B: "1813: Indian-built ships not treated as 'British-registered vessels'; 1814: ships below 350 tonnes barred from sailing between India and Britain", C: "1813: ships above 350 tonnes barred from sailing between India and Britain; 1814: Indian-built ships not treated as 'British-registered vessels'", D: "1813: ships below 500 tonnes barred from sailing between India and Britain; 1814: Indian ships barred from coastal trade", E: "None of the above" }
  answer: A
  explanation: "An 1813 law barred ships below 350 tonnes from the India-Britain route, and an 1814 law denied Indian-built ships 'British-registered' status for trade with America and Europe."
  source: "Spectrum (2019-20), p. 546"
  tags: [bpsc]

- slug: smi-28-m04
  difficulty: medium
  stem: "Which of the following was NOT listed by the book as a component of the economic drain?"
  options: { A: "Salaries and pensions of civil and military officials", B: "Interest on loans taken by the Indian Government from abroad", C: "Stores purchased in Britain for civil and military departments", D: "Expenditure on famine relief within India" }
  answer: D
  explanation: "The drain components were salaries and pensions, interest on foreign loans, profits on foreign investment, stores bought in Britain, and payments for shipping, banking and insurance."
  source: "Spectrum (2019-20), p. 548"
  tags: [ssc]

- slug: smi-28-m05
  difficulty: medium
  stem: "According to nationalist estimates quoted in the book, the economic drain amounted to one-third of India's"
  options: { A: "total land revenue", B: "total government revenue", C: "total savings", D: "total exports", E: "None of the above" }
  answer: C
  explanation: "The drain was estimated at more than the total land revenue, or half the total government revenue, or one-third of the total savings."
  source: "Spectrum (2019-20), pp. 551-552"
  tags: [bpsc]

- slug: smi-28-m06
  difficulty: medium
  stem: "The second stage of colonialism, termed 'Colonialism of Free Trade', lasted from"
  options: { A: "the Battle of Plassey to the Charter Act of 1813", B: "the Charter Act of 1813 to the 1860s", C: "the 1860s to 1918", D: "the Charter Act of 1833 to 1905" }
  answer: B
  explanation: "The second stage started with the Charter Act of 1813 and continued till the 1860s."
  source: "Spectrum (2019-20), p. 554"
  tags: [ssc]

- slug: smi-28-m07
  difficulty: medium
  stem: "In the third stage of colonialism, the replacement of liberal by reactionary imperialist policies was reflected in the viceroyalties of"
  options: { A: "Lytton, Dufferin, Lansdowne and Curzon", B: "Ripon, Dufferin, Minto and Curzon", C: "Canning, Lawrence, Mayo and Lytton", D: "Dalhousie, Canning, Elgin and Ripon", E: "None of the above" }
  answer: A
  explanation: "Reactionary imperialist policies were reflected in the viceroyalties of Lytton, Dufferin, Lansdowne and Curzon."
  source: "Spectrum (2019-20), pp. 555-556"
  tags: [bpsc]

- slug: smi-28-m08
  difficulty: medium
  stem: "Who remarked, 'Expenditure on railways should be seen as an Indian subsidy to British industries'?"
  options: { A: "G. Subramaniya Iyer", B: "Gopal Krishna Gokhale", C: "Mahadeo Govind Ranade", D: "G.V. Joshi" }
  answer: D
  explanation: "G.V. Joshi made this remark while arguing that railway benefits accrued to British industry."
  source: "Spectrum (2019-20), p. 551"
  tags: [ssc]

- slug: smi-28-m09
  difficulty: medium
  stem: "Indian-owned industries came up in the nineteenth century mainly in"
  options: { A: "sugar and cement", B: "cotton textiles and jute", C: "steel and shipping", D: "tea and coffee plantations" }
  answer: B
  explanation: "Indian-owned industries came up in cotton textiles and jute in the 19th century and in sugar, cement, etc., in the 20th century."
  source: "Spectrum (2019-20), p. 547"
  tags: [ssc]

- slug: smi-28-m10
  difficulty: medium
  stem: "Ready markets abroad for which Indian exports were among the reasons for the rush of foreign capital into India?"
  options: { A: "Cotton textiles, sugar and cement", B: "Indigo, opium and silk", C: "Tea, jute and manganese", D: "Coal, steel and petroleum" }
  answer: C
  explanation: "The book lists ready markets abroad for some Indian exports such as tea, jute and manganese."
  source: "Spectrum (2019-20), p. 547"
  tags: [ssc]

- slug: smi-28-m11
  difficulty: medium
  stem: "Which of the following was NOT among the financial demands of the early nationalists?"
  options: { A: "Reduction of land revenue", B: "Abolition of salt tax", C: "Excise duties on consumer goods consumed by the rich middle classes", D: "Abolition of income tax", E: "More than one of the above" }
  answer: D
  explanation: "The nationalists demanded reduction of land revenue, abolition of salt tax, imposition (not abolition) of income tax, and excise duties on goods consumed by the rich."
  source: "Spectrum (2019-20), p. 551"
  tags: [bpsc]

- slug: smi-28-m12
  difficulty: medium
  stem: "During the second stage of colonialism, India absorbed what share of British exports and of Britain's textile exports respectively?"
  options: { A: "10 to 12 per cent; nearly 20 per cent", B: "2 to 3 per cent; nearly 10 per cent", C: "20 per cent; 10 to 12 per cent", D: "8 per cent; nearly 27 per cent" }
  answer: A
  explanation: "India absorbed 10 to 12 per cent of British exports and nearly 20 per cent of Britain's textile exports."
  source: "Spectrum (2019-20), p. 555"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-28-h01
  difficulty: hard
  stem: |
    Consider the following statements about the economic drain as described in the book:

    1. The surplus from the British economy re-entered India as finance capital, further draining India of its wealth.
    2. In today's terms, the drain amounted to 8 per cent of India's national product.
    3. The drain accelerated capital formation in India while retarding the British economy.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are in the book. The drain checked and retarded capital formation in India while accelerating the growth of the British economy."
  source: "Spectrum (2019-20), pp. 548, 552"
  tags: [bpsc]

- slug: smi-28-h02
  difficulty: hard
  stem: |
    With reference to the first stage of colonialism (1757-1813), consider the following statements:

    1. The drain of wealth from India constituted 2-3 per cent of Britain's national income at the time.
    2. There was large-scale import of British manufactures into India.
    3. Changes were made in military organisation and technology and at the top of the revenue-collection structure.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "In this stage there was no large-scale import of British manufactures; rather, export of Indian textiles increased. Statements 1 and 3 are correct."
  source: "Spectrum (2019-20), p. 553"
  tags: [bpsc]

- slug: smi-28-h03
  difficulty: hard
  stem: |
    **Assertion (A):** The Indian cultivator hardly emerged better from the commercialisation of agriculture.

    **Reason (R):** The cotton boom of the 1860s mostly benefited intermediaries, while the slump of 1866 hit the cultivators the most.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book uses the 1860s cotton boom and 1866 slump, which brought indebtedness, famine and Deccan riots, to show the cultivator hardly gained from commercialisation."
  source: "Spectrum (2019-20), p. 545"
  tags: [bpsc]

- slug: smi-28-h04
  difficulty: hard
  stem: |
    Consider the following statements about the second stage of colonialism ('Colonialism of Free Trade'):

    1. All import duties in India were either totally removed or reduced to nominal rates.
    2. Personal law was thoroughly overhauled to promote capitalist commercial relations.
    3. The Indian army was used for British colonial expansion in Asia and Africa.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Personal law was largely left untouched; it was criminal law, the law of contract and legal procedures that were overhauled. Statements 1 and 3 are correct."
  source: "Spectrum (2019-20), pp. 554-555"
  tags: [bpsc]

- slug: smi-28-h05
  difficulty: hard
  stem: |
    Consider the following statements about the third stage of colonialism:

    1. It began around the 1860s, when Britain's industrial supremacy was challenged by European countries, the United States and Japan.
    2. Most British capital in this stage went into railways, loans to the Government of India and trade.
    3. The notion of training Indians for self-government was strengthened during this stage.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The notion of training Indians for self-government vanished in this stage (revived only after 1918); British capital went mainly to railways, loans and trade, and less to plantations, mines and mills."
  source: "Spectrum (2019-20), pp. 555-556"
  tags: [bpsc]

- slug: smi-28-h06
  difficulty: hard
  stem: |
    **Assertion (A):** The Indian ship-building industry declined in the early nineteenth century.

    **Reason (R):** A law of 1813 barred ships above 350 tonnes from sailing between India and Britain.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "The 1813 law barred ships below (not above) 350 tonnes, putting many Bengal-built ships out of the Indo-British trade."
  source: "Spectrum (2019-20), p. 546"
  tags: [bpsc]

- slug: smi-28-h07
  difficulty: hard
  stem: "According to Shashi Tharoor's 'An Era of Darkness', quoted in the book, India's share of world manufacturing exports under British rule fell from"
  options: { A: "23 per cent to 3 per cent", B: "27 per cent to 2 per cent", C: "25 per cent to 4 per cent", D: "27 per cent to 3 per cent" }
  answer: B
  explanation: "Tharoor says India's share of world manufacturing exports fell from 27 per cent to 2 per cent; the 23-to-3 figures refer to India's share of the world economy."
  source: "Spectrum (2019-20), p. 543"
  tags: [ssc]

- slug: smi-28-h08
  difficulty: hard
  stem: |
    Match List I (statement quoted in the book) with List II (source):

    | List I | List II |
    |---|---|
    | a. Taxation is like moisture sucked up by the sun, but now descends as rain on other lands | 1. The Hindu (September 1889) |
    | b. The Government of India is carried on to the dictates of the Chamber of Commerce — the 'White Man's Burden' | 2. Dadabhai Naoroji |
    | c. Where foreign capital has been sunk, administration becomes the concern of the bondholders | 3. R.C. Dutt |
    | d. Under the British Indian despot the man 'starves in peace ... with law and order' | 4. Sachidanand Sinha |
  options: { A: "a-3, b-1, c-4, d-2", B: "a-2, b-4, c-1, d-3", C: "a-4, b-3, c-1, d-2", D: "a-3, b-4, c-1, d-2", E: "None of the above" }
  answer: D
  explanation: "The moisture analogy is R.C. Dutt's, the Chamber of Commerce remark is Sachidanand Sinha's, the bondholders line is from The Hindu (1889) and 'starves in peace' is Dadabhai Naoroji's."
  source: "Spectrum (2019-20), pp. 550-551"
  tags: [bpsc]

- slug: smi-28-h09
  difficulty: hard
  stem: |
    Consider the following statements about the early nationalist critique of the colonial economy:

    1. Development was equated with industrialisation based on Indian rather than foreign capital.
    2. The intellectuals of the first half of the nineteenth century opposed British rule from the start.
    3. Disillusionment with British rule set in among the politically conscious after the 1860s.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Early 19th-century intellectuals supported British rule hoping it would modernise India; disillusionment came after the 1860s. Statements 1 and 3 are correct."
  source: "Spectrum (2019-20), pp. 548-549"
  tags: [bpsc]

- slug: smi-28-h10
  difficulty: hard
  stem: |
    Consider the following statements:

    1. By 1815, half of the total land in Bengal had passed into the hands of merchants, moneylenders and other moneyed classes.
    2. Transferability of land under the new settlement gave tenants greater security in land.
    3. According to the book, the peasant's hardship under the triple burden was as true for Ryotwari and Mahalwari areas as for zamindari areas.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Transferability of land caused great insecurity to tenants, who lost their traditional rights. Statements 1 and 3 are correct."
  source: "Spectrum (2019-20), pp. 542-543"
  tags: [bpsc]

- slug: smi-28-h11
  difficulty: hard
  stem: "According to the book, modern education in the second stage of colonialism was introduced primarily to"
  options: { A: "provide cheap manpower to the vastly expanded administration", B: "train Indians for self-government", C: "create technical manpower for modern industries", D: "spread scientific knowledge for industrialisation" }
  answer: A
  explanation: "Modern education was introduced to provide cheap manpower to the expanded administration, and also to create an atmosphere of change and a culture of loyalty to the rulers."
  source: "Spectrum (2019-20), p. 555"
  tags: [ssc]

- slug: smi-28-h12
  difficulty: hard
  stem: |
    Which of the following are mentioned in the book as factors that encouraged the commercialisation of Indian agriculture?

    1. Spread of money economy
    2. Replacement of custom and tradition by competition and contract
    3. Emergence of a unified national market
    4. Tariff protection by the Government

    Select the correct answer using the codes given below.
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "The factors include money economy, competition and contract, a unified national market, internal trade, better communications and British finance capital; the book says Indian industry got no tariff protection."
  source: "Spectrum (2019-20), p. 545"
  tags: [bpsc]
