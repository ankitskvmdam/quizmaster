  tags: [bpsc]

- slug: smi-08-h10
  difficulty: hard
  stem: |
    **Assertion (A):** The struggle against caste discrimination could not be successful during British rule.

    **Reason (R):** The foreign government could not afford to invite hostile reaction from the orthodox sections by taking up radical measures.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book gives the foreign government's limitation (fear of orthodox reaction) as a reason why the struggle could not succeed under British rule."
