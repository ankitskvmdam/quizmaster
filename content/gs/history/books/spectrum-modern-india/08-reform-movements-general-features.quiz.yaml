  source: "Spectrum (2019-20), p. 198"
  tags: [bpsc]

- slug: smi-08-h07
  difficulty: hard
  stem: |
    Consider the following statements:

    1. The Native Marriage Act, 1872 is also called the Civil Marriage Act.
    2. The Native Marriage Act, 1872 had a wide impact because it applied to Hindus and Muslims alike.
    3. The Age of Consent Act (1891) was the reward of the efforts of a Parsi reformer, B.M. Malabari.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 and 2 only", C: "2 and 3 only", D: "3 only", E: "None of the above" }
  answer: A
  explanation: "The 1872 Act had limited impact because it was not applicable to Hindus, Muslims and other recognised faiths; statements 1 and 3 are correct."
