  tags: [bpsc]

- slug: smi-08-h11
  difficulty: hard
  stem: |
    Consider the following statements about forces under British rule that undermined caste consciousness:

    1. The creation of private property in land and free sale of land upset caste equations.
    2. The judicial functions of caste panchayats were taken away.
    3. The administrative services remained reserved for the upper castes.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 2 are in the book; it says the administrative services were made open to all castes."
  source: "Spectrum (2019-20), p. 200"
  tags: [bpsc]
