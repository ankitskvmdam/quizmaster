    2. He cited Vedic texts to prove that Hindu religion sanctioned widow remarriage.
    3. He was associated with no less than 35 girls' schools in Bengal.
    4. He founded the Widow Remarriage Association in the 1850s.

    Which of the statements given above are correct?
  options: { A: "1, 2 and 3 only", B: "1 and 2 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
