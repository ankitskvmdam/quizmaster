  difficulty: hard
  stem: |
    Consider the following statements:

    1. Syed Ahmed Khan emphasised that religious tenets were not immutable.
    2. Syed Ahmed Khan said that all prophets had the same 'din' and every country had different prophets.
    3. The book classifies the Aligarh Movement, along with Deoband, as a revivalist movement.

