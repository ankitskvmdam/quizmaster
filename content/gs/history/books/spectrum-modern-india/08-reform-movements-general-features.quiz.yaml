# ---------- HARD ----------
- slug: smi-08-h01
  difficulty: hard
  stem: |
    Consider the following statements about the abolition of sati:

    1. It was done by Regulation XVII of 1829 of the Bengal Code.
    2. The regulation made sati punishable by criminal courts as culpable homicide.
    3. It was extended in slightly modified forms to the Madras and Bombay Presidencies in 1832.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. The regulation was extended to Madras and Bombay in 1830, not 1832."
  source: "Spectrum (2019-20), p. 196"
  tags: [bpsc]

- slug: smi-08-h02
  difficulty: hard
  stem: |
    Consider the following statements about the All India Women's Conference (AIWC):

    1. It was founded in 1927 by Margaret Cousins.
    2. Its first conference was held at Ferguson College, Pune.
    3. It is considered the first major Indian women's organisation set up by a woman.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 2 are correct. The book calls the Bharat Stree Mahamandal (1910) the first major women's organisation set up by a woman; the AIWC is called perhaps the first with an egalitarian approach."
  source: "Spectrum (2019-20), pp. 198-199"
  tags: [bpsc]

- slug: smi-08-h03
  difficulty: hard
  stem: |
    **Assertion (A):** Participation in the swadeshi, anti-partition and Home Rule movements was a major liberating experience for Indian women.

    **Reason (R):** Sarojini Naidu became the president of the Indian National Congress in 1925.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: B
  explanation: "Both are stated in the book, but Sarojini Naidu's presidency (1925) came later and does not explain why the early 20th-century movements were liberating for women."
  source: "Spectrum (2019-20), p. 198"
  tags: [bpsc]

- slug: smi-08-h04
  difficulty: hard
  stem: |
    Consider the following statements about the 19th-century Indian intelligentsia that led the reform movements:

    1. Its roots lay mainly in trade and industry.
    2. Its roots lay in government service or the professions of law, education, journalism or medicine.
    3. It searched for its model in the European 'middle class'.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "1 and 3 only", D: "2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "The intelligentsia did not grow from trade or industry, which were under British control; its roots were in government service and the professions, and it modelled itself on the European middle class."
  source: "Spectrum (2019-20), pp. 191-192"
  tags: [bpsc]

- slug: smi-08-h05
  difficulty: hard
  stem: |
    Consider the following statements about the Mahad Satyagraha:

    1. It was led by Dr B.R. Ambedkar in March 1927.
    2. A procession of some 2,500 'untouchables' went to the Chawdar tank, from which they were not allowed to draw water.
    3. In December 1927, the 'Manusmriti' was burnt at the same place.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1, 2 and 3", D: "1 and 3 only", E: "None of the above" }
  answer: C
  explanation: "All three are stated in the book: the March 1927 satyagraha, the procession of about 2,500 to the Chawdar tank, and the burning of the Manusmriti there in December 1927."
  source: "Spectrum (2019-20), pp. 202-203"
  tags: [bpsc]

