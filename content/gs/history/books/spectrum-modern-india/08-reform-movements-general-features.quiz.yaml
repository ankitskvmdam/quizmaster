- slug: smi-08-m02
  difficulty: medium
  stem: |
    Arrange the following measures concerning women in chronological order:

    1. Native Marriage Act
    2. Hindu Widows' Remarriage Act
    3. Regulation XVII of the Bengal Code banning sati
    4. Age of Consent Act
  options: { A: "3, 1, 2, 4", B: "2, 3, 1, 4", C: "3, 2, 4, 1", D: "3, 2, 1, 4", E: "None of the above" }
  answer: D
  explanation: "Sati regulation (1829), Widows' Remarriage Act (1856), Native Marriage Act (1872), Age of Consent Act (1891)."
  source: "Spectrum (2019-20), pp. 196-197"
  tags: [bpsc]

- slug: smi-08-m03
  difficulty: medium
  stem: |
    Match List I (women's organisation) with List II (founder) as given in the book:

    | List I | List II |
    |---|---|
    | a. Bharat Stree Mahamandal | 1. Margaret Cousins |
    | b. Ladies Social Conference | 2. Pandita Ramabai Saraswati |
    | c. Arya Mahila Samaj | 3. Sarla Devi Chaudhurani |
    | d. All India Women's Conference | 4. Ramabai Ranade |
  options: { A: "a-3, b-4, c-2, d-1", B: "a-3, b-2, c-4, d-1", C: "a-1, b-4, c-2, d-3", D: "a-4, b-3, c-2, d-1", E: "None of the above" }
  answer: A
  explanation: "Sarla Devi Chaudhurani convened the Bharat Stree Mahamandal, Ramabai Ranade founded the Ladies Social Conference, Pandita Ramabai Saraswati the Arya Mahila Samaj and Margaret Cousins the AIWC."
  source: "Spectrum (2019-20), pp. 198-199"
  tags: [bpsc]

