  difficulty: hard
  stem: |
    Consider the following statements about Clive's treaty with Nawab Shuja-ud-Daula at Allahabad (1765):

    1. The Nawab agreed to surrender Allahabad and Kara to Shah Alam II.
    2. The Nawab agreed to give Balwant Singh, Zamindar of Banaras, full possession of his estate.
