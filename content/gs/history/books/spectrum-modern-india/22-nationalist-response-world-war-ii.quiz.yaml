- slug: smi-22-h15
  difficulty: hard
  stem: |
    Consider the following statements about Subhash Bose's political ideas:

    1. He described himself as a communist rather than a socialist.
    2. In a 1944 address at Tokyo University, he argued for a State of an authoritarian character to carry out socialist economic reforms.
    3. On October 21, 1943, he proclaimed the Provisional Government of Azad Hind and named himself head of state and prime minister.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Bose said he was 'a socialist, but that was a very different thing from being a communist'. Statements 2 and 3 are from the book."
