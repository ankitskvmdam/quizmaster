- slug: smi-22-m04
  difficulty: medium
  stem: |
    Match the following statements with the persons who made them:

    | List I (Statement) | List II (Person) |
    |---|---|
    | P. 'Dominion status concept is dead as a doornail' | 1. Winston Churchill |
    | Q. 'A post-dated cheque' | 2. Maulana Abul Kalam Azad |
    | R. 'I have not become His Majesty's first Minister to preside over the liquidation of the British Empire' | 3. Jawaharlal Nehru |
    | S. 'The offer of Cripps really gave us nothing' | 4. Mahatma Gandhi |
