# ---------- HARD ----------
- slug: smi-22-h01
  difficulty: hard
  stem: |
    Consider the following statements about Subhash Chandra Bose before 1938:

    1. Along with Jawaharlal Nehru, he opposed the Motilal Nehru Report, which spoke for dominion status.
    2. He was president of the Bengal Provincial Congress Committee.
    3. He welcomed the Gandhi-Irwin Pact of 1931 as a step towards Poorna Swaraj.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1 and 2 only", E: "None of the above" }
  answer: D
  explanation: "Bose opposed the Nehru Report and headed the Bengal PCC, but he was vehemently against the Gandhi-Irwin Pact, especially over the death sentence on Bhagat Singh."
  source: "Spectrum (2019-20), p. 417"
  tags: [bpsc]

- slug: smi-22-h02
  difficulty: hard
  stem: |
    **Assertion (A):** Sardar Patel, Rajendra Prasad and other leaders resigned from the Congress Working Committee in 1939.

    **Reason (R):** Subhash Bose had publicly accused the working committee leaders of being ready to compromise with the government on the matter of federation.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The leaders felt they could not work with a president who had publicly cast doubts on their nationalism over federation, so they resigned; R explains A."
  source: "Spectrum (2019-20), p. 418"
  tags: [bpsc]

- slug: smi-22-h03
  difficulty: hard
  stem: |
    Consider the following statements about Viceroy Linlithgow's statement of October 17, 1939:

    1. It refused to define British war aims beyond stating that Britain was resisting aggression.
    2. It said representatives of communities, parties, interests and the princes would be consulted on modifying the Act of 1935.
    3. It declared that dominion status of the Westminster variety after the war was the goal of British policy.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 describe the October 1939 statement, which also promised a 'consultative committee'. The 'Westminster variety' dominion status remark was made in January 1940."
  source: "Spectrum (2019-20), pp. 436-437"
  tags: [bpsc]

- slug: smi-22-h04
  difficulty: hard
  stem: |
    Consider the following statements about the August Offer (1940):

    1. It proposed expanding the viceroy's executive council with a majority of Indians drawn from major political parties.
    2. It proposed that after the war a constituent assembly would be set up in which Indians alone would decide the constitution, without any conditions.
    3. It said no future constitution would be adopted without the consent of minorities.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 and 2 only", C: "3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The August Offer's assembly was to be 'mainly' Indian and subject to obligations on defence, minorities, treaties with States and the all-India services; only the Cripps proposals left constitution-making 'solely' to Indians."
  source: "Spectrum (2019-20), pp. 439, 443"
  tags: [bpsc]

- slug: smi-22-h05
  difficulty: hard
  stem: "Which one of the following was NOT a proposal of the Cripps Mission (1942)?"
  options: { A: "An Indian Union with dominion status, free to decide its relations with the Commonwealth", B: "A post-war constituent assembly partly elected by provincial assemblies through proportional representation and partly nominated by the princes", C: "The right of any province unwilling to join the Union to have a separate constitution", D: "Immediate transfer of the defence portfolio to an Indian member of the executive council" }
  answer: D
  explanation: "Under the Cripps proposals, the defence of India was to remain in British hands and the governor-general's powers were to remain intact."
  source: "Spectrum (2019-20), pp. 442-443"
  tags: [ssc]

- slug: smi-22-h06
  difficulty: hard
  stem: |
    Consider the following statements about the aims of the individual satyagraha launched by the Congress in 1940:

    1. To show that nationalist patience was not due to weakness.
    2. To express that the people made no distinction between Nazism and the double autocracy that ruled India.
    3. To give the government another opportunity to accept the Congress demands peacefully.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "The book lists all three as the aims of individual satyagraha; the satyagrahi's demand was freedom of speech against the war."
  source: "Spectrum (2019-20), p. 440"
  tags: [bpsc]

- slug: smi-22-h07
  difficulty: hard
  stem: |
    **Assertion (A):** The Congress accepted the August Offer because it conceded the demand for a constituent assembly.

    **Reason (R):** The August Offer recognised, for the first time, the inherent right of Indians to frame their own constitution.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: D
  explanation: "The Congress rejected the August Offer, so A is false. R is true: the book says it recognised for the first time Indians' inherent right to frame their constitution."
  source: "Spectrum (2019-20), pp. 439-440"
  tags: [bpsc]

- slug: smi-22-h08
  difficulty: hard
  stem: |
    Consider the following statements about Gandhi's ideas on the State as given in the book:

    1. Hind Swaraj (1909) was 'the nearest he came to producing a sustained work of political theory'.
    2. Gandhi laid more emphasis on rights than on duties.
    3. In his village republic, the panchayat of five persons was to be the custodian of all authority.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 3 are from the book. Gandhi laid more emphasis on duties than on rights."
  source: "Spectrum (2019-20), pp. 424-425"
  tags: [bpsc]

- slug: smi-22-h09
  difficulty: hard
  stem: "Which one of the following ideas is attributed by the book to Gandhi and NOT to Subhash Bose?"
  options: { A: "Classifying industry into heavy, medium and cottage", B: "Capitalists acting as trustees of their wealth for the welfare of all", C: "Abolition of landlordism and liquidation of agricultural indebtedness", D: "A comprehensive scheme of industrial development under state ownership and control" }
  answer: B
  explanation: "Trusteeship was Gandhi's theory. Bose classified industry into three categories and, at Haripura, spoke of state-owned industrial development and abolition of landlordism."
  source: "Spectrum (2019-20), pp. 427-428"
  tags: [ssc]

- slug: smi-22-h10
  difficulty: hard
  stem: |
    Consider the following statements about the British government's measures around the outbreak of the Second World War:

    1. Even before war was declared, emergency powers for the Centre over provincial subjects had been acquired by amending the 1935 Act.
    2. The Defence of India ordinance was enforced on the day the war was declared.
    3. A top secret Draft Revolutionary Movement Ordinance was prepared in May 1940 to strike pre-emptively at the Congress.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1, 2 and 3", D: "1 and 2 only", E: "None of the above" }
  answer: C
  explanation: "All three are listed in the book as part of the British 'hidden agenda' to regain lost ground from the Congress."
  source: "Spectrum (2019-20), p. 436"
  tags: [bpsc]

- slug: smi-22-h11
  difficulty: hard
  stem: |
    Consider the following statements about Jawaharlal Nehru's stand at the Wardha CWC meeting (1939):

    1. He believed justice was on the side of Britain, France and Poland.
    2. He advocated no Indian participation in the war till India itself was free.
    3. He wanted to take advantage of Britain's difficulty by starting an immediate civil disobedience movement.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Nehru saw the war as imperialist yet just on the Allied side, opposed Indian participation till India was free, but did not want to exploit Britain's difficulty through immediate civil disobedience."
  source: "Spectrum (2019-20), p. 435"
  tags: [bpsc]

- slug: smi-22-h12
  difficulty: hard
  stem: |
    Match the groups with their objections to the Cripps proposals:

    | List I (Group) | List II (Objection) |
    |---|---|
    | P. Sikhs | 1. Partition would leave them at the mercy of the caste Hindus |
    | Q. Depressed classes | 2. Partition would take away Punjab from them |
    | R. Liberals | 3. Criticised the idea of a single Indian Union |
    | S. Muslim League | 4. Secession was against the unity and security of India |
  options: { A: "P-1, Q-2, R-4, S-3", B: "P-2, Q-1, R-3, S-4", C: "P-4, Q-1, R-2, S-3", D: "P-2, Q-1, R-4, S-3", E: "None of the above" }
  answer: D
  explanation: "Sikhs feared losing Punjab, depressed classes feared caste-Hindu domination, Liberals saw secession as a threat to unity and security, and the League criticised a single Indian Union."
  source: "Spectrum (2019-20), p. 444"
  tags: [bpsc]

- slug: smi-22-h13
  difficulty: hard
  stem: |
    Consider the following statements about the Ramgarh session of the Congress (March 1940):

    1. It declared that the people of India would accept nothing short of complete independence.
    2. It said sovereignty must rest with the people, whether in the princely states or the provinces.
    3. At this session Gandhi opposed any continued cooperation with the British at the provincial level.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The session demanded complete independence and placed sovereignty with the people. Gandhi, however, was still in favour of continued cooperation at the provincial level."
  source: "Spectrum (2019-20), p. 438"
  tags: [bpsc]

