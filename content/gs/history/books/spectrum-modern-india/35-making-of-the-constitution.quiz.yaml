# Chapter 35 — Making of the Constitution for India (book pp. 610-618)
# ---------- EASY ----------
- slug: smi-35-e01
  difficulty: easy
  stem: "On which date did the Constitution of India come into effect?"
  options: { A: "November 26, 1949", B: "January 26, 1950", C: "August 15, 1947", D: "January 24, 1950" }
  answer: B
  explanation: "The book opens by noting that the Indian Constitution came into effect on January 26, 1950."
  source: "Spectrum (2019-20), p. 610"
  tags: [ssc]

- slug: smi-35-e02
  difficulty: easy
  stem: "The Constitution Hall, where the Constituent Assembly opened in December 1946, is described in the book as now being the"
  options: { A: "Rashtrapati Bhavan", B: "Vigyan Bhavan", C: "Central Hall of Parliament House", D: "Supreme Court building" }
  answer: C
  explanation: "The Assembly opened on December 9, 1946 in the Constitution Hall — now the Central Hall of Parliament House, New Delhi."
  source: "Spectrum (2019-20), p. 614"
  tags: [ssc]

- slug: smi-35-e03
  difficulty: easy
  stem: "Who was the provisional president of the Constituent Assembly when it first met on December 9, 1946?"
  options: { A: "Dr Rajendra Prasad", B: "J.B. Kripalani", C: "Dr B.R. Ambedkar", D: "Dr Sachchidananda Sinha", E: "More than one of the above" }
  answer: D
  explanation: "J.B. Kripalani proposed Dr Sachchidananda Sinha, the oldest member, as provisional president."
  source: "Spectrum (2019-20), pp. 616-617"
  tags: [bpsc]

- slug: smi-35-e04
  difficulty: easy
  stem: "The Constituent Assembly adopted the National Anthem and the National Song on"
  options: { A: "July 22, 1947", B: "November 26, 1949", C: "January 24, 1950", D: "January 26, 1950" }
  answer: C
  explanation: "The National Anthem and National Song were adopted on January 24, 1950, the last day of the Assembly's session."
  source: "Spectrum (2019-20), p. 618"
  tags: [ssc]

- slug: smi-35-e05
  difficulty: easy
  stem: "Who was the chairman of the Drafting Committee of the Constituent Assembly?"
  options: { A: "K.M. Munshi", B: "Dr B.R. Ambedkar", C: "B.N. Rau", D: "Alladi Krishnaswami Iyer" }
  answer: B
  explanation: "The Drafting Committee was set up under the chairmanship of Dr B.R. Ambedkar, then the law minister."
  source: "Spectrum (2019-20), p. 617"
  tags: [ssc]

- slug: smi-35-e06
  difficulty: easy
  stem: "Who was the Constitutional Adviser of the Constituent Assembly?"
  options: { A: "B.N. Rau", B: "K.M. Munshi", C: "Alladi Krishnaswami Iyer", D: "N. Gopalaswami Ayyangar" }
  answer: A
  explanation: "Benegal Narsing Rau, a judge of the Calcutta High Court, was the constitutional adviser and prepared the initial draft."
  source: "Spectrum (2019-20), p. 616"
  tags: [ssc]

- slug: smi-35-e07
  difficulty: easy
  stem: "The Constituent Assembly adopted the National Flag on"
  options: { A: "January 24, 1950", B: "August 15, 1947", C: "December 9, 1946", D: "July 22, 1947" }
  answer: D
  explanation: "The book states the Constituent Assembly adopted the National Flag on July 22, 1947."
  source: "Spectrum (2019-20), p. 618"
  tags: [ssc]

- slug: smi-35-e08
  difficulty: easy
  stem: "Who was elected President of the Constituent Assembly on December 11, 1946?"
  options: { A: "Dr Sachchidananda Sinha", B: "Dr Rajendra Prasad", C: "Jawaharlal Nehru", D: "J.B. Kripalani", E: "More than one of the above" }
  answer: B
  explanation: "On December 11, 1946, Dr Rajendra Prasad was elected President of the Constituent Assembly."
  source: "Spectrum (2019-20), p. 617"
  tags: [bpsc]

- slug: smi-35-e09
  difficulty: easy
  stem: "Under the Cabinet Mission plan, the total strength of the Constituent Assembly was to be"
  options: { A: "292", B: "296", C: "93", D: "389" }
  answer: D
  explanation: "The constitution-making body was to have 389 members: 296 from British India and 93 from the Indian states."
  source: "Spectrum (2019-20), p. 613"
  tags: [ssc]

- slug: smi-35-e10
  difficulty: easy
  stem: "How many members actually signed the Constitution of India?"
  options: { A: "284", B: "296", C: "389", D: "208" }
  answer: A
  explanation: "Members signed on January 24, 1950, the last day of the Assembly; in all 284 members signed."
  source: "Spectrum (2019-20), p. 618"
  tags: [ssc]

# ---------- MEDIUM ----------
- slug: smi-35-m01
  difficulty: medium
  stem: "Annie Besant believed that the Constitution of India Bill of 1895, also called the Home Rule Bill, was inspired by"
  options: { A: "Dadabhai Naoroji", B: "Gopal Krishna Gokhale", C: "Bal Gangadhar Tilak", D: "Motilal Nehru" }
  answer: C
  explanation: "There is no conclusive proof of its authorship, but Annie Besant believed the 1895 Bill was inspired by Tilak."
  source: "Spectrum (2019-20), p. 611"
  tags: [ssc]

- slug: smi-35-m02
  difficulty: medium
  stem: "Jawaharlal Nehru was the first national leader to enunciate the idea of a Constituent Assembly, in 1933. Who had made such a suggestion earlier?"
  options: { A: "Motilal Nehru", B: "S. Satyamurti", C: "Annie Besant", D: "M.N. Roy" }
  answer: D
  explanation: "The book says M.N. Roy had suggested a constituent assembly earlier, though Nehru first enunciated it as a national leader in 1933."
  source: "Spectrum (2019-20), p. 612"
  tags: [ssc]

- slug: smi-35-m03
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. Appointment of the Simon Commission
    2. Motilal Nehru's 'National Demand' resolution in the Central Legislative Assembly
    3. Submission of the Nehru Report
    4. First reading of the Commonwealth of India Bill in the House of Commons

    Select the correct answer using the codes given below:
  options: { A: "4-2-1-3", B: "2-4-1-3", C: "2-1-4-3", D: "4-2-3-1", E: "None of the above" }
  answer: B
  explanation: "National Demand (February 1924), Commonwealth of India Bill first reading (December 1925), Simon Commission (November 1927), Nehru Report (August 1928)."
  source: "Spectrum (2019-20), p. 611"
  tags: [bpsc]

- slug: smi-35-m04
  difficulty: medium
  stem: |
    Match List I (event) with List II (date):

    | List I | List II |
    |---|---|
    | a. First meeting of the Constituent Assembly | 1. February 21, 1948 |
    | b. Objectives Resolution moved | 2. November 26, 1949 |
    | c. Second draft placed before the Assembly | 3. December 13, 1946 |
    | d. Constitution adopted by the Assembly | 4. December 9, 1946 |
  options: { A: "a-3, b-4, c-1, d-2", B: "a-4, b-3, c-2, d-1", C: "a-4, b-3, c-1, d-2", D: "a-3, b-4, c-2, d-1", E: "None of the above" }
  answer: C
  explanation: "The Assembly first met on December 9, 1946; Nehru moved the Objectives Resolution on December 13, 1946; the second draft was placed on February 21, 1948; the Constitution was adopted on November 26, 1949."
  source: "Spectrum (2019-20), pp. 614, 617"
  tags: [bpsc]

- slug: smi-35-m05
  difficulty: medium
  stem: "In the 1946 elections to the Constituent Assembly, how many seats did the Muslim League win?"
  options: { A: "73", B: "93", C: "208", D: "296" }
  answer: A
  explanation: "The Congress won 208 seats and the Muslim League 73 — all but five of the seats allotted to Muslims."
  source: "Spectrum (2019-20), p. 614"
  tags: [ssc]

- slug: smi-35-m06
  difficulty: medium
  stem: "Which of the following was NOT one of the four Chief Commissioners' Provinces that sent one representative each to the Constituent Assembly?"
  options: { A: "Delhi", B: "Coorg", C: "British Baluchistan", D: "Sind" }
  answer: D
  explanation: "The four Chief Commissioners' Provinces were Delhi, Ajmer-Merwara, Coorg and British Baluchistan; Sind is mentioned separately among the provinces that passed the 1937 resolution."
  source: "Spectrum (2019-20), p. 613"
  tags: [ssc]

- slug: smi-35-m07
  difficulty: medium
  stem: "How were the members from the British Indian provinces to be elected to the Constituent Assembly?"
  options: { A: "Directly, on the basis of universal adult franchise", B: "By each community's representatives in the provincial assemblies, through proportional representation with single transferable vote", C: "By nomination of the provincial governors", D: "Directly, through separate electorates for each community" }
  answer: B
  explanation: "The Assembly was elected indirectly; each community's representatives in the provincial assemblies elected members by proportional representation with single transferable vote."
  source: "Spectrum (2019-20), p. 613"
  tags: [ssc]

- slug: smi-35-m08
  difficulty: medium
  stem: "The draft of the Constitution submitted by B.N. Rau by the end of October 1947 contained"
  options: { A: "315 Articles and 9 Schedules", B: "240 Clauses and 9 Schedules", C: "315 Articles and 13 Schedules", D: "240 Clauses and 13 Schedules", E: "More than one of the above" }
  answer: D
  explanation: "B.N. Rau's draft had 240 Clauses and 13 Schedules; the Drafting Committee's second draft had 315 Articles and 9 Schedules."
  source: "Spectrum (2019-20), p. 617"
  tags: [bpsc]

- slug: smi-35-m09
  difficulty: medium
  stem: "The Indian Independence Act, 1947 came into force on"
  options: { A: "June 26, 1947", B: "July 18, 1947", C: "July 22, 1947", D: "August 15, 1947" }
  answer: B
  explanation: "Passed with surprising speed, the Act came into force on July 18, 1947; Mountbatten had announced a separate Pakistan assembly on June 26."
  source: "Spectrum (2019-20), pp. 614-615"
  tags: [ssc]

- slug: smi-35-m10
  difficulty: medium
  stem: "Granville Austin described four men as a 'virtual oligarchy' in the Constituent Assembly. Who among the following was NOT one of them?"
  options: { A: "Sardar Patel", B: "Abul Kalam Azad", C: "Dr B.R. Ambedkar", D: "Rajendra Prasad" }
  answer: C
  explanation: "Austin's four were Jawaharlal Nehru, Sardar Patel, Rajendra Prasad and Abul Kalam Azad."
  source: "Spectrum (2019-20), p. 618"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-35-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Nehru Report (1928):

    1. It was based on the principle of dominion status with full responsible government on the parliamentary pattern.
    2. It vested residuary powers in the central government.
    3. It provided for separate electorates for minorities in elections to the federal lower house.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The Report proposed dominion status and residuary powers with the centre, but joint electorates (with reserved seats for minorities in some cases for a limited period)."
  source: "Spectrum (2019-20), p. 612"
  tags: [bpsc]

- slug: smi-35-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Constituent Assembly:

    1. It was elected on the basis of universal adult franchise, as the Congress had demanded.
    2. The franchise of the 1935 Act, under which the provincial assemblies were elected, kept out more than 70 per cent of the adult population.
    3. The Congress majority in the Assembly rose to more than 80 per cent after partition.

    Which of the statements given above is/are correct?
  options: { A: "2 and 3 only", B: "1 and 2 only", C: "3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The Assembly was indirectly elected by provincial assemblies chosen on the limited 1935 franchise (excluding over 70 per cent of adults); the Congress majority rose above 80 per cent after partition."
  source: "Spectrum (2019-20), p. 615"
  tags: [bpsc]

- slug: smi-35-h03
  difficulty: hard
  stem: |
    Consider the following statements about the Objectives Resolution, as described in the book:

    1. It gave the Constituent Assembly its guiding principles and philosophy of constitution-making.
    2. It envisaged a federal polity with residuary powers vesting in the central government.
    3. It envisaged sovereignty belonging to the people.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The book says the Resolution envisaged residuary powers vesting in the autonomous units (not the centre) and sovereignty belonging to the people."
  source: "Spectrum (2019-20), p. 614"
  tags: [bpsc]

- slug: smi-35-h04
  difficulty: hard
  stem: |
    **Assertion (A):** The Constituent Assembly set up under the Cabinet Mission Plan was not fully sovereign, despite the efforts of the Congress.

    **Reason (R):** The Indian Independence Act, 1947 declared the Constituent Assembly of India to be a fully sovereign body.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: B
  explanation: "Both are stated in the book, but R describes a later change (1947) and does not explain why the Cabinet Mission assembly lacked full sovereignty."
  source: "Spectrum (2019-20), p. 615"
  tags: [bpsc]

- slug: smi-35-h05
  difficulty: hard
  stem: |
    Consider the following statements about the Drafting Committee:

    1. After its first meeting, B.L. Mitter resigned and N. Madhava Rao was nominated in his place.
    2. T.T. Krishnamachari took the place of D.P. Khaitan after the latter's death in 1948.
    3. Its chairman, Dr B.R. Ambedkar, was the law minister at the time.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated on p. 617: Madhava Rao replaced Mitter, T.T. Krishnamachari replaced Khaitan (d. 1948), and Ambedkar was then law minister."
  source: "Spectrum (2019-20), p. 617"
  tags: [bpsc]

- slug: smi-35-h06
  difficulty: hard
  stem: "Who introduced a resolution in the Central Legislative Assembly in September 1937 recommending that the 1935 Act be replaced by a constitution framed by a constituent assembly?"
  options: { A: "S. Satyamurti", B: "Motilal Nehru", C: "Acharya Kripalani", D: "Tej Bahadur Sapru" }
  answer: A
  explanation: "In September 1937 S. Satyamurti introduced this resolution in the Central Legislative Assembly."
  source: "Spectrum (2019-20), pp. 612-613"
  tags: [ssc]

- slug: smi-35-h07
  difficulty: hard
  stem: |
    Consider the following statements:

    1. In August 1937, the Congress Working Committee accepted a draft resolution prepared under Acharya Kripalani demanding a Constituent Assembly.
    2. Between August and October 1937, all the Congress-ruled provinces and Sind passed this resolution.
    3. The Haripura session of 1936 declared that no constitution imposed by an outside authority would be acceptable to the Congress.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. The 1936 declaration was made at the Lucknow session; the Haripura session (1938) only reiterated the demand."
  source: "Spectrum (2019-20), pp. 612-613"
  tags: [bpsc]

- slug: smi-35-h08
  difficulty: hard
  stem: |
    Consider the following statements about the Commonwealth of India Bill:

    1. It was drafted in England by the Parliamentary Labour Party.
    2. It was accepted unanimously by the executive committee of the Parliamentary Labour Party.
    3. It specified that India shall be placed on an equal footing with the self-governing dominions.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The Bill was drafted in India (with contributions from Besant, Sapru and Srinivasa Shastri), then accepted unanimously by the Labour Party's executive committee; it sought equal footing with the dominions."
  source: "Spectrum (2019-20), p. 611"
  tags: [bpsc]

- slug: smi-35-h09
  difficulty: hard
  stem: |
    Consider the following statements about the framing of the Constitution:

    1. The Preamble was the first part of the draft to be adopted.
    2. About 7000 amendments were proposed, of which nearly 2500 were actually discussed.
    3. The task took 2 years, 11 months and 18 days.

    Which of the statements given above is/are correct?
  options: { A: "2 and 3 only", B: "1 and 2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The Preamble was adopted last; the other two statements are stated in the book."
  source: "Spectrum (2019-20), p. 617"
  tags: [bpsc]

- slug: smi-35-h10
  difficulty: hard
  stem: "According to the book, among the various ideological groups in the Constituent Assembly, whose influence on the Constitution was dominant?"
  options: { A: "The Gandhians", B: "The Marxian socialists", C: "The rightists, such as Purushottam Das Tandon and S.P. Mukherjee", D: "The liberals and the democratic socialists", E: "More than one of the above" }
  answer: D
  explanation: "All viewpoints influenced the Constitution to an extent, but the dominant influence was that of the liberals and the democratic socialists."
  source: "Spectrum (2019-20), p. 616"
  tags: [bpsc]
