# Chapter 26 — Constitutional, Administrative and Judicial Developments (book pp. 501-531)
# ---------- EASY ----------
- slug: smi-26-e01
  difficulty: easy
  stem: "After the Battle of Buxar, who was appointed deputy diwan for Bihar by the East India Company?"
  options: { A: "Mohammad Reza Khan", B: "Raja Shitab Rai", C: "Shuja-ud-Daula", D: "Shah Alam II", E: "More than one of the above" }
  answer: B
  explanation: "The Company appointed two Indian deputy diwans: Mohammad Reza Khan for Bengal and Raja Shitab Rai for Bihar."
  source: "Spectrum (2019-20), p. 502"
  tags: [bpsc]

- slug: smi-26-e02
  difficulty: easy
  stem: "Under the Regulating Act of 1773, the governor-general in Bengal was to be assisted by a council of how many members?"
  options: { A: "Three", B: "Six", C: "Four", D: "Fifteen" }
  answer: C
  explanation: "The Act provided for a governor-general and a council of 4 members who were to function by majority rule."
  source: "Spectrum (2019-20), p. 503"
  tags: [ssc]

- slug: smi-26-e03
  difficulty: easy
  stem: "The Board of Control, which set up a dual system of control over the Company, was created by"
  options: { A: "Pitt's India Act, 1784", B: "Regulating Act, 1773", C: "Charter Act, 1793", D: "Act of 1786" }
  answer: A
  explanation: "Pitt's India Act of 1784 created a Board of Control to supervise the Company's civil, military and revenue affairs, establishing a dual system of control."
  source: "Spectrum (2019-20), pp. 503-504"
  tags: [ssc]

- slug: smi-26-e04
  difficulty: easy
  stem: "Which Charter Act ended the East India Company's monopoly over trade in India, while letting it keep the China trade and the trade in tea?"
  options: { A: "Charter Act of 1793", B: "Charter Act of 1833", C: "Charter Act of 1853", D: "Charter Act of 1813" }
  answer: D
  explanation: "The Charter Act of 1813 ended the Company's trade monopoly in India; the China and tea monopoly ended only in 1833."
  source: "Spectrum (2019-20), p. 505"
  tags: [ssc]

- slug: smi-26-e05
  difficulty: easy
  stem: "The Charter Act of 1813 set aside how much money every year for the promotion of literature, learning and science among Indians?"
  options: { A: "One lakh rupees", B: "Five lakh rupees", C: "Ten lakh rupees", D: "Fifty thousand rupees" }
  answer: A
  explanation: "A sum of one lakh rupees a year was set aside for education — an important statement of the State's responsibility for education."
  source: "Spectrum (2019-20), p. 505"
  tags: [ssc]

- slug: smi-26-e06
  difficulty: easy
  stem: "Which Act threw open the Company's services to a competitive examination, ending the Company's patronage?"
  options: { A: "Charter Act of 1833", B: "Charter Act of 1853", C: "Indian Councils Act, 1861", D: "Charter Act of 1813" }
  answer: B
  explanation: "The Charter Act of 1853 dissolved the Company's patronage over services and threw them open to competitive examination."
  source: "Spectrum (2019-20), p. 506"
  tags: [ssc]

- slug: smi-26-e07
  difficulty: easy
  stem: "The governor-general came to be called the viceroy under the"
  options: { A: "Charter Act of 1853", B: "Indian Councils Act, 1861", C: "Act for Better Government of India, 1858", D: "Pitt's India Act, 1784" }
  answer: C
  explanation: "Under the 1858 Act the governor-general became the viceroy; his prestige, if not authority, increased."
  source: "Spectrum (2019-20), p. 507"
  tags: [ssc]

- slug: smi-26-e08
  difficulty: easy
  stem: "The Morley-Minto Reforms is the popular name of the"
  options: { A: "Indian Councils Act, 1892", B: "Government of India Act, 1919", C: "Indian Councils Act, 1861", D: "Indian Councils Act, 1909" }
  answer: D
  explanation: "The Indian Councils Act, 1909 is popularly known as the Morley-Minto Reforms."
  source: "Spectrum (2019-20), p. 508"
  tags: [ssc]

- slug: smi-26-e09
  difficulty: easy
  stem: "Who was the first Indian to join the Viceroy's Executive Council?"
  options: { A: "Satyendra Prasad Sinha", B: "Satyendra Nath Tagore", C: "Dadabhai Naoroji", D: "Surendranath Banerjea" }
  answer: A
  explanation: "Under the 1909 Act, Satyendra Prasad Sinha became the first Indian member of the Viceroy's Executive Council, as law member."
  source: "Spectrum (2019-20), p. 509"
  tags: [ssc]

- slug: smi-26-e10
  difficulty: easy
  stem: "In 1863, who became the first Indian to qualify for the Indian Civil Service?"
  options: { A: "Satyendra Prasad Sinha", B: "Romesh Chandra Dutt", C: "Satyendra Nath Tagore", D: "Surendranath Banerjea" }
  answer: C
  explanation: "The book states that in 1863 Satyendra Nath Tagore became the first Indian to qualify for the ICS."
  source: "Spectrum (2019-20), p. 515"
  tags: [ssc]

- slug: smi-26-e11
  difficulty: easy
  stem: "Which governor-general set up the Fort William College in 1800 to train new civil service recruits?"
  options: { A: "Cornwallis", B: "Warren Hastings", C: "William Bentinck", D: "Wellesley" }
  answer: D
  explanation: "Wellesley set up the Fort William College in 1800; it was replaced in 1806 by the East India College at Haileybury."
  source: "Spectrum (2019-20), p. 514"
  tags: [ssc]

- slug: smi-26-e12
  difficulty: easy
  stem: "Who is called the father of local self-government in India?"
  options: { A: "Lord Mayo", B: "Lord Ripon", C: "Lord Curzon", D: "Lord Lytton" }
  answer: B
  explanation: "For his Resolution of 1882 and related contributions, Lord Ripon is called the father of local self-government in India."
  source: "Spectrum (2019-20), p. 528"
  tags: [ssc]

- slug: smi-26-e13
  difficulty: easy
  stem: "The Federal Court provided for by the Government of India Act, 1935 was established in"
  options: { A: "1935", B: "1937", C: "1939", D: "1947" }
  answer: B
  explanation: "The 1935 Act provided for a Federal Court, which was established in 1937."
  source: "Spectrum (2019-20), p. 512"
  tags: [ssc]

- slug: smi-26-e14
  difficulty: easy
  stem: "The Statutory Civil Service of 1878-79 was introduced by"
  options: { A: "Lytton", B: "Ripon", C: "Dufferin", D: "Lansdowne" }
  answer: A
  explanation: "Lytton introduced the Statutory Civil Service, in which one-sixth of covenanted posts were to be filled by nominated Indians of high families."
  source: "Spectrum (2019-20), p. 515"
  tags: [ssc]

- slug: smi-26-e15
  difficulty: easy
  stem: "The Law Commission set up in 1833 for the codification of Indian laws was headed by"
  options: { A: "Charles Wood", B: "William Bentinck", C: "Macaulay", D: "Cornwallis" }
  answer: C
  explanation: "A Law Commission was set up under Macaulay in 1833; it led to the Civil Procedure Code, the IPC and the CrPC."
  source: "Spectrum (2019-20), p. 523"
  tags: [ssc]

# ---------- MEDIUM ----------
- slug: smi-26-m01
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. Aitchison Committee on Public Services
    2. Lee Commission
    3. Statutory Civil Service introduced by Lytton
    4. House of Commons resolution supporting simultaneous examination in India and England
  options: { A: "1, 3, 4, 2", B: "3, 1, 2, 4", C: "3, 4, 1, 2", D: "3, 1, 4, 2", E: "None of the above" }
  answer: D
  explanation: "Statutory Civil Service 1878-79, Aitchison Committee 1886, House of Commons resolution 1893, Lee Commission 1924."
  source: "Spectrum (2019-20), pp. 515-516"
  tags: [bpsc]

- slug: smi-26-m02
  difficulty: medium
  stem: |
    Match List I (Act) with List II (provision):

    | List I | List II |
    |---|---|
    | a. Act of 1786 | 1. Six additional members added for legislative purposes |
    | b. Charter Act of 1793 | 2. Governor-general allowed to override his council |
    | c. Charter Act of 1833 | 3. Licences for 'privilege' or 'country trade' |
    | d. Charter Act of 1853 | 4. A law member added to the governor-general's council |
  options: { A: "a-2, b-3, c-4, d-1", B: "a-3, b-2, c-4, d-1", C: "a-2, b-3, c-1, d-4", D: "a-2, b-4, c-3, d-1", E: "None of the above" }
  answer: A
  explanation: "1786: Cornwallis could override the council; 1793: licences for country trade; 1833: law member added; 1853: six additional members for legislation."
  source: "Spectrum (2019-20), pp. 504-506"
  tags: [bpsc]

- slug: smi-26-m03
  difficulty: medium
  stem: "Separate electorates were extended to Sikhs, Christians and Anglo-Indians, besides Muslims, by the"
  options: { A: "Indian Councils Act, 1909", B: "Government of India Act, 1935", C: "Government of India Act, 1919", D: "Indian Councils Act, 1892" }
  answer: C
  explanation: "The 1909 Act gave separate electorates to Muslims; the 1919 Act extended communal representation to Sikhs, Christians and Anglo-Indians."
  source: "Spectrum (2019-20), p. 510"
  tags: [ssc]

- slug: smi-26-m04
  difficulty: medium
  stem: "Under the Government of India Act, 1935, dyarchy was provided for in the"
  options: { A: "Federal Executive", B: "Provinces", C: "Chief Commissioners' Provinces", D: "Princely States acceding to the Federation" }
  answer: A
  explanation: "Dyarchy, rejected by the Simon Commission, was provided for in the Federal Executive, while dyarchy in the provinces was abolished."
  source: "Spectrum (2019-20), pp. 511-512"
  tags: [ssc]

- slug: smi-26-m05
  difficulty: medium
  stem: "Under the Government of India Act, 1935, bicameral legislatures were provided in six provinces. Which of the following was NOT one of them?"
  options: { A: "Bihar", B: "Assam", C: "Punjab", D: "United Provinces", E: "More than one of the above" }
  answer: C
  explanation: "The six bicameral provinces were Madras, Bombay, Bengal, United Provinces, Bihar and Assam; the other five, including Punjab, stayed unicameral."
  source: "Spectrum (2019-20), p. 512"
  tags: [bpsc]

- slug: smi-26-m06
  difficulty: medium
  stem: "Cornwallis established circuit courts with European judges at four places. Which of the following was NOT one of them?"
  options: { A: "Patna", B: "Allahabad", C: "Dacca", D: "Murshidabad", E: "More than one of the above" }
  answer: B
  explanation: "Circuit courts were set up at Calcutta, Dacca, Murshidabad and Patna. Allahabad got a Sadar Diwani and Sadar Nizamat Adalat later under Bentinck."
  source: "Spectrum (2019-20), p. 522"
  tags: [bpsc]

- slug: smi-26-m07
  difficulty: medium
  stem: "The heads of land revenue, excise, general administration and law and justice were transferred to the provinces in 1877 by"
  options: { A: "Lord Mayo", B: "Lord Ripon", C: "Lord Dufferin", D: "Lord Lytton" }
  answer: D
  explanation: "Mayo began fixed grants to provinces in 1870; in 1877 Lytton transferred land revenue, excise, general administration and law and justice."
  source: "Spectrum (2019-20), p. 527"
  tags: [ssc]

- slug: smi-26-m08
  difficulty: medium
  stem: "The Lee Commission (1924) recommended that 50:50 parity between Europeans and Indians in direct recruitment to the ICS be reached within"
  options: { A: "10 years", B: "15 years", C: "20 years", D: "25 years" }
  answer: B
  explanation: "The Lee Commission recommended reaching 50:50 parity in 15 years and the immediate establishment of a Public Service Commission."
  source: "Spectrum (2019-20), p. 516"
  tags: [ssc]

- slug: smi-26-m09
  difficulty: medium
  stem: "The establishment of a CID in the provinces and a Central Intelligence Bureau at the Centre was recommended by the Police Commission of"
  options: { A: "1860", B: "1882", C: "1902", D: "1908" }
  answer: C
  explanation: "The Police Commission of 1860 led to the Police Act of 1861; it was the 1902 Police Commission that recommended the CID and Central Intelligence Bureau."
  source: "Spectrum (2019-20), p. 518"
  tags: [ssc]

- slug: smi-26-m10
  difficulty: medium
  stem: "The Aitchison Committee on Public Services (1886) was set up by ___ and recommended raising the age limit to ___."
  options: { A: "Ripon; 21", B: "Lytton; 23", C: "Dufferin; 21", D: "Dufferin; 23" }
  answer: D
  explanation: "Dufferin set up the Aitchison Committee, which recommended raising the age limit to 23 (Lytton had reduced it to 19 in 1878)."
  source: "Spectrum (2019-20), p. 515"
  tags: [ssc]

- slug: smi-26-m11
  difficulty: medium
  stem: "Which of the following recommended that sub-district boards be established in every taluka or tehsil?"
  options: { A: "Mayo's Resolution of 1870", B: "Ripon's Resolution of 1882", C: "Royal Commission on Decentralisation, 1908", D: "Resolution of May 1918" }
  answer: C
  explanation: "The Royal Commission on Decentralisation (1908) urged sub-district boards in every taluka or tehsil with separate duties and revenue."
  source: "Spectrum (2019-20), pp. 529-530"
  tags: [ssc]

- slug: smi-26-m12
  difficulty: medium
  stem: "After 1857, the proportion of Europeans to Indians in the Bengal Army was fixed at"
  options: { A: "One to two", B: "Two to five", C: "One to three", D: "One to one" }
  answer: A
  explanation: "The ratio was fixed at one to two in the Bengal Army and two to five in the Madras and Bombay Armies."
  source: "Spectrum (2019-20), p. 519"
  tags: [ssc]

- slug: smi-26-m13
  difficulty: medium
  stem: "The ideology of 'martial' and 'non-martial' races developed in the late 1880s particularly under"
  options: { A: "Charles Wood", B: "Lord Roberts", C: "Lord Dufferin", D: "Lord Kimberley", E: "More than one of the above" }
  answer: B
  explanation: "The 'martial races' ideology developed under Lord Roberts, commander-in-chief from 1887 to 1892; soldiers from Awadh and Bihar were declared non-martial."
  source: "Spectrum (2019-20), p. 520"
  tags: [bpsc]

- slug: smi-26-m14
  difficulty: medium
  stem: "Under the Indian Councils Act, 1892, members could put questions to the executive on matters of public interest after giving how many days' notice?"
  options: { A: "Three days", B: "Seven days", C: "Fifteen days", D: "Six days" }
  answer: D
  explanation: "The 1892 Act allowed members to discuss financial statements and to ask questions, within limits, after six days' notice."
  source: "Spectrum (2019-20), p. 508"
  tags: [ssc]

- slug: smi-26-m15
  difficulty: medium
  stem: "The Charter Act of 1853 reduced the strength of the Court of Directors to"
  options: { A: "15", B: "24", C: "18", D: "12" }
  answer: C
  explanation: "The 1853 Act reduced the Court of Directors to 18; the council of 15 belongs to the Secretary of State under the 1858 Act."
  source: "Spectrum (2019-20), p. 506"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-26-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Regulating Act of 1773:

    1. The governor-general and his council in Bengal were to function according to majority rule.
    2. It provided for a Supreme Court of judicature in Bengal with original and appellate jurisdictions.
    3. It made the presidencies of Bombay and Madras clearly subordinate to the governor-general.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The Act gave the governor-general only vague powers over Bombay and Madras; it was Pitt's India Act (1784) that made them subordinate."
  source: "Spectrum (2019-20), pp. 503-504"
  tags: [bpsc]

- slug: smi-26-h02
  difficulty: hard
  stem: |
    Consider the following statements about the Charter Act of 1793:

    1. It renewed the Company's commercial privileges for the next 20 years.
    2. It ended the Company's monopoly over trade with China.
    3. It made royal approval mandatory for appointing the governor-general, the governors and the commander-in-chief.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The China trade monopoly ended only with the Charter Act of 1833; statements 1 and 3 are provisions of the 1793 Act."
  source: "Spectrum (2019-20), pp. 504-505"
  tags: [bpsc]

- slug: smi-26-h03
  difficulty: hard
  stem: |
    Consider the following statements about the Charter Act of 1833:

    1. It lifted all restrictions on European immigration and acquisition of property in India.
    2. The Governments of Madras and Bombay were deprived of their legislative powers.
    3. Slavery in India was abolished by the Act itself in 1833.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The 1833 Act only urged steps to ameliorate slaves' conditions and ultimately abolish slavery; slavery was abolished in 1843."
  source: "Spectrum (2019-20), pp. 505-506"
  tags: [bpsc]

- slug: smi-26-h04
  difficulty: hard
  stem: |
    **Assertion (A):** The Government of India Act, 1935 abolished dyarchy in the provinces.

    **Reason (R):** Under the 1935 Act the distinction between Reserved and Transferred Subjects in the provinces was abolished and full responsible government was established, subject to safeguards.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says provincial dyarchy was abolished, i.e., the distinction between Reserved and Transferred Subjects was removed, giving the provinces autonomy."
  source: "Spectrum (2019-20), p. 512"
  tags: [bpsc]

- slug: smi-26-h05
  difficulty: hard
  stem: |
    Consider the following statements about the Government of India Act, 1919:

    1. The Indian Legislative Council at the Centre was replaced by a Council of State and a Legislative Assembly.
    2. The provincial legislatures were made bicameral.
    3. It separated the provincial and central budgets for the first time.
    4. It provided for a High Commissioner for India holding office in London for six years.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2 and 3 only", D: "1, 3 and 4 only", E: "None of the above" }
  answer: D
  explanation: "Under the 1919 Act the provincial legislature was to consist of one house only; the other three statements are correct."
  source: "Spectrum (2019-20), pp. 509-510"
  tags: [bpsc]

- slug: smi-26-h06
  difficulty: hard
  stem: |
    Consider the following statements about the Government of India Act, 1935:

    1. Residuary legislative powers were vested in the provincial legislatures.
    2. About 10 per cent of the total population got the right to vote.
    3. The India Council of the Secretary of State was abolished.
    4. The Council of States was to be a permanent body.

    Which of the statements given above are correct?
  options: { A: "1, 2 and 3 only", B: "2, 3 and 4 only", C: "1 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "Residuary powers were subject to the discretion of the governor-general, not the provinces; statements 2, 3 and 4 are correct."
  source: "Spectrum (2019-20), p. 512"
  tags: [bpsc]

- slug: smi-26-h07
  difficulty: hard
  stem: |
    Consider the following statements:

    1. The appointment of the Indian Statutory Commission was announced in November 1927, two years before schedule.
    2. The commission recommended that dyarchy be abolished and communal electorates be continued.
    3. The joint parliamentary committee under Lord Linlithgow said a federation would be set up if at least 50 per cent of the princely states were ready to join.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three are stated in the book: the Simon Commission was announced in November 1927, it recommended ending dyarchy and continuing communal electorates, and Linlithgow's committee (1934) set the 50 per cent condition."
  source: "Spectrum (2019-20), p. 511"
  tags: [bpsc]

- slug: smi-26-h08
  difficulty: hard
  stem: |
    Consider the following statements about the police system under British rule:

    1. Cornwallis organised a regular police force in 1791 with thanas under a daroga and relieved the zamindars of police duties.
    2. William Bentinck abolished the office of the superintendent of police and made the collector/magistrate head of the police.
    3. The Indian Police Act, 1861 created an All-India Police.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The British did not create an All-India Police; the 1861 Act only gave guidelines for a police set-up in the provinces."
  source: "Spectrum (2019-20), p. 518"
  tags: [bpsc]

- slug: smi-26-h09
  difficulty: hard
  stem: |
    Consider the following statements about judicial reforms:

    1. Under Warren Hastings, the Sadar Nizamat Adalat functioned at Murshidabad under a deputy nizam.
    2. Cornwallis shifted the Sadar Nizamat Adalat to Allahabad.
    3. Under Cornwallis, the collector was left responsible only for revenue administration, with no magisterial functions.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Cornwallis shifted the Sadar Nizamat Adalat to Calcutta; Sadar adalats at Allahabad were set up under Bentinck."
  source: "Spectrum (2019-20), pp. 521-522"
  tags: [bpsc]

- slug: smi-26-h10
  difficulty: hard
  stem: |
    Arrange the following civil courts in the gradation set up under Cornwallis, from the lowest to the highest:

    1. Registrar's Court
    2. Sadar Diwani Adalat
    3. Munsiff's Court
    4. Circuit Court
  options: { A: "1, 3, 4, 2", B: "3, 1, 4, 2", C: "3, 4, 1, 2", D: "3, 1, 2, 4", E: "None of the above" }
  answer: B
  explanation: "The gradation was Munsiff's Court, Registrar's Court, District Court, Circuit Court, Sadar Diwani Adalat and finally the King-in-Council."
  source: "Spectrum (2019-20), p. 522"
  tags: [bpsc]

- slug: smi-26-h11
  difficulty: hard
  stem: |
    Arrange the following in chronological order:

    1. Indian Penal Code
    2. Criminal Procedure Code
    3. Civil Procedure Code
    4. Merger of the Supreme Court and Sadar Adalats into High Courts
  options: { A: "3, 1, 2, 4", B: "1, 3, 2, 4", C: "1, 2, 3, 4", D: "3, 2, 1, 4" }
  answer: A
  explanation: "Civil Procedure Code 1859, Indian Penal Code 1860, Criminal Procedure Code 1861, High Courts 1865."
  source: "Spectrum (2019-20), p. 523"
  tags: [ssc]

- slug: smi-26-h12
  difficulty: hard
  stem: |
    Consider the following statements about Ripon's Resolution of 1882:

    1. Non-officials were to be in a majority in local bodies.
    2. Non-officials were to act as chairpersons of these bodies.
    3. Official executive sanction was still needed for raising loans and imposing new taxes.
    4. Lord Curzon later reduced official control over local bodies in line with it.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "Lord Curzon, the 'high priest' of imperialism, actually took steps to increase official control over local bodies."
  source: "Spectrum (2019-20), pp. 528-529"
  tags: [bpsc]

- slug: smi-26-h13
  difficulty: hard
  stem: "The Simon Commission (May 1930) pointed out a lack of progress of village panchayats except in"
  options: { A: "Bombay, Bengal and Bihar", B: "Punjab, UP and Madras", C: "UP, Bengal and Madras", D: "Madras, Bombay and Bihar", E: "More than one of the above" }
  answer: C
  explanation: "The commission found little progress of village panchayats except in UP, Bengal and Madras, and suggested more provincial control over local bodies."
  source: "Spectrum (2019-20), p. 531"
  tags: [bpsc]

- slug: smi-26-h14
  difficulty: hard
  stem: |
    Consider the following statements about the army under British rule:

    1. The commissions of 1859 and 1879 insisted on a one-third white army, as against 14 per cent before 1857.
    2. Indians were allowed into the commissioned ranks from 1914 onwards.
    3. Soldiers from Awadh, Bihar, Central India and South India, who had taken part in the revolt, were declared non-martial.
    4. In 1926 the Indian Sandhurst Committee visualised a 50 per cent Indianised officer cadre for 1952.

    Which of the statements given above are correct?
  options: { A: "1 and 3 only", B: "2 and 4 only", C: "1, 2 and 3 only", D: "1, 3 and 4 only", E: "None of the above" }
  answer: D
  explanation: "Till 1914 the highest rank an Indian could reach was subedar; Indians were allowed into commissioned ranks only from 1918."
  source: "Spectrum (2019-20), pp. 519-520"
  tags: [bpsc]

- slug: smi-26-h15
  difficulty: hard
  stem: |
    Consider the following statements about the legislative council under the Indian Councils Act, 1861:

    1. The viceroy could add six to twelve additional members, at least half of whom had to be non-officials.
    2. It had control over the budget but could not discuss executive action.
    3. The viceroy could issue ordinances of six months' validity in an emergency.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The 1861 legislative council had no control over the budget; statements 1 and 3 are correct."
  source: "Spectrum (2019-20), p. 526"
  tags: [bpsc]
