# ---------- HARD ----------
- slug: smi-09-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Brahmo Samaj:

    1. It discarded faith in divine avataras (incarnations).
    2. It firmly upheld the doctrine of karma and transmigration of soul as binding on all Brahmos.
    3. It denied that any scripture could enjoy ultimate authority transcending human reason and conscience.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The Samaj took no definite stand on karma and transmigration and left it to individual Brahmos; statements 1 and 3 are correct."
  source: "Spectrum (2019-20), p. 208"
  tags: [bpsc]

- slug: smi-09-h02
  difficulty: hard
  stem: |
    Consider the following statements about Raja Rammohan Roy:

    1. He wrote Gift to Monotheists in 1809.
    2. In his Precepts of Jesus (1820), he praised the miracle stories of the New Testament.
    3. In 1825, he established a Vedanta college offering both Indian learning and Western social and physical sciences.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "In Precepts of Jesus he separated the moral and philosophical message of the New Testament, which he praised, from its miracle stories."
  source: "Spectrum (2019-20), pp. 206-208"
  tags: [bpsc]

- slug: smi-09-h03
  difficulty: hard
  stem: |
    **Assertion (A):** The Derozians failed to have a long-term impact.

    **Reason (R):** The Derozians lacked any real link with the masses; for instance, they failed to take up the peasants' cause.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book lists the lack of a real link with the masses, along with unripe social conditions and no support from other classes, among the reasons for their limited success."
  source: "Spectrum (2019-20), pp. 212-213"
  tags: [bpsc]

