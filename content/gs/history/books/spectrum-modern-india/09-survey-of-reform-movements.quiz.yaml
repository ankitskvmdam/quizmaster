- slug: smi-09-h13
  difficulty: hard
  stem: "In the Guruvayur temple-entry movement of 1931, who led a group of sixteen volunteers and was called the 'singing sword of Kerala'?"
  options: { A: "K. Kelappan", B: "Subramaniyam Tirumambu", C: "A.K. Gopalan", D: "P. Krishna Pillai", E: "More than one of the above" }
  answer: B
  explanation: "Inspired by K. Kelappan, the poet Subramaniyam Tirumambu, the 'singing sword of Kerala', led sixteen volunteers to Guruvayur; Krishna Pillai and Gopalan were among the satyagrahis."
  source: "Spectrum (2019-20), p. 227"
  tags: [bpsc]

- slug: smi-09-h14
  difficulty: hard
  stem: |
    Match List I with List II as given in the book:

    | List I | List II |
    |---|---|
    | a. Vokkaliga Sangha | 1. E.V. Ramaswamy Naicker |
    | b. Justice Movement | 2. Anti-brahmin movement in Mysore, 1905 |
    | c. Self-Respect Movement | 3. Editor of Deshabhimani who raised temple entry |
    | d. T.K. Madhavan | 4. C.N. Mudaliar, T.M. Nair and P. Tyagaraja |
  options: { A: "a-2, b-1, c-4, d-3", B: "a-3, b-4, c-1, d-2", C: "a-2, b-4, c-1, d-3", D: "a-4, b-2, c-1, d-3", E: "None of the above" }
  answer: C
  explanation: "Vokkaliga Sangha launched an anti-brahmin movement in Mysore in 1905; the Justice Movement was started by Mudaliar, Nair and Tyagaraja; Naicker led the Self-Respect Movement; T.K. Madhavan edited Deshabhimani."
  source: "Spectrum (2019-20), pp. 226-227"
  tags: [bpsc]

- slug: smi-09-h15
  difficulty: hard
  stem: |
    Consider the following statements:

    1. The Dev Samaj was founded at Lahore in 1887 by Shiv Narayan Agnihotri, earlier a Brahmo follower.
    2. The Bharat Dharma Mahamandala was formed in 1902 with headquarters at Varanasi.
    3. Behramji Malabari founded the Seva Sadan in 1908 along with Diwan Dayaram Gidumal.
    4. The Bharat Dharma Mahamandala was formed to defend the teachings of the Arya Samaj and the Theosophists.

    Which of the statements given above are correct?
  options: { A: "1 and 3 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "The Bharat Dharma Mahamandala defended orthodox Hinduism against the teachings of the Arya Samajists, Theosophists and the Ramakrishna Mission; statements 1-3 are correct."
  source: "Spectrum (2019-20), pp. 223-224"
  tags: [bpsc]
