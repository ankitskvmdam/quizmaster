- slug: smi-24-m14
  difficulty: medium
  stem: "In 1887, who was propped up by the government along with Syed Ahmed Khan as an anti-Congress front?"
  options: { A: "Badruddin Tyabji", B: "Hamid Ali Khan", C: "Raja Shiv Prasad of Bhinga", D: "Mir Musharraf Hussain" }
