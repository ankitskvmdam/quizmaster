# ---------- MEDIUM ----------
- slug: smi-24-m01
  difficulty: medium
  stem: |
    Arrange the following events in chronological order:

    1. Arrival of the Cabinet Mission in Delhi
    2. Strike by the Royal Indian Navy ratings in Bombay
    3. Muslim League joining the Interim Government
    4. First INA trial at the Red Fort

    Select the correct answer:
  options: { A: "4, 2, 1, 3", B: "2, 4, 1, 3", C: "4, 1, 2, 3", D: "2, 4, 3, 1", E: "None of the above" }
  answer: A
  explanation: "Red Fort trial (November 1945), RIN strike (February 18, 1946), Cabinet Mission in Delhi (March 24, 1946), League joins Interim Government (October 26, 1946)."
  source: "Spectrum (2019-20), pp. 464-476"
  tags: [bpsc]

- slug: smi-24-m02
  difficulty: medium
  stem: |
    Match List I (member of the Interim Government) with List II (portfolio):

    | List I | List II |
    |---|---|
    | a. Vallabhbhai Patel | 1. Railway |
    | b. C. Rajagopalachari | 2. Works, Mines and Power |
    | c. C.H. Bhabha | 3. Home, Information and Broadcasting |
    | d. Asaf Ali | 4. Education |
  options: { A: "a-3, b-2, c-4, d-1", B: "a-3, b-4, c-2, d-1", C: "a-4, b-3, c-2, d-1", D: "a-3, b-4, c-1, d-2", E: "None of the above" }
  answer: B
  explanation: "Patel held Home, Information and Broadcasting; Rajagopalachari Education; C.H. Bhabha Works, Mines and Power; Asaf Ali Railway."
  source: "Spectrum (2019-20), p. 477"
  tags: [bpsc]

- slug: smi-24-m03
  difficulty: medium
