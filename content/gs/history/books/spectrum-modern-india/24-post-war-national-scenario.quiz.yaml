  tags: [ssc]

- slug: smi-24-m15
  difficulty: medium
  stem: "In the 1920s, in retaliation to the Arya Samaj's Shuddhi and Sangathan movements, Muslims started the"
  options: { A: "Wahabi and Khilafat movements", B: "Jamaat-i-ulema and Khudai Khidmatgar movements", C: "Tabligh and Tanzeem movements", D: "Ahrar and Faraizi movements" }
