  tags: [bpsc]

- slug: smi-24-m05
  difficulty: medium
  stem: "Which office did A.V. Alexander hold when he came to India as a member of the Cabinet Mission?"
  options: { A: "Secretary of State for India", B: "President of the Board of Trade", C: "Prime Minister", D: "First Lord of the Admiralty" }
  answer: D
  explanation: "The Mission comprised Pethick Lawrence (Secretary of State), Stafford Cripps (President of the Board of Trade) and A.V. Alexander (First Lord of Admiralty)."
  source: "Spectrum (2019-20), p. 470"
  tags: [ssc]

- slug: smi-24-m06
  difficulty: medium
  stem: "In the elections of 1945-46, the Congress share of non-Muslim votes and the Muslim League share of Muslim votes were respectively"
  options: { A: "86.6 per cent and 91 per cent", B: "91 per cent and 57 per cent", C: "57 per cent and 86.6 per cent", D: "91 per cent and 86.6 per cent" }
  answer: D
