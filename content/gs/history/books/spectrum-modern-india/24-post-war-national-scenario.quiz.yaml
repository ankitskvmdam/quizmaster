  source: "Spectrum (2019-20), pp. 469-470"
  tags: [ssc]

- slug: smi-24-m07
  difficulty: medium
  stem: "In the provincial elections of 1945-46, the Congress failed to get a majority in"
  options: { A: "NWFP, Sindh and Punjab", B: "Bengal, Assam and Punjab", C: "Bengal, Sindh and Punjab", D: "Bengal, Sindh and NWFP", E: "None of the above" }
  answer: C
  explanation: "Congress won a majority in most provinces except Bengal, Sindh and Punjab; NWFP and Assam were Congress-majority provinces."
  source: "Spectrum (2019-20), p. 469"
  tags: [bpsc]

- slug: smi-24-m08
  difficulty: medium
  stem: "After the 1946 elections, which coalition assumed power in Punjab under Khizr Hayat Khan?"
  options: { A: "Unionist-League-Akali", B: "Unionist-Congress-Akali", C: "Congress-Akali-Sikh League", D: "League-Unionist" }
  answer: B
  explanation: "In Punjab a Unionist-Congress-Akali coalition under Khizr Hayat Khan assumed power."
  source: "Spectrum (2019-20), p. 470"
  tags: [ssc]

- slug: smi-24-m09
  difficulty: medium
  stem: "Wavell's 'Breakdown Plan' (May 1946) envisaged"
  options: { A: "an immediate transfer of power over the whole country to the Congress", B: "withdrawal of the British Army and officials to the Muslim provinces of the North-West and North-East, handing the rest to the Congress", C: "a League-led interim government at the Centre", D: "dominion status with every province free to stay out of the Union" }
  answer: B
  explanation: "Wavell's plan, a middle course between 'repression' and 'scuttle', envisaged withdrawal to the Muslim provinces of the North-West and North-East and handing over the rest to the Congress."
  source: "Spectrum (2019-20), p. 475"
  tags: [ssc]

- slug: smi-24-m10
  difficulty: medium
  stem: "On July 29, 1946 the Muslim League withdrew its acceptance of the Cabinet Mission's long-term plan in response to"
  options: { A: "Nehru's statement of July 10, 1946 on the Constituent Assembly", B: "the swearing-in of the Interim Government", C: "Attlee's speech of March 15, 1946", D: "the Mission's clarification that grouping was compulsory", E: "None of the above" }
  answer: A
  explanation: "The League withdrew in response to Nehru's July 10 statement that the Congress was bound by nothing except entering the Constituent Assembly."
  source: "Spectrum (2019-20), p. 475"
  tags: [bpsc]

- slug: smi-24-m11
  difficulty: medium
  stem: "The upsurge in Calcutta on February 11, 1946 was a protest against"
  options: { A: "the seven-year sentence given to INA officer Rashid Ali", B: "the firing on a student procession at Dalhousie Square", C: "the opening of the INA trial at the Red Fort", D: "the arrest of a naval rating for scrawling 'Quit India'" }
  answer: A
  explanation: "The second upsurge, on February 11, 1946 in Calcutta, was against the seven-year sentence to INA officer Rashid Ali."
  source: "Spectrum (2019-20), p. 466"
  tags: [ssc]

- slug: smi-24-m12
  difficulty: medium
  stem: "The notion that since two religious communities have different religious interests, they also have different secular (economic, political, cultural) interests is termed in the book as"
  options: { A: "Communal nationalism", B: "Liberal communalism", C: "Extreme communalism", D: "Militant nationalism" }
  answer: B
  explanation: "Liberal communalism is the second stage; extreme communalism holds that the interests are incompatible."
  source: "Spectrum (2019-20), p. 478"
  tags: [ssc]

- slug: smi-24-m13
