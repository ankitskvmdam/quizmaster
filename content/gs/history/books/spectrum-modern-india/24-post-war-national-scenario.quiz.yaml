  tags: [ssc]

# ---------- HARD ----------
- slug: smi-24-h01
  difficulty: hard
  stem: |
    Consider the following statements about the factors behind the change in the British government's attitude in 1945:

    1. The USA and the USSR, which emerged as superpowers, both favoured freedom for India.
    2. The last elections had been held in 1937, both for the Centre and for the provinces.
    3. There was an anti-imperialist wave in Vietnam and Indonesia resisting the replanting of French and Dutch rule.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 3 are in the book; the last elections were in 1934 for the Centre and 1937 for the provinces."
  source: "Spectrum (2019-20), p. 463"
  tags: [bpsc]

- slug: smi-24-h02
  difficulty: hard
  stem: "Which one of the following was NOT among the three accused put together in the dock at the first INA trial in November 1945?"
  options: { A: "Prem Kumar Sehgal", B: "Shah Nawaz Khan", C: "Gurbaksh Singh Dhillon", D: "Rashid Ali" }
  answer: D
  explanation: "The first trial put a Hindu (Sehgal), a Muslim (Shah Nawaz Khan) and a Sikh (Dhillon) together; Rashid Ali's sentence sparked the February 1946 upsurge."
  source: "Spectrum (2019-20), p. 464"
  tags: [ssc]

- slug: smi-24-h03
  difficulty: hard
  stem: |
    Consider the following statements about the INA agitation:

    1. The defence of INA prisoners was organised by Bhulabhai Desai, Tej Bahadur Sapru, Kailash Nath Katju, Jawaharlal Nehru and Asaf Ali.
    2. The first post-War Congress session, held at Bombay in September 1945, adopted a resolution supporting the INA cause.
    3. The Muslim League and the Hindu Mahasabha stayed away from supporting the INA cause.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The book lists the Muslim League and the Hindu Mahasabha among those who supported the INA cause, so statement 3 is wrong."
  source: "Spectrum (2019-20), p. 465"
  tags: [bpsc]

- slug: smi-24-h04
  difficulty: hard
  stem: |
    **Assertion (A):** The elections of 1945-46 witnessed communal voting, in contrast to the anti-British unity shown in the upsurges.

    **Reason (R):** There were separate electorates and a limited franchise — less than 10 per cent of the population could vote for the provinces and less than 1 per cent for the Central Assembly.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book attributes the communal voting to separate electorates and the limited franchise, so R explains A."
  source: "Spectrum (2019-20), p. 470"
  tags: [bpsc]

- slug: smi-24-h05
  difficulty: hard
  stem: |
    Consider the following statements about the limitations of the three upsurges of 1945-46:

    1. They were short-lived and confined to a few urban centres, while the general INA agitation reached the remotest villages.
    2. The communal unity witnessed was more a unity among the people than an organisational unity.
    3. A Maratha battalion in Bombay rounded up the ratings and restored them to their barracks.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "The book says the unity was more organisational than among the people (Muslim ratings went to the League, others to Congress and Socialists)."
  source: "Spectrum (2019-20), pp. 468-469"
  tags: [bpsc]

- slug: smi-24-h06
  difficulty: hard
  stem: |
    Consider the following statements about concessions the British made after the upsurges:

    1. Indian soldiers were withdrawn from Indo-China and Indonesia by February 1947.
    2. The government announced that all INA members would be brought to trial irrespective of the charges against them.
    3. The decision to send the Cabinet Mission was taken in January 1946.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 and 3 only", C: "2 and 3 only", D: "1 only", E: "None of the above" }
  answer: B
  explanation: "Only INA members accused of murder or brutal treatment of fellow prisoners were to be tried, so statement 2 is wrong."
  source: "Spectrum (2019-20), p. 468"
  tags: [bpsc]

- slug: smi-24-h07
  difficulty: hard
  stem: |
    Consider the following statements about the RIN revolt of February 1946:

    1. Some 1100 ratings of HMIS Talwar went on strike.
    2. The rebel ratings hoisted the tricolour, crescent, and hammer and sickle flags on the mast of the rebel fleet.
    3. One of their demands was the withdrawal of Indian troops from Indonesia.
    4. The Royal Indian Air Force went on sympathetic strike at Karachi, Madras and Visakhapatnam.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "2, 3 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "Karachi, Madras and Visakhapatnam saw strikes in military establishments; the RIAF struck at Bombay, Poona, Calcutta, Jessore and Ambala."
  source: "Spectrum (2019-20), p. 467"
  tags: [bpsc]

- slug: smi-24-h08
  difficulty: hard
  stem: |
    **Assertion (A):** The RIN revolt was seen as an event marking the end of British rule.

    **Reason (R):** The revolt destroyed the British infrastructure of repression, so the British could not regain control of the situation.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "The book says the British infrastructure to repress remained intact and they soon controlled the situation, so R is false."
  source: "Spectrum (2019-20), pp. 468-469"
  tags: [bpsc]

- slug: smi-24-h09
  difficulty: hard
  stem: |
    Consider the following provisions of the Cabinet Mission Plan:

    1. Communal questions in the central legislature were to be decided by a simple majority of both communities present and voting.
    2. Provinces were to have full autonomy and residual powers.
    3. After 10 years, a province was to be free to call for a reconsideration of the group or the union constitution.
    4. A province was free to come out of a group even before the first general elections.

    Which of the provisions given above are correctly stated?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 3 and 4 only", D: "1, 2 and 3 only", E: "None of the above" }
  answer: D
  explanation: "A province could come out of a group only after the first general elections, so 4 is wrong."
  source: "Spectrum (2019-20), p. 474"
  tags: [bpsc]

- slug: smi-24-h10
  difficulty: hard
  stem: "While rejecting the demand for a full-fledged Pakistan, the Cabinet Mission noted that the non-Muslim population of such a Pakistan would be"
  options: { A: "38 per cent in the North-West and 48 per cent in the North-East", B: "48 per cent in the North-West and 38 per cent in the North-East", C: "38 per cent in both the North-West and the North-East", D: "48 per cent in both the North-West and the North-East" }
  answer: A
  explanation: "The Mission said Pakistan would include a large non-Muslim population: 38 per cent in the North-West and 48 per cent in the North-East."
  source: "Spectrum (2019-20), p. 473"
  tags: [ssc]

- slug: smi-24-h11
  difficulty: hard
  stem: |
    Consider the following statements about reactions to the Cabinet Mission Plan:

    1. The Congress objected that provinces should have the option of not joining a group in the first place.
    2. The Congress objected that members from princely states could only be nominated by the princes, not elected.
    3. The League wanted sections B and C to develop into solid entities with a view to future secession into Pakistan.
    4. The Congress read the grouping clause as compulsory, while the League read it as optional.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 3 and 4 only", E: "None of the above" }
  answer: B
  explanation: "Statement 4 is reversed: the Congress saw grouping as optional and the League as compulsory."
  source: "Spectrum (2019-20), pp. 474-475"
  tags: [bpsc]

- slug: smi-24-h12
  difficulty: hard
  stem: |
    Consider the following statements about the Interim Government:

    1. Jogendra Nath Mandal, a Muslim League nominee, held the Law portfolio.
    2. The Muslim League joined the Interim Government on October 26, 1946 after giving up 'direct action'.
    3. Wavell overruled the ministers on the release of INA prisoners in his very last cabinet meeting in March 1947.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The League was allowed to join without giving up 'direct action', so statement 2 is wrong."
  source: "Spectrum (2019-20), pp. 476-477"
  tags: [bpsc]

- slug: smi-24-h13
  difficulty: hard
  stem: "Garhmukteshwar, listed with Calcutta, Bombay, Noakhali and Bihar among the worst-hit areas of the communal riots from August 16, 1946, was in"
  options: { A: "Bengal", B: "Bihar", C: "United Provinces", D: "Punjab", E: "More than one of the above" }
  answer: C
  explanation: "The book names Garhmukteshwar (United Provinces) among the worst-hit areas, along with Calcutta, Bombay, Noakhali and Bihar."
  source: "Spectrum (2019-20), p. 476"
  tags: [bpsc]

- slug: smi-24-h14
  difficulty: hard
  stem: |
    Consider the following statements about the evolution of the two-nation theory:

    1. In 1906 Lord Minto assured Muslims of special communal representation in excess of their population.
    2. Separate electorates were awarded under the Morley-Minto Reforms of 1909.
    3. The idea of a separate Muslim nation was first proposed in the early 1930s by the poet Iqbal and later developed by Rahmat Ali.
    4. The Communal Award of 1932 accepted all Muslim communal demands contained in the 14 points.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 4 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "Statement 3 is reversed: Rahmat Ali proposed the idea in the early 1930s and the poet Iqbal developed it."
  source: "Spectrum (2019-20), pp. 485-487"
