  explanation: "Provincial assemblies were to send 292, chief commissioner's provinces 4 and princely states 93 members."
  source: "Spectrum (2019-20), p. 473"
  tags: [ssc]

- slug: smi-24-m04
  difficulty: medium
  stem: "Under the Cabinet Mission Plan's grouping of provincial assemblies, Bihar was placed in"
