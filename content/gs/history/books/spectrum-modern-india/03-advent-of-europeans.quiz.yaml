  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The siege of 1632 was ordered by Shah Jahan, who told Bengal governor Qasim Khan to act against the Portuguese."
