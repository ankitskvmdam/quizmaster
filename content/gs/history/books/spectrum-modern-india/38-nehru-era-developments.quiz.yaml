  tags: [bpsc]

# ---------- MEDIUM ----------
- slug: smi-38-m01
  difficulty: medium
  stem: "The Congress's JVP Committee (December 1948) consisted of Jawaharlal Nehru, Vallabhbhai Patel and"
  options: { A: "Pattabhi Sitaramayya", B: "Potti Sriramulu", C: "Purushottam Das Tandon", D: "P.C. Mahalanobis" }
  answer: A
  explanation: "The JVP Committee comprised Nehru, Patel and Pattabhi Sitaramayya; its report also went against linguistic states."
  source: "Spectrum (2019-20), p. 638"
  tags: [ssc]

- slug: smi-38-m02
  difficulty: medium
  stem: "The States Reorganisation Act of November 1956 provided for"
  options: { A: "21 states and 6 centrally administered territories", B: "14 states and 6 centrally administered territories", C: "14 states and 9 centrally administered territories", D: "17 states and 6 centrally administered territories" }
  answer: B
  explanation: "The 1956 Act provided for fourteen states and six centrally administered territories."
  source: "Spectrum (2019-20), p. 638"
  tags: [ssc]

- slug: smi-38-m03
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. Government agrees to bifurcate Bombay into Maharashtra and Gujarat
    2. Andhra state comes into existence
    3. States Reorganisation Commission submits its report
    4. Congress appoints the JVP Committee

    Select the correct answer using the codes given below:
  options: { A: "4-3-2-1", B: "2-4-3-1", C: "4-2-3-1", D: "4-2-1-3", E: "None of the above" }
  answer: C
  explanation: "JVP Committee (December 1948), Andhra (October 1953), SRC report (October 1955), Bombay bifurcation agreed (May 1960)."
  source: "Spectrum (2019-20), pp. 638-639"
  tags: [bpsc]

