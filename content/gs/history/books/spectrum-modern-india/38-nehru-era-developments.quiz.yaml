  source: "Spectrum (2019-20), p. 648"
  tags: [ssc]

- slug: smi-38-e11
  difficulty: easy
  stem: "Who headed the communist government formed in Kerala in 1957?"
  options: { A: "A.K. Gopalan", B: "Sheikh Abdullah", C: "Rammanohar Lohia", D: "E.M.S. Namboodiripad" }
  answer: D
  explanation: "The CPI emerged as the largest party in Kerala in 1957 and E.M.S. Namboodiripad formed the government."
  source: "Spectrum (2019-20), p. 644"
  tags: [ssc]

