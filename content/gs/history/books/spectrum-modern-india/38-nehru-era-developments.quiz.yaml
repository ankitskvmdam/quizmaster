  source: "Spectrum (2019-20), pp. 647-648"
  tags: [bpsc]

- slug: smi-38-m05
  difficulty: medium
  stem: "When the Praja Socialist Party was formed in September 1952, who became its chairman?"
  options: { A: "Ashoka Mehta", B: "Rammanohar Lohia", C: "J.B. Kripalani", D: "Jayaprakash Narayan", E: "More than one of the above" }
  answer: C
  explanation: "The PSP, formed by merging the Socialist Party and the KMPP, had J.B. Kripalani as chairman and Ashoka Mehta as general secretary."
  source: "Spectrum (2019-20), p. 640"
  tags: [bpsc]

- slug: smi-38-m06
  difficulty: medium
  stem: "At which meeting did the Communist Party of India declare that it was possible to advance to socialism through peaceful and parliamentary means?"
  options: { A: "Vijayawada, 1961", B: "Amritsar, 1958", C: "Nashik, 1948", D: "Betul, 1953" }
  answer: B
  explanation: "At its 1958 Amritsar meeting the CPI accepted the peaceful parliamentary path; at Vijayawada (1961) it adopted 'struggle as well as unity' towards the Congress."
  source: "Spectrum (2019-20), p. 641"
  tags: [ssc]

- slug: smi-38-m07
  difficulty: medium
  stem: "Under the Official Languages Act, 1963, English was given the status of"
  options: { A: "national language", B: "sole official language", C: "regional official language", D: "associate additional official language" }
  answer: D
  explanation: "The 1963 Act said Hindi would be the official language from 1965, but as a concession English became the 'associate additional official language'."
  source: "Spectrum (2019-20), pp. 636-637"
  tags: [ssc]

- slug: smi-38-m08
  difficulty: medium
  stem: "Opposition to which measure, led by the Catholic Church, began the trouble that ended in the dismissal of the EMS Namboodiripad government in Kerala?"
  options: { A: "The Education Bill", B: "The Hindu Code Bill", C: "The Official Languages Bill", D: "The Anti-Untouchability Bill" }
  answer: A
  explanation: "The Education Bill, a progressive measure, was opposed by the Catholic Church; agitation followed and President's Rule was imposed in July 1959."
  source: "Spectrum (2019-20), p. 644"
  tags: [ssc]

- slug: smi-38-m09
  difficulty: medium
  stem: "In the 1962 elections, the Swatantra Party emerged as the main opposition party in which four states?"
  options: { A: "Kerala, Madras, Bombay and Punjab", B: "Bihar, Uttar Pradesh, Madhya Pradesh and Orissa", C: "Bihar, Rajasthan, Gujarat and Orissa", D: "Rajasthan, Gujarat, Maharashtra and Assam", E: "None of the above" }
  answer: C
  explanation: "In 1962 the Swatantra Party won 18 Lok Sabha seats and became the main opposition in Bihar, Rajasthan, Gujarat and Orissa."
  source: "Spectrum (2019-20), p. 643"
  tags: [bpsc]

- slug: smi-38-m10
  difficulty: medium
  stem: "Despite sharp opposition from conservative sections, the Hindu Code Bill was passed in the form of how many separate Acts?"
  options: { A: "Two", B: "Three", C: "Five", D: "Four" }
  answer: D
  explanation: "The bill, moved in 1951, was passed as four separate Acts introducing monogamy, divorce rights, maintenance and inheritance rights for women."
  source: "Spectrum (2019-20), p. 648"
  tags: [ssc]

- slug: smi-38-m11
  difficulty: medium
  stem: "India's first nuclear reactor, also Asia's first, became critical in August 1956 at"
  options: { A: "Thumba", B: "Trombay", C: "Kharagpur", D: "Sindri" }
  answer: B
  explanation: "In August 1956 India's first nuclear reactor, at Trombay, became critical — also Asia's first."
  source: "Spectrum (2019-20), p. 647"
  tags: [ssc]

- slug: smi-38-m12
  difficulty: medium
  stem: "In which year did India finally withdraw its offer to hold a plebiscite in Kashmir?"
  options: { A: "1955", B: "1949", C: "1948", D: "1964" }
  answer: A
  explanation: "India had agreed to a plebiscite under international supervision but, due to changed circumstances, withdrew the offer in 1955."
  source: "Spectrum (2019-20), pp. 649-650"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-38-h01
  difficulty: hard
  stem: |
    Consider the following statements about the language question:

    1. The Language Committee of the Constituent Assembly called Hindi in Devanagari the 'official' rather than the 'national' language to placate the opposition.
    2. English was to continue for all official purposes for the first fifteen years.
    3. The Official Languages (Amendment) Act, 1967 made Hindi the sole language of official communication between the Centre and the states.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The 1967 amendment provided a bilingual (English-Hindi) solution for Centre-state communication, not Hindi alone."
  source: "Spectrum (2019-20), pp. 636-637"
  tags: [bpsc]

- slug: smi-38-h02
  difficulty: hard
  stem: |
    Consider the following statements about the reorganisation of states in 1956:

    1. Kerala was formed by merging the Malabar district of the old Madras Presidency with Travancore-Cochin.
    2. Mysore was enlarged by adding Kannada-speaking areas of Bombay, Madras, Hyderabad and Coorg.
    3. The States Reorganisation Commission recommended splitting Bombay into Maharashtra and Gujarat.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The SRC opposed splitting Bombay and Punjab, which led to rioting in Bombay; bifurcation was agreed only in May 1960."
  source: "Spectrum (2019-20), pp. 638-639"
  tags: [bpsc]

- slug: smi-38-h03
  difficulty: hard
  stem: |
    Consider the following statements:

    1. The Nagas, the first to raise the issue of ethnic identity, got a separate state conceded in 1960, inaugurated in 1963.
    2. The demand for a Punjabi Suba was settled during Nehru's lifetime.
    3. The merger of PEPSU with Punjab in 1956 was an exception to the linguistic principle.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The Punjabi Suba problem remained unsolved in Nehru's time and was addressed later by Indira Gandhi."
  source: "Spectrum (2019-20), p. 639"
  tags: [bpsc]

- slug: smi-38-h04
  difficulty: hard
  stem: |
    Consider the following statements about the socialists after independence:

    1. Their dissociation from the Congress was announced at a meeting in Nashik on March 28, 1948.
    2. At the Betul conference (1953), the party accepted Ashok Mehta's call to support the ruling party.
    3. Lohia's Socialist Party merged with the PSP in 1964 to form the Samyukta Socialist Party.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "2 and 3 only", C: "1 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "Mehta's thesis at Betul was rejected; the party accepted Lohia's approach of equidistance from the Congress and the Communists."
  source: "Spectrum (2019-20), p. 640"
  tags: [bpsc]

- slug: smi-38-h05
  difficulty: hard
  stem: |
    Consider the following statements about Jayaprakash Narayan in the Nehru era:

    1. In 1954, he announced that he would dedicate his life to Bhoodan and other constructive activities.
    2. After the 1957 general elections, he left active politics and campaigned for 'partyless democracy'.
    3. He became deputy chairman of the Planning Commission and joined the Congress with one-third of the PSP cadres.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "It was Ashok Mehta who became deputy chairman of the Planning Commission and joined the Congress with about one-third of PSP cadres."
  source: "Spectrum (2019-20), p. 640"
  tags: [bpsc]

- slug: smi-38-h06
  difficulty: hard
  stem: |
    **Assertion (A):** In 1964, the Communist Party of India split into the CPI and the CPI (Marxist).

    **Reason (R):** The Sino-Soviet ideological split had great resonance among Indian communists, many of whom sympathised with the Chinese position.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book cites the Sino-Soviet split and China's call to distance from the 'revisionist' Soviet line among the causes of the 1964 split."
  source: "Spectrum (2019-20), p. 641"
  tags: [bpsc]

- slug: smi-38-h07
  difficulty: hard
  stem: |
    Consider the following statements about the Bharatiya Jana Sangh:

    1. It was founded on October 21, 1951.
    2. Mauli Chandra Sharma, its second president, resigned in protest against RSS domination of the party.
    3. From the outset it accepted retaining English along with Hindi as long as the non-Hindi states wanted it.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The Jana Sangh first pressed for Sanskritised Hindi as the link language and gave up this demand only in 1965."
  source: "Spectrum (2019-20), p. 642"
  tags: [bpsc]

- slug: smi-38-h08
  difficulty: hard
  stem: |
    Consider the following statements about the Swatantra Party:

    1. It favoured the 'night watchman' or laissez-faire State and stood for free private enterprise.
    2. It supported non-alignment and Indo-Soviet collaboration.
    3. Most of its leaders joined the Bharatiya Lok Dal in 1974.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1 and 3 only", E: "None of the above" }
  answer: D
  explanation: "The Swatantra Party denounced non-alignment and Indo-Soviet collaboration and wanted close ties with the US and Western Europe."
  source: "Spectrum (2019-20), p. 643"
  tags: [bpsc]

- slug: smi-38-h09
  difficulty: hard
  stem: |
    Consider the following statements about science and technology under Nehru:

    1. The Scientific Policy Resolution was passed by the Lok Sabha in March 1958.
    2. Nehru himself assumed the chairmanship of the Council of Scientific and Industrial Research (CSIR).
    3. INCOSPAR, along with a rocket launching facility at Thumba, was established in 1962.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1, 2 and 3", D: "2 and 3 only" }
  answer: C
  explanation: "All three are stated in the book's section on the progress of science and technology."
  source: "Spectrum (2019-20), pp. 646-647"
  tags: [ssc]

