  source: "Spectrum (2019-20), p. 647"
  tags: [ssc]

- slug: smi-38-e08
  difficulty: easy
  stem: "The comprehensive Indus Waters agreement between India and Pakistan was signed on September 19, 1960 at"
  options: { A: "New Delhi", B: "Lahore", C: "Colombo", D: "Karachi" }
  answer: D
  explanation: "After an interim agreement in 1959, the comprehensive agreement was signed on September 19, 1960 in Karachi, under World Bank guidance."
  source: "Spectrum (2019-20), p. 650"
  tags: [ssc]

- slug: smi-38-e09
  difficulty: easy
  stem: "The Indian University Education Commission of 1949 was chaired by"
  options: { A: "A. Lakshmanswami Mudaliar", B: "P.C. Mahalanobis", C: "S. Radhakrishnan", D: "Hridaynath Kunzru" }
  answer: C
  explanation: "The 1949 University Education Commission was chaired by Dr S. Radhakrishnan; its recommendation led to the UGC."
  source: "Spectrum (2019-20), p. 647"
  tags: [ssc]

- slug: smi-38-e10
  difficulty: easy
  stem: "In which year did the government pass the Anti-Untouchability Law, making untouchability a punishable and cognisable offence?"
  options: { A: "1951", B: "1955", C: "1956", D: "1961" }
