# Chapter 38 — Developments under Nehru's Leadership (1947-64) (book pp. 635-652)
# ---------- EASY ----------
- slug: smi-38-e01
  difficulty: easy
  stem: "The state of Andhra, which came into existence on October 1, 1953, was separated from which state?"
  options: { A: "Hyderabad", B: "Mysore", C: "Madras", D: "Bombay" }
  answer: C
  explanation: "Andhra came into existence on October 1, 1953, with the region separated from the Tamil-speaking Madras state."
  source: "Spectrum (2019-20), p. 638"
  tags: [ssc]

- slug: smi-38-e02
  difficulty: easy
  stem: "Which Gandhian died after fasting for fifty-six days for a separate Andhra state?"
  options: { A: "Swami Sitaram", B: "Potti Sriramulu", C: "Pattabhi Sitaramayya", D: "Fazl Ali" }
  answer: B
  explanation: "Potti Sriramulu renewed the movement in 1952 and died after a 56-day fast; Swami Sitaram had broken his fast after 35 days."
  source: "Spectrum (2019-20), p. 638"
  tags: [ssc]

- slug: smi-38-e03
  difficulty: easy
  stem: "The Linguistic Provinces Commission appointed by the Constituent Assembly in June 1948 was headed by"
  options: { A: "Justice S.K. Dhar", B: "Justice Fazl Ali", C: "K.M. Panikkar", D: "Hridaynath Kunzru" }
  answer: A
  explanation: "The Linguistic Provinces Commission was headed by Justice S.K. Dhar; it opposed linguistic provinces in the interest of national integration."
  source: "Spectrum (2019-20), p. 637"
  tags: [ssc]

- slug: smi-38-e04
  difficulty: easy
  stem: "The First Five Year Plan (1951-1956) was based on the"
  options: { A: "Mahalanobis model", B: "Bombay Plan", C: "Soviet model", D: "Harrod-Domar model" }
  answer: D
  explanation: "The First Plan, based on the Harrod-Domar model, focused mainly on the agrarian sector, dams and irrigation."
  source: "Spectrum (2019-20), p. 645"
  tags: [ssc]

- slug: smi-38-e05
  difficulty: easy
  stem: "The Second Five Year Plan, which stressed heavy industries, was drafted under the leadership of"
  options: { A: "P.C. Mahalanobis", B: "Homi J. Bhabha", C: "Ashoka Mehta", D: "S. Radhakrishnan" }
  answer: A
  explanation: "The Second Plan was drafted under P.C. Mahalanobis and reflected the 'socialistic pattern of society'."
  source: "Spectrum (2019-20), p. 645"
  tags: [ssc]

- slug: smi-38-e06
  difficulty: easy
