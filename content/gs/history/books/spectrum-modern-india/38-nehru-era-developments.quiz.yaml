  difficulty: medium
  stem: |
    Match List I (institution) with List II (year of setting up):

    | List I | List II |
    |---|---|
    | a. National Physical Laboratory | 1. 1961 |
    | b. Atomic Energy Commission | 2. 1953 |
    | c. University Grants Commission | 3. 1948 |
    | d. NCERT | 4. 1947 |
  options: { A: "a-3, b-4, c-2, d-1", B: "a-4, b-3, c-1, d-2", C: "a-4, b-2, c-3, d-1", D: "a-4, b-3, c-2, d-1", E: "None of the above" }
  answer: D
