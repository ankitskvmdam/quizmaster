  answer: C
  explanation: "Young Aruna Asaf Ali, till then relatively unknown, presided over the session on August 9 and hoisted the flag."
  source: "Spectrum (2019-20), p. 449"
  tags: [ssc]

- slug: smi-23-e03
  difficulty: easy
  stem: "Who started an underground radio in Bombay during the Quit India Movement?"
  options: { A: "Aruna Asaf Ali", B: "Usha Mehta", C: "Sucheta Kripalani", D: "Achyut Patwardhan" }
  answer: B
