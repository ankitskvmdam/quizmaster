# Chapter 23 — Quit India Movement, Demand for Pakistan, and the INA (book pp. 447-461)
# ---------- EASY ----------
- slug: smi-23-e01
  difficulty: easy
  stem: "The Quit India Resolution was ratified on August 8, 1942 at"
