# ---------- MEDIUM ----------
- slug: smi-23-m01
  difficulty: medium
  stem: "The Quit India resolution at the CWC meeting was proposed and seconded respectively by"
  options: { A: "Gandhi and Nehru", B: "Maulana Azad and Rajendra Prasad", C: "Jawaharlal Nehru and Sardar Patel", D: "Sardar Patel and Jawaharlal Nehru", E: "More than one of the above" }
  answer: C
  explanation: "The Quit India resolution was proposed by Jawaharlal Nehru and seconded by Sardar Patel."
  source: "Spectrum (2019-20), p. 448"
  tags: [bpsc]

- slug: smi-23-m02
  difficulty: medium
  stem: |
    Match Gandhi's Quit India instructions with the sections they were meant for:

    | List I (Section) | List II (Instruction) |
    |---|---|
    | P. Government servants | 1. Do not leave, but do not fire on compatriots |
    | Q. Soldiers | 2. Do not resign, but declare allegiance to the Congress |
    | R. Students | 3. Pay mutually agreed rent if the zamindar is anti-government |
    | S. Peasants | 4. If confident, leave studies |
  options: { A: "P-1, Q-2, R-4, S-3", B: "P-2, Q-1, R-4, S-3", C: "P-2, Q-1, R-3, S-4", D: "P-4, Q-1, R-2, S-3", E: "None of the above" }
  answer: B
  explanation: "Government servants were not to resign, soldiers were not to fire on compatriots, students could leave studies if confident, and peasants were to pay agreed rent to anti-government zamindars."
  source: "Spectrum (2019-20), pp. 448-449"
  tags: [bpsc]

- slug: smi-23-m03
  difficulty: medium
  stem: "After the arrests of August 9, 1942, the CWC, AICC and Provincial Congress Committees were declared unlawful associations under the"
  options: { A: "Defence of India Act, 1915", B: "Rowlatt Act, 1919", C: "Criminal Law Amendment Act, 1908", D: "Indian Press Act, 1910" }
  answer: C
  explanation: "They were declared unlawful under the Criminal Law Amendment Act of 1908; public meetings were banned under rule 56 of the Defence of India Rules."
  source: "Spectrum (2019-20), p. 449"
  tags: [ssc]

- slug: smi-23-m04
  difficulty: medium
  stem: |
    Arrange the following parallel governments of the Quit India period in the order in which they were established:

    1. Satara (Prati Sarkar)
    2. Ballia
    3. Tamluk (Jatiya Sarkar)

    Select the correct answer using the code given below.
  options: { A: "2, 3, 1", B: "3, 2, 1", C: "2, 1, 3", D: "1, 2, 3", E: "None of the above" }
  answer: A
  explanation: "Ballia came first (August 1942), then Tamluk (December 1942) and then Satara (mid-1943)."
  source: "Spectrum (2019-20), p. 450"
  tags: [bpsc]

- slug: smi-23-m05
  difficulty: medium
  stem: "According to the book, roughly how many people perished in the famine of 1943?"
  options: { A: "About 10,000", B: "0.5 to 1 million", C: "5 to 6 million", D: "1.5 to 3 million" }
  answer: D
  explanation: "Around 1.5 to 3 million people perished in the basically man-made famine of 1943; about 10,000 is the book's estimate of those killed in the Quit India repression."
  source: "Spectrum (2019-20), p. 453"
  tags: [ssc]

- slug: smi-23-m06
  difficulty: medium
  stem: "The Desai-Liaqat proposal for an interim government at the Centre provided for equal Congress and League nominees and what share of seats reserved for minorities?"
  options: { A: "10%", B: "20%", C: "25%", D: "One-third" }
  answer: B
  explanation: "Bhulabhai Desai and Liaqat Ali Khan proposed equal numbers of Congress and League nominees and 20% reserved seats for minorities."
  source: "Spectrum (2019-20), p. 454"
  tags: [ssc]

- slug: smi-23-m07
  difficulty: medium
  stem: "Hindu leaders who condemned the C. Rajagopalachari (CR) Plan were led by"
  options: { A: "Vir Savarkar", B: "Madan Mohan Malaviya", C: "Bhulabhai Desai", D: "Syama Prasad Mookerjee" }
  answer: A
  explanation: "The book says Hindu leaders led by Vir Savarkar condemned the CR Plan."
  source: "Spectrum (2019-20), p. 454"
  tags: [ssc]

- slug: smi-23-m08
  difficulty: medium
  stem: "At the Shimla Conference (1945), whom did Wavell want as the Muslim representative from Western Punjab, against the League's claim to nominate all Muslim members?"
  options: { A: "Liaqat Ali Khan", B: "Sikandar Hyat Khan", C: "Fazlul Haq", D: "Khizr Hyat Khan", E: "More than one of the above" }
  answer: D
  explanation: "Wavell wanted Khizr Hyat Khan as the Muslim representative from Western Punjab, while the League wanted all Muslim members to be its nominees."
  source: "Spectrum (2019-20), p. 456"
  tags: [bpsc]

- slug: smi-23-m09
  difficulty: medium
  stem: "The 'Freedom Army' (Mukti Sena), formed with Hitler's help from Indian prisoners of war, had its office at"
  options: { A: "Berlin", B: "Dresden", C: "Munich", D: "Rome" }
  answer: B
  explanation: "Dresden, Germany, was made the office of the Freedom Army; Bose gave the slogan 'Jai Hind' from the Free India Centre, Germany."
  source: "Spectrum (2019-20), p. 457"
  tags: [ssc]

- slug: smi-23-m10
  difficulty: medium
  stem: "At the Bangkok conference, the INA was placed under the Indian Independence League. Who was the League's chairman and had founded it in Tokyo in 1942?"
  options: { A: "Mohan Singh", B: "Subhash Chandra Bose", C: "Rashbehari Bose", D: "Shah Nawaz", E: "More than one of the above" }
  answer: C
  explanation: "Rashbehari Bose, who had created the League in Tokyo in 1942, became its chairman, and in July 1943 he handed the League and the INA to Subhash Bose."
  source: "Spectrum (2019-20), p. 459"
  tags: [bpsc]

- slug: smi-23-m11
  difficulty: medium
  stem: "On November 6, 1943, the Andaman and Nicobar islands, handed by the Japanese to the INA, were renamed respectively as"
  options: { A: "Shahid Dweep and Swaraj Dweep", B: "Azad Dweep and Swaraj Dweep", C: "Shahid Dweep and Azad Dweep", D: "Swaraj Dweep and Shahid Dweep" }
  answer: A
  explanation: "The Andaman and Nicobar islands were renamed Shahid Dweep and Swaraj Dweep respectively."
  source: "Spectrum (2019-20), p. 459"
  tags: [ssc]

- slug: smi-23-m12
  difficulty: medium
  stem: |
    Arrange the following events in chronological order:

    1. INA headquarters shifted to Rangoon
    2. Formation of the Provisional Government of Free India at Singapore
    3. INA flag hoisted at Moirang
    4. Azad Hind Fauz crossed the Burma border and stood on Indian soil

    Select the correct answer using the code given below.
  options: { A: "1, 2, 4, 3", B: "2, 4, 1, 3", C: "2, 1, 3, 4", D: "2, 1, 4, 3", E: "None of the above" }
  answer: D
  explanation: "Provisional Government: October 21, 1943; HQ to Rangoon: January 1944; on Indian soil: March 18, 1944; Moirang flag: April 14, 1944."
  source: "Spectrum (2019-20), pp. 459-460"
  tags: [bpsc]

# ---------- HARD ----------
- slug: smi-23-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Gowalia Tank meeting of August 8, 1942:

    1. It demanded an immediate end to British rule in India.
    2. It resolved to form a provisional Government of India after British withdrawal.
    3. Gandhi's special instructions to different sections were spelt out there and formally issued as a Congress circular.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "The meeting demanded an end to British rule and resolved to form a provisional government; Gandhi's special instructions were spelt out but not actually issued."
  source: "Spectrum (2019-20), p. 448"
  tags: [bpsc]

- slug: smi-23-h02
  difficulty: hard
  stem: |
    Consider the following statements about the background to the Quit India Movement:

    1. During the British evacuation of South-East Asia, a 'White Road' was provided for Indian refugees and a 'Black Road' for European refugees.
    2. Boats were commandeered in Bengal and Orissa.
    3. There were fears of a British scorched earth policy in Assam, Bengal and Orissa against a possible Japanese advance.

    Which of the statements given above is/are correct?
  options: { A: "2 and 3 only", B: "1 and 2 only", C: "3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "It was the other way round: the Black Road was for Indian refugees and the White Road exclusively for Europeans. Statements 2 and 3 are from the book."
  source: "Spectrum (2019-20), pp. 447-448"
  tags: [bpsc]

- slug: smi-23-h03
  difficulty: hard
  stem: |
    Consider the following statements about participation in, and repression of, the Quit India Movement:

    1. The Muslim League opposed the movement, fearing that minorities would be oppressed by the Hindus if the British left.
    2. There was a complete absence of anti-zamindar violence by the peasants.
    3. Martial law was applied to crush the movement.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "The League opposed the movement and peasants targeted symbols of authority, not zamindars. The book says martial law was not applied, though repression was severe."
  source: "Spectrum (2019-20), pp. 451-452"
  tags: [bpsc]

- slug: smi-23-h04
  difficulty: hard
  stem: |
    **Assertion (A):** In February 1943, Gandhi started a fast.

    **Reason (R):** The fast was a response to the government's exhortation to him to condemn violence, and was directed against the violence of the State.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "Gandhi's February 1943 fast answered the government's call to condemn violence and was directed against State violence; three members of the viceroy's council resigned."
  source: "Spectrum (2019-20), p. 452"
  tags: [bpsc]

- slug: smi-23-h05
  difficulty: hard
  stem: "Which one of the following is NOT among the 'fundamental causes' of the 1943 famine listed in the book?"
  options: { A: "Diversion of foodstuffs to feed a vast army", B: "Stoppage of rice imports from Burma and South-East Asia", C: "Gross mismanagement, profiteering and belated rationing confined to big cities", D: "Failure of the monsoon across Bengal in 1942" }
  answer: D
  explanation: "The book lists army needs, stopped rice imports from Burma and South-East Asia, and mismanagement with profiteering, calling the famine 'basically man-made'; it does not cite monsoon failure."
  source: "Spectrum (2019-20), p. 453"
  tags: [ssc]

- slug: smi-23-h06
  difficulty: hard
  stem: |
    Consider the following statements about the C. Rajagopalachari formula and the response to it:

    1. It proposed that after the war the entire population of Muslim-majority areas in the North-West and North-East would decide by plebiscite whether to form a separate sovereign state.
    2. Jinnah wanted only the Muslims of those areas to vote in the plebiscite.
    3. Jinnah accepted the idea of a common centre for defence, commerce and communications.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1, 2 and 3", D: "1 and 2 only", E: "None of the above" }
  answer: D
  explanation: "The CR formula proposed a plebiscite of the entire population; Jinnah wanted only Muslims to vote and opposed the idea of a common centre."
  source: "Spectrum (2019-20), pp. 453-454"
  tags: [bpsc]

- slug: smi-23-h07
  difficulty: hard
  stem: |
    Consider the following proposals:

    1. All members of the executive council, except the governor-general and the commander-in-chief, were to be Indians.
    2. Caste Hindus and Muslims were to have equal representation.
    3. The reconstructed council was to be responsible to the Central Assembly.
    4. The governor-general was to exercise his veto on the advice of ministers.

    Which of the above were part of the Wavell Plan (1945)?
  options: { A: "1 and 2 only", B: "1, 2 and 4 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "The council was to work as an interim government within the 1935 Act, so it was not responsible to the Central Assembly; proposals 1, 2 and 4 are from the book."
  source: "Spectrum (2019-20), p. 455"
  tags: [bpsc]

- slug: smi-23-h08
  difficulty: hard
  stem: |
    **Assertion (A):** Wavell's announcement of a breakdown of the Shimla talks strengthened the position of the Muslim League.

    **Reason (R):** The Congress had agreed to be treated as a purely caste Hindu party at the conference.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "By announcing the breakdown Wavell gave the League a virtual veto, so A is true. R is false: the Congress objected to the plan as an attempt to reduce it to a purely caste Hindu party."
  source: "Spectrum (2019-20), p. 456"
  tags: [bpsc]

- slug: smi-23-h09
  difficulty: hard
  stem: "Which one of the following statements about Subhash Bose's early career, as given in the book, is INCORRECT?"
  options: { A: "He secured fourth position in the Indian Civil Services examination.", B: "He resigned from the ICS in 1921 to join the freedom struggle.", C: "His political guru was Chittaranjan Das.", D: "He became mayor of Calcutta in 1930." }
  answer: D
  explanation: "The book says Bose became mayor of Calcutta in 1923; the other three statements are given in the book."
  source: "Spectrum (2019-20), p. 456"
  tags: [ssc]

- slug: smi-23-h10
  difficulty: hard
  stem: |
    Consider the following statements:

    1. The Anti-Compromise Conference at Ramgarh (March 1940) was a joint effort of the Forward Bloc and the Kisan Sabha.
    2. The conference resolved to launch a struggle on April 6, the first day of the National Week.
    3. Bose was arrested when he protested against a proposed monument for Holwell in Calcutta.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1, 2 and 3", D: "2 and 3 only", E: "None of the above" }
  answer: C
  explanation: "All three are stated in the book; after a hunger strike Bose was placed under house arrest in December 1940."
  source: "Spectrum (2019-20), pp. 456-457"
  tags: [bpsc]

- slug: smi-23-h11
  difficulty: hard
  stem: "During the first phase of the INA under Mohan Singh, differences with the Japanese arose because the Japanese wanted only a token force of"
  options: { A: "2,000 men", B: "16,300 men", C: "20,000 men", D: "40,000 men" }
  answer: A
  explanation: "The Japanese wanted a token force of only 2,000, while Mohan Singh wanted a much larger army (the first division of September 1942 had 16,300 men)."
  source: "Spectrum (2019-20), p. 458"
  tags: [ssc]

- slug: smi-23-h12
  difficulty: hard
  stem: |
    Consider the following pairs:

    1. H.C. Chatterjee — Finance portfolio in the Provisional Government of Free India
    2. M.A. Aiyar — Women Department in the Provisional Government of Free India
    3. Shah Nawaz — commanded the INA battalion that took part in the Imphal campaign
    4. Colonel Malik — hoisted the INA flag at Moirang

    Which of the pairs given above is/are correctly matched?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2, 3 and 4", D: "1, 3 and 4 only", E: "None of the above" }
  answer: D
  explanation: "M.A. Aiyar held Broadcasting; the Women Department was under Lakshmi Swaminathan. The other three pairs are correct."
  source: "Spectrum (2019-20), pp. 459-460"
  tags: [bpsc]
