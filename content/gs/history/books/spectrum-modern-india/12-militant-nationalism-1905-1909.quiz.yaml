  tags: [ssc]

- slug: smi-12-h03
  difficulty: hard
  stem: |
    Consider the following statements about the Morley-Minto Reforms (Indian Councils Act 1909):

    1. Separate electorates for Muslims were established for the first time for election to the central council.
    2. The legislatures could vote upon the budget as a whole.
    3. Elected members were to be indirectly elected through an electoral college system.
    4. The income qualification for Muslim voters was kept lower than that for Hindus.

    Which of the statements given above are correct?
  options: { A: "1 and 3 only", B: "2, 3 and 4 only", C: "1, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "Legislatures could vote separate items of the budget, but the budget as a whole could not be voted upon; the other three statements are correct."
  source: "Spectrum (2019-20), pp. 277-278"
  tags: [bpsc]

