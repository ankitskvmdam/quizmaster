# ---------- HARD ----------
- slug: smi-12-h01
  difficulty: hard
  stem: |
    Consider the following statements about the partition of Bengal:

    1. The official reason was that Bengal, with a population of 78 million (about a quarter of British India), had become too big to administer.
    2. Under the plan, Bengal proper was to have 17 million Bengalis and 37 million Hindi and Oriya speakers.
    3. The eastern half was to be a Muslim-majority area with 25 million Muslims out of 31 million.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. The eastern half was to have 18 million Muslims out of a total of 31 million."
  source: "Spectrum (2019-20), pp. 261-262"
  tags: [bpsc]

- slug: smi-12-h02
  difficulty: hard
  stem: "Which of the following was NOT among the laws brought in between 1907 and 1911 to suppress anti-government activity?"
  options: { A: "Seditious Meetings Act", B: "Indian Newspapers (Incitement to Offences) Act", C: "Explosive Substances Act", D: "Vernacular Press Act" }
  answer: D
  explanation: "The Vernacular Press Act dates from 1878 (Lytton); the Seditious Meetings Act (1907), Newspapers Act (1908) and Explosive Substances Act (1908) were among the repressive laws."
