# ---------- HARD ----------
- slug: smi-16-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Khilafat issue:

    1. A Khilafat Committee was formed in early 1919 under the Ali brothers, Maulana Azad, Ajmal Khan and Hasrat Mohani.
    2. Gandhi was the president of the All India Khilafat Committee.
    3. During the First World War, Turkey was allied with Britain against Germany and Austria.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3", E: "None of the above" }
  answer: C
  explanation: "Statements 1 and 2 are correct. Turkey had allied with Germany and Austria against the British."
  source: "Spectrum (2019-20), pp. 329-330"
  tags: [bpsc]

- slug: smi-16-h02
  difficulty: hard
  stem: |
    **Assertion (A):** Talks between Gandhi and Viceroy Reading broke down in May 1921.

    **Reason (R):** The government wanted Gandhi to urge the Ali brothers to remove portions of their speeches which suggested violence.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The talks broke down because of this demand; Gandhi saw it as an attempt to drive a wedge between him and the Khilafat leaders."
  source: "Spectrum (2019-20), p. 336"
  tags: [bpsc]

- slug: smi-16-h03
  difficulty: hard
  stem: |
    With reference to the Nagpur session of the Congress (December 1920), consider the following statements:

    1. The Congress goal was changed from attainment of self-government through constitutional means to attainment of swaraj through peaceful and legitimate means.
    2. A Congress Working Committee of 15 members was set up.
    3. Provincial Congress committees were organised on a linguistic basis.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: D
  explanation: "All three changes in creed and organisation were made at the Nagpur session."
  source: "Spectrum (2019-20), pp. 332-333"
  tags: [bpsc]

- slug: smi-16-h04
  difficulty: hard
  stem: |
    Consider the following statements about the Chauri Chaura incident:

    1. Chauri Chaura was a village in Gorakhpur district of the United Provinces.
    2. The police fired on a crowd protesting before the police station, and the crowd torched the station.
    3. Twenty-two policemen were killed in the violence.
    4. The Congress Working Committee then met at Bardoli and resolved to launch mass civil disobedience.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: B
  explanation: "Statements 1-3 are correct. The CWC at Bardoli (February 1922) resolved to stop law-breaking and take up constructive work."
  source: "Spectrum (2019-20), pp. 336-337"
  tags: [bpsc]

- slug: smi-16-h05
  difficulty: hard
  stem: |
    **Assertion (A):** The Congress came to support a non-cooperation programme on the Khilafat question.

    **Reason (R):** Tilak strongly favoured an alliance with Muslim leaders over the Khilafat issue and was a firm believer in satyagraha.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: C
  explanation: "The Congress did support it, but Tilak opposed an alliance over a religious issue and was sceptical of satyagraha."
  source: "Spectrum (2019-20), pp. 330-331"
  tags: [bpsc]

- slug: smi-16-h06
  difficulty: hard
  stem: |
    Consider the following statements about the people's response to the Non-Cooperation Movement:

    1. In Calcutta, Bombay and Madras, centres of elite politicians, the response to Gandhi's call was very limited.
    2. A section of big business remained sceptical, fearing labour unrest in their factories.
    3. In Bihar, the confrontation between lower and upper castes over the former taking the sacred thread merged with the movement.
    4. The call for resignation from government service and surrender of titles was taken very seriously by the middle classes.

    Which of the statements given above are correct?
  options: { A: "1 and 3 only", B: "2 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "Statements 1-3 are in the book. The book says the call for resignation from service and surrender of titles was not taken seriously."
  source: "Spectrum (2019-20), pp. 334-335"
  tags: [bpsc]

- slug: smi-16-h07
  difficulty: hard
  stem: |
    Consider the following pairs (place — event during 1920-22):

    1. Midnapore — no-tax movement against union board taxes
    2. Guntur — no-tax movement against union board taxes
    3. Bardoli — place from where Gandhi threatened to launch civil disobedience
    4. Allahabad — all-party conference that asked Gandhi to lead the boycott programme

    Which of the pairs given above are correctly matched?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: D
  explanation: "All four pairs match the book: no-tax campaigns in Midnapore and Guntur, Gandhi's Bardoli ultimatum (Feb 1, 1922) and the Allahabad conference (June 1920)."
  source: "Spectrum (2019-20), pp. 331, 334, 336"
  tags: [bpsc]

- slug: smi-16-h08
  difficulty: hard
  stem: |
    Consider the following statements:

    1. In December 1921, the government declared volunteer corps illegal and arrested most leaders barring Gandhi.
    2. The Ahmedabad session of 1921 appointed C.R. Das the sole authority on the issue of civil disobedience.
    3. During the movement, Congress volunteer corps emerged as a parallel police.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 3 are correct. The Ahmedabad session appointed Gandhi, not C.R. Das, the sole authority."
  source: "Spectrum (2019-20), pp. 334, 336"
  tags: [bpsc]

- slug: smi-16-h09
  difficulty: hard
  stem: |
    Consider the following statements regarding the evaluation of the Khilafat-Non-Cooperation Movement in the book:

    1. It brought the urban Muslims into the national movement but also communalised national politics to an extent.
    2. The myth that colonial rule was invincible had been exploded by the economic critique of the Moderates.
    3. The caliphate was abolished in 1924.

    Which of the statements given above is/are correct?
  options: { A: "1 and 3 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "Statements 1 and 3 are correct. The Moderates' critique exploded the myth that British rule was in Indians' interest; satyagraha challenged the myth of invincibility."
  source: "Spectrum (2019-20), pp. 338-339"
  tags: [bpsc]

