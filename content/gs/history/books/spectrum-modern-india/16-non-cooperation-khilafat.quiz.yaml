  answer: A
  explanation: "Jinnah, Annie Besant, G.S. Kharpade and B.C. Pal left the Congress; C.R. Das had reservations on council boycott but bowed to Congress discipline."
  source: "Spectrum (2019-20), pp. 332-333"
  tags: [ssc]

