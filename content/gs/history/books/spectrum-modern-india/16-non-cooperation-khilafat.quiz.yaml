# ---------- MEDIUM ----------
- slug: smi-16-m01
  difficulty: medium
  stem: |
    Arrange the following events in chronological order:

    1. Special session of the Congress at Calcutta approving non-cooperation
    2. Signing of the Treaty of Sevres
    3. All-party conference at Allahabad approving boycott of schools, colleges and law courts
    4. Formal launch of non-cooperation by the Khilafat Committee

    Select the correct answer using the code given below:
  options: { A: "2-3-1-4", B: "3-2-4-1", C: "2-4-3-1", D: "2-3-4-1", E: "None of the above" }
  answer: D
  explanation: "Treaty of Sevres (May 1920), Allahabad conference (June 1920), Khilafat Committee launch (August 31, 1920), Calcutta special session (September 1920)."
  source: "Spectrum (2019-20), pp. 331-332"
  tags: [bpsc]

- slug: smi-16-m02
  difficulty: medium
  stem: "Who acted as president of the Ahmedabad session of the Congress (1921) because the president was in jail?"
  options: { A: "Hakim Ajmal Khan", B: "Motilal Nehru", C: "Maulana Azad", D: "Mohammad Ali" }
  answer: A
  explanation: "The Ahmedabad session was presided over by C.R. Das while still in jail; Hakim Ajmal Khan was the acting president."
  source: "Spectrum (2019-20), p. 336"
  tags: [ssc]

- slug: smi-16-m03
  difficulty: medium
  stem: |
    Match List I with List II:

    | List I | List II |
    |---|---|
    | a. J.M. Sengupta | 1. Called the Khilafat movement retrograde and reactionary |
    | b. Mustafa Kamal Pasha | 2. Prominent leader of strikes in Assam |
    | c. Professor Ravinder Kumar | 3. Wrote of Gandhi's bid to convince Tilak of satyagraha |
    | d. Dr. Koenraad Elst | 4. Deprived the sultan of Turkey of political power |
  options: { A: "a-2, b-3, c-4, d-1", B: "a-2, b-4, c-3, d-1", C: "a-3, b-4, c-2, d-1", D: "a-1, b-4, c-3, d-2", E: "None of the above" }
  answer: B
  explanation: "Sengupta led the Assam strikes; Kamal Pasha stripped the sultan of power (Nov 1922); Ravinder Kumar described Gandhi's bid to convince Tilak; Elst called the Khilafat movement retrograde."
  source: "Spectrum (2019-20), pp. 330, 334, 338"
  tags: [bpsc]

- slug: smi-16-m04
  difficulty: medium
  stem: "Which of the following leaders did NOT leave the Congress at the time it adopted the non-cooperation programme?"
