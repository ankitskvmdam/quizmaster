  answer: C
  explanation: "The book states the Peshwa Daftar is housed in the Alienation Office, Pune."
  source: "Spectrum (2019-20), p. 4"
  tags: [ssc]

- slug: smi-01-e05
  difficulty: easy
  stem: "Who wrote the novel 'Anandamath' (1882)?"
