# Chapter 1 — Sources for the History of Modern India (book pp. 1-12)
# ---------- EASY ----------
- slug: smi-01-e01
  difficulty: easy
  stem: "Who was appointed the first Surveyor General of Bengal in 1767?"
  options: { A: "Alexander Burnes", B: "James Rennell", C: "William Moorcroft", D: "George Forster" }
  answer: B
  explanation: "James Rennell became the first Surveyor General of Bengal in 1767, after which the Survey of India began scientific mapping."
  source: "Spectrum (2019-20), p. 3"
  tags: [ssc]

- slug: smi-01-e02
  difficulty: easy
  stem: "Where is the National Archives of India located?"
  options: { A: "Kolkata", B: "Mumbai", C: "Pune", D: "New Delhi" }
  answer: D
  explanation: "The National Archives of India, which holds most Government of India archives, is in New Delhi."
  source: "Spectrum (2019-20), p. 2"
  tags: [ssc]

- slug: smi-01-e03
  difficulty: easy
  stem: "What was the name of the first newspaper published in India by James Augustus Hickey in 1780?"
  options: { A: "The Bengal Gazette or Calcutta General Advertiser", B: "The Calcutta Gazette", C: "The Madras Courier", D: "The Bombay Herald" }
  answer: A
  explanation: "Hickey published The Bengal Gazette or Calcutta General Advertiser in 1780, the first newspaper in India."
  source: "Spectrum (2019-20), p. 8"
  tags: [ssc]

- slug: smi-01-e04
  difficulty: easy
  stem: "The Peshwa Daftar, the most valuable single source for Maratha history, is housed in"
