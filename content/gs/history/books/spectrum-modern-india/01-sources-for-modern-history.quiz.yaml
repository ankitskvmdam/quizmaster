  tags: [ssc]

- slug: smi-01-e08
  difficulty: easy
  stem: "Shyamji Krishnavarma published 'Indian Sociologist' from"
  options: { A: "Paris", B: "London", C: "Berlin", D: "San Francisco" }
  answer: B
