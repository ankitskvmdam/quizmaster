  source: "Spectrum (2019-20), p. 609"
  tags: [bpsc]

- slug: smi-34-m07
  difficulty: medium
  stem: |
    Arrange the following in chronological order:

    1. Setting up of the Butler Committee
    2. Charter Act ending the Company's commercial functions
    3. Setting up of the Chamber of Princes
    4. Board of Directors' guidelines to annex states wherever possible
  options: { A: "2, 4, 1, 3", B: "4, 2, 3, 1", C: "2, 4, 3, 1", D: "2, 3, 4, 1", E: "None of the above" }
  answer: C
  explanation: "Charter Act (1833), annexation guidelines (1834), Chamber of Princes (Montford Reforms, 1921), Butler Committee (1927)."
  source: "Spectrum (2019-20), pp. 604, 606"
  tags: [bpsc]

- slug: smi-34-m08
  difficulty: medium
  stem: "Under the Government of India Act, 1935, how many seats in the Federal Assembly were proposed for the princes?"
  options: { A: "104 out of 160", B: "125 out of 375", C: "160 out of 375", D: "104 out of 375" }
  answer: B
  explanation: "The 1935 Act proposed 125 of 375 Federal Assembly seats for the princes; 104 of 160 was their share in the Council of States."
  source: "Spectrum (2019-20), p. 607"
  tags: [ssc]

- slug: smi-34-m09
  difficulty: medium
  stem: "Curzon's approach towards the princely states is described in the book as a policy of"
  options: { A: "ring fence", B: "subordinate isolation", C: "patronage and 'intrusive surveillance'", D: "cordial cooperation" }
  answer: C
  explanation: "Curzon adopted a policy of patronage and 'intrusive surveillance'; cordial cooperation was the post-1905 policy."
  source: "Spectrum (2019-20), p. 606"
  tags: [ssc]

- slug: smi-34-m10
  difficulty: medium
  stem: "During the integration of the states, the Gujarat states were incorporated into"
  options: { A: "Bombay", B: "Central Provinces", C: "Rajasthan", D: "Orissa" }
  answer: A
