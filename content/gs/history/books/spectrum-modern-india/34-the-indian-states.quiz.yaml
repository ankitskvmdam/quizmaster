  source: "Spectrum (2019-20), p. 609"
  tags: [ssc]

# ---------- HARD ----------
- slug: smi-34-h01
  difficulty: hard
  stem: |
    Consider the following statements about the policy of subordinate isolation (1813-1857):

    1. The states surrendered all forms of external sovereignty but retained sovereignty in internal administration.
    2. British Residents were transformed from diplomatic agents into executive and controlling officers of a superior government.
    3. The Charter Act of 1833 ended both the commercial and the political functions of the Company.

    Which of the statements given above is/are correct?
  options: { A: "1 and 2 only", B: "1 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: A
  explanation: "The Charter Act of 1833 ended the Company's commercial functions but it retained its political functions. Statements 1 and 2 are correct."
  source: "Spectrum (2019-20), p. 604"
  tags: [bpsc]

- slug: smi-34-h02
  difficulty: hard
  stem: |
    Consider the following statements about the policy of subordinate union (1857-1935):

    1. The policy of annexation was abandoned because of the states' loyalty during the 1857 revolt.
    2. The new policy was to punish or depose rulers, but not to annex states.
    3. A ruler inherited the gaddi as a matter of right.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "After 1858 the ruler inherited the gaddi not as a matter of right but as a gift from the paramount power. Statements 1 and 2 are correct."
  source: "Spectrum (2019-20), p. 605"
  tags: [bpsc]

- slug: smi-34-h03
  difficulty: hard
  stem: |
    Consider the following statements about the Butler Committee (1927):

    1. It was set up to examine the nature of the relationship between the princely states and the government.
    2. It recommended that paramountcy must remain supreme.
    3. It recommended that states should not be handed over to an Indian government responsible to an Indian legislature without their consent.
    4. It gave a precise legal definition of paramountcy.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "2, 3 and 4 only", C: "1, 2 and 3 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: C
  explanation: "The book says 'paramountcy' was left undefined, to feed on usage, the Crown's prerogative and the princes' implied consent."
  source: "Spectrum (2019-20), p. 606"
  tags: [bpsc]

- slug: smi-34-h04
  difficulty: hard
  stem: |
    Consider the following statements about the federal scheme of the Government of India Act, 1935:

    1. It proposed 104 out of 160 seats in the Council of States for the princes.
    2. The federation required ratification by states representing more than half of the population and entitled to more than half of the seats in the Council of States.
    3. The scheme was dropped altogether after the failure of the Cripps Mission in 1942.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1, 2 and 3", D: "1 and 2 only", E: "None of the above" }
  answer: D
  explanation: "The scheme never came into existence and was dropped after the outbreak of World War II in September 1939. Statements 1 and 2 are correct."
  source: "Spectrum (2019-20), p. 607"
  tags: [bpsc]

- slug: smi-34-h05
  difficulty: hard
  stem: |
    **Assertion (A):** Sardar Patel asked the rulers to join the Indian dominion in matters of defence, communication and external affairs.

    **Reason (R):** These three areas had been part of the paramountcy of the Crown, and the states had no control over them anyway.
  options: { A: "Both A and R are true, and R is the correct explanation of A", B: "Both A and R are true, but R is not the correct explanation of A", C: "A is true, but R is false", D: "A is false, but R is true" }
  answer: A
  explanation: "The book says Patel chose these three areas because they had been part of the Crown's paramountcy and the states had no control over them."
  source: "Spectrum (2019-20), p. 607"
  tags: [bpsc]

- slug: smi-34-h06
  difficulty: hard
  stem: |
    Consider the following statements about Jammu and Kashmir:

    1. The state had a Hindu prince and a Muslim majority population.
    2. The Instrument of Accession was endorsed by the popular leader Sheikh Abdullah.
    3. The ceasefire left 84,000 square km of area under Pakistani occupation.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "1, 2 and 3", D: "2 and 3 only", E: "None of the above" }
  answer: C
  explanation: "All three statements are given in the book's account of Kashmir's accession."
  source: "Spectrum (2019-20), p. 608"
  tags: [bpsc]

- slug: smi-34-h07
  difficulty: hard
  stem: "How many states were made centrally administered and listed in Part-C, for strategic or special reasons?"
  options: { A: "216", B: "61", C: "109", D: "127" }
  answer: B
  explanation: "61 states, such as Himachal Pradesh, Vindhya Pradesh, Manipur, Tripura and Bhopal, were listed in Part-C; 216 smaller states were merged into provinces."
