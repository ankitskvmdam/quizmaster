- slug: smi-34-h08
  difficulty: hard
  stem: |
    Consider the following statements about the policy of ring fence (1765-1813):

    1. It was reflected in Warren Hastings' wars against the Marathas and Mysore.
    2. It aimed at creating buffer zones to defend the Company's frontiers.
    3. The Company undertook to organise Awadh's defence to safeguard Bengal's security.
    4. Hyderabad, Awadh and the Marathas accepted the subsidiary alliance.

    Which of the statements given above are correct?
  options: { A: "1 and 2 only", B: "1, 2 and 3 only", C: "2, 3 and 4 only", D: "1, 2, 3 and 4", E: "None of the above" }
  answer: D
  explanation: "All four statements are made in the book's account of the ring fence policy and its extension, the subsidiary alliance."
  source: "Spectrum (2019-20), p. 604"
  tags: [bpsc]

