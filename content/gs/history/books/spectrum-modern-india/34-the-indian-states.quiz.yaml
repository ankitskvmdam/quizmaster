# ---------- MEDIUM ----------
- slug: smi-34-m01
  difficulty: medium
  stem: |
    Match List I (British policy towards the Indian states) with List II (period):

    | List I | List II |
    |---|---|
    | a. Ring fence | 1. 1857-1935 |
    | b. Subordinate isolation | 2. 1935-1947 |
    | c. Subordinate union | 3. 1765-1813 |
    | d. Equal federation | 4. 1813-1857 |
  options: { A: "a-3, b-4, c-1, d-2", B: "a-4, b-3, c-1, d-2", C: "a-3, b-1, c-4, d-2", D: "a-3, b-4, c-2, d-1", E: "None of the above" }
  answer: A
  explanation: "Ring fence 1765-1813, subordinate isolation 1813-1857, subordinate union 1857-1935, equal federation 1935-1947."
  source: "Spectrum (2019-20), pp. 604-605, 607"
  tags: [bpsc]

- slug: smi-34-m02
  difficulty: medium
  stem: "The policy of annexation culminated in the usurpation by Dalhousie of how many states, including Satara and Nagpur?"
  options: { A: "Five", B: "Six", C: "Eight", D: "Ten" }
  answer: C
  explanation: "The annexation policy culminated in Dalhousie's usurpation of eight states, including big ones like Satara and Nagpur."
  source: "Spectrum (2019-20), p. 604"
  tags: [ssc]

- slug: smi-34-m03
  difficulty: medium
  stem: "For the purpose of the Chamber of Princes, how many states were directly represented?"
  options: { A: "127", B: "109", C: "136", D: "61" }
  answer: B
  explanation: "109 states were directly represented and 127 through representatives; the rest were recognised as feudal holdings or jagirs."
  source: "Spectrum (2019-20), p. 606"
  tags: [ssc]

- slug: smi-34-m04
  difficulty: medium
  stem: "By August 15, 1947, how many princely states had joined the Indian Union?"
  options: { A: "109", B: "216", C: "562", D: "136" }
  answer: D
  explanation: "By August 15, 1947, 136 states had joined the Indian Union, while others remained outside."
  source: "Spectrum (2019-20), p. 607"
  tags: [ssc]

- slug: smi-34-m05
  difficulty: medium
  stem: "Hyderabad signed a Standstill Agreement with India in ____ and finally acceded in ____."
  options: { A: "November 1947; November 1949", B: "October 1947; September 1948", C: "November 1947; January 1950", D: "August 1947; November 1949" }
  answer: A
  explanation: "Hyderabad signed the Standstill Agreement in November 1947 and, after the 1948 'police action', acceded in November 1949."
  source: "Spectrum (2019-20), p. 608"
  tags: [ssc]

- slug: smi-34-m06
  difficulty: medium
  stem: "Which of the following was NOT one of the five unions of states created during integration?"
  options: { A: "United States of Kathiawar", B: "United States of Matsya", C: "Patiala and East Punjab States Union", D: "Vindhya Pradesh", E: "More than one of the above" }
  answer: D
