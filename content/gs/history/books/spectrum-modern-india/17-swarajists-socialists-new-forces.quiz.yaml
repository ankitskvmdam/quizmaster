# ---------- HARD ----------
- slug: smi-17-h01
  difficulty: hard
  stem: |
    Consider the following statements about the Swarajist manifesto of October 1923:

    1. It took a strong anti-imperialist line, saying the reforms were only a blind to further British interests.
    2. It said that if the demand for self-government was rejected, the Swarajists would adopt uniform, continuous and consistent obstruction.
    3. It proposed using the councils as organs for the gradual transformation of colonial rule.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 2 only", C: "2 and 3 only", D: "1, 2 and 3", E: "None of the above" }
  answer: B
  explanation: "Statements 1 and 2 are correct. The book says the Swarajists had no intention of using the councils for gradual transformation of colonial rule."
  source: "Spectrum (2019-20), pp. 341-342"
  tags: [bpsc]

