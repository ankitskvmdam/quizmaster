# Section 8 — Peasant, Labour and States' People's Movements
# ---------- Previous-year questions ----------
- slug: fs-pls-01
  difficulty: medium
  stem: "During the freedom struggle, a parallel movement launched in the Indian States (in the States ruled by the Indian rulers such as Kashmir, Nizam’s Hyderabad, Travancore, etc.) was"
  options: { A: "State People’s Movement", B: "Praja Mandal Movement", C: "Swaraj Movement", D: "More than one of the above", E: "None of the above" }
  answer: B
  explanation: "The people of the princely states organised themselves in Praja Mandals, so the movement there is called the Praja Mandal Movement."
  source: "BPSC 68th Prelims"

- slug: fs-pls-02
  difficulty: medium
  stem: "“A Sanyasi who came to that district after a spell as an indentured labourer in Fiji, carrying a copy of Tulsidas *Ramayana* on his back from which he would recite verses to rural audience.” The peasant leader referred to here is"
  options: { A: "Jhinguri Singh", B: "Yadunandan Sharma", C: "Baba Ram Chandra", D: "More than one of the above", E: "None of the above" }
  answer: C
  explanation: "Baba Ramchandra, once an indentured labourer in Fiji, led the peasants of Awadh and recited the Ramayana of Tulsidas to village audiences."
  source: "BPSC 68th Prelims"

- slug: fs-pls-03
  difficulty: hard
  stem: "Who led cultivators in Bihar during the Non-Cooperation Movement?"
  options: { A: "Swami Vidyanand", B: "Raj Kumar Shukla", C: "Shri Krishna Singh", D: "More than one of the above", E: "None of the above" }
  answer: A
  explanation: "Swami Vidyanand led the cultivators of north Bihar against the Darbhanga Raj in 1919–20, around the time of the Non-Cooperation Movement."
  source: "BPSC 68th Prelims"

- slug: fs-pls-04
  difficulty: easy
  stem: "Who among the following leaders led the Bardoli Satyagraha?"
  options: { A: "Lala Lajpat Rai", B: "Motilal Nehru", C: "C Rajagopalachari", D: "Vallabhbhai Patel" }
  answer: D
  explanation: "Vallabhbhai Patel led the Bardoli Satyagraha of 1928, and the women of Bardoli gave him the title 'Sardar'."
  source: "SSC CGL 2023"

- slug: fs-pls-05
  difficulty: easy
  stem: "Who among the following formed the Bihar Provincial Kisan Sabha in 1929?"
  options: { A: "Jayprakash Narayan", B: "JM Sengupta", C: "Kunwar Singh", D: "Swami Sahajanand Saraswati" }
  answer: D
  explanation: "Swami Sahajanand Saraswati formed the Bihar Provincial Kisan Sabha in 1929."
  source: "SSC CGL 2024"

- slug: fs-pls-06
  difficulty: easy
  stem: "In which of the following years was the Congress Socialist Party (CSP) founded?"
  options: { A: "1934", B: "1914", C: "1943", D: "1924" }
  answer: A
  explanation: "The Congress Socialist Party was founded in 1934 by Jayaprakash Narayan, Acharya Narendra Dev and others."
  source: "SSC CGL 2019"

# ---------- New questions ----------
- slug: fs-pls-07
  difficulty: easy
  stem: "Who was the first president of the All India Trade Union Congress (AITUC)?"
  options: { A: "N.M. Joshi", B: "Lala Lajpat Rai", C: "Dewan Chaman Lal", D: "Jawaharlal Nehru" }
  answer: B
  explanation: "Lala Lajpat Rai was the first president of the AITUC; Dewan Chaman Lal was its first general secretary."

- slug: fs-pls-08
  difficulty: easy
  stem: "Who was the first president of the All India Kisan Sabha, founded at Lucknow in 1936?"
  options: { A: "N.G. Ranga", B: "Baba Ramchandra", C: "Swami Sahajanand Saraswati", D: "Acharya Narendra Dev" }
  answer: C
  explanation: "Swami Sahajanand Saraswati was the first president of the All India Kisan Sabha (1936); N.G. Ranga was its first general secretary."

- slug: fs-pls-09
  difficulty: easy
  stem: "In which year was the All India Trade Union Congress (AITUC) founded?"
  options: { A: "1920", B: "1918", C: "1926", D: "1929" }
  answer: A
  explanation: "The AITUC was founded at Bombay on 31 October 1920."

- slug: fs-pls-10
  difficulty: easy
  stem: "Who gave Vallabhbhai Patel the title 'Sardar'?"
  options: { A: "Mahatma Gandhi", B: "The women of Bardoli", C: "The Congress Working Committee", D: "The peasants of Kheda" }
  answer: B
  explanation: "The women of Bardoli gave Patel the title 'Sardar' during the Bardoli Satyagraha of 1928."

- slug: fs-pls-11
  difficulty: medium
  stem: "Who led the Eka Movement of 1921–22 in Hardoi, Bahraich and Sitapur?"
  options: { A: "Baba Ramchandra", B: "Gauri Shankar Mishra", C: "Vijay Singh Pathik", D: "Madari Pasi" }
  answer: D
  explanation: "Madari Pasi led the Eka Movement of 1921–22 in these districts of U.P."

- slug: fs-pls-12
  difficulty: medium
  stem: "In the Tebhaga Movement of Bengal, what share of the crop did the sharecroppers demand?"
  options: { A: "One-half", B: "One-third", C: "Two-thirds", D: "Three-fourths" }
  answer: C
  explanation: "The sharecroppers (bargadars) demanded two-thirds of the crop instead of the half they were getting."

- slug: fs-pls-13
  difficulty: medium
  stem: "Who founded the Madras Labour Union in 1918?"
  options: { A: "B.P. Wadia", B: "N.M. Lokhande", C: "N.M. Joshi", D: "S.A. Dange" }
  answer: A
  explanation: "B.P. Wadia founded the Madras Labour Union in 1918; it is regarded as the first modern trade union in India."

- slug: fs-pls-14
  difficulty: medium
  stem: "In which year was the All India States' People's Conference founded?"
  options: { A: "1920", B: "1927", C: "1934", D: "1939" }
  answer: B
  explanation: "The All India States' People's Conference was founded at Bombay in 1927 to bring together the Praja Mandals of the princely states."

- slug: fs-pls-15
  difficulty: medium
  stem: "Who was elected president of the All India States' People's Conference at its Ludhiana session in 1939?"
  options: { A: "Vallabhbhai Patel", B: "Balwantrai Mehta", C: "Sheikh Abdullah", D: "Jawaharlal Nehru" }
  answer: D
  explanation: "Jawaharlal Nehru was elected president of the All India States' People's Conference at Ludhiana in 1939."

- slug: fs-pls-16
  difficulty: hard
  stem: "Who founded the Bombay Mill Hands' Association in 1890?"
  options: { A: "B.P. Wadia", B: "Dewan Chaman Lal", C: "N.M. Lokhande", D: "N.M. Joshi" }
  answer: C
  explanation: "N.M. Lokhande founded the Bombay Mill Hands' Association in 1890; it is regarded as the first labour association in India."

- slug: fs-pls-17
  difficulty: hard
  stem: "The Englishmen Philip Spratt and Ben Bradley were tried along with Indian trade union leaders in the"
  options: { A: "Kanpur Bolshevik Conspiracy Case", B: "Meerut Conspiracy Case", C: "Lahore Conspiracy Case", D: "Alipore Conspiracy Case" }
  answer: B
  explanation: "Philip Spratt and Ben Bradley were arrested with S.A. Dange, Muzaffar Ahmad and others in the Meerut Conspiracy Case of 1929."

- slug: fs-pls-18
  difficulty: hard
  stem: "In 1939 Gandhi went on a fast in connection with the people's movement in which princely state?"
  options: { A: "Rajkot", B: "Travancore", C: "Hyderabad", D: "Mewar" }
  answer: A
  explanation: "Gandhi fasted at Rajkot in 1939 during the Rajkot Satyagraha, which Vallabhbhai Patel guided."

- slug: fs-pls-19
  difficulty: hard
  stem: |
    Match List I with List II:

    List I (Movement)

    a. Bijolia Movement
    b. Eka Movement
    c. Barahiya Tal struggle
    d. Awadh peasant movement

    List II (Leader)

    1. Karyanand Sharma
    2. Baba Ramchandra
    3. Vijay Singh Pathik
    4. Madari Pasi

    Select the correct answer using the code given below.
  options: { A: "a-3, b-2, c-1, d-4", B: "a-4, b-3, c-2, d-1", C: "a-1, b-4, c-3, d-2", D: "a-3, b-4, c-1, d-2" }
  answer: D
  explanation: "Vijay Singh Pathik led the Bijolia Movement, Madari Pasi the Eka Movement, Karyanand Sharma the Barahiya Tal struggle and Baba Ramchandra the Awadh peasant movement."

- slug: fs-pls-20
  difficulty: hard
  stem: |
    Consider the following statements:

    1. Swami Sahajanand Saraswati formed the Bihar Provincial Kisan Sabha in 1929.
    2. The All India Kisan Sabha was founded at Lucknow in 1936.
    3. N.G. Ranga was the first president of the All India Kisan Sabha.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "2 and 3 only", C: "1 and 2 only", D: "1, 2 and 3" }
  answer: C
  explanation: "Statements 1 and 2 are correct. The first president of the All India Kisan Sabha was Swami Sahajanand Saraswati; N.G. Ranga was its first general secretary."
