# Section 3 — Revolutionary Movement
# ---------- Previous-year questions ----------
- slug: fs-rev-01
  difficulty: easy
  stem: "In which year did the Kakori conspiracy case take place?"
  options: { A: "1925", B: "1924", C: "1926", D: "1927" }
  answer: A
  explanation: "The Kakori train robbery by the Hindustan Republican Association took place on 9 August 1925."
  source: "SSC CGL 2016"

- slug: fs-rev-02
  difficulty: easy
  stem: "Who among the following conceived the Kakori train robbery in 1925?"
  options: { A: "Baikuntha Shukla", B: "Manmath Nath Gupta and Matangini Hazra", C: "Ram Prasad Bismil and Ashfaqullah Khan", D: "Ubaidullah Sindhi" }
  answer: C
  explanation: "The Kakori train robbery was planned by Ram Prasad Bismil and Ashfaqulla Khan of the Hindustan Republican Association."
  source: "SSC CGL 2019"

- slug: fs-rev-03
  difficulty: easy
  stem: "Who among the following was one of the founders of the Hindustan Republic Association?"
  options: { A: "Ram Prasad Bismil", B: "Lala Lajpat Rai", C: "Jatindranath Mukherjee", D: "Surya Sen" }
  answer: A
  explanation: "The Hindustan Republican Association was founded in 1924 at Kanpur by Ram Prasad Bismil, Sachindranath Sanyal and Jogesh Chandra Chatterjee."
  source: "SSC CGL 2020"

- slug: fs-rev-04
  difficulty: easy
  stem: "At which of the following jails was Khudiram Bose sent to the gallows?"
  options: { A: "Chittagong", B: "Barishal", C: "Muzaffarpur", D: "Alipore" }
  answer: C
  explanation: "Khudiram Bose was hanged in Muzaffarpur jail on 11 August 1908 for the Muzaffarpur bomb attack."
  source: "SSC CGL 2021"

- slug: fs-rev-05
  difficulty: hard
  stem: "Who among the following persons was associated with the Chittagong Armoury Raid?"
  options: { A: "Vishnu Sharan Dublish", B: "Sachindranath Bakshi", C: "Manmath Nath Gupta", D: "Ardhendu Dastidar" }
  answer: D
  explanation: "Ardhendu Dastidar was one of Surya Sen's associates in the Chittagong Armoury Raid of 1930; the other three are linked with the Kakori case."
  source: "SSC CGL 2021"

- slug: fs-rev-06
  difficulty: medium
  stem: "In which year was India House established by Shyamji Verma?"
  options: { A: "1905", B: "1899", C: "1902", D: "1909" }
  answer: A
  explanation: "Shyamji Krishna Varma founded India House in London in 1905."
  source: "SSC CGL 2022"

- slug: fs-rev-07
  difficulty: easy
  stem: "Which of the following groups/parties was started in San Francisco, United States of America during the Indian National Movement?"
  options: { A: "Khilafat Committee", B: "Ghadar Party", C: "Swaraj Party", D: "Hindustan Socialist Republican Association" }
  answer: B
  explanation: "The Ghadar Party was founded at San Francisco in 1913, with the Yugantar Ashram as its headquarters."
  source: "SSC CGL 2024"

- slug: fs-rev-08
  difficulty: hard
  stem: "Who is the author of the popular song, *Sarfaroshi Ki Tamanna Ab Hamare Dil Mein Hai* ?"
  options: { A: "Surya Sen", B: "Chandra Shekhar Azad", C: "Sardar Bhagat Singh", D: "Ram Prasad Bismil", E: "None of the above/More than one of the above" }
  answer: E
  explanation: "The song was written by Bismil Azimabadi of Patna. Ram Prasad Bismil made it famous but did not write it, so none of the four names is correct."
  source: "BPSC 66th Prelims"

- slug: fs-rev-09
  difficulty: medium
  stem: "Where did Madam Cama unfurl India's tricolour flag of freedom?"
  options: { A: "Paris", B: "London", C: "Stuttgart", D: "Geneva", E: "None of the above/More than one of the above" }
  answer: C
  explanation: "Madam Bhikaji Cama unfurled an Indian flag at the International Socialist Congress at Stuttgart in 1907."
  source: "BPSC 66th Prelims"

- slug: fs-rev-10
  difficulty: easy
  stem: "Where was the Ghadar Party established?"
  options: { A: "Germany", B: "United States of America", C: "France", D: "England", E: "None of the above/More than one of the above" }
  answer: B
  explanation: "The Ghadar Party was founded in 1913 at San Francisco in the United States of America."
  source: "BPSC 67th Prelims (cancelled sitting)"

- slug: fs-rev-11
  difficulty: easy
  stem: "Who is related to ‘Chittagong Armoury Raid’?"
  options: { A: "Rash Behari Bose", B: "Chandra Shekhar Azad", C: "Batukeshwar Dutt", D: "Surya Sen", E: "None of the above/More than one of the above" }
  answer: D
  explanation: "Surya Sen ('Master Da') led the Chittagong Armoury Raid of 18 April 1930."
  source: "BPSC 67th Prelims (cancelled sitting)"

- slug: fs-rev-12
  difficulty: hard
  stem: |
    Match the List – I with List – II and choose the correct answer :

    | List – I (Organization) | List – II (Headquarter) |
    |---|---|
    | I. Swadeshi Sevak Home | a. Vancouver |
    | II. United India House | b. Seattle |
    | III. Yugantar Ashram | c. San Francisco |
    | IV. INA or Azad Hind Fauj | d. Rangoon |
  options: { A: "I – d, II – c, III – b, IV – a", B: "I – d, II – c, III – a, IV – b", C: "I – a, II – b, III – c, IV – d", D: "I – c, II – d, III – a, IV – b" }
  answer: C
  explanation: "Swadesh Sevak Home was at Vancouver, United India House at Seattle, the Yugantar Ashram (Ghadar headquarters) at San Francisco, and the INA headquarters at Rangoon."
  source: "BPSC 70th Prelims"

- slug: fs-rev-13
  difficulty: medium
  stem: "At which Viceroy was a bomb thrown on the occasion of his state entry into Delhi?"
  options: { A: "Lord Curzon", B: "Lord Minto", C: "Lord Hardinge", D: "Lord Wavell" }
  answer: C
  explanation: "A bomb was thrown at Lord Hardinge at Chandni Chowk on 23 December 1912 during his state entry into Delhi."
  source: "BPSC 71st Prelims"

- slug: fs-rev-14
  difficulty: hard
  stem: "Who got an opportunity to become Professor of Indian Philosophy in the University of California in 1911?"
  options: { A: "Sohan Singh Bhakna", B: "Virendranath Chattopadhyay", C: "Har Dayal", D: "Shyamji Krishna Varma" }
  answer: C
  explanation: "Lala Har Dayal came to California in 1911 and taught Indian philosophy there before he organised the Ghadar movement."
  source: "BPSC 71st Prelims"

# ---------- New questions ----------
- slug: fs-rev-15
  difficulty: medium
  stem: "Who threw bombs in the Central Legislative Assembly along with Bhagat Singh on 8 April 1929?"
  options: { A: "Sukhdev", B: "Batukeshwar Dutt", C: "Rajguru", D: "Jatin Das" }
  answer: B
  explanation: "Bhagat Singh and Batukeshwar Dutt threw the bombs in protest against the Public Safety Bill and the Trade Disputes Bill."

- slug: fs-rev-16
  difficulty: medium
  stem: "Bhagat Singh, Sukhdev and Rajguru were hanged on"
  options: { A: "27 February 1931", B: "17 December 1928", C: "8 April 1929", D: "23 March 1931" }
  answer: D
  explanation: "The three were hanged at Lahore on 23 March 1931 in the Lahore Conspiracy Case."

- slug: fs-rev-17
  difficulty: medium
  stem: "Who shot Michael O'Dwyer in London in 1940?"
  options: { A: "Udham Singh", B: "Madan Lal Dhingra", C: "Kartar Singh Sarabha", D: "Shyamji Krishna Varma" }
  answer: A
  explanation: "Udham Singh shot O'Dwyer, Lieutenant-Governor of Punjab at the time of Jallianwala Bagh, at Caxton Hall in 1940. Madan Lal Dhingra had shot Curzon Wyllie in 1909."

- slug: fs-rev-18
  difficulty: medium
  stem: "Where was the Hindustan Republican Association renamed the Hindustan Socialist Republican Association in 1928?"
  options: { A: "Kanpur", B: "Feroz Shah Kotla, Delhi", C: "Lahore", D: "Kakori" }
  answer: B
  explanation: "At a meeting at Feroz Shah Kotla, Delhi, in 1928 the HRA became the HSRA under Chandrashekhar Azad."

- slug: fs-rev-19
  difficulty: hard
  stem: |
    Arrange the following in chronological order:

    1. Kakori train robbery
    2. Bomb thrown at Lord Hardinge in Delhi
    3. Chittagong Armoury Raid
    4. Muzaffarpur bomb case
  options: { A: "2, 4, 1, 3", B: "4, 1, 2, 3", C: "4, 2, 3, 1", D: "4, 2, 1, 3" }
  answer: D
  explanation: "Muzaffarpur bomb case (1908), bomb at Hardinge (1912), Kakori (1925), Chittagong Armoury Raid (1930)."

- slug: fs-rev-20
  difficulty: hard
  stem: "Which revolutionary from Bihar was hanged in Gaya jail in 1934 for shooting the approver Phanindranath Ghosh?"
  options: { A: "Baikuntha Shukla", B: "Khudiram Bose", C: "Rajendra Lahiri", D: "Prafulla Chaki" }
  answer: A
  explanation: "Baikuntha Shukla shot Phanindranath Ghosh, whose evidence had helped to hang Bhagat Singh, and was hanged in Gaya jail in 1934."

- slug: fs-rev-21
  difficulty: medium
  stem: "Who defended Aurobindo Ghosh in the Alipore Conspiracy Case?"
  options: { A: "Motilal Nehru", B: "Chittaranjan Das", C: "Bhulabhai Desai", D: "Tej Bahadur Sapru" }
  answer: B
  explanation: "Chittaranjan Das defended Aurobindo Ghosh in the Alipore Conspiracy Case (1908), and Aurobindo was acquitted."

- slug: fs-rev-22
  difficulty: hard
  stem: |
    Consider the following statements about the Muzaffarpur bomb case (1908):

    1. The bomb was meant for the judge Kingsford.
    2. Prafulla Chaki shot himself to avoid arrest.
    3. Khudiram Bose was hanged in Muzaffarpur jail.

    Which of the statements given above is/are correct?
  options: { A: "1 only", B: "1 and 3 only", C: "2 and 3 only", D: "1, 2 and 3" }
  answer: D
  explanation: "All three are correct: Khudiram Bose and Prafulla Chaki targeted Kingsford; Chaki shot himself and Khudiram was hanged at Muzaffarpur on 11 August 1908."
