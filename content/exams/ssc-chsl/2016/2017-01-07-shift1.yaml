  - slug: chsl-2017-01-07-s1-q021
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, 'N' can be represented by 21, 67 etc. and 'R' can be represented by 66, 57 etc. Similarly, you have to identify the set for the word 'HUNT'.

      **Matrix-I**

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | T | R | A | N | B |
      | 1 | W | U | N | H | U |
      | 2 | E | N | S | G | U |
      | 3 | N | Y | P | U | M |
      | 4 | H | T | U | F | A |

      **Matrix-II**

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | T | A | R | I | H |
      | 6 | X | R | N | W | B |
      | 7 | C | S | Y | E | U |
      | 8 | S | N | T | M | S |
      | 9 | G | B | E | R | H |

      *(Figure: Question printed as an image: instructions plus two 5×5 letter matrices (Matrix-I rows/columns 0–4, Matrix-II rows/columns 5–9), transcribed as tables in the stem.)*
    options:
      A: 40, 33, 03, 88
      B: 99, 23, 56, 00
      C: 59, 42, 12, 79
      D: 13, 11, 30, 41
    answer: D
    explanation: As per SSC's official answer.
    tags:
      - reasoning
