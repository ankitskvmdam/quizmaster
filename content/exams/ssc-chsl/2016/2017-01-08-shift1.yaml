  - slug: chsl-2017-01-08-s1-q021
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, 'F' can be represented by 32, 42 etc., and 'M' can be represented by 88, 68 etc. Similarly, you have to identify the set for the word 'DOWN'.

      **Matrix-I**

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | I | N | U | H | E |
      | 1 | U | I | N | L | L |
      | 2 | W | G | I | N | E |
      | 3 | W | W | F | I | U |
      | 4 | W | W | F | N | E |

      **Matrix-II**

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | I | D | D | R | O |
      | 6 | O | I | I | M | D |
      | 7 | O | D | G | I | O |
      | 8 | D | M | T | M | I |
      | 9 | D | D | D | M | D |

      *(Figure: Question printed as an image: instructions plus two 5×5 letter matrices (Matrix-I rows/columns 0–4, Matrix-II rows/columns 5–9), transcribed as tables in the stem.)*
    options:
      A: 76, 59, 21, 33
      B: 95, 79, 40, 43
      C: 99, 57, 30, 42
      D: 69, 65, 20, 85
    answer: B
    explanation: As per SSC's official answer.
    tags:
      - reasoning
