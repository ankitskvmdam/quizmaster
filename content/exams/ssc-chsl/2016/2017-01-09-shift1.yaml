  - slug: chsl-2017-01-09-s1-q021
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, 'N' can be represented by 21, 67 etc. and 'R' can be represented by 66, 57 etc. Similarly, you have to identify the set for the word 'GRAIN'.

      **Matrix-I**

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | Q | O | A | N | K |
      | 1 | W | I | N | H | L |
      | 2 | E | N | S | G | O |
      | 3 | N | Y | D | O | M |
      | 4 | R | T | O | F | A |

      **Matrix-II**

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | Z | M | R | S | Q |
      | 6 | X | R | N | W | A |
      | 7 | C | S | Y | E | N |
      | 8 | S | N | T | E | S |
      | 9 | V | B | E | R | G |

      *(Figure: Question printed as an image: instructions plus two 5×5 letter matrices (Matrix-I rows/columns 0–4, Matrix-II rows/columns 5–9), transcribed as tables in the stem.)*
    options:
      A: 99, 33, 76, 88, 76
      B: 23, 24, 76, 75, 89
      C: 23, 66, 69, 11, 21
      D: 99, 20, 89, 11, 44
    answer: C
    explanation: As per SSC's official answer.
    tags:
      - reasoning
