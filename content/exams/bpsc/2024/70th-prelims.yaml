slug: 70th-prelims
title: BPSC 70th Prelims
date: 2024-12-13
label: Series E
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q58, Q101, Q114, Q117."
questions:
  - slug: bpsc-70-q001
    difficulty: medium
    stem: Which of the following is an iron ore ?
    options:
      A: Bauxite
      B: Cinnabar
      C: Pyrite
      D: Limonite
    answer: D
    explanation: Limonite (hydrated iron oxide) is an iron ore; bauxite is aluminium ore, cinnabar is mercury ore and pyrite (FeS2) is mined for sulphur, not iron.
  - slug: bpsc-70-q002
    difficulty: medium
    stem: Which type of rock is formed from cooling and solidification of lava ?
    options:
      A: Sedimentary
      B: Igneous
      C: Metamorphic
      D: Crystal
    answer: B
    explanation: Igneous rocks form when magma or lava cools and solidifies.
  - slug: bpsc-70-q003
    difficulty: medium
    stem: What is the object of “cut motion” in Parliament ?
    options:
      A: To restrict day-to-day financial expenditure of the government
      B: To move a proposal to reduce expenditure in the budget proposals
      C: To restrict the grants of the Government
      D: To restrict grants from consolidated fund of India
    answer: B
    explanation: A cut motion is moved in the Lok Sabha to reduce the amount of a demand for grant in the budget.
  - slug: bpsc-70-q004
    difficulty: medium
    stem: When did Britishers shifted the capital to Delhi ?
    options:
      A: "1912"
      B: "1913"
      C: "1911"
      D: More than one of the above
    answer: A
    explanation: The transfer of the capital from Calcutta to Delhi was announced at the Delhi Durbar on 12 December 1911 and took effect in 1912; the key takes 1912 as the year of the actual shift.
  - slug: bpsc-70-q005
    difficulty: medium
    stem: What is the position of representation of Anglo-Indian Community in Lok Sabha ?
    options:
      A: Two anglo-Indians are nominated by the President
      B: Nomination of them has been done away with by 104th Constitutional Amendment
      C: One anglo-Indian is nominated by the President
      D: They are nominated as per their population
    answer: B
    explanation: The 104th Constitutional Amendment Act, 2019 ended the nomination of two Anglo-Indian members to the Lok Sabha (Art. 331) from January 2020.
  - slug: bpsc-70-q006
    difficulty: medium
    stem: Where was the 13th Ministerial Conference of World Trade Organization (WTO) held in February 2024 ?
    options:
      A: Abu Dhabi
      B: Argentina
      C: Switzerland
      D: Indonesia
    answer: A
    explanation: The WTO's 13th Ministerial Conference (MC13) was held in Abu Dhabi, UAE, in February-March 2024.
  - slug: bpsc-70-q007
    difficulty: medium
    stem: Who won the Men Singles title at the French Open Tennis Tournament 2024 ?
    options:
      A: Alexander Zverev
      B: Novak Djokovic
      C: Carlos Alcaraz
      D: Daniil Medvedev
    answer: C
    explanation: Carlos Alcaraz beat Alexander Zverev in the 2024 French Open men's singles final.
  - slug: bpsc-70-q008
    difficulty: medium
    stem: What is the eligibility age, after the changes made in March 2024, for senior citizens to vote by postal ballot ?
    options:
      A: 80 years
      B: 85 years
      C: 90 years
      D: 82 years
    answer: B
    explanation: The March 2024 amendment to the Conduct of Election Rules raised the age for the absentee-voter postal ballot option for senior citizens from 80 to 85 years.
  - slug: bpsc-70-q009
    difficulty: medium
    stem: In the Union Budget speech for 2024-25, which oilseeds were noted as **not** being covered under the goal of ‘Atmanirbharta’ (self-reliance) for oil ?
    options:
      A: Coconut
      B: Sesame
      C: Groundnut
      D: Soybean
    answer: A
    explanation: The 2024-25 Budget speech named mustard, groundnut, sesame, soybean and sunflower for oilseed 'atmanirbharta'; coconut was not among them.
  - slug: bpsc-70-q010
    difficulty: medium
    stem: Which of the following pairs will give displacement reactions ?
    options:
      A: NaCl solution and copper metal
      B: AgNO₃ solution and copper metal
      C: MgCl₂ solution and aluminium metal
      D: FeSO₄ solution and silver metal
    answer: B
    explanation: Copper is more reactive than silver, so it displaces silver from AgNO3 solution; the other pairs have the less reactive metal.
  - slug: bpsc-70-q011
    difficulty: medium
    stem: Bihula Festival is celebrated especially in which one of the following districts in Bihar usually in the month of August each year ?
    options:
      A: Patna
      B: Bhagalpur
      C: Darbhanga
      D: Sitamarhi
    answer: B
    explanation: Bihula (Bishahari) puja, linked to the Bihula-Bishahari folk tale, is celebrated mainly in Bhagalpur (Anga region) in August.
  - slug: bpsc-70-q012
    difficulty: medium
    stem: Heat transfer that does **not** require a medium is called
    options:
      A: Reflection
      B: Radiation
      C: Convection
      D: Conduction
    answer: B
    explanation: Radiation transfers heat by electromagnetic waves and needs no medium.
  - slug: bpsc-70-q013
    difficulty: medium
    stem: Which of the following acid is secreted in the stomach ?
    options:
      A: Nitric acid
      B: Sulphuric acid
      C: Hydrochloric acid
      D: Phosphoric acid
    answer: C
    explanation: The gastric glands secrete hydrochloric acid in the stomach.
  - slug: bpsc-70-q014
    difficulty: medium
    stem: Ramkrishna Mission was founded by
    options:
      A: Vidyasagar in 1899
      B: Swami Vivekanand in 1899
      C: Swami Vivekanand in 1897
      D: More than one of the above
    answer: C
    explanation: Swami Vivekananda founded the Ramakrishna Mission on 1 May 1897.
  - slug: bpsc-70-q015
    difficulty: medium
    stem: In which city of Bihar the recently inaugurated National Dolphin Research Centre is located ?
    options:
      A: Patna
      B: Darbhanga
      C: Gaya
      D: Munger
    answer: A
    explanation: The National Dolphin Research Centre, India's first, was inaugurated in Patna in 2024 on the Patna University campus by the Ganga.
  - slug: bpsc-70-q016
    difficulty: medium
    stem: Which Article of the Constitution restrict a Member of Parliament to hold the office of profit ?
    options:
      A: Article 102 (1) (b)
      B: Article 102 (1) (c)
      C: Article 102 (1) (a)
      D: Article 102 (1) (d)
    answer: C
    explanation: Art. 102(1)(a) disqualifies a member who holds an office of profit under the Government of India or a state government.
  - slug: bpsc-70-q017
    difficulty: medium
    stem: Which country became the first to bring soil from the dark side of the moon in June 2024 ?
    options:
      A: China
      B: USA
      C: India
      D: France
    answer: A
    explanation: China's Chang'e-6 returned the first samples from the far side of the Moon in June 2024.
  - slug: bpsc-70-q018
    difficulty: medium
    stem: |-
      Following are the mountain ranges of India

      1. Garo Hills
      2. Nandadevi
      3. Kamet
      4. K²

      Which of the following is their correct sequence from east to west ?
    options:
      A: 4 3 1 2
      B: 3 4 2 1
      C: 1 2 3 4
      D: 2 1 4 3
    answer: C
    explanation: "From east to west: Garo Hills (Meghalaya), Nanda Devi (~80.0 E), Kamet (~79.6 E), K2 (~76.5 E), i.e. 1 2 3 4."
  - slug: bpsc-70-q019
    difficulty: medium
    stem: Among the following who has been Speaker of Lok Sabha prior to his Election as President of India ?
    options:
      A: V. V. Giri
      B: Giani Zail Singh
      C: A. P. J. Abdul Kalam
      D: Neelam Sanjeeva Reddy
    answer: D
    explanation: Neelam Sanjiva Reddy was Lok Sabha Speaker (1967-69, 1977) before becoming President in 1977.
  - slug: bpsc-70-q020
    difficulty: medium
    stem: Who gave the slogan “DO OR DIE” and when ?
    options:
      A: Subhash Chandra Bose during Quit India Movement
      B: Jawahar Lal Nehru during Non-cooperation Movement
      C: Gandhiji during Quit India Movement
      D: More than one of the above
    answer: C
    explanation: Gandhiji gave the call 'Do or Die' in his Quit India speech at Gowalia Tank, Bombay, on 8 August 1942.
  - slug: bpsc-70-q021
    difficulty: medium
    stem: When was the undersea cable-based Chennai-Andaman and Nicobar (CANI) Project inaugurated and dedicated to the nation by Prime Minister Shri Narendra Modi ?
    options:
      A: August 10, 2019
      B: August 15, 2022
      C: August 10, 2020
      D: January 26, 2023
    answer: C
    explanation: PM Modi inaugurated the Chennai-Andaman & Nicobar submarine optical fibre cable on 10 August 2020.
  - slug: bpsc-70-q022
    difficulty: medium
    stem: Who wrote “New Lamps For The Old” ?
    options:
      A: Surendranath
      B: Aurobindo Ghosh
      C: Motilal Ghosh
      D: More than one of the above
    answer: B
    explanation: Aurobindo Ghosh wrote the series 'New Lamps for Old' in Indu Prakash (1893-94), criticising the moderate Congress.
  - slug: bpsc-70-q023
    difficulty: medium
    stem: In which Lok Sabha seat, one of India’s Particularly Vulnerable Tribal Groups (PVTGs), Shompen tribe, for the first time exercised their democratic right to vote in April 2024 ?
    options:
      A: Vizianagram, Andhra Pradesh
      B: Tripura East
      C: Andaman and Nicobar
      D: Tura
    answer: C
    explanation: The Shompen of Great Nicobar voted for the first time in the Andaman and Nicobar Islands Lok Sabha seat in April 2024.
  - slug: bpsc-70-q024
    difficulty: medium
    stem: After remaining neutral for almost 200 years, which one of the following countries officially joined the NATO in March 2024 ?
    options:
      A: North Macedonia
      B: Sweden
      C: Finland
      D: Iceland
    answer: B
    explanation: Sweden, neutral since the Napoleonic era, became NATO's 32nd member on 7 March 2024 (Finland joined in 2023).
  - slug: bpsc-70-q025
    difficulty: medium
    stem: The meter that is used to measure the distance moved by the vehicle is known as
    options:
      A: Speedometer
      B: Ammeter
      C: Odometer
      D: Chronometer
    answer: C
    explanation: An odometer records the distance travelled by a vehicle; a speedometer shows speed.
  - slug: bpsc-70-q026
    difficulty: medium
    stem: When did Muslim League observed “Direct Action Day” ?
    options:
      A: 14 August 1946
      B: 15 August 1947
      C: 16 August 1946
      D: More than one of the above
    answer: C
    explanation: The Muslim League observed Direct Action Day on 16 August 1946, leading to the Calcutta killings.
  - slug: bpsc-70-q027
    difficulty: medium
    stem: What is the position of India in manufacturing of mobile phones in 2023 ?
    options:
      A: 2nd
      B: 10th
      C: 4th
      D: 15th
    answer: A
    explanation: India became the world's second-largest mobile phone manufacturer, after China.
  - slug: bpsc-70-q028
    difficulty: medium
    stem: Which two words have been incorporated in the Preamble by 42nd Amendment ?
    options:
      A: Republic and secular
      B: Democratic and socialist
      C: Secular and socialist
      D: Socialist and sovereign
    answer: C
    explanation: The 42nd Amendment (1976) added 'Socialist', 'Secular' and 'Integrity' to the Preamble.
  - slug: bpsc-70-q029
    difficulty: medium
    stem: Who was the first one to propose a model for the structure of an atom ?
    options:
      A: Rutherford
      B: E. Goldstein
      C: J. J. Thomson
      D: Neils Bohr
    answer: C
    explanation: J. J. Thomson proposed the first atomic model (the 'plum pudding' model, 1904), before Rutherford and Bohr.
  - slug: bpsc-70-q030
    difficulty: medium
    stem: According to the Index of Industrial Production (IIP) data from the Ministry of Statistics and Programme Implementation, which indices experienced significant growth in Financial Year 2023 ?
    options:
      A: Consumer goods and capital goods
      B: Consumer goods and infrastructure/construction goods
      C: Capital goods and infrastructure/construction goods
      D: Manufacturing and consumer goods
    answer: C
    explanation: IIP data for FY2023 showed the strongest growth in capital goods and infrastructure/construction goods, driven by public capex.
  - slug: bpsc-70-q031
    difficulty: medium
    stem: Size of Council of Ministers has been restricted to 15 percent of membership of Lok Sabha by which Constitutional Amendment ?
    options:
      A: 95th Amendment
      B: 92nd Amendment
      C: 93rd Amendment
      D: 91st Amendment
    answer: D
    explanation: The 91st Amendment (2003) capped the Council of Ministers at 15% of the Lok Sabha's strength (Art. 75(1A)).
  - slug: bpsc-70-q032
    difficulty: medium
    stem: In April 2024, how many members of the UN Security Council either rejected or abstained from voting for the proposal to allow Palestine to become a full member of the UN ?
    options:
      A: "2"
      B: "6"
      C: "5"
      D: "3"
    answer: D
    explanation: On 18 April 2024 the resolution got 12 votes; the USA vetoed and the UK and Switzerland abstained, 3 members in all.
  - slug: bpsc-70-q033
    difficulty: medium
    stem: Which one of the following is about Ruchira Kamboj, who was the first woman to become the Indian Ambassador to the United Nations who retired recently, is true ?
    options:
      A: She was a member of Indian Council of World Affairs
      B: She was a member of the NITI Ayog
      C: She was the first woman Indian Ambassador to USA
      D: She held the position of Permanent Representative of India to UNESCO-Paris
    answer: D
    explanation: Ruchira Kamboj was India's Ambassador and Permanent Representative to UNESCO, Paris (2014-17) before becoming PR to the UN in New York (2022-24).
  - slug: bpsc-70-q034
    difficulty: medium
    stem: |-
      Dalton’s atomic theory successfully explained

      i. Law of conservation of mass.
      ii. Law of constant composition.
      iii. Law of radioactivity.
      iv. Law of multiple proportion.
    options:
      A: i, ii and iii
      B: ii, iii and iv
      C: i, iii and iv
      D: i, ii and iv
    answer: D
    explanation: Dalton's theory explained the laws of conservation of mass, constant (definite) proportions and multiple proportions; radioactivity came later.
  - slug: bpsc-70-q035
    difficulty: medium
    stem: |-
      Consider the following about the King “Praversena” :

      a. He was the real founder of Vakataka dynasty.
      b. His empire extended from Bundelkhand in north to Hyderabad in South.
      c. He succeeded his father king Vindhyshakti.
      d. He is mentioned in Puranas.

      Which of the following statements are correct ?
    options:
      A: a and b both
      B: a and c both
      C: b, c and d
      D: More than one of the above
    answer: D
    explanation: Pravarasena I, son of Vindhyashakti, was the real founder of the Vakataka empire, ruled a wide area of central India and the Deccan and is named in the Puranas; more than one statement is correct.
  - slug: bpsc-70-q036
    difficulty: medium
    stem: Under Article “243J” which of the following can make provisions to the maintenance of accounts by Panchayats ?
    options:
      A: State Legislature
      B: Parliament
      C: State Finance Commission
      D: District Collector
    answer: A
    explanation: Under Art. 243J the state legislature may by law provide for the maintenance and audit of panchayat accounts.
  - slug: bpsc-70-q037
    difficulty: medium
    stem: Which of the following is full form of PCRA ?
    options:
      A: Public Conservations Research Association
      B: Partial Counting of Remaining Amendment
      C: Public Council of Research Association
      D: Petroleum Conservation Research Association
    answer: D
    explanation: PCRA stands for Petroleum Conservation Research Association, under the Ministry of Petroleum and Natural Gas.
  - slug: bpsc-70-q038
    difficulty: medium
    stem: Who decides the disqualification of members of State Legislative Assembly, for matters other than those in the tenth schedule of the Constitution ?
    options:
      A: Speaker Legislative Assembly
      B: Governor
      C: High Court
      D: State Election Commission
    answer: B
    explanation: Under Art. 192 the Governor decides such disqualification questions, acting on the opinion of the Election Commission.
  - slug: bpsc-70-q039
    difficulty: medium
    stem: Which of the following bacterial disease that is called as spleenic fever ?
    options:
      A: Typhoid
      B: Anthrax
      C: Cholera
      D: None of the above
    answer: B
    explanation: Anthrax, caused by Bacillus anthracis, is also called splenic fever.
  - slug: bpsc-70-q040
    difficulty: medium
    stem: Which one of the following rivers is different from the others ?
    options:
      A: Narmada
      B: Tungabhadra
      C: Mahanadi
      D: Penganga
    answer: A
    explanation: The Narmada flows west into the Arabian Sea; the Tungabhadra, Mahanadi and Penganga belong to east-flowing systems.
  - slug: bpsc-70-q041
    difficulty: medium
    stem: Which of the following is a cause of rural to urban migration in India ?
    options:
      A: High labour demand in cities
      B: Unbalanced rural-urban development
      C: Few jobs in rural areas
      D: All the above
    answer: D
    explanation: Rural-urban migration is driven by city labour demand, uneven development and scarce rural jobs, so all apply.
  - slug: bpsc-70-q042
    difficulty: medium
    stem: Who was the founder of the Farazi Movement ?
    options:
      A: Haji Shariatullah
      B: Sayyid Ahmad
      C: Dudhu Mian
      D: More than one of the above
    answer: A
    explanation: Haji Shariatullah founded the Faraizi movement in Bengal in 1818; his son Dudu Miyan later led it.
  - slug: bpsc-70-q043
    difficulty: medium
    stem: To highlight the hardships faced by the peasants, Sahajanand Saraswati published which newspaper ?
    options:
      A: The Broken Wing
      B: Lok Sangraha
      C: Nirbal Sevak
      D: Indian Nation
    answer: B
    explanation: Swami Sahajanand Saraswati brought out 'Lok Sangraha' to voice peasant grievances; 'The Broken Wing' is Sarojini Naidu's poetry.
  - slug: bpsc-70-q044
    difficulty: medium
    stem: Choose the group of letters which is different from others.
    options:
      A: PSVX
      B: ORUX
      C: JMPS
      D: CFIL
    answer: A
    explanation: ORUX, JMPS and CFIL each step +3 letters; PSVX goes +3, +3, +2, so it is the odd one.
  - slug: bpsc-70-q045
    difficulty: medium
    stem: According to a CRISIL Rating report, how much is the corporate bond market expected to grow by Financial Year 2030 in India ?
    options:
      A: ₹ 50-70 lakh crore
      B: ₹ 100-120 lakh crore
      C: ₹ 70-90 lakh crore
      D: ₹ 120-150 lakh crore
    answer: B
    explanation: CRISIL Ratings projected India's corporate bond market to grow to about Rs 100-120 lakh crore by FY2030.
  - slug: bpsc-70-q046
    difficulty: medium
    stem: |-
      Match the following and choose the correct answer.

      | Political Organisation | Founder |
      |---|---|
      | I. Khaksars | a. Subhash Chandra Bose |
      | II. Socialist Party | b. Inayatullah Mashriqui |
      | III. Independent Labour Party | c. Jayaprakash Narayan |
      | IV. Forward Bloc | d. B. R. Ambedkar |
    options:
      A: I – b, II – c, III – d, IV – a
      B: I – b, II – d, III – a, IV – c
      C: I – d, II – c, III – b, IV – a
      D: I – c, II – d, III – a, IV – b
    answer: A
    explanation: Khaksars - Inayatullah Mashriqui; Congress Socialist Party - Jayaprakash Narayan; Independent Labour Party - B. R. Ambedkar; Forward Bloc - Subhas Chandra Bose.
  - slug: bpsc-70-q047
    difficulty: medium
    stem: Shreyasi Singh, Member of the Legislative Assembly, who has represented India in shooting in Paris Olympics 2024 was elected from which constituency in Bihar ?
    options:
      A: Gidhaur
      B: Sugauli
      C: Kesaria
      D: Jamui
    answer: D
    explanation: Shreyasi Singh is the BJP MLA from Jamui and competed in trap shooting at Paris 2024.
  - slug: bpsc-70-q048
    difficulty: medium
    stem: Before his appointment as a judge of the Supreme Court of India in July 2024, Justice N. Kotiswar Singh was the Chief Justice of which High Court ?
    options:
      A: Madras High Court
      B: Jammu and Kashmir and Ladakh High Court
      C: Gauhati High Court
      D: Bombay High Court
    answer: B
    explanation: Justice N. Kotiswar Singh was Chief Justice of the Jammu & Kashmir and Ladakh High Court before his elevation in July 2024.
  - slug: bpsc-70-q049
    difficulty: medium
    stem: Which of the following districts of Bihar has the highest percentage of Scheduled Tribe population in 2011 census ?
    options:
      A: Jamui
      B: Katihar
      C: Banka
      D: Purnia
    answer: B
    explanation: As per Census 2011, Katihar has the highest share of Scheduled Tribe population among Bihar's districts (about 5.9%).
  - slug: bpsc-70-q050
    difficulty: medium
    stem: |-
      Which of the following are exothermic processes ?

      i. Evaporation of water.
      ii. Dilution of an acid (H₂SO₄).
      iii. Reaction of water with quick lime.
      iv. Sublimation of camphor (crystals).
    options:
      A: ii and iii
      B: iii and iv
      C: i and ii
      D: i and iv
    answer: A
    explanation: Diluting H2SO4 and slaking quicklime (CaO + H2O) release heat; evaporation and sublimation absorb heat.
  - slug: bpsc-70-q051
    difficulty: medium
    stem: |-
      Match List – I with List – II :

      | List – I | List – II |
      |---|---|
      | a. Vaishali | 1. Silk Textile |
      | b. Bhagalpur | 2. Gold |
      | c. Jamui | 3. Rail coach factory |
      | d. Madhepura | 4. Flori culture |

      Select the correct answer using the codes given below.

      a b c d
    options:
      A: 3 4 1 2
      B: 2 3 4 1
      C: 1 2 3 4
      D: 4 1 2 3
    answer: D
    explanation: "Vaishali - floriculture, Bhagalpur - silk textiles, Jamui - gold (Karmatia/Sono block), Madhepura - rail (electric locomotive) factory: 4 1 2 3."
  - slug: bpsc-70-q052
    difficulty: medium
    stem: Motorcycle is related to battery in the same way as Life is related to
    options:
      A: Earth
      B: Moon
      C: Sun
      D: Star
    answer: C
    explanation: A motorcycle depends on its battery for energy as life on Earth depends on the Sun.
  - slug: bpsc-70-q053
    difficulty: medium
    stem: By which time Governor has to return an ordinary bill to the concerned State Legislature for reconsideration ?
    options:
      A: One month
      B: Three months
      C: Two months
      D: No time limit
    answer: D
    explanation: Art. 200 sets no time limit for the Governor to return a non-money bill for reconsideration.
  - slug: bpsc-70-q054
    difficulty: medium
    stem: Which of the following ruler ruled Assam in the time of Harsha ?
    options:
      A: Aswad Jahan
      B: Bhaskar Varman
      C: King Dahir
      D: More than one of the above
    answer: B
    explanation: Bhaskaravarman of the Varman dynasty ruled Kamarupa (Assam) and was Harsha's ally.
  - slug: bpsc-70-q055
    difficulty: medium
    stem: Who headed the Royal Commission on Indian currency appointed in 1913 ?
    options:
      A: J. M. Keynes
      B: James Wilson
      C: Sir W. R. Mansfield
      D: Sir Austin Chamberlain
    answer: D
    explanation: The Royal Commission on Indian Finance and Currency (1913) was chaired by Austen Chamberlain; J. M. Keynes was a member.
  - slug: bpsc-70-q056
    difficulty: medium
    stem: Which of the following cities is located along the side of river Seine ?
    options:
      A: Belgrade
      B: Paris
      C: Budapest
      D: Lisbon
    answer: B
    explanation: Paris stands on the Seine; Belgrade and Budapest are on the Danube and Lisbon on the Tagus.
  - slug: bpsc-70-q057
    difficulty: medium
    stem: In which one of the following Freestyle weight categories, Aman Sehrawat became the first Indian male wrestler to qualify for the 2024 Paris Olympics at the World Wrestling Olympic Qualifiers, Turkiye in May 2024 ?
    options:
      A: 65 kg
      B: 86 kg
      C: 57 kg
      D: 74 kg
    answer: C
    explanation: Aman Sehrawat qualified in the 57 kg freestyle at the Istanbul qualifier in May 2024 and won bronze at Paris.
  - slug: bpsc-70-q059
    difficulty: medium
    stem: Who was the President of the Indian National Congress at Patna Session held in 1912 ?
    options:
      A: Sir S. P. Sinha
      B: Saiyed Mohammad Bahadur
      C: R. N. Madhulkar
      D: Saiyed Hassan Imam
    answer: C
    explanation: R. N. Mudholkar presided over the 27th INC session at Bankipore, Patna, in December 1912.
  - slug: bpsc-70-q060
    difficulty: medium
    stem: Gaurav walks 20 metres towards North. He then turns left and walks 40 metres. He again turns left and walks 20 metres. Further, he moves 20 metres after turning to the right. How far is he from his original position ?
    options:
      A: 20 metres
      B: 40 metres
      C: 30 metres
      D: 60 metres
    answer: D
    explanation: N 20 m, left (W) 40 m, left (S) 20 m puts him 40 m west of the start; a right turn (W) and 20 m more gives 60 m.
  - slug: bpsc-70-q061
    difficulty: medium
