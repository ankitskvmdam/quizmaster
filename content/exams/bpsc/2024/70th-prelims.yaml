    stem: |-
      What should come in place of question mark (?) in the following ?

      *(Figure: Three X-shaped figures, each made of two crossing ovals with a number in each of the four outer ends (top-left, top-right, bottom-left, bottom-right) and one in the centre. Figure 1: top-left 16, top-right 21, bottom-left 15, bottom-right 10, centre 36. Figure 2: top-left 7, top-right 10, bottom-left 13, bottom-right 10, centre 16. Figure 3: top-left 15, top-right ?, bottom-left 21, bottom-right 14, centre 64.)*
    options:
      A: "18"
      B: "22"
      C: "20"
      D: "36"
    answer: B
    explanation: In the first two figures the two left numbers add up to the two right numbers (16+15 = 21+10, 7+13 = 10+10), so 15+21 = ?+14 gives 22.
