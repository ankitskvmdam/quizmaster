slug: 69th-prelims
title: BPSC 69th Prelims
date: 2023-09-30
label: Series A
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q33, Q60, Q122."
questions:
  - slug: bpsc-69-q001
    difficulty: medium
    stem: |-
      Which of the following technologies will be enabled by the 5G mobile communication networks?

      1. Internet of Things
      2. Edge Computing
      3. Network Slicing

      Select the correct answer using the codes given below.
    options:
      A: Only 1 and 2
      B: Only 2 and 3
      C: Only 1 and 3
      D: 1, 2 and 3
    answer: D
    explanation: 5G's low latency and high capacity enable IoT, edge computing and network slicing, so all three are correct.
  - slug: bpsc-69-q002
    difficulty: medium
    stem: |-
      Match List–I with List–II :

      | List—I (Space Mission) | List—II (Exploration) |
      |---|---|
      | a. Cassini-Huygens | 1. Jupiter |
      | b. Juno | 2. Saturn and its rings |
      | c. Artemis | 3. Venus |
      | d. VERITAS | 4. Human Spaceflight—Moon to Mars |

      Select the correct answer using the codes given below.
    options:
      A: a-2, b-1, c-4, d-3
      B: a-3, b-1, c-4, d-2
      C: a-2, b-3, c-4, d-1
      D: a-3, b-1, c-2, d-4
    answer: A
    explanation: Cassini-Huygens studied Saturn, Juno studies Jupiter, Artemis is NASA's Moon-to-Mars human programme, VERITAS is a Venus mission.
  - slug: bpsc-69-q003
    difficulty: medium
    stem: |-
      Match List–I with List–II :

      | List—I (Cloth) | List—II (Origin) |
      |---|---|
      | a. Linen | 1. Coconut plant |
      | b. Coir | 2. Flax plant |
      | c. Mohair | 3. Feathers of duck and geese |
      | d. Down | 4. Angora goat |

      Select the correct answer using the codes given below.
    options:
      A: a-1, b-3, c-2, d-4
      B: a-4, b-3, c-1, d-2
      C: a-2, b-1, c-4, d-3
      D: a-4, b-1, c-3, d-2
    answer: C
    explanation: Linen comes from flax, coir from coconut husk, mohair from the Angora goat, and down from duck and goose feathers.
  - slug: bpsc-69-q004
    difficulty: medium
    stem: |-
      Consider the following statements :

      1. Taeniasis is an intestinal infection caused by three species of tapeworm—Taenia solium, Taenia saginata and Taenia asiatica.
      2. When cysts develop in the brain, the condition is referred to as neurocysticercosis (NCC).

      Which of the above statements is/are correct?
    options:
      A: Only 1
      B: Only 2
      C: Both 1 and 2
      D: None of the above
    answer: C
    explanation: Taeniasis is caused by T. solium, T. saginata and T. asiatica (WHO); larval cysts in the brain cause neurocysticercosis. Both are correct.
  - slug: bpsc-69-q005
    difficulty: medium
    stem: |-
      Which of the following are computer languages?

      1. Cobra
      2. Python
      3. Squirrel
      4. Java

      Select the correct answer using the codes given below.
    options:
      A: Only 1 and 2
      B: Only 3 and 4
      C: Only 1, 2 and 3
      D: All of the above
    answer: D
    explanation: Cobra, Python, Squirrel and Java are all programming languages.
  - slug: bpsc-69-q006
    difficulty: medium
    stem: What is the full form of GPT in ChatGPT, recently seen in the news?
    options:
      A: Glutamic Pyruvic Transaminase
      B: GUID Partition Table
      C: Grooved Pegboard Test
      D: Generative Pre-Trained Transformer
    answer: D
    explanation: GPT stands for Generative Pre-trained Transformer.
  - slug: bpsc-69-q007
    difficulty: medium
    stem: |-
      Which of the following are not the tastes of the tongue?

      1. Sweet
      2. Bitter
      3. Salty
      4. Spicy
      5. Umami
      6. Sour
      7. Pungent

      Select the correct answer using the codes given below.
    options:
      A: 2, 5 and 7
      B: 1, 3 and 4
      C: 4 and 7
      D: 3 and 6
    answer: C
    explanation: The five basic tastes are sweet, bitter, salty, umami and sour; spicy and pungent are pain/chemesthetic sensations, not tastes.
  - slug: bpsc-69-q008
    difficulty: medium
    stem: |-
      Which of the following pairs are correctly matched?

      1. Anorexia : Sleep disorder
      2. Insomnia : Eating disorder
      3. Dyspnoea : Shortness of breath
      4. Anosmia : Partial or full loss of smell

      Select the correct answer using the codes given below.
    options:
      A: Only 1 and 2
      B: Only 2 and 3
      C: Only 3 and 4
      D: All of the above
    answer: C
    explanation: Anorexia is an eating disorder and insomnia a sleep disorder (pairs 1 and 2 are swapped); dyspnoea and anosmia are matched correctly.
  - slug: bpsc-69-q009
    difficulty: medium
    stem: In the universe, what are pulsars?
    options:
      A: A group of stars
      B: Rotating neutron stars
      C: Explosion of a star
      D: Radio waves emitted by a star
    answer: B
    explanation: Pulsars are rapidly rotating, highly magnetised neutron stars that emit beams of radiation.
  - slug: bpsc-69-q010
    difficulty: medium
    stem: In the context of lab-grown diamonds (LGDs), what is used as a diamond seed?
    options:
      A: White sapphire
      B: Moissanite
      C: Graphite
      D: Cubic zirconia (CZ)
    answer: C
    explanation: The key gives graphite, the carbon feedstock that is turned into diamond under high pressure and temperature. The seed itself is usually a diamond plate, so the wording is loose.
  - slug: bpsc-69-q011
    difficulty: medium
    stem: What is the ‘fibre’ used to make bulletproof jackets?
    options:
      A: Nylon
      B: Terylene
      C: Tweed
      D: Kevlar
    answer: D
    explanation: Kevlar, an aramid fibre with very high tensile strength, is used in bulletproof jackets.
  - slug: bpsc-69-q012
    difficulty: medium
    stem: |-
      What is/are the full form(s) of HMX?

      1. High Melting Explosive
      2. High-Density Monoatomic Xenon
      3. Hedge Monetizing Xenocurrency
      4. Her Majesty’s Explosive

      Select the correct answer using the codes given below.
    options:
      A: 1 and 2
      B: 2 and 3
      C: Only 1
      D: 1 and 4
    answer: C
    explanation: |-
      **Disputed.** BPSC's final key says C; our check suggests D.

      The key accepts only 'High Melting Explosive'. 'Her Majesty's Explosive' is another widely quoted expansion, which would make D right; the key's remark says the other names don't change the compound.
  - slug: bpsc-69-q013
    difficulty: medium
    stem: What is the name of Tesla’s humanoid robot launched in October 2022?
    options:
      A: Sophia
      B: Atlas
      C: Pepper
      D: Optimus
    answer: D
    explanation: Tesla showed its humanoid robot Optimus at AI Day in October 2022.
  - slug: bpsc-69-q014
    difficulty: medium
    stem: What is the ‘Manhattan Project’?
    options:
      A: A research and development undertaking that produced the first nuclear weapons
      B: One of the largest art auctions of the world
      C: A real estate project in New York City
      D: A famous theme park
    answer: A
    explanation: The Manhattan Project was the US-led WWII programme that produced the first nuclear weapons.
  - slug: bpsc-69-q015
    difficulty: medium
    stem: The image formed by concave mirror is real, inverted and of the same size as that of the object. The position of the object should be
    options:
      A: at the focus
      B: at the centre of curvature
      C: between the focus and centre of curvature
      D: beyond the centre of curvature
    answer: B
    explanation: For a concave mirror, an object at the centre of curvature forms a real, inverted, same-size image at C.
  - slug: bpsc-69-q016
    difficulty: medium
    stem: A photoelectric cell is a device which
    options:
      A: converts light energy into electric energy
      B: converts electric energy into light energy
      C: stores light energy
      D: None of the above
    answer: A
    explanation: A photoelectric cell converts light energy into electrical energy.
  - slug: bpsc-69-q017
    difficulty: medium
    stem: The amount of solute present per unit volume or per unit mass of the solution/solvent is known as _____ in Chemistry.
    options:
      A: composition of solute
      B: concentration of solvent
      C: concentration of solute
      D: concentration of solution
    answer: D
    explanation: The amount of solute per unit volume or mass of solution is the concentration of the solution.
  - slug: bpsc-69-q018
    difficulty: medium
    stem: How do COVID vaccines stimulate an immune response?
    options:
      A: By introducing live attenuated SARS-CoV-2 virus
      B: By introducing a real SARS-CoV-2 virus
      C: By introducing a harmless piece of SARS-CoV-2 virus
      D: By introducing antibodies against SARS-CoV-2 virus
    answer: A
    explanation: |-
      **Disputed.** BPSC's final key says A; our check suggests C.

      The key says vaccines work by introducing live attenuated virus. That is not how the main COVID vaccines work. They present a harmless piece (the spike protein or its mRNA), which is option C.
  - slug: bpsc-69-q019
    difficulty: medium
    stem: Which of the following liquids is a bad conductor of electricity?
    options:
      A: Salted water
      B: Orange juice
      C: Lemon juice
      D: None of the above
    answer: D
    explanation: Salt water, orange juice and lemon juice all contain ions and conduct electricity, so none of them is a bad conductor.
  - slug: bpsc-69-q020
    difficulty: medium
    stem: The DNA double helix structure was discovered by
    options:
      A: James Watson and Francis Crick
      B: Rosalind Franklin and Maurice Wilkins
      C: Linus Pauling
      D: Gregor Mendel
    answer: A
    explanation: Watson and Crick proposed the double-helix model of DNA in 1953.
  - slug: bpsc-69-q021
    difficulty: medium
    stem: Two objects of different masses falling freely near the surface of the Moon would
    options:
      A: have different accelerations
      B: undergo a change in their inertia
      C: have same velocity at any instant
      D: experience forces of same magnitude
    answer: C
    explanation: All bodies have the same acceleration in free fall, so if dropped together they have the same velocity at every instant. Their forces differ because their masses differ.
  - slug: bpsc-69-q022
    difficulty: medium
    stem: How do vector vaccines work to provide immunity?
    options:
      A: By introducing a weakened or inactivated virus into the body
      B: By directly attacking and destroying pathogens in the body
      C: By placing the virus in a modified version of a different virus
      D: By entering directly into the cells and enabling them to create spike proteins
    answer: C
    explanation: Vector vaccines put a gene of the target virus into a modified, harmless virus such as an adenovirus.
  - slug: bpsc-69-q023
    difficulty: medium
    stem: The process that continually adds new crust is
    options:
      A: subduction
      B: earthquake
      C: seafloor spreading
      D: convection
    answer: C
    explanation: New oceanic crust is continually created at mid-ocean ridges by seafloor spreading.
  - slug: bpsc-69-q024
    difficulty: medium
    stem: The theory that states “pieces of the Earth’s crust are in constant, slow motion driven by movement in the mantle” is called
    options:
      A: the theory of continental drift
      B: the theory of Pangaea
      C: the theory of plate tectonics
      D: the theory of plate boundaries
    answer: C
    explanation: Plate tectonics holds that lithospheric plates move slowly, driven by movements in the mantle.
  - slug: bpsc-69-q025
    difficulty: medium
    stem: What is the expanded form of the term ‘mRNA’ that has been widely discussed since the beginning of the pandemic?
    options:
      A: Messenger Ribonucleic Acid
      B: Mutant Ribonucleic Acid
      C: Modified Ribonucleic Acid
      D: Mnemonic Ribonucleic Acid
    answer: A
    explanation: mRNA stands for messenger ribonucleic acid.
  - slug: bpsc-69-q026
    difficulty: medium
    stem: An AC current can be produced by
    options:
      A: choke coil
      B: dynamo
      C: transformer
      D: None of the above
    answer: B
    explanation: An AC dynamo (alternator) produces alternating current; a transformer only changes the voltage of an existing AC supply.
  - slug: bpsc-69-q027
    difficulty: medium
    stem: Current density is
    options:
      A: a scalar quantity
      B: a vector quantity
      C: dimensionless
      D: None of the above
    answer: B
    explanation: Current density J has both magnitude and direction, so it is a vector (I = ∫J·dA).
  - slug: bpsc-69-q028
    difficulty: medium
    stem: What is the basis of most useful classification of medications in medical chemistry?
    options:
      A: Pharmacological effect
      B: Molecular targets
      C: Chemical structure
      D: None of the above
    answer: B
    explanation: "NCERT Class 12: classification by molecular targets is the most useful for medicinal chemists."
  - slug: bpsc-69-q029
    difficulty: medium
    stem: Which of the following slows down the reaction rate?
    options:
      A: Catalytic promoter
      B: Homogeneous catalyst
      C: Heterogeneous catalyst
      D: None of the above
    answer: D
    explanation: Promoters and catalysts (homogeneous or heterogeneous) speed reactions up; only inhibitors (negative catalysts) slow them, and none is listed.
  - slug: bpsc-69-q030
    difficulty: medium
    stem: Input and output nerves meet at
    options:
      A: liver
      B: central nervous system
      C: heart
      D: None of the above
    answer: B
    explanation: Sensory (input) and motor (output) nerves meet in the central nervous system (brain and spinal cord).
  - slug: bpsc-69-q031
    difficulty: medium
    stem: In the context of ‘Shipwreck Tourism’, shipwrecks in Indian waters have been explored at Sunchi Reef, Amee Shoals and Grande Island. Where are these locations?
    options:
      A: Off the coast of Goa
      B: Off the coast of Lakshadweep
      C: Off the coast of Tamil Nadu
      D: Off the coast of Odisha
    answer: A
    explanation: Sunchi Reef, Amee Shoals and Grande Island are dive sites with shipwrecks off the coast of Goa.
  - slug: bpsc-69-q032
    difficulty: medium
    stem: |-
      The G20 members represent

      1. around 85% of the global GDP
      2. about 50% of the global trade
      3. about two-thirds of the world population

      Which of the above statistics is/are correct?
    options:
      A: Only 1
      B: Only 1 and 3
      C: 1, 2 and 3
      D: Only 1 and 2
    answer: B
    explanation: G20 accounts for about 85% of world GDP, over 75% of world trade and about two-thirds of the population. Statement 2 (50% of trade) is wrong.
  - slug: bpsc-69-q034
    difficulty: medium
    stem: The Global Gender Gap Report is released by
    options:
      A: the World Bank
      B: the UN Women
      C: the World Economic Forum
      D: the UNDP
    answer: C
    explanation: The Global Gender Gap Report is published by the World Economic Forum.
  - slug: bpsc-69-q035
    difficulty: medium
    stem: Which one of the following statements regarding Queen Elizabeth II of the United Kingdom is correct?
    options:
      A: She reigned for 70 years and died at the age of 96 years.
      B: She reigned for 68 years and died at the age of 94 years.
      C: She reigned for 72 years and died at the age of 92 years.
      D: She reigned for 66 years and died at the age of 90 years.
    answer: A
    explanation: Elizabeth II reigned for 70 years (1952–2022) and died aged 96.
  - slug: bpsc-69-q036
    difficulty: medium
    stem: What was the theme of DefExpo–2022, held in Gujarat?
    options:
      A: "India : The Emerging Defence Manufacturing Hub"
      B: Path to Pride
      C: Synergy for Defence
      D: Aatmanirbharta
    answer: B
    explanation: DefExpo 2022 in Gandhinagar had the theme 'Path to Pride'.
  - slug: bpsc-69-q037
    difficulty: medium
    stem: The three-day celebration of Thadingyut Festival is celebrated in which country?
    options:
      A: Chile
      B: Nepal
      C: Germany
      D: Myanmar
    answer: D
    explanation: Thadingyut, the Festival of Lights, is celebrated in Myanmar.
  - slug: bpsc-69-q038
    difficulty: medium
    stem: |-
      Consider the following statements regarding the ‘White House’ :

      1. The address of the White House is 1800 Pennsylvania Avenue.
      2. It is the official residence and workplace of the President of USA.
      3. On November 1, 1800, John Adams became the first President to take residence in the building.
      4. It is a symbol of American Democracy.

      Which of the above statements are correct?
    options:
      A: 1, 3 and 4
      B: Only 2 and 3
      C: Only 3 and 4
      D: 2, 3 and 4
    answer: D
    explanation: The White House is at 1600 (not 1800) Pennsylvania Avenue; statements 2, 3 and 4 are correct.
  - slug: bpsc-69-q039
    difficulty: medium
    stem: ‘Net Metering’ is sometimes seen in the news in the context of promoting
    options:
      A: the installation of CNG kits in motorcars
      B: the installation of water meters in urban households
      C: a billing mechanism for solar energy by consumers for the electricity they add to the grid
      D: the use of piped natural gas in the kitchens of households
    answer: C
    explanation: Net metering credits rooftop-solar consumers for the electricity they feed into the grid.
  - slug: bpsc-69-q040
    difficulty: medium
    stem: |-
      Match List–I with List–II :

      | List—I (Colour) | List—II (Combination) |
      |---|---|
      | a. Magenta | 1. Green and blue |
      | b. Teal | 2. Red and blue |
      | c. Mauve | 3. Blue, green and white |
      | d. Cyan | 4. Blue, red and white |

      Select the correct answer using the codes given below.
    options:
      A: a-2, b-3, c-4, d-1
      B: a-2, b-4, c-3, d-1
      C: a-4, b-2, c-1, d-3
      D: a-3, b-4, c-2, d-1
    answer: A
    explanation: Magenta = red + blue, teal = blue, green and white, mauve = blue, red and white, cyan = green + blue.
  - slug: bpsc-69-q041
    difficulty: medium
    stem: What is the name of the deep-sea submersible that imploded during an underwater voyage to the Titanic wreckage?
    options:
      A: Alvin
      B: Falcon
      C: Trident
      D: Titan
    answer: D
    explanation: OceanGate's submersible Titan imploded in June 2023 on a dive to the Titanic wreck.
  - slug: bpsc-69-q042
    difficulty: medium
    stem: |-
      Match List–I with List–II :

      | List—I (Footwear/Fashion Accessory) | List—II (Description) |
      |---|---|
      | a. Beret | 1. A type of men’s footwear |
      | b. Stilettos | 2. A type of sunglasses |
      | c. Aviators | 3. A type of hat |
      | d. Chignon | 4. A type of women’s footwear |
      | e. Brogue | 5. A type of hairstyle |

      Select the correct answer using the codes given below.
    options:
      A: a-3, b-2, c-1, d-4, e-5
      B: a-3, b-4, c-2, d-5, e-1
      C: a-5, b-3, c-2, d-4, e-1
      D: a-1, b-2, c-3, d-4, e-5
    answer: B
    explanation: Beret is a hat, stilettos are women's shoes, aviators are sunglasses, a chignon is a hairstyle and brogues are men's shoes.
  - slug: bpsc-69-q043
    difficulty: medium
    stem: Where did the former President of the USA give his interview recently?
    options:
      A: Rome
      B: Sarajevo
      C: Athens
      D: Amsterdam
    answer: C
    explanation: Barack Obama gave a CNN interview (to Christiane Amanpour) in Athens in June 2023.
  - slug: bpsc-69-q044
    difficulty: medium
    stem: |-
      In the context of sports, which of the following pairs are correctly matched?

      1. Flushing Meadows : French Open
      2. Venus Rosewater Dish : Wimbledon Trophy (Women)
      3. Roland Garros : US Open
      4. Australian Open (Women) : Daphne Akhurst Memorial Cup

      Select the correct answer using the codes given below.
    options:
      A: 1 and 2
      B: 2 and 3
      C: 3 and 4
      D: 2 and 4
    answer: D
    explanation: Flushing Meadows hosts the US Open and Roland Garros the French Open (1 and 3 swapped); pairs 2 and 4 are correct.
  - slug: bpsc-69-q045
    difficulty: medium
    stem: The Ministry of Home Affairs has completed the Mother Tongue Survey of India (MTSI) in November 2022 with field videography of the country’s how many languages?
    options:
      A: "40"
      B: "233"
      C: "576"
      D: "984"
    answer: C
    explanation: MHA reported the Mother Tongue Survey of India completed with field videography of 576 languages.
  - slug: bpsc-69-q046
    difficulty: medium
    stem: Which State Government launched the State-Level Committee for Vulture Conservation (SLCVC), proposed by the national action for the protection of vultures in India?
    options:
      A: Tamil Nadu
      B: Sikkim
      C: Assam
      D: Meghalaya
    answer: A
    explanation: Tamil Nadu set up a State-Level Committee for Vulture Conservation in 2022 under the national Vulture Action Plan.
  - slug: bpsc-69-q047
    difficulty: medium
    stem: Ten captive-bred Asian Giant Tortoises (Manouria emys), one of the largest tortoise species in mainland Asia, were recently released into which National Park of India?
    options:
      A: Ntangki National Park
      B: Periyar National Park
      C: Pench National Park
      D: Khangchendzonga National Park
    answer: A
    explanation: Ten captive-bred Asian giant tortoises were released into Ntangki National Park, Nagaland.
  - slug: bpsc-69-q048
    difficulty: medium
    stem: Which country has recently reaffirmed Arunachal Pradesh as an integral part of India?
    options:
      A: USA
      B: Australia
      C: Germany
      D: Russia
    answer: A
    explanation: The USA (State Department and a Senate resolution, 2023) reaffirmed Arunachal Pradesh as an integral part of India.
  - slug: bpsc-69-q049
    difficulty: medium
    stem: India’s Rudrankksh Balasaheb Patil won which medal in Men’s 10 m Air Rifle at the ISSF World Championship in Cairo?
    options:
      A: Gold
      B: Silver
      C: Bronze
      D: None of the above
    answer: A
    explanation: Rudrankksh Patil won gold in men's 10 m air rifle at the 2022 ISSF World Championship in Cairo.
  - slug: bpsc-69-q050
    difficulty: medium
    stem: The National Education Policy, 2020 emphasizes the integration of vocational education into mainstream education from which grade onwards?
    options:
      A: Grade 6
      B: Grade 8
      C: Grade 10
      D: Grade 12
    answer: A
    explanation: NEP 2020 introduces vocational education from Grade 6, with internships.
  - slug: bpsc-69-q051
    difficulty: medium
    stem: India signed the Economic Cooperation and Trade Agreement (ECTA) with which country?
    options:
      A: UAE
      B: Australia
      C: USA
      D: UK
    answer: B
    explanation: India signed the India–Australia ECTA in April 2022; the UAE deal is a CEPA.
  - slug: bpsc-69-q052
    difficulty: medium
    stem: The Plain Language Act was passed by which of the following countries recently which requires Government officials to use simple and easily understandable English language in official documents and websites?
    options:
      A: Australia
      B: Ireland
      C: New Zealand
      D: Germany
    answer: C
    explanation: New Zealand passed the Plain Language Act in 2022.
  - slug: bpsc-69-q053
    difficulty: medium
    stem: Tillyardembi Fossils of the world’s first plant pollinators, called Tillyardembiids, were discovered recently in which country?
    options:
      A: Greece
      B: India
      C: Russia
      D: China
    answer: C
    explanation: The Tillyardembiid fossils, about 280 million years old, were found in the Ural region of Russia.
  - slug: bpsc-69-q054
    difficulty: medium
    stem: The ‘Lisbon Declaration’, which made headlines, is associated with the conservation of which entity?
    options:
      A: Air
      B: Mountains
      C: Oceans
      D: Freshwater glaciers
    answer: C
    explanation: The Lisbon Declaration was adopted at the 2022 UN Ocean Conference on ocean conservation.
  - slug: bpsc-69-q055
    difficulty: medium
    stem: Which of the following animals was not known to the people of the Indus Valley Civilization?
    options:
      A: Bull
      B: Horse
      C: Elephant
      D: None of the above
    answer: B
    explanation: The horse is not clearly attested in the Harappan civilisation; the bull and elephant appear on seals.
  - slug: bpsc-69-q056
    difficulty: medium
    stem: Which of the following is not a UNESCO World Heritage Site?
    options:
      A: Qutb Minar
      B: Red Fort
      C: India Gate
      D: None of the above
    answer: C
    explanation: Qutb Minar and Red Fort are UNESCO sites; India Gate is not.
  - slug: bpsc-69-q057
    difficulty: medium
    stem: The concept of the Directive Principles of State Policy in the Indian Constitution was borrowed from the Constitution of
    options:
      A: England
      B: Switzerland
      C: Ireland
      D: None of the above
    answer: C
    explanation: The Directive Principles were borrowed from the Irish Constitution.
  - slug: bpsc-69-q058
    difficulty: medium
    stem: Sikkim became a full-fledged State of the Union of India in
    options:
      A: "1974"
      B: "1975"
      C: "1976"
      D: None of the above
