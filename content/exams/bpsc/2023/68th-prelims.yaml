slug: 68th-prelims
title: BPSC 68th Prelims
date: 2023-02-12
label: Series A
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q22."
questions:
  - slug: bpsc-68-q001
    difficulty: medium
    stem: The phrase ‘equality before law’ used in Article 14 of the Indian Constitution has been borrowed from the Constitution of
    options:
      A: Britain
      B: USA
      C: France
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: "'Equality before law' (Art. 14) comes from the British Constitution (rule of law); 'equal protection of laws' comes from the US Constitution."
  - slug: bpsc-68-q002
    difficulty: medium
    stem: What was the duration in the making of the Indian Constitution?
    options:
      A: 1 year 10 months and 12 days
      B: 2 years 10 months and 5 days
      C: 2 years 11 months and 18 days
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: "The Constituent Assembly first met on 9 Dec 1946 and adopted the Constitution on 26 Nov 1949: 2 years, 11 months and 18 days."
  - slug: bpsc-68-q003
    difficulty: medium
    stem: The Council of Ministers in a State is collectively responsible to
    options:
      A: the Chief Minister
      B: the Governor
      C: the Legislative Assembly
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: "Article 164(2): the State Council of Ministers is collectively responsible to the Legislative Assembly."
  - slug: bpsc-68-q004
    difficulty: medium
    stem: |-
      Consider the following statements :

      In the post-73rd Amendment era, there has to be decentralization of

      1. decision-making powers
      2. system as a whole
      3. judicial powers
      4. administrative powers

      Which of the above statements are correct?
    options:
      A: 1, 2 and 3 only
      B: 1, 2 and 4 only
      C: 2, 3 and 4 only
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: The 73rd Amendment decentralised decision-making, administrative powers and the governance system as a whole; it did not decentralise judicial powers.
  - slug: bpsc-68-q005
    difficulty: medium
    stem: The representation in the Rajya Sabha includes
    options:
      A: members directly elected by citizens
      B: members indirectly elected by citizens through their representatives
      C: members nominated by the President of India
      D: More than one of the above
      E: None of the above
    answer: D
    explanation: Rajya Sabha has members elected indirectly by elected MLAs and 12 members nominated by the President, so both B and C hold.
  - slug: bpsc-68-q006
    difficulty: medium
    stem: Which of the following is concerned with the Supreme Court of India?
    options:
      A: Appellate jurisdiction
      B: Original jurisdiction
      C: Collegium system
      D: More than one of the above
      E: None of the above
    answer: D
    explanation: Original and appellate jurisdiction and the collegium system all relate to the Supreme Court, so more than one option is correct.
  - slug: bpsc-68-q007
    difficulty: medium
    stem: The minimum age for contesting elections to the Panchayati Raj Institutions should be how many years according to the 73rd Constitutional Amendment Act?
    options:
      A: 21 years
      B: 25 years
      C: 18 years
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: "Article 243F (73rd Amendment): a person who has attained 21 years cannot be disqualified on grounds of age for Panchayat elections."
  - slug: bpsc-68-q008
    difficulty: medium
    stem: With reference to the Consumer Disputes Redressal at the district level in India, which one of the following statements is *not* correct?
    options:
      A: The State Government can establish more than one District Forum in a district if it deems fit.
      B: One of the members of the District Forum shall be a woman.
      C: The District Forum entertains the complaints where the value of goods or services does not exceed rupees fifty lakhs.
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: Under the Consumer Protection Act 2019, a State may set up more than one District Commission in a district, the 2020 rules require a woman president or member, and since Dec 2021 the pecuniary limit is Rs 50 lakh. All three statements are correct, so none is 'not correct'.
  - slug: bpsc-68-q009
    difficulty: medium
    stem: At what level does a Panchayat Samiti operate a Panchayati Raj structure?
    options:
      A: District level
      B: Gram Panchayat level
      C: Block-level body
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: The Panchayat Samiti is the intermediate tier, at the block level.
  - slug: bpsc-68-q010
    difficulty: medium
    stem: Which one of the following was established as the first programme of community development?
    options:
      A: National Extension Service
      B: Integrated Rural Development Programme
      C: Cooperation Movement
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Of the options, the National Extension Service (1953) was the earliest community-development programme (it followed the 1952 Community Development Programme); IRDP came in 1978-80.
  - slug: bpsc-68-q011
    difficulty: medium
    stem: |-
      Which of the following are the objectives of the SEZ Act, 2005?

      1. Generation of additional economic activity
      2. Promotion of exports of goods and services
      3. Creation of employment
    options:
      A: 1, 2 and 3
      B: 2 and 3 only
      C: 1 and 3 only
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: The SEZ Act 2005 lists additional economic activity, export promotion and employment generation among its objectives, so all three apply.
  - slug: bpsc-68-q012
    difficulty: medium
    stem: What is the policy measure adopted by the Government of India to improve the system of agricultural marketing?
    options:
      A: Minimum Support Price (MSP)
      B: Maintenance of Buffer Stock
      C: Public Distribution System (PDS)
      D: More than one of the above
      E: None of the above
    answer: D
    explanation: NCERT lists MSP, buffer stocks and PDS as policy instruments the government uses in agricultural marketing, so more than one option is correct.
  - slug: bpsc-68-q013
    difficulty: medium
    stem: Which committee suggested the enactment of the Competition Act, 2002?
    options:
      A: Rangarajan Committee
      B: S. V. S. Raghavan Committee
      C: Vijay Kelkar Committee
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: The S.V.S. Raghavan Committee (2000) recommended a new competition law, which became the Competition Act 2002.
  - slug: bpsc-68-q014
    difficulty: medium
    stem: |-
      Match List–I with List–II :

      | List–I | List–II |
      |---|---|
      | a. Grey Revolution | 1. Onion production |
      | b. Pink Revolution | 2. Tomato and meat production |
      | c. Silver Revolution | 3. Production of eggs |
      | d. Red Revolution | 4. Fertilizers |
    options:
      A: a-4, b-1, c-3, d-2
      B: a-3, b-1, c-4, d-2
      C: a-1, b-4, c-2, d-3
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: "Grey Revolution: fertilisers; Pink: onion (also prawns/meat); Silver: eggs; Red: tomato and meat."
  - slug: bpsc-68-q015
    difficulty: medium
    stem: Which of the following Five-Year Plans was focussed on Human Resource Development?
    options:
      A: First
      B: Third
      C: Fifth
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: Human resource development was the focus of the Eighth Plan (1992-97), which is not among the options.
  - slug: bpsc-68-q016
    difficulty: medium
    stem: Which of the following States of India received the highest Foreign Direct Investment (FDI) equity flow during April to September 2022?
    options:
      A: Karnataka
      B: Tripura
      C: Gujarat
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: In Apr-Sep 2022 Maharashtra was first and Karnataka second in FDI equity inflows (DPIIT). Among the listed states Karnataka is highest.
  - slug: bpsc-68-q017
    difficulty: medium
    stem: In which budget did the Finance Minister announce the Liberalized Exchange Rate Management System?
    options:
      A: Union Budget, 1991–1992
      B: Union Budget, 1992–1993
      C: Union Budget, 1993–1994
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: LERMS (dual exchange rate) was announced in the Union Budget 1992-93 and introduced in March 1992.
  - slug: bpsc-68-q018
    difficulty: medium
    stem: |-
      Which of the following were goals of the Five-Year Plans?

      1. Growth
      2. Modernization
      3. Self-reliance
      4. Literature
    options:
      A: 1, 3 and 4 only
      B: 2, 3 and 4 only
      C: 1, 2 and 4 only
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: The plan goals were growth, modernisation, self-reliance and equity. 'Literature' is not one, and every option includes statement 4, so none is correct.
  - slug: bpsc-68-q019
    difficulty: medium
    stem: Which organization carries out the survey for determining the poverty line?
    options:
      A: NSSO
      B: NITI Aayog
      C: RBI
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Poverty estimates rely on the NSSO consumption expenditure surveys. NITI Aayog uses the data but does not conduct the survey.
  - slug: bpsc-68-q020
    difficulty: medium
    stem: The trade balance of India (merchandise and services) for December 2022 (provisional) is
    options:
      A: (–) 10·50 USD billion
      B: (+) 11·98 USD billion
      C: (–) 11·98 USD billion
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: The Commerce Ministry's estimate for Dec 2022 was overall exports of about USD 61.82 bn and imports of about USD 73.80 bn, a trade deficit of about USD 11.98 bn.
  - slug: bpsc-68-q021
    difficulty: medium
    stem: At what percentage has Bihar registered the lowest Female Workforce Participation Rate for the year 2020–2022?
    options:
      A: 4% in rural and 6·5% in urban areas
      B: 6% in rural and 8·1% in urban areas
      C: 7% in rural and 9·1% in urban areas
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Bihar has the lowest female workforce participation among states. The key takes about 4% rural and 6.5% urban.
  - slug: bpsc-68-q023
    difficulty: medium
    stem: According to the National Family Survey-5 released by the Union Ministry of Health and Family Welfare on November 24, 2021, there has been a significant improvement in the sex ratio of Bihar. It has increased from ______ in 2015–2016 to ______ in 2020–2022.
    options:
      A: 1062, 1090
      B: 1040, 1070
      C: 1030, 1050
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: "NFHS-5: Bihar's sex ratio (females per 1000 males) rose from 1062 (NFHS-4, 2015-16) to 1090 (2019-21)."
  - slug: bpsc-68-q024
    difficulty: medium
    stem: According to the Bihar Economic Survey (2021–2022), what was the rate of growth of Gross State Domestic Product (GSDP) of Bihar in 2020–2021?
    options:
      A: 3%
      B: 2%
      C: 2·5%
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: "Bihar Economic Survey 2021-22: GSDP grew 2.5% at constant prices in 2020-21, the COVID year."
  - slug: bpsc-68-q025
    difficulty: medium
    stem: Which one of the following is correct for Bihar economy?
    options:
      A: The growth rate is one of the lowest in India at 2·5%.
      B: Bihar produces mostly primary goods.
      C: The occupational structure of the economy is stagnant from above.
      D: More than one of the above
      E: None of the above
    answer: D
    explanation: Bihar's growth rate is among the highest (A is false). It mainly produces primary goods, and its occupational structure, with over two-thirds in agriculture, has hardly changed. The key accepts both B and C.
  - slug: bpsc-68-q026
    difficulty: medium
    stem: The Swadeshi and Boycott were adopted as the methods of struggle for the first time during the
    options:
      A: visit of the Simon Commission to India
      B: Partition of Bengal
      C: Home Rule Movement
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Swadeshi and Boycott were first adopted as methods of struggle during the anti-partition movement against the Partition of Bengal in 1905.
  - slug: bpsc-68-q027
    difficulty: medium
    stem: At the Calcutta Session of the Indian National Congress (INC) held in 1906, the Flag of Swaraj for India was unfurled by
    options:
      A: A. O. Hume
      B: Dadabhai Naoroji
      C: G. K. Gokhale
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Dadabhai Naoroji presided over the 1906 Calcutta session, where Swaraj was first declared the Congress goal. Exam sources credit him with unfurling the Swaraj flag.
  - slug: bpsc-68-q028
    difficulty: medium
    stem: During the freedom struggle, a parallel movement launched in the Indian States (in the States ruled by the Indian rulers such as Kashmir, Nizam’s Hyderabad, Travancore, etc.) was
    options:
      A: State People’s Movement
      B: Praja Mandal Movement
      C: Swaraj Movement
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: The movement in the princely states was organised through Praja Mandals (and the States' People's Conference).
  - slug: bpsc-68-q029
    difficulty: medium
    stem: Which of the following statements regarding the Indian freedom struggle is *not* correct?
    options:
      A: Gandhiji withdrew from the Non-Cooperation Movement due to the Chauri-Chaura Incident.
      B: Gandhiji gave his first major public speech at Banaras Hindu University.
      C: Mahatma Gandhi was arrested in the year 1921.
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Gandhiji was arrested in March 1922, not 1921. A (Chauri Chaura) and B (BHU speech, 1916) are correct.
  - slug: bpsc-68-q030
    difficulty: medium
    stem: Which one of the following was a journal brought out by Abul Kalam Azad?
    options:
      A: "*The Comrade*"
      B: "*Al-Hilal*"
      C: "*Zamindar*"
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Abul Kalam Azad started Al-Hilal in 1912. The Comrade was Mohammad Ali's and Zamindar was Zafar Ali Khan's.
  - slug: bpsc-68-q031
    difficulty: medium
    stem: How did the study of history help in creating a feeling of nationalism in India towards the end of the 19th century?
    options:
      A: By reinterpreting history and refuting the British portrayal of Indians as backward, primitive and incapable of governing themselves
      B: By writing about India’s glorious past and urging people to take pride in their achievements
      C: By urging people to struggle and change the miserable conditions of life under the British rule
      D: More than one of the above
      E: None of the above
    answer: D
    explanation: "NCERT (Class 10) describes all three: reinterpreting history against the British portrayal, writing about India's glorious past, and urging struggle against British rule."
  - slug: bpsc-68-q032
    difficulty: medium
    stem: |-
      Which of the following statements are *not* correct regarding the Non-Cooperation Movement in the towns?

      1. Only the upper caste and the rich took part in the movement.
      2. The council elections were boycotted even by the Justice Party of Madras.
      3. Thousands of students left government-controlled schools, headmasters and teachers resigned and lawyers gave up their practice.
    options:
      A: 1 and 3 only
      B: 2 and 3 only
      C: 1 and 2 only
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Middle classes, not only the upper castes and the rich, joined (1 is wrong). The Justice Party of Madras contested the council elections (2 is wrong). Statement 3 is correct.
  - slug: bpsc-68-q033
    difficulty: medium
    stem: “A Sanyasi who came to that district after a spell as an indentured labourer in Fiji, carrying a copy of Tulsidas *Ramayana* on his back from which he would recite verses to rural audience.” The peasant leader referred to here is
    options:
      A: Jhinguri Singh
      B: Yadunandan Sharma
      C: Baba Ram Chandra
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Baba Ramchandra, a former indentured labourer in Fiji, led the Awadh peasant movement while reciting the Ramayana.
  - slug: bpsc-68-q034
    difficulty: medium
    stem: Who was the founder of All India Harijan Sangh in 1932?
    options:
      A: Jagjivan Ram
      B: Mahatma Gandhi
      C: Dr. B. R. Ambedkar
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Gandhiji founded the All India Harijan (Sevak) Sangh in 1932 to fight untouchability.
  - slug: bpsc-68-q035
    difficulty: medium
    stem: On February 20, 1947, Prime Minister Attlee announced the British Government’s decision to withdraw from India latest by
    options:
      A: August 1947
      B: January 1948
      C: June 1948
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: On 20 Feb 1947 Attlee announced that the British would leave India by June 1948.
  - slug: bpsc-68-q036
    difficulty: medium
    stem: Who established Swaraj Dal in Bihar?
    options:
      A: Shri Krishna Singh
      B: Ramlal Shah
      C: Bankim Chandra Mitra
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Shri Krishna Singh (Sinha) is credited with setting up the Swaraj Dal in Bihar in 1923.
  - slug: bpsc-68-q037
    difficulty: medium
    stem: During the Salt Satyagraha in Bihar, in addition to making salt, the people chose to oppose the government by opposing which tax?
    options:
      A: Haathi
      B: Development
      C: Malba
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: Alongside salt-making, people in Bihar refused to pay the chowkidari tax, which is not among the options.
  - slug: bpsc-68-q038
    difficulty: medium
    stem: The elected Government of Bihar formed by Shri Krishna Singh resigned in February 1938 for which reason?
    options:
      A: Participation in the Freedom Struggle of India
      B: For the release of political prisoners
      C: Satyagraha against the British at the call of Gandhiji
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Shri Krishna Singh's ministry resigned in Feb 1938 when the Governor refused to release political prisoners.
  - slug: bpsc-68-q039
    difficulty: medium
    stem: Who saved the life of Gandhiji in Bihar during Champaran Satyagraha?
    options:
      A: Batak Mian
      B: Hamid Ansari
      C: Ravindra Pathak
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Batak Mian, a cook, refused an indigo planter's order to poison Gandhiji during the Champaran Satyagraha.
  - slug: bpsc-68-q040
    difficulty: medium
    stem: Who led cultivators in Bihar during the Non-Cooperation Movement?
    options:
      A: Swami Vidyanand
      B: Raj Kumar Shukla
      C: Shri Krishna Singh
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Swami Vidyanand led the kisan agitation, against the Darbhanga Raj, in north Bihar in 1919-20, around the Non-Cooperation period.
  - slug: bpsc-68-q041
    difficulty: medium
    stem: In ancient times, the area to the south of the Ganga was known as
    options:
      A: Takshashila
      B: Chola
      C: Anarta
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: The region south of the Ganga (around the Son) was Magadha. Takshashila, Chola and Anarta lay elsewhere.
  - slug: bpsc-68-q042
    difficulty: medium
    stem: When did the use of iron begin in Indian subcontinent?
    options:
      A: Around 12000 years ago
      B: Around 6000 years ago
      C: Around 9000 years ago
      D: More than one of the above
      E: None of the above
    answer: E
    explanation: Iron use in the subcontinent began about 3000 years ago (c. 1000 BCE or a little earlier), which no option gives.
  - slug: bpsc-68-q043
    difficulty: medium
    stem: According to the rock inscription in Sanskrit, composed around second century CE, Sudarshan Lake, an artificial reservoir, was repaired by
    options:
      A: Kanishka
      B: Rudradaman
      C: Harsha
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Rudradaman's Junagadh (Girnar) Sanskrit inscription (c. 150 CE) records his repair of the Sudarshana lake.
  - slug: bpsc-68-q044
    difficulty: medium
    stem: The temple of Deogarh near Jhansi and the sculptures in the temple at Garhwa near Allahabad are the important remains of the
    options:
      A: Gupta art
      B: Rashtrakuta art
      C: Maurya art
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: The Dashavatara temple at Deogarh and the Garhwa sculptures are Gupta-period works.
  - slug: bpsc-68-q045
    difficulty: medium
    stem: In which of the following battles are the main opponents *not* correctly stated?
    options:
      A: First Battle of Panipat—Babur and Ibrahim Lodi
      B: Second Battle of Panipat—Tipu Sultan and Marathas
      C: Battle of Haldighati—Maharana Pratap and Akbar
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: The Second Battle of Panipat (1556) was fought between Akbar (under Bairam Khan) and Hemu, not between Tipu and the Marathas.
  - slug: bpsc-68-q046
    difficulty: medium
    stem: During the Delhi Sultanate, the designation ‘Muqaddam or Chaudhari’ was used for
    options:
      A: revenue officials
      B: village accountant
      C: village headman
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Under the Sultanate, the muqaddam or chaudhari was the village headman.
  - slug: bpsc-68-q047
    difficulty: medium
    stem: "*Tabaqat-i-Akbari*, which has been sometimes considered more reliable than Abul Fazl’s *Akbarnama*, was written by"
    options:
      A: Nizamuddin Ahmad
      B: Abdul Hamid Lahori
      C: Gulbadan Begum
      D: More than one of the above
      E: None of the above
    answer: A
    explanation: Tabaqat-i-Akbari was written by Khwaja Nizamuddin Ahmad.
  - slug: bpsc-68-q048
    difficulty: medium
    stem: Who among the following famous rulers founded a suburban township of Nagalapuram, near Vijayanagara, after his mother’s name?
    options:
      A: Harihara
      B: Bukka
      C: Krishnadevaraya
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Krishnadevaraya founded Nagalapuram near Vijayanagara and named it after his mother, Nagala Devi.
  - slug: bpsc-68-q049
    difficulty: medium
    stem: In 1940, Patna Women’s College was founded by which of the following societies?
    options:
      A: Society of Jesus
      B: Irish Christian Brothers
      C: Sisters of the Apostolic Carmel
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Patna Women's College was founded in 1940 by the Sisters of the Apostolic Carmel.
  - slug: bpsc-68-q050
    difficulty: medium
    stem: Who among the following headed the two Boundary Commissions set up to delineate the international frontiers between India and Pakistan in 1947?
    options:
      A: A. P. Moon
      B: A. V. Alexander
      C: Cyril Radcliffe
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Sir Cyril Radcliffe chaired both the Punjab and the Bengal Boundary Commissions.
  - slug: bpsc-68-q051
    difficulty: medium
    stem: Who introduced the system of Mahalwari Settlement in Bengal?
    options:
      A: Lord Cornwallis
      B: Holt Mackenzie
      C: Lord Hastings
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Holt Mackenzie proposed the Mahalwari system (Regulation VII of 1822) for the North-Western Provinces of the Bengal Presidency.
  - slug: bpsc-68-q052
    difficulty: medium
    stem: In 1940, Vinoba Bhave started individual Satyagraha from
    options:
      A: Nadiad in Kheda district, Gujarat
      B: Pavnar, Maharashtra
      C: Punnapra-Vayalar, Kerala
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: Vinoba Bhave, the first individual satyagrahi, began on 17 Oct 1940 from Pavnar, near Wardha.
  - slug: bpsc-68-q053
    difficulty: medium
    stem: The Congress took a critical stand over the Montford Reforms in 1918, which led to break up with the old moderate remnants (Sapru, Jayakar and Chintamani) who formed the
    options:
      A: Servants of India Society
      B: Swaraj Party
      C: Indian National Liberal Federation
      D: More than one of the above
      E: None of the above
    answer: C
    explanation: Moderates led by Surendranath Banerjee, Sapru and others left Congress and formed the Indian National Liberal Federation in 1918-19.
  - slug: bpsc-68-q054
    difficulty: medium
    stem: |-
      The Cabinet Mission was sent to India for which of the following?

      1. To establish a national government
      2. To work out a constitutional arrangement for the transfer of power
      3. To work out the details of Jinnah’s demand for Pakistan
    options:
      A: 1 only
      B: 2 only
      C: 3 only
      D: More than one of the above
      E: None of the above
    answer: B
