      | 44 | 49 | 37 |
      |---|---|---|
      | 52 | ? | 41 |
      | 58 | 35 | 53 |

      *(Figure: A 3×3 grid of numbers (rows: 44, 49, 37 / 52, ?, 41 / 58, 35, 53) with the centre cell missing; transcribed above as a table.)*
    options:
      A: "56"
      B: "77"
      C: "66"
      D: More than one of the above
      E: None of the above
    answer: B
    explanation: "Middle = (left - right) x 7: (44 - 37) x 7 = 49, (58 - 53) x 7 = 35, so (52 - 41) x 7 = 77."
