  - slug: bpsc-66-q034
    difficulty: medium
    stem: Which Indian cricketer along with M. S. Dhoni announced retirement from the international cricket on 15th August, 2020?
    options:
      A: Suresh Raina
      B: Harbhajan Singh
      C: Bhuvneshwar Kumar
      D: Rohit Sharma
      E: None of the above/More than one of the above
