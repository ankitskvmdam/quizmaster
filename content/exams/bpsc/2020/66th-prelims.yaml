  - slug: bpsc-66-q035
    difficulty: medium
    stem: Who has been appointed as the Chairperson of the National School of Drama recently?
    options:
      A: Mahesh Bhatt
      B: Akshay Kumar
      C: Anupam Kher
      D: Paresh Rawal
      E: None of the above/More than one of the above
