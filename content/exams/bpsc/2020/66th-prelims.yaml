    difficulty: medium
    stem: When did the Election Commission of India issue a Press Note for the General Election to the Legislative Assembly of Bihar, 2020?
    options:
      A: 23rd September, 2020
      B: 24th September, 2020
      C: 25th September, 2020
      D: 26th September, 2020
      E: None of the above/More than one of the above
    answer: C
    explanation: The Election Commission announced the Bihar Assembly election schedule in a press note dated 25 September 2020.
  - slug: bpsc-66-q043
    difficulty: medium
    stem: In which State, 'Ghar Tak Fiber' Scheme has been launched on 21st September, 2020 through a video conference?
