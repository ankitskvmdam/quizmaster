  - slug: bpsc-66-q050
    difficulty: medium
    stem: Which Arab state has started first nuclear power plant?
    options:
      A: Iraq
      B: Saudi Arabia
      C: United Arab Emirates
      D: Egypt
      E: None of the above/More than one of the above
    answer: C
    explanation: The UAE's Barakah nuclear plant began operating in 2020, the first in the Arab world.
  - slug: bpsc-66-q051
    difficulty: medium
    stem: Which was the first Arab state to sign peace deal with Israel?
    options:
      A: Egypt
      B: Jordan
      C: Bahrain
      D: Sudan
      E: None of the above/More than one of the above
    answer: A
    explanation: Egypt signed a peace treaty with Israel in 1979, the first Arab state to do so.
  - slug: bpsc-66-q052
    difficulty: medium
    stem: Which country assumed the role of Chairman of the International Labour Organization's Governing Body for the period of October 2020 till June 2021?
    options:
      A: Japan
      B: New Zealand
      C: Australia
      D: India
