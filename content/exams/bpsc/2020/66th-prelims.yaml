  - slug: bpsc-66-q033
    difficulty: medium
    stem: Which athlete scored first position in the London Marathon held on 4th October, 2020?
    options:
      A: Eliud Kipchoge
      B: Shura Kitata
      C: Vincent Kipchumba
      D: Sisay Lemma
