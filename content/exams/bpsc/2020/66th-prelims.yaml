  - slug: bpsc-66-q040
    difficulty: medium
    stem: How many Indian beaches have been recommended for the Blue Flag Certification recently?
    options:
      A: Six
      B: Seven
      C: Eight
      D: Nine
      E: None of the above/More than one of the above
    answer: C
    explanation: In September 2020 India recommended eight beaches for the Blue Flag certification, and all eight received it in October 2020.
  - slug: bpsc-66-q041
    difficulty: medium
    stem: Ram Vilas Paswan started his political career from which political party?
    options:
      A: Janata Party
      B: Bharatiya Lok Dal
      C: Samyukta Socialist Party
      D: Praja Socialist Party
