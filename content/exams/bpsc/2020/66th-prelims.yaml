      E: None of the above/More than one of the above
    answer: E
    explanation: The final key changed this from A to E, treating more than one statement as a valid description of CFMS (for example A and D). CFMS replaced CTMIS from 1 April 2019 to put all State financial transactions online.
  - slug: bpsc-66-q122
    difficulty: medium
    stem: The Government of India conferred the Krishi Karman Award to Bihar State on 2nd January, 2020. This award was given for
    options:
      A: production and productivity of maize and wheat
      B: food grain production
      C: production of rice
      D: production of oilseeds
      E: None of the above/More than one of the above
    answer: A
    explanation: Bihar's Krishi Karman Award (2017-18), presented on 2 January 2020, was for maize and wheat production and productivity.
  - slug: bpsc-66-q123
    difficulty: medium
    stem: Bihar Government launched a new scheme 'Satat Jivikoparjan Yojana' in August 2018. The objective of this scheme is
    options:
      A: to provide unemployment allowance to youth
      B: to provide employment in rural areas through local bodies
      C: to provide sustainable income generating assets to extremely poor households
      D: to provide free training for skill upgradation of youth
      E: None of the above/More than one of the above
    answer: E
    explanation: |-
      **Disputed.** BPSC's final key says E; our check suggests C.

      The final key changed this from C to E, without published reasons. The scheme's stated aim is to give sustainable income-generating assets to extremely poor households, which is option C.
  - slug: bpsc-66-q124
    difficulty: medium
    stem: Which of the following is *not* included in Seven Resolves (Saat Nishchay) of Bihar Government?
    options:
      A: Women employment
      B: Clean drinking water
      C: Supply of electricity to all households
      D: Child welfare
      E: None of the above/More than one of the above
    answer: D
    explanation: The Saat Nishchay include women's reservation in jobs, Har Ghar Bijli and Har Ghar Nal ka Jal; child welfare is not one of them.
  - slug: bpsc-66-q125
    difficulty: medium
    stem: The per capita Net State Domestic Product at constant prices for Bihar is less than the country. In the year 2018–19, it was
    options:
      A: 75 percent of the national average
      B: 60 percent of the national average
      C: 50 percent of the national average
      D: 33 percent of the national average
      E: None of the above/More than one of the above
    answer: D
    explanation: Bihar's per capita NSDP is about one-third of the national average (Bihar Economic Survey).
  - slug: bpsc-66-q126
    difficulty: medium
    stem: In which of the following colleges, Gandhiji had studied?
    options:
      A: Samaldas College, Bhavnagar
      B: Dharmendrasinhji College, Rajkot
      C: Gujarat College, Ahmedabad
      D: Bahauddin College, Junagadh
      E: None of the above/More than one of the above
    answer: A
    explanation: Gandhiji briefly studied at Samaldas College, Bhavnagar in 1888.
  - slug: bpsc-66-q127
    difficulty: medium
    stem: Which of the following persons had participated actively in the Revolt of 1857?
    options:
      A: Nana Saheb (Kanpur)
      B: Begum Hazrat Mahal (Lucknow)
      C: Maulavi Ahmadullah (Faizabad)
      D: Begum Zeenat Mahal (Delhi)
      E: None of the above/More than one of the above
    answer: E
    explanation: "Nana Saheb, Begum Hazrat Mahal and Maulavi Ahmadullah all led the 1857 revolt, so more than one option is correct: E."
  - slug: bpsc-66-q128
    difficulty: medium
    stem: About which Act, Jawaharlal Nehru had said, “We were provided with a car with all brakes and no engine”?
    options:
      A: Act of 1858
      B: Act of 1909
      C: Act of 1919
      D: Act of 1935
      E: None of the above/More than one of the above
    answer: D
    explanation: Nehru described the Government of India Act, 1935 as 'a machine with strong brakes but no engine'.
  - slug: bpsc-66-q129
    difficulty: medium
    stem: For how many days did Dandi March last?
    options:
      A: 10 days
      B: 20 days
      C: 24 days
      D: 30 days
      E: None of the above/More than one of the above
    answer: C
    explanation: The Dandi March lasted 24 days (12 March-5/6 April 1930).
  - slug: bpsc-66-q130
    difficulty: medium
    stem: Who is the author of the popular song, *Sarfaroshi Ki Tamanna Ab Hamare Dil Mein Hai* ?
    options:
      A: Surya Sen
      B: Chandra Shekhar Azad
      C: Sardar Bhagat Singh
      D: Ram Prasad Bismil
      E: None of the above/More than one of the above
    answer: E
    explanation: "'Sarfaroshi ki tamanna' was written by Bismil Azimabadi of Patna and made famous by Ram Prasad Bismil, so none of A-D is the author: E."
  - slug: bpsc-66-q131
    difficulty: medium
    stem: Which movement was started as a reaction to the Partition of Bengal?
    options:
      A: Non-Cooperation Movement
      B: Civil Disobedience Movement
      C: Swadeshi Movement
      D: Purna Swaraj Movement
      E: None of the above/More than one of the above
    answer: C
    explanation: The Swadeshi Movement began in 1905 against the Partition of Bengal.
  - slug: bpsc-66-q132
    difficulty: medium
    stem: Who among the following advocates had appeared for the INA trials at Delhi in 1945–46?
    options:
      A: Dr. Rajendra Prasad
      B: Bhulabhai Desai
      C: K. M. Munshi
      D: Sardar Patel
