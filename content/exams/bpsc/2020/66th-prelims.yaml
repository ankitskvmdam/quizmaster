    answer: B
    explanation: C. R. Das was called Deshbandhu. Vinoba was the first individual satyagrahi, Wedderburn presided in 1889 and 1910, and India House was in London.
  - slug: bpsc-66-q135
    difficulty: medium
    stem: Which day was declared as 'Purna Swaraj Day' by the Indian National Congress?
