  - slug: bpsc-66-q141
    difficulty: medium
    stem: |-
      The missing number in the sequence

      4, 18, 48, 100, ?, 294, 448

      is
    options:
      A: "94"
      B: "164"
      C: "180"
      D: "192"
      E: None of the above/More than one of the above
    answer: C
    explanation: Terms are n^3 - n^2 for n = 2..8, so the missing term is 6^3 - 6^2 = 180.
  - slug: bpsc-66-q142
    difficulty: medium
    stem: "If ²ⁿC₃ : ⁿC₂ = 44 : 3, then the value of *n* is"
    options:
      A: "1"
      B: "6"
      C: "11"
      D: "4"
      E: None of the above/More than one of the above
    answer: B
    explanation: 2nC3 / nC2 = 4(2n-1)/3 = 44/3 gives 2n - 1 = 11, so n = 6.
  - slug: bpsc-66-q143
    difficulty: medium
    stem: If the average of *m* numbers is *n*² and that of *n* numbers is *m*², then the average of *m* + *n* numbers is
    options:
      A: n/m
      B: m/n
      C: mn
      D: m − n
      E: None of the above/More than one of the above
    answer: C
    explanation: Average = (m*n^2 + n*m^2)/(m + n) = mn.
  - slug: bpsc-66-q144
    difficulty: medium
    stem: In a group of athletic teams in a school, 21 are in the basketball team, 26 in the hockey team and 29 in the football team. If 14 play hockey and basketball, 12 play football and basketball, 15 play hockey and football, 8 play all the three games, then how many play football only?
    options:
      A: "10"
      B: "29"
      C: "21"
      D: "18"
      E: None of the above/More than one of the above
    answer: A
    explanation: Football only = 29 - 12 - 15 + 8 = 10.
  - slug: bpsc-66-q145
    difficulty: medium
    stem: Mohan can do a bit of work in 25 days which can be completed by Sohan in 20 days. Both together labour for 5 days and afterward Mohan leaves off. How long will Sohan take to complete the remaining work?
    options:
      A: 20 days
      B: 11 days
      C: 14 days
      D: 21 days
      E: None of the above/More than one of the above
    answer: B
    explanation: Together for 5 days they do 5(1/25 + 1/20) = 9/20. The remaining 11/20 at Sohan's 1/20 per day takes 11 days.
  - slug: bpsc-66-q146
    difficulty: medium
    stem: A clock is started at 12:00 noon. By 10 minutes past 5:00, the hour hand has turned through
    options:
      A: 135°
      B: 145°
      C: 155°
      D: 165°
      E: None of the above/More than one of the above
    answer: C
    explanation: "The hour hand moves 0.5 degrees per minute: 310 minutes x 0.5 = 155 degrees."
  - slug: bpsc-66-q147
    difficulty: medium
    stem: Which one of the following *cannot* be the square of a natural number?
    options:
      A: "26569"
      B: "143642"
      C: "30976"
      D: "28561"
      E: None of the above/More than one of the above
    answer: B
    explanation: No perfect square ends in 2, so 143642 cannot be a square.
  - slug: bpsc-66-q148
    difficulty: medium
    stem: |-
      Given that

      217*x* + 131*y* = 913

      131*x* + 217*y* = 827

      then *x* and *y* are respectively
    options:
      A: 5 and 7
      B: 3 and 2
      C: −5 and −7
      D: 2 and 5
      E: None of the above/More than one of the above
    answer: B
    explanation: Adding gives x + y = 5 and subtracting gives x - y = 1, so x = 3, y = 2.
  - slug: bpsc-66-q149
    difficulty: medium
    stem: ((598 + 479)² − (598 − 479)²) / (598 × 479) = ?
    options:
      A: "4"
      B: "10"
      C: "132"
      D: "8"
      E: None of the above/More than one of the above
    answer: A
    explanation: (a+b)^2 - (a-b)^2 = 4ab, so the expression equals 4.
  - slug: bpsc-66-q150
    difficulty: medium
    stem: The population of a town is 176400. If it increases annually at the rate of 5%, then what will be its population after two years?
    options:
      A: "194481"
      B: "296841"
      C: "394481"
      D: "396841"
      E: None of the above/More than one of the above
    answer: A
    explanation: 176400 x 1.05^2 = 194481.
