slug: 66th-prelims
title: BPSC 66th Prelims
date: 2020-12-27
label: Series A
marks:
  correct: 1
  wrong: 0
source: BPSC official question booklet and final answer key (bpsc.bihar.gov.in).
questions:
  - slug: bpsc-66-q001
    difficulty: medium
    stem: The radiations used in the treatment of muscle ache are
    options:
      A: infrared
      B: microwave
      C: UV
      D: X-ray
      E: None of the above/More than one of the above
    answer: A
    explanation: Infrared radiation produces heat in tissues, so infrared lamps are used to relieve muscle ache.
  - slug: bpsc-66-q002
    difficulty: medium
    stem: The total resistance of a circuit having two parallel resistors is 1·403 kilo-ohm. If one of the resistors is 2·0 kilo-ohm, then the other resistor will be
    options:
      A: 1·403 kilo-ohm
      B: 2·0 kilo-ohm
      C: 3·403 kilo-ohm
      D: 4·70 kilo-ohm
      E: None of the above/More than one of the above
    answer: D
    explanation: 1/R2 = 1/1.403 - 1/2.0 = 0.2128 per kilo-ohm, so R2 = 4.70 kilo-ohm.
  - slug: bpsc-66-q003
    difficulty: medium
    stem: On heating, the resistance of a semiconductor
    options:
      A: increases
      B: decreases
      C: remains same
      D: first increases and then decreases
      E: None of the above/More than one of the above
    answer: B
    explanation: "A semiconductor has a negative temperature coefficient: heating frees more charge carriers, so resistance decreases."
  - slug: bpsc-66-q004
    difficulty: medium
    stem: Faraday constant
    options:
      A: depends on the amount of the electrolyte
      B: depends on the current passed in the electrolyte
      C: depends on the volume of the solvent in which the electrolyte is dissolved
      D: is a universal constant
      E: None of the above/More than one of the above
    answer: D
    explanation: Faraday constant (about 96,485 C/mol) is the charge of one mole of electrons, a universal constant.
  - slug: bpsc-66-q005
    difficulty: medium
    stem: "'Light-year' is a unit of"
    options:
      A: time
      B: speed
      C: distance
      D: intensity of light
      E: None of the above/More than one of the above
    answer: C
    explanation: A light-year is the distance light travels in one year (about 9.46 x 10^12 km).
  - slug: bpsc-66-q006
    difficulty: medium
    stem: Which of the following does *not* change when light travels from one medium to another?
    options:
      A: Velocity
      B: Wavelength
      C: Frequency
      D: Refractive index
      E: None of the above/More than one of the above
    answer: C
    explanation: Frequency is set by the source and stays the same; speed and wavelength change on refraction.
  - slug: bpsc-66-q007
    difficulty: medium
    stem: The velocity of electromagnetic waves is
    options:
      A: 3×10⁸ m s⁻¹
      B: 3×10⁷ m s⁻¹
      C: 3×10⁶ m s⁻¹
      D: 3×10⁵ m s⁻¹
      E: None of the above/More than one of the above
    answer: A
    explanation: All electromagnetic waves travel in vacuum at c = 3 x 10^8 m/s.
  - slug: bpsc-66-q008
    difficulty: medium
    stem: The first man who placed his foot on the moon is
    options:
      A: Leonov
      B: Neil Armstrong
      C: Michael Collins
      D: James Van Allen
      E: None of the above/More than one of the above
    answer: B
    explanation: Neil Armstrong (Apollo 11, 20 July 1969) was the first person to step on the Moon.
  - slug: bpsc-66-q009
    difficulty: medium
    stem: The number of neutrons in the nucleus of plutonium nuclide (₉₄Pu²⁴²) is
    options:
      A: "94"
      B: "148"
      C: "242"
      D: "336"
      E: None of the above/More than one of the above
    answer: B
    explanation: Neutrons = mass number - atomic number = 242 - 94 = 148.
  - slug: bpsc-66-q010
    difficulty: medium
    stem: The highest viscosity among the following is of
    options:
      A: water
      B: air
      C: blood
      D: honey
      E: None of the above/More than one of the above
    answer: D
    explanation: Honey is far more viscous than blood, water or air.
  - slug: bpsc-66-q011
    difficulty: medium
    stem: Milk is a poor source of
    options:
      A: calcium
      B: protein
      C: vitamin C
      D: carbohydrate
      E: None of the above/More than one of the above
    answer: C
    explanation: Milk is rich in calcium, protein and carbohydrate (lactose) but has very little vitamin C.
  - slug: bpsc-66-q012
    difficulty: medium
    stem: The breath test conducted by police to check drunken driver has which one of the following on the filter paper?
    options:
      A: Potassium dichromate–sulfuric acid
      B: Potassium permanganate–sulfuric acid
      C: Silica gel coated with silver nitrate
      D: Turmeric
      E: None of the above/More than one of the above
    answer: A
    explanation: The breathalyser uses acidified potassium dichromate, which turns from orange to green when it oxidises ethanol.
  - slug: bpsc-66-q013
    difficulty: medium
    stem: Glucose is converted to ethyl alcohol by the enzyme
    options:
      A: maltase
      B: invertase
      C: zymase
      D: diastase
      E: None of the above/More than one of the above
    answer: C
    explanation: Zymase (from yeast) ferments glucose into ethyl alcohol and CO2.
  - slug: bpsc-66-q014
    difficulty: medium
    stem: Limewater is turned milky by
    options:
      A: CO
      B: CO₂
      C: O₂
      D: O₃
      E: None of the above/More than one of the above
    answer: B
    explanation: CO2 forms insoluble calcium carbonate with limewater, turning it milky.
  - slug: bpsc-66-q015
    difficulty: medium
    stem: The incomplete burning of petrol and diesel produces
    options:
      A: nitric oxide
      B: nitrogen dioxide
      C: carbon dioxide
      D: carbon monoxide
      E: None of the above/More than one of the above
    answer: D
    explanation: Incomplete combustion of hydrocarbon fuels in limited oxygen produces carbon monoxide.
  - slug: bpsc-66-q016
    difficulty: medium
    stem: The pH of a solution changes from 3 to 6. The H⁺ ion concentration will
    options:
      A: increase 3 times
      B: decrease 3 times
      C: decrease 10 times
      D: decrease 1000 times
      E: None of the above/More than one of the above
    answer: D
    explanation: "[H+] = 10^-pH, so going from pH 3 to pH 6 lowers [H+] by 10^3 = 1000 times."
  - slug: bpsc-66-q017
    difficulty: medium
    stem: A mixture of sand and naphthalene can be separated by
    options:
      A: sublimation
      B: distillation
      C: chromatography
      D: fractional distillation
      E: None of the above/More than one of the above
    answer: A
    explanation: Naphthalene sublimes on heating while sand does not, so sublimation separates them.
  - slug: bpsc-66-q018
    difficulty: medium
    stem: The numbers of sigma and pi bonds in benzene are
    options:
      A: 3, 3
      B: 3, 6
      C: 12, 3
      D: 12, 6
      E: None of the above/More than one of the above
    answer: C
    explanation: Benzene has 6 C-C and 6 C-H sigma bonds (12) and 3 pi bonds.
  - slug: bpsc-66-q019
    difficulty: medium
    stem: The elements present in urea are
    options:
      A: C, H, O
      B: C, N, O
      C: C, H, N
      D: C, H, N, O
      E: None of the above/More than one of the above
    answer: D
    explanation: Urea, CO(NH2)2, contains carbon, hydrogen, nitrogen and oxygen.
  - slug: bpsc-66-q020
    difficulty: medium
    stem: The poorest conductor of heat among the following is
    options:
      A: copper
      B: lead
      C: mercury
      D: zinc
      E: None of the above/More than one of the above
    answer: C
    explanation: Mercury's thermal conductivity (about 8 W/m K) is the lowest of these metals; lead is about 35, zinc about 116, copper about 400.
  - slug: bpsc-66-q021
    difficulty: medium
    stem: The vitamin which is effective in blood clotting is
    options:
      A: vitamin A
      B: vitamin B
      C: vitamin D
      D: vitamin K
      E: None of the above/More than one of the above
    answer: D
    explanation: Vitamin K is needed to make clotting factors such as prothrombin.
  - slug: bpsc-66-q022
    difficulty: medium
    stem: The female sex hormone is
    options:
      A: estrogen
      B: androgen
      C: insulin
      D: oxytocin
      E: None of the above/More than one of the above
    answer: A
    explanation: Estrogen is the principal female sex hormone; androgens are male hormones.
  - slug: bpsc-66-q023
    difficulty: medium
    stem: The Nobel Prize for developing treatment of Parkinson's disease was given to
    options:
      A: Arvid Carlsson
      B: John F. Enders
      C: Robert B. Laughlin
      D: Walter Kohn
      E: None of the above/More than one of the above
    answer: A
    explanation: Arvid Carlsson shared the 2000 Nobel Prize in Physiology or Medicine for discovering dopamine's role, which led to L-DOPA treatment of Parkinson's disease.
  - slug: bpsc-66-q024
    difficulty: medium
    stem: The malfunctioning of thyroid gland is due to the deficiency of
    options:
      A: vitamin A
      B: calcium
      C: iodine
      D: iron
      E: None of the above/More than one of the above
    answer: C
    explanation: Iodine is needed to make thyroid hormones; its deficiency causes goitre and thyroid malfunction.
  - slug: bpsc-66-q025
    difficulty: medium
    stem: The sensitive area of the human tongue to bitterness is
    options:
      A: tip
      B: middle part
      C: posterior part
      D: edge
      E: None of the above/More than one of the above
    answer: C
    explanation: Bitter taste is sensed mostly at the back (posterior part) of the tongue.
  - slug: bpsc-66-q026
    difficulty: medium
    stem: Ginger is a stem and not root because
    options:
      A: it stores food material
      B: it has nodes and internodes
      C: it grows horizontally in the soil
      D: it lacks chlorophyll
      E: None of the above/More than one of the above
    answer: B
    explanation: Ginger (a rhizome) has nodes and internodes, which are features of a stem, not a root.
  - slug: bpsc-66-q027
    difficulty: medium
    stem: The sweetest sugar among the following is
    options:
      A: fructose
      B: glucose
      C: maltose
      D: sucrose
      E: None of the above/More than one of the above
    answer: A
    explanation: Fructose is the sweetest natural sugar, sweeter than sucrose and glucose.
  - slug: bpsc-66-q028
    difficulty: medium
    stem: Among the following, which is *not* a true fruit?
    options:
      A: Apple
      B: Grape
      C: Date
      D: Plum
      E: None of the above/More than one of the above
    answer: A
    explanation: "Apple is a false fruit (pome): its fleshy part develops from the thalamus, not the ovary."
  - slug: bpsc-66-q029
    difficulty: medium
    stem: Legumes are highly nutritious because they are rich in
    options:
      A: fat
      B: protein
      C: oil
      D: starch
      E: None of the above/More than one of the above
    answer: B
    explanation: Legumes (pulses) are rich in protein.
  - slug: bpsc-66-q030
    difficulty: medium
    stem: Clove, a spice, is obtained from which part of the plant?
    options:
      A: Fruit
      B: Stem
      C: Root
      D: Flower bud
      E: None of the above/More than one of the above
    answer: D
    explanation: Cloves are the dried flower buds of Syzygium aromaticum.
  - slug: bpsc-66-q031
    difficulty: medium
    stem: Who has been appointed by the Board of Control for Cricket in India as the Head of All India Women's Selection Committee?
    options:
      A: Mithu Mukherjee
      B: Neetu David
      C: Renu Margrate
      D: V. Kalpana
      E: None of the above/More than one of the above
    answer: B
    explanation: In September 2020 BCCI named former India spinner Neetu David as chairperson of the women's selection committee.
  - slug: bpsc-66-q032
    difficulty: medium
    stem: Who has won the Women's Singles US Open Tennis Tournament, 2020?
    options:
      A: Naomi Osaka
      B: Bianca Andreescu
      C: Sofia Kenin
      D: K. Pliskova
      E: None of the above/More than one of the above
