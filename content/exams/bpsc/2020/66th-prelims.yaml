  - slug: bpsc-66-q059
    difficulty: medium
    stem: Rafale fighter aircraft has been formally inducted into the Indian Air Force at which Air Force Station?
    options:
      A: Hindon
      B: Sarsawa
      C: Ambala
      D: Amritsar
      E: None of the above/More than one of the above
    answer: C
    explanation: The Rafale jets were formally inducted into the IAF at Air Force Station Ambala on 10 September 2020.
  - slug: bpsc-66-q060
    difficulty: medium
    stem: The name of India's first indigenous anti-radiation missile is
    options:
      A: Tandav
      B: Trinetra
      C: Saksham
      D: Rudram
