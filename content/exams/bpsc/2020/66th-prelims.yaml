  - slug: bpsc-66-q048
    difficulty: medium
    stem: Which of the following has topped in the Human Capital Index, 2020?
    options:
      A: Japan
      B: South Korea
      C: Singapore
      D: Hong Kong
      E: None of the above/More than one of the above
    answer: C
    explanation: Singapore ranked first in the World Bank's Human Capital Index 2020.
  - slug: bpsc-66-q049
    difficulty: medium
    stem: Recently in USA, 'Operation MAGA' is related to
    options:
