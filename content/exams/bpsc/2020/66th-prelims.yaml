    answer: B
    explanation: Raghuvansh Prasad Singh first entered the Lok Sabha in 1996, the 11th Lok Sabha, from Vaishali.
  - slug: bpsc-66-q045
    difficulty: medium
    stem: Which among the following is *not* a member of the Quadrilateral Security Dialogue—an informal strategic forum?
    options:
      A: India
      B: Japan
      C: China
      D: Australia
      E: None of the above/More than one of the above
    answer: C
    explanation: The Quad consists of India, Japan, Australia and the USA; China is not a member.
