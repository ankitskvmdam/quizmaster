  - slug: bpsc-66-q054
    difficulty: medium
    stem: On the occasion of the first anniversary of the Fit India Movement, who gave the Mantra, 'Fitness Ki Dose, Aadha Ghanta Roz (Fitness Dose, Half an Hour Daily)'?
