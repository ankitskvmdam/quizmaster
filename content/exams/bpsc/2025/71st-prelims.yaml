slug: 71st-prelims
title: BPSC 71st Prelims
date: 2025-09-13
label: Series E
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q11, Q69, Q75, Q96, Q118."
questions:
  - slug: bpsc-71-q001
    difficulty: medium
    stem: In the following question, out of four words given below, three are alike in some manner and fourth word is different. Find the different one.
    options:
      A: MICROSCOPE
      B: TELESCOPE
      C: STETHOSCOPE
      D: PERISCOPE
    answer: C
    explanation: Microscope, telescope and periscope are optical instruments for seeing; a stethoscope is for listening.
  - slug: bpsc-71-q002
    difficulty: medium
    stem: SPRING is written in a code as UNUFRC. How will the word MOBILE be mentioned in that code language?
    options:
      A: OMEFPA
      B: OMPGNC
      C: MPQSUL
      D: SEGRFT
    answer: A
    explanation: "Letter shifts are +2, −2, +3, −3, +4, −4 (S→U, P→N, R→U, I→F, N→R, G→C). Applied to MOBILE: M→O, O→M, B→E, I→F, L→P, E→A = OMEFPA."
  - slug: bpsc-71-q003
    difficulty: medium
    stem: Mukesh said to his friend, “Rita is the mother of my son’s wife’s daughter”. How is Mukesh related to Rita?
    options:
      A: Father
      B: Son-in-law
      C: Son
      D: Father-in-law
    answer: D
    explanation: Mukesh’s son’s wife’s daughter is his granddaughter; her mother Rita is his son’s wife (daughter-in-law), so Mukesh is her father-in-law.
  - slug: bpsc-71-q004
    difficulty: medium
    stem: Ram goes North, turn right, then goes right again and then goes to left. In which direction Ram is now?
    options:
      A: EAST
      B: SOUTH
      C: NORTH
      D: WEST
    answer: A
    explanation: North → right = East → right = South → left = East.
  - slug: bpsc-71-q005
    difficulty: medium
    stem: Writing in Alphabetical order, which name of the following will appear in the last?
    options:
      A: Mahinder
      B: Mohinder
      C: Mohender
      D: Mahendra
    answer: B
    explanation: "Alphabetical order: Mahendra, Mahinder, Mohender, Mohinder; Mohinder comes last."
  - slug: bpsc-71-q006
    difficulty: medium
    stem: Nitin is 7 ranks ahead of Joginder in a class of 39. If Joginder’s rank is 17th from the last, what is Nitin’s rank from the beginning?
    options:
      A: 17th
      B: 15th
      C: 18th
      D: 16th
    answer: D
    explanation: Joginder is 17th from the last in 39, i.e. 39 − 17 + 1 = 23rd from the start; Nitin, 7 ranks ahead, is 16th.
  - slug: bpsc-71-q007
    difficulty: medium
    stem: "If + means ×, × means −, ÷ means + and − means ÷, then 175 − 25 ÷ 5 + 20 × 3 + 10 equals to:"
    options:
      A: "77"
      B: "87"
      C: "140"
      D: "70"
    answer: A
    explanation: "After substitution: 175 ÷ 25 + 5 × 20 − 3 × 10 = 7 + 100 − 30 = 77."
  - slug: bpsc-71-q008
    difficulty: medium
    stem: Rahul is 3 times as old as Seema. Laxmi was twice as old as Rahul four years ago. In four year’s time, Rahul will be 31. What are the present ages of Seema and Laxmi?
    options:
      A: 10, 50
      B: 9, 52
      C: 9, 45
      D: 9, 50
    answer: D
    explanation: Rahul is 31 − 4 = 27, so Seema is 9. Four years ago Laxmi was 2 × 23 = 46, so she is 50 now.
  - slug: bpsc-71-q009
    difficulty: medium
    stem: |-
      Find the missing number from the given alternatives:

      | 28 | 20 | 7 |
      |---|---|---|
      | 84 | ? | 12 |
      | 45 | 25 | 9 |

      *(Figure: A 3×3 grid of numbers (rows: 28 20 7 / 84 ? 12 / 45 25 9), reproduced as a table.)*
    options:
      A: "30"
      B: "35"
      C: "20"
      D: "25"
    answer: B
    explanation: "In each row (first ÷ third) × 5 = middle: 28/7 × 5 = 20, 45/9 × 5 = 25, so 84/12 × 5 = 35."
  - slug: bpsc-71-q010
    difficulty: medium
    stem: RAIN is written in a code as 8\$%6 and MORE is mentioned as 7#8@. How will REMAIN be mentioned in code language?
    options:
      A: "@\\$86%7"
      B: "%7@%6#"
      C: 86@\$#7
      D: 8@7\$%6
    answer: D
    explanation: From the codes R=8, A=\$, I=%, N=6, M=7, E=@, so REMAIN = 8@7\$%6.
  - slug: bpsc-71-q012
    difficulty: medium
    stem: Which districts in Bihar will benefit from the Kosi Mechi Link Project?
    options:
      A: Patna, Nalanda, Gaya, Siwan
      B: Darbhanga, Muzaffarpur, Sitamarhi, Begusarai
      C: Araria, Purnea, Kishanganj, Katihar
      D: More than one of the above
    answer: C
    explanation: "The Kosi–Mechi intra-state link irrigates the Mahananda basin in north-east Bihar: Araria, Purnea, Kishanganj and Katihar."
  - slug: bpsc-71-q013
    difficulty: medium
    stem: Which Indian languages are accorded the status of Classical Language?
    options:
      A: Telugu
      B: Marathi
      C: Bengali
      D: More than one of the above
    answer: D
    explanation: Telugu became a classical language in 2008; Marathi and Bengali were added in October 2024, so all three apply.
  - slug: bpsc-71-q014
    difficulty: medium
    stem: Which organisation recognized the Nagi bird sanctuary Site as an Important Bird and Biodiversity Area (IBA)?
    options:
      A: UNESCO
      B: World Wildlife Fund
      C: Bird Life International
      D: More than one of the above
    answer: C
    explanation: BirdLife International (through its partner BNHS) recognised Nagi Dam bird sanctuary in Jamui as an IBA.
  - slug: bpsc-71-q015
    difficulty: medium
    stem: Where was the National Panchayati Raj Day 2025 event organised?
    options:
      A: Patna
      B: Madhubani
      C: Gaya
      D: More than one of the above
    answer: B
    explanation: The national event on 24 April 2025 was held at Jhanjharpur in Madhubani, Bihar, addressed by the Prime Minister.
  - slug: bpsc-71-q016
    difficulty: medium
    stem: What is the primary objective of the Lunar Trailblazer mission?
    options:
      A: To detect and map water on the Moon’s surface
      B: To create a 3D model of the entire Moon
      C: To test new lunar rovers
      D: More than one of the above
    answer: A
    explanation: NASA’s Lunar Trailblazer smallsat was designed to detect and map water on the lunar surface.
  - slug: bpsc-71-q017
    difficulty: medium
    stem: "Afrikaners indicate the people :"
    options:
      A: Of Indo-African descent in the U.S.
      B: Indigenous tribal communities in Africa
      C: The white minority group in South Africa
      D: More than one of the above
    answer: C
    explanation: Afrikaners are the white, Afrikaans-speaking minority of mainly Dutch descent in South Africa.
  - slug: bpsc-71-q018
    difficulty: medium
    stem: What is the name of the 16th-century stepwell that the Archaeological Survey of India recently conserved in collaboration with the World Monuments Fund India?
    options:
      A: Agrasen ki Baoli
      B: Rajon ki Baoli
      C: Chauki Bavdi
      D: More than one of the above
    answer: B
    explanation: ASI and World Monuments Fund India restored the 16th-century Rajon ki Baoli in Mehrauli, Delhi (2025).
  - slug: bpsc-71-q019
    difficulty: medium
    stem: What is the name of the city mayor who proclaimed April 14, 2025, as Dr. B. R. Ambedkar Day in New York City?
    options:
      A: Bill de Blasio
      B: Eric Adams
      C: Sadiq Khan
      D: More than one of the above
    answer: B
    explanation: New York City Mayor Eric Adams proclaimed 14 April 2025 as Dr. B. R. Ambedkar Day.
  - slug: bpsc-71-q020
    difficulty: medium
    stem: What is the permanent slogan for the Eurovision Song Contest?
    options:
      A: Music Unites Us
      B: Together in Song
      C: United By Music
      D: More than one of the above
    answer: C
    explanation: “United By Music” was adopted as the permanent slogan of the Eurovision Song Contest from 2024.
  - slug: bpsc-71-q021
    difficulty: medium
    stem: What is true of the GSLV-F15 mission by ISRO?
    options:
      A: It carried the NVS-02 satellite
      B: It marked ISRO’s 101st launch from Sriharikota
      C: It marked ISRO’s 100th launch from Sriharikota
      D: More than one of the above
    answer: D
    explanation: GSLV-F15 (29 January 2025) carried NVS-02 and was ISRO’s 100th launch from Sriharikota, so A and C are both true.
  - slug: bpsc-71-q022
    difficulty: medium
    stem: What is true of the 18th G20 Summit?
    options:
      A: It was held in Rio de Janeiro
      B: "Its theme was : Building a Just World and a Sustainable Planet"
      C: The Rio de Janeiro Declaration emphasised the taxation of billionaires
      D: None of the above
    answer: D
    explanation: The 18th G20 Summit was in New Delhi (2023). Rio de Janeiro, the “Just World and Sustainable Planet” theme and the billionaire-tax language belong to the 19th summit (2024), so none of A–C fits.
  - slug: bpsc-71-q023
    difficulty: medium
    stem: "The UN climate conference held in Baku in 2024 concluded with an agreement that:"
    options:
      A: Aims to ban fossil fuels globally by 2030
      B: Calls on developed countries to provide at least \$500 billion annually to developing nations by 2030
      C: Calls on developed countries to provide at least \$300 billion annually to developing nations by 2035
      D: More than one of the above
    answer: C
    explanation: COP29 in Baku set a new goal of at least USD 300 billion a year from developed to developing countries by 2035.
  - slug: bpsc-71-q024
    difficulty: medium
    stem: Awarded the Nobel Prize in Literature in 2024, Han Kang’s novel ‘The Vegetarian’ won which other prestigious award?
    options:
      A: Pulitzer Prize
      B: Pen America Literary Awards
      C: International Booker Prize
      D: More than one of the above
    answer: C
    explanation: The Vegetarian (tr. Deborah Smith) won the International Booker Prize in 2016.
  - slug: bpsc-71-q025
    difficulty: medium
    stem: Which glacier of Nepal among the following has been declared ‘dead’ in May 2025?
    options:
      A: Khumbu Glacier
      B: Yala Glacier
      C: Imja Glacier
      D: More than one of the above
    answer: B
    explanation: Nepal’s Yala Glacier (Langtang) was declared “dead” at a memorial ceremony in May 2025.
  - slug: bpsc-71-q026
    difficulty: medium
    stem: According to the UNDP Human Development Index (HDI) Report 2025, life expectancy in India increased from 58.6 years in 1990 to how many years in 2023?
    options:
      A: 72 years
      B: 73 years
      C: 74 years
      D: More than one of the above
    answer: A
    explanation: HDR 2025 gives India’s life expectancy as about 72 years in 2023 (up from 58.6 in 1990).
  - slug: bpsc-71-q027
    difficulty: medium
    stem: In which city was the AI Action Summit held in February 2025?
    options:
      A: Bengaluru
      B: Paris
      C: Rome
      D: More than one of the above
    answer: B
    explanation: The AI Action Summit was held in Paris on 10–11 February 2025, co-chaired by France and India.
  - slug: bpsc-71-q028
    difficulty: medium
    stem: At the 96th Academy Awards (2024), Emma Stone won the Oscar for Actress in a Leading Role for her performance in which film?
    options:
      A: La La Land
      B: Poor Things
      C: The Favourite
      D: More than one of the above
    answer: B
    explanation: Emma Stone won Best Actress at the 96th Oscars for Poor Things.
  - slug: bpsc-71-q029
    difficulty: medium
    stem: Which Gujarati film won the 70th National Film Award for Best Feature Film promoting national, social and environmental values?
    options:
      A: Hellaro
      B: Chhello Show
      C: Kutch Express
      D: More than one of the above
    answer: C
    explanation: Kutch Express won the 70th National Film Award for Best Feature Film Promoting National, Social and Environmental Values.
  - slug: bpsc-71-q030
    difficulty: medium
    stem: Which of the following individuals or organisations was a recipient of the Ramon Magsaysay Award 2024?
    options:
      A: Phuntsho, Karma
      B: Rural Doctors Movement
      C: Miyazaki Hayao
      D: More than one of the above
    answer: D
    explanation: The 2024 Magsaysay awardees included Karma Phuntsho, Rural Doctors Movement (Thailand) and Miyazaki Hayao, so all three options are recipients.
  - slug: bpsc-71-q031
    difficulty: medium
    stem: Which of the following statements are true about Akashteer?
    options:
      A: Akashteer is the core of the Indian Army’s Air Defence (AAD) system
      B: It seamlessly integrates India’s larger C4ISR
      C: It reflects a strategic shift from passive defence to proactive retaliation
      D: More than one of the above
    answer: D
    explanation: Akashteer is the Army’s automated air-defence control and reporting system, integrated with the wider C4ISR network and credited with a proactive posture (Operation Sindoor), so all three statements hold.
  - slug: bpsc-71-q032
    difficulty: medium
    stem: Which of the following defence platforms are part of India’s growing indigenous military ecosystem supported by the Make in India initiative?
    options:
      A: F-35 Lightning II
      B: Main Battle Tank (MBT) Arjun
      C: Advanced Towed Artillery Gun System (ATAGS)
      D: More than one of the above
    answer: D
    explanation: MBT Arjun and ATAGS are indigenous Make in India platforms; the F-35 is an American aircraft, so B and C apply.
  - slug: bpsc-71-q033
    difficulty: medium
    stem: Which day is observed as Holocaust Memorial Day?
    options:
      A: January 15
      B: January 27
      C: February 10
      D: More than one of the above
    answer: B
    explanation: International Holocaust Remembrance Day is 27 January, the anniversary of the liberation of Auschwitz.
  - slug: bpsc-71-q034
    difficulty: medium
    stem: What is the title of the book by Banu Mushtaq that won the 2025 International Booker Prize?
    options:
      A: Light of the Heart
      B: Heart Lamp
      C: Soul Lantern
      D: More than one of the above
    answer: B
    explanation: Banu Mushtaq’s Heart Lamp (tr. Deepa Bhasthi) won the 2025 International Booker Prize.
  - slug: bpsc-71-q035
    difficulty: medium
    stem: According to the Indus Waters Treaty, the three eastern rivers are allocated to India. Which of the following is not one of them?
    options:
      A: Jhelum
      B: Ravi
      C: Sutlej
      D: More than one of the above
    answer: A
    explanation: The eastern rivers given to India are Ravi, Beas and Sutlej; Jhelum is a western river.
  - slug: bpsc-71-q036
    difficulty: medium
    stem: |-
      Which of the following statement/s is/are correct about Capability Poverty Measure (CPM) developed by the UNDP?

      1. CPM includes child malnutrition as a proxy for lack of health and nourishment.
      2. Female illiteracy is included to reflect deprivation in education and knowledge.
      3. It considers male illiteracy as a key indicator of capability poverty.
      4. It includes lack of access to clean drinking water as an important indicator of capability poverty.

      Select the correct answer using the codes given below :
    options:
      A: 1 and 2
      B: 1, 2 and 3
      C: Only 1
      D: More than one of the above
    answer: A
    explanation: UNDP’s CPM (HDR 1996) uses underweight children under five, births unattended by trained personnel and female illiteracy; male illiteracy and drinking water are not in it, so 1 and 2.
  - slug: bpsc-71-q037
    difficulty: medium
    stem: Which of the following is not among the top ten principal commodities of India’s export during April-September 2024-25?
    options:
      A: Petroleum Products
      B: Iron and Steel
      C: Basmati Rice
      D: More than one of the above
    answer: C
    explanation: Basmati rice is not a separate entry among the top ten principal export commodities for April–September 2024-25; petroleum products and iron and steel are.
  - slug: bpsc-71-q038
    difficulty: medium
    stem: "According to India State of Forest Report 2023 (ISFR 2023) :"
    options:
      A: The total forest and tree cover of the country is 15% of the geographical area of the country.
      B: Top three states having largest recorded forest area (RFA) are Jharkhand, Andaman & Nicobar and Manipur.
      C: The maximum tree cover has been found in the State of Maharashtra followed by Rajasthan and Uttar Pradesh.
      D: More than one of the above
    answer: C
    explanation: ISFR 2023 puts forest and tree cover at about 25% (not 15%), and the largest RFA states are not those listed; it reports maximum tree cover in Maharashtra, then Rajasthan and Uttar Pradesh.
  - slug: bpsc-71-q039
    difficulty: medium
    stem: Which of the following countries had greater share than India in the global services export in 2023?
    options:
      A: Russia
      B: Ireland
      C: Indonesia
      D: More than one of the above
    answer: B
    explanation: Ireland’s share of world services exports (about 5%) exceeded India’s (about 4.3–4.6%) in 2023; Russia and Indonesia were far smaller.
  - slug: bpsc-71-q040
    difficulty: medium
    stem: Which of the following statement/s is/are **NOT CORRECT** about the U-WIN portal of Ministry of Health and Family welfare?
    options:
      A: It provides QR-based e-vaccination certificates
      B: It facilitates the creation of Ayushman Bharat Health Accounts (ABHA) for parents and children.
      C: The portal is accessible in 11 regional languages
      D: None of the above
    answer: D
    explanation: U-WIN gives QR-based e-vaccination certificates, creates ABHA IDs and is available in 11 regional languages, so none of the statements is incorrect.
  - slug: bpsc-71-q041
    difficulty: medium
    stem: Which organization jointly developed the National Urban Innovation Stack (NUIS) Digital Blueprint with the Ministry of Housing and Urban Affairs (MoHUA)?
    options:
      A: Ministry of Electronics and IT
      B: National Institute of Urban Affairs (NIUA)
      C: NITI Aayog
      D: More than one of the above
    answer: B
    explanation: The NUIS digital blueprint was developed by MoHUA together with the National Institute of Urban Affairs (NIUA).
  - slug: bpsc-71-q042
    difficulty: medium
    stem: Which state had the highest constructed road length under Bharatmala Pariyojana as of 31st October 2024?
    options:
      A: Rajasthan
      B: Uttar Pradesh
      C: Maharashtra
      D: More than one of the above
    answer: A
    explanation: Ministry data (Lok Sabha reply, December 2024) on Bharatmala progress to 31 October 2024 shows Rajasthan with the most constructed length.
  - slug: bpsc-71-q043
    difficulty: medium
    stem: Before the launch of Kisan Rin Portal (KRP), farmers used to submit manual claims under the Interest Subvention and Prompt Repayment Incentive schemes to which of the following institution/s?
    options:
      A: Ministry of Agriculture and Farmers Welfare and NABARD
      B: Reserve Bank of India and NABARD
      C: National Payments Corporation of India and Reserve Bank of India
      D: More than one of the above
    answer: B
    explanation: Before KRP, lending institutions filed manual interest-subvention and prompt-repayment claims with the RBI (for public and private banks) and NABARD (for RRBs and co-operative banks).
  - slug: bpsc-71-q044
    difficulty: medium
    stem: "India’s foreign exchange reserves :"
    options:
      A: Increased to around USD 640 billion as of the end of December 2024
      B: Are seventh largest in the world
      C: Decreased caused by a BoP deficit of around USD 24 billion in 2024
      D: More than one of the above
    answer: A
    explanation: "Economic Survey 2024-25: reserves were about USD 640 billion at end-December 2024, the fourth largest in the world (so B is wrong)."
  - slug: bpsc-71-q045
    difficulty: medium
    stem: As per NFHS-5 data, which of the following state(s) recorded less than 6% of the population as multidimensionally poor in 2019-20?
    options:
      A: Jammu and Kashmir
      B: Himachal Pradesh
      C: Uttar Pradesh
      D: More than one of the above
    answer: B
    explanation: NITI Aayog’s National MPI from NFHS-5 puts Himachal Pradesh at about 4.9% poor, UP at about 23%. The final key counts only states, and J&K had become a UT in October 2019, so only Himachal Pradesh qualifies.
  - slug: bpsc-71-q046
    difficulty: medium
    stem: |-
      Match List-I with List-II

      | List-I | List-II |
      |---|---|
      | a) Perform, Achieve and Trade (PAT) scheme | 1) Introduced in the Union Budget for 2023-24 |
      | b) Mangrove Initiative for Shoreline Habitats & Tangible Incomes (MISHTI) | 2) Aims to reduce emissions in energy-intensive industries |
      | c) The Lifestyle for Environment (LiFE) initiative | 3) Launched in 2019 as a national-level strategy |
      | d) National Clean Air Programme (NCAP) | 4) Launched at COP26 in Glasgow in November 2021 |
    options:
      A: a-1, b-3, c-2, d-4
      B: a-3, b-4, c-1, d-2
      C: a-2, b-1, c-4, d-3
      D: More than one of the above
    answer: C
    explanation: PAT targets energy-intensive industries; MISHTI was announced in Budget 2023-24; LiFE was launched at COP26, Glasgow (2021); NCAP was launched in 2019.
  - slug: bpsc-71-q047
    difficulty: medium
    stem: "According to Annual PLFS 2023-24 report :"
    options:
      A: There is greater increase in Labour Force Participation Rate (LFPR) of rural females as compared to urban females since 2021-22
      B: Among the 36 states and union territories, 90% states have a Workforce Participation Rate (WPR) (for all ages) below the national average of 43.7 percent
      C: The share of female workers in agriculture has decreased significantly from 2017-18 to 2023-24
      D: More than one of the above
    answer: A
    explanation: "PLFS 2023-24: rural female LFPR (about 35.5%) rose far more than urban female LFPR (about 22–25%) since 2021-22. The share of women working in agriculture rose, not fell, and B is false."
  - slug: bpsc-71-q048
    difficulty: medium
    stem: Which of the following was **NOT** the outcome of Science, Technology and Innovation Policy 2020?
    options:
      A: One nation, one subscription
      B: Research and Innovation Excellence Frameworks (RIEF)
      C: Atal Innovation Mission
      D: More than one of the above
    answer: C
    explanation: The Atal Innovation Mission was set up by NITI Aayog in 2016, before STIP 2020; One Nation One Subscription and RIEF come from STIP 2020.
  - slug: bpsc-71-q049
    difficulty: medium
    stem: Share of Micro, Small and Medium Enterprises in the country’s Gross Value Added (GVA) has increased from ______ in 2020-21 to ______ in 2022-23.
    options:
      A: 30.3%, 35.6%
      B: 27.3%, 30.1%
      C: 35.1%, 38.2%
      D: More than one of the above
    answer: B
    explanation: "Economic Survey 2024-25: the MSME share of GVA rose from 27.3% in 2020-21 to 30.1% in 2022-23."
  - slug: bpsc-71-q050
    difficulty: medium
    stem: |-
      Which of the following statement/s is/are correct regarding the Indian cement industry?

      1. Around 87% of India’s cement industry is concentrated in a few major states like Rajasthan, Andhra Pradesh and Madhya Pradesh.
      2. India is the largest producer of cement in the world.
      3. Most cement plants in India are located far from raw material sources and near to the ports to support exports.

      Select the correct answer using the codes given below :
    options:
      A: "1"
      B: "2"
      C: 1 and 3
      D: More than one of the above
    answer: A
    explanation: Cement capacity is concentrated in a few states (Economic Survey 2024-25). India is the second-largest producer after China, and plants sit near limestone sources, so only 1 is correct.
  - slug: bpsc-71-q051
    difficulty: medium
    stem: What is the primary objective of Bihar’s Mission Daksh?
    options:
      A: To increase school enrolment in primary schools in rural areas.
      B: To provide vocational training to teachers at senior-secondary level.
      C: To offer personalised mentoring for lagging students to reach grade-level competencies.
      D: More than one of the above
    answer: C
    explanation: Mission Daksh (Bihar, 2023) gives remedial mentoring to academically weak students of classes 3–8 to bring them to grade-level competency.
  - slug: bpsc-71-q052
    difficulty: medium
    stem: Which of the following is NOT one of the components under the YUVA framework of the Bihar Startup Policy 2022?
    options:
      A: Vibrancy in the education system
      B: Regulatory enablers for support
      C: International market expansion schemes
      D: More than one of the above
    answer: C
    explanation: The YUVA framework in the Bihar Startup Policy 2022 covers education-system vibrancy, regulatory enablers and similar supports; it has no international market expansion scheme.
  - slug: bpsc-71-q053
    difficulty: medium
    stem: Which of the following statement/s is/are correct about Bihar’s economic performance in 2023-24?
    options:
      A: Bihar’s per capita GSDP at current prices increased by 12.8% in 2023-24 over the previous year.
      B: The estimated share of the tertiary sector in Bihar’s GSVA (constant prices) in 2023-24 was 58.6%.
      C: The Gross Fixed Capital Formation (GFCF) formed 4.6% of GSDP at current prices in 2023-24.
      D: More than one of the above.
    answer: D
    explanation: The Bihar Economic Survey 2024-25 figures for 2023-24 (12.8% per-capita GSDP growth, tertiary sector share and GFCF share) match more than one of the statements, so the key gives D.
  - slug: bpsc-71-q054
    difficulty: medium
    stem: |-
      Consider the following statements :

      1. The proportion of the young population (0-19 years) in Bihar is projected to decline significantly by 2041.
      2. Bihar’s demographic dividend is expected to peak around 2041.
      3. The elderly population (60 + years) in Bihar is expected to rise more sharply than in India.

      Select the correct answer using the codes given below :
    options:
      A: 1 and 2 are correct
      B: 1 and 3 are correct
      C: 2 and 3 are correct
      D: More than one of the above
    answer: A
    explanation: "Bihar Economic Survey 2024-25 projections: the young population falls sharply and the demographic dividend peaks around 2041. Bihar’s elderly share rises less (about 11.6%) than India’s (about 16%), so 3 is wrong."
  - slug: bpsc-71-q055
    difficulty: medium
    stem: According to PLFS 2023-24, which of the following statements best describe the nature of employment among women in Bihar?
    options:
      A: Most women are employed in formal, regular wage jobs.
      B: The majority of women are self-employed, often serving as helpers in household enterprises.
      C: Majority of women were engaged in secondary sector
      D: More than one of the above
    answer: B
    explanation: "PLFS 2023-24: most women workers in Bihar are self-employed, largely as unpaid helpers in household enterprises, mainly in agriculture."
  - slug: bpsc-71-q056
    difficulty: medium
    stem: "The power to recruit the Secretarial staff of the House of the People is vested in:"
    options:
      A: Prime Minister’s Office (PMO)
      B: Union Public Service Commission
      C: Staff Selection Commission
      D: President after consultation with the Speaker of the House of the people
    answer: D
    explanation: Under Art. 98(3), until Parliament legislates, the President may, after consulting the Speaker, make rules on recruitment of the Lok Sabha secretariat staff.
  - slug: bpsc-71-q057
    difficulty: medium
    stem: "Attorney General of India :"
    options:
      A: Is not entitled of audience except the Supreme Court
      B: He gives advice to the President on legal matters
      C: Cannot participate in the proceedings in the House of Parliament
      D: Is a whole time counsel for the government
    answer: B
    explanation: The Attorney General advises the Government of India on legal matters referred by the President (Art. 76). He has audience in all courts, can take part in Parliament’s proceedings, and is not a full-time government counsel.
  - slug: bpsc-71-q058
    difficulty: medium
    stem: |-
      Consider the following subjects belonging to different lists of the constitution of India. Which of the following subjects belong to concurrent list?

      1. Protection of wildlife
      2. Income on Agriculture
      3. Tax on Electricity consumption or sale
      4. Price control

      Out of these :
    options:
      A: 1 and 4 are correct
      B: 2 and 3 are correct
      C: Only 4 is correct
      D: Only 2 is correct
    answer: A
    explanation: Protection of wild animals and birds (17B) and price control (34) are in the Concurrent List; tax on agricultural income and tax on electricity are State List subjects.
  - slug: bpsc-71-q059
    difficulty: medium
    stem: |-
      Which of the following Directive Principles do not follow Gandhian Principles?

      1. Organization of Village Panchayats
      2. Common Civil Code
      3. Promotion of cottage Industry in rural areas
      4. Right to work
    options:
      A: 1 and 2
      B: Only 2
      C: 2 and 4
      D: 1 and 3
    answer: C
    explanation: Village panchayats (Art. 40) and cottage industries (Art. 43) are Gandhian; the Uniform Civil Code (Art. 44) is liberal-intellectual and the right to work (Art. 41) is socialist.
  - slug: bpsc-71-q060
    difficulty: medium
    stem: Which pair is **not** correctly matched?
    options:
      A: Allocation of seats in the council of state - 4th schedule
      B: Forms of oath - 3rd schedule
      C: Administration of scheduled areas - 6th schedule
      D: Union List - 7th schedule
    answer: C
    explanation: Administration of Scheduled Areas is in the Fifth Schedule; the Sixth Schedule covers tribal areas of Assam, Meghalaya, Tripura and Mizoram.
  - slug: bpsc-71-q061
    difficulty: medium
    stem: |-
      Consider the following statements about Central Government:

      1. Ministries and Departments are formed by the Prime Minister with consultation of the Cabinet Secretary.
      2. Every Minister is allocated Ministry by the President on the advice of the Prime Minister.

      Out of these :
    options:
      A: Only 1 is correct
      B: Only 2 is correct
      C: 1 and 2 are correct
      D: Neither 1 nor 2 is correct
    answer: B
    explanation: Portfolios are allocated by the President on the PM’s advice under the Allocation of Business Rules (Art. 77(3)); ministries are not created by the PM in consultation with the Cabinet Secretary.
  - slug: bpsc-71-q062
    difficulty: medium
    stem: What is true about the proceedings of the State Legislature?
    options:
      A: Business in the legislature shall be transacted only in official language of the state or in Hindi or in English.
      B: Advocate General has right to vote
      C: It can discuss the conduct of any judge of the High Court also
      D: Validity of proceedings shall be called in question on the ground of any alleged irregularity
    answer: A
    explanation: Art. 210 allows business in the state’s official language(s) or Hindi or English. The Advocate General cannot vote (Art. 177), judges’ conduct cannot be discussed (Art. 211), and proceedings cannot be questioned for irregularity (Art. 212).
  - slug: bpsc-71-q063
    difficulty: medium
    stem: |-
      The constitution of India provides for reasonable restrictions on Fundamental Rights but reasonableness must keep in mind that :

      1. The interest of the general public is safeguarded
      2. Prevailing social value and also social needs are not bar
      3. Directive principles can be bypassed
      4. Collective good is not greater

      Out of these :
    options:
      A: 1 and 2 are correct
      B: 2 and 3 are correct
      C: Only 4 is correct
      D: Only 1 is correct
    answer: A
    explanation: Reasonableness of a restriction is judged by the public interest and by prevailing social values and needs (State of Madras v. V.G. Row), so 1 and 2.
  - slug: bpsc-71-q064
    difficulty: medium
    stem: Who among the following determines the qualification which shall be requisite for appointment as member of the finance commission?
    options:
      A: President of India
      B: Council of Ministers
      C: Parliament by act
      D: Union Cabinet
    answer: C
    explanation: "Art. 280(2): Parliament may by law fix the qualifications of Finance Commission members (Finance Commission Act, 1951)."
  - slug: bpsc-71-q065
    difficulty: medium
    stem: |-
      Consider the following statements :

      1. The summoning of the House means convocation
      2. Prorogation ends a session
      3. Dissolution terminates a House
      4. Prorogation of a session can be effected by the leader of the House alone

      Out of these which is **not** true?
    options:
      A: 2 and 3
      B: 1 and 3
      C: Only 2
      D: Only 4
    answer: D
    explanation: Summoning convenes a House, prorogation ends a session and dissolution ends the House. Prorogation is done by the President, not by the Leader of the House, so 4 is untrue.
  - slug: bpsc-71-q066
    difficulty: medium
    stem: Who is empowered to review financial position of the Panchayats?
    options:
      A: Chief Minister
      B: Chairman of Block Committee
      C: Chairman of District Council
      D: Finance Commission constituted by the Governor
    answer: D
    explanation: "Art. 243-I: the Governor sets up a State Finance Commission every five years to review the finances of Panchayats."
  - slug: bpsc-71-q067
    difficulty: medium
    stem: |-
      The Atmanirbhar Bharat Scheme announced by the Government helps in:

      1. Enhancing India’s manufacturing capabilities and exports across the industries
      2. Incentivizing foreign investments for domestic production

      Out of these :
    options:
      A: 1 is correct
      B: 2 is correct
      C: Both 1 and 2 are correct
      D: Neither 1 nor 2 is correct
    answer: C
    explanation: Atmanirbhar Bharat measures (PLI schemes, MSME support) aim to raise manufacturing and exports and to draw investment, including FDI, into domestic production.
  - slug: bpsc-71-q068
    difficulty: medium
    stem: What is the main purpose of Panchayati Raj?
    options:
      A: To increase agriculture production
      B: To increase employment
      C: To increase people’s political awareness
      D: To enable people to participate in development administration
    answer: D
    explanation: Panchayati Raj is meant as democratic decentralisation, so that people take part in local development administration.
  - slug: bpsc-71-q070
    difficulty: medium
    stem: Which one of the following subjects fall within the jurisdiction of both High Court and Supreme Court?
    options:
      A: Dispute between Centre and State
      B: Dispute among States
      C: Protection of fundamental rights
      D: Protection from the violation of the constitution
    answer: C
    explanation: Fundamental rights can be enforced in both the Supreme Court (Art. 32) and the High Courts (Art. 226). Centre–state and inter-state disputes belong only to the Supreme Court (Art. 131).
  - slug: bpsc-71-q071
    difficulty: medium
    stem: Which Indian leader for the first time used the ‘safety-valve theory’ to attack the Moderates in the Congress?
    options:
      A: Bipin Chandra Pal
      B: Lala Lajpat Rai
      C: Bal Gangadhar Tilak
      D: Dadabhai Naoroji
    answer: B
    explanation: Lala Lajpat Rai (Young India, 1916) used the safety-valve theory, that Hume founded the Congress as a safety valve, to attack the Moderates.
  - slug: bpsc-71-q072
    difficulty: medium
    stem: At which Viceroy was a bomb thrown on the occasion of his state entry into Delhi?
    options:
      A: Lord Curzon
      B: Lord Minto
      C: Lord Hardinge
      D: Lord Wavell
    answer: C
    explanation: A bomb was thrown at Lord Hardinge on 23 December 1912 during his state entry into Delhi (Delhi Conspiracy Case).
  - slug: bpsc-71-q073
    difficulty: medium
    stem: Who got an opportunity to become Professor of Indian Philosophy in the University of California in 1911?
    options:
      A: Sohan Singh Bhakna
      B: Virendranath Chattopadhyay
      C: Har Dayal
      D: Shyamji Krishna Varma
    answer: C
    explanation: Har Dayal lectured in Indian philosophy and Sanskrit at Stanford/Berkeley, California, in 1911–12 before founding the Ghadar Party.
  - slug: bpsc-71-q074
    difficulty: medium
    stem: Name the Principal of M.A.O. College, Aligarh, who encouraged Muslim Communalism in the last decades of the 19th Century?
    options:
      A: Dunlop Smith
      B: Minto
      C: William Morris
      D: Theodore Beck
    answer: D
    explanation: Theodore Beck, principal of MAO College (1883–99), promoted Muslim separatism and pro-British loyalism.
  - slug: bpsc-71-q076
    difficulty: medium
    stem: Which Commission accentuated the discontent in all the political groups and parties for not associating any Indian member in it?
    options:
      A: Welby Commission
      B: Cripps Mission
      C: Simon Commission
      D: Cabinet Mission
    answer: C
    explanation: The all-white Simon Commission (1927) with no Indian member was boycotted by almost all Indian parties.
  - slug: bpsc-71-q077
    difficulty: medium
    stem: Who assumed the command of the Indian National Army and gave famous battle cry, ‘Chalo Delhi’?
    options:
      A: Rash Behari Bose
      B: Mohan Singh
      C: Shah Nawaz Khan
      D: Subhash Chandra Bose
    answer: D
    explanation: Subhas Chandra Bose took command of the INA in 1943 and gave the call “Chalo Delhi”.
  - slug: bpsc-71-q078
    difficulty: medium
    stem: “We shall either free India or die in the attempt …” who said it?
    options:
      A: Jawaharlal Nehru
      B: Mahatma Gandhi
      C: Abul Kalam Azad
      D: V.D. Savarkar
    answer: B
    explanation: "Gandhi’s “Do or Die” Quit India speech (8 August 1942): “We shall either free India or die in the attempt.”"
  - slug: bpsc-71-q079
    difficulty: medium
    stem: Who raised the cry “Divide and Quit”?
    options:
      A: M.A. Ansari
      B: M.A. Jinnah
      C: Jawaharlal Nehru
      D: Muhammad Iqbal
    answer: B
    explanation: Jinnah answered the Quit India call with “Divide and Quit”.
  - slug: bpsc-71-q080
    difficulty: medium
    stem: Which Act provided for the partition of India into two new dominions - India and Pakistan?
    options:
      A: Govt. of India Act, 1919
      B: Govt. of India Act, 1935
      C: Indian Independence Act, 1947
      D: None of the above
    answer: C
    explanation: The Indian Independence Act, 1947 created the two independent dominions of India and Pakistan.
  - slug: bpsc-71-q081
    difficulty: medium
    stem: Which Congress leader visited Bihar in 1918 in order to strengthen the activities of Home Rule League?
    options:
      A: B.G. Tilak
      B: Annie Besant
      C: Mahatma Gandhi
      D: M.A. Ansari
    answer: B
    explanation: Annie Besant toured Bihar in July 1918 to promote the Home Rule League (the Patna branch was set up in December 1917 under Mazharul Haq).
  - slug: bpsc-71-q082
    difficulty: medium
    stem: "Champaran Agrarian Committee was appointed in agreement between :"
    options:
      A: Indian Government and Gandhiji
      B: Indian Government and Raj Kumar Shukla
      C: Indian Government and Rajendra Prasad
      D: Indian Government and Anugraha Narayan Singh
    answer: A
    explanation: The Government of Bihar and Orissa appointed the Champaran Agrarian Committee (1917) with Gandhi as a member, as agreed with him.
  - slug: bpsc-71-q083
    difficulty: medium
    stem: Who was the prominent leader of Kisan Sabha movement in Bihar?
    options:
      A: Raj Kumar Shukla
      B: Sahajanand Saraswati
      C: Acharya Narendra Dev
      D: Baba Ram Chandra
    answer: B
    explanation: Swami Sahajanand Saraswati founded and led the Bihar Provincial Kisan Sabha (1929).
  - slug: bpsc-71-q084
    difficulty: medium
    stem: Who was murdered while hoisting the national flag under the area of Bikram Police Station?
    options:
      A: Raghunath Singh of Gorakhari
      B: Ram Narain of Bikrampur
      C: Satyendra of Gorakhari
      D: None of the above
    answer: D
    explanation: The final key says the martyr was Rang Nath Sharma alias Raghunath Sharma, a name none of the options gives, so “None of the above” (changed from A in the provisional key).
  - slug: bpsc-71-q085
    difficulty: medium
    stem: Who became Chief Minister of Bihar in March 1939?
    options:
      A: Anugraha Narain Singh
      B: Rajendra Prasad
      C: Shri Krishna Singh
      D: None of the above
    answer: D
    explanation: Shri Krishna Sinha had been Premier of Bihar since 1937, and no “Chief Minister” post was created in March 1939, so the final key gives “None of the above”.
  - slug: bpsc-71-q086
    difficulty: medium
    stem: |-
      Match List I with List II

      | List-I (Places in Ancient India) | List-II (Presently in which State) |
      |---|---|
      | a) Karnasuvarna | 1) Maharashtra |
      | b) Pragjyotish | 2) Gujarat |
      | c) Girnar | 3) West Bengal |
      | d) Pratishthan | 4) Assam |

      Select the correct answer using the codes given below :
    options:
      A: a-4, b-3, c-1, d-2
      B: a-3, b-4, c-2, d-1
      C: a-3, b-2, c-4, d-1
      D: a-4, b-2, c-1, d-3
    answer: B
    explanation: Karnasuvarna is in West Bengal, Pragjyotisha in Assam, Girnar in Gujarat and Pratishthana (Paithan) in Maharashtra.
  - slug: bpsc-71-q087
    difficulty: medium
    stem: Which one of the following is not related to the Rigvedic period?
    options:
      A: Ghosha
      B: Gargi
      C: Apala
      D: Vishvavara
    answer: B
    explanation: Ghosha, Apala and Vishvavara are Rigvedic women seers; Gargi belongs to the later Vedic/Upanishadic period.
  - slug: bpsc-71-q088
    difficulty: medium
    stem: |-
      Match List I with List II

      | List-I (Event/Place) | List-II (Connected with Person) |
      |---|---|
      | a) Chola Gangam Lake | 1) Chandragupta Maurya |
      | b) Appointment of Dharma Mahamatra | 2) Harshavardhan |
      | c) Assembly at Prayag | 3) Rajendra I |
      | d) Sudarshan Lake | 4) Ashoka |

      Select the correct answer using the codes given below :
    options:
      A: a-3, b-4, c-2, d-1
      B: a-1, b-4, c-2, d-3
      C: a-3, b-4, c-1, d-2
      D: a-2, b-3, c-1, d-4
    answer: A
    explanation: "Chola Gangam lake: Rajendra I; Dharma Mahamatras: Ashoka; Prayag assembly: Harshavardhana; Sudarshan lake: Chandragupta Maurya."
  - slug: bpsc-71-q089
    difficulty: medium
    stem: Who among the following rulers, ruled for the maximum period?
    options:
      A: Alauddin Khilji
      B: Muhammad bin Tughluq
      C: Bahlol Lodi
      D: Balban
    answer: C
    explanation: Bahlol Lodi ruled 1451–89 (about 38 years), longer than Alauddin (20), Muhammad bin Tughluq (26) or Balban (about 20).
  - slug: bpsc-71-q090
    difficulty: medium
    stem: |-
      Consider the following dynasties of Ancient India :

      1. Shunga
      2. Maurya
      3. Kushana
      4. Kanva

      Which of the following is the correct chronological order of their rule?
    options:
      A: 2-1-4-3
      B: 1-2-3-4
      C: 2-3-1-4
      D: 2-1-3-4
    answer: A
    explanation: Maurya → Shunga → Kanva → Kushana.
  - slug: bpsc-71-q091
    difficulty: medium
    stem: Which one of the following is not written by Tulsidas?
    options:
      A: Geetavali
      B: Vinay Patrika
      C: Sahitya Lahari
      D: Kavitavali
    answer: C
    explanation: Sahitya Lahari is by Surdas; Gitavali, Vinay Patrika and Kavitavali are by Tulsidas.
  - slug: bpsc-71-q092
    difficulty: medium
    stem: |-
      Match List I with List II

      | List-I (Building) | List-II (Built by) |
      |---|---|
      | a) Kabuli Bagh Mosque | 1) Qutb ud-Din Aibak |
      | b) Adhai Din Ka Jhopra | 2) Nur Jahan |
      | c) Allahabad Fort | 3) Akbar |
      | d) Itmad-ud-Daulah Mausoleum | 4) Babar |

      Select the correct answer using the codes given below :
    options:
      A: a-4, b-1, c-3, d-2
      B: a-2, b-1, c-4, d-3
      C: a-4, b-1, c-2, d-3
      D: a-1, b-4, c-3, d-2
    answer: A
    explanation: "Kabuli Bagh mosque: Babur; Adhai Din Ka Jhonpra: Qutb-ud-din Aibak; Allahabad Fort: Akbar; Itmad-ud-Daulah: Nur Jahan."
  - slug: bpsc-71-q093
    difficulty: medium
    stem: |-
      Which one of the following is not correctly matched?

      Person - Associated with
    options:
      A: James Augustus Hicky - Calcutta Chronicle
      B: Dayananda Saraswati - Satyarth Prakash
      C: Ramaswamy Naicker - Justice Party
      D: Jyotirao Phule - Satyashodhak Samaj
    answer: A
    explanation: J. A. Hicky founded Hicky’s Bengal Gazette (1780), not the Calcutta Chronicle; the other pairs are correct.
  - slug: bpsc-71-q094
    difficulty: medium
    stem: |-
      Match List I with List II

      | List-I (Father) | List-II (Son) |
      |---|---|
      | a) Babar | 1) Salim |
      | b) Akbar | 2) Khusrau |
      | c) Shah Jahan | 3) Kamran |
      | d) Jahangir | 4) Murad |

      Select the correct answer using the codes given below :
    options:
      A: a-4, b-1, c-3, d-2
      B: a-3, b-1, c-4, d-2
      C: a-3, b-1, c-2, d-4
      D: a-4, b-2, c-3, d-1
    answer: B
    explanation: Babur’s son Kamran, Akbar’s son Salim, Shah Jahan’s son Murad, Jahangir’s son Khusrau.
  - slug: bpsc-71-q095
    difficulty: medium
    stem: Which Buddhist council was not held in Bihar?
    options:
      A: First
      B: Second
      C: Third
      D: Fourth
    answer: D
    explanation: The first three councils were at Rajgir, Vaishali and Pataliputra (Bihar); the fourth was in Kashmir (Kundalvana).
  - slug: bpsc-71-q097
    difficulty: medium
    stem: Who among the following was not an Acharya in The Nalanda Vishvavidyalaya?
    options:
      A: Nagarjuna
      B: Kautilya
      C: Sheelbhadra
      D: Shantirakshit
    answer: B
    explanation: Nagarjuna, Shilabhadra and Shantarakshita were associated with Nalanda; Kautilya was linked with Taxila, not Nalanda.
  - slug: bpsc-71-q098
    difficulty: medium
    stem: |-
      Consider the following events of Modern Indian History -

      1. Death sentence to Raja Nand Kumar
      2. Treaty of Salbai
      3. Battle of Wandiwash
      4. Death of Tipu Sultan

      Which of the following is the correct chronological order of the above events?
    options:
      A: 2-3-4-1
      B: 3-1-2-4
      C: 2-4-1-3
      D: 3-2-1-4
    answer: B
    explanation: Wandiwash (1760) → Nand Kumar hanged (1775) → Treaty of Salbai (1782) → Tipu’s death (1799).
  - slug: bpsc-71-q099
    difficulty: medium
    stem: Among the following Newspapers of Bihar, which was the first one to get published?
    options:
      A: Bihar Bandhu
      B: Patna Harkara
      C: Akhbar-E-Bihar
      D: Bihar Herald
    answer: B
    explanation: The final key, citing Syed Ahmad Qadri’s “Urdu Sahafat Bihar mein”, holds that Patna Harkara was the first newspaper published from Bihar, before Akhbar-e-Bihar (1856) and Bihar Bandhu (1872).
  - slug: bpsc-71-q100
    difficulty: medium
    stem: |-
      Match List I with List II

      | List-I (Event/Organisation) | List-II (Related Person) |
      |---|---|
      | a) Champaran Satyagrah | 1) Jayaprakash Narayan |
      | b) Azad Dasta | 2) Shyam Narayan Singh |
      | c) Individual Satyagrah in Bihar 1940 | 3) Sahajanand Saraswati |
      | d) Kisan Sabha Bihar | 4) Dr. Rajendra Prasad |

      Select the correct answer using the codes given below :
    options:
      A: a-4, b-2, c-3, d-1
      B: a-2, b-3, c-1, d-4
      C: a-1, b-4, c-3, d-2
      D: a-4, b-1, c-2, d-3
    answer: D
    explanation: "Champaran: Rajendra Prasad; Azad Dasta: Jayaprakash Narayan; individual satyagraha in Bihar (1940): Shyam Narayan Singh; Kisan Sabha: Sahajanand Saraswati."
  - slug: bpsc-71-q101
    difficulty: medium
    stem: Maginot Line exists between which countries?
    options:
      A: U.S.A. & Canada
      B: France & Germany
      C: Namibia and Angola
      D: South Korea & North Korea
    answer: B
    explanation: The Maginot Line was France’s line of fortifications along the German border.
  - slug: bpsc-71-q102
    difficulty: medium
    stem: Strait of Hormuz connects -
    options:
      A: The Persian Gulf to Gulf of Oman
      B: Red sea to Gulf of Aden
      C: Red sea to Indian Ocean
      D: Mediterranean sea to Red sea
    answer: A
    explanation: The Strait of Hormuz joins the Persian Gulf to the Gulf of Oman.
  - slug: bpsc-71-q103
    difficulty: medium
    stem: Where is “Ground Zero”?
    options:
      A: Greenwich
      B: New York
      C: Indira Point
      D: Sriharikota
    answer: B
    explanation: “Ground Zero” is the site of the destroyed World Trade Center twin towers in New York.
  - slug: bpsc-71-q104
    difficulty: medium
    stem: Which of the following Isthmuses has been known as the ‘Devil’s Neck’?
    options:
      A: Isthmuses of Panama
      B: Kra Isthmuses
      C: Karelian Isthmuses
      D: Isthmuses of Corinth
    answer: B
    explanation: The key (both provisional and final) gives the Kra Isthmus as the “Devil’s Neck”.
  - slug: bpsc-71-q105
    difficulty: medium
    stem: Ladang refers to -
    options:
      A: Shifting Agriculture
      B: Plantation Agriculture
      C: Subsistence type of Agriculture
      D: Dry forming
    answer: A
    explanation: Ladang is the name for slash-and-burn shifting cultivation in Malaysia and Indonesia.
  - slug: bpsc-71-q106
    difficulty: medium
    stem: Which is the largest river Island in the world?
    options:
      A: Srirangam Island
      B: Majuli Island
      C: Bhavani Island
      D: Agatti Island
    answer: B
    explanation: Majuli on the Brahmaputra is recognised (Guinness) as the largest river island in the world.
  - slug: bpsc-71-q107
    difficulty: medium
    stem: The second largest river basin of India is -
    options:
      A: Mahanadi river basin
      B: Narmada river basin
      C: Godavari river basin
      D: Kaveri river basin
    answer: C
    explanation: The Godavari basin is the largest in peninsular India and second in India after the Ganga basin.
  - slug: bpsc-71-q108
    difficulty: medium
