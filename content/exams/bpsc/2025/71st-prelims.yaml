  - slug: bpsc-71-q121
    difficulty: medium
    stem: "We apply a force of 200 Newtons on a wooden Box and push it on the floor at constant velocity. The marginal friction force will be :"
    options:
      A: 100 Newtons
      B: 200 Newtons
      C: 300 Newtons
      D: 400 Newtons
    answer: B
    explanation: At constant velocity the net force is zero, so friction equals the applied 200 N.
  - slug: bpsc-71-q122
    difficulty: medium
    stem: A truck starts from rest down a hill with a constant acceleration. It achieves 400 meters in 20 seconds. If the weight of the truck is 7 tons then what will be the force acting on it?
    options:
      A: 11000 Newtons
      B: 12000 Newtons
      C: 13000 Newtons
      D: 14000 Newtons
    answer: D
    explanation: s = ½at² gives 400 = ½·a·400, so a = 2 m/s²; F = 7000 kg × 2 = 14,000 N (taking 7 tons as mass).
  - slug: bpsc-71-q123
    difficulty: medium
    stem: "Energy consumed in a home is 250 units then the total energy in Joule will be :"
    options:
      A: 9×10⁵
      B: 8×10⁶
      C: 9×10⁸
      D: 10⁵
    answer: C
    explanation: 250 kWh × 3.6 × 10⁶ J = 9 × 10⁸ J.
  - slug: bpsc-71-q124
    difficulty: medium
    stem: In which medium, the speed of sound is maximum?
    options:
      A: Steel
      B: Water
      C: Air
      D: Hydrogen
    answer: A
    explanation: Sound is fastest in solids; in steel it is about 5,000–6,000 m/s.
  - slug: bpsc-71-q125
    difficulty: medium
    stem: The potential energy of a freely falling body continuously decreases.
    options:
      A: The principle of conservation of energy is violated
      B: The principle of conservation of energy is not violated
      C: Gravitational force is violated
      D: Gravitational force is not violated
    answer: B
    explanation: Lost potential energy turns into kinetic energy, so total mechanical energy is conserved.
  - slug: bpsc-71-q126
    difficulty: medium
    stem: "A pair of Oxen exerts a force of 140 newton while ploughing the field. The field ploughed is 15 meter long. The work done in ploughing the length of the field is :"
    options:
      A: 1900 Joule
      B: 2000 Joule
      C: 2100 Joule
      D: 2200 Joule
    answer: C
    explanation: W = F × d = 140 N × 15 m = 2,100 J.
  - slug: bpsc-71-q127
    difficulty: medium
    stem: The focal distance of a plane mirror is
    options:
      A: +1 cm
      B: −1 cm
      C: 2 cm
      D: Infinity
    answer: D
