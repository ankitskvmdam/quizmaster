slug: 70th-prelims-reexam
title: BPSC 70th Prelims (re-exam)
date: 2025-01-04
label: Series I
source: "BPSC official question booklet and final answer key (bpsc.bihar.gov.in). Deleted by BPSC (left out): Q5, Q13, Q79, Q91."
questions:
  - slug: bpsc-70re-q001
    difficulty: medium
    stem: The oldest civilization in the world is
    options:
      A: Egyptian
      B: Mesopotamia (Iraq)
      C: Chinese
      D: Indus valley
    answer: B
    explanation: Mesopotamian (Sumerian) civilization, from about 3500 BCE, is generally taken as the oldest; Egyptian and Indus civilizations came slightly later.
  - slug: bpsc-70re-q002
    difficulty: medium
    stem: For two liquids A and B to form an ideal solution
    options:
      A: Enthalpy of mixing should be zero
      B: Entropy of mixing must be zero
      C: Free energy of mixing should be zero
      D: None of the above
    answer: A
    explanation: An ideal solution obeys Raoult's law, so the enthalpy (and volume) of mixing is zero; entropy of mixing is positive and free energy of mixing is negative.
  - slug: bpsc-70re-q003
    difficulty: medium
    stem: |-
      What should come in place of ? in the following series ?

      117, 98, 80, 64, ?, 42
    options:
      A: "51"
      B: "55"
      C: "46"
      D: "48"
    answer: A
    explanation: The differences are 19, 18, 16, 13, 9 (they shrink by 1, 2, 3, 4), so 64 - 13 = 51 and 51 - 9 = 42.
  - slug: bpsc-70re-q004
    difficulty: medium
    stem: Under the Government of India Act 1935, who was the first elected Chairman of Bihar Legislative Council ?
    options:
      A: Rajendra Prasad
      B: Rai Bahadur Satish Chandra
      C: Rajiv Ranjan Sinha
      D: More than one of the above
    answer: C
    explanation: Rajiv Ranjan Prasad Sinha is named as the first elected Chairman of the Bihar Legislative Council set up under the 1935 Act. (The council's own site says Rai Bahadur Satish Chandra Sinha was first appointed Chairman by the Governor, but the question asks who was elected.)
  - slug: bpsc-70re-q006
    difficulty: medium
    stem: Which Sector in India has benefitted the most from Globalization ?
    options:
      A: Manufacturing
      B: Agriculture
      C: All Sectors have benefitted equally
      D: Services
    answer: D
    explanation: After the 1991 liberalisation the services sector (IT, telecom, finance) gained most, and it now contributes over half of India's GDP.
  - slug: bpsc-70re-q007
    difficulty: medium
    stem: When antigens are introduced in the body through vaccination antibodies are produced to fight off infection
    options:
      A: By only T cells
      B: By both B and T cells
      C: By only B cells
      D: None of the above
    answer: C
    explanation: Antibodies are made only by B lymphocytes, which become plasma cells. T cells help them and kill infected cells but make no antibodies.
  - slug: bpsc-70re-q008
    difficulty: medium
    stem: The power of the Supreme Court of India to decide disputes between the Centre and the State falls under its
    options:
      A: Advisory jurisdiction
      B: Constitutional jurisdiction
      C: Original jurisdiction
      D: Appellate jurisdiction
    answer: C
    explanation: Article 131 gives the Supreme Court exclusive original jurisdiction over disputes between the Centre and the States.
  - slug: bpsc-70re-q009
    difficulty: medium
    stem: "Which newspaper wrote the following about the possible future role of the Indian National Congress : ‘... is the nucleus of a future Parliament of our country ... and will lead to the good of inconceivable magnitude for our countrymen’ ?"
    options:
      A: The Times of India
      B: The Indian Mirror
      C: The New York Times
      D: More than one of the above
    answer: B
    explanation: The Indian Mirror welcomed the founding of the Congress in 1885 as the nucleus of a future Indian Parliament.
  - slug: bpsc-70re-q010
    difficulty: medium
    stem: |-
      How many triangles are there in the following figure ?

      *(Figure: A large triangle with its apex at the top. Inside it, a line runs from the apex down to a point on the base (a little right of the middle of the base). A second straight line runs from the bottom-left vertex up to a point on the right side, crossing the first line about halfway down it. A third segment joins that crossing point to the bottom-right vertex. No other lines.)*
    options:
      A: "10"
      B: "8"
      C: "14"
      D: "12"
    answer: D
    explanation: "With apex A, base BC, D on the base, E on side AC and P where AD meets BE, the triangles are ABC, ABD, ABE, ABP, ACD, ACP, AEP, BCE, BCP, BDP, CDP and CEP: 12 in all."
  - slug: bpsc-70re-q011
    difficulty: medium
    stem: Which State has the longest boundary with Madhya Pradesh ?
    options:
      A: Uttar Pradesh
      B: Rajasthan
      C: Andhra Pradesh
      D: Maharashtra
    answer: A
    explanation: Uttar Pradesh shares Madhya Pradesh's longest boundary, along its whole northern and north-eastern side. Most sources say so, though a few name Maharashtra.
  - slug: bpsc-70re-q012
    difficulty: medium
    stem: Who led the Champaran Satyagraha in 1917 ?
    options:
      A: Sardar Patel
      B: Mahatma Gandhi
      C: Subhas Chandra Bose
      D: Jawaharlal Nehru
    answer: B
    explanation: Mahatma Gandhi led the Champaran Satyagraha of 1917 against the tinkathia indigo system, his first satyagraha in India.
  - slug: bpsc-70re-q014
    difficulty: medium
    stem: Who among the following is the recipient of Bharat Ratna for 2024 ?
    options:
      A: Chandra Shekhar
      B: Pranab Mukharjee
      C: M. S. Swaminathan
      D: C. N. R. Rao
    answer: C
    explanation: The 2024 Bharat Ratna went to M. S. Swaminathan, Karpoori Thakur, Charan Singh, P. V. Narasimha Rao and L. K. Advani. Pranab Mukherjee received it in 2019 and C. N. R. Rao in 2014.
  - slug: bpsc-70re-q015
    difficulty: medium
    stem: One of the properties associated with X-rays is that they can be deflected by
    options:
      A: Magnetic fields only
      B: Both electric and magnetic fields together
      C: Electric fields only
      D: None of the above
    answer: D
    explanation: X-rays are electromagnetic waves with no charge, so neither electric nor magnetic fields deflect them.
  - slug: bpsc-70re-q016
    difficulty: medium
    stem: |-
      Renewable Energy means

      1. Electricity produced from solar
      2. Electricity produced from thermal plants
      3. Electricity produced from coal
      4. Electricity produced from wind

      Choose the correct answer from the options given below :
    options:
      A: 1, 2 and 3 only
      B: 1 and 3 only
      C: 1, 3 and 4 only
      D: 1 and 4 only
    answer: D
    explanation: Solar and wind power are renewable. Thermal and coal-based power come from fossil fuels.
  - slug: bpsc-70re-q017
    difficulty: medium
    stem: "Which of the following Acts converted Unicameral Legislature of Bihar into Bicameral : Bihar Legislative Assembly and Bihar Legislative Council ?"
    options:
      A: Government of India Act 1935
      B: Government of India Act 1919
      C: Government of India Act 1909
      D: More than one of the above
    answer: B
    explanation: |-
      **Disputed.** BPSC's final key says B; our check suggests A.

      The key gives B (Government of India Act 1919). This is doubtful: the 1935 Act made Bihar's legislature bicameral, with the Assembly and Council first meeting in 1937. (Wikipedia's Bihar Legislative Council page does credit the 1919 Act.)
  - slug: bpsc-70re-q018
    difficulty: medium
    stem: Which is the oldest mountain of South America continent ?
    options:
      A: Andese Mountain
      B: Brazil Mountain
      C: Turmuc-Humuk
      D: Pacaraima
    answer: D
    explanation: The key gives Pacaraima, part of the Guiana Highlands on the Precambrian Guiana Shield. Mount Roraima's rocks there are among the oldest on Earth, whereas the Andes are young fold mountains.
  - slug: bpsc-70re-q019
    difficulty: medium
    stem: |-
      Which of the following are matters on which a constitutional amendment is possible only with the ratification of the legislature of **not** less than one-half of the states ?

      1. Election of the President.
      2. Representation of States in Parliament.
      3. Any of the lists in the 7th Schedule.
      4. Abolition of the Legislative Council of a State.

      Choose the correct answer.
    options:
      A: 1, 3 and 4
      B: 1, 2 and 3
      C: 1, 2 and 4
      D: 2, 3 and 4
    answer: B
    explanation: Under Article 368(2), changes to the election of the President, the representation of States in Parliament and the Seventh Schedule lists need ratification by half the States. Abolishing a Legislative Council (Article 169) needs only a simple law of Parliament.
  - slug: bpsc-70re-q020
    difficulty: medium
    stem: Which of the following State was **not** annexed under Lord Dalhousie’s Doctrine of Lapse ?
    options:
      A: Sambhalpur
      B: Satara
      C: Jaipur
      D: Nagpur
    answer: C
    explanation: Satara (1848), Sambalpur (1849) and Nagpur (1854) were annexed under the Doctrine of Lapse. Jaipur was never annexed.
  - slug: bpsc-70re-q021
    difficulty: medium
    stem: In which district of Bihar, wheat crop production is maximum ?
    options:
      A: Rohtas
      B: Patna
      C: Bhojpur
      D: Jahanabad
    answer: A
    explanation: Rohtas, in the canal-irrigated Sone command area, is Bihar's leading wheat-producing district.
  - slug: bpsc-70re-q022
    difficulty: medium
    stem: Which field game is most popular in the world ?
    options:
      A: Soccer (Football)
      B: Cricket
      C: Volleyball
      D: Hockey
    answer: A
    explanation: Football (soccer) is the world's most popular field game by players and audience.
  - slug: bpsc-70re-q023
    difficulty: medium
    stem: In 1901 who has published the book ‘Poverty and Un-British Rule in India’ ?
    options:
      A: R. C. Dutt
      B: Phirozshah Mehta
      C: S. N. Banerjee
      D: Dadabhai Naoroji
    answer: D
    explanation: Dadabhai Naoroji published 'Poverty and Un-British Rule in India' in 1901, setting out his drain theory.
  - slug: bpsc-70re-q024
    difficulty: medium
    stem: Fort William College at Calcutta was established in
    options:
      A: 1800 CE to train Indian civil servants
      B: 1800 CE to train civil servants in Indian languages
      C: 1802 CE to understand Indian culture and tradition
      D: 1802 CE for historical research in Indian languages
    answer: B
    explanation: Wellesley founded Fort William College in 1800 to train British civil servants in Indian languages and customs.
  - slug: bpsc-70re-q025
    difficulty: medium
    stem: The script written on Ashoka’s Pillars is
    options:
      A: Pali
      B: Sanskrit
      C: Samaritan
      D: Brahmi
    answer: D
    explanation: Ashoka's pillar edicts are mostly in Prakrit written in the Brahmi script. A few in the north-west use Kharosthi, Greek or Aramaic.
  - slug: bpsc-70re-q026
    difficulty: medium
    stem: Catalyst used in hydrogenation of vegetable oil into vanaspati ghee is
    options:
      A: Ni
      B: Pd
      C: Fe
      D: None of the above
    answer: A
    explanation: Finely divided nickel catalyses the hydrogenation of vegetable oils into vanaspati.
  - slug: bpsc-70re-q027
    difficulty: medium
    stem: Grey revolution is related to
    options:
      A: Oilseeds
      B: Potatoes
      C: Fertilizers
      D: Fisheries
    answer: C
    explanation: The Grey Revolution is linked to fertilizers (and is also used for wool).
  - slug: bpsc-70re-q028
    difficulty: medium
    stem: Which Article of the Indian Constitution deals with the proclamation of Emergency ?
    options:
      A: Article 356
      B: Article 352
      C: Article 365
      D: Article 360
    answer: B
    explanation: Article 352 covers a national emergency. Article 356 is President's Rule and Article 360 a financial emergency.
  - slug: bpsc-70re-q029
    difficulty: medium
    stem: Which of the following Sufi Silsilah was founded in Bihar ?
    options:
      A: Qalandhar
      B: Kubriya
      C: Firdousia
      D: Quaderia
    answer: C
    explanation: The Firdausia silsilah became established in Bihar through Sheikh Sharfuddin Ahmad Yahya Maneri, at Maner and Bihar Sharif.
  - slug: bpsc-70re-q030
    difficulty: medium
    stem: Which of the following country is **not** a member of G7 ?
    options:
      A: France
      B: Russia
      C: USA
      D: Italy
    answer: B
    explanation: The G7 is the US, UK, France, Germany, Italy, Japan and Canada. Russia was suspended from the G8 in 2014.
  - slug: bpsc-70re-q031
    difficulty: medium
    stem: Actual site of dark reaction in photosynthesis inside cytoplast is
    options:
      A: Stroma
      B: Granum
      C: Grana Lamella
      D: None of the above
    answer: A
    explanation: The light-independent (Calvin cycle) reactions take place in the stroma of the chloroplast.
  - slug: bpsc-70re-q032
    difficulty: medium
    stem: Raj travelled from a point X straight to Y at a distance of 80 metres. He turned right and walked 50 metres, then again turned right and walked 70 metres. Finally, he turned right and walked 50 metres. How far is he from the starting point ?
    options:
      A: 20 metres
      B: 10 metres
      C: 45 metres
      D: 30 metres
    answer: B
    explanation: 80 m east, 50 m south, 70 m west, then 50 m north leaves him 80 - 70 = 10 m from X.
  - slug: bpsc-70re-q033
    difficulty: medium
    stem: The temple at Deogarh near Jhansi and the sculptures in the temple at Garhwa near Allahabad are important remains of
    options:
      A: Maurya art
      B: Rashtrakuta art
      C: Gupta art
      D: None of the above
    answer: C
    explanation: The Dashavatara temple at Deogarh and the Garhwa sculptures are classic Gupta-period remains.
  - slug: bpsc-70re-q034
    difficulty: medium
    stem: Bihar produces 71 percent of India’s annual production of which of these ?
    options:
      A: Lychee
      B: Mango
      C: Orange
      D: Pineapple
    answer: A
    explanation: Bihar, centred on Muzaffarpur, is India's largest lychee producer. The 71% figure is the older commonly quoted share.
  - slug: bpsc-70re-q035
    difficulty: medium
    stem: In which city was the G20 Summit 2023 held in India ?
    options:
      A: Mumbai
      B: New Delhi
      C: Hyderabad
      D: Bangalore
    answer: B
    explanation: The 18th G20 Summit was held at Bharat Mandapam, New Delhi, on 9-10 September 2023.
  - slug: bpsc-70re-q036
    difficulty: medium
    stem: There is no atmosphere on the surface of the moon because
    options:
      A: It revolves around Earth
      B: It gets light from Sun
      C: Escape velocity of gas molecules is less than rms velocity
      D: It is closer to Earth
    answer: C
    explanation: The Moon's escape velocity (about 2.4 km/s) is low, so the rms speeds of gas molecules exceed it and the gases escape.
  - slug: bpsc-70re-q037
    difficulty: medium
    stem: Who was the founder of the Maurya Empire ?
    options:
      A: Ashoka
      B: Chandragupta Maurya
      C: Brihadratha
      D: Bindusara
    answer: B
    explanation: Chandragupta Maurya founded the Maurya Empire in about 321 BCE with Chanakya's help.
  - slug: bpsc-70re-q038
    difficulty: medium
    stem: Which of the following is **not** the famous centre for Buddhist Learning in Ancient India ?
    options:
      A: Vikramshila
      B: Nalanda
      C: Valabhi
      D: Nagpur
    answer: D
    explanation: Vikramshila, Nalanda and Valabhi were ancient Buddhist centres of learning. Nagpur was not.
  - slug: bpsc-70re-q039
    difficulty: medium
    stem: Which country hosted the 2023 World Economic forum meeting ?
    options:
      A: Germany
      B: Switzerland
      C: Canada
      D: Japan
    answer: B
    explanation: The WEF Annual Meeting is held in Davos, Switzerland, including in January 2023.
  - slug: bpsc-70re-q040
    difficulty: medium
    stem: Which of the following vitamins are water soluble ?
    options:
      A: Vitamin K
      B: Vitamin A
      C: Vitamin D
      D: None of these
    answer: D
    explanation: Vitamins A, D, E and K are fat-soluble. Only B-complex and C are water-soluble.
  - slug: bpsc-70re-q041
    difficulty: medium
    stem: Who became the President of Indian National Congress when Subhash Chandra Bose resigned in 1939 ?
    options:
      A: Jawahar Lal Nehru
      B: Rajendra Prasad
      C: Abul Kalam Azad
      D: More than one of the above
    answer: B
    explanation: Rajendra Prasad became Congress President after Subhas Chandra Bose resigned at Tripuri in 1939.
  - slug: bpsc-70re-q042
    difficulty: medium
    stem: At what time between 2 and 3 O’Clock will the hands of a clock be together ?
    options:
      A: 10 10/43 minutes past 2
      B: 10 10/11 minutes past 2
      C: 38 10/11 minutes past 2
      D: 38 2/11 minutes past 2
    answer: B
    explanation: The hands coincide 60/11 x 2 = 10 10/11 minutes past 2.
  - slug: bpsc-70re-q043
    difficulty: medium
    stem: Which of the following Constitutional Amendment in India has decided the maximum strength of the Council of Minister with Chief Minister in a State ?
    options:
      A: 81st Constitutional Amendment
      B: 91st Constitutional Amendment
      C: 86th Constitutional Amendment
      D: None of the above Amendment
    answer: B
    explanation: The 91st Amendment (2003), Article 164(1A), caps a State Council of Ministers, Chief Minister included, at 15% of the Assembly (minimum 12).
  - slug: bpsc-70re-q044
    difficulty: medium
    stem: Besides spreading Malaria, Anopheles mosquito’s are also vectors of
    options:
      A: Encephalitis and Filariasis
      B: Dengue and Filariasis
      C: Dengue and Encephalitis
      D: None of the above
    answer: A
    explanation: The key gives A. Anopheles mosquitoes also carry the Wuchereria/Brugia filarial worms, but encephalitis is mostly Culex-borne, so the option is loosely worded.
  - slug: bpsc-70re-q045
    difficulty: medium
    stem: Who was re-elected as the President of France in 2022 ?
    options:
      A: Marine Le Pen
      B: Emmanuel Macron
      C: Éric Zemmour
      D: Jean-Luc Mélenchon
    answer: B
    explanation: Emmanuel Macron defeated Marine Le Pen in April 2022 to win a second term.
  - slug: bpsc-70re-q046
    difficulty: medium
    stem: Choose the correct pair from the following options.
    options:
      A: Third-Year Plan – Focus on Globalisation
      B: First Five-Year Plan – Focus on Agriculture
      C: Fifth Five-Year Plan – Focus on Industry
      D: Fourth Five-Year Plan – Focus on Service
    answer: B
    explanation: The First Five-Year Plan (1951-56) gave priority to agriculture and irrigation.
  - slug: bpsc-70re-q047
    difficulty: medium
    stem: Which is the mountain range along the Mediterranean Coast of Asia Minor ?
    options:
      A: Taurus
      B: Pontic
      C: Alburg
      D: Kirther
    answer: A
    explanation: The Taurus Mountains run along Turkey's southern, Mediterranean coast. The Pontic range lies along the Black Sea.
  - slug: bpsc-70re-q048
    difficulty: medium
    stem: Which of the following country is going to host 20th Asian games in 2026 ?
    options:
      A: Japan
      B: India
      C: Indonesia
      D: China
    answer: A
    explanation: The 20th Asian Games are in Aichi-Nagoya, Japan, in 2026.
  - slug: bpsc-70re-q049
    difficulty: medium
    stem: Which country hosted the 2022 Winter Olympics ?
    options:
      A: Canada
      B: Japan
      C: South Korea
      D: China
    answer: D
    explanation: Beijing, China, hosted the 2022 Winter Olympics.
  - slug: bpsc-70re-q050
    difficulty: medium
    stem: Turmeric powder is obtained from which part of turmeric plant ?
    options:
      A: Seed
      B: Dried foot
      C: Dried root
      D: None of the above
    answer: D
    explanation: Turmeric powder comes from the dried rhizome, an underground stem, not a seed or root, so 'none of the above' is correct.
  - slug: bpsc-70re-q051
    difficulty: medium
    stem: Which Viceroy decentralized the colonial economic structure in India ?
    options:
      A: Ripon
      B: Mayo
      C: Curzon
      D: More than one of the above
    answer: B
    explanation: Lord Mayo's 1870 resolution began financial decentralisation, giving provinces control over some revenue heads.
  - slug: bpsc-70re-q052
    difficulty: medium
    stem: Which of the following is the playground of Europe ?
    options:
      A: Italy
      B: France
      C: Switzerland
      D: Germany
    answer: C
    explanation: Switzerland is called the 'Playground of Europe' for its Alpine scenery and winter sports.
  - slug: bpsc-70re-q053
    difficulty: medium
    stem: Where did the revolt of Birsa Munda take place ?
    options:
      A: Ranchi
      B: Champaran
      C: Ballia
      D: None of the above
    answer: A
    explanation: Birsa Munda's Ulgulan (1899-1900) took place in the Ranchi region of Chhotanagpur.
  - slug: bpsc-70re-q054
    difficulty: medium
    stem: Which company became the first Indian company to cross the 200 billion USD market capitalization in 2023 ?
    options:
      A: TCS
      B: Reliance Industries
      C: HDFC Bank
      D: Infosys
    answer: B
    explanation: Reliance Industries was the first Indian company to pass USD 200 billion in market capitalisation.
  - slug: bpsc-70re-q055
    difficulty: medium
    stem: Reactance of a capacitor is
    options:
      A: Inversely proportional to frequency
      B: Directly proportional to frequency
      C: Inversely proportional to sq. root of frequency
      D: None of the above
    answer: A
    explanation: Xc = 1/(2*pi*f*C), so capacitive reactance is inversely proportional to frequency.
  - slug: bpsc-70re-q056
    difficulty: medium
    stem: Legally stipulated maximum size beyond which no individual farmer can hold any land is
    options:
      A: Abolition of intermediaries
      B: Tenancy reforms
      C: Land ceiling
      D: Land consolidation
    answer: C
    explanation: A land ceiling is the legal maximum area of land one holder may own.
  - slug: bpsc-70re-q057
    difficulty: medium
    stem: The Vernacular Press Act allowed
    options:
      A: Confiscation of the printing press if the newspapers published anything that was found objectionable
      B: Confiscation of the assets of the newspaper if the newspapers published anything that was found objectionable
      C: Confiscation of the printing press if the newspapers published anything that was not found to be objectionable
      D: More than one of the above
    answer: D
    explanation: The Vernacular Press Act 1878 let the government confiscate the press, papers and security deposit of a newspaper that printed objectionable matter, so more than one option applies.
  - slug: bpsc-70re-q058
    difficulty: medium
    stem: Average height of Kosi Plain from mean sea level is
    options:
      A: 150 m
      B: 300 m
      C: 30 m
      D: 100 m
    answer: C
    explanation: The Kosi plain of north-east Bihar is a low alluvial plain, averaging about 30-60 m above sea level.
  - slug: bpsc-70re-q059
    difficulty: medium
    stem: Who is the Chairperson of GST Council ?
    options:
      A: Chairman of Finance Commission
      B: Union Finance Minister
      C: Union Minister of Corporate Affairs
      D: RBI Governor
    answer: B
    explanation: Under Article 279A the Union Finance Minister chairs the GST Council.
  - slug: bpsc-70re-q060
    difficulty: medium
    stem: When was the Bihar State formed ?
    options:
      A: "1906"
      B: "1915"
      C: "1911"
      D: None of the above
    answer: D
    explanation: Bihar (with Orissa) was carved out of Bengal Presidency on 22 March 1912, which is not among the options.
  - slug: bpsc-70re-q061
    difficulty: medium
    stem: Sour taste of vinegar is due to
    options:
      A: Citric acid
      B: Tartaric acid
      C: Lactic acid
      D: None of these
    answer: D
    explanation: Vinegar is a 5-8% solution of acetic acid, which is not among the options.
  - slug: bpsc-70re-q062
    difficulty: medium
    stem: During the Delhi Sultanate, the designation ‘Muqaddam or Chaudhuri’ was used for
    options:
      A: Revenue officials
      B: Village headmen
      C: Village accountant
      D: None of the above
    answer: B
    explanation: Under the Delhi Sultanate, muqaddam or chaudhuri meant the village headman (or a group of villages' headman). The accountant was the patwari.
  - slug: bpsc-70re-q063
    difficulty: medium
    stem: Who won the Nobel Peace Prize in 2023 ?
    options:
      A: Narges Mohammadi
      B: Maria Ressa
      C: Nadia Murad
      D: Abiy Ahmed
    answer: A
    explanation: The 2023 Nobel Peace Prize went to Narges Mohammadi of Iran.
  - slug: bpsc-70re-q064
    difficulty: medium
    stem: ‘Tarikh-i-Firuz Shahi’ was written by
    options:
      A: Minhaj Siraj
      B: Isami
      C: Yahya Sarhindi
      D: Shams Siraj Afif
    answer: D
    explanation: Shams Siraj Afif wrote a 'Tarikh-i-Firoz Shahi'. Barani also wrote one, but he is not offered.
  - slug: bpsc-70re-q065
    difficulty: medium
    stem: Choose the odd pair among the following options.
    options:
      A: "Thar : India"
      B: "Sahara : Africa"
      C: "Kalahari : America"
      D: "Gobi : Mongolia"
    answer: C
    explanation: The Kalahari is in southern Africa, not America. The other desert-region pairs are correct.
  - slug: bpsc-70re-q066
    difficulty: medium
