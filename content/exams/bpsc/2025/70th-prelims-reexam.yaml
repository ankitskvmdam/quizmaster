      A: Chittaranjan Das
      B: Mahatma Gandhi
      C: Hakim Ajmal Khan
      D: None of the above
    answer: A
    explanation: C. R. Das presided over the Gaya Congress of 1922 and then formed the Swaraj Party.
  - slug: bpsc-70re-q131
    difficulty: medium
    stem: The expanded form of UPI is
    options:
      A: Unified Payment Interface
      B: United Payment Initiation
      C: Uniform Payment Inception
      D: Uninterrupted Payment Initiation
    answer: A
    explanation: UPI stands for Unified Payments Interface, built by NPCI.
  - slug: bpsc-70re-q132
    difficulty: medium
    stem: Liver stores
    options:
      A: A, B and C vitamins
      B: A, B, C and D vitamins
      C: Only A and B vitamins
      D: None of these
    answer: D
    explanation: Final key changed B to D. The liver stores the fat-soluble vitamins A, D, E and K and much of B12 but not vitamin C, so A, B and C are wrong.
  - slug: bpsc-70re-q133
    difficulty: medium
    stem: Which State of India is called as the State of Minerals ?
    options:
      A: Bihar
      B: Jharkhand
      C: West Bengal
      D: Orissa
    answer: D
    explanation: The key gives Orissa (Odisha), India's leading mineral producer by value. Jharkhand is also popularly called the mineral state, so the question is ambiguous.
  - slug: bpsc-70re-q134
    difficulty: medium
    stem: Chitrakoot temple is located in which State of India ?
    options:
      A: Madhya Pradesh
      B: Uttar Pradesh
      C: Orissa
      D: Chhattisgarh
    answer: A
    explanation: The temples of Chitrakoot (Kamadgiri, Ramghat) are mostly in Satna district, MP, though Chitrakoot also spills into UP.
  - slug: bpsc-70re-q135
    difficulty: medium
    stem: Minimum age for M.P. (Lower house), M.P. (Upper house) and President is
    options:
      A: 25, 30 and 30
      B: 25, 35 and 35
      C: 25, 35 and 45
      D: 25, 30 and 35
    answer: D
    explanation: The minimum age is 25 for the Lok Sabha (Article 84), 30 for the Rajya Sabha and 35 for the President (Article 58).
  - slug: bpsc-70re-q136
    difficulty: medium
    stem: What is the unit of measure of magnetic field ?
    options:
      A: Ohm
      B: Tesla
      C: Ampere
      D: Cobalt
    answer: B
    explanation: The SI unit of magnetic field (flux density) is the tesla.
  - slug: bpsc-70re-q137
    difficulty: medium
    stem: The person who has been President of India, Ambassador to USA, China, Turkey and Thailand alongwith vice chancellor to Jawahar Lal University. He is
    options:
      A: K. R. Narayan
      B: R. Venkatraman
      C: Dr. Shankar Dayal Sharma
      D: Dr. S. Radha Krishnan
    answer: A
    explanation: K. R. Narayanan served as ambassador to Thailand, Turkey, China and the USA, was Vice-Chancellor of JNU and became President in 1997.
  - slug: bpsc-70re-q138
    difficulty: medium
    stem: Amid the distributaries of which river is situated Divi Island ?
    options:
      A: Godavari
      B: Krishna
      C: Vimasadhara
      D: Mahananda
    answer: B
