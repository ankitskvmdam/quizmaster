  - slug: bpsc-70re-q139
    difficulty: medium
    stem: |-
      If triangle represents Men, rectangle represents Businessman and circle represents Millionaire, then which number represents Men that are both Businessman and Millionaire ?

      *(Figure: Venn-type diagram of three overlapping shapes: a circle at top centre; a large rectangle below and to the left whose top edge passes through about the middle of the circle; and a large triangle on the right (apex at top right above the circle, one vertex at bottom right outside the rectangle, the third vertex inside the rectangle below the circle) whose upper-left side cuts diagonally across the circle. Numbers: 7 in the circle only (above the rectangle, left of the triangle); 8 in circle and rectangle, outside the triangle; 3 in circle and triangle just above the rectangle's top edge (outside the rectangle); 10 in the area common to circle, rectangle and triangle; 12 in rectangle and triangle, outside the circle; 13 in the triangle only, right of the rectangle.)*
    options:
      A: "10"
      B: "3"
      C: "13"
      D: "12"
    answer: A
    explanation: Men who are both businessmen and millionaires lie where the triangle, rectangle and circle all overlap, which is 10.
  - slug: bpsc-70re-q140
    difficulty: medium
    stem: Which among the following is a tool of Fiscal Policy ?
    options:
      A: Credit Ceiling
      B: Bank Rate
      C: Cash Reserve Ratio
      D: Taxes
    answer: D
    explanation: Taxes (with public spending) are fiscal tools. Credit ceiling, bank rate and CRR are monetary tools.
  - slug: bpsc-70re-q141
    difficulty: medium
    stem: Steam methane reforming technique is used to obtain
    options:
      A: Green Hydrogen
      B: Brown Hydrogen
      C: Grey Hydrogen
      D: None of the above
    answer: C
    explanation: Steam methane reforming of natural gas without carbon capture produces grey hydrogen.
  - slug: bpsc-70re-q142
    difficulty: medium
    stem: The primary function of the Finance Commission in India is to
    options:
      A: Advise the President on financial matters
      B: Prepare the annual budget
      C: Allocate funds to various ministries of the Union and State Governments
      D: Distribution of revenue between the Centre and the States
    answer: D
    explanation: Under Article 280 the Finance Commission recommends how tax revenue is shared between the Centre and States.
  - slug: bpsc-70re-q143
    difficulty: medium
    stem: Who first described the Revolt of 1857 as the ‘First Indian War of Independence’ ?
    options:
      A: R. C. Majumdar
      B: V. D. Savarkar
      C: Bal Gangadhar Tilak
      D: None of the above
    answer: B
