  - slug: bpsc-70re-q148
    difficulty: medium
    stem: Compared to a burn due to air at 100°C, the burn due to steam at 100°C is
    options:
      A: Less dangerous due to low latent heat of evaporation
      B: More dangerous due to low latent heat of evaporation
      C: More dangerous due to high latent heat of evaporation
      D: Less dangerous due to high latent heat of evaporation
    answer: C
    explanation: Steam at 100 C also releases its large latent heat of condensation (about 2260 J/g) on the skin, so it burns worse.
  - slug: bpsc-70re-q149
