  - slug: bpsc-70re-q144
    difficulty: medium
    stem: If C is brother of B, B is son of A, D is father of C and A is female, then A is
    options:
      A: Wife of D
      B: Mother of D
      C: Husband of D
      D: Sister of D
    answer: A
    explanation: A is B's and C's mother, and D is their father, so A is D's wife.
  - slug: bpsc-70re-q145
    difficulty: medium
    stem: Standard electrode potential of three metals A, B and C are respectively 0.5 V, −3 V and −1.2 V. Reducing power of these metals would be
    options:
      A: C > B > A
      B: A > C > B
      C: B > C > A
      D: None of the above
    answer: C
    explanation: "The lower the standard reduction potential, the stronger the reducing agent: B (-3 V) > C (-1.2 V) > A (+0.5 V)."
