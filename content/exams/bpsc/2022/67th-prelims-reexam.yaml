  - slug: bpsc-67re-q132
    difficulty: medium
    stem: If 'One Nation One Election' is to be realized in India, which Article of the Indian Constitution will require an amendment?
    options:
      A: Article 246
      B: Article 83
      C: Article 172
      D: Article 356
      E: None of the above/More than one of the above
    answer: E
    explanation: Simultaneous elections need amendments to Articles 83, 85, 172, 174 and 356, so more than one option is right.
  - slug: bpsc-67re-q133
    difficulty: medium
    stem: Which State ***does not*** have Panchayat system?
