  - slug: bpsc-67re-q140
    difficulty: medium
    stem: Which statement is ***not*** true about the poverty estimates based on the 68th round of NSSO?
    options:
      A: The 33·35 per cent population of India was living below the poverty line.
      B: The poverty line defined at ₹ 27·20 per capita per day for rural areas.
      C: The poverty line defined at ₹ 33·33 per capita per day for urban areas.
