slug: 67th-prelims-reexam
title: BPSC 67th Prelims (re-exam)
date: 2022-09-30
label: Series B
marks:
  correct: 1
  wrong: 0
source: BPSC official question booklet and final answer key (bpsc.bihar.gov.in).
questions:
  - slug: bpsc-67re-q001
    difficulty: medium
    stem: Who was allotted the Portfolio of the Labour Department in the Interim Government's Cabinet of 1946 AD?
    options:
      A: Syed Ali Zaheer
      B: Jagjivan Ram
      C: Dr. Rajendra Prasad
      D: Dr. Anugraha Narayan Singh
      E: None of the above/More than one of the above
    answer: B
    explanation: Jagjivan Ram held the Labour portfolio in the Interim Government formed on 2 September 1946.
  - slug: bpsc-67re-q002
    difficulty: medium
    stem: In 1942 AD, on the occasion of which festival Jayaprakash Narayan escaped from Hazaribagh jail?
    options:
      A: Deepawali
      B: Baisakhi
      C: Holi
      D: Dussehra
      E: None of the above/More than one of the above
    answer: A
    explanation: JP and five companions scaled the walls of Hazaribagh Central Jail on Deepawali night, 9 November 1942.
  - slug: bpsc-67re-q003
    difficulty: medium
    stem: Dr. Rajendra Prasad was elected the Chairman of the Constituent Assembly in
    options:
      A: December 1946 AD
      B: September 1946 AD
      C: October 1946 AD
      D: November 1946 AD
      E: None of the above/More than one of the above
    answer: A
    explanation: Dr. Rajendra Prasad was elected permanent Chairman (President) of the Constituent Assembly on 11 December 1946.
  - slug: bpsc-67re-q004
    difficulty: medium
    stem: Who is known as 'Frontier Gandhi'?
    options:
      A: Abdul Gaffar Khan
      B: M. A. Jinnah
      C: Shaukat Ali
      D: Abul Kalam Azad
      E: None of the above/More than one of the above
    answer: A
    explanation: Khan Abdul Ghaffar Khan, leader of the Khudai Khidmatgars in the NWFP, was called 'Frontier Gandhi'.
  - slug: bpsc-67re-q005
    difficulty: medium
    stem: Where was Jhansi Ki Rani Laxmibai died?
    options:
      A: Jhansi
      B: Lucknow
      C: Kanpur
      D: Gwalior
      E: None of the above/More than one of the above
    answer: D
    explanation: Rani Laxmibai fell fighting the British at Kotah-ki-Serai near Gwalior on 18 June 1858.
  - slug: bpsc-67re-q006
    difficulty: medium
    stem: Who has said about Bengal Partition, "The partition announcement fell like a bomb shell"?
    options:
      A: Chittaranjan Das
      B: Surendra Nath Bannerjee
      C: Gopal Krishna Gokhale
      D: Bipin Chandra Pal
      E: None of the above/More than one of the above
    answer: B
    explanation: Surendranath Banerjee wrote that the partition announcement 'fell like a bombshell'.
  - slug: bpsc-67re-q007
    difficulty: medium
    stem: Sardar Udham Singh killed whom?
    options:
      A: Saunders
      B: General Dyer
      C: Curzon Wyllie
      D: Michael O'dwyar
      E: None of the above/More than one of the above
    answer: D
    explanation: Udham Singh shot Sir Michael O'Dwyer, Punjab's Lt. Governor at the time of Jallianwala Bagh, in London in 1940.
  - slug: bpsc-67re-q008
    difficulty: medium
    stem: Who successfully led the Bardoli Satyagraha?
    options:
      A: Jawaharlal Nehru
      B: Vallabhbhai Patel
      C: Motilal Nehru
      D: J. B. Kripalani
      E: None of the above/More than one of the above
    answer: B
    explanation: Vallabhbhai Patel led the 1928 Bardoli Satyagraha and earned the title 'Sardar'.
  - slug: bpsc-67re-q009
    difficulty: medium
    stem: Who among the following was *not* a member of the Cabinet Mission sent to India in 1946 AD?
    options:
      A: Lord Pathick Lawrence
      B: Sir Stafford Cripps
      C: Ramsay MacDonald
      D: A. V. Alexander
      E: None of the above/More than one of the above
    answer: C
    explanation: The Cabinet Mission comprised Pethick-Lawrence, Stafford Cripps and A. V. Alexander; Ramsay MacDonald was not a member.
  - slug: bpsc-67re-q010
    difficulty: medium
    stem: In which year the famous Gandhi-Irwin Pact took place?
    options:
      A: 1932 AD
      B: 1929 AD
      C: 1930 AD
      D: 1931 AD
      E: None of the above/More than one of the above
    answer: D
    explanation: The Gandhi-Irwin Pact was signed on 5 March 1931.
  - slug: bpsc-67re-q011
    difficulty: medium
    stem: In which Session Indian National Congress passed Complete Independence Resolution?
    options:
      A: 1931 AD Karachi
      B: 1920 AD Nagpur
      C: 1924 AD Belgaon
      D: 1929 AD Lahore
      E: None of the above/More than one of the above
    answer: D
    explanation: The Purna Swaraj resolution was passed at the Lahore Session of December 1929 under Nehru.
  - slug: bpsc-67re-q012
    difficulty: medium
    stem: Subhas Chandra Bose renamed Nicobar Island as
    options:
      A: Navodaya Island
      B: Swaraj Island
      C: Shaheed Island
      D: Balidan Island
      E: None of the above/More than one of the above
    answer: B
    explanation: Bose renamed the Andaman as 'Shaheed' and the Nicobar as 'Swaraj' islands in 1943.
  - slug: bpsc-67re-q013
    difficulty: medium
    stem: In which state is 'Chauri Chaura', where in February 1922 AD a police station was set on fire?
    options:
      A: Uttar Pradesh
      B: Rajasthan
      C: Madhya Pradesh
      D: Bihar
      E: None of the above/More than one of the above
    answer: A
    explanation: Chauri Chaura is in Gorakhpur district, Uttar Pradesh.
  - slug: bpsc-67re-q014
    difficulty: medium
    stem: In which place Khudiram Bose tried to kill Kingsford?
    options:
      A: Gaya
      B: Patna
      C: Darbhanga
      D: Muzaffarpur
      E: None of the above/More than one of the above
    answer: D
    explanation: Khudiram Bose and Prafulla Chaki attacked a carriage they took to be Kingsford's at Muzaffarpur in 1908.
  - slug: bpsc-67re-q015
    difficulty: medium
    stem: During which Movement 'Azad Dasta' was active in Bihar?
    options:
      A: Quit India Movement
      B: Champaran Satyagraha
      C: Non-Cooperation Movement
      D: Civil Disobedience Movement
      E: None of the above/More than one of the above
    answer: A
    explanation: Azad Dasta was the underground guerrilla wing organised by JP during the Quit India Movement.
  - slug: bpsc-67re-q016
    difficulty: medium
    stem: How many numbers between 100 and 500 are divisible by 4, 5 and 6?
    options:
      A: "8"
      B: "5"
      C: "6"
      D: "7"
      E: None of the above/More than one of the above
    answer: D
    explanation: LCM of 4, 5, 6 is 60; multiples between 100 and 500 are 120, 180, ..., 480, i.e. 7 numbers.
  - slug: bpsc-67re-q017
    difficulty: medium
    stem: "In a mixture of 70 kg, the ratio of sand and cement is 4 : 1. How much sand should be added to the mixture so that the ratio of sand and cement in it becomes 6 : 1?"
    options:
      A: 32 kg
      B: 24 kg
      C: 28 kg
      D: 30 kg
      E: None of the above/More than one of the above
    answer: C
    explanation: Sand 56 kg, cement 14 kg; for 6:1 sand must be 84 kg, so add 28 kg.
  - slug: bpsc-67re-q018
    difficulty: medium
    stem: Shashi loses 25% by selling oranges at the rate of ₹ 150 per dozen. At what rate should she sell them to get a profit of 20%?
    options:
      A: ₹ 250 per dozen
      B: ₹ 220 per dozen
      C: ₹ 230 per dozen
      D: ₹ 240 per dozen
      E: None of the above/More than one of the above
    answer: D
    explanation: SP 150 = 75% of CP, so CP = 200; 20% profit needs SP = 240 per dozen.
  - slug: bpsc-67re-q019
    difficulty: medium
    stem: The lengths of the diagonals of a rhombus are 10 cm and 24 cm. Its perimeter is
    options:
      A: 60 cm
      B: 48 cm
      C: 52 cm
      D: 56 cm
      E: None of the above/More than one of the above
    answer: C
    explanation: Half-diagonals 5 and 12 give side 13 cm; perimeter = 4 x 13 = 52 cm.
  - slug: bpsc-67re-q020
    difficulty: medium
    stem: A train of length 140 m is running at a speed of 60 km/hr and a dog is running in the same direction parallel to the train at a speed of 18 km/hr. The train will cross the dog in
    options:
      A: 12½ seconds
      B: 10 seconds
      C: 11 seconds
      D: 12 seconds
      E: None of the above/More than one of the above
    answer: D
    explanation: Relative speed 42 km/h = 35/3 m/s; time = 140 / (35/3) = 12 s.
  - slug: bpsc-67re-q021
    difficulty: medium
    stem: A clock is set right at 6 a.m. It gains 10 minutes in 24 hours. What will be the right time when the clock indicates 11 a.m. on the next day?
    options:
      A: 54 minutes past 10
      B: 10 a.m.
      C: 48 minutes past 10
      D: 50 minutes past 10
      E: None of the above/More than one of the above
    answer: C
    explanation: Clock shows 29 h elapsed; true time = 29 x 24/(24 1/6) = 28.8 h = 28 h 48 min after 6 a.m., i.e. 10:48 a.m.
  - slug: bpsc-67re-q022
    difficulty: medium
    stem: At what time between 5 and 6 will the two hands of a watch coincide?
    options:
      A: 28 minutes past 5
      B: 26 minutes past 5
      C: 27 minutes past 5
      D: 27 3/11 minutes past 5
      E: None of the above/More than one of the above
    answer: D
    explanation: Hands coincide at (60/11) x 5 = 27 3/11 minutes past 5.
  - slug: bpsc-67re-q023
    difficulty: medium
    stem: Anil and Suman together can do a work in 12 days, which Anil alone can do in 20 days. If Suman alone has to do this work, he will take
    options:
      A: 30 days
      B: 27 days
      C: 28 days
      D: 29 days
      E: None of the above/More than one of the above
    answer: A
    explanation: Suman's rate = 1/12 - 1/20 = 1/30, so 30 days.
  - slug: bpsc-67re-q024
    difficulty: medium
    stem: In a class of 55 students, 34 like to play Cricket and 26 like to play Badminton. Also, each student likes to play at least one of the two games. How many students like to play both Cricket and Badminton?
    options:
      A: "6"
      B: "3"
      C: "4"
      D: "5"
      E: None of the above/More than one of the above
    answer: D
    explanation: Both = 34 + 26 - 55 = 5.
  - slug: bpsc-67re-q025
    difficulty: medium
    stem: What are the two natural numbers whose product is 2400 and the sum of whose squares is 5200?
    options:
      A: 60, 40
      B: 120, 20
      C: 80, 30
      D: 75, 32
      E: None of the above/More than one of the above
    answer: A
    explanation: 60 x 40 = 2400 and 3600 + 1600 = 5200.
  - slug: bpsc-67re-q026
    difficulty: medium
    stem: Plants receive their nutrients mainly from
    options:
      A: soil
      B: chlorophyll
      C: atmosphere
      D: light
      E: None of the above/More than one of the above
    answer: A
    explanation: Plants absorb their mineral nutrients mainly from the soil through roots.
  - slug: bpsc-67re-q027
    difficulty: medium
    stem: Pine, Fir, Spruce, Cedar, Larch and Cypress are the famous timber-yielding plants of which several also occur widely in the hilly regions of India. All these belong to
    options:
      A: dicotyledons
      B: angiosperm
      C: gymnosperm
      D: monocotyledons
      E: None of the above/More than one of the above
    answer: C
    explanation: Pine, fir, spruce, cedar, larch and cypress are conifers, i.e. gymnosperms.
  - slug: bpsc-67re-q028
    difficulty: medium
    stem: From the following pairs, find the one which is correctly matched.
    options:
      A: Malaria—Chloroquine
      B: Scurvy—Thiamine
      C: Tuberculosis—ATS
      D: Tetanus—BCG
      E: None of the above/More than one of the above
    answer: A
    explanation: Chloroquine is an antimalarial; scurvy is vitamin C deficiency, BCG is for TB and ATS for tetanus.
  - slug: bpsc-67re-q029
    difficulty: medium
    stem: The animal without red blood cells is
    options:
      A: peacock
      B: frog
      C: earthworm
      D: snake
      E: None of the above/More than one of the above
    answer: C
    explanation: Earthworm haemoglobin is dissolved in plasma; it has no red blood cells.
  - slug: bpsc-67re-q030
    difficulty: medium
    stem: The ultimate substance to which the carbohydrates are degraded, is
    options:
      A: maltose
      B: amino acid
      C: glycerol
      D: glucose
      E: None of the above/More than one of the above
    answer: D
    explanation: Carbohydrates are finally digested to monosaccharides, chiefly glucose.
  - slug: bpsc-67re-q031
    difficulty: medium
    stem: Most of the enzymes are
    options:
      A: alkalis
      B: proteins
      C: lipids
      D: acids
      E: None of the above/More than one of the above
    answer: B
    explanation: Almost all enzymes are proteins (ribozymes being the exception).
  - slug: bpsc-67re-q032
    difficulty: medium
    stem: Who was the first scientist/doctor, who attempted vaccination?
    options:
      A: Edward Jenner
      B: Joseph Lister
      C: Robert Koch
      D: Elie Metchnikoff
      E: None of the above/More than one of the above
    answer: A
    explanation: Edward Jenner introduced smallpox vaccination in 1796.
  - slug: bpsc-67re-q033
    difficulty: medium
    stem: The working principle of a washing machine is
    options:
      A: dialysis
      B: reverse osmosis
      C: diffusion
      D: centrifugation
      E: None of the above/More than one of the above
    answer: D
    explanation: The spin/dry cycle works on centrifugation, throwing water out of the clothes.
  - slug: bpsc-67re-q034
    difficulty: medium
    stem: The speed of light will be minimum while passing through
    options:
      A: glass
      B: water
      C: vacuum
      D: air
      E: None of the above/More than one of the above
    answer: A
    explanation: Glass has the highest refractive index of the options, so light is slowest in it.
  - slug: bpsc-67re-q035
    difficulty: medium
    stem: Which of the following is *not* a vector quantity?
    options:
      A: Displacement
      B: Speed
      C: Velocity
      D: Torque
      E: None of the above/More than one of the above
    answer: B
    explanation: Speed is a scalar; displacement, velocity and torque are vectors.
  - slug: bpsc-67re-q036
    difficulty: medium
    stem: If the spinning speed of the earth increases, then the weight of the body at the equator will
    options:
      A: be doubled
      B: increase
      C: decrease
      D: remain same
      E: None of the above/More than one of the above
    answer: C
    explanation: Faster rotation raises the centrifugal effect at the equator, so apparent weight decreases.
  - slug: bpsc-67re-q037
    difficulty: medium
    stem: Who is the first person to define speed?
    options:
      A: Ptolemy
      B: Galileo
      C: Newton
      D: Kepler
      E: None of the above/More than one of the above
    answer: B
    explanation: Galileo first defined speed as distance covered per unit time.
  - slug: bpsc-67re-q038
    difficulty: medium
    stem: What is the law in which under the same conditions of temperature and pressure, equal volumes of all gases contain equal number of molecules?
    options:
      A: Avogadro's law
      B: Coriolis effect
      C: Graham's law
      D: Pascal's law
      E: None of the above/More than one of the above
    answer: A
    explanation: "Avogadro's law: equal volumes of gases at the same T and P contain equal numbers of molecules."
  - slug: bpsc-67re-q039
    difficulty: medium
    stem: The 'theory of relativity' is presented by which scientist?
    options:
      A: Marie Curie
      B: Albert Einstein
      C: Isaac Newton
      D: Stephen Hawking
      E: None of the above/More than one of the above
    answer: B
    explanation: Albert Einstein gave the special (1905) and general (1915) theories of relativity.
  - slug: bpsc-67re-q040
    difficulty: medium
    stem: Due to temperature variation along a conductor, potential variation occurs along it. This phenomenon is known as
    options:
      A: Peltier effect
      B: Thomson effect
      C: Joule effect
      D: Seebeck effect
      E: None of the above/More than one of the above
    answer: B
    explanation: The Thomson effect is the emf/heat along a single conductor with a temperature gradient.
  - slug: bpsc-67re-q041
    difficulty: medium
    stem: What type of lens is used in magnifying glass?
    options:
      A: Convex mirror
      B: Concave lens
      C: Plano-concave lens
      D: Convex lens
      E: None of the above/More than one of the above
    answer: D
    explanation: A magnifying glass is a convex (converging) lens.
  - slug: bpsc-67re-q042
    difficulty: medium
    stem: The paramagnetic theory of magnetism applies to
    options:
      A: platinum
      B: nickel
      C: mercury
      D: iron
      E: None of the above/More than one of the above
    answer: A
    explanation: Platinum is paramagnetic; iron and nickel are ferromagnetic and mercury is diamagnetic.
  - slug: bpsc-67re-q043
    difficulty: medium
    stem: The nucleus of an atom consists of
    options:
      A: electrons only
      B: electrons and neutrons
      C: electrons and protons
      D: protons and neutrons
      E: None of the above/More than one of the above
    answer: D
    explanation: The nucleus contains protons and neutrons.
  - slug: bpsc-67re-q044
    difficulty: medium
    stem: The metallurgical process in which a metal is obtained in a fused state is called
    options:
      A: froth floatation
      B: smelting
      C: roasting
      D: calcination
      E: None of the above/More than one of the above
    answer: B
    explanation: Smelting reduces the ore so the metal is obtained in the molten (fused) state.
  - slug: bpsc-67re-q045
    difficulty: medium
    stem: Which among the following are constituents of brass?
    options:
      A: Iron and copper
      B: Zinc and copper
      C: Iron and zinc
      D: Copper and nickel
      E: None of the above/More than one of the above
    answer: B
    explanation: Brass is an alloy of copper and zinc.
  - slug: bpsc-67re-q046
    difficulty: medium
    stem: Which among the following is known as quicklime?
    options:
      A: CaCl₂
      B: CaO
      C: CaCO₂
      D: Ca(OH)₂
      E: None of the above/More than one of the above
    answer: B
    explanation: Quicklime is calcium oxide, CaO.
  - slug: bpsc-67re-q047
    difficulty: medium
    stem: What happens to the weight of iron, when it rusts?
    options:
      A: Remains same
      B: Increases for long time
      C: Decreases then increases
      D: Increases then decreases
      E: None of the above/More than one of the above
    answer: B
    explanation: Rust is hydrated iron oxide, so the mass keeps increasing as rusting proceeds. Provisional key said D; the final key corrected it to B.
  - slug: bpsc-67re-q048
    difficulty: medium
    stem: Which among the following is also known as white metal?
    options:
      A: Palladium
      B: Nickel
      C: Rhodium
      D: Platinum
      E: None of the above/More than one of the above
    answer: E
    explanation: "'White metal' is a tin/lead-based bearing alloy, not any of the listed elements. Provisional key said D (platinum); the final key changed it to E."
  - slug: bpsc-67re-q049
    difficulty: medium
    stem: |-
      Consider the following statements with respect to noble metals :

      1. Noble metals are found in pure form in nature.
      2. Uranium and lead are examples of noble metal.

      Which of the above statements is/are correct?
    options:
      A: Brass is also noble metal
      B: 1 only
      C: 2 only
      D: Both 1 and 2
      E: None of the above/More than one of the above
    answer: B
    explanation: Noble metals (gold, platinum) occur native; uranium and lead are not noble metals, so only 1 is correct.
  - slug: bpsc-67re-q050
    difficulty: medium
    stem: |-
      Consider the following statements :

      1. Addition of salt to pure water increases the boiling point of water and decreases the freezing point of water.
      2. When methyl alcohol is added to water, boiling point of water decreases.

      Which of the above statements is/are correct?
    options:
      A: Both 1 and 2
      B: Salt and methyl alcohol are same in behaviour
      C: 1 only
      D: 2 only
      E: None of the above/More than one of the above
    answer: A
    explanation: Salt raises the boiling point and lowers the freezing point; volatile methyl alcohol lowers the boiling point of the mixture.
  - slug: bpsc-67re-q051
    difficulty: medium
    stem: Which among the following is the main constituent of biogas?
    options:
      A: Ethane
      B: Methane
      C: Propane
      D: Butane
      E: None of the above/More than one of the above
    answer: B
    explanation: Biogas is about 50-75% methane.
  - slug: bpsc-67re-q052
    difficulty: medium
    stem: Which among the following would cause the bright red colour due to bursting of crackers?
    options:
      A: Magnesium
      B: Strontium
      C: Sodium
      D: Sulphur
      E: None of the above/More than one of the above
    answer: B
    explanation: Strontium salts give the crimson red colour in fireworks.
  - slug: bpsc-67re-q053
    difficulty: medium
    stem: What are salt-loving plants called?
    options:
      A: Halophytes
      B: Xerophytes
      C: Mesophytes
      D: Glycophytes
      E: None of the above/More than one of the above
    answer: A
    explanation: Halophytes grow in saline soils.
  - slug: bpsc-67re-q054
    difficulty: medium
    stem: Fungi are plants that lack
    options:
      A: sunlight
      B: oxygen
      C: carbon dioxide
      D: chlorophyll
      E: None of the above/More than one of the above
    answer: D
    explanation: Fungi lack chlorophyll and are heterotrophic.
  - slug: bpsc-67re-q055
    difficulty: medium
    stem: Pollination is best defined as
    options:
      A: visiting flowers by insects
      B: transfer of pollen grain from anther to stigma
      C: germination of pollen grains
      D: growth of pollen tube in ovule
      E: None of the above/More than one of the above
    answer: B
    explanation: Pollination is the transfer of pollen from anther to stigma.
  - slug: bpsc-67re-q056
    difficulty: medium
    stem: |-
      Match List-I with List-II :

      | List-I | List-II |
      |---|---|
      | a. Governor of Bihar | 1. Mr. Nitish Kumar |
      | b. Chief Justice of Bihar | 2. Mr. H. R. Srinivas |
      | c. Chief Minister of Bihar | 3. Mr. Sanjay Karol |
      | d. Chief Electoral Officer of Bihar | 4. Mr. Fagu Chauhan |

      Choose the correct answer from the options given below.
    options:
      A: a-4, b-2, c-1, d-3
      B: a-3, b-2, c-1, d-4
      C: a-1, b-2, c-3, d-4
      D: a-4, b-3, c-1, d-2
      E: None of the above/More than one of the above
    answer: D
    explanation: In 2022 Phagu Chauhan was Governor, Sanjay Karol Chief Justice, Nitish Kumar CM and H. R. Srinivas CEO of Bihar.
  - slug: bpsc-67re-q057
    difficulty: medium
    stem: The 'Operation Prahar' in Bihar is related to
    options:
      A: liquor ban
      B: COVID-19 vaccination
      C: literacy campaign
      D: no smoking
      E: None of the above/More than one of the above
    answer: A
    explanation: Bihar Police's Operation Prahar (2022) targeted prohibition (liquor ban) violators and criminals (Drishti IAS, May 2022).
  - slug: bpsc-67re-q058
    difficulty: medium
    stem: Hrithik Anand from Bihar has won which medal for India at the 24th Summer Deaf Badminton Olympics held in Brazil?
    options:
      A: Platinum medal
      B: Gold medal
      C: Silver medal
      D: Bronze medal
      E: None of the above/More than one of the above
    answer: B
    explanation: Hrithik Anand was in India's badminton mixed-team squad that won gold at the 2022 Deaflympics in Caxias do Sul, Brazil.
  - slug: bpsc-67re-q059
    difficulty: medium
    stem: At which place in Bihar, North India's first bird ringing station has been recently opened?
    options:
      A: West Champaran
      B: Bhagalpur
      C: Saran
      D: East Champaran
      E: None of the above/More than one of the above
    answer: B
    explanation: North India's first bird ringing station was opened at Bhagalpur in 2022.
  - slug: bpsc-67re-q060
    difficulty: medium
    stem: Which of the following in Bihar started the Vulture's Conservation Plan?
    options:
      A: Kanwar Lake Bird Sanctuary
      B: Kaimur Tiger Reserve
