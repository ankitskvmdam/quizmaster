    options:
      A: Harmonious life
      B: Economic development
      C: Build human capital
      D: Environment protection
      E: None of the above/More than one of the above
    answer: E
    explanation: Community development aims at all-round development, including economic progress and human capital, so more than one option fits.
  - slug: bpsc-67re-q128
    difficulty: medium
    stem: Electoral College for the 16th Vice Presidential Election of India for 2022 consists of how many members?
    options:
