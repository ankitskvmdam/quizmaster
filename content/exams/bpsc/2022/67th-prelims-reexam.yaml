      B: Nagaland
      C: Mizoram
      D: Meghalaya
      E: None of the above/More than one of the above
    answer: E
    explanation: Nagaland, Meghalaya and Mizoram are outside Part IX (Article 243M), so more than one option is right.
  - slug: bpsc-67re-q134
    difficulty: medium
    stem: The division of each State into territorial constituencies for the Lok Sabha is done by the Delimitation Commission. This delimitation has been freezed till which year?
    options:
      A: "2027"
      B: "2024"
      C: "2025"
      D: "2026"
      E: None of the above/More than one of the above
    answer: D
    explanation: The 84th Amendment (2001) froze the delimitation of constituencies until after the first census after 2026.
  - slug: bpsc-67re-q135
