  - slug: bpsc-67re-q126
    difficulty: medium
    stem: To review the financial position of Panchayats, the State Government constitutes every five years a/an
    options:
      A: advisory committee
      B: finance commission
      C: finance committee
      D: advisory commission
      E: None of the above/More than one of the above
