  - slug: bpsc-67re-q129
    difficulty: medium
    stem: The Indian President is eligible for re-election for how many times?
    options:
      A: Any number of times
      B: Once
      C: Twice
      D: Thrice
      E: None of the above/More than one of the above
    answer: A
    explanation: "Article 57: a President is eligible for re-election with no limit on terms."
  - slug: bpsc-67re-q130
    difficulty: medium
    stem: Generally how many sessions are there in the Lok Sabha?
    options:
      A: "6"
      B: "3"
      C: "4"
      D: "5"
      E: None of the above/More than one of the above
    answer: B
    explanation: "Lok Sabha usually has three sessions: Budget, Monsoon and Winter."
  - slug: bpsc-67re-q131
    difficulty: medium
    stem: Who was the Chairman of the First Law Commission in Independent India?
