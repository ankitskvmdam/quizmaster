  - slug: bpsc-67re-q119
    difficulty: medium
    stem: |-
      Consider the following statements :

      1. In India, the Project Tiger was launched in 1973.
      2. The theme for National Biodiversity in 2022 is 'Building a shared future for all life'.
      3. The Project Tiger is a tiger conservation programme.

      Which of the above statements is/are correct?
    options:
      A: 1, 2 and 3
      B: 1 only
      C: 1 and 3 only
      D: 2 and 3 only
      E: None of the above/More than one of the above
    answer: A
    explanation: Project Tiger began in 1973 for tiger conservation; 'Building a shared future for all life' was the 2022 Biodiversity Day theme.
  - slug: bpsc-67re-q120
    difficulty: medium
    stem: For which cultivation Karewas are famous?
