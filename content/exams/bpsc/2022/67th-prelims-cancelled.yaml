  - slug: bpsc-67x-q007
    difficulty: medium
    stem: A piece of ice is floating in a beaker containing water up to its brim. When whole of the ice melts
    options:
      A: the water will spill on the floor
      B: the level of water will come down in the beaker
      C: the level of water will first fall and then it will spill out of the beaker
      D: the water level will not change
      E: None of the above/More than one of the above
    answer: D
    explanation: |-
      **Unofficial answer (AI).** BPSC cancelled this sitting and never published an answer key.

      Floating ice displaces its own weight of water; on melting it occupies exactly that displaced volume, so the level stays the same.
