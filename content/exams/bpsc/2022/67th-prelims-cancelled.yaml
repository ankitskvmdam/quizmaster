questions:
  - slug: bpsc-67x-q001
    difficulty: medium
    stem: A person standing in front of a mirror finds his image larger than himself. This implies that the mirror is
    options:
      A: concave
      B: plane
      C: convex
      D: cylindrical with bulging side outwards
      E: None of the above/More than one of the above
    answer: A
    explanation: |-
      **Unofficial answer (AI).** BPSC cancelled this sitting and never published an answer key.

      Only a concave mirror forms an enlarged (virtual, erect) image when the object is between the pole and focus; plane mirrors give same-size and convex mirrors diminished images.
  - slug: bpsc-67x-q002
    difficulty: medium
    stem: A fan produces a feeling of comfort during the hot weather because
    options:
      A: fan supplies cool air
      B: our body radiates more heat in air
      C: conductivity of air increases
      D: our perspiration evaporates rapidly
      E: None of the above/More than one of the above
    answer: D
    explanation: |-
      **Unofficial answer (AI).** BPSC cancelled this sitting and never published an answer key.

      Moving air speeds up evaporation of sweat; evaporation absorbs latent heat from the skin, which cools us. The fan does not cool the air itself.
  - slug: bpsc-67x-q003
    difficulty: medium
    stem: Twinkling of stars in clear sky during nighttime can be explained with
    options:
      A: refraction of light
      B: reflection of light
      C: polarization of light
      D: interference of light
      E: None of the above/More than one of the above
    answer: A
    explanation: |-
      **Unofficial answer (AI).** BPSC cancelled this sitting and never published an answer key.

      Starlight is refracted repeatedly by atmospheric layers of varying density, so the apparent position and brightness of a point source keep changing (twinkling).
