  - slug: cgl-2017-08-12-s3-q059
    difficulty: medium
    stem: Diameter of wheel of a cycle is 21 cm. The cyclist takes 45 minutes to reach a destination at a speed of 16.5 km/hr. How many revolutions will the wheel make during the journey?
    options:
      A: "12325"
      B: "18750"
      C: "21000"
      D: "24350"
    answer: B
    explanation: Distance = 16.5 km/h × 0.75 h = 12.375 km = 1,237,500 cm. Circumference = 22/7 × 21 = 66 cm, so 1,237,500 ÷ 66 = 18,750 revolutions.
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q060
    difficulty: medium
    stem: A person invested a total sum of Rs 7900 in three different schemes of simple interest at 3%, 5% and 8% per annum. At the end of one year he got same interest in all three schemes. What is the money (in Rs) invested at 3%?
    options:
