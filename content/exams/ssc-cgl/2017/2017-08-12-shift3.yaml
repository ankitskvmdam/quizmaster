  - slug: cgl-2017-08-12-s3-q051
    difficulty: medium
    stem: How many numbers are there from 300 to 700 which are divisible by 2, 3 and 7?
    options:
      A: "7"
      B: "8"
      C: "9"
      D: "10"
    answer: C
    explanation: "The number must be divisible by LCM(2, 3, 7) = 42. The multiples of 42 from 300 to 700 run from 336 (42×8) to 672 (42×16): 9 numbers."
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q052
    difficulty: medium
    stem: A and B do (3/5)th part of a work and the rest of the work is completed by C. If A, B and C take the same work for Rs 5000, then what is the share of C (in Rs)?
    options:
      A: "3000"
      B: "2500"
      C: "2000"
      D: "1500"
    answer: C
    explanation: C does 1 − 3/5 = 2/5 of the work, so C's share = 2/5 × 5000 = ₹2000.
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q053
    difficulty: medium
    stem: A solid cone of height 36 cm and radius of base 9 cm is melted to form a solid cylinder of radius 9 cm and height 9 cm. What percent of material is wasted this process?
    options:
      A: "25"
      B: "0"
      C: "5"
      D: "10"
    answer: A
    explanation: Cone = (1/3)π·81·36 = 972π; cylinder = π·81·9 = 729π. Waste = 243π, which is 243/972 = 25%.
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q054
