  - slug: cgl-2017-08-12-s3-q057
    difficulty: medium
    stem: Profit obtained on selling an article for Rs 540 is equal to the loss incurred on selling the article for Rs 370. If selling price is Rs. 910, then what is the profit percentage?
    options:
