    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q010
    difficulty: medium
    stem: Pointing towards a man, Ritika said "He is the son of my grandfather's only son". How is Ritika related to that man?
    options:
      A: Aunty
      B: Sister
      C: Mother
      D: Wife
    answer: B
    explanation: The only son of Ritika's grandfather is her father, so the man is her father's son, her brother. Ritika is his sister.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q011
    difficulty: medium
    stem: Among four books, Book1 is twice as heavy as Book 2. Book 3's weight is half of Book 2's weight. Book 4 is 60 grams more as compared to Book 2 but 60 grams less as compared Book 1. Which book is heaviest?
    options:
      A: Book 1
      B: Book 2
      C: Book 3
      D: Book 4
    answer: A
    explanation: Let Book 2 = x. Then Book 1 = 2x and Book 4 = x + 60 = 2x − 60, so x = 120. Book 1 = 240 g is the heaviest.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q012
    difficulty: medium
    stem: |-
      In the following question, from the given alternative words, select the word which cannot be formed using the letters of the given word.

      Improvement
    options:
      A: Rope
      B: Trim
      C: Important
      D: Prove
    answer: C
    explanation: IMPROVEMENT has no letter A, so 'Important' cannot be formed. Rope, Trim and Prove can.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q013
    difficulty: medium
    stem: In a certain code language, "MASTER" is written as "682145" and "STAMP" is written as "21869". How is "PASTE" written in that code language?
    options:
      A: "82145"
      B: "98214"
      C: "69218"
      D: "95184"
    answer: B
    explanation: "From the two codes: M=6, A=8, S=2, T=1, E=4, R=5, P=9. So PASTE = 9 8 2 1 4 = 98214."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q014
    difficulty: medium
    stem: |-
      If "K" denotes "multiplied by", "M" denotes "subtracted from", "J" denotes "added to" and "L" denotes "divided by", then

      44 M 24 K 56 L 14 J 60 = ?
    options:
      A: "16"
      B: "72"
      C: "8"
      D: "140"
    answer: C
    explanation: "Replacing the letters: 44 − 24 × 56 ÷ 14 + 60 = 44 − 96 + 60 = 8."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q015
    difficulty: medium
    stem: If 27 (15) 33 and 41 (13) 53, then what is the value of 'A' in 26 (A) 35?
    options:
      A: "16"
      B: "13"
      C: "14"
      D: "11"
    answer: A
    explanation: "The middle number is the sum of all the digits: 2+7+3+3 = 15 and 4+1+5+3 = 13. So 2+6+3+5 = 16."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q016
    difficulty: medium
    stem: |-
      In the following question, select the number which can be placed at the sign of question mark (?) from the given alternatives.

      | 3 | 2 |
      |---|---|
      | 5 | 4 |
      | 1 | 7 |

      | 1 | 2 |
      |---|---|
      | 7 | 6 |
      | 4 | 2 |

      | 2 | 1 |
      |---|---|
      | 3 | 11 |
      | 1 | ? |

      *(Figure: Three separate 3-row × 2-column number grids printed side by side (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: "2"
      B: "4"
      C: "6"
      D: "8"
    answer: B
    explanation: "In each grid the six numbers add up to 22: 3+2+5+4+1+7 = 22 and 1+2+7+6+4+2 = 22. So 2+1+3+11+1+? = 22, which gives 4."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q017
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A square with both its diagonals drawn. On each of its four sides an isosceles triangle points outward (up, down, left, right), forming a four-pointed star. A vertical line runs from the top apex to the bottom apex and a horizontal line runs from the left apex to the right apex, both through the centre of the square.)*
    options:
      A: "28"
      B: "36"
      C: "40"
      D: "48"
    answer: B
    explanation: The square with both diagonals and both midlines holds 16 triangles. Each outward triangle adds 5 more (its two halves, itself, and two triangles joining its apex to a corner and the centre), so 16 + 4 × 5 = 36.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q018
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions. Taking the given statements to be true even if they seem to be at variance from commonly known facts, read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. Some pens are pencils.  
      II. Some pens are erasers.

      Conclusions:

      I. Some pencils are erasers.  
      II. All erasers are pens.
    options:
      A: Only conclusion (I) follows.
      B: Only conclusion (II) follows.
      C: Both conclusion follow.
      D: Neither conclusion (I) nor conclusion (II) follows.
    answer: D
    explanation: Two 'some' statements with the middle term 'pens' give no definite link between pencils and erasers, and 'some pens are erasers' does not mean all erasers are pens. Neither conclusion follows.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q019
    difficulty: medium
    stem: |-
      Two positions of a cube are shown below. What will come opposite to face containing ‘δ’?

      *(Figure: Two views of a cube. View 1: top δ, front ∞, right α. View 2: top β, front θ, right α.)*
    options:
      A: δ
      B: θ
      C: β or θ
      D: β
    answer: D
    explanation: α stays on the right in both views, so the cube has only been rolled about the α axis. A roll that brings two new faces (β, θ) to top and front is a half-turn, which puts the old bottom on top. So β is on the face opposite δ.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q020
    difficulty: medium
    stem: |-
      In the given figure, how many cardboard boxes are not white?

      *(Figure: Venn-type figure: a triangle labelled ‘Cardboard / गत्ता’, a circle labelled ‘Box / डिब्बा’ and a rectangle labelled ‘White / सफेद’. Numbers: 12 in triangle only; 6 in triangle and circle only; 4 in circle only; 7 in all three; 10 in circle and rectangle only; 9 in triangle and rectangle only; 5 in rectangle only (left part); 8 in rectangle only (right corner).)*
    options:
      A: "6"
      B: "13"
      C: "7"
      D: "9"
    answer: A
    explanation: Cardboard boxes are the region shared by the triangle and the circle. The part outside the White rectangle holds 6.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q025
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of **Matrix-I** are numbered from 0 to 4 and that of **Matrix-II** are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, ‘E’ can be represented by 23, 41, etc., and ‘P’ can be represented by 56, 97, etc. Similarly, you have to identify the set for the word “GREAT”.

      Matrix-I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | E | R | G | L | O |
      | 1 | G | L | E | O | R |
      | 2 | R | O | L | E | G |
      | 3 | L | G | O | R | E |
      | 4 | O | E | R | G | L |

      Matrix-II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | M | P | S | T | A |
      | 6 | P | S | T | A | M |
      | 7 | T | M | A | S | P |
      | 8 | S | A | M | P | T |
      | 9 | A | T | P | M | S |

      *(Figure: Two 5 × 5 letter matrices (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: 10, 14, 00, 59, 97
      B: 31, 33, 41, 67, 76
      C: 43, 01, 23, 95, 89
      D: 24, 42, 11, 86, 95
    answer: C
    explanation: "G = 43, R = 01, E = 23, A = 95, T = 89 are all correct in option C. Every other option has a wrong letter (A: 97 = P; B: 67 = T; D: 11 = L)."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q026
    difficulty: medium
    stem: Which of the following is called GDP Deflator?
    options:
      A: Ratio of nominal to real GDP
      B: Ratio of nominal to real GNP
      C: Ratio of nominal to real CPI
      D: Ratio of real to nominal GNP
    answer: A
    explanation: GDP deflator = (Nominal GDP ÷ Real GDP) × 100, the ratio of nominal to real GDP.
    tags:
      - general-awareness
