  - slug: cgl-2017-08-12-s3-q066
    difficulty: medium
    stem: O is the center of the circle and two tangents are drawn from a point P to this circle at points A and B. If ∠AOP = 50°, then what is the value (in degrees) of ∠APB?
    options:
      A: "60"
      B: "80"
      C: "90"
      D: "100"
    answer: B
