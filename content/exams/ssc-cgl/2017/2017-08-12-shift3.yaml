  - slug: cgl-2017-08-12-s3-q056
    difficulty: medium
    stem: The average age of Ram and Rahim is 18 years. The average age of Rahim and Ramesh is 25 years. The average age of Ram and Ramesh is 29 years. What is the age (in years) of the eldest of the three?
    options:
