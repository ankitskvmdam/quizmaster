questions:
  - slug: cgl-2017-08-12-s3-q001
    difficulty: medium
    stem: |-
      In the following question, select the related word from the given alternatives.

      Book : Pages : : Continent : ?
    options:
      A: Water
      B: Forest
      C: Countries
      D: Land
    answer: C
    explanation: A book is made up of pages; a continent is made up of countries.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q002
    difficulty: medium
    stem: |-
      In the following question, select the related letters from the given alternatives.

      JKLM : IIII : : PQRS : ?
    options:
      A: PPPP
      B: OOOO
      C: TTTT
      D: OOPP
    answer: B
    explanation: "Each letter moves back 1, 2, 3, 4 places: J−1, K−2, L−3, M−4 = IIII. So P−1, Q−2, R−3, S−4 = OOOO."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q003
    difficulty: medium
    stem: |-
      In the following question, select the related number from the given alternatives.

      4 : 17 : : 7 : ?
    options:
      A: "49"
      B: "50"
      C: "51"
      D: "52"
    answer: B
    explanation: "The rule is n² + 1: 4² + 1 = 17, so 7² + 1 = 50."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q004
    difficulty: medium
    stem: In the following question, select the odd word pair from the given alternatives.
    options:
      A: "Sad : Hopeful"
      B: "Happy : Ecstatic"
      C: "High : Giant"
      D: "Trail : Pathway"
    answer: A
    explanation: "Happy : Ecstatic, High : Giant and Trail : Pathway are pairs of similar meaning (or degree). Sad : Hopeful are opposite in sense, so it is the odd pair."
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q005
    difficulty: medium
    stem: In the following question, select the odd letters from the given alternatives.
    options:
      A: FHJ
      B: LNQ
      C: JLN
      D: NPR
    answer: B
    explanation: FHJ, JLN and NPR step forward by +2, +2. In LNQ the steps are +2, +3, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q006
    difficulty: medium
    stem: In the following question, select the odd number pair from the given alternatives.
    options:
      A: 11 – 121
      B: 13 – 169
      C: 19 – 391
      D: 21 – 441
    answer: C
    explanation: 11² = 121, 13² = 169 and 21² = 441, but 19² = 361, not 391.
    tags:
      - reasoning
  - slug: cgl-2017-08-12-s3-q007
    difficulty: medium
    stem: |-
      Arrange the given words in the sequence in which they occur in the dictionary.

      1. Feeble  
      2. From  
      3. Floor  
      4. Foam  
      5. Fluorescent
    options:
      A: "13542"
      B: "15342"
