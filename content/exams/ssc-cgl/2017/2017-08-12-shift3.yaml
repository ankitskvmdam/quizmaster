  - slug: cgl-2017-08-12-s3-q067
    difficulty: medium
    stem: In ΔPQR, PQ = PR = 18 cm, AB and AC are parallel to lines PR and PQ respectively. If A is the mid-point of QR, then what is the perimeter (in cm) of quadrilateral ABPC?
    options:
      A: "18"
      B: "28"
      C: "32"
      D: "36"
    answer: D
    explanation: "ABPC is a parallelogram whose sides are each half of PQ or PR (midpoint theorem): 9 + 9 + 9 + 9 = 36 cm."
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q068
    difficulty: medium
    stem: In ΔPQR, PS and PT are bisectors of ∠QPR and ∠QPS respectively. If ∠QPT = 30°, PT = 9 cm and TR = 15 cm, then what is the area (in cm²) of ΔPTR ?
    options:
      A: "36"
      B: "54"
      C: "72"
      D: "216"
    answer: B
    explanation: ∠QPS = 60°, so ∠QPR = 120° and ∠TPR = 120 − 30 = 90°. Then PR = √(15² − 9²) = 12, and the area is ½ × 9 × 12 = 54 cm².
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q069
    difficulty: medium
    stem: What is the simplified value of [2/(cot A – tan A)]?
    options:
      A: sin A cos A
      B: tan 2A
      C: tan² A
      D: sin² A cos² A
    answer: B
    explanation: 2/(cot A − tan A) = 2 sin A cos A/(cos²A − sin²A) = sin 2A/cos 2A = tan 2A.
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q070
    difficulty: medium
    stem: What is the simplified value of √[(cosec A – 1)/(cosec A + 1)]?
    options:
      A: cosec A
      B: sec A – tan A
      C: cosec ²A
      D: tan A – cosec A
    answer: B
    explanation: (cosec A − 1)/(cosec A + 1) = (1 − sin A)/(1 + sin A). Its square root is (1 − sin A)/cos A = sec A − tan A.
    tags:
      - quant
  - slug: cgl-2017-08-12-s3-q071
    difficulty: medium
    stem: What is the simplified value of (sec⁴ A – tan² A) – (tan⁴ A + sec² A)?
    options:
