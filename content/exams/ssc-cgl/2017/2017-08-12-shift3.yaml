      B: "3500"
      C: "4000"
      D: "5600"
    answer: C
    explanation: "Equal interest means 3a = 5b = 8c = k, so a : b : c = 1/3 : 1/5 : 1/8 = 40 : 24 : 15. a = 40/79 × 7900 = ₹4000."
