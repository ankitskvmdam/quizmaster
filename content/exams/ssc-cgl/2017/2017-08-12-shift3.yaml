  - slug: cgl-2017-08-12-s3-q065
    difficulty: medium
    stem: The side BC of ΔABC is produced to D. If ∠ACD = 114° and ∠ABC= (1/2)∠BAC, then what is the value (in degrees) of ∠BAC?
    options:
      A: "36"
      B: "48"
      C: "76"
      D: "84"
    answer: C
    explanation: "The exterior angle equals the sum of the opposite interior angles: 114 = ∠A + ∠A/2, so ∠BAC = 76°."
