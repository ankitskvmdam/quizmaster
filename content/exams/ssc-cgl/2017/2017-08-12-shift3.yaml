  - slug: cgl-2017-08-12-s3-q062
    difficulty: medium
    stem: If x³ – y³ = 81 and x – y = 3, then what is the value of x² + y²?
    options:
      A: "18"
      B: "21"
      C: "27"
      D: "36"
    answer: B
    explanation: x³ − y³ = (x − y)(x² + xy + y²), so x² + xy + y² = 27. Also (x − y)² = x² + y² − 2xy = 9. Solving, xy = 6 and x² + y² = 21.
    tags:
