questions:
  - slug: cgl-2017-08-17-s2-q001
    difficulty: medium
    stem: |-
      Select the related word from the given alternatives.

      Office : Colleagues :: Home : ?
    options:
      A: Rest
      B: Work
      C: Friends
      D: Family
    answer: D
    explanation: You meet colleagues at the office and family at home.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q002
    difficulty: medium
    stem: |-
      Select the related letters from the given alternatives.

      XVT : RPN :: LJH : ?
    options:
      A: FDB
      B: ECA
      C: KIG
      D: QOM
    answer: A
    explanation: "Each letter moves back 6 places: X→R, V→P, T→N. So L→F, J→D, H→B = FDB."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q003
    difficulty: medium
    stem: |-
      Select the related number from the given alternatives.

      0.04 : 0.2 :: 0.09 : ?
    options:
      A: "0.3"
      B: "0.6"
      C: "0.9"
      D: "2"
    answer: A
    explanation: "0.04 = 0.2², so the second term is the square root of the first: √0.09 = 0.3."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q004
    difficulty: medium
    stem: Select the odd word from the given alternatives.
    options:
      A: Chair
      B: Bench
      C: Bed
      D: Sofa
    answer: C
    explanation: Chair, bench and sofa are for sitting; a bed is for sleeping.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q005
    difficulty: medium
    stem: Select the odd letters from the given alternatives.
    options:
      A: CEG
      B: UXZ
      C: ORT
      D: ILN
    answer: A
    explanation: UXZ, ORT and ILN step forward by +3, +2. CEG steps by +2, +2, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q006
    difficulty: medium
    stem: Select the odd number from the given alternatives.
    options:
      A: "75"
      B: "65"
      C: "82"
      D: "85"
    answer: C
    explanation: 75, 65 and 85 are multiples of 5; 82 is not.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q010
    difficulty: medium
    stem: Divit's birthday is on Friday 30th June. On what day of the week will be Samar's Birthday in the same year if Samar was born on 15th November?
    options:
      A: Tuesday
      B: Friday
      C: Wednesday
      D: Saturday
    answer: C
    explanation: From 30 June to 15 November is 31 + 31 + 30 + 31 + 15 = 138 days = 19 weeks + 5 days. Friday + 5 = Wednesday.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q011
    difficulty: medium
    stem: The weights of 4 boxes are 100, 70, 50 and 90 kilograms. Which of the following cannot be the total weight, in kilograms, of any combination of these boxes and in a combination a box can be used only once?
    options:
      A: "310"
      B: "260"
      C: "230"
      D: "210"
    answer: C
    explanation: The possible totals are 310 (all four), 260, 240, 220, 210 (three boxes) and 120–190 (two boxes). 230 cannot be made.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q012
    difficulty: medium
    stem: |-
      From the given words, select the word which cannot be formed using the letters of the given word.

      RECLINES
    options:
      A: SINCE
      B: RELIC
      C: LINER
      D: SCARE
    answer: D
    explanation: RECLINES has no A, so SCARE cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q013
    difficulty: medium
    stem: If REGAINS is coded as QDFZHMR, then how will PRY be coded as?
    options:
      A: BJX
      B: OQX
      C: LFT
      D: PSU
    answer: B
    explanation: Each letter moves back one place (R→Q, E→D, …), so PRY → OQX.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q014
    difficulty: medium
    stem: |-
      In a certain code language, '+' represents 'x', '-' represents '+', 'x' represents '÷' and '÷' represents '-'. What is the answer to the following question?

      45 x 5 + 2 - 20 = ?
    options:
      A: "17"
      B: "81"
      C: "38"
      D: "64"
    answer: C
    explanation: "After swapping the signs: 45 ÷ 5 × 2 + 20 = 18 + 20 = 38."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q015
    difficulty: medium
    stem: If 5@1=60; 12@8=200; 16@2=180; then what is the value of 16@10=?
    options:
      A: "32"
      B: "11"
      C: "9"
      D: "260"
    answer: D
    explanation: "The rule is (a + b) × 10: (5 + 1) × 10 = 60, (12 + 8) × 10 = 200, (16 + 2) × 10 = 180. So (16 + 10) × 10 = 260."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q017
    difficulty: medium
    stem: Two women A and B are shopping in a mall. They start from the same point. A walks 150 m West, then turns to her left and walks 160 m. B walks 140 m East, then turns South and walks 160 m, then turns to her left and walks 120 m. Where is B with respect to A now?
    options:
      A: 410 m West
      B: 410 m East
      C: 170 m East
      D: 170 m West
    answer: B
    explanation: A ends 150 m west and 160 m south. B ends 140 + 120 = 260 m east and 160 m south. On the same line, B is 150 + 260 = 410 m east of A.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q018
    difficulty: medium
    stem: |-
      In the question a statement is given, followed by two arguments, I and II. You have to consider the statement to be true even if it seems to be at variance from commonly known facts. You have to decide which of the given arguments, if any, is a strong argument.

      Statement : Should eating paan at public places be made punishable?

      Argument I : Yes, people eat pan and spit and makes public places dirty.  
      Argument II : No, Indians love paan.
    options:
      A: if only argument I is strong.
      B: if only argument II is strong.
      C: if both I and II are strong.
      D: if neither I nor II is strong.
    answer: A
    explanation: Argument I gives a real public-hygiene reason. Argument II is only a matter of liking, so it is weak.
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q020
    difficulty: medium
    stem: |-
      In the following figure, square represents Optometrists, triangle represents Painters, circle represents Vegetarians and rectangle represents Men. Which set of letters represents painters who are either men or vegetarians?

      *(Figure: Overlapping shapes: a square and a triangle overlap; a circle at the lower left overlaps both; a long rectangle at the top right overlaps the top-right corner of the square. Letters: A in the square and rectangle only; G in the rectangle only; D in the square only (right of the triangle); C in the triangle and square only; B in the triangle, square and circle; E in the triangle and circle only; F in the circle only. No region is labelled H.)*
    options:
      A: D,F
      B: E,B
      C: H,G,F
      D: A,C,E
    answer: B
    explanation: Painters are in the triangle. The triangle overlaps the circle (vegetarians) in regions B and E; it does not reach the rectangle (men).
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q025
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example 'K' can be represented by 42, 34 etc and 'Z' can be represented by 96, 79 etc. Similarly, you have to identify the set for the word 'ROAD'.

      Matrix I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | L | K | A | F | H |
      | 1 | K | I | I | C | D |
      | 2 | J | E | E | E | F |
      | 3 | M | I | A | E | K |
      | 4 | M | B | K | C | G |

      Matrix II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | Q | S | R | U | Z |
      | 6 | S | R | O | V | T |
      | 7 | O | U | V | S | Z |
      | 8 | V | Y | T | Y | S |
      | 9 | Y | Z | O | U | V |

      *(Figure: Two 5 × 5 letter matrices (transcribed as tables in the stem). The question is printed as an image.)*
    options:
      A: 24,14,67,76
      B: 30,22,86,56
      C: 66,67,02,14
      D: 13,43,56,86
    answer: C
    explanation: "R = 66, O = 67, A = 02, D = 14, all correct in option C. The other options fail at once (A: 24 = F; B: 30 = M; D: 13 = C)."
    tags:
      - reasoning
  - slug: cgl-2017-08-17-s2-q026
    difficulty: medium
    stem: The __________ exchange rate is the relative price of foreign goods in terms of domestic goods.
    options:
      A: Artificial
      B: Nominal
      C: Fixed
      D: Real
    answer: D
    explanation: The real exchange rate is the nominal rate adjusted for price levels, i.e. the relative price of foreign goods in terms of domestic goods.
    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q027
    difficulty: medium
    stem: ___________ is an alternative way of representing the production function.
    options:
      A: The Short Run
      B: The Long Run
      C: Isoquant
      D: Average product
    answer: C
    explanation: An isoquant shows all input combinations that give the same output, so it is another way to represent the production function.
    tags:
      - general-awareness
