  - slug: cgl-2017-08-17-s2-q034
    difficulty: medium
    stem: In the names Mangifera indica (mango), Solanum tuberosum (potato) and Panthera leo (lion), what does the three names, indica, tuberosum and leo, represent?
    options:
      A: Binomial Nomenclature
      B: Taxonomic Hierarchy
      C: Identification
      D: Specific Epithet
    answer: D
    explanation: In binomial names the second word (indica, tuberosum, leo) is the specific epithet; the first is the genus.
    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q035
    difficulty: medium
    stem: _______ are chlorophyll-bearing, simple, thalloid, autotrophic and largely acquatic (both fresh water and marine) organisms.
    options:
      A: Pteridophytes
      B: Bryophytes
      C: Algae
      D: Gymnosperms
