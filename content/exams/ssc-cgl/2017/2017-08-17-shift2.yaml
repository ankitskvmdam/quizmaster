  - slug: cgl-2017-08-17-s2-q062
    difficulty: medium
    stem: If a + b = 4 and ab = -5, then what is the value of a³ + b³?
    options:
      A: "34"
      B: "36"
      C: "124"
      D: "126"
    answer: C
    explanation: a³ + b³ = (a + b)³ − 3ab(a + b) = 64 + 60 = 124.
