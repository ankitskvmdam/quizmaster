    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q050
    difficulty: medium
    stem: Which country is not a member of Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation (BIMSTEC)?
    options:
      A: Thailand
      B: Myanmar
      C: India
      D: Pakistan
    answer: D
