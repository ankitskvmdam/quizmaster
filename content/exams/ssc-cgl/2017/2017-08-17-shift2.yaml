    explanation: Algae are simple, thalloid, autotrophic, mostly aquatic organisms with chlorophyll.
    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q036
    difficulty: medium
    stem: Animals like annelids and arthropods etc where the body can be divided into identical left and right halves in only one plane, exhibit ________ symmetry.
    options:
      A: Coelenterata
      B: Radial
      C: Ctenophora
      D: Bilateral
    answer: D
    explanation: A body that can be cut into identical left and right halves in only one plane is bilaterally symmetrical, as in annelids and arthropods.
    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q037
    difficulty: medium
    stem: If the orbit of a planet is an ellipse then what is the point at which the Sun is located called?
    options:
      A: Centre
      B: Circumcentre
      C: Incentre
      D: Focus
    answer: D
    explanation: By Kepler's first law, a planet moves in an ellipse with the Sun at one focus.
    tags:
