    tags:
      - general-awareness
  - slug: cgl-2017-08-17-s2-q051
    difficulty: medium
    stem: What is the value of 9991 x 10009?
    options:
      A: "99999099"
      B: "99999819"
      C: "99999919"
      D: "99999019"
    answer: C
    explanation: (10000 − 9)(10000 + 9) = 10⁸ − 81 = 99,999,919.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q052
    difficulty: medium
    stem: A can do 1/3rd of a job in 3 days and B can do half of the job in 9 days. If they work on it together, then in how many days can they finish half of the job?
    options:
      A: "4"
      B: "5"
      C: "6"
      D: "3"
    answer: D
    explanation: A does the whole job in 9 days and B in 18 days. Together they do 1/9 + 1/18 = 1/6 per day, so half the job takes 3 days.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q053
    difficulty: medium
    stem: What is the area (in sq cm) of a rhombus if the lengths of its diagonals are 25 cm and 20 cm?
    options:
      A: "500"
      B: "250"
      C: "125"
      D: "200"
    answer: B
    explanation: Area of a rhombus = ½ × d₁ × d₂ = ½ × 25 × 20 = 250 cm².
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q054
    difficulty: medium
    stem: If a shopkeeper sells an item at Rs 4200 which is marked as Rs 4800, then what is the discount (in %) that he is offering?
    options:
      A: "12.5"
      B: "14.28"
      C: "10"
      D: "15"
    answer: A
    explanation: "The discount is 600 on 4800: 600/4800 × 100 = 12.5%."
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q055
    difficulty: medium
    stem: The flight fare between two cities is increased in the ratio 11:13. What is the increase (in Rs) in the fare, if the original fare was Rs 12100?
    options:
      A: "14300"
      B: "2200"
      C: "22000"
      D: "1430"
    answer: B
    explanation: New fare = 12100 × 13/11 = 14300, an increase of ₹2200.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q056
    difficulty: medium
    stem: 3 numbers whose average is 112, the first number is 1/6th the sum of other 2. What is the first number?
    options:
      A: "45"
      B: "30"
      C: "15"
      D: "48"
    answer: D
    explanation: The sum is 3 × 112 = 336. If the first is x, then x = (336 − x)/6, so 7x = 336 and x = 48.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q057
    difficulty: medium
    stem: A trader buys 800 kgs of tomatoes for Rs 7200. 10% tomatoes are damaged in transportaion. At what rate (Rs/Kg) should he sell the rest to earn 30% profit?
    options:
      A: "9"
      B: "13"
      C: "10"
      D: "12"
    answer: B
    explanation: 720 kg is left after 10% damage. 30% profit needs 7200 × 1.3 = ₹9360, so the rate is 9360 ÷ 720 = ₹13/kg.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q058
    difficulty: medium
    stem: A student has to secure 35% marks to pass in a subject. If he gets 82 and fails by 23 marks. What is the maximum marks of the subject?
    options:
      A: "300"
      B: "250"
      C: "350"
      D: "400"
    answer: A
    explanation: The pass mark is 82 + 23 = 105, which is 35% of the maximum. 105 ÷ 0.35 = 300.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q059
    difficulty: medium
    stem: A spaceship travels at 810 km/hr. How many metres does it travel in 1/5th of a second?
    options:
      A: "60"
      B: "45"
      C: "75"
      D: "90"
    answer: B
    explanation: 810 km/h = 810 × 5/18 = 225 m/s, so in 1/5 s it covers 45 m.
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q060
    difficulty: medium
    stem: If the amount received at the end of 2nd and 3rd year as Compound Interest on a certain Principal is Rs 2100, and Rs 2268 respectively, what is the rate (in %) of interest?
    options:
      A: "7"
      B: "8"
      C: "9"
      D: "10"
    answer: B
    explanation: "The third-year CI is the second-year CI plus interest on it: 2268 − 2100 = 168 = 8% of 2100."
    tags:
      - quant
  - slug: cgl-2017-08-17-s2-q061
    difficulty: medium
    stem: If 5x - (1/2)(2x -7) = 5.5, then what is the value of x?
    options:
      A: 3/2
      B: 1/2
      C: -1/2
      D: -3/2
    answer: B
    explanation: 5x − x + 3.5 = 5.5, so 4x = 2 and x = 1/2.
