  - slug: cgl-2017-08-05-s1-q051
    difficulty: medium
    stem: If X and Y are the two digits of the number 347XY such that the number is completely divisible by 80, then what is the value of X + Y?
    options:
      A: "2"
      B: "4"
      C: "6"
      D: "8"
    answer: A
    explanation: A multiple of 80 ends in 0, so Y = 0, and 347X must be divisible by 8. 3472 = 8 × 434, so X = 2 and X + Y = 2.
    tags:
      - quant
  - slug: cgl-2017-08-05-s1-q052
    difficulty: medium
    stem: A, B and C can complete a work in 20, 24 and 30 days respectively. All three of them starts together but after 4 days A leaves the job and B left the job 6 days before the work was completed. C completed the remaining work alone. In how many days was the total work completed?
    options:
      A: "10"
      B: "12"
      C: "14"
      D: "16"
    answer: C
    explanation: "Take the work as 120 units; A, B and C do 6, 5 and 4 units a day. In total time T: 15×4 + 9(T−10) + 4×6 = 120, so T = 14 days."
    tags:
      - quant
  - slug: cgl-2017-08-05-s1-q053
    difficulty: medium
    stem: A solid sphere of diameter 17.5 cm is cut into two equal halves. What will be the increase (in cm²) in the total surface area?
    options:
      A: "289"
      B: "361.5"
      C: "481.25"
      D: "962.5"
    answer: C
    explanation: "Cutting adds two circular faces: 2πr² = 2 × (22/7) × 8.75² = 481.25 cm²."
    tags:
      - quant
