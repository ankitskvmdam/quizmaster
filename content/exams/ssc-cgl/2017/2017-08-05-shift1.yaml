      C: "10"
      D: "14"
    answer: C
    explanation: Solve 15/u + 10.5/d = 3.25 and 12/u + 14/d = 3 to get u = 6 and d = 14 km/h. The speed in still water is (6 + 14)/2 = 10 km/h.
