  - slug: cgl-2017-08-05-s1-q067
    difficulty: medium
    stem: |-
      In the given figure, ∠QRN = 40°, ∠PQR = 46° and MN is a tangent at R. What is the value (in degrees) of x, y and z respectively?

      *(Figure: Circle through P (upper left), Q (right) and R (bottom); triangle PQR drawn. Line MN touches the circle at R (M to the left, N to the lower right). x = angle at P (∠QPR); y = angle between RM and RP (∠MRP); z = ∠PRQ; 46° marked at Q (∠PQR); 40° marked between RQ and RN (∠QRN).)*
    options:
      A: 40, 46, 94
      B: 40, 50, 90
      C: 46, 54, 80
      D: 50, 40, 90
    answer: A
    explanation: "Alternate segment theorem: x = ∠QPR = ∠QRN = 40° and y = ∠MRP = ∠PQR = 46°. Then z = 180° − 40° − 46° = 94°."
    tags:
      - quant
  - slug: cgl-2017-08-05-s1-q068
    difficulty: medium
    stem: In ΔPQR, ∠R = 54°, the perpendicular bisector of PQ at S meets QR at T. If ∠TPR = 46°, then what is the value (in degrees) of ∠PQR?
    options:
      A: "25"
      B: "40"
      C: "50"
      D: "60"
    answer: B
    explanation: T is on the perpendicular bisector of PQ, so TP = TQ and ∠TPQ = ∠Q. Then ∠P = ∠Q + 46°, and (∠Q + 46) + ∠Q + 54 = 180 gives ∠Q = 40°.
    tags:
      - quant
  - slug: cgl-2017-08-05-s1-q069
