  - slug: cgl-2017-08-05-s1-q007
    difficulty: medium
    stem: |-
      Arrange the given words in the sequence in which they occur in the dictionary.

      1. Ropped  
      2. Roster  
      3. Roasted  
      4. Road  
      5. Roller
    options:
      A: "35412"
      B: "45312"
      C: "34512"
