    stem: What is the simplified value of (cot A + tan B)/(cot B + tan A)?
    options:
      A: tan B cot A
      B: tan A cot B
      C: tan A tan B
      D: cot A cot B
    answer: A
    explanation: "Both the numerator and the denominator contain cos(A−B): (cos(A−B)/(sinA cosB)) ÷ (cos(A−B)/(sinB cosA)) = tan B cot A."
    tags:
