  - slug: cgl-2017-08-05-s1-q059
    difficulty: medium
    stem: A boat goes 15 km upstream and 10 1/2 km downstream in 3 hours 15 minutes. It goes 12 km upstream and 14 km downstream in 3 hours. What is the speed of the boat in still water?
