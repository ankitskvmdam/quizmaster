      B: (1 – cos A)/(1 + cos A)
      C: (1 – cosec A)/(1 + cosec A)
      D: sin A
    answer: B
    explanation: 1/(cosec A + cot A) = sin A/(1 + cos A). Squared, this is (1 − cos²A)/(1 + cos A)² = (1 − cos A)/(1 + cos A).
    tags:
      - quant
