      B: 3√3
      C: (3√3 + 1)/2
      D: 2√3 + 1
    answer: C
    explanation: 2x = 4 + 2√3 = (√3+1)², so √(2x) = √3 + 1 and 1/√(2x) = (√3−1)/2. The sum is (3√3 + 1)/2.
