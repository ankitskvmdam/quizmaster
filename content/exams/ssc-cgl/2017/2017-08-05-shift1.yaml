    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q010
    difficulty: medium
    stem: If 'P 3 Q' means 'P is daughter of Q', 'P 5 Q' means 'P is father of Q', 'P 7 Q' means 'P is mother of Q' and 'P 9 Q' means 'P is sister of Q', then how is J related to K in J 3 L 9 N 3 O 5 K?
    options:
      A: Mother
      B: Wife
      C: Niece
      D: Daughter
    answer: C
    explanation: J is L's daughter; L and N are daughters of O, and O is K's father, so L is K's sister. J is therefore K's niece.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q011
    difficulty: medium
    stem: Rakhi got engaged 10 years ago. Rakhi's present age is 5/3 of her age at the time of engagement. If the present age of Rakhi's mother is twice that of present age of Rakhi, then what was her mother's age (in years) at the time of her engagement?
    options:
      A: "50"
      B: "40"
      C: "30"
      D: "60"
    answer: B
    explanation: If her present age is p, then p = (5/3)(p − 10), so p = 25. Her mother is 50 now, so she was 50 − 10 = 40 at the engagement.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q012
    difficulty: medium
    stem: |-
      In the following question, from the given alternative words, select the word which cannot be formed using the letters of the given word.

      Suspensefulness
    options:
      A: Sense
      B: Fuels
      C: Useful
      D: Fullness
    answer: D
    explanation: SUSPENSEFULNESS has only one L, so FULLNESS (two Ls) cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q013
    difficulty: medium
    stem: In a certain code language, "BAD" is written as "7" and "SAP" is written as "9". How is "BAN" written in that code language?
    options:
      A: "8"
      B: "3"
      C: "4"
      D: "6"
    answer: A
    explanation: "Add the letter positions and then the digits: BAD = 2+1+4 = 7, SAP = 19+1+16 = 36 → 9. BAN = 2+1+14 = 17 → 1+7 = 8."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q014
    difficulty: medium
    stem: |-
      In the following question, correct the equation by interchanging two signs.

      9 x 3 + 8 ÷ 4 – 7 = 28
    options:
      A: x and –
      B: + and –
      C: ÷ and +
      D: x and ÷
    answer: D
    explanation: Swapping × and ÷ gives 9 ÷ 3 + 8 × 4 − 7 = 3 + 32 − 7 = 28.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q015
    difficulty: medium
    stem: |-
      If 4 * 5 % 3 = 8000 and 2 * 3 % 2 = 36, then

      4 * 3 % 3 = ?
    options:
      A: "432"
      B: "1728"
      C: "36"
      D: "144"
    answer: B
    explanation: "a * b % c means (a × b)^c: (4×5)³ = 8000 and (2×3)² = 36. So (4×3)³ = 1728."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q016
    difficulty: medium
    stem: |-
      In the following question, select the number which can be placed at the sign of question mark (?) from the given alternatives.

      | Figure | Top | Left | Centre | Right | Bottom |
      |---|---|---|---|---|---|
      | 1 | 3 | 2 | 31 | 1 | 5 |
      | 2 | 4 | 2 | 145 | 6 | 3 |
      | 3 | 2 | 1 | ? | 7 | 5 |

      *(Figure: Three plus-shaped (cross) number figures printed as an image; each has a centre cell with cells above, left, right and below. Reproduced as a table.)*
    options:
      A: "43"
      B: "49"
      C: "59"
      D: "71"
    answer: D
    explanation: "Centre = (top × left) × (right × bottom) + 1: (3×2)(1×5)+1 = 31 and (4×2)(6×3)+1 = 145, so (2×1)(7×5)+1 = 71."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q017
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A square with an isosceles triangle on its top side and another on its bottom side (an elongated hexagon). Lines drawn: both diagonals of the square, and a vertical line from the top apex to the bottom apex through the centre of the square.)*
    options:
      A: "20"
      B: "22"
      C: "28"
      D: "32"
    answer: B
    explanation: Count 3 triangles in each end triangle (6), 12 inside the square (6 small, 2 made of two small ones, and 4 half-squares) and 4 that join an apex to the centre (such as apex–corner–centre). The total is 22.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q018
    difficulty: medium
    stem: |-
      In each of the following question below are given some statements followed by some conclusions. Taking the given statements to be true even if they seem to be at variance from commonly known facts, read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:  
      I. Some pens are pencils.  
      II. All pencils are erasers.

      Conclusions:  
      I. Some pens are erasers.  
      II. No pens are erasers.  
      III. Some erasers are pencils.
    options:
      A: Only conclusion (II) follows.
      B: Only conclusion (I) and (II) follow.
      C: Only conclusion (I) and (III) follow.
      D: No conclusion follows.
    answer: C
    explanation: Some pens are pencils and all pencils are erasers, so some pens are erasers (I). 'All pencils are erasers' also gives 'some erasers are pencils' (III). II contradicts I.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q019
    difficulty: medium
    stem: |-
      Three positions of a cube are shown below. What will come opposite to face containing ‘I’?

      *(Figure: Three views of a cube (top / front / right face): cube 1 = II / I / IV; cube 2 = III / I / V; cube 3 = V / II / VI.)*
    options:
      A: VI
      B: IV
      C: II
      D: V
    answer: A
    explanation: Face I is seen next to II, IV, III and V, so the face opposite I is VI.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q020
    difficulty: medium
    stem: |-
      In the given figure, how many pens are blue?

      *(Figure: Venn-type figure: a horizontal rectangle = Pens; an upward triangle = Black, whose top sticks out above the rectangle; a second upward triangle = Blue, whose bottom sticks out below the rectangle. Numbers: 13 = Black only (above the rectangle); 19 (left) and 15 (right) = Black and Pens, not Blue; 4 = Black, Blue and Pens; 19 = Blue and Pens, not Black; 16 = Blue only (below the rectangle); 11 (left) and 12 (right) = Pens only.)*
    options:
      A: "23"
      B: "19"
      C: "12"
      D: "15"
    answer: A
    explanation: "Blue pens are the regions inside both the Blue triangle and the Pens rectangle: 4 + 19 = 23."
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q025
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, ‘K’ can be represented by 01, 34, etc., and ‘P’ can be represented by 65, 99, etc. Similarly, you have to identify the set for the word “BLAND”.

      Matrix-I

      | | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | A | K | B | L | C |
      | 1 | B | A | C | K | L |
      | 2 | L | C | K | B | A |
      | 3 | C | B | L | A | K |
      | 4 | K | L | A | C | B |

      Matrix-II

      | | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | N | O | P | S | D |
      | 6 | P | D | S | N | O |
      | 7 | O | P | N | D | S |
      | 8 | D | S | O | P | N |
      | 9 | S | N | D | O | P |

      *(Figure: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 10, 14, 00, 68, 79
      B: 31, 41, 33, 96, 86
      C: 44, 20, 42, 88, 59
      D: 23, 32, 24, 55, 66
    answer: D
    explanation: In D, 23 = B, 32 = L and 24 = A (Matrix-I), and 55 = N and 66 = D (Matrix-II), which spells BLAND.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q026
    difficulty: medium
    stem: At which rate, Reserve Bank of India borrows money from commercial banks?
    options:
      A: Bank Rate
      B: Repo Rate
      C: Reverse Repo Rate
      D: Statutory Liquidity Rate
    answer: C
    explanation: The reverse repo rate is the rate at which the RBI borrows money from commercial banks; the repo rate is the rate at which it lends to them.
    tags:
      - general-awareness
  - slug: cgl-2017-08-05-s1-q027
    difficulty: medium
    stem: Movement along the supply curve is known as ______ .
    options:
      A: Contraction of supply
      B: Expansion of supply
      C: Increase in supply
      D: Expansion and contraction of supply
    answer: D
    explanation: A movement along a supply curve, caused only by a change in the good's own price, is called expansion or contraction of supply. Shifts of the curve are increase or decrease.
    tags:
      - general-awareness
