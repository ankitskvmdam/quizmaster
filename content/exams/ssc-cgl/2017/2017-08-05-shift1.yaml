questions:
  - slug: cgl-2017-08-05-s1-q001
    difficulty: medium
    stem: |-
      In the following question, select the related word pair from the given alternatives.

      Power : Watt : : ? : ?
    options:
      A: "Pressure : Newton"
      B: "Force : Pascal"
      C: "Resistance : Mho"
      D: "Work : Joule"
    answer: D
    explanation: The watt is the SI unit of power; in the same way the joule is the SI unit of work.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q002
    difficulty: medium
    stem: |-
      In the following question, select the related letters from the given alternatives.

      NPBG : OQCH : : AJOT : ?
    options:
      A: BKPU
      B: BUPK
      C: BHKP
      D: HBKU
    answer: A
    explanation: Each letter moves one place forward (N→O, P→Q, B→C, G→H), so AJOT becomes BKPU.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q003
    difficulty: medium
    stem: |-
      In the following question, select the related number from the given alternatives.

      101 : 10201 : : 107 : ?
    options:
      A: "10707"
      B: "10749"
      C: "11449"
      D: "11407"
    answer: C
    explanation: 101² = 10201, so the answer is 107² = 11449.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q004
    difficulty: medium
    stem: In the following question, select the odd word from the given alternatives.
    options:
      A: Lion
      B: Leopard
      C: Snake
      D: Tiger
    answer: C
    explanation: Lion, leopard and tiger are big cats (mammals); the snake is a reptile.
    tags:
      - reasoning
  - slug: cgl-2017-08-05-s1-q005
    difficulty: medium
    stem: In the following question, select the odd letters from the given alternatives.
