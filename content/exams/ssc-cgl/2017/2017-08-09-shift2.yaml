  - slug: cgl-2017-08-09-s2-q051
    difficulty: medium
    stem: How many numbers are there from 700 to 950 (including both) which are neither divisible by 3 nor by 7?
    options:
      A: "107"
      B: "141"
      C: "144"
      D: "145"
    answer: C
    explanation: There are 251 numbers. Of these, 83 are divisible by 3, 36 by 7 and 12 by 21, so 83 + 36 − 12 = 107 are divisible by 3 or 7. That leaves 251 − 107 = 144.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q052
    difficulty: medium
    stem: A can complete a work in 20 days and B can complete the same work in 25 days. If both of them work together, then in 3 days what percent of the total work will be completed?
    options:
      A: "9"
      B: "12"
      C: "25"
      D: "27"
    answer: D
    explanation: Together they do 1/20 + 1/25 = 9/100 of the work a day, so in 3 days they do 27%.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q053
    difficulty: medium
    stem: The length of two parallel sides of a trapezium are 18 m and 24 m. If its height is 12 m, then what is the area (in m²) of the trapezium ?
    options:
      A: "126"
      B: "252"
      C: "504"
      D: "1024"
    answer: B
    explanation: Area = ½ × (18 + 24) × 12 = 252 m².
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q054
    difficulty: medium
    stem: If two successive discounts of 50% and 10% are offered, then what is the net discount (in %)?
    options:
      A: "50"
      B: "55"
      C: "60"
      D: "65"
    answer: B
    explanation: Net price = 0.5 × 0.9 = 0.45 of the original, so the discount is 55%.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q055
    difficulty: medium
    stem: "Three bottles of equal capacity containing mixture of milk and water in ratio 2 : 5, 3 : 4 and 4 : 5 respectively. These three bottles are emptied into a large bottle. What will be the ratio of milk and water respectively in the large bottle?"
    options:
      A: "73 : 106"
      B: "73 : 116"
      C: "73 : 113"
      D: "73 : 189"
    answer: B
    explanation: "Take each bottle as 63 units. Milk = 18 + 27 + 28 = 73 and water = 45 + 36 + 35 = 116, so the ratio is 73 : 116."
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q056
    difficulty: medium
    stem: The average age of 6 members of a family is 20 years. If the age of the servant is included, then the average age increase by 25%. What is the age (in years) of the servant?
    options:
      A: "30"
      B: "35"
      C: "50"
      D: "55"
    answer: D
    explanation: The new average is 25, so the servant's age = 7×25 − 6×20 = 175 − 120 = 55.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q057
    difficulty: medium
    stem: For an article the profit is 190% of the cost price. If the cost price increase by 10% but the selling price remains same, then profit is what percentage of selling price (approximately)?
    options:
      A: "54"
      B: "62"
      C: "70"
      D: "163"
    answer: B
    explanation: With CP = 100, SP = 290. The new CP is 110, so the profit is 180 and 180/290 ≈ 62% of SP.
    tags:
