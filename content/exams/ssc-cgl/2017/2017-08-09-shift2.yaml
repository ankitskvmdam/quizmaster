  - slug: cgl-2017-08-09-s2-q059
    difficulty: medium
    stem: Two people A and B are at a distance of 260 km from each other at 9:00 a.m. A immediately starts moving towards B at a speed of 25 km/h and at 11:00 a.m. B starts moving towards A at a speed of 10 km/hr. At what time (in p.m.) will they meet each other?
    options:
      A: 5:00
      B: 6:00
      C: 6:30
      D: 7:00
    answer: A
    explanation: By 11:00 A has covered 50 km, leaving 210 km. At a closing speed of 35 km/h they need 6 more hours, so they meet at 5:00 p.m.
