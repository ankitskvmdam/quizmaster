source: "SSC candidate response sheet with the official answer marked (via https://docs.aglasem.com/view/a601265c-9e8d-11e9-8ff2-e470b83c4461). Left out (picture-only options or incomplete in the source): Q9, Q19, Q20, Q21, Q22, Q23, Q24."
questions:
  - slug: cgl-2017-08-09-s2-q001
    difficulty: medium
    stem: |-
      In the following question, select the related word from the given alternatives.

      Calendar : Date : : Index : ?
    options:
      A: Name of Author
      B: Glossary
      C: Contents
      D: Summary
    answer: C
    explanation: A calendar is a list of dates; an index is likewise a list of the book's contents (topics) with page numbers.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q002
    difficulty: medium
    stem: |-
      In the following question, select the related number from the given alternatives.

      ACOUSTIC : 91 : : RENOUNCE : ?
    options:
      A: "95"
      B: "99"
      C: "105"
      D: "109"
    answer: A
    explanation: "Sum of letter positions: ACOUSTIC = 1+3+15+21+19+20+9+3 = 91, and RENOUNCE = 18+5+14+15+21+14+3+5 = 95."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q003
    difficulty: medium
    stem: |-
      In the following question, select the related number from the given alternatives.

      243 : 819 : : 163 : ?
    options:
      A: "487"
      B: "563"
      C: "572"
      D: "593"
    answer: A
    explanation: "Add the square of the product of the digits: 243 + (2×4×3)² = 243 + 576 = 819, so 163 + (1×6×3)² = 163 + 324 = 487."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q004
    difficulty: medium
    stem: In the following question, select the odd word from the given alternatives.
    options:
      A: Badminton
      B: Table Tennis
      C: Cricket
      D: Hockey
    answer: A
    explanation: Badminton is played with a shuttlecock; table tennis, cricket and hockey use a ball.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q005
    difficulty: medium
    stem: In the following question, select the odd letters from the given alternatives.
    options:
      A: ACFJ
      B: RTWA
      C: NPSV
      D: HJMQ
    answer: C
    explanation: ACFJ, RTWA (W+4 wraps round to A) and HJMQ go up by +2, +3, +4; NPSV goes up by +2, +3, +3.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q006
    difficulty: medium
    stem: In the following question, select the odd number group from the given alternatives.
    options:
      A: (4, 16, 48)
      B: (6, 36, 90)
      C: (8, 64, 160)
      D: (12, 144, 360)
    answer: A
    explanation: In the others the third number is 2.5 × the square (36×2.5 = 90, 64×2.5 = 160, 144×2.5 = 360); in (4, 16, 48) it is 3 × 16.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q007
    difficulty: medium
    stem: |-
      Arrange the given words in the sequence in which they occur in the dictionary.

      1. Decollete  
      2. Desecrate  
      3. Decorous  
      4. Desipicable  
      5. Destitute
    options:
      A: "13245"
      B: "15243"
      C: "32451"
      D: "45231"
    answer: A
    explanation: "Dictionary order: Decollete (1), Decorous (3), Desecrate (2), Desipicable (4), Destitute (5), i.e. 13245."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q008
    difficulty: medium
    stem: |-
      In the following question, which one set of letters when sequentially placed at the gaps in the given letter series shall complete it?

      a _ bc _ a _ bcdabc _ da _ cd _
    options:
      A: acbddb
      B: adbcbd
      C: cabddc
      D: ddcbbc
    answer: B
    explanation: "Filling a, d, b, c, b, d gives aabcd / abbcd / abccd / abcdd: each block doubles the next letter in turn."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q010
    difficulty: medium
    stem: "5 year hence, ratio of ages of A and B will be 7 : 5 and difference between their ages will be 4 years. What are present ages (in years) of A and B respectively?"
    options:
      A: 5, 9
      B: 6, 5
      C: 9, 5
      D: 9, 6
    answer: C
    explanation: "After 5 years the ages are 7k and 5k with a difference of 2k = 4, so k = 2: 14 and 10. The present ages are 9 and 5."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q011
    difficulty: medium
    stem: From a point, Lokesh starts walking towards south and after walking 30 metres he turns to his right and walks 20 metres, then he turns right again and walks 30 metres. He finally turns to his left and walk 40 metres. In which direction is he with reference to the starting point?
    options:
      A: North-West
      B: East
      C: West
      D: South
    answer: C
    explanation: South 30, right (west) 20, right (north) 30 brings him back level with the start, 20 m west; left (west) 40 more puts him 60 m due west.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q012
    difficulty: medium
    stem: |-
      In the following question, from the given alternative words, select the word which cannot be formed using the letters of the given word.

      ENCYCLOPEDIA
    options:
      A: CONE
      B: CYCLE
      C: NOISY
      D: PEACE
    answer: C
    explanation: ENCYCLOPEDIA has no S, so NOISY cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q013
    difficulty: medium
    stem: In a certain code language, "RAIN" is written as "OHBQ". How is "SUMMER" written in that code language?
    options:
      A: QFLNTT
      B: QDLLTR
      C: SFNNVT
      D: SDNLVR
    answer: D
    explanation: "Reverse the word, then shift the letters +1, −1 alternately: RAIN → NIAR → OHBQ. SUMMER → REMMUS → SDNLVR."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q014
    difficulty: medium
    stem: |-
      In the following question, correct the given equation by interchanging two numbers.

      8 x 3 ÷ 4 + 9 – 5 = 16
    options:
      A: 3 and 4
      B: 4 and 8
      C: 5 and 3
      D: 5 and 9
    answer: C
    explanation: Swapping 5 and 3 gives 8 × 5 ÷ 4 + 9 − 3 = 10 + 9 − 3 = 16.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q015
    difficulty: medium
    stem: If (2)# * 4 = 2 and (4)# * 4 = 16, then what is the value of A in (6)# * A = 18?
    options:
      A: "12"
      B: "14"
      C: "16"
      D: "20"
    answer: A
    explanation: "(x)# * y means x³ ÷ y: 8/4 = 2 and 64/4 = 16. So 216/A = 18 gives A = 12."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q016
    difficulty: medium
    stem: |-
      In the following question, select the number which can be placed at the sign of question mark (?) from the given alternatives.

      | Figure | Top | Left | Centre | Right | Bottom |
      |---|---|---|---|---|---|
      | 1 | 2 | 1 | 41 | 5 | 3 |
      | 2 | 3 | 4 | 159 | 6 | 2 |
      | 3 | 7 | 5 | ? | 3 | 2 |

      *(Figure: Three plus-shaped (cross) number figures printed as an image; each has a centre cell with cells above, left, right and below. Reproduced as a table.)*
    options:
      A: "189"
      B: "227"
      C: "277"
      D: "339"
    answer: B
    explanation: "Centre = product + sum of the four numbers: 2·1·5·3 + 11 = 41 and 3·4·6·2 + 15 = 159, so 7·5·3·2 + 17 = 227."
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q017
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: An isosceles trapezium (longer side at the bottom). Two vertical lines drop from the two top corners to the base, making a rectangle in the middle with a right triangle on each side; both diagonals of the middle rectangle are drawn.)*
    options:
      A: "8"
      B: "10"
      C: "12"
      D: "14"
    answer: C
    explanation: There are 2 side right triangles and 8 in the middle rectangle with its diagonals (4 small, 4 half-rectangles). Each side triangle also joins a diagonal half to make 2 larger ones, so the total is 12.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q018
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions. Taking the given statements to be true even if they seem to be at variance from commonly known facts, read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:  
      I. All rackets are bats.  
      II. All bats are wickets.

      Conclusions:  
      I. Some wickets are rackets.  
      II. All wickets are rackets.
    options:
      A: Only conclusion (I) follows.
      B: Only conclusion (II) follows.
      C: Neither conclusion (I) nor conclusion (II) follows.
      D: Both conclusions follow.
    answer: A
    explanation: All rackets are bats and all bats are wickets, so all rackets are wickets, and hence some wickets are rackets (I). II does not follow.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q025
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example, ‘X’ can be represented by 21, 44, etc., and ‘R’ can be represented by 67, 98, etc. Similarly, you have to identify the set for the word “CREEP”.

      Matrix-I

      | | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | E | C | P | X | T |
      | 1 | C | P | X | T | E |
      | 2 | P | X | T | E | C |
      | 3 | X | T | E | C | P |
      | 4 | T | E | C | P | X |

      Matrix-II

      | | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | R | L | N | O | M |
      | 6 | O | M | R | L | N |
      | 7 | L | N | O | M | R |
      | 8 | M | R | L | N | O |
      | 9 | N | O | M | R | L |

      *(Figure: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 10, 79, 23, 32, 42
      B: 24, 55, 14, 41, 12
      C: 33, 86, 32, 13, 43
      D: 42, 98, 41, 00, 34
    answer: D
    explanation: In D, 42 = C (Matrix-I), 98 = R (Matrix-II), and 41 = E, 00 = E and 34 = P (Matrix-I), which spells CREEP.
    tags:
      - reasoning
  - slug: cgl-2017-08-09-s2-q026
    difficulty: medium
    stem: In which market form, a market or an industry is dominated by a single seller?
    options:
      A: Oligopoly
      B: Monopoly
      C: Duopoly
      D: Monopolistic Competition
    answer: B
    explanation: A monopoly is a market dominated by a single seller with no close substitutes.
    tags:
      - general-awareness
  - slug: cgl-2017-08-09-s2-q027
    difficulty: medium
    stem: Which one of the following is also regarded as Disguised unemployment?
    options:
      A: Underemployment
      B: Frictional unemployment
      C: Seasonal unemployment
      D: Cyclical unemployment
    answer: A
    explanation: Disguised unemployment, where more people are engaged than the work needs, is a form of underemployment.
    tags:
      - general-awareness
  - slug: cgl-2017-08-09-s2-q028
    difficulty: medium
    stem: |-
      Which of the following are constituents of Indian Parliament?

      (i) The President  
      (ii) The Council of States (Rajya Sabha)  
      (iii) The House of the People (Lok Sabha)
    options:
      A: (ii) and (iii)
      B: (i) and (ii)
      C: (i) and (iii)
      D: (i), (ii) and (iii)
