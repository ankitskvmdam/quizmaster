  - slug: cgl-2017-08-09-s2-q060
    difficulty: medium
    stem: If Rs 2500 becomes to Rs 2970.25 in 2 years at compound interest compounded annually, then what is the yearly rate of interest (in %)?
    options:
      A: "7"
      B: "9"
      C: "11"
      D: "13"
    answer: B
    explanation: 2970.25/2500 = 1.1881 = (1.09)², so the rate is 9%.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q061
    difficulty: medium
    stem: If (1/x) + (1/y) + (1/z) = 0 and x + y + z = 9, then what is the value of x³ + y³ + z³ – 3xyz?
    options:
      A: "81"
      B: "361"
      C: "729"
      D: "6561"
    answer: C
    explanation: 1/x + 1/y + 1/z = 0 gives xy + yz + zx = 0. Then x³ + y³ + z³ − 3xyz = (x+y+z)[(x+y+z)² − 3(xy+yz+zx)] = 9 × 81 = 729.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q062
    difficulty: medium
    stem: If x⁴ + (1/x⁴) = 34, then what is the value of x³ – (1/x³)?
    options:
      A: "0"
      B: "6"
      C: "8"
      D: "14"
    answer: D
    explanation: x² + 1/x² = 6, so (x − 1/x)² = 4 and x − 1/x = 2. Then x³ − 1/x³ = 2³ + 3·2 = 14.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q063
    difficulty: medium
    stem: If x = 1 – y and x² = 2 – y², then what is the value of xy?
    options:
      A: "1"
      B: "2"
      C: –1/2
      D: –1
    answer: C
    explanation: x + y = 1 and x² + y² = 2, so 1 − 2xy = 2 and xy = −1/2.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q064
    difficulty: medium
    stem: If x + [1/(x + 7)] = 0, then what is the value of x – [1/(x + 7)]?
    options:
      A: 3√5
      B: 3√5 – 7
      C: 3√5 + 7
      D: "8"
    answer: B
    explanation: 1/(x+7) = −x, so the expression is 2x. From x² + 7x + 1 = 0, 2x = −7 + 3√5 (the root in the options).
    tags:
      - quant
