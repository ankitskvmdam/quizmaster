  - slug: cgl-2017-08-09-s2-q058
    difficulty: medium
    stem: A, B and C are three students. A got 18% more marks than B and 12% less than C. If B got 220 marks, then how much marks C has got?
    options:
      A: "230"
      B: "295"
      C: "240"
      D: "290"
    answer: B
    explanation: A = 1.18 × 220 = 259.6, and A = 0.88 C, so C = 259.6/0.88 = 295.
    tags:
