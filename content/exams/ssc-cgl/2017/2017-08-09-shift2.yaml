  - slug: cgl-2017-08-09-s2-q067
    difficulty: medium
    stem: Smaller diagonal of a rhombus is equal to length of its sides. If length of each side is 6 cm, then what is the area (in cm²) of an equilateral triangle whose side is equal to the bigger diagonal of the rhombus?
    options:
      A: 18√3
      B: 27√3
      C: 32√3
      D: 36√3
    answer: B
    explanation: The longer diagonal = 2√(6² − 3²) = 6√3. The triangle's area = (√3/4)(6√3)² = 27√3 cm².
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q068
    difficulty: medium
    stem: |-
      In the given figure, PR and ST are perpendicular to tangent QR. PQ passes through centre O of the circle whose diameter is 10 cm. If PR = 9 cm, then what is the length (in cm) of ST?

      *(Figure: A circle with centre O touches the horizontal line QR at M. P is a point on the circle at upper left; the line PQ passes through O and cuts the circle again at S, meeting the line at Q on the right. PR, OM and ST are vertical segments down to the line (R, M, T from left to right, then Q).)*
    options:
      A: "1"
      B: "1.25"
      C: "1.5"
      D: "2"
    answer: A
    explanation: "From Q the triangles are similar: PR/QP = OM/QO. With QO = d, 9/(d+5) = 5/d gives d = 6.25. Then ST = 5(d−5)/d = 1 cm."
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q069
    difficulty: medium
    stem: What is the simplified value of (sec A + cos A)(sec A – cos A)?
    options:
      A: 2 tan² A
      B: 2 sin² A
      C: sin² A tan² A
      D: sin² A + tan² A
    answer: D
    explanation: sec²A − cos²A = (1 + tan²A) − (1 − sin²A) = sin²A + tan²A.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q070
    difficulty: medium
    stem: What is the simplified value of [cosec A/(cot A + tan A)]²?
    options:
      A: 2cos²A
      B: 1 – sin²A
      C: sec²A
      D: secA tanA
    answer: B
    explanation: cot A + tan A = 1/(sin A cos A), so cosec A ÷ that = cos A. Its square is cos²A = 1 − sin²A.
    tags:
      - quant
  - slug: cgl-2017-08-09-s2-q071
    difficulty: medium
    stem: What is the simplified value of tan A/(1 − cot A) + cot A/(1 − tan A) − 2/sin 2A?
    options:
      A: –1
      B: "0"
      C: "1"
      D: "2"
    answer: C
    explanation: tan A/(1 − cot A) + cot A/(1 − tan A) = 1 + sec A cosec A, and 2/sin 2A = sec A cosec A, so the value is 1.
    tags:
      - quant
