  - slug: cgl-2017-08-09-s2-q066
    difficulty: medium
    stem: PQRS is a cyclic quadrilateral and PQ is the diameter of the circle. If ∠RPQ = 38°, then what is the value (in degrees) of ∠PSR?
    options:
      A: "52"
      B: "77"
      C: "128"
      D: "142"
    answer: C
    explanation: ∠PRQ = 90° (angle in a semicircle), so ∠PQR = 52°. Opposite angles of a cyclic quadrilateral add to 180°, so ∠PSR = 128°.
    tags:
