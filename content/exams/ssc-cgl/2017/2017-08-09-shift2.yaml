  - slug: cgl-2017-08-09-s2-q037
    difficulty: medium
    stem: It is difficult to fix a nail on a freely suspended wooden frame. Which law supports this statement?
    options:
      A: Law of inertia
      B: Newton’s second law
      C: Newton’s third law
      D: Pascal’s law
    answer: C
    explanation: When the hammer strikes, the free frame moves away instead of pushing back, so it gives no equal and opposite reaction to drive the nail in (Newton's third law).
    tags:
      - general-awareness
  - slug: cgl-2017-08-09-s2-q038
    difficulty: medium
    stem: Which one of the following is not a property of electromagnetic waves?
    options:
      A: Electromagnetic waves do not show interference and diffraction.
      B: Oscillating electric field and magnetic field are perpendicular to each other.
      C: Electromagnetic waves are transverse waves
      D: Electromagnetic waves do not require a medium to propagate.
    answer: A
    explanation: EM waves do show interference and diffraction, so statement A is false. The other statements (perpendicular E and B fields, transverse waves, no medium needed) are true.
    tags:
      - general-awareness
  - slug: cgl-2017-08-09-s2-q039
    difficulty: medium
    stem: What is a bug in computer terminology?
