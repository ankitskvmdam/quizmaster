source: "SSC candidate response sheet with the official answer marked (via https://docs.aglasem.com/view/17030a92-9e92-11e9-9913-e470b83c4461). Left out (picture-only options or incomplete in the source): Q7, Q8, Q9, Q16, Q19, Q21, Q22, Q23, Q24, Q64."
questions:
  - slug: cgl-2017-08-21-s1-q001
    difficulty: medium
    stem: |-
      Select the related word from the given alternatives.

      Cow : Calf :: Hen : ?
    options:
      A: Chick
      B: Cock
      C: Egg
      D: Fly
    answer: A
    explanation: A calf is the young one of a cow; the young one of a hen is a chick.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q002
    difficulty: medium
    stem: |-
      Select the related letters from the given alternatives.

      DHL : AEI :: QUY : ?
    options:
      A: MQU
      B: NRV
      C: OSW
      D: PTX
    answer: B
    explanation: "Each letter moves 3 places back: D→A, H→E, L→I. So Q→N, U→R, Y→V gives NRV."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q003
    difficulty: medium
    stem: |-
      Select the related number from the given alternatives.

      0.5 : 2 :: 0.125 : ?
    options:
      A: "6"
      B: "16"
      C: "8"
      D: "12"
    answer: C
    explanation: 2 is the reciprocal of 0.5; the reciprocal of 0.125 is 8.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q004
    difficulty: medium
    stem: Select the odd word from the given alternatives.
    options:
      A: Book
      B: Page
      C: Pen
      D: Diary
    answer: C
    explanation: A book, a page and a diary are made of paper and written on; a pen is the writing tool.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q005
    difficulty: medium
    stem: Select the odd letters from the given alternatives.
    options:
      A: EGI
      B: MOQ
      C: UWY
      D: NLJ
    answer: D
    explanation: EGI, MOQ and UWY go forward in steps of 2; NLJ goes backward in steps of 2.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q006
    difficulty: medium
    stem: Select the odd number from the given alternatives.
    options:
      A: "47"
      B: "41"
      C: "59"
      D: "63"
    answer: D
    explanation: 47, 41 and 59 are prime numbers; 63 = 7 × 9 is not.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q010
    difficulty: medium
    stem: Meetu's birthday is on Wednesday 8th March. On what day of the week will be Ritu's Birthday in the same year if Ritu was born on 10th July?
    options:
      A: Monday
      B: Wednesday
      C: Friday
      D: Saturday
    answer: A
    explanation: From 8 March to 10 July is 23 + 30 + 31 + 30 + 10 = 124 days, which is 5 odd days. Wednesday + 5 = Monday.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q011
    difficulty: medium
    stem: The weights of 4 boxes are 30, 40, 50 and 80 kilograms. Which of the following cannot be the total weight, in kilograms, of any combination of these boxes and in a combination a box can be used only once?
    options:
      A: "120"
      B: "110"
      C: "100"
      D: "130"
    answer: C
    explanation: 120 = 40 + 80, 110 = 30 + 80 and 130 = 50 + 80, but no set of these boxes adds up to 100.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q012
    difficulty: medium
    stem: |-
      From the given alternative words, select the word which cannot be formed using the letters of the given word:

      DUPLICATE
    options:
      A: PLATE
      B: DUCTILE
      C: LUCID
      D: TEAM
    answer: D
    explanation: DUPLICATE has no letter M, so TEAM cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q013
    difficulty: medium
    stem: If PRIMATE is coded as MOFJXQB, then how will COW be coded as?
    options:
      A: ZLT
      B: EDC
      C: RFV
      D: TGB
    answer: A
    explanation: Each letter moves 3 places back (P→M, R→O, I→F, ...). So C→Z, O→L, W→T gives ZLT.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q014
    difficulty: medium
    stem: |-
      In a certain code language, '+' represents '×', '−' represents '+', '×' represents '÷' and '÷' represents '−'. What is the answer to the following question?

      11 + 50 − 150 ÷ 200 = ?
    options:
      A: "200"
      B: "500"
      C: "250"
      D: "50"
    answer: B
    explanation: "After swapping the signs: 11 × 50 + 150 − 200 = 550 + 150 − 200 = 500."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q015
    difficulty: medium
    stem: If 7×1=12; 5×4=2; 6×4=4; then what is the value of 7×4 = ?
    options:
      A: "8"
      B: "6"
      C: "11"
      D: "28"
    answer: B
    explanation: "The rule is (a − b) × 2: 7×1 → 6 × 2 = 12, 5×4 → 1 × 2 = 2, 6×4 → 2 × 2 = 4. So 7×4 → 3 × 2 = 6."
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q017
    difficulty: medium
    stem: A man cycles 7 km East, then turns South and cycles 12 km, then turns West and cycles 7 km, then turns to his left and cycles 10 km. Where is he now with reference to his starting position?
    options:
      A: 22 Kms South
      B: 2 Kms South
      C: 22 Kms East
      D: 2 Kms East
    answer: A
    explanation: The 7 km east and 7 km west cancel. Turning left while heading west means heading south, so he is 12 + 10 = 22 km south.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q018
    difficulty: medium
    stem: |-
      In the question two statements are given, followed by two conclusions, I and II. You have to consider the statements to be true even if it seems to be at variance from commonly known facts. You have to decide which of the given conclusions, if any, follows from the given statements.

      Statement 1 : All steel is iron.  
      Statement 2 : No iron is solid.

      Conclusion I : No steel is solid.  
      Conclusion II : Some iron is steel.
    options:
      A: Only conclusion I follows
      B: Only conclusion II follows
      C: Both I and II follow
      D: Neither I nor II follows
    answer: C
    explanation: All steel is iron and no iron is solid, so no steel is solid (I). By conversion, "all steel is iron" gives "some iron is steel" (II). Both follow.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q020
    difficulty: medium
    stem: |-
      In the following figure, square represents athletes, triangle represents engineers, circle represents fathers and rectangle represents entrepreneurs. Which set of letters represents athletes who are either entrepreneurs or fathers?

      *(Figure: Overlapping shapes: a triangle (A alone at its top, B where it overlaps the square), a square (C alone; D where it overlaps the circle), a long horizontal rectangle at bottom-left (G alone; F inside the square; E inside square, circle and rectangle; H inside rectangle and circle below the square), and a circle at right (I alone).)*
    options:
      A: F,E,D
      B: D,E,F,G,H,I
      C: G,H,I
      D: E,H
    answer: A
    explanation: The athletes (square) who are also fathers (circle) or entrepreneurs (rectangle) are in regions D, E and F.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q025
    difficulty: medium
    stem: |-
      A word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as shown in the given two matrices. The columns and rows of Matrix-I are numbered from 0 to 4 and that of Matrix-II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, for example 'Y' can be represented by 55, 87 etc and 'Z' can be represented by 14, 01 etc. Similarly, you have to identify the set for the word 'VERY'.

      Matrix I

      |   | 0 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|---|
      | 0 | W | Z | G | T | D |
      | 1 | S | R | W | G | Z |
      | 2 | X | F | S | D | E |
      | 3 | Q | V | C | S | F |
      | 4 | A | T | Q | Q | A |

      Matrix II

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | Y | N | L | I | Y |
      | 6 | H | I | P | J | I |
      | 7 | B | K | O | N | O |
      | 8 | U | M | Y | B | P |
      | 9 | J | O | H | L | K |

      *(Figure: Two 5×5 letter matrices printed as an image; reproduced as tables.)*
    options:
      A: 01,43,21,78
      B: 31,24,11,87
      C: 11,20,66,85
      D: 88,56,43,20
    answer: B
    explanation: In option B, 31 = V, 24 = E, 11 = R and 87 = Y, which spells VERY.
    tags:
      - reasoning
  - slug: cgl-2017-08-21-s1-q026
    difficulty: medium
    stem: The demand for a inferior good decreases with ________ in the consumer's income.
    options:
      A: increase
      B: decrease
      C: constant
      D: double
    answer: A
    explanation: Demand for an inferior good falls as income rises (a negative income effect).
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q027
    difficulty: medium
    stem: Goods for which the quantity that a consumer chooses, increases as the consumer's income increases and decreases as the income decreases are called?
    options:
      A: Inferior goods
      B: Normal goods
      C: Complementary goods
      D: Substitute goods
    answer: B
    explanation: Normal goods are those whose demand rises with income and falls when income falls.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q028
    difficulty: medium
    stem: '"Prevention of cruelty to animals" is listed in the __________ list given in the Seventh Schedule in the Constitution of India.'
    options:
      A: Union
      B: State
      C: Global
      D: Concurrent
    answer: D
    explanation: '"Prevention of cruelty to animals" is entry 17 of the Concurrent List (List III).'
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q029
    difficulty: medium
    stem: ___________ makes laws on matters included in Union List and Concurrent List.
    options:
      A: Lok Sabha
      B: Ministry of Defence
      C: Prime Minister's Office
      D: Securities and Exchange Board of India
    answer: A
    explanation: Parliament, of which the Lok Sabha is a House, makes laws on Union List and Concurrent List subjects.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q030
    difficulty: medium
    stem: According to the categories of land mentioned in the Chola inscriptions ___________ was known as the land for the maintenance of schools?
    options:
      A: Vellanvagai
      B: Brahmadeya
      C: Shalabhoga
      D: Devadana
    answer: C
    explanation: In Chola inscriptions, shalabhoga was land set apart for the upkeep of a school.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q031
    difficulty: medium
    stem: Prince Salim was the name of the future Emperor _________.
    options:
      A: Babur
      B: Humayun
      C: Jahangir
      D: Akbar
    answer: C
    explanation: Prince Salim, Akbar's son, became Emperor Jahangir in 1605.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q032
    difficulty: medium
    stem: ___________ is the breaking up of the rocks on the earth's surface.
    options:
      A: Erosion
      B: Weathering
      C: Attrition
      D: Abrasion
    answer: B
    explanation: Weathering is the breaking up of rocks in place on the earth's surface; erosion carries the pieces away.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q033
    difficulty: medium
    stem: The method of soil conservation in the coastal and dry regions where rows of trees are planted to check the wind movement to protect soil cover is called?
    options:
      A: Mulching
      B: Contour barriers
      C: Rock dam
      D: Shelter belts
    answer: D
    explanation: Shelter belts are rows of trees planted to break the wind and protect the soil in coastal and dry areas.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q034
    difficulty: medium
    stem: Biological names are generally derived from which language?
    options:
      A: French
      B: Latin
      C: Mexican
      D: German
    answer: B
    explanation: Scientific (biological) names follow binomial nomenclature and are Latin or Latinised.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q035
    difficulty: medium
    stem: The members of rhodophyceae are commonly called _________ algae.
    options:
      A: Green
      B: Brown
      C: Red
      D: Yellow
    answer: C
    explanation: Rhodophyceae are the red algae, coloured by the pigment r-phycoerythrin.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q036
    difficulty: medium
    stem: Aurelia (Medusa) and Adamsia (Polyp) are examples of which Phylum?
    options:
      A: Ctenophora
      B: Annelida
      C: Coelenterata
      D: Aschelminthes
    answer: C
    explanation: Aurelia (a jellyfish, medusa) and Adamsia (a sea anemone, polyp) belong to Coelenterata (Cnidaria).
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q037
    difficulty: medium
    stem: Energy in the form of heat is wasted when a machine is operated. This heat is generated due to ___________.
    options:
      A: burning
      B: friction
      C: combustion
      D: lubrication
    answer: B
    explanation: Friction between the moving parts of a machine turns some energy into heat.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q038
    difficulty: medium
    stem: The incident ray, the _________ at the point of incidence and the reflected ray all lie in the same plane.
    options:
      A: surface
      B: tangent
      C: normal
      D: angle of reflection
    answer: C
    explanation: By the laws of reflection, the incident ray, the normal at the point of incidence and the reflected ray lie in one plane.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q039
    difficulty: medium
    stem: In Microsoft Word, _______ allows us to move selected paragraphs to the right.
    options:
      A: Decrease Indent
      B: Increase Indent
      C: Double Indent
      D: Single Indent
    answer: B
    explanation: '"Increase Indent" moves the selected paragraphs to the right; "Decrease Indent" moves them to the left.'
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q040
    difficulty: medium
    stem: Blue Vitriol is another name for which of the following?
    options:
      A: Copper Sulphate
      B: Oxygen
      C: Copper
      D: Magnesium Oxide
    answer: A
    explanation: Blue vitriol is copper sulphate pentahydrate, CuSO₄·5H₂O.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q041
    difficulty: medium
    stem: The rubbing surface of a matchbox has powdered glass and a little red ________________.
    options:
      A: antimony
      B: arsenic
      C: silicon
      D: phosphorus
    answer: D
    explanation: A matchbox's striking surface has powdered glass and a little red phosphorus.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q042
    difficulty: medium
    stem: A few organisms can tolerate and thrive in a wide range of temperatures. Such organisms are called ___________.
    options:
      A: Osmotic
      B: Eurythermal
      C: Stenothermal
      D: Hydrothermal
    answer: B
    explanation: Organisms that tolerate a wide range of temperatures are eurythermal; those with a narrow range are stenothermal.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q043
    difficulty: medium
    stem: _____________ scheme by the Central Government will strengthen the bond between all the states, regions, and districts of India.
    options:
      A: Uday Desh Ka Aam Nagrik
      B: Urja Ganga
      C: Ek Bharat Shrestha Bharat
      D: Namami Ganga Yojana
    answer: C
    explanation: Ek Bharat Shreshtha Bharat (2015) pairs states and UTs to strengthen bonds between the regions of India.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q044
    difficulty: medium
    stem: Who invented Velcro?
    options:
      A: Thomas Edison
      B: William Harvey
      C: George de Mestral
      D: Robert Boyles
    answer: C
    explanation: Swiss engineer George de Mestral invented Velcro (patented in 1955).
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q045
    difficulty: medium
    stem: Which nation will host the FIFA Men's World Cup to be held in the year 2018?
    options:
      A: Japan
      B: South Korea
      C: China
      D: Russia
    answer: D
    explanation: Russia hosted the 2018 FIFA World Cup.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q046
    difficulty: medium
    stem: Charminar was built by?
    options:
      A: Humayun
      B: Mohammed Quli Qutab Shah
      C: Ashoka
      D: Narasimha
    answer: B
