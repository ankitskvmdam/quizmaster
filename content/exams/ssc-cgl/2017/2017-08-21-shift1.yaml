  - slug: cgl-2017-08-21-s1-q065
    difficulty: medium
    stem: What is the reflection of the point ( −3, 2) in the line x = −2?
    options:
      A: ( −3 , −6)
      B: (1 , 2)
      C: ( −3 , 6)
      D: (−1 , 2)
    answer: D
    explanation: Reflecting in x = −2 keeps y and gives x' = 2(−2) − (−3) = −1, so the image is (−1, 2).
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q066
    difficulty: medium
    stem: Point P is the midpoint of segment AB. Co-ordinates of P are (1 , 3) and A are (−3 , 8). What are the co-ordinates of point B?
    options:
      A: (−5 , −2)
      B: (−5 , 2)
      C: (5 , 2)
      D: (5 , −2)
    answer: D
    explanation: B = (2 × 1 − (−3), 2 × 3 − 8) = (5, −2).
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q067
    difficulty: medium
    stem: What is the slope of the line perpendicular to the line passing through the points (3 , −2) and (4 , 2)?
    options:
      A: 1/4
      B: "4"
      C: −4
      D: −1/4
    answer: D
    explanation: The line has slope (2 − (−2))/(4 − 3) = 4, so a perpendicular line has slope −1/4.
