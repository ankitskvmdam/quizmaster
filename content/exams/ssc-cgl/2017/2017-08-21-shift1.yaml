  - slug: cgl-2017-08-21-s1-q068
    difficulty: medium
    stem: ΔABC is similar to ΔPQR. If ratio of perimeters of ΔABC and ΔPQR is 3:7 and if PQ = 21 cm, then the length of AB (in cm) is?
    options:
