    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q047
    difficulty: medium
    stem: Which of the following is an Indian military decoration awarded for valour, courageous action or self-sacrifice away from the battlefield?
    options:
      A: Ashok Chakra
      B: Dada Saheb Phalke Awards
      C: Arjuna Award
      D: Padma Shri
    answer: A
    explanation: The Ashoka Chakra is India's highest peacetime gallantry award, for valour away from the battlefield.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q048
    difficulty: medium
    stem: |-
      Which of the statements given below are correct?

      1. The author of the novel 'Accelerando' is Charles Stross.  
      2. The author of the novel 'The Windup Girl' is Paolo Bacigalupi.  
      3. The author of the novel 'The Devil in Silver' is Josh Malerman.
    options:
      A: 1 and 2
      B: 2 and 3
      C: 1 and 3
      D: 1, 2 and 3
    answer: A
    explanation: Accelerando is by Charles Stross and The Windup Girl by Paolo Bacigalupi; The Devil in Silver is by Victor LaValle, not Josh Malerman.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q049
    difficulty: medium
    stem: In March 2017, in which country was "world's largest artificial sun" switched on?
    options:
      A: China
      B: USA
      C: Germany
      D: Russia
    answer: C
    explanation: Germany's DLR switched on "Synlight", the world's largest artificial sun, at Jülich in March 2017.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q050
    difficulty: medium
    stem: With which other country does Bangladesh share its border besides India?
    options:
      A: China
      B: Laos
      C: Bhutan
      D: Myanmar
    answer: D
    explanation: Besides India, Bangladesh shares a land border only with Myanmar.
    tags:
      - general-awareness
  - slug: cgl-2017-08-21-s1-q051
    difficulty: medium
    stem: What least number must be added to 329, so that the sum is completely divisible by 7?
    options:
      A: "1"
      B: "0"
      C: "2"
      D: "3"
    answer: B
    explanation: 329 = 7 × 47, so it is already divisible by 7 and nothing needs to be added.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q052
    difficulty: medium
    stem: A can do a work in 15 days and B in 30 days. If they work on it together, then in how many days will they be able to do 50% of the work?
    options:
      A: "5"
      B: "6"
      C: "4"
      D: "3"
    answer: A
    explanation: Together they do 1/15 + 1/30 = 1/10 of the work a day, so half the work takes 5 days.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q053
    difficulty: medium
    stem: What is the area (in sq cm) of an equilateral triangle of side 10 cm?
    options:
      A: 25√3
      B: 50√3
      C: 75√3
      D: 10√3
    answer: A
    explanation: Area = (√3/4) × 10² = 25√3 cm².
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q054
    difficulty: medium
    stem: What is the effective discount (in %) on two successive discounts of 15% and 50%?
    options:
      A: "65"
      B: "57.5"
      C: "35"
      D: "42.5"
    answer: B
    explanation: Effective discount = 1 − 0.85 × 0.5 = 0.575, that is 57.5%.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q055
    difficulty: medium
    stem: Profit of Rs 42,500 has to be divided between three partners A, B and C in the ratio 3:5:9. How much (in Rs) does A get?
    options:
      A: "12500"
      B: "9500"
      C: "22500"
      D: "7500"
    answer: D
    explanation: A's share = 3/17 × 42500 = ₹7500.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q056
    difficulty: medium
    stem: The average weight of A, B and C is 49 kg. If the average weight of A and B is 35 kg and that of B and C is 62 kg, then the weight of B (in kgs) is?
    options:
      A: "47"
      B: "45"
      C: "43"
      D: "49"
    answer: A
    explanation: A + B = 70 and B + C = 124, and A + B + C = 147, so B = 70 + 124 − 147 = 47 kg.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q057
    difficulty: medium
    stem: A shopkeeper by selling 6 items, earns a profit equal to the selling price of 1 item. What is his profit percentage?
    options:
      A: "20"
      B: "25"
      C: "30"
      D: "35"
    answer: A
    explanation: Profit on 6 items = SP of 1 item, so CP of 6 = SP of 5. Profit = 1/5 of CP = 20%.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q058
    difficulty: medium
    stem: What is the value of 125% of 25% of 80?
    options:
      A: "50"
      B: "25"
      C: "20"
      D: "40"
    answer: B
    explanation: 25% of 80 = 20, and 125% of 20 = 25.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q059
    difficulty: medium
    stem: To cover a distance of 81 km in 1.5 hours what should be the average speed of the car in meters/second?
    options:
      A: "10"
      B: "15"
      C: "12"
      D: "9"
    answer: B
    explanation: 81 km / 1.5 h = 54 km/h = 54 × 5/18 = 15 m/s.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q060
    difficulty: medium
    stem: In 4 years at simple interest the principal increases by 32%. What will be the compound interest earned (in Rs) on Rs. 24,000 in 3 years at the same rate?
    options:
      A: "5233"
      B: "6332"
      C: "5332"
      D: "6233"
    answer: D
    explanation: The SI rate is 32/4 = 8%. CI = 24000 × (1.08³ − 1) = 24000 × 0.259712 ≈ ₹6233.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q061
    difficulty: medium
    stem: If 5/2(8x/3 − 1/2) + 13/2 = 2x/3, then what is the value of x?
    options:
      A: 7/8
      B: 8/7
      C: −8/7
      D: −7/8
    answer: D
    explanation: 20x/3 − 5/4 + 13/2 = 2x/3, so 6x = −21/4 and x = −7/8.
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q062
    difficulty: medium
    stem: If a³ + b³ = 72 and ab = 8 , then what is the value of a + b?
    options:
      A: "2"
      B: "5"
      C: "6"
      D: "3"
    answer: C
    explanation: "a³ + b³ = (a+b)³ − 3ab(a+b): s³ − 24s = 72, which s = 6 satisfies (216 − 144 = 72)."
    tags:
      - quant
  - slug: cgl-2017-08-21-s1-q063
    difficulty: medium
    stem: Sum of four times a fraction and 7 times its reciprocal is 16. What is the fraction?
    options:
      A: 2/7
      B: 7/2
      C: 4/7
      D: 7/4
    answer: B
    explanation: 4x + 7/x = 16 gives 4x² − 16x + 7 = 0, so x = 7/2 or 1/2. Only 7/2 is an option.
    tags:
