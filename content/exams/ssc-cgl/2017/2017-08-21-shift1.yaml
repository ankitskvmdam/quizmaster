  - slug: cgl-2017-08-21-s1-q070
    difficulty: medium
    stem: Δ ABC is right angled at B. If m∠A = 60°, then what is the value of Cot C?
    options:
      A: √2
      B: 1/√3
      C: √3
      D: 2/√3
    answer: C
    explanation: The angles add to 180°, so C = 180° − 90° − 60° = 30°, and cot 30° = √3.
