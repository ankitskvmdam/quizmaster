      People generally say that natural calamities can be predicted by observing the animals. But what if animals are suffering from some disease and don’t show any signs before the event appears? They may fail to make peculiar sounds or actions about the events which are going to take place. (4)________, some unnatural calamities that are likely to appear may forecast their shadows by some bad omens. (5)________, we should not completely cancel out the possibilities that animals can sense certain unnatural happenings.

      Select the most appropriate option to fill in blank number 2.
    options:
      A: rescind
      B: foresee
      C: legalise
      D: affect
    answer: B
    explanation: One may not 'foresee' an event that happens within a second.
