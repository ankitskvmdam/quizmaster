questions:
  - slug: cgl-2024-09-09-s1-q001
    difficulty: medium
    stem: |-
      What will come in place of the question mark (?) in the following equation, if ‘+’ and ‘–’ are interchanged and ‘×’ and ‘÷’ are interchanged?

      4515 × 5 – 431 ÷ 3 + 821 = ?
    options:
      A: "1335"
      B: "1775"
      C: "1575"
      D: "1375"
    answer: D
    explanation: "After the swaps: 4515 ÷ 5 + 431 × 3 − 821 = 903 + 1293 − 821 = 1375."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q002
    difficulty: medium
    stem: "31 is related to 152 by certain logic. Following the same logic, 47 is related to 168. To which of the following is 66 related, following the same logic? (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc., to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)"
    options:
      A: "180"
      B: "187"
      C: "185"
      D: "190"
    answer: B
    explanation: "Add 121: 31 + 121 = 152, 47 + 121 = 168, so 66 + 121 = 187."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q003
    difficulty: medium
    stem: |-
      Six letters Q, Z, V, T, L and A are written on different faces of a dice. Two positions of this dice are shown in the figures below. Find the letter on the face opposite to Q.

      [Figure: two dice]

      *(Figure: Dice 1: top Q, front-left Z, front-right V. Dice 2: top T, front-left L, front-right V.)*
    options:
      A: Z
      B: T
      C: V
      D: A
    answer: B
    explanation: "V is in the same place (front-right) in both dice, so the faces above it match up: Q is opposite T (and Z opposite L)."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q004
    difficulty: medium
    stem: |-
      In the following number-pairs, the second number is obtained by applying certain mathematical operations to the first number. In three of the four pairs, the same pattern is applied and hence they form a group. Select the number-pair that DOES NOT belong to this group.

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)
    options:
      A: 335 - 119
      B: 358 - 152
      C: 317 - 101
      D: 308 - 92
    answer: B
    explanation: First − second = 216 in 335-119, 317-101 and 308-92; 358 − 152 = 206.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q005
    difficulty: medium
    stem: In a certain code language, 'NAME’ is written as 'FNBO' and 'NANO' is written as 'POBO’. How will 'NAIL’ be written in that language?
    options:
      A: MOBJ
      B: MJOB
      C: MOJB
      D: MJBO
    answer: D
    explanation: "The word is reversed and each letter moved +1: NAME → EMAN → FNBO. NAIL → LIAN → MJBO."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q006
    difficulty: medium
    stem: |-
      The question contains pairs of words that are related to each other in a certain way.

      Three of the following four word pairs are alike as these have the same relationship and thus form a group. Which word pair is the one that DOES NOT belong to that group?

      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)
    options:
      A: Pentagon - 5 sides
      B: Hexagon - 8 sides
      C: Triangle - 3 sides
      D: Square - 4 sides
    answer: B
    explanation: Each pair names a polygon and its number of sides; a hexagon has 6 sides, not 8.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q007
    difficulty: medium
    stem: The position of how many letters will remain unchanged if each of the letters in the word ‘NIGHTMARES’ is re-arranged in the English alphabetical order from left to right?
    options:
      A: One
      B: Four
      C: Two
      D: Three
    answer: B
    explanation: NIGHTMARES sorted is AEGHIMNRST; G, H, M and R stay in positions 3, 4, 6 and 8, so four letters are unchanged.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q008
    difficulty: medium
    stem: |-
      What will come in the place of ‘?’ in the following equation, if ‘+’ and ‘–‘ are interchanged and ‘×’ and ‘÷’ are interchanged?

      5 – 4 ÷ 9 + 80 × 10 = ?
    options:
      A: "31"
      B: "33"
      C: "35"
      D: "30"
    answer: B
    explanation: "After the swaps: 5 + 4 × 9 − 80 ÷ 10 = 5 + 36 − 8 = 33."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q009
    difficulty: medium
    stem: |-
      Select the option in which the numbers share the same relationship as that shared by the given pair of numbers.

      (149, 213)

      (168, 232)

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/deleting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)
    options:
      A: (162, 222)
      B: (153, 217)
      C: (137, 211)
      D: (144, 198)
    answer: B
    explanation: "Second = first + 64: 149 + 64 = 213, 168 + 64 = 232, 153 + 64 = 217."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q011
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.

      MEK: NVP :: GYT: TBG :: JWH:?
    options:
      A: QDS
      B: PCR
      C: QDT
      D: PCS
    answer: A
    explanation: "Each letter is replaced by its opposite letter (positions add to 27): M↔N, E↔V, K↔P. JWH → QDS."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q012
    difficulty: medium
    stem: |-
      Three statements are given followed by three conclusions numbered I, II and III.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      No card is a parcel.

      All cards are envelopes.

      Some envelopes are bags.

      Conclusions:

      I. All envelopes can never be parcels.

      II. No card is a bag.

      III. At least some bags are postcards.
    options:
      A: Only I follows
      B: Only II follows
      C: Only I and III follow
      D: Only II and III follow
    answer: A
    explanation: Cards are envelopes that are not parcels, so not every envelope can be a parcel (I follows). No card–bag link is fixed (II fails), and postcards are not mentioned (III fails).
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q015
    difficulty: medium
    stem: |-
      Which of the four options will replace the question mark (?) in the following series?

      UE 88, VG 84, WI 80, XK76, ?
    options:
      A: ZM72
      B: ZN71
      C: YN73
      D: YM72
    answer: D
    explanation: "First letters go +1 (U, V, W, X, Y), second letters +2 (E, G, I, K, M), numbers −4 (88 … 72): YM72."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q016
    difficulty: medium
    stem: |-
      Select the option that represents the letters that when placed from left to right in the blanks below will complete the letter series.

      L_P_QS_K_P_S_KP_Q_L_ _PQS
    options:
      A: KPLPLQLSPK
      B: PKLPQPLSKP
      C: KPLPQQLPSK
      D: KPLPQLPSKP
    answer: D
    explanation: The series is LKPPQS repeated four times, so the blanks are K, P, L, P, Q, L, P, S, K, P.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q018
    difficulty: medium
    stem: |-
      Six numbers 21, 22, 23, 24, 25 and 26 are written on different faces of a dice. Three positions of this dice are shown in the figure. Find the number on the face opposite to 24.

      [Figure: three dice]

      *(Figure: Dice 1: top 21, front-left 23, front-right 25. Dice 2: top 21, front-left 25, front-right 22. Dice 3: top 25, front-left 24, front-right 22.)*
    options:
      A: "26"
      B: "25"
      C: "22"
      D: "21"
    answer: D
    explanation: 25 touches 21, 23, 22 and 24, so 25 is opposite 26. 21 touches 23, 25 and 22, so it must be opposite 24.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q019
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      [Figure: a composite figure of squares divided by diagonals]

      *(Figure: A small square at the top-left with a diamond (square rotated 45°) inside it, overlapping a larger irregular block of squares and rectangles below/right; several of the small squares are cut by diagonals into triangles.)*
    options:
      A: "21"
      B: "20"
      C: "18"
      D: "19"
    answer: A
    explanation: As per SSC's official answer.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q020
    difficulty: medium
    stem: In a certain code language, ‘what where how’ is written as ‘aa dd ff’; ‘where there that’ is written as ‘dd zz pp’ and ‘which what here’ is written as ‘ff kk ll’. How is ‘how’ written in that language?
    options:
      A: aa
      B: kk
      C: zz
      D: ff
    answer: A
    explanation: "'where' = dd (common to the first two) and 'what' = ff (common to the first and third), so 'how' = aa."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q021
    difficulty: medium
    stem: |-
      Three statements are given followed by three conclusions numbered I, II and III.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      Some tears are drops.

      Some drops are streams.

      All streams are rivers.

      Conclusions:

      I. All tears can never be rivers.

      II. Some drops are rivers.

      III. All tears being streams is a possibility.
    options:
      A: Only conclusion I follows
      B: Both II and III conclusion follow
      C: Only conclusion III follows
      D: Both I and II conclusion follow
    answer: B
    explanation: The drops that are streams are rivers, so some drops are rivers (II). Nothing rules out all tears being streams (III). I is not definite.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q022
    difficulty: medium
    stem: |-
      Which of the following terms will replace the question mark (?) in the given series?

      YZUW, ?, QTQU, MQOT, INMS
    options:
      A: UWSV
      B: UWVS
      C: USWV
      D: WUSV
    answer: A
    explanation: "The four letter positions move −4, −3, −2, −1: Y→U, Z→W, U→S, W→V, giving UWSV."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q023
    difficulty: medium
    stem: |-
      In a certain code language,

      ‘A + B’ means ‘A is the mother of B’,

      ‘A – B’ means ‘A is the father of B’,

      ‘A \$ B’ means ‘A is the son of B’,

      ‘A % B’ means ‘A is the sister of B’,

      ‘A / B’ means ‘A is the wife of B’ and

      ‘A = B’ means ‘A is the brother of B’.

      Which of the following means A is the daughter of K?

      i. A + K / J – P = D

      ii. J % P = K + A = D

      iii. K + A / P – D % J

      iv. D + K = A / P – J
    options:
      A: i
      B: iii
      C: ii
      D: iv
    answer: B
    explanation: In iii, K + A means K is A's mother, and A / P means A is a wife (female), so A is K's daughter.
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q024
    difficulty: medium
    stem: |-
      19 is related to 209 following a certain logic. Following the same logic, 27 is related to 297. To which of the following is 61 related, following the same logic?

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "653"
      B: "600"
      C: "571"
      D: "671"
    answer: D
    explanation: "Multiply by 11: 19 × 11 = 209, 27 × 11 = 297, 61 × 11 = 671."
    tags:
      - reasoning
  - slug: cgl-2024-09-09-s1-q025
    difficulty: medium
    stem: |-
      Which of the following numbers will replace the question mark (?) in the given series?

      1, 3, 10, 41, ?, 1237
    options:
      A: "202"
      B: "210"
      C: "200"
      D: "206"
    answer: D
    explanation: "Each term = previous × n + 1 with n = 2, 3, 4, …: 41 × 5 + 1 = 206, and 206 × 6 + 1 = 1237."
    tags:
      - reasoning
