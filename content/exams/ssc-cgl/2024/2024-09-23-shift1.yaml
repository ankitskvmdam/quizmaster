  - slug: cgl-2024-09-23-s1-q015
    difficulty: medium
    stem: "12 is related to 235 by certain logic. Following the same logic, 14 is related to 287. To which of the following is 18 related, following the same logic? (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc., to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)"
    options:
      A: "512"
      B: "415"
      C: "438"
      D: "320"
    answer: B
    explanation: |-
      Second number = first² + 91: 12² + 91 = 235, 14² + 91 = 287.
      So 18² + 91 = 324 + 91 = 415.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q016
    difficulty: medium
    stem: |-
      Select the option that can replace the question mark (?) in the following series.

      BH14, CJ17, DL20, EN23, ?
    options:
      A: FP26
      B: GO24
      C: GP26
      D: FO24
    answer: A
    explanation: |-
      First letter +1 (B, C, D, E, F), second letter +2 (H, J, L, N, P), number +3 (14, 17, 20, 23, 26).
      So the next term is FP26.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q017
    difficulty: medium
    stem: |-
      Three different positions of the same dice are given. Find the number on the face opposite to the face showing ‘2’.

      *(Figure: Three views of a dice. View 1: top 3, left 5, right 4. View 2: top 3, left 4, right 6. View 3: top 2, left 1, right 6.)*
    options:
      A: "6"
      B: "4"
      C: "3"
      D: "1"
    answer: C
    explanation: |-
      Faces next to 3 are 5, 4 and 6, so 3 is opposite 1 or 2; 6 touches 3, 4, 1 and 2, so 6 is opposite 5.
      Placing the faces by the order shown in the three views gives 1 opposite 4, leaving 2 opposite 3.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q018
    difficulty: medium
    stem: All the alphabets in the word ‘DICTIONARY’ are arranged in the alphabetical order. How many alphabets are there in the English alphabetical series between the alphabet which is fourth from the left end and the one which is second from the right end in the newly formed letter-cluster?
    options:
      A: "12"
      B: "9"
      C: "11"
      D: "10"
    answer: D
    explanation: |-
      DICTIONARY in alphabetical order is A C D I I N O R T Y. The 4th from the left is I and the 2nd from the right is T.
      Between I and T in the alphabet there are 10 letters (J to S).
