    difficulty: medium
    stem: A thief is noticed by a policeman from a distance of 92 m. The thief starts running and the policeman chases him. The thief and the policeman run at the speed of 90 km/h and 104.4 km/h, respectively. In how much time will the policeman catch the thief?
    options:
