  - slug: cgl-2024-09-23-s1-q023
    difficulty: medium
    stem: |-
      If

      ‘A & Z’ means ‘A is the brother of Z’,

      ‘A # Z’ means ‘A is the sister of Z’,

      ‘A ^ Z’ means ‘A is the brother of Z’s father’,

      ‘A @ Z’ means ‘A is the wife of Z’,

      ‘A % Z’ means ‘A is the mother of Z’,

      ‘A α Z’ means ‘A is the father of Z’,

      then how is J related to Z in the following expression?

      J % K # L @ M α N & Z
    options:
      A: Father’s mother
      B: Mother
      C: Mother’s mother
      D: Mother’s sister
    answer: C
    explanation: |-
      J is the mother of K; K is the sister of L, so J is L’s mother. L is M’s wife, M is N’s father and N is Z’s brother, so L is Z’s mother.
      J is therefore Z’s mother’s mother.
    tags:
      - reasoning
