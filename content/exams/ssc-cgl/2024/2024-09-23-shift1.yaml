questions:
  - slug: cgl-2024-09-23-s1-q001
    difficulty: medium
    stem: "Based on the position in the English alphabetical order, three of the following letter-clusters are alike in some manner and one is different. Select the odd letter-cluster. Note: The odd one out is not based on the number of consonants/vowels or their position in the letter cluster."
    options:
      A: PSKI
      B: TWGD
      C: JMQN
      D: MPNK
    answer: A
    explanation: |-
      In TWGD, JMQN and MPNK the pattern is +3, then −3 (T→W, G→D; J→M, Q→N; M→P, N→K).
      PSKI breaks it: P→S is +3 but K→I is only −2.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q002
    difficulty: medium
    stem: |-
      Which of the following terms will replace the question mark (?) in the given series?

      JHOQ, NFSO, ? , VBAK, ZZEI
    options:
      A: RCWM
      B: RCXM
      C: RDMW
      D: RDWM
    answer: D
    explanation: |-
      Letters 1 and 3 move +4 (J→N→R→V→Z, O→S→W→A→E); letters 2 and 4 move −2 (H→F→D→B→Z, Q→O→M→K→I).
      So the missing term is RDWM.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q004
    difficulty: medium
    stem: |-
      Select the number that will come in the place of the question mark(?), if ‘+’ and ‘ – ‘ are interchanged and ‘×’ and ‘÷’ are interchanged

      63 × 7 ÷ 13 – 64 + 42 = ?
    options:
      A: "139"
      B: "131"
      C: "144"
      D: "124"
    answer: A
    explanation: "After interchanging: 63 ÷ 7 × 13 + 64 − 42 = 9 × 13 + 22 = 117 + 22 = 139."
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q005
    difficulty: medium
    stem: In a certain code language, 'RADIO' is written as 'SZEHP' and 'FREQUENCY' is written as 'GQFPVDOBZ'. How will 'TELEVISION' be written in that language?
    options:
      A: UDMDWHTHPM
      B: UDMDWHTHOM
      C: UDMDWHTHPN
      D: UDMDWHHTPM
    answer: A
    explanation: |-
      Letters alternately move +1 and −1 (R→S, A→Z, D→E, I→H, O→P).
      TELEVISION → U D M D W H T H P M = UDMDWHTHPM.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q006
    difficulty: medium
    stem: |-
      Three of the following numbers are alike in a certain way and one is different. Pick the odd one out.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc., to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)
    options:
      A: 18 – 11 – 63
      B: 12 – 8 – 36
      C: 21 – 14 – 72
      D: 15 – 3 – 108
    answer: C
    explanation: |-
      Third number = 9 × (first − second): 9 × 7 = 63, 9 × 4 = 36, 9 × 12 = 108.
      For 21 – 14 – 72, 9 × 7 = 63, not 72, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q007
    difficulty: medium
    stem: |-
      Select the option that represents the letters that, when placed from left to right in the blanks below, will complete the letter series.

      S _ Y A _ F I K M _ S U W
    options:
      A: UCP
      B: VCP
      C: VCQ
      D: VBP
    answer: B
    explanation: |-
      The letters move +3, +3, +2, +2 repeatedly: S, V, Y, A, C, F, I, K, M, P, S, U, W.
      So the blanks are V, C, P.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q008
    difficulty: medium
    stem: |-
      Find the correct combination of letters that when sequentially filled in the blanks of the given series will make the series logically complete.

      ABF_HI_NOP_U_WABCDH_
    options:
      A: GMSVI
      B: GMTUI
      C: GMTVI
      D: IMTVI
    answer: C
    explanation: |-
      The series is runs of consecutive letters with three letters skipped between runs: AB (skip CDE) FGHI (skip JKL) MNOP (skip QRS) TUVW (skip XYZ) ABCD (skip EFG) HI.
      So the blanks are G, M, T, V, I.
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q009
    difficulty: medium
    stem: |-
      Six letters P, J, U, W, L and K are written on different faces of a dice. Two positions of this dice are shown in the figures below. Find the letter on the face opposite to P.

      *(Figure: Two views of a dice. View 1: top P, left J, right U. View 2: top W, left J, right L.)*
    options:
      A: K
      B: W
      C: U
      D: J
    answer: B
    explanation: "J is in the same position (left) in both views, so the faces in matching positions are opposite: P (top) is opposite W (top), and U is opposite L."
    tags:
      - reasoning
  - slug: cgl-2024-09-23-s1-q010
    difficulty: medium
    stem: |-
      Select the triad in which the numbers are related in the same way as are the numbers of the given triads.

      (25, 22, 47), (31, 24, 55)

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /deleting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: (17, 15, 22)
      B: (22, 19, 45)
      C: (18, 21, 39)
      D: (27, 25, 42)
    answer: C
    explanation: |-
      First + second = third: 25 + 22 = 47, 31 + 24 = 55.
      Likewise 18 + 21 = 39.
    tags:
      - reasoning
