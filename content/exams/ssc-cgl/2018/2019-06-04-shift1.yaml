  - slug: cgl-2019-06-04-s1-q021
    difficulty: medium
    stem: ₹1,875 is divided among A, B and C in such a way that A’s share is half of the combined share of B and C, and B’s share is one-fourth of the combined share of A and C. By what amount is C’s share more than that of A?
    options:
      A: ₹500
      B: ₹225
      C: ₹250
      D: ₹200
    answer: C
    explanation: A = (B + C)/2, so A = 1875/3 = 625. B = (A + C)/4, so B = 1875/5 = 375. Then C = 875 and C − A = ₹250.
    tags:
      - reasoning
