  - slug: cgl-2019-06-04-s1-q018
    difficulty: medium
    stem: |-
      Which number will replace the question mark (?) in the following series?

      3, 7, 16, 35, ?, 153
    options:
      A: "84"
      B: "74"
      C: "78"
      D: "63"
    answer: B
    explanation: "Each term is ×2 plus 1, 2, 3, 4, 5: 35 × 2 + 4 = 74, then 74 × 2 + 5 = 153."
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q019
    difficulty: medium
    stem: In a code language, VICTORY is written as CIVSYRO. How will TRAITOR be written as in that language?
    options:
