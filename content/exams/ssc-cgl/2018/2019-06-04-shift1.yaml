  - slug: cgl-2019-06-04-s1-q015
    difficulty: medium
    stem: |-
      Two statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      **Statements:**

      All rulers are machines.
      Some machines are costly items.

      **Conclusions:**

      I. Some rulers are costly items.
      II. Some costly items are machines.
      III. All costly items are machines.
    options:
      A: Both conclusions II and III follow
      B: Both conclusions I and II follow
      C: Only conclusion II follows
      D: Only conclusion I follows
    answer: C
    explanation: '"Some machines are costly items" converts to "some costly items are machines" (II). Nothing links rulers to costly items, so I does not follow, and III is too broad.'
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q016
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster.

      CEGI : AGEK :: DFHJ : ?
    options:
      A: CHFI
      B: CGIK
      C: BHFL
      D: BDJK
    answer: C
    explanation: The letters change by −2, +2, −2, +2 (C→A, E→G, G→E, I→K). So D→B, F→H, H→F, J→L gives BHFL.
    tags:
      - reasoning
