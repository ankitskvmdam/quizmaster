  - slug: cgl-2019-06-04-s1-q023
    difficulty: medium
    stem: |-
      Which two signs should be interchanged in the following equation to make it correct?

      12 − 8 + 12 × 9 ÷ 3 = 9
    options:
      A: + and ÷
      B: + and ×
      C: − and ÷
      D: + and −
    answer: A
    explanation: Swapping + and ÷ gives 12 − 8 ÷ 12 × 9 + 3 = 12 − 6 + 3 = 9.
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q024
    difficulty: medium
    stem: |-
      How many squares are there in the following figure?

      *(Figure: A square divided into four equal quadrants. Top-left quadrant: split into 2×2 small squares, with a diagonal from its bottom-left to its top-right corner. Top-right quadrant: both diagonals (an X). Bottom-left quadrant: both diagonals (an X). Bottom-right quadrant: split into 2×2 small squares, with a diagonal from its bottom-left to its top-right corner. The quadrant diagonals also form a tilted square joining the midpoints of the sides.)*
    options:
      A: "12"
      B: "16"
      C: "13"
      D: "14"
    answer: D
    explanation: |-
      Count the whole square (1), the four quadrants (4) and the small squares in the top-left and bottom-right quadrants (8).
      Add the tilted square formed by the four quadrant diagonals that join the midpoints of the sides (1): 14 in total.
    tags:
      - reasoning
