      B: RTAJORT
      C: ARTJOTR
      D: ARTHROT
    answer: D
    explanation: "The first three letters are reversed, the middle letter moves one back, and the last three are reversed: TRA→ART, I→H, TOR→ROT gives ARTHROT."
