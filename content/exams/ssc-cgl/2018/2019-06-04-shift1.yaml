  - slug: cgl-2019-06-04-s1-q052
    difficulty: medium
    stem: |-
      The table shows the production of different types of cars (in thousands).

      | Cars \ Years | 2012 | 2013 | 2014 | 2015 | 2016 |
      |---|---|---|---|---|---|
      | A | 30 | 35 | 48 | 45 | 56 |
      | B | 42 | 48 | 40 | 38 | 56 |
      | C | 48 | 36 | 38 | 35 | 44 |
      | D | 51 | 24 | 30 | 46 | 54 |
      | E | 20 | 42 | 40 | 35 | 43 |

      If the data related to the production of cars of type E is represented by a pie chart, then the central angle of the sector representing the data of production of cars in 2013 will be:

      *(Figure: Data table (reproduced as a Markdown table).)*
    options:
      A: 102°
      B: 84°
      C: 70°
      D: 80°
    answer: B
    explanation: Type E totals 20+42+40+35+43 = 180, so 2013's angle = 42/180 × 360° = 84°.
    tags:
      - quant
  - slug: cgl-2019-06-04-s1-q053
    difficulty: medium
    stem: "A truck covers a distance of 384 km at a certain speed. If the speed is decreased by 16 km/h, it will take 2 hours more to cover the same distance. 75% of its original speed (in km/h) is:"
    options:
      A: "45"
      B: "54"
      C: "48"
      D: "42"
    answer: C
    explanation: 384/(v−16) − 384/v = 2 gives v(v−16) = 3072, so v = 64 km/h. 75% of 64 = 48.
    tags:
      - quant
  - slug: cgl-2019-06-04-s1-q054
    difficulty: medium
    stem: "The ratio of the ages of A and B, four years ago, was 4 : 5. Eight years from now, the ratio of the ages of A and B will be 11 : 13. What is the sum of their present ages?"
    options:
      A: 80 years
      B: 96 years
      C: 72 years
      D: 76 years
    answer: A
    explanation: (4k + 12)/(5k + 12) = 11/13 gives k = 8, so A = 36 and B = 44, a sum of 80 years.
    tags:
      - quant
  - slug: cgl-2019-06-04-s1-q055
    difficulty: medium
    stem: "In ΔABC, F and E are the points on sides AB and AC, respectively, such that FE ∥ BC and FE divides the triangle in two parts of equal area. If AD ⊥ BC and AD intersects FE at G, then GD : AG = ?"
    options:
      A: "√2 : 1"
      B: "(√2 − 1) : 1"
      C: "2√2 : 1"
      D: "(√2 + 1) : 1"
    answer: B
