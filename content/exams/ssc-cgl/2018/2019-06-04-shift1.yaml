    stem: "A circle is inscribed in a triangle ABC. It touches the sides AB, BC and AC at the points R, P and Q respectively. If AQ = 4.5 cm, PC = 5.5 cm and BR = 6 cm, then the perimeter of the triangle ABC is:"
