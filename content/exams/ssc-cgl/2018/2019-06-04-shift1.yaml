questions:
  - slug: cgl-2019-06-04-s1-q001
    difficulty: medium
    stem: If DIG is coded as 25 and CUT is coded as 49, then how will KICK be coded as?
    options:
      A: "43"
      B: "39"
      C: "41"
      D: "34"
    answer: B
    explanation: "The code is the sum of letter positions plus 5: DIG = 4+9+7 = 20 → 25, CUT = 44 → 49. KICK = 11+9+3+11 = 34 → 39."
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q005
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (9, 35, 16)
    options:
      A: (16, 50, 64)
      B: (25, 30, 4)
      C: (36, 55, 25)
      D: (81, 65, 36)
    answer: C
    explanation: 9 = 3² and 16 = 4², and 35 = (3 + 4) × 5. Likewise 36 = 6² and 25 = 5², and (6 + 5) × 5 = 55.
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q006
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (3, 24, 4)
    options:
      A: (6, 35, 11)
      B: (2, 30, 8)
      C: (12, 84, 4)
      D: (4, 72, 9)
    answer: D
    explanation: "The middle number is twice the product of the outer two: 3 × 4 × 2 = 24, and 4 × 9 × 2 = 72."
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q007
    difficulty: medium
    stem: Three of the following four letter-clusters are alike in a certain way and one is different. Pick the odd one out.
    options:
      A: CFIL
      B: GHIJ
      C: MOQS
      D: PSUX
    answer: D
    explanation: CFIL (+3), GHIJ (+1) and MOQS (+2) have equal gaps; PSUX goes +3, +2, +3.
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q008
    difficulty: medium
    stem: Three of the following four numbers are alike in a certain way and one is different. Pick the number that is different from the rest.
    options:
      A: "126"
      B: "189"
      C: "254"
      D: "217"
    answer: C
    explanation: 126, 189 and 217 are multiples of 7 (7×18, 7×27, 7×31); 254 is not.
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q009
    difficulty: medium
    stem: In a family of eight persons, there are two couples, each having two children. B and D are brothers and each has two children. E is the aunt of A, who is the cousin brother of C. C is the sister of H, who is the cousin brother of G. F is the wife of B. How is H related to F?
    options:
      A: Nephew
      B: Son-in-law
      C: Son
      D: Brother-in-law
    answer: A
    explanation: C and H are siblings, and A and G are their cousins. E is A's aunt, so E is the mother of C and H, and F (B's wife) is the mother of A and G. So H is F's nephew.
    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q010
    difficulty: medium
    stem: |-
      Arrange the following words in a logical and meaningful order.

