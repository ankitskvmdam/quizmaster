    tags:
      - reasoning
  - slug: cgl-2019-06-04-s1-q012
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown. Which number will be at the top if 6 is at the bottom?

      *(Figure: Two views of one die: (1) top 5, front-left 1, front-right 6; (2) top 2, front-left 3, front-right 1.)*
    options:
      A: "4"
      B: "3"
      C: "5"
      D: "2"
    answer: D
    explanation: 1 appears in both views, so its neighbours are 5, 6, 2 and 3 and 4 is opposite 1. The cyclic order around 1 puts 6 opposite 2, so with 6 at the bottom, 2 is on top.
    tags:
      - reasoning
