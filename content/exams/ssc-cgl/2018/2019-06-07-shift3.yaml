  - slug: cgl-2019-06-07-s3-q051
    difficulty: medium
    stem: |-
      The table shows the production of different types of cars (in thousands).

      | Car \ Year | 2014 | 2015 | 2016 | 2017 | 2018 |
      |---|---|---|---|---|---|
      | A | 42 | 53 | 44 | 66 | 65 |
      | B | 46 | 49 | 57 | 64 | 72 |
      | C | 54 | 45 | 45 | 50 | 56 |
      | D | 48 | 56 | 63 | 65 | 68 |
      | E | 46 | 48 | 56 | 57 | 64 |

      If the data related to the production of type D cars is represented by a pie-chart, then the central angle of the sector representing the production of cars in 2017 will be:
    options:
      A: 50°
      B: 75.6°
      C: 81.6°
      D: 78°
    answer: D
    explanation: Type D total = 48 + 56 + 63 + 65 + 68 = 300. Angle for 2017 = 65/300 × 360° = 78°.
    tags:
      - quant
  - slug: cgl-2019-06-07-s3-q052
    difficulty: medium
    stem: "The ratio of the efficiencies of A, B and C is 3 : 5 : 1. Working together, they can complete a piece of work in 5 days. A and B work together for 3 days. The remaining work will be completed by C alone in?"
    options:
      A: 18 days
      B: 24 days
      C: 21 days
      D: 15 days
    answer: C
    explanation: The work rates are 3, 5 and 1 units/day, so total work = 9 × 5 = 45 units. A and B do 8 × 3 = 24 units, and C does the remaining 21 units in 21 days.
    tags:
      - quant
  - slug: cgl-2019-06-07-s3-q053
    difficulty: medium
    stem: "Four different positive numbers are written in ascending order. One-third of the average of all the four numbers is 19 less than the greatest of these numbers. If the average of the first three numbers is 12, the greatest number among the given numbers is:"
    options:
      A: "25"
      B: "22"
      C: "24"
      D: "21"
    answer: C
    explanation: The first three numbers sum to 36. If x is the greatest, (36 + x)/4 ÷ 3 = x − 19, so 36 + x = 12x − 228 and x = 24.
    tags:
      - quant
  - slug: cgl-2019-06-07-s3-q054
    difficulty: medium
    stem: If tan θ/(1 − cot θ) + cot θ/(1 − tan θ) = 1 + k, then k = ______.
    options:
      A: cot θ + sec θ
      B: tan θ cosec θ
      C: tan θ + sec θ
      D: cosec θ sec θ
    answer: D
    explanation: The expression simplifies to 1 + tan θ + cot θ = 1 + 1/(sin θ cos θ) = 1 + sec θ cosec θ, so k = cosec θ sec θ.
    tags:
      - quant
  - slug: cgl-2019-06-07-s3-q055
    difficulty: medium
    stem: |-
      The table shows the production of different types of cars (in thousands).

      | Car \ Year | 2014 | 2015 | 2016 | 2017 | 2018 |
      |---|---|---|---|---|---|
      | A | 42 | 53 | 44 | 66 | 65 |
      | B | 46 | 49 | 57 | 64 | 72 |
      | C | 54 | 45 | 45 | 50 | 56 |
      | D | 48 | 56 | 63 | 65 | 68 |
      | E | 46 | 48 | 56 | 57 | 64 |

      The average production of cars in 2018 is approximately what percent less than the total production of type D cars in 2015 and type B cars in 2017 taken together?
    options:
      A: 45.8%
      B: 43.6%
      C: 42.4%
      D: 44.2%
    answer: A
    explanation: 2018 average = 325/5 = 65. D 2015 + B 2017 = 56 + 64 = 120. (120 − 65)/120 × 100 ≈ 45.8%.
    tags:
      - quant
  - slug: cgl-2019-06-07-s3-q056
    difficulty: medium
    stem: A person sells an article at a profit of 12%. If he had purchased it for 12% less and sold it for ₹9 less, he would have gained 27%. What is the original cost price of the article?
    options:
