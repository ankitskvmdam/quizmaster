date: 2019-06-07
label: 7 Jun, Shift 3
source: "SSC candidate response sheet with the official answer marked (via https://www.adda247.com/jobs/wp-content/uploads/sites/22/2025/06/04132639/SSC-CGL-QUESTION-PAPER-07-June-2019-Shift-3-En). Left out (picture-only options or incomplete in the source): Q4, Q5, Q6, Q13, Q15, Q23."
questions:
  - slug: cgl-2019-06-07-s3-q001
    difficulty: medium
    stem: |-
      If

      + denotes –

      – denotes *

      * denotes /

      / denotes +

      then what will be the numeric value of

      60 * 10 / 40 + 6 – 5 =
    options:
      A: "3"
      B: "144"
      C: "16"
      D: "200"
    answer: C
    explanation: After swapping the signs the expression is 60 / 10 + 40 - 6 × 5 = 6 + 40 - 30 = 16.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q002
    difficulty: medium
    stem: Three of the following four words are alike in a certain way and one is different. Pick the odd word out.
    options:
      A: Nepal
      B: Ireland
      C: Indonesia
      D: Afghanistan
    answer: B
    explanation: Nepal, Indonesia and Afghanistan are Asian countries; Ireland is in Europe.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q003
    difficulty: medium
    stem: |-
      Which number will replace the question mark (?) in the following series?

      7, 11, 18, 29, ? , 76
    options:
      A: "53"
      B: "61"
      C: "44"
      D: "47"
    answer: D
    explanation: "Each term is the sum of the two before it: 18 + 29 = 47, and 29 + 47 = 76."
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q007
    difficulty: medium
    stem: If the word ANGEL is coded as BOHFM, then what will be the third alphabet in the code for the word SAVAGE?
    options:
      A: B
      B: U
      C: W
      D: X
    answer: C
    explanation: Each letter moves one place forward (A→B, N→O ...). SAVAGE becomes TBWBHF, whose third letter is W.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q008
    difficulty: medium
    stem: A cycle was sold for ₹4,140 with a profit of 15%. At what price could it have been sold to earn a profit of 25%?
    options:
      A: ₹4,500
      B: ₹4,350
      C: ₹4,200
      D: ₹4,850
    answer: A
    explanation: "Cost price = 4140 ÷ 1.15 = ₹3,600. For a 25% profit: 3600 × 1.25 = ₹4,500."
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q009
    difficulty: medium
    stem: Three of the following four letter-clusters are alike in a certain way and one is different. Pick the odd one out.
    options:
      A: HLP
      B: DHL
      C: PTX
      D: LPQ
    answer: D
    explanation: HLP, DHL and PTX go up by +4, +4. LPQ goes +4, +1, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q010
    difficulty: medium
    stem: Three of the following four word pairs are alike in a certain way and one is different. Pick the odd word out.
    options:
      A: "Tamil Nadu : South"
      B: "Punjab : North"
      C: "Assam : North-East"
      D: "Kerala : North-West"
    answer: D
    explanation: Kerala is in the south of India, not the north-west. The other pairs give the correct region.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q011
    difficulty: medium
    stem: Three of the following four numbers are alike in a certain way and one is different. Pick the number that is different from the rest.
    options:
      A: "2197"
      B: "1331"
      C: "343"
      D: "731"
    answer: D
    explanation: 2197 = 13³, 1331 = 11³ and 343 = 7³ are perfect cubes; 731 is not a cube.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q012
    difficulty: medium
    stem: |-
      Arrange the following words in a logical and meaningful order.

      1. Doctor  
      2. Recovery  
      3. Hospital  
      4. Home  
      5. Sickness  
      6. Medicine store
    options:
      A: 1, 5, 3, 6, 4, 2
      B: 5, 3, 6, 1, 3, 2
      C: 4, 5, 6, 1, 3, 2
      D: 5, 3, 1, 6, 2, 4
    answer: D
    explanation: Sickness → Hospital → Doctor → Medicine store → Recovery → Home, i.e. 5, 3, 1, 6, 2, 4.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q014
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (11, 16, 20)
    options:
      A: (9, 14, 19)
      B: (15, 20, 24)
      C: (17, 23, 26)
      D: (21, 26, 32)
    answer: B
    explanation: (11, 16, 20) goes +5, +4. Only (15, 20, 24) follows the same steps.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q016
    difficulty: medium
    stem: |-
      Select the number pair in which the two numbers are related in the same way as are the two numbers of the following number-pair.

      27 : 8
    options:
      A: "12 : 3"
      B: "39 : 14"
      C: "33 : 9"
      D: "19 : 5"
    answer: A
    explanation: 27 ÷ 3 − 1 = 8. In the same way 12 ÷ 3 − 1 = 3.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q017
    difficulty: medium
    stem: |-
      Two statements are given, followed by three conclusions numbered I, II and III. Assuming the statements to be true even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      **Statements:**

      Some quadrilaterals are squares.

      All squares are rhombuses.

      **Conclusions:**

      I. No quadrilateral is a rhombus.

      II. All rhombuses are squares.

      III. Some quadrilaterals are rhombuses.
    options:
      A: Only conclusion II follows
      B: Only conclusion III follows
      C: None of the conclusions follows
      D: Only conclusion I follows
    answer: B
    explanation: Some quadrilaterals are squares and all squares are rhombuses, so some quadrilaterals are rhombuses (III). I and II do not follow.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q018
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the gaps of the given letter series will complete the series.

      cd_ab_cd_abb_dda_b
    options:
      A: bbcdb
      B: dbdcb
      C: dbcbc
      D: cbdab
    answer: B
    explanation: Filling d, b, d, c, b gives cddabb | cddabb | cddabb, the block "cddabb" repeated.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster.

      FLQV : JISU :: DJNR : ?
    options:
      A: FGQN
      B: HMPS
      C: HGLQ
      D: HGPQ
    answer: D
    explanation: FLQV → JISU uses +4, −3, +2, −1. Applied to DJNR it gives HGPQ.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q020
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown. Which number will be at the top if 3 is at the bottom?

      *(Figure: Dice 1: top 5, front-left 1, front-right 4. Dice 2: top 6, front-left 3, front-right 1.)*
    options:
      A: "1"
      B: "2"
      C: "5"
      D: "4"
    answer: C
    explanation: 1 is common to both dice. Going round 1 clockwise, the first die gives 4, 5 and the second gives 6, 3, so 4 faces 6 and 5 faces 3. With 3 at the bottom, 5 is on top.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q021
    difficulty: medium
    stem: |-
      Select the word-pair in which the two words are related in the same way as are the two words in the following word-pair.

      Mnemonic : Memory
    options:
      A: "Drama : Acting"
      B: "Audition : Music"
      C: "Sedative : Sleep"
      D: "Audience : Speech"
    answer: C
    explanation: A mnemonic is used to aid memory; a sedative is used to bring on sleep.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q022
    difficulty: medium
    stem: |-
      How many triangles are there in the following figure?

      *(Figure: A rectangle divided into two squares, each with both diagonals, joined on its right side to a funnel-shaped quadrilateral that widens to the right and is divided by its diagonals and a horizontal line.)*
    options:
      A: "27"
      B: "29"
      C: "31"
      D: "25"
    answer: B
    explanation: SSC gives 29. Count the triangles in each square with its diagonals, then those in the funnel shape, then any that span the shared sides.
    tags:
      - reasoning
  - slug: cgl-2019-06-07-s3-q024
    difficulty: medium
    stem: Three of the following four letter-clusters are alike in a certain way and one is different. Pick the odd one out.
    options:
