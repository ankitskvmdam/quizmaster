  - slug: cgl-2019-06-06-s2-q010
    difficulty: medium
    stem: |-
      Select the number-pair in which the two numbers are related in the same way as are the two numbers of the following number-pair.

      28 : 63
    options:
      A: "16 : 36"
      B: "36 : 78"
      C: "12 : 28"
      D: "48 : 98"
    answer: A
    explanation: "28 : 63 = 4 × 7 : 9 × 7 (ratio 4 : 9); 16 : 36 = 4 × 4 : 9 × 4 is also 4 : 9."
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q012
    difficulty: medium
    stem: ₹820 is divided among 6 men, 8 women and 12 boys in such a way that every woman gets an amount equal to that received by one man and one boy combined and that every man gets one and a half times the amount received by a boy. What is the total amount received by 8 women?
    options:
      A: ₹400
      B: ₹300
      C: ₹240
      D: ₹380
    answer: A
    explanation: |-
      Let a boy get b. Then a man gets 1.5b and a woman gets 2.5b, so 9b + 20b + 12b = 41b = 820 and b = 20.
      The 8 women get 8 × 2.5 × 20 = ₹400.
    tags:
      - reasoning
