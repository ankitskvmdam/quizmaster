      B: 70.14 kg
      C: 71.28 kg
      D: 69.68 kg
    answer: C
    explanation: Volume = (22/7) × (2.5² − 1.5²) × 756 = 9504 cm³. Weight = 9504 × 7.5 g = 71.28 kg.
