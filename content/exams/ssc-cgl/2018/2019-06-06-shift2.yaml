  - slug: cgl-2019-06-06-s2-q025
    difficulty: medium
    stem: |-
      How many triangles are there in the following figure?

      *(Figure: A top horizontal line. From its left end a line runs to a bottom-right point; from its right end a line runs to a bottom-left point. From the midpoint of the top line, lines run to the bottom-left and bottom-right points, and a vertical line runs from the midpoint down to the crossing point of the first two lines.)*
    options:
      A: "12"
      B: "13"
      C: "11"
      D: "15"
    answer: D
    explanation: "The figure has six lines: the top line, the two long crossing diagonals, the two lines from the top midpoint and the vertical. Counting every set of three lines that meet in three separate points gives 15 triangles."
    tags:
      - reasoning
