    explanation: They meet after 800 / (40 + 60) = 8 hours, when X has gone 40 × 8 = 320 km from A.
    tags:
      - quant
  - slug: cgl-2019-06-06-s2-q055
    difficulty: medium
    stem: "If 2x² + y² + 6x − 2xy + 9 = 0, then the value of (4x³ − y³ + x²y²) is:"
    options:
      A: "0"
      B: "9"
      C: −3
      D: −9
    answer: A
    explanation: |-
      The equation is (x − y)² + (x + 3)² = 0, so x = y = −3.
      Then 4(−27) − (−27) + 81 = 0.
    tags:
      - quant
  - slug: cgl-2019-06-06-s2-q056
    difficulty: medium
    stem: The vertices of a Δ PQR lie on a circle with centre O. SR is a tangent to the circle at the point R. If QR bisects the ∠ORS, then what is the measure of ∠RPQ?
    options:
      A: 60°
      B: 45°
      C: 40°
      D: 30°
    answer: B
    explanation: OR ⊥ SR, so ∠ORS = 90° and ∠QRS = 45°. By the alternate segment theorem, ∠RPQ = ∠QRS = 45°.
    tags:
      - quant
  - slug: cgl-2019-06-06-s2-q057
    difficulty: medium
    stem: In a circle with centre O, ACBO is a parallelogram where C is a point on the minor arc AB. What is the measure of ∠ AOB?
    options:
