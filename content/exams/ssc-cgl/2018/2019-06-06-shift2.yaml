  - slug: cgl-2019-06-06-s2-q060
    difficulty: medium
    stem: The average of twelve numbers is 46. The average of the first four numbers is 43 and that of the last five numbers is 49.4.The 5th and the 6th numbers are respectively 4 and 6 more than the 7th number. What is the average of the 5th and the 7th numbers?
    options:
      A: "43.5"
      B: "43"
      C: "44.5"
      D: "44"
    answer: B
    explanation: |-
      The 5th, 6th and 7th numbers total 552 − 172 − 247 = 133. With the 7th number = n, 3n + 10 = 133, so n = 41 and the 5th is 45.
      Their average is (45 + 41)/2 = 43.
    tags:
      - quant
