      A: (7, 14, 23)
      B: (5, 11, 20)
      C: (23, 30, 40)
      D: (11, 18, 29)
    answer: A
    explanation: 15 → 22 → 31 goes +7, +9; likewise 7 → 14 → 23 goes +7, +9.
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q004
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the gaps of the given letter series will complete the series.

      dc_abc_cb_bcd_ba_c
    options:
      A: dbacb
      B: cbadb
      C: bdacb
      D: bdcab
    answer: C
    explanation: Filling b, d, a, c, b gives dcbabc dcbabc dcbabc, the block 'dcbabc' repeated.
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q006
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

      Happy : Mirthful :: Sad : ?
    options:
      A: Contented
      B: Jolly
      C: Morose
      D: Gleeful
    answer: C
    explanation: Mirthful is a synonym of happy; morose is a synonym of sad.
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q007
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown. Which number will be at the top if 1 is at the bottom?

      *(Figure: Two views of a die. View 1: top 6, front-left 1, front-right 3. View 2: top 4, front-left 3, front-right 2.)*
    options:
      A: "4"
      B: "2"
      C: "6"
      D: "5"
    answer: A
    explanation: |-
      3 is common to both views. Reading each corner in the same rotational order from 3 gives 3-6-1 and 3-2-4, so 6 is opposite 2 and 1 is opposite 4.
      With 1 at the bottom, 4 is on top.
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q008
    difficulty: medium
    stem: |-
      Which number will replace the question mark (?) in the following series?

      2, 3, 6, 10, 17, 28, ?
    options:
      A: "45"
      B: "39"
      C: "43"
      D: "46"
    answer: D
    explanation: The differences are 1, 3, 4, 7, 11, 18, where each difference is the sum of the previous two. So the next term is 28 + 18 = 46.
    tags:
      - reasoning
