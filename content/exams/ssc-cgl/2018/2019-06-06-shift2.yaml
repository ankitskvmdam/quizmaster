questions:
  - slug: cgl-2019-06-06-s2-q001
    difficulty: medium
    stem: In a family of eight persons, there are two couples, each having two children. C and D are cousin brothers. The father of E is married to G, who is the aunt of F. F's mother, H, is married to B, the brother of A. C is the nephew of H. How is A related to D?
    options:
      A: Uncle
      B: Brother
      C: Nephew
      D: Father
    answer: A
    explanation: |-
      G (F's aunt) is married to A, B's brother, so A and G are E's and C's parents, while B and H are the parents of F and D.
      A is the brother of D's father B, so A is D's uncle.
    tags:
      - reasoning
