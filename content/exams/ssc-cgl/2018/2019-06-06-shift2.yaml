    stem: "The efficiencies of A, B and C are in the ratio 5 : 3 : 8. Working together they can complete a work in 30 days. A and B worked together for 20 days. The remaining work will be completed by C alone in:"
    options:
      A: 40 days
      B: 36 days
      C: 30 days
      D: 32 days
    answer: A
    explanation: Work = (5 + 3 + 8) × 30 = 480 units. A and B do 8 × 20 = 160 units, so C (8 units a day) finishes the remaining 320 in 40 days.
    tags:
      - quant
  - slug: cgl-2019-06-06-s2-q052
    difficulty: medium
    stem: "If cos² θ/(cot² θ − cos² θ) = 3, 0° < θ < 90°, then the value of cot θ + cosec θ is:"
    options:
      A: √3
      B: √3/2
      C: 2√3
      D: 3√3/4
    answer: A
    explanation: |-
      cos²θ / (cot²θ − cos²θ) = cos²θ / (cos⁴θ/sin²θ) = tan²θ = 3, so θ = 60°.
      cot 60° + cosec 60° = 1/√3 + 2/√3 = √3.
    tags:
      - quant
  - slug: cgl-2019-06-06-s2-q053
    difficulty: medium
    stem: In Δ ABC with sides 6 cm, 7 cm and 8 cm, the angle bisector of the largest angle divides the opposite side into two segments. What is the length of the shorter segment?
    options:
