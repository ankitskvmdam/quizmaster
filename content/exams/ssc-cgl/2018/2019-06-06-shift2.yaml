  - slug: cgl-2019-06-06-s2-q020
    difficulty: medium
    stem: |-
      Which two signs should be interchanged in the following equation to make it correct?

      12 – 6 ÷ 12 × 6 + 6 = 9
    options:
      A: ÷ and ×
      B: + and ÷
      C: – and +
      D: × and +
    answer: C
    explanation: Swapping − and + gives 12 + 6 ÷ 12 × 6 − 6 = 12 + 3 − 6 = 9.
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q022
    difficulty: medium
    stem: |-
      Two statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      **Statements:**

      Some students are players.  
      Some players are athletes.

      **Conclusions:**

      I. Some students are athletes.  
      II. Some players are students.  
      III. No student is an athlete.
    options:
      A: Only conclusion II and either conclusion I or III follow
      B: None of the conclusions follows
      C: Only conclusion I follows
      D: Only conclusions II and III follow
    answer: A
    explanation: "'Some players are students' is the converse of the first statement, so II follows. I and III form a complementary pair (some / no), so either I or III follows."
    tags:
      - reasoning
  - slug: cgl-2019-06-06-s2-q023
    difficulty: medium
    stem: Three of the following four numbers are alike in a certain way and one is different. Pick the number that is different from the rest.
