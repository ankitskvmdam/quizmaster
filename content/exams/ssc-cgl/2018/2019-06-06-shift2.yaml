    difficulty: medium
    stem: The distance between two stations A and B is 800 km. A train X starts from A and moves towards B at 40 km/h and another train Y starts from B and moves towards A at 60 km/h. How far from A will they cross each other?
    options:
      A: 380 km
      B: 320 km
      C: 300 km
      D: 360 km
