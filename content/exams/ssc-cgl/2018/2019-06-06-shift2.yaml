  - slug: cgl-2019-06-06-s2-q067
    difficulty: medium
    stem: Let a = 2 sin x/(1 + sin x + cos x) and b = c/(1 + sin x). Then a = b, if c = ?
    options:
      A: 1 − sin x cos x
      B: 1 + sin x − cos x
      C: 1 + sin x cos x
      D: 1 + cos x − sin x
    answer: B
    explanation: (1 + sin x − cos x)(1 + sin x + cos x) = (1 + sin x)² − cos²x = 2 sin x (1 + sin x). So c = 1 + sin x − cos x makes a = b.
    tags:
