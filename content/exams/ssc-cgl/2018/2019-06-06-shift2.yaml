    stem: "The length of a metallic pipe is 7.56 m. Its external and internal radii are 2.5 cm and 1.5 cm respectively. If 1 cm³ of the metal weigh 7.5 g, then the weight of the pipe is: (Take π = 22/7)"
    options:
