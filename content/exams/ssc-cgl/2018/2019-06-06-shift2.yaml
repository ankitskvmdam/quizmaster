      B: 100°
      C: 110°
      D: 120°
    answer: D
    explanation: OA = OB, so the parallelogram ACBO is a rhombus. OC is a radius, so triangles OAC and OBC are equilateral and ∠AOB = 60° + 60° = 120°.
