      B: 21/5 cm
      C: 48/13 cm
      D: 56/13 cm
    answer: C
    explanation: "The bisector of the largest angle (opposite the 8 cm side) divides that side in the ratio 6 : 7, giving 48/13 cm and 56/13 cm. The shorter segment is 48/13 cm."
    tags:
      - quant
