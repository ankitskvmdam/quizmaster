    difficulty: medium
    stem: |-
      The Table shows the number of cars sold by three showrooms over a period of six years.

      **Year**

      | Showroom | 2011 | 2012 | 2013 | 2014 | 2015 | 2016 |
      |---|---|---|---|---|---|---|
      | A | 500 | 480 | 520 | 620 | 650 | 630 |
      | B | 450 | 420 | 530 | 480 | 520 | 400 |
      | C | 400 | 450 | 460 | 520 | 540 | 430 |

      If the total number of cars sold by all three showrooms over the years is represented as a pie-chart, what is the central angle of the sector representing the total number of cars sold in the year 2013 (to the nearest whole number)?
    options:
      A: 58°
      B: 62°
      C: 60°
      D: 56°
    answer: C
    explanation: |-
      Grand total = 3400 + 2800 + 2800 = 9000. In 2013: 520 + 530 + 460 = 1510.
      Angle = 1510/9000 × 360° = 60.4° ≈ 60°.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q063
    difficulty: medium
    stem: The price of sugar is increased by 17%. A person wants to increase his expenditure by 5% only. By approximately what percent should he decrease his consumption?
