  - slug: cgl-2019-06-13-s2-q018
    difficulty: medium
    stem: |-
      How many triangles are there in the following figure?

      *(Figure: A parallelogram-like shape: a large triangle stands on the right part of the base with its apex at the top edge; the left part is a slanted strip cut by two lines from the top edge, plus a line from the top-left corner to the triangle's right side; the triangle has a vertical line from apex to base and two horizontal lines across its lower half.)*
    options:
      A: "20"
      B: "18"
      C: "16"
      D: "22"
    answer: B
    explanation: |-
      Right triangle: the apex with each of the 3 levels (two horizontals and the base) gives left half, right half and whole = 9.
      Left triangle: at its top-left corner, each of the two short lines and the far side, cut by the line from that corner, gives 3 triangles = 9. Total 18.
    tags:
      - reasoning
