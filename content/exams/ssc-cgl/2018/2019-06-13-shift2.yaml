  - slug: cgl-2019-06-13-s2-q068
    difficulty: medium
    stem: "ΔABC~ΔNLM and ar(ΔABC) : ar(ΔLMN) = 4 : 9. If AB = 6 cm, BC = 8 cm and AC =12 cm, then ML is equal to:"
    options:
      A: 18 cm
      B: 9 cm
      C: 6 cm
      D: 12 cm
    answer: D
    explanation: "The area ratio 4 : 9 gives a side ratio 2 : 3. ML corresponds to BC, so ML = 8 × 3/2 = 12 cm."
