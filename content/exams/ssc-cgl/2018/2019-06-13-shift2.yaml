  - slug: cgl-2019-06-13-s2-q002
    difficulty: medium
    stem: |-
      ‘A + B’ means ‘A is the sister of B’  
      ‘A – B’ means ‘A is the daughter of B’  
      ‘A × B’ means ‘A is the brother of B’  
      ‘A ÷ B’ means ‘A is the husband of B’

      If V + U × Q – T ÷ R + P × S, then how is P related to V?
    options:
      A: Paternal uncle
      B: Maternal aunt
      C: Maternal uncle
      D: Paternal aunt
    answer: C
    explanation: |-
      V is U's sister, U is Q's brother, Q is T's daughter, T is R's husband, so R is V's mother.
      R is P's sister and P is S's brother, so P is a male sibling of V's mother: maternal uncle.
    tags:
      - reasoning
  - slug: cgl-2019-06-13-s2-q003
    difficulty: medium
    stem: |-
      Two statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      **Statements:**

      All utensils are spoons.  
      All bowls are spoons.

      **Conclusions:**

      I. No utensil is a bowl.  
      II. Some utensils are bowls.  
      III. No spoon is a utensil.
    options:
      A: Only conclusions I follows
      B: Conclusions I and III follow
      C: Either conclusion I or II follows
      D: Only conclusion III follows
    answer: C
    explanation: |-
      Both utensils and bowls lie inside spoons, but nothing links utensils with bowls.
      So neither I nor II is certain, yet they form a complementary pair: either I or II follows. III is false.
    tags:
      - reasoning
  - slug: cgl-2019-06-13-s2-q005
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown here. Which number is on the face opposite the face showing ‘5’?

      *(Figure: Three views of one dice (top; front-left; front-right): (6; 2, 4), (4; 2, 1), (5; 6, 4).)*
    options:
      A: "1"
      B: "3"
      C: "2"
      D: "6"
    answer: C
    explanation: |-
      4 touches 6, 2, 1 and 5, so 4 is opposite 3. 6 touches 2, 4 and 5, so 6 is opposite 1.
      That leaves 2 opposite 5.
    tags:
      - reasoning
  - slug: cgl-2019-06-13-s2-q007
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      12 : 192 :: 15 : ?
    options:
      A: "245"
      B: "240"
      C: "225"
      D: "250"
    answer: B
    explanation: "192 = 12 × 16, so the rule is ×16: 15 × 16 = 240."
    tags:
      - reasoning
  - slug: cgl-2019-06-13-s2-q008
    difficulty: medium
    stem: The sum of the current ages of Shipra and Malini is 65 years. After 5 years, Shipra’s age will be 15 years more than Malini’s age. What is Malini’s current age?
    options:
      A: 25 years
      B: 30 years
      C: 15 years
      D: 20 years
    answer: A
    explanation: The age gap stays the same, so S − M = 15 and S + M = 65. Hence M = (65 − 15)/2 = 25 years.
    tags:
      - reasoning
