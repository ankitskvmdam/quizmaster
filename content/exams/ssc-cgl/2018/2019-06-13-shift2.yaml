  - slug: cgl-2019-06-13-s2-q071
    difficulty: medium
    stem: What is the value of x so that the seven digit number 8439x53 is divisible by 99?
    options:
      A: "9"
      B: "4"
      C: "3"
      D: "6"
    answer: B
    explanation: |-
