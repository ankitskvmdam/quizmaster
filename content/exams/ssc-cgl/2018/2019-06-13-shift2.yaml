    stem: An article is sold for ₹288 after successive discounts of 25% and x%. If the marked price of the article is ₹480, what is the value of x?
    options:
      A: "20"
      B: "16"
      C: "15"
      D: "18"
    answer: A
    explanation: After 25% off, 480 becomes 360. 288/360 = 0.8, so the second discount is 20%.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q054
    difficulty: medium
    stem: In a class of 50 students, 40% are girls. The average marks of the whole class are 64.4 and the average of the boys’ marks is 62. What is the average marks of the girls?
    options:
      A: "67"
      B: "66.8"
      C: "66.4"
      D: "68"
    answer: D
    explanation: |-
      20 girls and 30 boys. Total marks = 50 × 64.4 = 3220; boys = 30 × 62 = 1860.
      Girls' average = (3220 − 1860)/20 = 68.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q055
    difficulty: medium
    stem: "If 2sinθ = 5cosθ, then (sinθ + cosθ)/(sinθ − cosθ) is equal to:"
    options:
      A: 5/3
      B: 9/5
      C: 2/3
      D: 7/3
    answer: D
    explanation: "tanθ = 5/2. Divide by cosθ: (tanθ + 1)/(tanθ − 1) = (7/2)/(3/2) = 7/3."
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q056
    difficulty: medium
    stem: "The efficiencies of A, B and C are in the ratio of 5 : 3 : 2. Working together, they can complete a task in 21 hours. In how many hours will B alone complete 40% of that task?"
    options:
      A: "28"
      B: "24"
      C: "35"
      D: "21"
    answer: A
    explanation: Work = (5 + 3 + 2) × 21 = 210 units. 40% of it is 84 units; B does 3 units an hour, so 84/3 = 28 hours.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q057
    difficulty: medium
    stem: "The value of sin²32° + sin²58° − sin30° + sec²60° is equal to:"
    options:
      A: "5.5"
      B: "3.5"
      C: "4.5"
      D: "4"
    answer: C
    explanation: sin²32° + sin²58° = sin²32° + cos²32° = 1. So the value is 1 − 1/2 + 2² = 4.5.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q058
    difficulty: medium
    stem: "If a + b + c = 10 and ab + bc + ca = 32 then a³ + b³ + c³ − 3abc is equal to:"
    options:
      A: "50"
      B: "40"
      C: "60"
      D: "70"
    answer: B
    explanation: a³ + b³ + c³ − 3abc = (a + b + c)[(a + b + c)² − 3(ab + bc + ca)] = 10 × (100 − 96) = 40.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q059
    difficulty: medium
    stem: "If a − b = 5 and ab = 6, then (a³ − b³) is equal to:"
    options:
      A: "225"
      B: "155"
      C: "90"
      D: "215"
    answer: D
    explanation: a³ − b³ = (a − b)³ + 3ab(a − b) = 125 + 3 × 6 × 5 = 215.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q060
    difficulty: medium
    stem: "In a circle with centre O, an arc ABC subtends an angle of 110° at the centre of the circle. The chord AB is produced to a point P. Then ∠CBP is equal to:"
    options:
      A: 60°
      B: 55°
      C: 65°
      D: 70°
    answer: B
    explanation: |-
      Arc ABC (through B) is 110°, so the other arc AC is 250° and the inscribed angle ∠ABC = 125°.
      ∠CBP = 180° − 125° = 55°.
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q061
    difficulty: medium
    stem: In a circle of radius 17 cm, a chord is at a distance of 8 cm from the centre of the circle. What is the length of the chord?
    options:
      A: 20 cm
      B: 15 cm
      C: 25 cm
      D: 30 cm
    answer: D
    explanation: Half-chord = √(17² − 8²) = √225 = 15, so the chord is 30 cm.
    tags:
      - quant
