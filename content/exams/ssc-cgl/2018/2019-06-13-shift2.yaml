      A: "3 : 4"
      B: "2 : 3"
      C: "5 : 8"
      D: "5 : 7"
    answer: D
    explanation: "3(5a − 3b) = 2(4a − 2b) gives 15a − 9b = 8a − 4b, so 7a = 5b and a : b = 5 : 7."
