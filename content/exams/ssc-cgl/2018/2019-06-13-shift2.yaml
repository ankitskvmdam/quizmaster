    stem: "In ΔABC, P is a point on BC such that BP : PC = 4 : 11. If Q is the midpoint of BP, then ar(ΔABQ) : ar(ΔABC) is equal to:"
    options:
      A: "2 : 11"
      B: "2 : 15"
      C: "3 : 13"
      D: "2 : 13"
    answer: B
    explanation: "BQ = BP/2 = (4/15)BC/2 = (2/15)BC. Triangles with the same apex A have areas in the ratio of their bases, so the ratio is 2 : 15."
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q052
    difficulty: medium
    stem: "If √x + 1/√x = √6, then x² + 1/x² is equal to:"
    options:
      A: "18"
      B: "14"
      C: "16"
      D: "12"
    answer: B
    explanation: "Squaring: x + 1/x + 2 = 6, so x + 1/x = 4. Then x² + 1/x² = 4² − 2 = 14."
    tags:
      - quant
  - slug: cgl-2019-06-13-s2-q053
