  - slug: cgl-2019-06-11-s1-q067
    difficulty: medium
    stem: "Chords AB and CD of a circle, when produced, meet at a point P outside the circle. If AB = 6 cm, CD = 3 cm and PD = 5 cm, then PB is equal to:"
    options:
      A: 6 cm
      B: 6.25 cm
      C: 5 cm
      D: 4 cm
    answer: D
    explanation: "By the secant rule PB × PA = PD × PC: PB(PB + 6) = 5 × 8 = 40, so PB = 4 cm."
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q068
    difficulty: medium
    stem: A is 40% more efficient than B and C is 20% less efficient than B. Working together, they can finish a task in 15 days. In how many days, will B alone complete 75% of the task?
    options:
      A: "36"
      B: "48"
      C: "32"
      D: "44"
    answer: A
    explanation: With B = 1 unit/day, A = 1.4 and C = 0.8, so work = 3.2 × 15 = 48 units. B does 75% (36 units) in 36 days.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q069
    difficulty: medium
    stem: "In a circle with centre O, AB is the diameter and CD is a chord such that ABCD is a trapezium. If ∠BAC = 25°, then ∠CAD is equal to:"
    options:
      A: 45°
      B: 65°
      C: 40°
      D: 25°
    answer: C
    explanation: ∠ACB = 90° (angle in a semicircle), so ∠ABC = 65°. In the isosceles trapezium ∠DAB = ∠ABC = 65°, so ∠CAD = 65° − 25° = 40°.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q070
