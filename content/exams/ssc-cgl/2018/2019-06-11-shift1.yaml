title: SSC CGL 2018 Tier 1
date: 2019-06-11
label: 11 Jun, Shift 1
source: "SSC candidate response sheet with the official answer marked (via https://www.adda247.com/jobs/wp-content/uploads/sites/22/2025/06/04132653/SSC-CGL-QUESTION-PAPER-11-June-2019-Shift-1-En). Left out (picture-only options or incomplete in the source): Q5, Q9, Q14, Q15, Q17, Q24, Q25."
questions:
  - slug: cgl-2019-06-11-s1-q001
    difficulty: medium
    stem: Priyank is Akshay’s brother. Sonia is Saksham’s sister. Akshay is Sonia’s son. How is Priyank related to Sonia?
    options:
      A: Nephew
      B: Father
      C: Son
      D: Brother
    answer: C
    explanation: Akshay is Sonia's son, and Priyank (a brother, so male) is Akshay's brother, so Priyank is also Sonia's son.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q002
    difficulty: medium
    stem: At a party, the number of girls is half the number of boys. After an hour, five boys leave the party and three girls join the party. How many people were present at the party an hour before?
    options:
      A: "16"
      B: "8"
      C: "24"
      D: "22"
    answer: C
    explanation: If boys = b and girls = b/2, and after the change b − 5 = b/2 + 3, then b = 16 and girls = 8, so 24 people were there at first.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q003
    difficulty: medium
    stem: Three of the following four words are alike in a certain way and one is different. Pick the odd word out.
    options:
      A: Thorium
      B: Uranium
      C: Radium
      D: Sodium
    answer: D
    explanation: Thorium, uranium and radium are radioactive elements; sodium is not.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q004
    difficulty: medium
    stem: |-
      Select the word pair in which the two words are related in the same way as the two words in the following word-pair.

      Brass : Copper
    options:
      A: "Chromium : Silver"
      B: "Bronze : Gold"
      C: "Nickle : Iron"
      D: "Solder : Tin"
    answer: D
    explanation: Brass is an alloy whose main metal is copper; solder is an alloy based on tin.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q006
    difficulty: medium
    stem: |-
      Select the terms that will replace the ? in the following series.

      Z, X, V, ?, R, P, ?
    options:
      A: S, N
      B: S, O
      C: T, O
      D: T, N
    answer: D
    explanation: "The letters go back two places each time: Z, X, V, T, R, P, N."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q007
    difficulty: medium
    stem: |-
      Arrange the following words in a logical and meaningful order.

      1) Write
      2) Publish
      3) Author
      4) Reader
      5) Sale
    options:
      A: 3, 1, 2, 5, 4
      B: 4, 3, 1, 2, 5
      C: 3, 2, 1, 5, 4
      D: 1, 3, 2, 5, 4
    answer: A
    explanation: "An author writes, the book is published and sold, and then it is read: 3, 1, 2, 5, 4."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q008
    difficulty: medium
    stem: |-
      Select the term that will come next in the following series.

      OBE, PDH, QFK, RHN, ?
    options:
      A: SKQ
      B: RJQ
      C: SJQ
      D: SJP
    answer: C
    explanation: "The 1st letters go +1 (O-P-Q-R-S), the 2nd +2 (B-D-F-H-J) and the 3rd +3 (E-H-K-N-Q): SJQ."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q010
    difficulty: medium
    stem: |-
      Which two signs should be interchanged in the following equation to make it correct?

      24 ÷ 8 – 5 × 5 + 3 = 13
    options:
      A: × and –
      B: × and +
      C: ÷ and ×
      D: ÷ and +
    answer: B
    explanation: Swapping × and + gives 24 ÷ 8 − 5 + 5 × 3 = 3 − 5 + 15 = 13.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q011
    difficulty: medium
    stem: |-
      Three different positions of a dice are shown below. Which number appears on the face opposite the number 6?

      *(Figure: Dice 1: top 4, front 3, right 6. Dice 2: top 3, front 5, right 2. Dice 3: top 1, front 5, right 4.)*
    options:
      A: "1"
      B: "2"
      C: "4"
      D: "5"
    answer: D
    explanation: 5 appears next to 3, 2, 1 and 4 across the dice, so the only face left opposite 5 is 6.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q012
    difficulty: medium
    stem: If AU = 21 and EGG = 245, then how will you code BAKE?
    options:
      A: "19"
      B: "75"
      C: "110"
      D: "155"
    answer: C
    explanation: "The code is the product of the letters' positions: AU = 1 × 21, EGG = 5 × 7 × 7. BAKE = 2 × 1 × 11 × 5 = 110."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q013
    difficulty: medium
    stem: ‘Cheerful’ is related to ‘Sad’ in the same way as ‘Generous’ is related to ______.
    options:
      A: Gloomy
      B: Kind
      C: Selfish
      D: Intelligent
    answer: C
    explanation: Sad is the opposite of cheerful; selfish is the opposite of generous.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q016
    difficulty: medium
    stem: In a code language, NEEDLE is written as MFDEKF. How will HAMMER be written in the same language?
    options:
      A: GBLNFT
      B: IBLNDS
      C: GALNDS
      D: GBLNDS
    answer: D
    explanation: Letters alternate −1, +1 (N→M, E→F, E→D ...). HAMMER becomes GBLNDS.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q018
    difficulty: medium
    stem: Three of the following four number-pairs are alike in a certain way and one is different. Pick the odd one out.
    options:
      A: 65-101
      B: 26-50
      C: 17-37
      D: 49-82
    answer: D
    explanation: In the other pairs both numbers are a square + 1 (65 = 8² + 1, 101 = 10² + 1). 49 = 7² has no +1.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q019
    difficulty: medium
    stem: |-
      Two statements are given, followed by two conclusions numbered I and II. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      **Statements:**

      All teachers are painters.

      Some painters are rich.

      **Conclusions:**

      I. All painters are teachers.

      II. Some rich are not painters.
    options:
      A: Only conclusion II follows
      B: Neither conclusion I nor II follows
      C: Only conclusion I follows
      D: Either conclusion I or II follows
    answer: B
    explanation: '"All teachers are painters" does not reverse into I, and nothing is said about rich people outside painters, so neither conclusion follows.'
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q020
    difficulty: medium
    stem: |-
      How many triangles are there in the following figure?

      *(Figure: A parallelogram containing a rectangle; the rectangle has a vertical centre line, a horizontal centre line and both diagonals, plus two short horizontal segments above and below the centre forming small triangles with the diagonals.)*
    options:
      A: "16"
      B: "30"
      C: "32"
      D: "22"
    answer: B
    explanation: SSC gives 30. Count the triangles made by the rectangle's diagonals and centre lines, then those formed with the parallelogram's slanting sides.
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q021
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      2139 : 3246 :: 4262 : ______.
    options:
      A: "1461"
      B: "2471"
      C: "2371"
      D: "2483"
    answer: B
    explanation: "Only one option keeps the digit sum the same: 2+1+3+9 = 3+2+4+6 = 15, and 4+2+6+2 = 2+4+7+1 = 14, giving 2471."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q022
    difficulty: medium
    stem: |-
      Select the term that will come next in the following series.

      57, 62, 31, 36, 18, ?
    options:
      A: "34"
      B: "23"
      C: "19"
      D: "36"
    answer: B
    explanation: "The steps alternate +5 and ÷2: 57 → 62 → 31 → 36 → 18 → 23."
    tags:
      - reasoning
  - slug: cgl-2019-06-11-s1-q023
    difficulty: medium
    stem: Three of the following four letter-clusters are alike in a certain way and one is different. Pick the odd one out.
    options:
      A: FGE
      B: NOR
      C: KLJ
      D: YZX
    answer: B
    explanation: FGE, KLJ and YZX are two consecutive letters followed by the letter before the first. NOR breaks this (it would be NOM).
