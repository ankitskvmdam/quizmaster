  - slug: cgl-2019-06-11-s1-q051
    difficulty: medium
    stem: "The difference between the compound interest and simple interest on ₹ x at 8.5% per annum for 2 years is ₹28.90. The value of x is:"
    options:
      A: "3500"
      B: "3800"
      C: "4000"
      D: "4500"
    answer: C
    explanation: For 2 years, CI − SI = P(r/100)², so x × 0.085² = 28.90 and x = ₹4,000.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q052
    difficulty: medium
    stem: "If cot θ = 3/4, then sin θ + cos θ − tan θ is equal to:"
    options:
      A: −1/20
      B: 2/15
      C: 1/20
      D: 1/15
    answer: D
    explanation: cot θ = 3/4 gives tan θ = 4/3, sin θ = 4/5 and cos θ = 3/5. So 4/5 + 3/5 − 4/3 = 21/15 − 20/15 = 1/15.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q053
    difficulty: medium
    stem: |-
      The following table indicates the number of students studying in three disciplines in five colleges:

      | Disciplines \ Colleges | A | B | C | D | E |
      |---|---|---|---|---|---|
      | Science | 300 | 350 | 275 | 400 | 275 |
      | Commerce | 250 | 400 | 325 | 275 | 250 |
      | Economics | 400 | 450 | 250 | 300 | 500 |

      What is the ratio of the total number of students studying in the science stream to that of studying in commerce stream in all five colleges taken together?
    options:
      A: "16 : 15"
      B: "16 : 19"
      C: "14 : 15"
      D: "19 : 15"
    answer: A
    explanation: "Science total = 1600 and commerce total = 1500, so the ratio is 16 : 15."
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q054
    difficulty: medium
    stem: |-
      The following table indicates the number of students studying in three disciplines in five colleges:

      | Disciplines \ Colleges | A | B | C | D | E |
      |---|---|---|---|---|---|
      | Science | 300 | 350 | 275 | 400 | 275 |
      | Commerce | 250 | 400 | 325 | 275 | 250 |
      | Economics | 400 | 450 | 250 | 300 | 500 |

      What percentage of total students are studying in the commerce stream in all five colleges together?
    options:
      A: 28%
      B: 30%
      C: 32%
      D: 33%
    answer: B
    explanation: Total students = 1600 + 1500 + 1900 = 5000; commerce is 1500/5000 = 30%.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q055
    difficulty: medium
    stem: "If a : b = 5 : 3, then (8a − 5b) : (8a + 5b) is equal to:"
    options:
      A: "3 : 13"
      B: "2 : 5"
      C: "3 : 11"
      D: "5 : 11"
    answer: D
    explanation: "Put a = 5, b = 3: (40 − 15) : (40 + 15) = 25 : 55 = 5 : 11."
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q056
    difficulty: medium
    stem: The average marks of 45 students was found to be 66. If the marks of two students were incorrectly entered as 28 and 64 instead of 82 and 46 respectively, then what is the correct average?
    options:
      A: "67.2"
      B: "66.8"
      C: "66.4"
      D: "66.6"
    answer: B
    explanation: The correct marks (82 + 46 = 128) exceed the entered ones (28 + 64 = 92) by 36, so the average rises by 36/45 = 0.8, to 66.8.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q057
    difficulty: medium
    stem: "If √x + 1/√x = √6, then x² + 1/x² is equal to:"
    options:
      A: "62"
      B: "14"
      C: "16"
      D: "36"
    answer: B
    explanation: Squaring gives x + 1/x + 2 = 6, so x + 1/x = 4 and x² + 1/x² = 16 − 2 = 14.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q058
    difficulty: medium
    stem: The price of sugar is increased by 22%. A person wants to increase his expenditure by 12% only. By what percent should he decrease his consumption, nearest to one decimal place?
    options:
      A: 10%
      B: 7.8%
      C: 8.2%
      D: 8.6%
    answer: C
    explanation: Consumption factor = 1.12/1.22 ≈ 0.918, so consumption falls by about 8.2%.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q059
    difficulty: medium
    stem: An article is sold for ₹657.90 after successive discounts of 15% and 10%. What is the marked price of the article?
    options:
      A: ₹920
      B: ₹860
      C: ₹900
      D: ₹880
    answer: B
    explanation: MP × 0.85 × 0.90 = 0.765 MP = 657.90, so MP = ₹860.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q060
    difficulty: medium
    stem: The radii of two circular faces of the frustum of a cone of height 21 cm are 3 cm and 2 cm respectively. What is the volume of the frustum of the cone in cm³ (π = 22/7)?
    options:
      A: "154"
      B: "286"
      C: "345"
      D: "418"
    answer: D
    explanation: V = (πh/3)(R² + r² + Rr) = (22/7)(21/3)(9 + 4 + 6) = 22 × 19 = 418 cm³.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q061
    difficulty: medium
    stem: |-
      The value of:

      2.8 + (5.2 ÷ 1.3 × 2) – 6 × 3 ÷ 8 + 2
    options:
      A: "6.45"
      B: "4.55"
      C: "8.45"
      D: "10.55"
    answer: D
    explanation: 5.2 ÷ 1.3 × 2 = 8 and 6 × 3 ÷ 8 = 2.25, so 2.8 + 8 − 2.25 + 2 = 10.55.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q062
    difficulty: medium
    stem: "The value of sec²28° − cot²62° + sin²60° + cosec²30° is equal to:"
    options:
      A: 7/2
      B: "3"
      C: 19/4
      D: 23/4
    answer: D
    explanation: cot 62° = tan 28°, so sec²28° − tan²28° = 1. Then 1 + 3/4 + 4 = 23/4.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q063
    difficulty: medium
    stem: Two articles are sold for ₹10,005 each. On one, the seller gains 15% and on the other, he loses 13%. What is his overall gain or loss percent, correct to two decimal places?
    options:
