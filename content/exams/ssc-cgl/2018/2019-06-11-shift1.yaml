      B: 1.42% loss
      C: 0.94% loss
      D: 0.94% gain
    answer: C
    explanation: CPs are 10005/1.15 = 8700 and 10005/0.87 = 11500. Total CP = 20,200 and total SP = 20,010, so the loss is 190/20200 ≈ 0.94%.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q064
    difficulty: medium
    stem: "In ΔABC, AD is a median and P is a point on AD such that AP : PD = 3 : 4. Then ar(ΔAPB) : ar(ΔABC) is equal to:"
    options:
      A: "2 : 7"
      B: "3 : 4"
      C: "3 : 7"
      D: "3 : 14"
    answer: D
    explanation: The median gives ar(ABD) = ½ ar(ABC), and AP/AD = 3/7, so ar(APB) = 3/7 × ½ = 3/14 of ABC.
    tags:
      - quant
  - slug: cgl-2019-06-11-s1-q065
    difficulty: medium
    stem: "If a + b + c = 8 and ab + bc + ca = 12, then a³ + b³ + c³ − 3abc is equal to:"
    options:
      A: "192"
      B: "224"
      C: "144"
      D: "400"
    answer: B
    explanation: a³ + b³ + c³ − 3abc = (a + b + c)[(a + b + c)² − 3(ab + bc + ca)] = 8(64 − 36) = 224.
