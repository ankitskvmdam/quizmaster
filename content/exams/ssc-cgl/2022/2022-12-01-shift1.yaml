    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q022
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)

      (20, 6, 4)

      (24, 7, 5)
    options:
      A: (65, 9, 4)
      B: (22, 5, 2)
      C: (40, 8, 5)
      D: (42, 7, 3)
    answer: A
    explanation: "The first number is the difference of the squares of the other two: 6² − 4² = 20 and 7² − 5² = 24. Likewise 9² − 4² = 65."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q023
    difficulty: medium
    stem: |-
      A # B means ‘A is the sister of B’

      A @ B means ‘A is the daughter of B’

      A & B means ‘A is the husband of B’

      A % B means ‘A is the father of B’

      If A % B & C # D @ E, then how is B related to E?
    options:
      A: Brother
      B: Son-in-law
      C: Father
      D: Son
    answer: B
    explanation: C is the sister of D, who is E's daughter, so C is E's daughter. B is C's husband, so B is E's son-in-law.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q024
    difficulty: medium
    stem: If A × B means that A is the brother of B, A – B means that A is the sister of B, A + B means that A is the father of B then which of the following expression shows that P is the paternal aunt of R?
    options:
      A: P – Q × R
      B: P – Q + R
      C: P × Q + R
      D: P + Q – R
    answer: B
    explanation: "P – Q + R: P is the sister of Q and Q is the father of R, so P is R's paternal aunt."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q025
    difficulty: medium
    stem: "Select the odd group of numbers. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g.13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)"
    options:
      A: (7 – 343 – 331)
      B: (6 – 216 – 206)
      C: (5 – 125 – 115)
      D: (4 – 64 – 54)
    answer: A
    explanation: In the other groups the third number is the cube minus 10 (216 − 10 = 206, 125 − 10 = 115, 64 − 10 = 54). For 7 it would be 333, not 331.
