questions:
  - slug: cgl-2022-12-01-s1-q001
    difficulty: medium
    stem: |-
      After interchanging the given two numbers and two signs what will be the values of equation (I) and (II) respectively?

      × and +, 3 and 9

      I. 7 × 9 – 8 ÷ 2 + 3

      II. 4 × 9 – 3 + 8 ÷ 2
    options:
      A: 0, 1
      B: –26, –29
      C: 6, 0
      D: 12, 13
    answer: B
    explanation: After the swaps, I becomes 7 + 3 − 8 ÷ 2 × 9 = 10 − 36 = −26 and II becomes 4 + 3 − 9 × 8 ÷ 2 = 7 − 36 = −29.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q002
    difficulty: medium
    stem: In a certain code language, 'BEHOLD’ is written as 'BDEHLO' and 'INDEED' is written as 'DDEEIN'. How will 'COURSE' be written in that language?
    options:
      A: CEROSU
      B: CEORUS
      C: CEOSUR
      D: CEORSU
    answer: D
    explanation: "The letters of each word are rearranged in alphabetical order: COURSE → CEORSU."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q003
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.

      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)

      Library : Books :: Museum : ?
    options:
      A: Building
      B: Artefacts
      C: People
      D: Gallery
    answer: B
    explanation: A library keeps books; a museum keeps artefacts.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q004
    difficulty: medium
    stem: |-
      Which of the following numbers will replace the question mark (?) in the given series?

      382, 322, 272, 232, 202, ?
    options:
      A: "168"
      B: "150"
      C: "182"
      D: "132"
    answer: C
    explanation: "The differences are −60, −50, −40, −30, so the next is −20: 202 − 20 = 182."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q006
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs to replace the * signs and balance the given equation.

      21 * 4 * 156 * 13 * 11 = 83
    options:
      A: −, ÷, ×, +
      B: ×, +, ÷, −
      C: ×, −, ÷, +
      D: +, ÷, −, ×
    answer: C
    explanation: 21 × 4 − 156 ÷ 13 + 11 = 84 − 12 + 11 = 83.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q007
    difficulty: medium
    stem: |-
      Which of the following letter-clusters will replace the question mark (?) in the given series?

      PK, GT, XC, OL, ?
    options:
      A: GT
      B: HS
      C: EV
      D: FU
    answer: D
    explanation: Each letter moves forward 17 places in the first position (P→G→X→O→F) and 9 places in the second (K→T→C→L→U), giving FU.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q008
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits.)

      (3, 14, 1)

      (4, 36, 2)
    options:
      A: (8, 12, 2)
      B: (5, 81, 4)
      C: (7, 40, 3)
      D: (8, 260, 2)
    answer: D
    explanation: "The middle number is (first³ + third³)/2: (27 + 1)/2 = 14 and (64 + 8)/2 = 36. Likewise (512 + 8)/2 = 260."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q009
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs to sequentially replace the * signs and to balance the given equation.

      12 * 24 * 4 * 2 * 60
    options:
      A: +, ×, ÷, =
      B: −, ×, +, =
      C: +, ×, −, =
      D: +, ÷, ×, =
    answer: A
    explanation: 12 + 24 × 4 ÷ 2 = 12 + 48 = 60.
    tags:
      - reasoning
