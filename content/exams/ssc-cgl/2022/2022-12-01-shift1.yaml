  - slug: cgl-2022-12-01-s1-q012
    difficulty: medium
    stem: |-
      Select the cube that can be formed by folding the given sheet along the lines.

      [Figure: an unfolded sheet of six squares — a vertical column 6, 3, 2, 4 (top to bottom), with 5 attached to the right of 3 and 1 attached to the left of 2. Four cubes are labelled A, B, C, D: A shows 2 on top, 3 in front, 5 on the right; B shows 1 on top, 4 in front, 5 on the right; C shows 2 on top, 6 in front, 5 on the right; D shows 1 on top, 6 in front, 5 on the right.]

      *(Figure: Net: column 6-3-2-4, with 5 right of 3 and 1 left of 2. Cubes (top/front/right): A 2/3/5, B 1/4/5, C 2/6/5, D 1/6/5.)*
    options:
      A: None are possible
      B: Only A and B
      C: Only C and D
      D: Only A
    answer: D
    explanation: In the net, 6 is opposite 2, 3 is opposite 4 and 5 is opposite 1. Cubes B and D show 1 next to 5 and cube C shows 2 next to 6, so only cube A can be formed.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q015
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:

      All cards are boxes.

      All boxes are torches.

      All torches are shoes.

      Conclusions:

      I. All shoes are torches.

      II. All torches are boxes.

      III. All boxes are cards.

      IV. All cards are shoes.
    options:
      A: Only conclusion IV follows
      B: Only conclusions II and III follow
      C: Only conclusions I and II follow
      D: Only conclusion III follows
    answer: A
    explanation: The chain cards ⊂ boxes ⊂ torches ⊂ shoes gives 'All cards are shoes'. The reverse statements (I, II, III) do not follow.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q016
    difficulty: medium
    stem: |-
      In a certain code language, FRUCTUS is coded as 108, and SPRINTER is coded as 119.

      How will MASCULINE be coded in that language?
    options:
      A: "96"
      B: "99"
      C: "97"
      D: "98"
    answer: C
    explanation: |-
      The code is the sum of the letters' alphabet positions (FRUCTUS = 108, SPRINTER = 119).
      MASCULINE = 13 + 1 + 19 + 3 + 21 + 12 + 9 + 14 + 5 = 97.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q017
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions based on those statements. Taking the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. All W are S.

      II. No D is W.

      Conclusion:

      I. Some S are W.

      II. All S are D.

      III. No W is D.
    options:
      A: Only conclusion III follows
      B: Both conclusions I and III follows
      C: Both conclusions I and II follows
      D: All conclusion follows
    answer: B
    explanation: All W are S, so some S are W (I). 'No D is W' is the same as 'No W is D' (III). Nothing gives 'All S are D'.
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q020
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      19 : 324 :: 25 : 576 :: 9 : ?
    options:
      A: "16"
      B: "64"
      C: "88"
      D: "72"
    answer: B
    explanation: "Each number maps to (n − 1)²: 18² = 324, 24² = 576, so 9 → 8² = 64."
    tags:
      - reasoning
  - slug: cgl-2022-12-01-s1-q021
    difficulty: medium
    stem: |-
