      Mob lynching is the act of a group of people murdering a person without due process of law for an (1)_________ infraction. In recent years, mob lynching has become one of the hate (2)_________ that targets persons of a certain identity, members of a minority population, or strangers on the basis of a mere (3)___________. Without obeying any principles of law, the mob takes the law into their own hands to punish the supposed (4)__________ in the name of justice. Mob lynching is a breach of human dignity and a (5)_________ violation of the Universal Declaration of Human Rights, according to Article 21 of the Indian Constitution.

      Select the most appropriate answer to fill in blank 5.
    options:
      A: prevalent
      B: convenient
      C: covert
      D: flagrant
    answer: D
    explanation: A 'flagrant' violation is an obvious and shocking one.
