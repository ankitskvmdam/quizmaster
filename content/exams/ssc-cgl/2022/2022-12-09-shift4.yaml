    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q014
    difficulty: medium
    stem: |-
      A # B means ‘A is the brother of B’

      A @ B means ‘A is the son of B’

      A & B means ‘A is the wife of B’

      A % B means ‘A is the mother of B’

      If A % B & C # D @ E, then how is B related to E?
    options:
      A: Sister
      B: Wife
      C: Daughter
      D: Daughter-in-law
    answer: D
    explanation: A is the mother of B, B is the wife of C, C is the brother of D, and D is the son of E. So C is E's son and B, his wife, is E's daughter-in-law.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q018
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)

      (4, 21, 33)

      (10, 111, 141)
    options:
      A: (13, 45, 97)
      B: (25, 53, 128)
      C: (65, 60, 244)
      D: (24, 52, 128)
    answer: B
    explanation: "Third = second + 3 × first: 21 + 12 = 33 and 111 + 30 = 141. Likewise 53 + 75 = 128."
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q019
    difficulty: medium
    stem: |-
      Which of the following letter-clusters will replace the question mark (?) in the given series?

      ARC, EPF, JNI, PLL, ?
    options:
      A: WJO
      B: QLP
      C: WLQ
      D: QKP
    answer: A
    explanation: Letter 1 moves +4, +5, +6, +7 (A, E, J, P, W), letter 2 moves −2 (R, P, N, L, J) and letter 3 moves +3 (C, F, I, L, O), giving WJO.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q020
    difficulty: medium
    stem: Three of the following letter-clusters are alike in some manner and hence form a group. Which letter-cluster does not belong to that group?
    options:
      A: DOL
      B: MIP
      C: ARI
      D: NEV
    answer: B
    explanation: In DOL, ARI and NEV, the last two letters are opposite letters, whose positions add to 27 (O+L, R+I, E+V). In MIP, I + P = 9 + 16 = 25.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q021
    difficulty: medium
    stem: In a certain code language, 'TEACHER' is written as 'AETCREH' and ‘STUDENT’ is written as ‘UTSDTNE’. How will 'CLASSES' be written in that language?
    options:
      A: ALCSSES
      B: SESSALC
      C: ALCSESS
      D: CLASESS
    answer: A
    explanation: "Reverse the first three letters, keep the middle letter, and reverse the last three letters: CLA-S-SES → ALC-S-SES = ALCSSES."
