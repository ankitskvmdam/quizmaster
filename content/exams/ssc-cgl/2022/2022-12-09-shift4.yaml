    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      81 * 9 + 15 ÷ 3 – 4 = 50
    options:
      A: – and *
      B: + and –
      C: ÷ and –
      D: ÷ and *
    answer: D
    explanation: Swapping ÷ and * gives 81 ÷ 9 + 15 × 3 – 4 = 9 + 45 – 4 = 50.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q023
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions based on those statements. Taking the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. Some A are W.

      II. Some W are C.

      Conclusions:

      I. All A are C.

      II. No C is W.

      III. No W is A.
    options:
      A: Neither conclusion follows
      B: Only conclusion II follows
      C: All conclusion follows
      D: Only conclusion I follows
    answer: A
    explanation: From 'some A are W' and 'some W are C', nothing certain can be said about A and C. The other two conclusions contradict the statements, so none follows.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q024
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      12 : 132 :: 20 : 380 :: 2 : ?
    options:
      A: "8"
      B: "6"
      C: "12"
      D: "2"
    answer: D
    explanation: "Each number is multiplied by the number one less than it: 12 × 11 = 132 and 20 × 19 = 380, so 2 × 1 = 2."
    tags:
      - reasoning
