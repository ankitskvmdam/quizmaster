    stem: |-
      The pie chart given below shows the number of boys in 8 schools. The total number of boys in all these 8 school is 6000. Number of boys in a particular school is shown as a percent of total number of boys in all these 8 schools.

      Which of the following statement is correct?

      I. The difference between number of boys in school M and Q are 1660.

      II. The sum of number of boys in school J, K and L are 2400.

      *(Figure: Pie chart (percent of 6000 boys): J 12%, K 6%, L 22%, M 34%, N 9%, O 7%, P 2%, Q 8%.)*
    options:
      A: Both I and II
      B: Only I
      C: Only II
      D: Neither I nor II
    answer: C
    explanation: M − Q = 34% − 8% = 26% of 6000 = 1560, not 1660, so I is wrong. J + K + L = 40% of 6000 = 2400, so II is right.
    tags:
      - quant
