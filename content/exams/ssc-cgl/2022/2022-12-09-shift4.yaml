questions:
  - slug: cgl-2022-12-09-s4-q001
    difficulty: medium
    stem: In a certain code language, ‘FLOAT’ is written as ‘WONZI’ and ‘TRIBE’ is written as ‘DUHEW’. How will ‘GARDEN’ be written in that language?
    options:
      A: QZQGDJ
      B: QZUHDJ
      C: QZUGDJ
      D: QDUGHJ
    answer: C
    explanation: Swap the first and last letters, then shift each letter by +3 or −1 (TRIBE → ERIBT → DUHEW). In the same way GARDEN → NARDEG → N+3, A−1, R+3, D+3, E−1, G+3 = QZUGDJ.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q002
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)

      (21, 33, 31)

      (42, 17, 26)
    options:
      A: (36, 14, 35)
      B: (46, 19, 24)
      C: (35, 27, 29)
      D: (32, 39, 20)
    answer: A
    explanation: The numbers in each set add up to 85 (21 + 33 + 31 = 42 + 17 + 26 = 85). Only (36, 14, 35) also sums to 85.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q003
    difficulty: medium
    stem: |-
      By interchanging the given two signs and numbers which of the following equation will be correct?

      + and –, 6 and 3
    options:
      A: 8 – 3 × 4 ÷ 6 + 9 = 18
      B: 8 + 4 × 6 ÷ 3 – 9 = 15
      C: 9 ÷ 3 × 4 – 6 + 7 = 10
      D: 6 ÷ 2 × 8 + 3 – 1 = 20
    answer: B
    explanation: After swapping + with – and 6 with 3, option B becomes 8 – 4 × 3 ÷ 6 + 9 = 8 – 2 + 9 = 15.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q004
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word. (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word)

      Pain : Agony :: Anger: ?
    options:
      A: Calm
      B: Rage
      C: Sad
      D: Peace
    answer: B
    explanation: Agony is an extreme form of pain; in the same way, rage is an extreme form of anger.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q006
    difficulty: medium
    stem: |-
      By Interchanging the given two numbers which of the following equation will be correct?

      1 and 9
    options:
      A: 9 × 3 – 4 ÷ 2 + 1 = 10
      B: 1 + 9 × 3 – 4 ÷ 2 = 18
      C: 9 × 2 + 1 – 8 ÷ 4 = 12
      D: 9 – 1 + 6 ÷ 2 × 3 = 7
    answer: A
    explanation: Swapping 1 and 9 in option A gives 1 × 3 – 4 ÷ 2 + 9 = 3 – 2 + 9 = 10, which is correct.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q007
    difficulty: medium
    stem: Which of the following calendars will be the same as the calendar for the year 2009?
    options:
      A: "2025"
      B: "2015"
      C: "2036"
      D: "2042"
    answer: B
    explanation: 2009 is a non-leap year. The odd days from 2009 to 2014 add up to 1+1+1+2+1+1 = 7, so 2015 (also non-leap) starts on the same day and has the same calendar.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q010
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Find the number on the face opposite the face showing ‘3’.

      *(Figure: Figure 1: top 5, front-left 1, front-right 3. Figure 2: top 5, front-left 3, front-right 6. Figure 3: top 1, front-left 5, front-right 4.)*
    options:
      A: "2"
      B: "1"
      C: "4"
      D: "6"
    answer: C
    explanation: 1, 3, 6 and 4 all touch 5, so 2 is opposite 5. The faces touching 3 are 5, 1 and 6, so 3 is opposite the only face left, 4.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q011
    difficulty: medium
    stem: If P ÷ Q means that P is the mother of Q, P – Q means that P is the father of Q, P × Q means that P is the sister of Q, then which of the following expression shows that B is the daughter of A?
    options:
      A: B – A ÷ C
      B: A – B ÷ C
      C: A – B × C
      D: C ÷ B – A
    answer: B
    explanation: In A – B ÷ C, A is the father of B, and B is the mother of C, so B is female. That makes B the daughter of A.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q012
    difficulty: medium
    stem: |-
      Three statements are followed by three conclusions numbered I, II and III. You have to consider these statements to be true, even if they seem to be at variance with commonly known facts. Decide which of the given conclusions logically follow/s from the given statements.

      Statements:

      Some watches are projectors.

      All projectors are lamps.

      Some heaters are watches.

      Conclusions:

      (I) Some heaters are projectors.

      (II) Some lamps are heaters.

      (III) All watches are lamps.
    options:
      A: Only conclusion II follows
      B: None of the conclusions follow
      C: Only conclusion I follows
      D: Either conclusion I or conclusion III follows
    answer: B
    explanation: Projectors overlap watches, but nothing links them to heaters. Lamps need not meet heaters, and only some watches are known to be lamps. So none of the conclusions follows.
    tags:
      - reasoning
  - slug: cgl-2022-12-09-s4-q013
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.

      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)

