    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q013
    difficulty: medium
    stem: |-
      Which of the following letter-clusters will replace the question mark (?) in the given series?

      DBK, GDL, JFM, MHN, ?
    options:
      A: QKN
      B: PKO
      C: PJO
      D: QJO
    answer: C
    explanation: Letter 1 moves +3 (D, G, J, M, P), letter 2 moves +2 (B, D, F, H, J) and letter 3 moves +1 (K, L, M, N, O), giving PJO.
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q015
    difficulty: medium
    stem: If A × B means that A is the brother of B, A – B means that A is the sister of B, A + B means that A is the father of B then which of the following expression shows that P is the father of R?
    options:
      A: P + Q × R
      B: P × Q + R
      C: P + Q ÷ R
      D: P – Q × R
    answer: A
    explanation: In P + Q × R, P is the father of Q and Q is the brother of R, so P is the father of R.
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q016
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions based on those statements. Taking the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. No A is B.

      II. No C is B.

      Conclusion:

      I. Some C are not A.

      II. Some A are B.
    options:
      A: Neither conclusion follows
      B: Only conclusion II follows
      C: Only conclusion I follows
      D: Both conclusions I and II follows
    answer: A
    explanation: "'No A is B' rules out 'Some A are B'. A and C are both outside B but may overlap fully, so 'Some C are not A' is not certain. Neither conclusion follows."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q017
    difficulty: medium
    stem: |-
      By Interchanging the given two numbers which of the following equation will be correct?

      4 and 6
    options:
      A: 4 ÷ 2 + 3 – 6 × 5 = –14
      B: 9 ÷ 3 + 6 × 5 – 4 = 18
      C: 4 × 3 + 6 – 2 ÷ 1 = 21
      D: 4 – 6 ÷ 2 + 3 × 5 = 20
    answer: A
    explanation: Swapping 4 and 6 in option A gives 6 ÷ 2 + 3 – 4 × 5 = 3 + 3 – 20 = –14, which is correct.
    tags:
      - reasoning
