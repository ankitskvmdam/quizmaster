questions:
  - slug: cgl-2022-12-13-s1-q001
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g., 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed).

      (16, 7, 81)

      (24, 16, 64)
    options:
      A: (13, 7, 36)
      B: (48, 39, 18)
      C: (37, 25, 100)
      D: (21, 19, 8)
    answer: A
    explanation: "Third number = (first − second)²: (16 − 7)² = 81 and (24 − 16)² = 64. Likewise (13 − 7)² = 36."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q004
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      68 : 19 :: 76 : 21 :: 164 : ?
    options:
      A: "45"
      B: "39"
      C: "43"
      D: "41"
    answer: C
    explanation: "Second = first ÷ 4 + 2: 68/4 + 2 = 19 and 76/4 + 2 = 21, so 164/4 + 2 = 43."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q005
    difficulty: medium
    stem: In a certain code language, ‘COMMUNITY’ is written as ‘YITUNMCOM’ and ‘AUTHORITY’ is written as ‘YITORHAUT’. How will ‘ISOLATION’ be written in that language?
    options:
      A: NIAOTLISO
      B: NIOATILSO
      C: NIOATLIOS
      D: NIOATLISO
    answer: D
    explanation: "Split the word into three blocks of three letters and write them in reverse order. The last letter of the third block moves to its front, the first block stays as it is, and the first letter of the second block moves to its end: ION → NIO, LAT → ATL, ISO → ISO, giving NIOATLISO."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q006
    difficulty: medium
    stem: In a certain code language ‘BOTTLE’ is written as ‘148’, ‘SIPPER’ is written as ‘166’. How will ‘BUMPER’ be written in that language?
    options:
      A: "160"
      B: "170"
      C: "150"
      D: "180"
    answer: C
    explanation: "Code = 2 × (sum of letter positions): BOTTLE = 2 × 74 = 148, SIPPER = 2 × 83 = 166, BUMPER = 2 × 75 = 150."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q007
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.

      ACCUSED : UCCASDE :: FACTORY : TCAFOYR :: DYNAMIC : ?
    options:
      A: YNMICAD
      B: DNYMACI
      C: ANYDMCI
      D: DANYMIC
    answer: C
    explanation: "Reverse the first four letters and swap the last two: DYNA → ANYD and MIC → MCI, giving ANYDMCI."
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q009
    difficulty: medium
    stem: |-
      A # B means ‘A is the sister of B’.

      A @ B means ‘A is the son of B’.

      A & B means ‘A is the father of B’.

      A % B means ‘A is the mother of B’.

      If W & Q # T & Y @ M % K, then how is Q related to K?
    options:
      A: Mother’s sister
      B: Sister
      C: Father’s sister
      D: Father’s mother
    answer: C
    explanation: W is Q's father, and Q is the sister of T. T is the father of Y, Y is the son of M, and M is the mother of K, so K is T's child. Q is therefore K's father's sister.
    tags:
      - reasoning
  - slug: cgl-2022-12-13-s1-q010
    difficulty: medium
    stem: |-
      Read the given statement(s) and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statement(s).

      Statements:

      Some pencils are rods.

      No rod is a door.

      All balls are rods.

      Conclusions:

      I. Some pencils being balls is a possibility.

      II. No ball is a door.

      III. All rods are balls.

      IV. No pencil is a door.
    options:
      A: Only Conclusions I, II and IV follow
      B: Only Conclusions I and II follow
      C: Only Conclusion I follows
      D: Only Conclusions II and III follow
    answer: B
    explanation: All balls are rods and no rod is a door, so no ball is a door (II). Pencils being balls is possible (I). III and IV do not follow, because pencils that are not rods could be doors.
    tags:
      - reasoning
