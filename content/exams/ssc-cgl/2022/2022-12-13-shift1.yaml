  - slug: cgl-2022-12-13-s1-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the fourth term in the same way as the first term is related to the second term and the fifth term is related to the sixth term.

      16 : 96 :: ? : 161 :: 18 : 120
    options:
      A: "22"
      B: "21"
      C: "20"
      D: "24"
    answer: B
    explanation: "Second = first × (first + 2) ÷ 3: 16 × 18 / 3 = 96 and 18 × 20 / 3 = 120. So 21 × 23 / 3 = 161."
    tags:
      - reasoning
