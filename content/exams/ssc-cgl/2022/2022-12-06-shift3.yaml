questions:
  - slug: cgl-2022-12-06-s3-q003
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.

      OILS : UNLS :: PAIN : PKDT :: QUIK : ?
    options:
      A: MLXU
      B: MKXV
      C: MLYV
      D: MKXU
    answer: D
    explanation: "Reverse the cluster, then add +2, +2, +3, +4: OILS → SLIO → UNLS; PAIN → NIAP → PKDT. QUIK → KIUQ → MKXU."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q004
    difficulty: medium
    stem: |-
      Three statements are given followed by three conclusions numbered I, II and III.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      All javascript are binary.

      All binary are minecraft.

      All roblox are minecraft.

      Conclusions:

      I. Some javascript are roblox.

      II. Some javascript are minecraft.

      III. All javascript are minecraft.
    options:
      A: Only conclusions I and III follow
      B: Only conclusions I and II follow
      C: All conclusions follow
      D: Only conclusions II and III follow
    answer: D
    explanation: All javascript are binary and all binary are minecraft, so all (and hence some) javascript are minecraft. Nothing links javascript to roblox.
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q007
    difficulty: medium
    stem: |-
      Which letter cluster will replace the question mark (?) to complete the given series?

      ZUPK, YTOJ, ?, WRMH, VQLG
    options:
      A: XSNI
      B: XSMI
      C: XSNJ
      D: XTNI
    answer: A
    explanation: "Every letter moves back 1 each step: ZUPK → YTOJ → XSNI → WRMH → VQLG."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q008
    difficulty: medium
    stem: |-
      Which of the following interchange of numbers and signs would make the given equation correct?

      10 − 4 ÷ 20 + 16 × 8 = 16
    options:
      A: 10 and 16, × and ÷
      B: 4 and 8, × and−
      C: 4 and 20, + and ÷
      D: 10 and 20, + and ×
    answer: B
    explanation: "Swapping 4 and 8, and × and −: 10 × 8 ÷ 20 + 16 − 4 = 4 + 16 − 4 = 16."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q009
    difficulty: medium
    stem: |-
      Select the option that is related to the fourth term in the same way as the first term is related to the second term and the fifth term is related to the sixth term.

      47 : 9 :: ? : 14 :: 92 : 18
    options:
      A: "72"
      B: "73"
      C: "37"
      D: "27"
    answer: A
    explanation: "Second = (first − 2)/5: (47 − 2)/5 = 9, (92 − 2)/5 = 18. So ? = 14 × 5 + 2 = 72."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q010
    difficulty: medium
    stem: |-
      If ‘+’ means ‘÷’, ‘–’ means ‘+’, ‘×’ means ‘–’ and ‘÷’ means ‘×’, what will be the value of the following expression?

      [{(32 × 20) - (2 ÷ 3)} + (2 - 4)] ÷ 3
    options:
      A: "8"
      B: "10"
      C: "9"
      D: "6"
    answer: C
    explanation: "After replacing signs: [{(32 − 20) + (2 × 3)} ÷ (2 + 4)] × 3 = (18 ÷ 6) × 3 = 9."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q012
    difficulty: medium
    stem: |-
      Which number will replace the question mark (?) in the following series?

      27, 29, ?, 182, 730, 3652
    options:
      A: "58"
      B: "110"
      C: "122"
      D: "60"
    answer: D
    explanation: "Multiply by 1, 2, 3, 4, 5 and add 2: 27 → 29 → 60 → 182 → 730 → 3652."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q013
    difficulty: medium
    stem: |-
      By Interchanging the given two numbers which of the following equation will be correct?

      1 and 7
    options:
      A: 7 × 2 + 1 – 5 = 6
      B: 1 × 2 – 7 + 8 ÷ 2 = 16
      C: 7 + 1 × 2 – 6 ÷ 3 = 13
      D: 7 + 6 ÷ 3 – 5 × 1 = – 10
    answer: C
    explanation: "Swapping 1 and 7 in C: 1 + 7 × 2 − 6 ÷ 3 = 1 + 14 − 2 = 13."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q014
    difficulty: medium
    stem: |-
      Select the set in which the numbers are NOT related in the same way as are the numbers of the given set.

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)

      (16, 7, 112)
    options:
      A: (18, 3, 54)
      B: (14, 5, 70)
      C: (22, 7, 154)
      D: (26, 5, 132)
    answer: D
    explanation: "The third number is the product of the first two: 16 × 7 = 112. In D, 26 × 5 = 130, not 132."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q015
    difficulty: medium
    stem: |-
      ‘A @ B’ means ‘A is the husband of B’.

      ‘A & B’ means ‘A is the mother of B’.

      ‘A # B’ means ‘B is the daughter of A’.

      If D # E # F & G @ H # I, then how is G related to E?
    options:
      A: Daughter
      B: Son
      C: Father
      D: Daughter’s son
    answer: D
    explanation: E is D's daughter, F is E's daughter, G is F's child and is a husband (male). So G is E's daughter's son.
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q016
    difficulty: medium
    stem: If A + B means that A is the father of B, A –B means that A is the mother of B, A × B means that A is the brother of B then which of the following expression shows that Q is the son of P?
    options:
      A: P – R × Q
      B: Q – P × R
      C: P – Q + R
      D: P – Q × R
    answer: D
    explanation: "P – Q × R: P is the mother of Q and Q is the brother of R, so Q is the son of P."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q017
    difficulty: medium
    stem: |-
      After arranging the given words according to dictionary order, which word will come at ‘Third’ position?

      1. Oblivion

      2. Oblique

      3. Oblige

      4. Oblate

      5. Oblong
    options:
      A: Oblate
      B: Oblique
      C: Oblige
      D: Oblivion
    answer: B
    explanation: "Dictionary order: Oblate, Oblige, Oblique, Oblivion, Oblong. The third word is Oblique."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q018
    difficulty: medium
    stem: |-
      Three of the following four letter-clusters are alike in a certain way and one is different.

      Pick the odd one out.
    options:
      A: IJM
      B: ABE
      C: XYA
      D: EFI
    answer: C
    explanation: IJM, ABE and EFI follow +1, +3 (I J M). XYA is +1, +2 (X Y Z A would need B).
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q019
    difficulty: medium
    stem: "Select the odd group of numbers. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g.13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)"
    options:
      A: 20 – 406
      B: 14 – 200
      C: 10 – 106
      D: 12 – 150
    answer: B
    explanation: "Second = first² + 6: 20² + 6 = 406, 10² + 6 = 106, 12² + 6 = 150. But 14² + 6 = 202, not 200."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q020
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word. (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word)

      Cricket : Pitch :: Badminton : ?
    options:
      A: Track
      B: Field
      C: Court
      D: Pool
    answer: C
    explanation: Cricket is played on a pitch; badminton is played on a court.
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q021
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      12 : 120 :: 20 : 360 :: 3 : ?
    options:
      A: "15"
      B: "32"
      C: "7"
      D: "3"
    answer: D
    explanation: "Second = first × (first − 2): 12 × 10 = 120, 20 × 18 = 360. So 3 × 1 = 3."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q022
    difficulty: medium
    stem: In a certain code language, 'GLAND’ is written as 'GQDOJ' and 'MEANS' is written as 'VQDHP'. How will 'CYSTS' be written in that language?
    options:
      A: VWVCF
      B: FBVWV
      C: UVUAE
      D: VWVBF
    answer: D
    explanation: "Reverse the word, then move each letter +3: GLAND → DNALG → GQDOJ. CYSTS → STSYC → VWVBF."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q024
    difficulty: medium
    stem: In a certain code language, ‘birds are flying’ is coded as '536', ‘the nest is big’ is coded as '3423' and ‘close the door’ is coded as '534'. How will ‘complete your work’ be coded in that language?
    options:
      A: "844"
      B: "484"
      C: "733"
      D: "955"
    answer: A
    explanation: "Each word is coded by its number of letters: birds are flying = 5 3 6. So complete your work = 8 4 4."
    tags:
      - reasoning
  - slug: cgl-2022-12-06-s3-q025
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions based on those statements. Taking the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. No A is D.

      II. All D are E.

      Conclusions:

      I. No D is A.

      II. Some E are D.
    options:
      A: Neither conclusion follows
      B: Both conclusions I and II follows
      C: Only conclusion II follows
      D: Only conclusion I follows
    answer: B
    explanation: '"No A is D" converts to "No D is A", and "All D are E" gives "Some E are D". Both follow.'
    tags:
      - reasoning
