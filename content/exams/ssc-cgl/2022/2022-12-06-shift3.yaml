      A new world research shows that the French (1) ______ large amounts of cheese and butter. Therefore, they have low levels of heart disease. The research (2) ______ that animal fat is good for human body and helps in reducing the risks of heart attack. This study was (3) ______ in 2018 in 21 low and middle income countries. However, it (4) ______ that eating moderately is the (5) ______ key in this regard.

      Select the most appropriate option to fill in blank number 5.
    options:
      A: crucial
      B: diligent
      C: principle
      D: eminent
    answer: A
    explanation: '"Crucial" (decisive) fits "the crucial key".'
