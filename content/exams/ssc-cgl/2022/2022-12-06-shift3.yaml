  - slug: cgl-2022-12-06-s3-q052
    difficulty: medium
    stem: |-
      In the figure, O is the centre of the circle. Its two chords AB and CD intersect each other at the point P within the circle. If AB = 20 cm, PB = 12 cm and CP = 8 cm, then find the measure of PD.

      [Figure: circle with centre O; chord AB from upper-left to lower-right and chord CD from lower-left to upper-right cross at P, just below O]

      *(Figure: Circle with centre O and chords AB and CD crossing at P.)*
    options:
      A: 12 cm
      B: 11 cm
      C: 22 cm
      D: 14 cm
    answer: A
    explanation: "AP = 20 − 12 = 8. Intersecting chords: AP × PB = CP × PD → 8 × 12 = 8 × PD, so PD = 12 cm."
    tags:
      - quant
  - slug: cgl-2022-12-06-s3-q053
    difficulty: medium
    stem: A dealer buys an article listed at ₹3,000 and gets successive discounts of 15% and 15%. He spends ₹250 on transportation and sells it at a profit of 20%. Find the selling price of the article.
    options:
      A: ₹3,300
      B: ₹2,901
      C: ₹3,250
      D: ₹3,200
    answer: B
    explanation: Cost = 3000 × 0.85 × 0.85 + 250 = 2417.5; SP = 2417.5 × 1.2 = ₹2,901.
    tags:
      - quant
  - slug: cgl-2022-12-06-s3-q054
    difficulty: medium
    stem: In a linear race of 1000 m, A beats B by 50 m or 5 seconds. What is the difference between the speeds (in m/s) of A and B?
    options:
      A: 1 10/19
      B: 10/19
      C: 9/19
      D: 9/10
    answer: B
    explanation: B runs 50 m in 5 s, so B = 10 m/s and takes 100 s; A takes 95 s, so A = 200/19 m/s. Difference = 10/19 m/s.
    tags:
