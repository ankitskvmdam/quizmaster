      B: a + b
      C: (a + b)/(a − b)
      D: √(a + b)
    answer: B
    explanation: Product = [(a + b)(a² − ab + b²)/(a − b)] × [(a − b)(a + b)/(a² − ab + b²)] = (a + b)², so the mean proportional is a + b.
