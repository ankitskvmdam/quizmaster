questions:
  - slug: cgl-2022-12-03-s2-q001
    difficulty: medium
    stem: |-
      What should come in place of the question mark (?) to complete the following letter cluster series?

      FHG, IKJ, LNM, ?
    options:
      A: QOP
      B: OPQ
      C: OQP
      D: PRQ
    answer: C
    explanation: Each cluster is +2, −1 from its first letter (F H G, I K J, L N M), and the first letters go F, I, L, O. So the next is O Q P.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q003
    difficulty: medium
    stem: |-
      After arranging the given words according to dictionary order, which word will come at ‘Fifth’ position?

      1. Version

      2. Versus

      3. Versicolour

      4. Verse

      5. Verso
    options:
      A: Verso
      B: Versus
      C: Version
      D: Verse
    answer: B
    explanation: "Dictionary order: Verse, Versicolour, Version, Verso, Versus. The fifth word is Versus."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q004
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs to sequentially replace the * signs and to balance the given equation.

      23 * 2 * 2 * 5 * 18
    options:
      A: −, ÷, ×, =
      B: −, ÷, +, =
      C: −, ÷, =, +
      D: −, ×, ÷, =
    answer: A
    explanation: 23 − 2 ÷ 2 × 5 = 18 → 23 − (1 × 5) = 18, which balances.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q006
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.

      EACH : AEHC :: GAME : AGEM :: IDOL : ?
    options:
      A: OLDI
      B: DILO
      C: IDLO
      D: DIOL
    answer: B
    explanation: "Each pair of letters is swapped: EA CH → AE HC, GA ME → AG EM. So ID OL → DI LO."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q007
    difficulty: medium
    stem: Three of the following letter-clusters are alike in some manner and hence form a group. Which letter-cluster does not belong to that group?
    options:
      A: ANHS
      B: JEQJ
      C: JPRT
      D: PYWD
    answer: C
    explanation: In ANHS, JEQJ and PYWD the 3rd letter is the 1st + 7 and the 4th is the 2nd + 5 (A→H, N→S; P→W, Y→D). In JPRT, J + 7 = Q, not R.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q008
    difficulty: medium
    stem: |-
      By interchanging the given two signs and numbers which of the following equation will be correct?

      × and +, 6 and 4
    options:
      A: 3 × 9 – 4 ÷ 2 + 6 = 8
      B: 8 × 6 + 4 ÷ 2 – 5 = –5
      C: 8 – 3 × 6 + 4 ÷ 1 = 18
      D: 7 × 6 – 4 + 9 ÷ 3 = –7
    answer: D
    explanation: After swapping, D reads 7 + 4 − 6 × 9 ÷ 3 = 11 − 18 = −7, which is correct.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q009
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the given set.

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)

      (26, 120, 34)

      (14, 110, 41)
    options:
      A: (36, 106, 17)
      B: (72, 240, 16)
      C: (44, 114, 24)
      D: (15, 450, 8)
    answer: A
    explanation: "The middle number is twice the sum of the outer numbers: (26 + 34) × 2 = 120, (14 + 41) × 2 = 110. Likewise (36 + 17) × 2 = 106."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q010
    difficulty: medium
    stem: In a certain code language, 'LAPTOP' is written as ‘JYNRMN’ and ‘COLD’ is written as ‘AMJB’, how will 'SKETCHPEN' be written in that language?
    options:
      A: RJDSBHODM
      B: QICRBHODM
      C: QICRAFNCL
      D: RJDSAFNCL
    answer: C
    explanation: "Each letter moves back 2: LAPTOP → JYNRMN. So SKETCHPEN → QICRAFNCL."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q011
    difficulty: medium
    stem: |-
      In the following question below are given some statements followed by some conclusions based on those statements. Taking the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusion logically follows the given statements.

      Statements:

      I. All pencil are pen.

      II. Some pen are rubber.

      Conclusion:

      I. All rubber are pencil.

      II. Some pen are not pencil.

      III. Some rubber are not pen.
    options:
      A: Neither conclusion follows
      B: Only conclusion II follows
      C: Both conclusions I and III follows
      D: All conclusion follows
    answer: A
    explanation: All pencils are pens and some pens are rubbers. Nothing definite follows about rubbers being pencils, pens not being pencils, or rubbers not being pens, so no conclusion follows.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q012
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Find the number on the face opposite the face showing ‘3’.

      [Figure 1: top 2, front-left 3, front-right 6. Figure 2: top 2, front-left 4, front-right 3. Figure 3: top 2, front-left 1, front-right 4.]

      *(Figure: Three views of one die (top / left / right): 2/3/6, 2/4/3, 2/1/4.)*
    options:
      A: "5"
      B: "2"
      C: "1"
      D: "6"
    answer: C
    explanation: "2 is on top in every view, so 3, 6, 4 and 1 are its side faces. Going round: 1, 4, 3, 6. So 3 sits between 4 and 6 and is opposite 1."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q013
    difficulty: medium
    stem: |-
      Which number will replace the question mark (?) in the following series?

      26, 54, 110, 222, ?, 894
    options:
      A: "446"
      B: "442"
      C: "440"
      D: "444"
    answer: A
    explanation: "Each term is ×2 + 2: 26 → 54 → 110 → 222 → 446 → 894."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q014
    difficulty: medium
    stem: If X – Y means that X is the mother of Y, X × Y means that X is the father of Y, X ÷ Y means that X is the sister of Y, then which of the following expression shows that Q is the son of P?
    options:
      A: P – Q ÷ R
      B: P – Q × R
      C: Q – P × R
      D: R × Q – P
    answer: B
    explanation: "P – Q × R: P is the mother of Q, and Q is the father of R, so Q is male. Q is the son of P."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q015
    difficulty: medium
    stem: |-
      A # B means ‘A is the brother of B’

      A @ B means ‘A is the daughter of B’

      A & B means ‘A is the husband of B’

      A % B means ‘A is the wife of B’

      If G % M # L @ P & C @ B, then how is L related to B?
    options:
      A: Daughter
      B: Granddaughter
      C: Sister
      D: Daughter-in-law
    answer: B
    explanation: L is the daughter of P; P is the husband of C, so L is the daughter of C. C is the daughter of B, so L is the granddaughter of B.
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q016
    difficulty: medium
    stem: In a certain code language, 'INNER’ is written as 'SNNWJ' and 'GLASS' is written as 'UPAII'. How will 'MODEL' be written in that language?
    options:
      A: OMXVP
      B: OMXWP
      C: OMWWP
      D: OMXWO
    answer: B
    explanation: "Each letter is replaced by its opposite letter (A↔Z), then moved forward 1: INNER → RMMVI → SNNWJ. MODEL → NLWVO → OMXWP."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q017
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number and the sixth number is related to the fifth number.

      30 : 48 :: 60 : ? :: 45 : 72
    options:
      A: "96"
      B: "92"
      C: "90"
      D: "88"
    answer: A
    explanation: "The second number is 1.6 times the first: 30 × 1.6 = 48, 45 × 1.6 = 72. So 60 × 1.6 = 96."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q019
    difficulty: medium
    stem: "Select the odd group of numbers. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g.13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)"
    options:
      A: 13 – 159
      B: 9 – 71
      C: 5 – 31
      D: 17 – 279
    answer: C
    explanation: "Second = first² − 10: 13² − 10 = 159, 9² − 10 = 71, 17² − 10 = 279. But 5² − 10 = 15, not 31."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q020
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)

      (8, 12, 6)

      (9, 18, 8)
    options:
      A: (4, 12, 6)
      B: (12, 24, 8)
      C: (7, 24, 4)
      D: (9, 10, 11)
    answer: B
    explanation: "First × third = 4 × middle: 8 × 6 = 48 = 4 × 12, 9 × 8 = 72 = 4 × 18. Likewise 12 × 8 = 96 = 4 × 24."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q021
    difficulty: medium
    stem: |-
      Which of the following interchange of numbers and mathematical signs would make the given equation correct?

      72 ÷ 8 × 9 − 36 + 20 = 80
    options:
      A: 20 and 80, × and +
      B: 9 and 36, × and ÷
      C: 36 and 72, ÷ and −
      D: 8 and 9, + and −
    answer: D
    explanation: "Swapping 8 and 9, and + and −: 72 ÷ 9 × 8 + 36 − 20 = 64 + 16 = 80."
    tags:
      - reasoning
  - slug: cgl-2022-12-03-s2-q023
    difficulty: medium
    stem: |-
      Three statements are given, followed by three conclusions numbered I, II and III.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      No student is a teacher.

      All students are children.

      Some girls are students.

      Conclusions:

      I. Some children are not teachers.

      II. Some girls are not teachers.

      III. No girl is a teacher.
    options:
      A: Only conclusions I and II follow
      B: All conclusions follow
      C: Only conclusions II and III follow
      D: Only conclusions I and III follow
    answer: A
    explanation: Some girls are students and no student is a teacher, so some girls (and some children) are not teachers. "No girl is a teacher" does not follow.
    tags:
      - reasoning
