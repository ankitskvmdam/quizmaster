  - slug: cgl-2022-12-03-s2-q054
    difficulty: medium
    stem: |-
      The radii of two cylinders are in the ratio 1 : 4 and their heights are in the ratio 4 : 3.

      Their volumes will be in the ratio ______.
    options:
      A: "1 : 12"
      B: "2 : 9"
      C: "3 : 10"
      D: "1 : 9"
