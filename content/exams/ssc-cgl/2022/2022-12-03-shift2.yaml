      In the following passage some words have been deleted. Fill in the blanks with the help of the alternatives given. Select the most appropriate option for each number.

      Everything we know about non-avian dinosaurs is ________ (1) fossils, which include bones, teeth, footprints, tracks, eggs, and skin impressions. For centuries, people throughout the world have ________ (2) amazing fossilized bones and footprints. Early finds inspired _______ (3) and fairy tales, and people ________ (4) that these bones belonged to ________ (5) or huge monsters.

      Select the most appropriate option to fill in blank number 5.
    options:
      A: spirits
      B: devils
      C: ghosts
      D: giants
    answer: D
    explanation: '"Giants or huge monsters" — the bones were thought to belong to giants.'
