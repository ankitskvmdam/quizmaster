  - slug: cgl-2023-07-18-s2-q052
    difficulty: medium
    stem: If secθ + tanθ = 5, then find the value of tanθ.
    options:
      A: 5/12
      B: 13/5
      C: 13/3
      D: 12/5
    answer: D
    explanation: sec θ − tan θ = 1/5, since sec² − tan² = 1. Then tan θ = (5 − 1/5)/2 = 12/5.
