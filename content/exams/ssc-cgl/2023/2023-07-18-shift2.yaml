questions:
  - slug: cgl-2023-07-18-s2-q001
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.  
      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)  
      Weight : Pounds :: Height : ?
    options:
      A: Dozen
      B: Metres
      C: High
      D: Kilograms
    answer: B
    explanation: Weight is measured in pounds; in the same way, height is measured in metres.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q002
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.  
      55 * 63 * 9 * 8 * 3 = 38
    options:
      A: ÷ × − +
      B: × ÷ + −
      C: + − × ÷
      D: + ÷ − ×
    answer: D
    explanation: 55 + 63 ÷ 9 − 8 × 3 = 55 + 7 − 24 = 38.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q003
    difficulty: medium
    stem: The second number in the given number pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) are followed in all the number pairs except one. Find that odd number pair.
    options:
      A: "81 : 19"
      B: "121 : 23"
      C: "1 : 3"
      D: "64 : 9"
    answer: D
    explanation: "Second = 2 × √first + 1: √81 = 9 → 19, √121 = 11 → 23, √1 = 1 → 3. But √64 = 8 gives 17, not 9."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q004
    difficulty: medium
    stem: F is C's son. C is the only daughter of B. D is A's only son-in-law. B is C's father. A is B's wife. How is D related to F?
    options:
      A: Brother-in-law
      B: Father
      C: Father-in-law
      D: Brother
    answer: B
    explanation: C is the only daughter of A and B, so their only son-in-law, D, is C's husband. F is C's son, so D is F's father.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q006
    difficulty: medium
    stem: |-
      Three statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:  
      All fruits are wines.  
      Some wines are juices.  
      All juices are alcohols.

      Conclusions:  
      I. Some alcohols are juices.  
      II. Some wines are alcohols.  
      III. Some wines are fruits.
    options:
      A: Only conclusions I and II follow
      B: All conclusions follow
      C: Only conclusions I and III follow
      D: Only conclusions II and III follow
    answer: B
    explanation: Some wines are juices and all juices are alcohols, so some wines are alcohols (II) and some alcohols are juices (I). All fruits are wines, so some wines are fruits (III). All three follow.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q007
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.  
      (5, 19, 4)  
      (1, 7, 4)  
      (6, ?, 1)  
      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "7"
      B: "9"
      C: "19"
      D: "13"
    answer: C
    explanation: "Middle = 3 × first + third: 3 × 5 + 4 = 19 and 3 × 1 + 4 = 7, so 3 × 6 + 1 = 19."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q009
    difficulty: medium
    stem: |-
      Select the option that represents the correct order of the given words as they would appear in an English dictionary.  
      1. Believe  
      2. Breathe  
      3. Bereave  
      4. Blight  
      5. Brave  
      6. Banter
    options:
      A: 6, 1, 3, 4, 5, 2
      B: 6, 3, 1, 4, 5, 2
      C: 6, 1, 4, 3, 5, 2
      D: 6, 4, 1, 5, 3, 2
    answer: A
    explanation: "In dictionary order: Banter, Believe, Bereave, Blight, Brave, Breathe, which is 6, 1, 3, 4, 5, 2."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q010
    difficulty: medium
    stem: |-
      Select the word-pair that best represents a similar relationship to the one expressed in the pair of words given below.  
      King : Palace
    options:
      A: "Bee : Honey"
      B: "Nun : Convent"
      C: "Ice : Igloo"
      D: "Horse : Den"
    answer: B
    explanation: A king lives in a palace; in the same way, a nun lives in a convent.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q011
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.  
      (7, 5, 10)  
      (2, 1, 5)  
      (16, 6, ?)  
      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "32"
      B: "50"
      C: "45"
      D: "24"
    answer: B
    explanation: "Third = (first − second) × 5: (7 − 5) × 5 = 10 and (2 − 1) × 5 = 5, so (16 − 6) × 5 = 50."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q012
    difficulty: medium
    stem: |-
      If ‘+’ means ‘subtraction’, ‘−’ means ‘multiplication’, ‘÷’ means ‘addition’ and ‘×’ means ‘division’, then what is the value of the following expression?  
      3 − 21 + 153 × 17 ÷ 26
    options:
      A: "84"
      B: "80"
      C: "76"
      D: "58"
    answer: B
    explanation: Replacing the signs gives 3 × 21 − 153 ÷ 17 + 26 = 63 − 9 + 26 = 80.
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q014
    difficulty: medium
    stem: |-
      Which number should replace the question mark (?) in the following number series?  
      49, 54, 44, 59, ?, 64, 34
    options:
      A: "51"
      B: "36"
      C: "39"
      D: "44"
    answer: C
    explanation: "Two series alternate: 49, 44, ?, 34 falls by 5 each time, so the missing term is 39 (and 54, 59, 64 rises by 5)."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q015
    difficulty: medium
    stem: |-
