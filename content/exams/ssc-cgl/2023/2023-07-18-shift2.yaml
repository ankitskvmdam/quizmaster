  - slug: cgl-2023-07-18-s2-q019
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following set.  
      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)  
      (8, 388, 18)  
      (11, 137, 4)
    options:
      A: (15, 230, 2)
      B: (3, 51, 7)
      C: (10, 118, 9)
      D: (14, 221, 5)
    answer: D
    explanation: "Middle = first² + third²: 8² + 18² = 388 and 11² + 4² = 137. Likewise 14² + 5² = 221."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q021
    difficulty: medium
    stem: In a certain code language, ‘ROSE’ is coded as ‘228’ and TULIP’ is coded as ‘390’. How will ‘LOTUS’ be coded in that language?
    options:
      A: "435"
      B: "425"
      C: "430"
      D: "420"
    answer: A
    explanation: "Code = (sum of letter positions) × (number of letters): ROSE = 57 × 4 = 228, TULIP = 78 × 5 = 390, LOTUS = 87 × 5 = 435."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q023
    difficulty: medium
    stem: In a certain code language, ‘PLACE’ is written as ‘CONHA’ and ‘SHOCK’ is written as ‘QKQNA’. How will ‘FROWN’ be written in that language?
    options:
      A: QUDQU
      B: RVRST
      C: RUSRT
      D: QVQDU
    answer: A
    explanation: Shift the letters by −2, +3, +2, −2, +3, then reverse the first three and swap the last two. FROWN → DUQUQ → QUD + QU = QUDQU (PLACE → NOCAH → CONHA works the same way).
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q024
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.  
      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. For e.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)

      (24, 3, 10)  
      (144, 9, 18)
    options:
      A: (54, 9, 4)
      B: (156, 8, 19)
      C: (72, 8, 9)
      D: (133, 7, 21)
    answer: D
    explanation: "First = second × (third − 2): 3 × 8 = 24 and 9 × 16 = 144. Likewise 7 × 19 = 133."
    tags:
      - reasoning
  - slug: cgl-2023-07-18-s2-q025
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.  
