  - slug: cgl-2023-07-18-s2-q053
    difficulty: medium
    stem: "The ratio of the length of each equal side and the third side of an isosceles triangle is 3 : 5. If the area of the triangle is 30√11 cm², then the length of the third side (in cm) is:"
    options:
      A: 10√6
      B: 5√6
      C: 13√6
      D: 11√6
    answer: A
    explanation: Take the sides as 3k, 3k, 5k. The height = √(9k² − 6.25k²) = (√11/2)k, so the area = (5√11/4)k² = 30√11. That gives k² = 24, so the third side = 5k = 10√6.
    tags:
      - quant
