    tags:
      - quant
  - slug: cgl-2023-07-20-s3-q053
    difficulty: medium
    stem: Supraja and Kausalya can complete a work in 30 days and 20 days, respectively. If Supraja starts the work and they work on alternate days, in how many days will 75% of the work be completed?
    options:
      A: "28"
      B: "24"
      C: "20"
      D: "18"
    answer: D
    explanation: Two days together do 1/30 + 1/20 = 1/12; 75% = 9/12 needs 9 pairs = 18 days.
    tags:
      - quant
  - slug: cgl-2023-07-20-s3-q054
    difficulty: medium
    stem: A and B can do a project in 9 days. B and C can do it in 12 days while C and A can do it in 18 days. In how many days A, B and C all working together, can finish the project?
    options:
      A: "9"
      B: "8"
      C: "11"
      D: "10"
    answer: B
    explanation: 2(A + B + C) = 1/9 + 1/12 + 1/18 = 1/4, so A + B + C = 1/8 per day → 8 days.
    tags:
      - quant
  - slug: cgl-2023-07-20-s3-q055
    difficulty: medium
    stem: In a circle with centre O, PA and PB are the tangents at A and B, respectively, from an external point P. If ∠APB = 24° , then find ∠AOB.
    options:
      A: 158°
      B: 48°
      C: 156°
      D: 180°
    answer: C
    explanation: In quadrilateral OAPB the angles at A and B are 90°, so ∠AOB = 180° − 24° = 156°.
    tags:
      - quant
  - slug: cgl-2023-07-20-s3-q056
    difficulty: medium
    stem: A and B working together can finish a piece of work in 8 days while B alone can do it in 24 days. In how many days can A alone finish the work?
