questions:
  - slug: cgl-2023-07-20-s3-q001
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth term in the same way as the second term is related to the first term and the fourth term is related to the third term.  
      32 : 8 :: 72 : 12 :: 128 : ?
    options:
      A: "18"
      B: "16"
      C: "14"
      D: "15"
    answer: B
    explanation: "Second term = √(2 × first): √64 = 8, √144 = 12, so √256 = 16."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q002
    difficulty: medium
    stem: |-
      In this question, three statements are given, followed by two conclusions numbered I and II. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusion(s) logically follows/follow from the statements.

      Statements:  
      All cricketers are wealthy.  
      Some wealthy are Indians.  
      All Indians are honest.

      Conclusions:  
      I. All Indians are cricketers.  
      II. Some cricketers are honest.
    options:
      A: Only conclusion II follows.
      B: Only conclusion I follows.
      C: Neither conclusions I nor II follows.
      D: Both conclusions I and II follow.
    answer: C
    explanation: Cricketers and Indians are linked only through "some wealthy", so neither "all Indians are cricketers" nor "some cricketers are honest" is certain.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q003
    difficulty: medium
    stem: |-
      If ‘+’ means ‘subtraction’, ‘−’ means ‘multiplication’, ‘÷’ means ‘addition’ and ‘×’ means ‘division’, then what is the value of the following expression?  
      23 − 31 + 135 × 15 ÷ 16
    options:
      A: "698"
      B: "794"
      C: "680"
      D: "720"
    answer: D
    explanation: Swapping the signs gives 23 × 31 − 135 ÷ 15 + 16 = 713 − 9 + 16 = 720.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q004
    difficulty: medium
    stem: P, M, Z, A and L are part of a five-member family and all except L are females. Z and L are in a marital relationship and P, M and A are their children. How is M related to Z?
    options:
      A: Granddaughter
      B: Wife
      C: Mother
      D: Daughter
    answer: D
    explanation: Z is a female married to L, and M (a female) is their child, so M is Z's daughter.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q005
    difficulty: medium
    stem: |-
      Which number should replace the question mark (?) in the following number series?  
      5475, 1100, 225, 50, ?, 8, 6.6
    options:
      A: "30"
      B: "15"
      C: "20"
      D: "25"
    answer: B
    explanation: "Each term = previous ÷ 5 + 5: 50 ÷ 5 + 5 = 15 (then 15 ÷ 5 + 5 = 8)."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q007
    difficulty: medium
    stem: In a certain code language, ‘BACKED’ is coded as ‘GHNFDE’ and ‘CLOSER’ is coded as ‘UHVROF’. How will ‘JUNIOR’ be coded in the same language?
    options:
      A: VSNRYN
      B: TRMQYM
      C: USMRYN
      D: URLQXM
    answer: D
    explanation: "Reverse the word and shift each letter +3: BACKED → DEKCAB → GHNFDE; JUNIOR → ROINUJ → URLQXM."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q008
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.  
      (4, 2, 18)  
      (1, 7, 24)  
      (5, 4, ?)  
      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "19"
      B: "27"
      C: "18"
      D: "24"
    answer: B
    explanation: "(first + second) × 3: (4 + 2) × 3 = 18, (1 + 7) × 3 = 24, so (5 + 4) × 3 = 27."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q009
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs to sequentially replace the * signs and to balance the given equation.  
      16 * 31 * 18 * 2 * 11 * 494
    options:
      A: −, ×, +, ÷, =
      B: ÷, +, −, ×, =
      C: +, −, ÷, ×, =
      D: ×, +, ÷, −, =
    answer: D
    explanation: 16 × 31 + 18 ÷ 2 − 11 = 496 + 9 − 11 = 494.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q011
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.  
      17, 24, 38, 59, 87, ?
    options:
      A: "122"
      B: "137"
      C: "117"
      D: "109"
    answer: A
    explanation: Differences are 7, 14, 21, 28, so the next is 87 + 35 = 122.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q013
    difficulty: medium
    stem: |-
      Select the option that represents the correct order of the given words as they would appear in an English dictionary.  
      1. Penguins  
      2. Pendants  
      3. Penthouse  
      4. Pendulum  
      5. Pentagon  
      6. Penalize
    options:
      A: 6, 2, 4, 1, 3, 5
      B: 6, 2, 4, 1, 5, 3
      C: 6, 4, 2, 1, 5, 3
      D: 4, 2, 6, 1, 3, 5
    answer: B
    explanation: Penalize, Pendants, Pendulum, Penguins, Pentagon, Penthouse → 6, 2, 4, 1, 5, 3.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q014
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.  
      192 : 24 :: 48 : 12 :: 432 : ?
    options:
      A: "42"
      B: "32"
      C: "48"
      D: "36"
    answer: D
    explanation: "First = (second)² ÷ 3: 24² ÷ 3 = 192, 12² ÷ 3 = 48, and 36² ÷ 3 = 432."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q015
    difficulty: medium
    stem: In a certain code language, if ‘DGOUT’ is written as ‘25131918’ and ‘RCQFM’ is written as ‘16115411’, how will ‘OVHPI’ be written in the same code language?
    options:
      A: "11186048"
      B: "13196149"
      C: "13206147"
      D: "12196247"
    answer: C
    explanation: "Each letter's position − 2: O(15)→13, V(22)→20, H(8)→6, P(16)→14, I(9)→7 = 13206147."
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q017
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.  
      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)  
      School : Principal :: Prison : ?
    options:
      A: Doctor
      B: Engineer
      C: Plumber
      D: Jailor
    answer: D
    explanation: A principal heads a school; a jailor is in charge of a prison.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q018
    difficulty: medium
    stem: |-
      If,  
      ‘B % D’ means ‘B is the brother of D’,  
      ‘B & D’ means ‘B is the mother of D’,  
      ‘B × D’ means ‘B is the husband of D’,  
      ‘B # D’ means ‘B is the sister of D’,  
      ‘B \$ D’ means ‘B is the son of D’,  
      ‘B @ D’ means ‘B is the father of D’,

      then which of the given options is correct regarding the following expression?  
      S & Z \$ F % B % E @ G
    options:
      A: E is the sister of F.
      B: Z is the son of E's brother
      C: S is the mother of G.
      D: B is the maternal uncle of Z.
    answer: B
    explanation: Z is the son of F, and F, B and E are brothers (E is a father, so male); so Z is the son of E's brother.
    tags:
      - reasoning
  - slug: cgl-2023-07-20-s3-q019
    difficulty: medium
    stem: |-
