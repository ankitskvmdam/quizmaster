      5. Wardrobe

      6. Wardenship
    options:
      A: 3, 6, 5, 2, 1, 4
      B: 3, 5, 6, 2, 1, 4
      C: 3, 5, 6, 2, 4, 1
      D: 3, 6, 5, 2, 4, 1
    answer: D
    explanation: As per SSC's official answer.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q003
    difficulty: medium
    stem: |-
      Three statements are given, followed by four conclusions numbered I, II, III and IV.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      Some desks are trays.

      Some trays are plates.

      Some plates are desks.

      Conclusions:

      I. All desks are plates.

      II. All plates are desks.

      III. Some plates are trays.

      IV. All trays are desks.
    options:
      A: Only conclusion III follows
      B: Only conclusion IV follows
      C: Only conclusion II follows
      D: Only conclusion I follows
    answer: A
    explanation: As per SSC's official answer.
    tags:
      - reasoning
