      C: 14 2/5
      D: 15 3/5
    answer: C
    explanation: 8 × 45 men-days = 8 × 18 women-days, so 1 man = 0.4 woman. 5 men + 8 women = 10 women, who need 8 × 18 / 10 = 14 2/5 days.
