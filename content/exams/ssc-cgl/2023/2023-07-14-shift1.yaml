questions:
  - slug: cgl-2023-07-14-s1-q002
    difficulty: medium
    stem: |-
      Select the option that represents the correct order of the given words as they would appear in an English dictionary.

      1. Warriors

      2. Warehouse

      3. Warcraft

      4. Warranty

      5. Wardrobe

      6. Wardenship
    options:
      A: 3, 6, 5, 2, 1, 4
      B: 3, 5, 6, 2, 1, 4
      C: 3, 5, 6, 2, 4, 1
      D: 3, 6, 5, 2, 4, 1
    answer: D
    explanation: "Dictionary order: Warcraft, Wardenship, Wardrobe, Warehouse, Warranty, Warriors (wardE before wardR; warrA before warrI)."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q003
    difficulty: medium
    stem: |-
      Three statements are given, followed by four conclusions numbered I, II, III and IV.

      Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.

      Statements:

      Some desks are trays.

      Some trays are plates.

      Some plates are desks.

      Conclusions:

      I. All desks are plates.

      II. All plates are desks.

      III. Some plates are trays.

      IV. All trays are desks.
    options:
      A: Only conclusion III follows
      B: Only conclusion IV follows
      C: Only conclusion II follows
      D: Only conclusion I follows
    answer: A
    explanation: "'Some trays are plates' converts to 'Some plates are trays', so III follows; no 'All' conclusion can be drawn from 'Some' statements."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q004
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.

      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)

      Skin : Touch :: Nose : ?
    options:
      A: Smell
      B: Taste
      C: Nose ring
      D: Sweat
    answer: A
    explanation: The skin is the organ of touch; the nose is the organ of smell.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q005
    difficulty: medium
    stem: Ganesh was taking a walk with his mother’s brother’s father’s granddaughter. Who was he walking with?
    options:
      A: Daughter
      B: Mother
      C: Cousin
      D: Granddaughter
    answer: C
    explanation: Mother's brother's father is Ganesh's maternal grandfather; that grandfather's granddaughter (other than Ganesh's sister) is his cousin.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q007
    difficulty: medium
    stem: |-
      Which of the following letter-clusters will replace the question mark (?) in the given series?

      UV, OY, IB, EE, ?
    options:
      A: ZK
      B: AH
      C: BI
      D: BH
    answer: B
    explanation: "First letters are the vowels in reverse: U, O, I, E, A. Second letters move +3: V, Y, B, E, H. So AH."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q008
    difficulty: medium
    stem: The second number in the given number-pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) is/are followed in all the number-pairs except one. Find that odd number-pair.
    options:
      A: "20 : 11"
      B: "6 : 4"
      C: "15 : 9"
      D: "12 : 7"
    answer: C
    explanation: "Second number = first ÷ 2 + 1: 20→11, 6→4, 12→7. But 15 ÷ 2 + 1 = 8.5, not 9."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q010
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Find the number on the face opposite the face showing ‘1’.

      [Figure: three dice]

      *(Figure: Figure 1: top 1, front-left 2, front-right 6. Figure 2: top 1, front-left 6, front-right 5. Figure 3: top 1, front-left 5, front-right 4.)*
    options:
      A: "6"
      B: "2"
      C: "3"
      D: "4"
    answer: C
    explanation: 1 is adjacent to 2, 6, 5 and 4 in the three positions, so the face opposite 1 is 3.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q011
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.

      (55, 11, 25)

      (64,16, 16)

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)
    options:
      A: (33, 11, 9)
      B: (33, 11, 22)
      C: (33, 11, 3)
      D: (33, 11, 10)
    answer: A
    explanation: "Third number = (first ÷ second)²: (55 ÷ 11)² = 25, (64 ÷ 16)² = 16, (33 ÷ 11)² = 9."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q012
    difficulty: medium
    stem: |-
      Select the option that is related to the sixth letter-cluster in the same way as the first letter-cluster is related to the second letter-cluster and the third letter-cluster is related to the fourth letter-cluster.

      HMD : KOE : : BNQ : EPR :: ? : FLV
    options:
      A: SJE
      B: UJC
      C: EJS
      D: CJU
    answer: D
    explanation: "Each letter moves +3, +2, +1 (HMD → KOE). Working back from FLV: F−3 = C, L−2 = J, V−1 = U, giving CJU."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q015
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the odd letter-cluster.
    options:
      A: BFJN
      B: DHLP
      C: HJKP
      D: JNRV
    answer: C
    explanation: BFJN, DHLP and JNRV each step forward 4 letters; HJKP (+2, +1, +5) does not.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q016
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      5 : 45::3 : 3::6 : ?
    options:
      A: "90"
      B: "106"
      C: "110"
      D: "96"
    answer: D
    explanation: "n × (n − 2)²: 5 × 3² = 45, 3 × 1² = 3, so 6 × 4² = 96."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q017
    difficulty: medium
    stem: |-
      Which of the following numbers will replace the question mark (?) in the given series?

      8, 15, 26, ? , 56, 75
    options:
      A: "39"
      B: "41"
      C: "35"
      D: "43"
    answer: A
    explanation: "Differences are consecutive primes 7, 11, 13, 17, 19: 26 + 13 = 39, 39 + 17 = 56."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q018
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term and the sixth term is related to the fifth term.

      7183 : 3850 :: 6957 : ? :: 8972 : 5639
    options:
      A: "3426"
      B: "3624"
      C: "3246"
      D: "3642"
    answer: B
    explanation: Second term = first − 3333 (7183 − 3333 = 3850, 8972 − 3333 = 5639), so 6957 − 3333 = 3624.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q019
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Find the number on the face opposite the face showing ‘4’.

      [Figure: three dice]

      *(Figure: Figure 1: top 4, front-left 5, front-right 6. Figure 2: top 6, front-left 3, front-right 2. Figure 3: top 6, front-left 5, front-right 3.)*
    options:
      A: "5"
      B: "6"
      C: "2"
      D: "3"
    answer: D
    explanation: Around the face 6 the faces run 5, 3, 2 and then 4, so 4 sits opposite 3 (and 5 opposite 2).
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q020
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number.

      625 : 5 :: 2560 : 8 :: 5000 : ?
    options:
      A: "9"
      B: "12"
      C: "10"
      D: "15"
    answer: C
    explanation: 625 = 5 × 5³ and 2560 = 5 × 8³; 5000 = 5 × 10³, so the answer is 10.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q021
    difficulty: medium
    stem: In a certain code language, ‘ASK’ is written as ‘62’ and ‘BYE’ is written as ‘64’. How will ‘CRY’ be written in that language?
    options:
      A: "68"
      B: "72"
      C: "86"
      D: "92"
    answer: D
    explanation: "Code = 2 × sum of letter positions: ASK = 2 × 31 = 62, BYE = 2 × 32 = 64, CRY = 2 × (3 + 18 + 25) = 92."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q022
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.

      256 * 4 * 9 * 3 * 14 = 51
    options:
      A: × + − ÷
      B: ÷ × − +
      C: × ÷ + −
      D: ÷ − × +
    answer: D
    explanation: 256 ÷ 4 − 9 × 3 + 14 = 64 − 27 + 14 = 51.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q023
    difficulty: medium
    stem: |-
      Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.

      C L _ V E C _ _ W E C L O _ _ C _ O _ E
    options:
      A: O L P X E L Y
      B: O L O Y E L Z
      C: O L O X F M Y
      D: O L O X E L Y
    answer: D
    explanation: The series is CLOVE, CLOWE, CLOXE, CLOYE, so the blanks are O, L, O, X, E, L, Y.
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q024
    difficulty: medium
    stem: In a certain code language, ‘TABLE’ is coded as ELEAT and ‘SWING’ is coded as GNLWS. How will ‘FRAME’ be coded in the same language?
    options:
      A: EMERF
      B: EMDRF
      C: ERMDF
      D: MEDFR
    answer: B
    explanation: "The word is reversed and the middle letter moves +3: TABLE → ELBAT → ELEAT. FRAME → EMARF → EMDRF."
    tags:
      - reasoning
  - slug: cgl-2023-07-14-s1-q025
    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      588 ÷ 28 × 32 + 72 – 160 = 760
    options:
      A: – and +
      B: ÷ and –
      C: + and ×
      D: ÷ and +
    answer: A
    explanation: "Swapping − and +: 588 ÷ 28 × 32 − 72 + 160 = 672 − 72 + 160 = 760."
    tags:
      - reasoning
