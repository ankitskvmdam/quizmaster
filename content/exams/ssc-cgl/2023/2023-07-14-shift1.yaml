  - slug: cgl-2023-07-14-s1-q034
    difficulty: medium
    stem: In Chola administration, ________ was the assembly in the villages which were inhabited predominantly by the Brahmanas.
    options:
      A: Ur
      B: Khilya
      C: Nagaram
      D: Sabha
    answer: D
    explanation: Under the Cholas, the Sabha (Mahasabha) was the assembly of Brahmana villages (brahmadeyas); the Ur was the assembly of ordinary villages.
    tags:
