  - slug: cgl-2023-07-14-s1-q033
    difficulty: medium
    stem: The Vedic Aryans lived in the area called Sapt-Sindhu, which means area drained by seven rivers. One of the rivers among the seven is Jhelum. What was its ancient name?
    options:
      A: Askini
      B: Parushni
      C: Vipash
      D: Vitasta
    answer: D
    explanation: The Rigvedic name of the Jhelum is Vitasta (Askini = Chenab, Parushni = Ravi, Vipash = Beas).
