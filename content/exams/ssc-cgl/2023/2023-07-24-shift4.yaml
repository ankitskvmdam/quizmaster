questions:
  - slug: cgl-2023-07-24-s4-q001
    difficulty: medium
    stem: |-
      Which of the following terms will replace the question mark (?) in the given series?

      XGR, TKN, POJ, LSF, ?, DAX
    options:
      A: HVB
      B: HWB
      C: GWB
      D: HWA
    answer: B
    explanation: "First letters go back 4 (X, T, P, L, H, D), second letters forward 4 (G, K, O, S, W, A), third letters back 4 (R, N, J, F, B, X): HWB."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q002
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the given sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)

      (15, 28, 41)

      (19, 32, 45)
    options:
      A: (16, 28, 43)
      B: (12, 25, 36)
      C: (24, 38, 55)
      D: (22, 35, 48)
    answer: D
    explanation: "Each number is 13 more than the one before: 15, 28, 41 and 19, 32, 45. Likewise 22, 35, 48."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q003
    difficulty: medium
    stem: |-
      A % B means ‘A is the daughter of B’

      A = B means ‘A is the sister of B’

      A \$ B means ‘A is the father of B’

      If E = F = G \$ H = I, then how is G related to E?
    options:
      A: Brother
      B: Son’s son
      C: Son’s daughter
      D: Father
    answer: A
    explanation: G \$ H means G is the father of H, so G is male. E is the sister of F and F is the sister of G, so G is E's brother.
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q004
    difficulty: medium
    stem: In a certain code language, “PRECIOUS” is written as “UOICERPS” and “FLAGRANT” is written as “NARGALFT”. How will “CHILDISH" be written in that language?
    options:
      A: HCSIDLIH
      B: SIDLIHCH
      C: SCHILDIH
      D: HSIDLIHC
    answer: B
    explanation: "The first seven letters are reversed and the last letter stays: PRECIOU+S → UOICERP+S. CHILDIS+H → SIDLIHC+H = SIDLIHCH."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q007
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      (6, 8,11)

      (2, 1, 2)

      (6, 7, ?)

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "12"
      B: "10"
      C: "4"
      D: "13"
    answer: B
    explanation: "Third number = second + first ÷ 2: 8 + 3 = 11, 1 + 1 = 2, so 7 + 3 = 10."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q008
    difficulty: medium
    stem: |-
      Select the word-pair that best represents a similar relationship to the one expressed in the pair of words given below.

      Shovel : Scoop
    options:
      A: "Spanner : Grip"
      B: "Lever : Cut"
      C: "Chisel : Grip"
      D: "Hammer : Iron"
    answer: A
    explanation: A shovel is used to scoop; a spanner is used to grip.
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q009
    difficulty: medium
    stem: Three of the following four letter-clusters are alike in a certain way and one is different. Pick the odd one out.
    options:
      A: FGJP
      B: ABEJ
      C: TUXC
      D: VWZE
    answer: A
    explanation: ABEJ, TUXC and VWZE step +1, +3, +5. FGJP steps +1, +3, +6.
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q011
    difficulty: medium
    stem: |-
      Which two signs and numbers need to be interchanged to make the following equation correct?

      (31 × 3) – (27 × 4) + (81 ÷ 9) = 126
    options:
      A: 27 and 81, + and −
      B: 31 and 27, + and −
      C: 3 and 4, ÷ and +
      D: 27 and 9, + and −
    answer: D
    explanation: "Swapping 27 with 9 and + with −: (31 × 3) + (9 × 4) − (81 ÷ 27) = 93 + 36 − 3 = 126."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q012
    difficulty: medium
    stem: The second number in the given number-pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) is/are followed in all the number-pairs except one. Find that odd number-pair.
    options:
      A: "16 : 2"
      B: "100 : 5"
      C: "36 : 3"
      D: "186 : 7"
    answer: D
    explanation: "Second number = √first ÷ 2: 16 → 2, 100 → 5, 36 → 3. 186 is not a perfect square, so 186 : 7 is odd."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q013
    difficulty: medium
    stem: |-
      Select the option that represents the correct order of the given words as they would appear in an English dictionary.

      1. Absurdly

      2. Abstriction

      3. Abstract

      4. Absolutely

      5. Abstain

      6. Absorber
    options:
      A: 6, 4, 3, 5, 2, 1
      B: 4, 6, 3, 5, 1, 2
      C: 6, 4, 5, 3, 2, 1
      D: 4, 6, 5, 3, 2, 1
    answer: D
    explanation: "Dictionary order: Absolutely, Absorber, Abstain, Abstract, Abstriction, Absurdly."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q016
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth term in the same way as the second term is related to the first term and the fourth term is related to the third term.

      24 : 2 :: 81: 3 :: 375 : ?
    options:
      A: "15"
      B: "5"
      C: "9"
      D: "7"
    answer: B
    explanation: 24 = 3 × 2³ and 81 = 3 × 3³; 375 = 3 × 5³, so the answer is 5.
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q017
    difficulty: medium
    stem: |-
      In a certain code language,

      ‘meet them now’ is coded as ‘el cn ah’;

      ‘never meet alone’ is coded as ‘cn sm uv’ and

      ‘not alone now’ is coded as ‘ah sm rt’.

      (All the codes are two-letter codes only.)

      How will ‘not them’ be coded in that language?
    options:
      A: rt sm
      B: el uv
      C: el rt
      D: uv cn
    answer: C
    explanation: "'meet' = cn and 'now' = ah (common codes), so 'them' = el; 'alone' = sm, so 'not' = rt. 'not them' = el rt."
    tags:
      - reasoning
  - slug: cgl-2023-07-24-s4-q018
    difficulty: medium
    stem: |-
      Which of the following interchange of numbers would make the given equation correct?

      5 × 15 ÷ 3 + 20 – 9 = 4
    options:
      A: 5, 20
      B: 15, 20
