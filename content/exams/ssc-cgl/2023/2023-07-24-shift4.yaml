  - slug: cgl-2023-07-24-s4-q055
    difficulty: medium
    stem: Simplify 1/(2 + 2p) + 1/(2 + 2q) + 1/(2 + 2r), where p = x/(y + z), if q = y/(z + x) and r = z/(x + y).
    options:
      A: "1"
      B: x + y + z
      C: "2"
      D: 1/2
    answer: A
    explanation: 1 + p = (x + y + z)/(y + z), so each term is (y + z)/(2(x + y + z)) etc.; the three numerators add to 2(x + y + z), giving 1.
