  - slug: cgl-2023-07-24-s4-q052
    difficulty: medium
    stem: R, S and T can finish a work in 20, 15 and 10 days, respectively. R works on all days and S and T work on alternate days with T starting the work on the first day. In how many days is the work finished?
    options:
      A: 61/7
      B: 50/7
      C: 52/7
      D: 57/8
    answer: C
    explanation: Work = 60 units; R 3, S 4, T 6 a day. Each two days R+T then R+S do 16 units, so 6 days give 48. Day 7 (R+T) adds 9 = 57; the last 3 units take 3/7 of day 8. Total 7 3/7 = 52/7 days.
    tags:
      - quant
