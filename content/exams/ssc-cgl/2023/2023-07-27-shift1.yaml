    difficulty: medium
    stem: In T20 cricket matches, a bowler can bowl a maximum of _______.
    options:
      A: 7 overs
      B: 6 overs
      C: 5 overs
      D: 4 overs
    answer: D
    explanation: In a 20-over match each bowler may bowl at most 4 overs (one-fifth of the overs).
    tags:
      - general-awareness
