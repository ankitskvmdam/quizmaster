      - general-awareness
  - slug: cgl-2023-07-27-s1-q040
    difficulty: medium
    stem: The first day of the Tamil calendar on 14 April is celebrated as________.
    options:
      A: Mahamaham
      B: Onam
      C: Pongal
      D: Puthandu
    answer: D
