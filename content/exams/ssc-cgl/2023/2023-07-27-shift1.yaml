      - general-awareness
  - slug: cgl-2023-07-27-s1-q041
    difficulty: medium
    stem: Identify an endoparasite found in animals.
    options:
      A: Pleurobrachia
      B: Ctenoplana
      C: Flatworms
      D: Adamsia
    answer: C
    explanation: Many flatworms (tapeworms, liver flukes) live inside animal hosts as endoparasites; the others are ctenophores or a sea anemone.
