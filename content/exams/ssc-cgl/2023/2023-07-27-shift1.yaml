    difficulty: medium
    stem: "The compound in which a hydroxy group, -OH, is attached to a saturated carbon atom which has two other carbon atoms attached to it is called:"
    options:
      A: aldehyde
      B: tertiary alcohol
      C: secondary alcohol
      D: primary alcohol
    answer: C
    explanation: An –OH on a carbon bonded to two other carbons is a secondary (2°) alcohol.
    tags:
      - general-awareness
