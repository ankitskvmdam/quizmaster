      - general-awareness
  - slug: cgl-2023-07-27-s1-q029
    difficulty: medium
    stem: "A natural process of mechanical disintegration and or chemical decomposition of the rocks of the crust of the Earth by certain physical and chemical agencies of the atmosphere is known as:"
    options:
      A: solidification of rocks
      B: weathering
      C: mew rock formation
      D: watering of rocks
    answer: B
    explanation: Breaking down of rocks in place by physical and chemical agents is called weathering.
    tags:
      - general-awareness
