questions:
  - slug: cgl-2023-07-27-s1-q001
    difficulty: medium
    stem: Looking at the family picture, Sneha said, “She is my brother’s wife’s son’s father’s mother-in-law’s only daughter.’ How is the girl in the photo related to Sneha?
    options:
      A: Daughter-in-law
      B: Brother’s wife
      C: Mother
      D: Sister
    answer: B
    explanation: Brother's wife's son's father is the brother; his mother-in-law's only daughter is the brother's wife.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q002
    difficulty: medium
    stem: |-
      Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third letter-cluster.

      GPK : MSI : : RHT : VKT :: IDW : ?
    options:
      A: YGK
      B: ZHL
      C: KGY
      D: YIK
    answer: A
    explanation: "Reverse the cluster, then shift +2, +3, +2: GPK → KPG → MSI; IDW → WDI → YGK."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q004
    difficulty: medium
    stem: In a certain code language, ‘DUST’ is coded as 16 and ‘EARTH’ is coded as 25. How will ‘MAN’ be coded in the same language?
    options:
      A: "12"
      B: "9"
      C: "6"
      D: "36"
    answer: B
    explanation: "Code = (number of letters)²: DUST 4² = 16, EARTH 5² = 25, so MAN 3² = 9."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q005
    difficulty: medium
    stem: |-
      Select the option that represents the correct order of the given words as they would appear in an English dictionary.

      1. Diamond

      2. Dialogue

      3. Dictator

      4. Dialect

      5. Diameter

      6. Diagram
    options:
      A: 6, 2, 4, 1, 5, 3
      B: 6, 4, 2, 1, 5, 3
      C: 4, 2, 6, 5, 1, 3
      D: 6, 4, 2, 5, 1, 3
    answer: D
    explanation: Diagram, Dialect, Dialogue, Diameter, Diamond, Dictator → 6, 4, 2, 5, 1, 3.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q006
    difficulty: medium
    stem: |-
      Which of the following terms will replace the question mark (?) in the given series?

      AJRX, CNXF, ERDN, ?, IZPD
    options:
      A: HVJV
      B: GVJV
      C: HVIT
      D: GVKV
    answer: B
    explanation: "Letter positions move +2, +4, +6, +8: E→G, R→V, D→J, N→V gives GVJV."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q007
    difficulty: medium
    stem: In a certain code language, ‘BOOK’ is written as ‘325’, ‘READ’ is written as ‘400’. How will ‘ABLE’ be written in that language?
    options:
      A: "445"
      B: "440"
      C: "442"
      D: "438"
    answer: B
    explanation: "Sum of reverse alphabet positions × 5: BOOK 65 × 5 = 325, READ 80 × 5 = 400, ABLE (26 + 25 + 15 + 22) = 88 × 5 = 440."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q008
    difficulty: medium
    stem: |-
      Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.

      G _ A R E G L _ R _ G _ C _ E G L _ _ E
    options:
      A: K B E L R D R
      B: L B E L R D R
      C: L A E L R E R
      D: K B E L R E R
    answer: B
    explanation: The series is GLARE, GLBRE, GLCRE, GLDRE; the blanks are L, B, E, L, R, D, R.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q009
    difficulty: medium
    stem: |-
      Three of the following four letter-clusters are alike in a certain way and one is different.

      Pick the odd one out.
    options:
      A: FJU
      B: KNP
      C: CGX
      D: IMR
    answer: B
    explanation: In FJU, CGX and IMR the second letter is 4 after the first; in KNP it is only 3 after.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q010
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      (4, 2, 6)

      (9, 3, 9)

      (24, 6, ?)

      (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)
    options:
      A: "10"
      B: "12"
      C: "15"
      D: "8"
    answer: B
    explanation: "(first ÷ second) × 3: 4 ÷ 2 × 3 = 6, 9 ÷ 3 × 3 = 9, 24 ÷ 6 × 3 = 12."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q011
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)

      (17, 26, 37)

      (170, 197, 226)
    options:
      A: (48, 63, 80)
      B: (45, 52, 105)
      C: (16, 28, 36)
      D: (52, 65, 83)
    answer: A
    explanation: Each set has differences that are consecutive odd numbers (9, 11 and 27, 29); 48, 63, 80 has 15, 17 (they are 7² − 1, 8² − 1, 9² − 1).
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q012
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the given sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)

      (38, 29, 67)

      (43, 36, 79)
    options:
      A: (51, 39, 70)
      B: (59, 28, 77)
      C: (47, 35, 82)
      D: (34, 47, 83)
    answer: C
    explanation: "Third = first + second: 38 + 29 = 67, 43 + 36 = 79, and 47 + 35 = 82."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q014
    difficulty: medium
    stem: The second number in the given number-pairs is obtained by performing certain mathematical operation(s) on the first number. The same operation(s) is/are followed in all the number-pairs, except one. Find that odd number-pair.
    options:
      A: (1826, 1472)
      B: (1984, 1505)
      C: (1805, 1326)
      D: (2136, 1657)
    answer: A
    explanation: In the others the second number is 479 less than the first; 1826 − 1472 = 354.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q015
    difficulty: medium
    stem: |-
      Select the set in which the numbers are related in the same way as are the numbers of the following sets.

      (NOTE : Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /Subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)

      (39, 65), (63, 105)
    options:
      A: (66, 165)
      B: (96, 160)
      C: (72, 180)
      D: (84, 155)
    answer: B
    explanation: "Both pairs are in the ratio 3 : 5 (39 : 65, 63 : 105); 96 : 160 is also 3 : 5."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q018
    difficulty: medium
    stem: |-
      Which of the following interchanges of signs would make the given equation correct?

      110 ÷ 20 + 5 × 13 – 9 = 153
    options:
      A: × and ÷
      B: ÷ and +
      C: – and ×
      D: + and –
    answer: B
    explanation: "Swapping ÷ and +: 110 + 20 ÷ 5 × 13 − 9 = 110 + 52 − 9 = 153."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.

      (The words must be considered as meaningful English words and must not be related to each other based on the number of letters/number of consonants/vowels in the word.)

      Ringworm : Skin :: Tapeworm : ?
    options:
      A: Intestine
      B: Blood
      C: Lungs
      D: Heart
    answer: A
    explanation: Ringworm infects the skin; tapeworm lives in the intestine.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q023
    difficulty: medium
    stem: |-
      Which of the following numbers will replace the question mark (?) in the given series?

      [1/176], [1/88], ?, [1/22], [1/11]
    options:
      A: "[1/32]"
      B: "[1/44]"
      C: "[1/48]"
      D: "[1/42]"
    answer: B
    explanation: "Each term doubles: 1/176, 1/88, 1/44, 1/22, 1/11."
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q024
    difficulty: medium
    stem: |-
      If ‘+’ means ‘division’, ‘−’ means ‘multiplication’, ‘÷’ means ‘subtraction’ and ‘×’ means ‘addition’, then what is the value of the following expression?

      805 + 23 ÷ 4 − 6 × 2
    options:
      A: "32"
      B: "25"
      C: "29"
      D: "13"
    answer: D
    explanation: Swapping the signs gives 805 ÷ 23 − 4 × 6 + 2 = 35 − 24 + 2 = 13.
    tags:
      - reasoning
  - slug: cgl-2023-07-27-s1-q026
    difficulty: medium
    stem: Which actinide, discovered by Glenn T Seaborg in 1940, is used as a heat source for sensitive electrical components in satellites as well as a power source for satellites?
    options:
      A: Curium
      B: Plutonium
      C: Nobelium
      D: Americium
    answer: B
    explanation: Plutonium (discovered by Seaborg and colleagues in 1940); Pu-238 powers radioisotope generators and heaters in spacecraft.
    tags:
      - general-awareness
  - slug: cgl-2023-07-27-s1-q027
    difficulty: medium
    stem: The Jagannath Temple in Puri depicts which Indian classical dance form?
    options:
      A: Kuchipudi
      B: Bharatanatyam
      C: Kathak
      D: Odissi
    answer: D
    explanation: Odissi developed in the temples of Odisha; its poses are carved on the Jagannath and Konark temples.
    tags:
      - general-awareness
  - slug: cgl-2023-07-27-s1-q028
    difficulty: medium
    stem: Who among the following IPS officers in 2023 is one of the first women officers to become the Director General of police in Punjab?
    options:
      A: Shashi Prabha Dwivedi
      B: Meera Chadha Borwankar
      C: Aparajita Rai
      D: Ruveda Salam
