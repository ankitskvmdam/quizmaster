    tags:
      - general-awareness
  - slug: cgl-2023-07-27-s1-q051
    difficulty: medium
    stem: The difference between the cubes of two given natural numbers is 6272, while the positive difference between the two given numbers is 8. What is the sum of the cubes of the two given numbers?
    options:
      A: "9728"
      B: "9684"
      C: "8000"
      D: "9600"
    answer: A
    explanation: "a − b = 8 and a²+ab+b² = 6272/8 = 784 give ab = 240, so the numbers are 20 and 12: 8000 + 1728 = 9728."
    tags:
      - quant
  - slug: cgl-2023-07-27-s1-q052
    difficulty: medium
    stem: If the price of petrol is increased by 81%, by what percentage should the consumption of petrol be decreased by the consumer if the expenditure on petrol remains unchanged? (Correct to two decimal places)
    options:
      A: 40.45%
      B: 41.25%
      C: 43.12%
      D: 44.75%
    answer: D
    explanation: Cut in consumption = 81/181 × 100 = 44.75%.
    tags:
      - quant
  - slug: cgl-2023-07-27-s1-q053
    difficulty: medium
    stem: If 2x + 3y = 16 and xy = 9, then find 8x³ + 27y³.
    options:
      A: "1980"
      B: "2980"
      C: "1504"
      D: "2189"
    answer: C
    explanation: 8x³ + 27y³ = (2x + 3y)³ − 18xy(2x + 3y) = 4096 − 2592 = 1504.
    tags:
      - quant
  - slug: cgl-2023-07-27-s1-q054
    difficulty: medium
    stem: |-
      In the following figure, O is the centre of the circle. Its two chords AB and CD intersect each other at point P inside the circle. If AB = 18 cm, PB = 6 cm and CP = 4 cm, then find the measure of PD.

      [Figure: a circle with centre O; chord AB runs from upper-left to lower-right and chord CD from lower-left to upper-right, crossing at P]

      *(Figure: Circle with centre O; chords AB and CD intersect at P inside the circle.)*
    options:
      A: 14 cm
      B: 18 cm
      C: 16 cm
      D: 20 cm
    answer: B
    explanation: AP = 18 − 6 = 12; AP × PB = CP × PD → 12 × 6 = 4 × PD → PD = 18 cm.
    tags:
      - quant
  - slug: cgl-2023-07-27-s1-q055
    difficulty: medium
    stem: If x + y = 25 and xy = 20, then find the value of x³ + y³ .
    options:
      A: "13152"
      B: "13125"
      C: "14125"
      D: "14152"
    answer: C
    explanation: x³ + y³ = (x + y)³ − 3xy(x + y) = 15625 − 1500 = 14125.
    tags:
      - quant
  - slug: cgl-2023-07-27-s1-q056
    difficulty: medium
    stem: Sohan and Amit started a car race from the same point in the same direction and at the same time on a circular track of length 1125 m with speeds of 36 km/h and 54 km/h, respectively. After how much time (in seconds) will they meet for the first time since the start of the race?
    options:
      A: "220"
      B: "215"
      C: "210"
      D: "225"
    answer: D
    explanation: "Relative speed = 18 km/h = 5 m/s; they meet after one lap's gap: 1125 ÷ 5 = 225 s."
    tags:
      - quant
