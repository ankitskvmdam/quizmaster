  - slug: cgl-2020-03-04-s2-q061
    difficulty: medium
    stem: The difference in compound interest on a certain sum at 10% p.a. for one year, when the interest is compounded half yearly and yearly, is ₹88.80. What is the simple interest on the same sum for 1 2/3 years at the same rate?
    options:
      A: ₹5,916
      B: ₹5,986
      C: ₹5,980
      D: ₹5,920
    answer: D
    explanation: Difference = P[(1.05)² − 1.10] = 0.0025P = 88.80, so P = ₹35,520. SI = 35,520 × 10% × 5/3 = ₹5,920.
    tags:
      - quant
  - slug: cgl-2020-03-04-s2-q062
    difficulty: medium
    stem: If 30x² − 15x + 1 = 0, then what is the value of 25x² + (36x²)⁻¹ ?
    options:
      A: 9/2
      B: 6 1/4
      C: 65/12
      D: 55/12
    answer: D
    explanation: "Divide by 6x: 5x + 1/(6x) = 5/2. Squaring: 25x² + 1/(36x²) + 5/3 = 25/4, so the value is 25/4 − 5/3 = 55/12."
    tags:
