    stem: If the 6-digit numbers x35624 and 1257y4 are divisible by 11 and 72, respectively, then what is the value of (5x − 2y)?
    options:
      A: "14"
      B: "12"
      C: "10"
      D: "13"
    answer: A
    explanation: |-
      x35624 ÷ 11: (x + 5 + 2) − (3 + 6 + 4) = 0, so x = 6. 1257y4 ÷ 72 needs ÷9: 19 + y = 27, so y = 8 (784 ÷ 8 also works).
      5x − 2y = 30 − 16 = 14.
    tags:
      - quant
  - slug: cgl-2020-03-04-s2-q052
    difficulty: medium
    stem: |-
      The given table represents the revenue (in ₹ crores) of a company from the sale of four products A, B, C and D in 6 years. Study the table carefully and answer the question that follows.

      | Product ↓ / Years → | 2012 | 2013 | 2014 | 2015 | 2016 | 2017 |
      |---|---|---|---|---|---|---|
      | A | 98 | 94 | 80 | 95 | 110 | 115 |
      | B | 74 | 96 | 92 | 84 | 98 | 86 |
      | C | 82 | 98 | 96 | 88 | 93 | 103 |
      | D | 74 | 102 | 92 | 93 | 97 | 102 |

      What is the ratio of the total revenue of the company in 2014 from the sale of all the four products to the total revenue from the sale of product C in 2014 to 2017?
    options:
      A: "14 : 23"
      B: "18 : 19"
      C: "7 : 10"
      D: "7 : 9"
    answer: B
    explanation: "Total in 2014 = 80 + 92 + 96 + 92 = 360. Product C, 2014–17 = 96 + 88 + 93 + 103 = 380. 360 : 380 = 18 : 19."
    tags:
      - quant
  - slug: cgl-2020-03-04-s2-q053
    difficulty: medium
    stem: "If P = (x⁴ − 8x)/(x³ − x² − 2x), Q = (x² + 2x + 1)/(x² − 4x − 5) and R = (2x² + 4x + 8)/(x − 5), then (P × Q) ÷ R is equal to:"
    options:
      A: 1/2
      B: "1"
      C: "2"
      D: "4"
    answer: A
    explanation: |-
      P = (x−2)(x² + 2x + 4)/[(x−2)(x+1)] and Q = (x+1)/(x−5), so P × Q = (x² + 2x + 4)/(x−5).
      Dividing by R = 2(x² + 2x + 4)/(x−5) gives 1/2.
    tags:
      - quant
