    stem: "In ΔABC, D and E are the points on sides AC and BC, respectively such that DE ∥ AB. F is a point on CE such that DF ∥ AE. If CE = 6 cm, and CF = 2.5 cm, then BC is equal to:"
    options:
      A: 14.4 cm
      B: 15.6 cm
      C: 14 cm
      D: 12 cm
    answer: A
    explanation: DF ∥ AE gives CF/CE = CD/CA, and DE ∥ AB gives CE/CB = CD/CA. So CE² = CF × CB, and BC = 36/2.5 = 14.4 cm.
