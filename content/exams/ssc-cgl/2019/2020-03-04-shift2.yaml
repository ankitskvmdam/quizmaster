  - slug: cgl-2020-03-04-s2-q018
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 10 | 3 | 14 |
      | 49 | 15 | 68 |
      | 33 | 19 | ? |
    options:
      A: "28"
      B: "29"
      C: "25"
      D: "27"
    answer: A
    explanation: "Third column = 2 × (first − second): 2(10 − 3) = 14, 2(49 − 15) = 68, so 2(33 − 19) = 28."
    tags:
      - reasoning
