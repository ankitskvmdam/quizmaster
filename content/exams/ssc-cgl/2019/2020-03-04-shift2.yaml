  - slug: cgl-2020-03-04-s2-q011
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      6 : 252 :: 5 : ?
    options:
      A: "175"
      B: "150"
      C: "125"
      D: "225"
    answer: B
    explanation: 6³ + 6² = 216 + 36 = 252, so 5³ + 5² = 125 + 25 = 150.
    tags:
      - reasoning
  - slug: cgl-2020-03-04-s2-q012
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      1. All cars are trucks.  
      2. Some buses are cars.

      **Conclusions:**

      I. All cars are buses.  
      II. Some buses are trucks.  
      III. All trucks are buses.
    options:
      A: Only conclusions II and III follow.
      B: Only conclusion I follows.
      C: Only conclusion II follows.
      D: Only conclusions I and III follow.
    answer: C
    explanation: Some buses are cars, and all cars are trucks, so some buses are trucks (II). I and III do not follow.
    tags:
      - reasoning
  - slug: cgl-2020-03-04-s2-q013
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it

