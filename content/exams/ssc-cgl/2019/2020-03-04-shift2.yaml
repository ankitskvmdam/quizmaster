questions:
  - slug: cgl-2020-03-04-s2-q001
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A rectangle with a vertical line a little in from its left side. A diagonal runs from the bottom-left corner of the rectangle to its top-right corner. A second line runs from the top of the inner vertical line down to the bottom side (about three-quarters of the way across). A third line runs from a point on the top side (about 60% across) down to the right side (about two-thirds of the way down).)*
    options:
      A: "9"
      B: "10"
      C: "11"
      D: "12"
    answer: C
    explanation: "Name the lines: 4 sides, the inner vertical, the diagonal and the two slanting lines. Triangles: 3 on the diagonal with the bottom side, 4 on the diagonal with the top side, 2 near the top-right corner, 1 from the inner vertical, bottom side and first slanting line, 1 between the inner vertical, diagonal and first slanting line. Total 11."
    tags:
      - reasoning
  - slug: cgl-2020-03-04-s2-q002
    difficulty: medium
    stem: |-
      A + B means ‘B is the sister of A’;

      A – B means ‘A is the father of B’;

      A × B means ‘B is the son of A’;

      A ÷ B means ‘B is the husband of A’.

      If, E ÷ F - H + J × G + D, then how is D related to H?
    options:
      A: Uncle
      B: Father
      C: Niece
      D: Aunt
    answer: C
    explanation: |-
      E ÷ F: F is E's husband; F – H: F is H's father; H + J: J is H's sister; J × G: G is J's son; G + D: D is G's sister.
      So D is the daughter of H's sister J, i.e. H's niece.
    tags:
      - reasoning
