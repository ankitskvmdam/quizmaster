    difficulty: medium
    stem: "The ratio of boys and girls in a group is 7 : 6. If 4 more boys join the group and 3 girls leave the group, then the ratio of boys to girls becomes 4 : 3. What is the total number of boys and girls initially in the group?"
    options:
      A: "117"
      B: "78"
      C: "91"
      D: "104"
