    tags:
      - reasoning
  - slug: cgl-2020-03-04-s2-q004
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Select the symbol that will be on the face opposite to the one showing ‘ @ ’.

      *(Figure: Three views of the same die. (1) top *, front !, right @. (2) top &, front *, right @. (3) top #, front &, right <.)*
    options:
      A: "!"
      B: "&"
      C: <
      D: "#"
    answer: D
    explanation: |-
      @ touches *, ! and & (views 1 and 2). Turning about the @ axis puts & opposite !, and placing view 3 (top #, front &, right <) shows < is opposite *.
      So # is opposite @.
    tags:
      - reasoning
  - slug: cgl-2020-03-04-s2-q006
