    stem: |-
      The given table represents the revenue (in ₹ crores) of a company from the sale of four products A, B, C and D in 6 years. Study the table carefully and answer the question that follows.

      | Product ↓ / Years → | 2012 | 2013 | 2014 | 2015 | 2016 | 2017 |
      |---|---|---|---|---|---|---|
      | A | 98 | 94 | 80 | 95 | 110 | 115 |
      | B | 74 | 96 | 92 | 84 | 98 | 86 |
      | C | 82 | 98 | 96 | 88 | 93 | 103 |
      | D | 74 | 102 | 92 | 93 | 97 | 102 |

      By what percentage is the total revenue of the company from the sale of products A, B and D in 2012 and 2013 more than the total revenue from the sale of product B in 2013 to 2016?(Correct to one decimal place)
    options:
      A: "44.5"
      B: "31.2"
      C: "43.6"
      D: "45.4"
    answer: D
    explanation: A + B + D in 2012–13 = 246 + 292 = 538. B in 2013–16 = 370. (538 − 370)/370 × 100 = 45.4%.
    tags:
