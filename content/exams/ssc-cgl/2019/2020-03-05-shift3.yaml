  - slug: cgl-2020-03-05-s3-q010
    difficulty: medium
    stem: |-
      Which two signs and two numbers should be interchanged to make the given equation correct?

      28 − 32 ÷ 2 × 8 + 34 = 132
    options:
      A: × and − ; 32 and 34
      B: + and − ; 28 and 32
      C: × and − ; 8 and 2
      D: + and − ; 32 and 34
    answer: D
    explanation: Swapping + and − and the numbers 32 and 34 gives 28 + 34 ÷ 2 × 8 − 32 = 28 + 136 − 32 = 132.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q011
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      1. No bottle is a pen.  
      2. All jugs are bottles.

      **Conclusions:**

      I. Some jugs are pens.  
      II. No jug is pen.  
      III. Some bottles are jugs.
    options:
      A: All conclusions I, II and III follow.
      B: Either conclusion I or II follows.
      C: Only conclusions II and III follow.
      D: Conclusion III and either conclusion I or II follow.
    answer: C
    explanation: All jugs are bottles and no bottle is a pen, so no jug is a pen (II), and some bottles are jugs (III). I is false.
    tags:
      - reasoning
