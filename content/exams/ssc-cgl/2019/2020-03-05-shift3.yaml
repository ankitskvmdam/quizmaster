  - slug: cgl-2020-03-05-s3-q013
    difficulty: medium
    stem: In a class of 100 students, every student has passed in one or more of the three subjects, i.e. History, Economics and English. Among all the students, 24 students have passed in English only, 14 students have passed in History only, 11 students have passed in both English and Economics only, and 12 students have passed in both English and History only. A total of 50 students have passed in History. If only 5 students have passed in all three subjects, then how many students have passed in Economics only?
    options:
      A: "18"
      B: "10"
      C: "20"
      D: "15"
    answer: D
    explanation: |-
      History = 14 + 12 + 5 + (History and Economics only) = 50, so that region is 19.
      Economics only = 100 − (24 + 14 + 11 + 12 + 5 + 19) = 15.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q014
    difficulty: medium
    stem: In a certain code language, 'AUSTERE' is coded as '13102595'. How will 'SETTING' be coded as in that language?
    options:
      A: "11522867"
      B: "10522957"
      C: "11544957"
      D: "10522948"
    answer: B
    explanation: |-
      Each letter's alphabet position is reduced to its digit sum: A=1, U=21→3, S=19→10, T=20→2, E=5, R=18→9.
      SETTING = 10, 5, 2, 2, 9, 14→5, 7 = 10522957.
