  - slug: cgl-2020-03-05-s3-q021
    difficulty: medium
    stem: Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the number-pair that is different from the rest.
    options:
      A: "4209 : 15"
      B: "7456 : 22"
      C: "5121 : 12"
      D: "8101 : 10"
    answer: C
    explanation: "The second number is the sum of the digits: 4+2+0+9 = 15, 7+4+5+6 = 22, 8+1+0+1 = 10. But 5+1+2+1 = 9, not 12."
