    stem: The distance between two stations, A and B, is 428 km. A train starts from station ‘A’ at 6:00 a.m. and moves towards station ‘B’ at an average speed of 48 km/h. Another train starts from station ‘B’ at 6:20 a.m. and moves towards station ‘A’ at an average speed of 55 km/h. At what time will the trains meet?
