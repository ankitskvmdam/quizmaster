questions:
  - slug: cgl-2020-03-05-s3-q002
    difficulty: medium
    stem: In a certain code language, 'FASTER' is written as 'CDPQHO'. How will 'VIOLIN' be written as in that language?
    options:
      A: SLRILK
      B: SLIRLM
      C: RLTILK
      D: SKIRKO
    answer: A
    explanation: |-
      Vowels move 3 letters forward and consonants 3 letters back: F→C, A→D, S→P, T→Q, E→H, R→O.
      So VIOLIN → S, L, R, I, L, K = SLRILK.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q003
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 42 | 37 | ? |
      | 18 | 24 | 36 |
      | 252 | 296 | 540 |
    options:
      A: "55"
      B: "45"
      C: "50"
      D: "40"
    answer: B
    explanation: "In each column, top × middle ÷ 3 = bottom: 42 × 18/3 = 252, 37 × 24/3 = 296. So ? × 36/3 = 540 gives ? = 45."
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q004
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the odd letter-cluster.
    options:
      A: ORUX
      B: JMPS
      C: PSVX
      D: ZCFI
    answer: C
    explanation: ORUX, JMPS and ZCFI move +3 at each step. In PSVX the last step V → X is only +2.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q005
    difficulty: medium
    stem: |-
      A + B means ‘A is the mother of B’;

      A − B means ‘A is the brother of B’;

      A × B means ‘A is the father of B’;

      A ÷ B means ‘A is the daughter of B’.

      If, P − K × Y − J ÷ S + R, then which of the following statements is NOT correct?
    options:
      A: K is husband of S.
      B: Y is son of S.
      C: J is daughter of P.
      D: P is paternal uncle of R.
    answer: C
    explanation: |-
      P is K's brother; K is Y's father; Y is J's brother; J is S's daughter; S is R's mother. So K and S are a couple with children Y, J and R.
      J is P's niece, not his daughter, so C is wrong; P is R's paternal uncle.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q006
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the following series.

      45, 47, 53, 65, 85, ?
    options:
      A: "105"
      B: "115"
      C: "130"
      D: "145"
    answer: B
    explanation: The differences are 2, 6, 12, 20, 30 (n² + n), so the next term is 85 + 30 = 115.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q007
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown, the six faces of which are numbered from 1 to 6. Select the number that will be on the face opposite to the one showing ‘6’.

      *(Figure: Three views of one dice (top; front-left; front-right): (4; 1, 3), (6; 2, 1), (3; 1, 2).)*
    options:
      A: "2"
      B: "4"
      C: "5"
      D: "3"
    answer: D
    explanation: 1 touches 4, 3, 6 and 2, so 1 is opposite 5. 3 touches 4, 1 and 2, so 3 must be opposite 6.
    tags:
      - reasoning
  - slug: cgl-2020-03-05-s3-q008
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A large triangle whose apex is joined to a point on the right forming a quadrilateral outline; a vertical line from the apex to the base, three horizontal lines across the left triangle, and a small grid of short vertical and horizontal lines in the lower right part.)*
    options:
      A: "27"
      B: "24"
      C: "25"
      D: "26"
    answer: C
    explanation: |-
      From the apex: 3 triangles on each of the top short line, the third line and the base, and 6 on the long line reaching the right corner = 15.
      Add the right-hand triangle itself (1) and 9 small ones with a vertex at the bottom-right corner: 25.
    tags:
      - reasoning
