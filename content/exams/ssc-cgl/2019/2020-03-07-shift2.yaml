      B: (2 + 3√2)/4
      C: (2 + √2)/4
      D: (3 + √2)/2
    answer: A
    explanation: |-
      **Disputed.** SSC's answer is A; our check suggests C.

      From 3(1 + tan²θ) + tanθ = 7: 3tan²θ + tanθ − 4 = 0, so tanθ = 1 and θ = 45°.
