    answer: B
    explanation: "Dictionary order: Tamarind, Temper, Temple, Tenacity, Tender = 3, 1, 2, 5, 4."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q017
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A tall rectangle. In its upper part two lines from the top corners cross at the centre (an X) and reach the
      ends of a horizontal line across the rectangle; short horizontal lines and a small square sit near the top
      centre, and a short horizontal line runs from the left side to the crossing point. The lower part is split
      in two by a vertical line.)*
    options:
      A: "20"
      B: "17"
      C: "19"
      D: "21"
    answer: C
    explanation: The official answer is 19 triangles, counted from the figure (an X across the upper part with small boxes near the top).
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      11 : 265 :: 20 : ?
    options:
      A: "840"
      B: "838"
      C: "835"
      D: "841"
    answer: D
    explanation: 11 → 11² + 12² = 121 + 144 = 265. So 20 → 20² + 21² = 400 + 441 = 841.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q020
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      1. All toys are pens.  
      2. All games are pens.

      **Conclusions:**

      I. No toy is a game.  
      II. No pen is a game.  
      III. Some toys are games.
    options:
      A: All conclusions I, II and III follow.
      B: Only conclusions II and III follow.
      C: Only conclusions I and II follow.
      D: Either conclusion I or III follows.
    answer: D
    explanation: Toys and games are both inside pens, but their relation to each other is unknown. I ('no toy is a game') and III ('some toys are games') form a complementary pair, so either I or III follows.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q021
    difficulty: medium
    stem: |-
      Select the option in which the numbers are related in the same way as are the numbers in the given set.

      (45, 24, 441)
    options:
      A: (41, 18, 630)
      B: (30, 60, 1024)
      C: (50, 30, 480)
      D: (35, 17, 324)
    answer: D
    explanation: (45 − 24)² = 21² = 441. Likewise (35 − 17)² = 18² = 324.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q022
    difficulty: medium
    stem: |-
      If 'A' stands for ‘subtraction’, ‘B’ stands for 'multiplication', ‘C’ stands for 'addition', and ‘D’ stands for 'division', then what is the value of the following expression?

      27 A 8 B 5 C (11 C 3) B 5 C 36 D 6
    options:
      A: "60"
      B: "20"
      C: "24"
      D: "63"
    answer: D
    explanation: 27 − 8 × 5 + (11 + 3) × 5 + 36 ÷ 6 = 27 − 40 + 70 + 6 = 63.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q023
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the odd letter-cluster.
    options:
      A: EHKN
      B: TWZC
      C: PSVY
      D: NOSV
    answer: D
    explanation: EHKN, TWZC and PSVY each go up by 3 letters at a time; NOSV goes +1, +4, +3.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q025
    difficulty: medium
    stem: |-
      A − B means ‘A is the mother of B’;

      A × B means ‘A is the sister of B’;

      A ÷ B means ‘A is the daughter of B’.

      Which of the following expressions means 'U is the daughter of Q'?
    options:
      A: Q − Z ÷ U × K
      B: K − Z ÷ U × Q
      C: Q − Z × U ÷ K
      D: K − U ÷ Z × Q
    answer: C
    explanation: "Q − Z × U ÷ K: Q is Z's mother, Z is U's sister, and U is K's daughter. So U is Q's child and female: Q's daughter."
    tags:
      - reasoning
