      C: "20"
      D: "15"
    answer: C
    explanation: (a + b + c)² = 300 + 2 × 50 = 400, so a + b + c = 20.
    tags:
      - quant
  - slug: cgl-2020-03-07-s2-q056
    difficulty: medium
    stem: The perimeter of an isosceles triangle is 50 cm. If the base is 18 cm, then find the length of the equal sides.
    options:
