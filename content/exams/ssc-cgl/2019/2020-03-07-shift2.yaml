  - slug: cgl-2020-03-07-s2-q054
    difficulty: medium
    stem: A contract is to be completed in 75 days and 187 men are to work 15 hours per day. After 65 days, 3/5 of the work is completed. How many additional men may be employed, so that the work may be completed in time, each man now working 17 hours per day?
    options:
      A: "514"
      B: "532"
      C: "528"
      D: "495"
    answer: C
    explanation: "3/5 of the work took 187 × 65 × 15 man-hours, so the remaining 2/5 needs 2/3 of that. In 10 days at 17 h: men = (2/3 × 187 × 65 × 15)/(10 × 17) = 715. Extra men = 715 − 187 = 528."
    tags:
      - quant
  - slug: cgl-2020-03-07-s2-q055
