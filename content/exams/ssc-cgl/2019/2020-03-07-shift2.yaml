source: "SSC candidate response sheet with the official answer marked (via https://www.adda247.com/jobs/wp-content/uploads/sites/22/2025/06/04130019/SSC-CGL-QUESTION-PAPER-07-March-2020-Shift-2-E). Left out (picture-only options or incomplete in the source): Q7, Q9, Q13, Q18, Q24."
questions:
  - slug: cgl-2020-03-07-s2-q001
    difficulty: medium
    stem: |-
      A cube is made by folding the given sheet. In the cube so formed, which of the following pairs of numbers will be on opposite sides?

      *(Figure: Net of a cube: a vertical column of four squares 1, 4, 6, 2 (top to bottom); square 5 is attached to the right
      of 4, and square 3 is attached to the left of 2.)*
    options:
      A: 1 and 5
      B: 1 and 2
      C: 2 and 4
      D: 3 and 6
    answer: C
    explanation: "In the column 1-4-6-2, alternate squares are opposite: 1 and 6, 4 and 2. The side squares 5 and 3 are opposite each other."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q002
    difficulty: medium
    stem: In a certain code language, 'SOLID' is coded as '64' and 'POUR' is coded as '74'. How will 'TON' be coded as in that language?
    options:
      A: "52"
      B: "49"
      C: "85"
      D: "60"
    answer: A
    explanation: "Code = sum of letter positions + number of letters: SOLID 59 + 5 = 64, POUR 70 + 4 = 74. TON: 49 + 3 = 52."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q003
    difficulty: medium
    stem: ‘Diabetes’ is related to ‘Blood Sugar’ in the same way as ‘Hypertension’ is related to ‘________’.
    options:
      A: Body Cells
      B: Blood Pressure
      C: Heart
      D: Red Blood Cells
    answer: B
    explanation: Diabetes is a disorder of blood sugar; hypertension is high blood pressure.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q004
    difficulty: medium
    stem: In a certain code language, 'PAINTS' is written as 'CRPKUV'. How will 'PURITY' be written as in that language?
    options:
      A: WRKTAV
      B: WRKSNU
      C: XSISBM
      D: VSKTAZ
    answer: A
    explanation: "Take the letters in pairs, swap each pair and move both letters +2: PA→AP→CR, IN→NI→PK, TS→ST→UV. PURITY: UP→WR, IR→KT, YT→AV, giving WRKTAV."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q005
    difficulty: medium
    stem: What day of the week was 31 January 2007?
    options:
      A: Tuesday
      B: Wednesday
      C: Monday
      D: Thursday
    answer: B
    explanation: 1 January 2007 was a Monday. 31 January is 30 days later (4 weeks + 2 days), so it was a Wednesday.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q006
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 14 | 17 | 22 |
      | 49 | 61 | ? |
      | 189 | 237 | 317 |
    options:
      A: "71"
      B: "79"
      C: "81"
      D: "83"
    answer: C
    explanation: "Down each column, ×4 − 7: 14 → 49 → 189 and 17 → 61 → 237. So 22 → 81 → 317."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q008
    difficulty: medium
    stem: Four words have been given, out of which three are alike in some manner and one is different. Select the odd word.
    options:
      A: Litre
      B: Distance
      C: Kilogram
      D: Minute
    answer: B
    explanation: Litre, kilogram and minute are units; distance is a quantity, not a unit.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q010
    difficulty: medium
    stem: Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the number-pair that is different from the rest.
    options:
      A: "44 : 136"
      B: "30 : 94"
      C: "33 : 109"
      D: "27 : 85"
    answer: C
    explanation: In the others, second = 3 × first + 4 (44→136, 30→94, 27→85). 33 × 3 + 4 = 103, not 109.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q011
    difficulty: medium
    stem: |-
      Select the letter-cluster that can replace the question mark (?) in the following series.

      PERSONA, ANPERSO, ANOSPER, ?
    options:
      A: ANOSREP
      B: ANOSERP
      C: ANSORPE
      D: NOSAREP
    answer: A
    explanation: "Numbering PERSONA 1-7: the series goes 1234567 → 7612345 → 7654123 → 7654321. So the next is ANOSREP."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q012
    difficulty: medium
    stem: |-
      Select the letter will replace the question mark (?) in the following series.

      C, B, B, C, Z, E, W, H, S, ? , N
    options:
      A: K
      B: I
      C: L
      D: P
    answer: C
    explanation: Two series alternate. Odd terms C, B, Z, W, S, N go back 1, 2, 3, 4, 5 places. Even terms B, C, E, H, ? go forward 1, 2, 3, 4, so H + 4 = L.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q014
    difficulty: medium
    stem: |-
      Select the option in which the words share the same relationship as that shared by the given pair of words.

      Office : Work
    options:
      A: "School : Study"
      B: "Hospital : Director"
      C: "House : Bricks"
      D: "Court : Lawyer"
    answer: A
    explanation: An office is a place for work; a school is a place for study.
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q015
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the following series.

      35, 36, 40, ? , 83, 208, 244
    options:
      A: "55"
      B: "60"
      C: "67"
      D: "73"
    answer: C
    explanation: "The differences alternate cubes and squares: +1³, +2², +3³, +4², +5³, +6². 40 + 27 = 67."
    tags:
      - reasoning
  - slug: cgl-2020-03-07-s2-q016
    difficulty: medium
    stem: |-
