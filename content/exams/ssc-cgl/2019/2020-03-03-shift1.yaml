  - slug: cgl-2020-03-03-s1-q017
    difficulty: medium
    stem: |-
      Select the letter-cluster that can replace the question mark (?) in the following series.

      CXB, HUI, MRP, ROW, ?
    options:
      A: VKD
      B: VKC
      C: WLZ
      D: WLD
    answer: D
    explanation: "The 1st letters go +5 (C, H, M, R, W), the 2nd −3 (X, U, R, O, L) and the 3rd +7 (B, I, P, W, D): WLD."
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q018
    difficulty: medium
    stem: In a certain code language, ‘HARVEST’ is coded as ‘22-21-7-24-20-3-10’.  How will ‘FARMER’ be coded as in that language?
    options:
      A: 20-7-14-21-3-8
      B: 19-7-15-19-3-8
      C: 19-7-15-20-3-7
      D: 20-7-15-20-3-8
    answer: D
    explanation: Write the word backwards and add 2 to each letter's position (T = 20 → 22 ...). FARMER → R, E, M, R, A, F → 20-7-15-20-3-8.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number and the sixth number is related to the fifth number.

      12 : 72 :: 18 : ? :: 22 : 242
    options:
      A: "162"
      B: "164"
      C: "140"
      D: "160"
    answer: A
    explanation: "The second number is half the square of the first: 12²/2 = 72, 22²/2 = 242, and 18²/2 = 162."
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q020
    difficulty: medium
    stem: |-
      Select the option in which the words share the same relationship as that shared by the given pair of words.

      Clock : Time
    options:
      A: "Ammeter : Current"
      B: "Taseometer : Wind"
      C: "Balance : Scale"
      D: "Anemometer : Strains"
    answer: A
    explanation: A clock measures time; an ammeter measures electric current.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q021
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 6 | 21 | 14 |
      | 40 | 500 | ? |
      | 8 | 25 | 7 |
    options:
      A: "98"
      B: "84"
      C: "91"
      D: "78"
    answer: C
    explanation: "In each column, middle = top × bottom − bottom: 6 × 8 − 8 = 40, 21 × 25 − 25 = 500, and 14 × 7 − 7 = 91."
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q022
    difficulty: medium
    stem: |-
      How many rectangles are there in the given figure?

      *(Figure: A Z-shaped figure: a vertical column of six stacked boxes. A wide box split by two horizontal lines into three strips is attached to the left side of the top two boxes, and another wide box split into three strips is attached to the right side of the bottom two boxes. The strip lines of the side boxes do not line up with the lines of the column.)*
    options:
      A: "34"
      B: "32"
      C: "30"
      D: "33"
    answer: D
    explanation: SSC gives 33. Count the rectangles in the six-box column and in each three-strip side box, then those that join a side box with the boxes next to it.
