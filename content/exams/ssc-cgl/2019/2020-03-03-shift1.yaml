    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q009
    difficulty: medium
    stem: In a certain code language, WARDROBE is written as YXVYXHJV. How will ACCURATE be written as in that language?
    options:
      A: BZHPXTBV
      B: CZHPYTBV
      C: CZGPXTBV
      D: DZGPXTBV
    answer: C
    explanation: The shifts are +2, −3, +4, −5, +6, −7, +8, −9 (wrapping round the alphabet). ACCURATE becomes CZGPXTBV.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q010
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the following series.

      17, 21, 30, 46, 71, ?
    options:
      A: "105"
      B: "96"
      C: "107"
      D: "101"
    answer: C
    explanation: The differences are 4, 9, 16, 25 (squares), so next is 71 + 36 = 107.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q011
    difficulty: medium
    stem: |-
      The given Venn diagram represents employees in an organisation:

      The triangle represents executives, the circle represents females, the rectangle represents MBAs and the square represents technical staff. The numbers given in the diagram represent the number of persons in that particular category.

      How many female executives are there in the organisation?

      *(Figure: Venn diagram: a wide rectangle (MBAs), a circle (females) overlapping its upper middle, a small square (technical staff) overlapping the circle's upper right and extending above the rectangle, and a triangle (executives) whose apex enters the circle from below and whose base hangs below the rectangle.
      Numbers: 2 (circle only, above the rectangle); 3 (circle and square, above the rectangle); 10 (circle and rectangle); 4 (circle, rectangle and square); 6 (square and rectangle, outside the circle); 25 (rectangle only); 5 (circle, rectangle and triangle); 11 (rectangle and triangle, outside the circle); 15 (triangle only, below the rectangle).)*
    options:
      A: "10"
      B: "5"
      C: "15"
      D: "11"
    answer: B
    explanation: Female executives are in both the circle and the triangle; that region holds 5.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q012
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      1. Some animals are elephants.
      2. Some elephants are tigers.

      **Conclusions:**

      I. Some animals are tigers.
      II. No tiger is an animal.
    options:
      A: Only conclusion I follows.
      B: Either conclusion I or II follows.
      C: Neither conclusion I nor II follows.
      D: Only conclusion II follows.
    answer: B
    explanation: Neither conclusion follows on its own, but "Some animals are tigers" and "No tiger is an animal" are a complementary pair, so either I or II must be true.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q013
    difficulty: medium
    stem: |-
      Two positions of the same dice are shown. Select the number that will be on the face opposite to the one showing 6.

      *(Figure: Two views of the same die. (a) top 3, front 1, right 5. (b) top 6, front 3, right 5.)*
    options:
      A: "4"
      B: "5"
      C: "1"
      D: "3"
    answer: C
    explanation: 3 and 5 are in the same places in both views, so the faces in the third position, 1 and 6, are opposite each other.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q014
    difficulty: medium
    stem: |-
      Select the set of letters that when sequentially placed in the blanks of the given letter series will complete the series.

      k_lmml_mk_mmk_lkkl_m
    options:
      A: k, l, m, k, k
      B: l, k, m, k, k
      C: k, l, k, l, m
      D: k, m, m, k, l
    answer: C
    explanation: Filling k, l, k, l, m gives kklmm | llmkk | mmkll | kklmm, a repeating AABCC pattern that rotates k → l → m.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q016
    difficulty: medium
    stem: |-
