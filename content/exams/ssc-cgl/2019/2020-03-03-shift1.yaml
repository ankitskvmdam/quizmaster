  - slug: cgl-2020-03-03-s1-q052
    difficulty: medium
    stem: |-
      The given table shows the number (in thousands) of cars of five different models A, B, C, D and E produced during Years 2012-2017. Study the table and answer the question that follow.

      | | A | B | C | D | E | Total |
      |---|---|---|---|---|---|---|
      | 2012 | 18 | 26 | 22 | 23 | 31 | 120 |
      | 2013 | 22 | 18 | 32 | 40 | 18 | 130 |
      | 2014 | 32 | 43 | 26 | 35 | 34 | 170 |
      | 2015 | 18 | 22 | 26 | 14 | 20 | 100 |
      | 2016 | 36 | 12 | 44 | 38 | 50 | 180 |
      | 2017 | 12 | 48 | 40 | 22 | 28 | 150 |

      If 2013 and 2014 are put together, which type of cars constitute exactly 25% of the total number of cars produced in those 2 years?
    options:
      A: E
      B: B
      C: D
      D: C
    answer: C
    explanation: The 2013 and 2014 totals add to 300 thousand, and 25% is 75. Type D gives 40 + 35 = 75.
    tags:
      - quant
  - slug: cgl-2020-03-03-s1-q053
    difficulty: medium
    stem: "If x = 4cosA + 5sinA and y = 4sinA − 5cosA, then the value of x² + y² is:"
    options:
      A: "25"
      B: "41"
      C: "0"
      D: "16"
    answer: B
    explanation: "Squaring and adding, the cross terms cancel: x² + y² = (4² + 5²)(sin²A + cos²A) = 41."
    tags:
      - quant
  - slug: cgl-2020-03-03-s1-q054
    difficulty: medium
    stem: |-
