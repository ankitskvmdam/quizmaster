source: "SSC candidate response sheet with the official answer marked (via https://www.adda247.com/jobs/wp-content/uploads/sites/22/2025/06/04125933/SSC-CGL-QUESTION-PAPER-03-March-2020-Shift-1-E). Left out (picture-only options or incomplete in the source): Q3, Q15, Q23, Q25."
questions:
  - slug: cgl-2020-03-03-s1-q001
    difficulty: medium
    stem: |-
      Which two numbers should be interchanged to make the given equation correct?

      9 + 7 × 5 – 18 ÷ 2 = 3 × 4 – 10 + 45 ÷ 5
    options:
      A: 18 and 45
      B: 7 and 4
      C: 2 and 5
      D: 9 and 3
    answer: B
    explanation: Swapping 7 and 4 gives 9 + 4 × 5 − 18 ÷ 2 = 20 and 3 × 7 − 10 + 45 ÷ 5 = 20.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q002
    difficulty: medium
    stem: |-
      Arrange the following words in the order in which they appear in an English dictionary.

      1. Rightly
      2. Rigidly
      3. Righteous
      4. Rigour
      5. Rights
    options:
      A: 3, 5, 1, 4, 2
      B: 3, 1, 5, 4, 2
      C: 3, 1, 5, 2, 4
      D: 1, 3, 5, 2, 4
    answer: C
    explanation: 'After "right", e < l < s gives Righteous, Rightly, Rights; then "rigi" comes before "rigo": 3, 1, 5, 2, 4.'
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q004
    difficulty: medium
    stem: "The ratio of the present ages of Asha and Lata is 5 : 6. If the difference between their ages is 6 years, then what will be Lata's age will be after 5 years?"
    options:
      A: "35"
      B: "41"
      C: "45"
      D: "40"
    answer: B
    explanation: The difference of 1 part is 6 years, so Lata is 6 × 6 = 36 now and will be 41 in 5 years.
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q005
    difficulty: medium
    stem: |-
      Select the option in which the numbers are related in the same way as are the numbers in the given set.

      (269, 278, 296)
    options:
      A: (313, 322, 340)
      B: (577, 586, 598)
      C: (419, 430, 448)
      D: (109, 118, 128)
    answer: A
    explanation: (269, 278, 296) goes +9, +18. So does (313, 322, 340).
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q006
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner, while one is different. Select the odd letter-cluster.
    options:
      A: BYGT
      B: NMSH
      C: FVKO
      D: DWIR
    answer: C
    explanation: "In BYGT, NMSH and DWIR each pair is opposite letters (positions add to 27: B-Y, G-T ...). In FVKO, F + V = 6 + 22 = 28."
    tags:
      - reasoning
  - slug: cgl-2020-03-03-s1-q007
    difficulty: medium
    stem: Amit is the brother of Sonia. Jyoti is the sister of Nikita. Sonia is the daughter of Satish's father. Nikita is the daughter of Kavinder. Jyoti is the mother of Amit. Mukesh is Nikita's only sister's husband. How is Satish related to Kavinder?
    options:
      A: Son
      B: Brother
      C: Grandson
      D: Son-in-law
    answer: C
    explanation: Satish is Sonia's and Amit's brother, so Jyoti is his mother. Jyoti is Nikita's sister, so she is Kavinder's daughter, which makes Satish Kavinder's grandson.
    tags:
      - reasoning
