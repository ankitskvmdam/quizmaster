    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q009
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Select the symbol that will be on the face opposite to the one showing ‘ + ’.

      *(Figure: Three views of one die (top, front, right): 1) top #, front @, right \$; 2) top %, front *, right @;
      3) top #, front +, right %.)*
    options:
      A: "#"
      B: \$
      C: "*"
      D: "@"
    answer: D
    explanation: "# touches @, \\$, % and +, so # is opposite *. @ touches #, \\$, % and *, so @ is opposite +."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q010
    difficulty: medium
    stem: |-
