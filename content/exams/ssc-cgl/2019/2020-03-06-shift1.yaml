questions:
  - slug: cgl-2020-03-06-s1-q001
    difficulty: medium
    stem: Four words have been given, out of which three are alike in some manner and one is different. Select the odd word.
    options:
      A: Saxophone
      B: Trumpet
      C: Clarinet
      D: Xylophone
    answer: D
    explanation: Saxophone, trumpet and clarinet are wind instruments; the xylophone is a percussion instrument.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q002
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the following series.

      5, 10, 26, ? , 122, 170
    options:
      A: "77"
      B: "50"
      C: "82"
      D: "65"
    answer: B
    explanation: "Each term is (prime)² + 1: 2²+1, 3²+1, 5²+1, 7²+1 = 50, 11²+1, 13²+1."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q003
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the following series.

      62, 66, 74, 90, ?
    options:
      A: "116"
      B: "120"
      C: "106"
      D: "122"
    answer: D
    explanation: "The differences double: +4, +8, +16, +32. 90 + 32 = 122."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q004
    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      12 + 81 − 27 × 9 ÷ 3 − 36
    options:
      A: − and ÷
      B: × and −
      C: + and ×
      D: ÷ and ×
    answer: A
    explanation: Reading the last sign as '=', swapping − and ÷ gives 12 + 81 ÷ 27 × 9 − 3 = 12 + 27 − 3 = 36.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q005
    difficulty: medium
    stem: |-
      A + B means ‘A is the husband of B’;

      A − B means ‘B is the sister of A’;

      A × B means ‘A is the mother of B’;

      A ÷ B means ‘B is the son of A’.

      If, P + R × T − Q ÷ S + U, then how is P related to S?
    options:
      A: Uncle
      B: Maternal grandfather
      C: Father-in-law
      D: Paternal grandfather
    answer: B
    explanation: P is R's husband and R is T's mother; Q is T's sister, so Q is P's daughter. S is Q's son, so P is S's maternal grandfather.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q006
    difficulty: medium
    stem: |-
      In the given Venn diagram, the ‘rectangle’ represents ‘travellers who like to travel by plane’, the ‘circle’ represents ‘travellers who like to travel by bus’, and the ‘triangle’ ‘represents travellers who like to travel by train’. The numbers given in the diagram represent the number of travellers in that particular category.

      How many travellers like to travel either by train or plane but NOT by bus?

      *(Figure: Venn diagram of a rectangle (plane), a circle (bus) and a triangle (train). Numbers: circle only 10; circle and
      triangle only 2; triangle only 11; circle and rectangle only 5; all three 9; triangle and rectangle only 6;
      rectangle only 13.)*
    options:
      A: "27"
      B: "36"
      C: "30"
      D: "29"
    answer: C
    explanation: Train or plane but not bus = triangle only (11) + rectangle only (13) + triangle-and-rectangle only (6) = 30.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q007
    difficulty: medium
    stem: |-
      Select the letter-cluster that can replace the question mark (?) in the following series.

      ADG, CGK, EJO, ? , IPW
    options:
      A: GNS
      B: GMS
      C: GMZ
      D: GNZ
    answer: B
    explanation: The first letters move +2 (A, C, E, G, I), the second +3 (D, G, J, M, P), the third +4 (G, K, O, S, W). So GMS.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q008
    difficulty: medium
    stem: In a certain code language, 'DKQX' is written as 'WPJC'. How will 'AFKP' be written as in that language?
    options:
      A: ZUPK
      B: ZUQJ
      C: ZVQL
      D: ZTOK
    answer: A
