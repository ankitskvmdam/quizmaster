  - slug: cgl-2020-03-06-s1-q012
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the odd letter-cluster.
    options:
      A: FBL
      B: DDP
      C: GCV
      D: BJT
    answer: C
    explanation: In FBL, DDP and BJT the third letter's position is the product of the first two (6×2 = 12, 4×4 = 16, 2×10 = 20). In GCV, 7×3 = 21 ≠ V (22).
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q014
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      1. Some machines are kites.
      2. No machine is a pigeon.

      **Conclusions:**

      I. Some machines are pigeons.
      II. All kites are pigeons.
      III. Some kites are not pigeons.
    options:
      A: Only conclusions I and II follow.
      B: Only conclusions I and III follow.
      C: Only conclusion III follows.
      D: Only conclusion II follows.
    answer: C
    explanation: Some machines are kites and no machine is a pigeon, so those kites are not pigeons. III follows; I and II do not.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q015
    difficulty: medium
    stem: |-
      Arrange the following words in a logical and meaningful order.

      1. Quadrillion
      2. Quintillion
      3. Million
      4. Octillion
      5. Trillion
    options:
      A: 4-3-5-1-2
      B: 3-5-1-2-4
      C: 2-3-5-1-4
      D: 3-5-1-4-2
    answer: B
    explanation: "In ascending order: million, trillion, quadrillion, quintillion, octillion = 3-5-1-2-4."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q016
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 23 | 5 | 110 |
      | 56 | 9 | 121 |
      | 49 | 3 | ? |
    options:
      A: "77"
      B: "111"
      C: "95"
      D: "113"
    answer: A
    explanation: "Third = (first + second) + its digits reversed: 23 + 5 = 28 and 28 + 82 = 110; 56 + 9 = 65 and 65 + 56 = 121; 49 + 3 = 52 and 52 + 25 = 77."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q017
    difficulty: medium
    stem: Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the number-pair that is different from the rest.
    options:
      A: "11 : 121"
      B: "17 : 289"
      C: "13 : 169"
      D: "15 : 250"
    answer: D
    explanation: 11² = 121, 17² = 289, 13² = 169, but 15² = 225, not 250.
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q019
    difficulty: medium
    stem: In a certain group of men and horses, the total number of legs is 14 more than twice the number of heads. How many horses are there in the group?
    options:
      A: "7"
      B: "11"
      C: "5"
      D: "9"
    answer: A
    explanation: Legs = 2 × heads + 2 × horses (each horse has 2 extra legs). So 2 × horses = 14, and there are 7 horses.
    tags:
      - reasoning
