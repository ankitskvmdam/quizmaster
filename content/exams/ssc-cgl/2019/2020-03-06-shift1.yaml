  - slug: cgl-2020-03-06-s1-q053
    difficulty: medium
    stem: |-
      Solve the following.

      sin40°/cos50° + cosec50°/sec40° − 4cos50° cosec40°
    options:
      A: "2"
      B: −2
      C: −1
      D: "1"
    answer: B
    explanation: sin40°/cos50° = 1 and cosec50°/sec40° = cos40°/sin50° = 1, while 4cos50°·cosec40° = 4. So 1 + 1 − 4 = −2.
    tags:
      - quant
  - slug: cgl-2020-03-06-s1-q054
    difficulty: medium
    stem: "The average of the marks of 30 boys is 88, and when the top two scores were excluded, the average marks reduced to 87.5. If the top two scores differ by 2, then the highest mark is:"
    options:
      A: "92"
      B: "96"
      C: "94"
