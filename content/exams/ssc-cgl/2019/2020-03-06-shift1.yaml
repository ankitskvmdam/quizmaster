  - slug: cgl-2020-03-06-s1-q021
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A rectangle split by a vertical line into a larger left part and a smaller right part, with a horizontal line
      across the whole rectangle near the bottom. One diagonal runs from the top-left corner of the rectangle to the
      bottom of the vertical line; another runs from the bottom-left corner up to the top of the vertical line. A line
      runs from a point on the top edge of the left part down to the bottom-right corner of the rectangle, and a line
      runs from the top-right corner down to where that line crosses the horizontal line.)*
    options:
      A: "28"
      B: "22"
      C: "16"
      D: "25"
    answer: D
    explanation: "Counting by the lines that form each triangle: 5 with both long diagonals, 4 with the diagonal and the line to the bottom-right corner, 2 near the top-right corner, and 14 made from one slanted line with one horizontal and one vertical line. Total 25."
    tags:
      - reasoning
  - slug: cgl-2020-03-06-s1-q022
    difficulty: medium
    stem: In a certain code language, 'PAGE' is coded as '161495'. How will 'PART' be coded as in that language?
    options:
      A: "16125020"
      B: "16128620"
      C: "16132420"
      D: "16136220"
