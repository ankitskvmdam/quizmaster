    stem: The average of 46 numbers is 50.5. The average of the first 25 numbers is 45 and that of the last 18 numbers is 56. The 28th number is 67. If the 26th and 27th numbers are excluded, then what is the average of the remaining numbers?
    options:
      A: "51.5"
      B: "50.4"
      C: "50"
      D: "51"
    answer: C
    explanation: Total = 2323; first 25 = 1125 and last 18 = 1008, so the 26th–28th sum to 190 and the 26th + 27th = 123. The remaining 44 numbers average (2323 − 123)/44 = 50.
    tags:
      - quant
  - slug: cgl-2022-04-13-all-ss-shift3-q054
    difficulty: medium
    stem: What is the least number which when decreased by 7 is divisible by 15, 24, 28 and 32?
