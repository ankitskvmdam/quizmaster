  - slug: cgl-2022-04-13-all-ss-shift3-q011
    difficulty: medium
    stem: If Arpita is the only daughter of Pritam's wife's mother's husband, then how is Arpita related to Pritam's son?
    options:
      A: Sister
      B: Paternal granddaughter
      C: Daughter
      D: Mother
    answer: D
    explanation: Pritam's wife's mother's husband is his father-in-law, whose only daughter is Pritam's wife. Arpita is therefore the mother of Pritam's son.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q012
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      No police officer is a doctor.  
      Some doctors are specialists.  
      All engineers are doctors.

      **Conclusions:**

      I. Some engineers are police officers.  
      II. No engineer is a police officer.  
      III. Some doctors are engineers.
    options:
      A: Only conclusion II follows.
      B: Only conclusions I and II follow.
      C: Either conclusion I or II and III follow(s).
      D: Only conclusions II and III follow.
    answer: D
    explanation: All engineers are doctors and no doctor is a police officer, so no engineer is a police officer (II). Engineers exist inside doctors, so some doctors are engineers (III).
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q013
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in a logical and meaningful order.

      1. Displaying  
