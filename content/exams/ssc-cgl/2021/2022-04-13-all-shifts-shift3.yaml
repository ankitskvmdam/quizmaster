  - slug: cgl-2022-04-13-all-ss-shift3-q052
    difficulty: medium
    stem: Let x cm² be the surface area and y cm³ be the volume of a sphere such that y = 14x. What is the radius (in cm) of the sphere?
    options:
      A: "102"
      B: "42"
      C: "51"
      D: "68"
    answer: B
    explanation: (4/3)πr³ = 14 × 4πr² gives r/3 = 14, so r = 42 cm.
    tags:
