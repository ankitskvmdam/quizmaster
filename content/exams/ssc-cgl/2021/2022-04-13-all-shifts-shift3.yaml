questions:
  - slug: cgl-2022-04-13-all-ss-shift3-q001
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      240, 120, ?, 180, 360, 900
    options:
      A: "120"
      B: "148"
      C: "150"
      D: "130"
    answer: A
    explanation: "The multipliers rise by 0.5: 240 × 0.5 = 120, 120 × 1 = 120, 120 × 1.5 = 180, 180 × 2 = 360, 360 × 2.5 = 900."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q002
    difficulty: medium
    stem: In a certain code language, 'MANIA' is written as 'NZOHZ' and 'PROUD' is written as 'QSNTE'. How will 'DONKEY' be written in that language?
    options:
      A: EPOLFZ
      B: CNONDZ
      C: ENPLDX
      D: ENOLDZ
    answer: D
    explanation: Consonants move +1 and vowels move −1 (MANIA → NZOHZ, PROUD → QSNTE). DONKEY → E, N, O, L, D, Z.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q003
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: LRPV
      B: SYGM
      C: DBJH
      D: CNDV
    answer: D
    explanation: In LRPV, SYGM and DBJH both letter pairs have the same gap (+6, +6, −2). In CNDV the gaps are +11 and +18.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q004
    difficulty: medium
    stem: In a certain code language, LOOK is coded as 2330 and BALL is coded as 1413. How will HELP be coded in that language?
    options:
      A: "2417"
      B: "3461"
      C: "2415"
      D: "2420"
    answer: A
    explanation: "Code = (1st + 4th letter) then (2nd + 3rd letter): LOOK = 12 + 11 | 15 + 15 = 23|30. HELP = 8 + 16 | 5 + 12 = 24|17 = 2417."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q008
    difficulty: medium
    stem: If the numbers 15 and 21 are interchanged, then which of the following equations will be correctly balanced?
    options:
      A: 62 ÷ 31 – 21 + 15 × 3 = 80
      B: 26 + 21 × 15 ÷ 3 – 14 = 108
      C: 24 – 21 ÷ 3 + 15 – 7 = 23
      D: 63 ÷ 15 + 21 × 5 – 4 = 74
    answer: D
    explanation: After swapping 15 and 21, option D reads 63 ÷ 21 + 15 × 5 − 4 = 3 + 75 − 4 = 74.
    tags:
      - reasoning
