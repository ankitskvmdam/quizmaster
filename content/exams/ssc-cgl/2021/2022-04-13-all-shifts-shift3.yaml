    explanation: "A picture is sketched, coloured, framed and then displayed: 2, 3, 4, 1."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q014
    difficulty: medium
    stem: |-
      Select the number that can replace the question mark (?) in the given table.

      | | | |
      |---|---|---|
      | 5 | 16 | 77 |
      | 8 | 19 | 149 |
      | 13 | 12 | ? |
    options:
      A: "153"
      B: "157"
      C: "155"
      D: "151"
    answer: A
    explanation: "Third number = product − 3: 5 × 16 − 3 = 77 and 8 × 19 − 3 = 149, so 13 × 12 − 3 = 153."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q015
    difficulty: medium
    stem: Five friends, Vishnu, Chirag, Raina, Kavya and Surbhi, are sitting around a circular table, facing the centre. Vishnu is to the immediate right of Kavya. Chirag is third to the left of Kavya. Surbhi is not adjacent to Chirag. Who is second to the left of Kavya?
    options:
      A: Chirag
      B: Raina
      C: Surbhi
      D: Vishnu
    answer: B
    explanation: With Kavya fixed, Vishnu is on her right and Chirag third to her left. Surbhi cannot sit next to Chirag, so she is immediately left of Kavya and Raina is second to her left.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q016
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      7 : 56 :: 11 : ?
    options:
      A: "132"
      B: "77"
      C: "98"
      D: "101"
    answer: A
    explanation: 7 × 8 = 56, i.e. n × (n + 1). So 11 × 12 = 132.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q018
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown, the six faces of which are numbered from 1 to 6. Select the number that will be on the face opposite to the one having 4.

      *(Figure: Two dice views (top, left, right): (4, 2, 3); (5, 3, 2).)*
    options:
      A: "1"
      B: "5"
      C: "6"
      D: "2"
    answer: B
    explanation: Both views show 2 and 3 together, with 4 in the first and 5 in the second at the same corner. So 4 and 5 are the two faces adjacent to both 2 and 3, which means they are opposite each other.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q019
    difficulty: medium
    stem: The average score (runs/match) of Mithali before the start of the women's national series was 45. In the women's national series of 10 matches, her total score was 500 runs. Find the total number of matches played by her till date, if her new average after the series is 47.5.
    options:
      A: "38"
      B: "20"
      C: "30"
      D: "28"
    answer: B
    explanation: "If n matches were played before: 45n + 500 = 47.5(n + 10), so 2.5n = 25 and n = 10. Total = 10 + 10 = 20 matches."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q022
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      7, 11, 14, 25, 29, 55, ?
    options:
      A: "59"
      B: "60"
      C: "95"
      D: "90"
    answer: B
    explanation: "Alternate steps: ×2 − 3, then +3, +4, +5. 7 → 11 → 14 → 25 → 29 → 55 → 55 + 5 = 60."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q023
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter cluster.

      KCH : GXS :: TJD : ?
    options:
      A: QMX
      B: PQW
      C: PNH
      D: QNW
    answer: B
    explanation: The first letter moves −4 (K → G) and the other two are replaced by their opposites (C ↔ X, H ↔ S). TJD → P, Q, W.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q024
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      DJRZ, HDZP, LXHF, PRPV, ?
    options:
      A: TMXK
      B: TLXM
      C: ULYL
      D: TLXL
    answer: D
    explanation: "Positions move +4, −6, +8, −10: D→H→L→P→T, J→D→X→R→L, R→Z→H→P→X, Z→P→F→V→L. So TLXL."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift3-q025
    difficulty: medium
    stem: |-
      In a certain code language,

      'cool drinks available here' is written as 'bhu man juk lop',  
