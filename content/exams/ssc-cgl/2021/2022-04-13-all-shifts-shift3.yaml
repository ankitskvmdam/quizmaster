    stem: A person travels 5x distance at a speed of 5 km/h, x distance at a speed of 5 km/h, and 4x distance at a speed of 6 km/h, and takes a total of 112 minutes. What is the total distance (in km) travelled by the person?
    options:
      A: "8"
      B: "10"
      C: "9"
      D: "12"
    answer: B
    explanation: Time = 5x/5 + x/5 + 4x/6 = 28x/15 h = 112/60 h, so x = 1. Total distance = 10x = 10 km.
