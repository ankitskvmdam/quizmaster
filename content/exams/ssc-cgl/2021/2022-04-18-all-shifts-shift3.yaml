    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      2, 6, 10, 17, 52, 94, 472, ?
    options:
      A: "763"
      B: "861"
      C: "816"
      D: "736"
    answer: B
    explanation: The differences are 4, 4, 7, 35, 42, 378. They follow ×1, +3, ×5, +7, ×9, so the next difference is +11 = 389, and 472 + 389 = 861.
