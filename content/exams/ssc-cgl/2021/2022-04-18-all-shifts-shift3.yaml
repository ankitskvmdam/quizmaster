  - slug: cgl-2022-04-18-all-ss-shift3-q023
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      60 152 161  
      14 18 17  
      15 19 ?
    options:
      A: "23"
      B: "13"
      C: "19"
      D: "7"
    answer: A
    explanation: "Top = (product of the middle number’s digits) × bottom: 1×4 × 15 = 60 and 1×8 × 19 = 152, so 161 = 1×7 × 23."
    tags:
      - reasoning
