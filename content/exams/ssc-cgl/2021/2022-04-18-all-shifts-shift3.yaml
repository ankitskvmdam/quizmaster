    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q015
    difficulty: medium
    stem: A cube of side 12 cm is painted green on all the faces and then cut into smaller cubes of sides 2 cm each. Find the number of smaller cubes that have only one face painted.
    options:
      A: "68"
      B: "96"
      C: "78"
      D: "49"
    answer: B
    explanation: Each edge has 12 ÷ 2 = 6 small cubes. One-face cubes = 6 × (6 − 2)² = 96.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q016
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      578, 577, 568, 543, ?
    options:
      A: "528"
      B: "518"
      C: "532"
      D: "494"
    answer: D
    explanation: The differences are −1, −9, −25 (odd squares), so next is 543 − 49 = 494.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q018
    difficulty: medium
    stem: |-
      If ‘A’ denotes ‘addition’, ‘B’ denotes ‘multiplication’, ‘C’ denotes ‘subtraction’, and ‘D’ denotes ‘division’, then what will be the value of the following expression?

      441 D 7 A 21 B 6 C (189 D 7) A (46 C 12)
    options:
      A: "158"
      B: "169"
      C: "196"
      D: "185"
    answer: C
    explanation: 441 ÷ 7 + 21 × 6 − (189 ÷ 7) + (46 − 12) = 63 + 126 − 27 + 34 = 196.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number and the sixth number is related to the fifth number.

      16 : 263 :: 18 : ? :: 22 : 491
    options:
      A: "317"
      B: "361"
      C: "331"
      D: "340"
    answer: C
    explanation: "n² + 7: 16² + 7 = 263 and 22² + 7 = 491, so 18² + 7 = 331."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q020
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
