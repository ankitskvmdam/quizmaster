questions:
  - slug: cgl-2022-04-18-all-ss-shift3-q001
    difficulty: medium
    stem: What would be the ratio of the areas of two circles, i.e. Circle-A and Circle-B, the radius of which are 4 cm and 8 cm, respectively?
    options:
      A: "1 : 2"
      B: "1 : 16"
      C: "1 : 8"
      D: "1 : 4"
    answer: D
    explanation: "Area ∝ r², so the ratio is 4² : 8² = 16 : 64 = 1 : 4."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q002
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Likelihood  
      2. Likenesses  
      3. Likewise  
      4. Likens  
      5. Likeliest
    options:
      A: 5, 1, 2, 4, 3
      B: 5, 1, 2, 3, 4
      C: 1, 4, 2, 3, 5
      D: 5, 1, 4, 2, 3
    answer: A
    explanation: "Likeli-e-st comes before Likeli-h-ood, and Likene-s-ses before Liken-s, with Likewise last: 5, 1, 2, 4, 3."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q003
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

      PRACTISE : ACEIPRST :: TECHNOLOGY : ?
    options:
      A: HCETONYGLO
      B: CEGHLNOPTY
      C: CEGHLNOOTY
      D: CEGLHOONTY
    answer: C
    explanation: "The letters are rearranged in alphabetical order: PRACTISE → ACEIPRST. TECHNOLOGY → CEGHLNOOTY."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q004
    difficulty: medium
    stem: Anamika, Gopal, Nischal, Vanmayi, Shresta and Sripad are sitting in a straight line facing the north. Nischal is to the immediate left of Gopal. Shresta is between Anamika and Sripad. Sripad is at the second place from the right end. Four persons are sitting between Nischal and Vanmayi. If Gopal and Sripad interchange their positions, then who will be sitting between Vanmayi and Shresta?
    options:
      A: Anamika
      B: Gopal
      C: Sripad
      D: Nischal
    answer: B
    explanation: "From the left: Nischal, Gopal, Anamika, Shresta, Sripad, Vanmayi. After Gopal and Sripad swap, Gopal sits between Shresta and Vanmayi."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q005
    difficulty: medium
    stem: If 'sky' is called 'cloud', 'cloud' is called 'thunder', 'thunder' is called 'water', 'water' is called 'pot', 'pot' is called 'desert', and 'desert' is called 'sky', then where do fish live?
    options:
      A: cloud
      B: pot
      C: water
      D: desert
    answer: B
    explanation: Fish live in water, and water is called ‘pot’.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q007
    difficulty: medium
    stem: At the time of sunset, Lopa and Kritika are sitting facing each other. If the shadow of Lopa falls to the right of Kritika, in which direction is Kritika facing?
    options:
      A: South
      B: North
      C: East
      D: West
    answer: B
    explanation: At sunset the sun is in the west, so shadows fall to the east. Lopa’s shadow falls to Kritika’s right, so Kritika’s right is east and she faces north.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q008
    difficulty: medium
    stem: In a certain code language, ‘BHOPAL’ is coded as ‘6-24-45-48-3-36’, and ‘IMPHAL’ is coded as ‘27-39-48-24-3-36’. How will ‘KOHIMA’ be coded in that language?
    options:
      A: 22-30-27-24-39-6
      B: 33-45-24-27-39-3
      C: 33-30-24-18-39-9
      D: 22-45-24-18-26-3
    answer: B
    explanation: Each letter is coded as 3 × its alphabet position (B = 6, H = 24). KOHIMA → 33-45-24-27-39-3.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q009
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      GKH, DNL, WQO, TTS, GWH, ?
    options:
      A: KYP
      B: DZL
      C: KZO
      D: FYP
    answer: B
    explanation: "The middle letters go +3 (K, N, Q, T, W, Z), and the first and third letters repeat in a cycle of four: GWH repeats G_H, so next is D_L. The answer is DZL."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q010
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow from the statements.

      Statements:  
      Some lions are tigers.  
      All tigers are leopards.  
      All lions are animals.

      Conclusions:  
      I. Some animals are leopards.  
      II. Some leopards are lions.  
      III. Some animals are tigers.
    options:
      A: Only conclusions II and III follow.
      B: Only conclusions I and III follow.
      C: All conclusions I, II and III follow.
      D: Only conclusions I and II follow.
    answer: C
    explanation: Some lions are tigers, who are all leopards, so some leopards are lions (II). Those lions are animals, so some animals are tigers (III) and leopards (I).
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q012
    difficulty: medium
    stem: |-
      In the following Venn diagram, the hexagon stands for ‘captains’, the triangle stands for ‘girls’, the rectangle stands for ‘toppers’, and the circle stands for ‘social activists’. The given numbers represent the number of persons in that particular category.

      How many girls are toppers and captains also?

      *(Figure: Venn diagram of a triangle (girls), a horizontal rectangle (toppers), a circle (social activists) on the left and a hexagon (captains) on the right. Numbers: 6 in the triangle apex outside the rectangle; 9 in the rectangle only (top right); 15 in rectangle and circle only; 9 in rectangle, circle and triangle; 8 in rectangle, circle, triangle and hexagon; 5 in rectangle, triangle and hexagon; 18 in rectangle and hexagon only; 11 in circle only; 12 in circle and triangle; 7 in circle, triangle and hexagon; 10 in triangle and hexagon; 2 in hexagon only.)*
    options:
      A: "13"
      B: "15"
      C: "15"
      D: "17"
    answer: A
    explanation: "Girls who are both toppers and captains are the regions common to the triangle, rectangle and hexagon: 8 + 5 = 13. Options B and C are both printed as 15, but this does not affect the answer."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q013
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and make the given equation correct.

      63 * 90 * 42 * 230 * 46 * 3
    options:
      A: =, ×, +, ÷, −
      B: +, ÷, −, =, ×
      C: =, −, +, ÷, ×
      D: ×, ÷, =, −, +
    answer: C
    explanation: 63 = 90 − 42 + 230 ÷ 46 × 3 = 90 − 42 + 15 = 63.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift3-q014
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.

      d _ a _ b _ q d h _ a _ c q _ h _ a _ c q
    options:
