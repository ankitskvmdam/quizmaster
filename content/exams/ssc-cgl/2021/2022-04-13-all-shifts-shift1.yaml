questions:
  - slug: cgl-2022-04-13-all-ss-shift1-q001
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      24, ?, 52, 312, 320
    options:
      A: "42"
      B: "35"
      C: "30"
      D: "48"
    answer: D
    explanation: "The steps alternate ×2, +4, ×6, +8: 24 × 2 = 48, 48 + 4 = 52, 52 × 6 = 312, 312 + 8 = 320."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q002
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      All employees are tax-payers.  
      Some employees are farmers.  
      Some farmers are doctors.

      **Conclusions:**

      I. No farmer is a tax-payer.  
      II. Some farmers are tax-payers.
    options:
      A: Only conclusion II follows.
      B: Only conclusion I follows.
      C: Both the conclusions follow.
      D: Either conclusion I or II follows.
    answer: A
    explanation: Some employees are farmers and all employees are tax-payers, so some farmers are tax-payers. II follows and I is then false.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q003
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      ECDR, BGYW, YKTB, VOOG, ?, PWEQ
    options:
      A: SSJL
      B: RSIL
      C: SRJL
      D: SSKM
    answer: A
    explanation: "Letter by letter: the first goes −3, the second +4, the third −5 and the fourth +5. From VOOG the next term is SSJL."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q004
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: BUMD
      B: WPHY
      C: MFXO
      D: CZSH
    answer: D
    explanation: In BUMD, WPHY and MFXO each letter is 7, 8 and 9 places back from the one before (B→U→M→D). CZSH does not follow this (C − 7 = V, not Z).
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q006
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

      IVORY : ZWSPJ :: CREAM : ?
    options:
      A: BQDZL
      B: NFDQB
      C: DSFCN
      D: SNFDB
    answer: D
    explanation: The letters of IVORY are arranged in reverse alphabetical order (Y, V, R, O, I) and each is moved +1, giving ZWSPJ. CREAM → R, M, E, C, A → SNFDB.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q007
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Magnetic  
      2. Magnify  
      3. Magnet  
      4. Magical  
      5. Majesty
    options:
      A: 4, 3, 2, 1, 5
      B: 4, 3, 1, 2, 5
      C: 4, 1, 3, 2, 5
      D: 3, 1, 4, 2, 5
    answer: B
    explanation: "Dictionary order: Magical, Magnet, Magnetic, Magnify, Majesty, that is 4, 3, 1, 2, 5."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q008
    difficulty: medium
    stem: Five friends, H, I, J, K and L, are top rank holders of a school. The rank of H is just above the rank of K and just below the rank of L. I is at the top rank and J is not at the lowest rank. Who among them is at the lowest rank?
    options:
      A: M
      B: L
      C: K
      D: J
    answer: C
    explanation: I is first and L, H, K come in a row; J is not last, so the order is I, J, L, H, K. K has the lowest rank.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q009
    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      28 + 14 × 7 ÷ 5 – 18 = 20
    options:
      A: ÷ and +
      B: ÷ and –
      C: + and ×
      D: ÷ and ×
    answer: D
    explanation: Swapping ÷ and × gives 28 + 14 ÷ 7 × 5 − 18 = 28 + 10 − 18 = 20.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q010
    difficulty: medium
    stem: |-
      Which two signs need to be interchanged to make the following equation correct?

      72 × 18 ÷ 9 + 19 − 39 = 16
    options:
      A: − and ×
      B: + and ×
      C: − and +
      D: ÷ and ×
    answer: D
    explanation: Swapping ÷ and × gives 72 ÷ 18 × 9 + 19 − 39 = 36 + 19 − 39 = 16.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q011
    difficulty: medium
    stem: In a certain code language, 'POTATO' is coded as 32-30-40-2-40-30 and 'TURNIP' is coded as 40-42-36-28-18-32. How will 'RADISH' be coded in that language?
    options:
      A: 36-1-4-19-16
      B: 18-2-4-19-18
      C: 18-1-8-38-18
      D: 36-2-8-38-16
    answer: D
    explanation: Each letter is written as twice its position, so RADISH = 36-2-8-18-38-16. Option D is the only match; it leaves out the 18 for I, as printed in the paper.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q012
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number from among the given options that can replace the question mark (?) in it.15

      | | | |
      |---|---|---|
      | 15 | 81 | 12 |
      | 18 | 99 | 15 |
      | 17 | 120 | ? |
    options:
      A: "11"
      B: "13"
      C: "9"
      D: "16"
    answer: B
    explanation: |-
      Each row gives (first)² − (third)² = middle: 15² − 12² = 81 and 18² − 15² = 99.
      So 17² − ?² = 120 gives ?² = 169 and ? = 13.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q014
    difficulty: medium
    stem: In a class of 98 students, all play at least one of the three games — snooker, chess and tennis. 42 students play snooker, 49 play tennis, and 43 play chess. The total number of students who play any and only two games is 29. 5 students play all the three games. The number of students who play only snooker and only chess is equal. 11 students play only snooker and tennis. 6 students play only snooker and chess. How many students play only tennis?
    options:
      A: "21"
      B: "23"
      C: "20"
      D: "22"
    answer: A
    explanation: Only chess + tennis = 29 − 11 − 6 = 12. Only tennis = 49 − 11 − 12 − 5 = 21.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q015
    difficulty: medium
    stem: In a certain code language, 'this is fact' is written as 'cuz duz ruz', 'fact is fictional' is written as 'guz ruz cuz', and 'doubt is clear' is written as 'cuz kuz buz'. How will 'this is fictional' be written in that language?
    options:
      A: duz guz ruz
      B: duz buz cuz
      C: kuz guz ruz
      D: duz guz cuz
    answer: D
    explanation: "'is' = cuz (in all three), 'fact' = ruz (in 1 and 2), so 'this' = duz and 'fictional' = guz. 'this is fictional' = duz cuz guz (order doesn't matter), which is option D."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift1-q018
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      27 : 576 :: 19 : ?
    options:
      A: "328"
      B: "543"
      C: "256"
      D: "498"
    answer: C
    explanation: 27 → (27 − 3)² = 24² = 576. So 19 → 16² = 256.
    tags:
      - reasoning
