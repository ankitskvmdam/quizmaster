  - slug: cgl-2022-04-13-all-ss-shift1-q024
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown, the six faces of which are numbered from 1 to 6. Select the number that will be on the face opposite to the face having the number '3'.

      *(Figure: Two dice views (top, left, right): (5, 6, 3); (5, 1, 6).)*
    options:
      A: "2"
      B: "1"
      C: "6"
      D: "4"
    answer: B
    explanation: Both views show 5 on top. Reading round it, the side faces run 1, 6, 3, so 1 and 3 are not adjacent and must be opposite.
