      - reasoning
  - slug: cgl-2022-04-11-s2-q017
    difficulty: medium
    stem: Five persons are sitting in a row facing the north. One of the two persons at the extreme ends is an introvert and the other one is an extrovert. A thin person is sitting to the immediate right of an intelligent person. A weak person is sitting to the immediate left of the extrovert person. The intelligent person is sitting exactly between the introvert and the thin persons. Which of the following persons is sitting at the centre?
    options:
      A: Extrovert
      B: Intelligent
      C: Weak
      D: Thin
    answer: D
    explanation: "Introvert, intelligent and thin sit together from the left end; weak sits to the left of the extrovert at the right end. Order: introvert, intelligent, thin, weak, extrovert, so thin is in the centre."
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q018
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the one that is different.
    options:
      A: ZCGLS
      B: NQUZF
      C: LOSXD
      D: FIMRX
    answer: A
    explanation: In NQUZF, LOSXD and FIMRX the gaps are +3, +4, +5, +6. In ZCGLS the last gap is +7 (L→S), so it is the odd one.
