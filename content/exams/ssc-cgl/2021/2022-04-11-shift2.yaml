      A: FODUSZ
      B: FOUDSB
      C: FOVDBS
      D: OEUDQB
    answer: B
    explanation: "Each pair of letters is reversed and then moved one place forward: PA → AP → BQ. NE → FO, CT → UD, AR → SB, giving FOUDSB."
