  - slug: cgl-2022-04-11-s2-q019
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      10, 14, 31, 35, 73, 77, ?
    options:
      A: "154"
      B: "90"
      C: "157"
      D: "81"
    answer: C
    explanation: "The series alternates +4 and ×2 + 3: 14 × 2 + 3 = 31, 35 × 2 + 3 = 73, so 77 × 2 + 3 = 157."
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q020
    difficulty: medium
    stem: |-
      Which two digits should be interchanged to make the given equation correct?

      384÷16−72+9×10=2
    options:
      A: 3 and 7
      B: 7 and 9
      C: 4 and 8
      D: 6 and 9
    answer: B
    explanation: Swapping 7 and 9 gives 384 ÷ 16 − 92 + 7 × 10 = 24 − 92 + 70 = 2.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q021
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

