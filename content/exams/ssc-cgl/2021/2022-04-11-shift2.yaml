questions:
  - slug: cgl-2022-04-11-s2-q001
    difficulty: medium
    stem: |-
      Four different positions of the same dice are shown, the six faces of which are numbered from 1 to 6. Select the number that will be on the face opposite to the one having the number '1'.

      *(Figure: Four dice views (top, left, right): (1, 5, 4); (6, 3, 5); (2, 4, 3); (1, 4, 2).)*
    options:
      A: "6"
      B: "2"
      C: "4"
      D: "3"
    answer: D
    explanation: 1 touches 5, 4 and 2; 3 touches 6, 5, 4 and 2. So 3 is the only face left to be opposite 1.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q002
    difficulty: medium
    stem: Pamila is the granddaughter of Akun who is married to Nikita. Murali is the brother-in-law of Akun who has two daughters but no son. Rahul is the cousin of Kamal and brother of Pamila. Uday and Vanmay are the sons-in-law of Nikita. Vanmay is married to Yamini and they have two daughters and one son. Uday has one son and one daughter. Tina and Smita are the daughters of Yamini. Murali is unmarried. How is Yamini related to Rahul?
    options:
      A: Aunt
      B: Mother
      C: Sister
      D: Daughter
    answer: A
    explanation: Yamini's children are Tina, Smita and a son, so Pamila and Rahul are Uday's children. Yamini is the sister of their mother, so she is Rahul's aunt.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q004
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 7 | 13 | 174 |
      | 9 | 25 | 104 |
      | 11 | 30 | ? |
    options:
      A: "431"
      B: "335"
      C: "100"
      D: "129"
    answer: A
    explanation: |-
      Each row gives (first)³ − (second)²: 7³ − 13² = 343 − 169 = 174 and 9³ − 25² = 729 − 625 = 104.
      So 11³ − 30² = 1331 − 900 = 431.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q007
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      No pink is yellow.  
      No yellow is white.  
      All reds are yellows.

      **Conclusions:**

      I. No red is pink.  
      II. No red is white.  
      III. No white is yellow.
    options:
      A: Only conclusions I and II follow
      B: Only conclusions I and III follow
      C: Only conclusions II and III follow
      D: All the conclusions follow
    answer: D
    explanation: All reds are yellow and no yellow is pink or white, so no red is pink and no red is white. 'No yellow is white' also converts to 'No white is yellow'. All three follow.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q008
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      KYBA, FTEE, AOHI, VJKO, ?, LZQA
    options:
      A: PFNU
      B: QENU
      C: QEMI
      D: QDNI
    answer: B
    explanation: First and second letters each go back 5 (V→Q, J→E), the third goes forward 3 (K→N), and the fourth runs through the vowels A, E, I, O, U. So QENU.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q009
    difficulty: medium
    stem: In a certain code language, 'RAKHI' is coded as 36-2-22-16-18 and 'SHALU' is coded as 38-16-2-24-42. How will 'MANJU' be coded in that language?
    options:
      A: 13-2-28-10-24
      B: 13-2-14-10-24
      C: 26-1-14-20-42
      D: 26-2-28-20-42
    answer: D
    explanation: "Each letter is written as twice its alphabet position: M = 26, A = 2, N = 28, J = 20, U = 42."
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q010
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      23 : 441 :: 28 : ?
    options:
      A: "692"
      B: "494"
      C: "526"
      D: "676"
    answer: D
    explanation: 23 → (23 − 2)² = 21² = 441. So 28 → 26² = 676.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q012
    difficulty: medium
    stem: |-
      In the following Venn diagram, the hexagon stands for 'police officers', the pentagon stands for 'graduates', the circle stands for 'females', and the square stands for 'Indians'. The given numbers represent the number of persons in that particular category.

      How many Indian police officers are graduates but NOT females?

      *(Figure: Venn diagram of a hexagon, pentagon, circle and square overlapping, with numbers 9, 7, 11, 8, 32, 12, 15, 1, 4, 50 in the regions.)*
    options:
      A: "11"
      B: "8"
      C: "13"
      D: "19"
    answer: A
    explanation: Indian graduate police officers who are not female lie inside the hexagon, pentagon and square but outside the circle; that region holds 11.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q013
    difficulty: medium
    stem: "In a certain code language, MONEY is written as PRQHB.In the same code language, CREDIT will be written as:"
    options:
      A: FUGHLW
      B: FUHGLW
      C: FUHGWL
      D: FHGULW
    answer: B
    explanation: Each letter moves 3 places forward (M→P, O→R, N→Q, E→H, Y→B). So CREDIT → FUHGLW.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q014
    difficulty: medium
    stem: In a certain code language, 'her father is okay' is coded as 6583, 'my father is well' is coded as 5137 and 'her arm is injured' is coded as 2839. How will 'okay' be coded in that language?
    options:
      A: "6"
      B: "8"
      C: "3"
      D: "5"
    answer: A
    explanation: "'is' = 3 (common to all), 'father' = 5 (common to 1 and 2), 'her' = 8 (common to 1 and 3). The remaining digit of 6583 is 6, so 'okay' = 6."
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q016
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in a logical and meaningful order.

      1. Starfish  
      2. Blue whale  
      3. Shark  
      4. Giant tortoise  
      5. Penguin
    options:
      A: 1, 5, 4, 2, 3
      B: 1, 5, 3, 2, 4
      C: 1, 5, 4, 3, 2
