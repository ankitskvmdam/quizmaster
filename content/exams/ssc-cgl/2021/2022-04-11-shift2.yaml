      B: "804"
      C: "1235"
      D: "2006"
    answer: D
    explanation: ×2 + 1, ×3 + 1, ×4 + 1, … so the next term is 401 × 5 + 1 = 2006.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q023
    difficulty: medium
    stem: |-
      Which two numbers and which two signs should be interchanged to balance the following equation?

      24 ÷ 16 – 96 + 48 × 12 = 195
    options:
      A: 12 and 16, × and ÷
      B: 24 and 16, – and ÷
      C: 24 and 48, × and ÷
      D: 12 and 48, × and +
    answer: A
    explanation: Swapping 12/16 and ×/÷ gives 24 × 12 − 96 + 48 ÷ 16 = 288 − 96 + 3 = 195.
    tags:
      - reasoning
  - slug: cgl-2022-04-11-s2-q024
    difficulty: medium
    stem: A side of a square-shaped park is 12 m. If a squared-shaped garden with a side of 24 m is developed around the park, what will be total area of the park including the garden?
