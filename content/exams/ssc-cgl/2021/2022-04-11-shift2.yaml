      | Year | A | B |
      |---|---|---|
      | 2014 | 200 | 225 |
      | 2015 | 150 | 250 |
      | 2016 | 275 | 200 |
      | 2017 | 175 | 275 |
      | 2018 | 300 | 325 |

      In which year were the exports of cars of type A ₹55 million less than the average exports (per year) of cars of type B over the five years?

