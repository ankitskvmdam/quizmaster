    difficulty: medium
    stem: A, B and C started a business in partnership. Initially, A invested ₹29,000, while B and C invested ₹25,000 each. After 4 months, A withdrew ₹3,000. After 2 more months, C invested ₹12,000 more. Find the share of C (in ₹) in the profit of ₹33,200 at the end of the year.
    options:
      A: 10,800
      B: 10,000
      C: 11,067
      D: 12,400
    answer: D
    explanation: |-
      Capital-months: A = 29,000×4 + 26,000×8 = 3,24,000; B = 25,000×12 = 3,00,000; C = 25,000×6 + 37,000×6 = 3,72,000.
      C's share = 33,200 × 372/996 = ₹12,400.
    tags:
      - quant
  - slug: cgl-2022-04-11-s2-q052
    difficulty: medium
    stem: If cos(A − B) = √3/2 and secA = 2, 0° ≤ A ≤ 90°, 0° ≤ B ≤ 90°, then what is the measure of B?
    options:
      A: 60°
      B: 0°
      C: 30°
      D: 90°
    answer: C
    explanation: sec A = 2 gives A = 60°. cos(A − B) = √3/2 gives A − B = 30°, so B = 30°.
    tags:
      - quant
