  - slug: cgl-2022-04-18-all-ss-shift2-q016
    difficulty: medium
    stem: |-
      Which two numbers (Not Digits) need to be interchanged to make the following equation correct?

      15 + 90 ÷ 9 × 5 – 11 = 28
    options:
      A: 11 and 9
      B: 15 and 9
      C: 15 and 5
      D: 9 and 5
    answer: B
    explanation: Swapping 15 and 9 gives 9 + 90 ÷ 15 × 5 − 11 = 9 + 30 − 11 = 28.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q019
    difficulty: medium
    stem: Radha wears five different coloured clothes, red, green, yellow, purple and brown, on five different days of a week, from Monday to Friday. She wears red clothes on Wednesday. She does not wear green and brown clothes on Monday or Friday. She wears green clothes on the next day of wearing yellow clothes. On which day does she wear brown clothes?
    options:
      A: Monday
      B: Tuesday
      C: Friday
      D: Thursday
    answer: D
    explanation: Green and brown must fall on Tuesday or Thursday (Wednesday is red). Green follows yellow, so yellow is Monday and green Tuesday; brown is Thursday.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q020
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      2, 31, 4, 37, 10, 41, 28, 43, 82, 47, ?
    options:
      A: "422"
      B: "242"
      C: "224"
      D: "244"
    answer: D
    explanation: The odd-place terms 2, 4, 10, 28, 82 add 2, 6, 18, 54 (×3 each time), so the next is 82 + 162 = 244. The even-place terms are primes.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q024
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:  
      No plum is an apricot.  
      All lemons are apricots.  
      All grapes are lemons.

      Conclusions:  
      I. No apricot is a grape.  
      II. No grape is a plum.  
      III. No lemon is a plum.  
      IV. Some plums are lemons.
    options:
      A: Only conclusions I, II and IV follow.
      B: Only conclusions II, III and IV follow.
      C: Only conclusions II and III follow.
      D: Only conclusions I, II and III follow.
    answer: C
    explanation: All grapes are lemons and all lemons are apricots, and no plum is an apricot. So no lemon is a plum (III) and no grape is a plum (II). I and IV fail.
    tags:
      - reasoning
