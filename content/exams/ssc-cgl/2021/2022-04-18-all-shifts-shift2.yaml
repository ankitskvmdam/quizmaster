questions:
  - slug: cgl-2022-04-18-all-ss-shift2-q001
    difficulty: medium
    stem: In a certain code language, 3224 means ‘Taj is in Agra’, and 4245 means ‘Agra is near Delhi’. Which of the following is the code for ‘I like all fruits’?
    options:
      A: "2534"
      B: "2425"
      C: "1526"
      D: "1436"
    answer: D
    explanation: "Each digit is the number of letters in a word: Taj(3) is(2) in(2) Agra(4) = 3224. I(1) like(4) all(3) fruits(6) = 1436."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q002
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.

      15 * 1411 * 83 * 137 * 218 * 100
    options:
      A: ×,÷, =, +,−
      B: ×,=,−,÷,+
      C: +,−,×, =, ÷
      D: ×,+,÷,−, =
    answer: A
    explanation: 15 × 1411 ÷ 83 = 255 and 137 + 218 − 100 = 255, so × ÷ = + − balances it.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q003
    difficulty: medium
    stem: "The ratio of the present ages of Charvi and Vaishnavi is 4 : 5. Yuvika is 2 years older than Charvi but 5 years younger than Vaishnavi. Find the present age of Vaishnavi."
    options:
      A: 35 years
      B: 28 years
      C: 25 years
      D: 42 years
    answer: A
    explanation: With Charvi = 4x and Vaishnavi = 5x, 4x + 2 = 5x − 5, so x = 7 and Vaishnavi is 35 years old.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q004
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      39, 53, 69, 87, ?
    options:
      A: "99"
      B: "107"
      C: "92"
      D: "115"
    answer: B
    explanation: The differences are 14, 16, 18, so the next is 87 + 20 = 107.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q005
    difficulty: medium
    stem: |-
      Three different positions of the same non-standard dice are shown. Which letter will be on the face opposite to the face with the letter ‘Q’?

      *(Figure: Three views of the dice: (1) T on top, Q in front, S on the right; (2) U on top, R in front, T on the right; (3) S on top, P in front, U on the right.)*
    options:
      A: S
      B: P
      C: U
      D: R
    answer: C
    explanation: T touches Q, S, U and R, so T is opposite P. S touches T, Q, P and U, so S is opposite R. That leaves Q opposite U.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q006
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: WTR
      B: WUT
      C: MJH
      D: SPN
    answer: B
    explanation: WTR, MJH and SPN go −3 then −2. WUT goes −2 then −1, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q007
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      28 : 729 :: 32 : ?
    options:
      A: "961"
      B: "973"
      C: "824"
      D: "738"
    answer: A
    explanation: 729 = (28 − 1)², so (32 − 1)² = 961.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q008
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.

      K _ _ N L _ N K _ N _ L N K _ M _ L M _
    options:
      A: L, M, M, M, K, L, K, N
      B: L, M, M, K, K, L, N, N
      C: M, M, L, K, K, L, K, N
      D: L, M, M, K, K, M, K, N
    answer: A
    explanation: "The series reads KLMN LMNK MNKL NKLM KLMN: each block starts one letter later in the cycle K, L, M, N."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift2-q009
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it

      | | | |
      |---|---|---|
      | 7 | 9 | 5 |
      | 3 | 8 | ? |
      | 28 | 81 | 50 |
    options:
      A: "9"
      B: "5"
      C: "7"
      D: "8"
    answer: A
    explanation: "In each column, top × (middle + 1) = bottom: 7 × 4 = 28 and 9 × 9 = 81, so 5 × (? + 1) = 50 gives ? = 9."
    tags:
      - reasoning
