  - slug: cgl-2022-04-20-all-ss-shift2-q024
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      Some girls are engineers.  
      All engineers are soldiers.  
      No doctor is a girl.

      **Conclusions:**

      I. No soldier is a girl.  
      II. No girl is an engineer.  
      III. Some soldiers are engineers.
    options:
      A: Only conclusions I and III follow.
      B: Only conclusion III follows.
      C: Only conclusion II follows.
      D: All the conclusions follow.
    answer: B
    explanation: Some girls are engineers and all engineers are soldiers, so some soldiers are engineers (III). I and II contradict ‘some girls are engineers’.
