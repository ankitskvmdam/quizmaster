    stem: If tan B = 5/3, what is the value of (cosec B + sin B)/(cos B − sec B)?
    options:
      A: −177/125
      B: −59/15
      C: 59/15
      D: 177/125
    answer: A
    explanation: With tanB = 5/3, sinB = 5/√34 and cosB = 3/√34. (cosecB + sinB)/(cosB − secB) = [59/(5√34)] / [−25/(3√34)] = −177/125.
    tags:
      - quant
  - slug: cgl-2022-04-20-all-ss-shift2-q052
    difficulty: medium
    stem: If √x − 1/√x = √5, x ≠ 0, then what is the value of (x⁴ + 1/x²)/(x² + 1)?
    options:
      A: "42"
      B: "44"
      C: "48"
      D: "46"
    answer: D
    explanation: Squaring gives x + 1/x = 7. Dividing top and bottom by x gives (x³ + 1/x³)/(x + 1/x) = (343 − 21)/7 = 46.
    tags:
      - quant
  - slug: cgl-2022-04-20-all-ss-shift2-q053
    difficulty: medium
    stem: "If the number 48k2048p6 is divisible by 99, then (k × p) is equal to:"
    options:
      A: "2"
      B: "6"
      C: "4"
      D: "0"
    answer: D
    explanation: "For divisibility by 99, the two-digit groups from the right must sum to a multiple of 99: 4 + 8k + 20 + 48 + p6 = 158 + 10p + k = 198. So p = 4 and k = 0, and k × p = 0."
    tags:
      - quant
