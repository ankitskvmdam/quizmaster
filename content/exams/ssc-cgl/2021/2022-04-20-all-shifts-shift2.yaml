questions:
  - slug: cgl-2022-04-20-all-ss-shift2-q002
    difficulty: medium
    stem: Eight friends, P, Q, R, S, T, U, V and W, are sitting clockwise in the same order around a circular table at equal distances between them, facing the centre of the table. If S is sitting in the west, then who is sitting in the south-west direction?
    options:
      A: T
      B: R
      C: V
      D: P
    answer: B
    explanation: Going clockwise from S (west), the seats are T (north-west), U (north), V (north-east), W (east), P (south-east), Q (south) and R (south-west).
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q004
    difficulty: medium
    stem: |-
      Select the option in which the two numbers are related in the same way as are the two numbers of the following number-pair.

      24 : 648
    options:
      A: "25 : 652"
      B: "22 : 550"
      C: "20 : 421"
      D: "26 : 654"
    answer: B
    explanation: "24 : 648 is n : n(n + 3), since 24 × 27 = 648. Likewise 22 × 25 = 550."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q005
    difficulty: medium
    stem: 390625 is at which position in the series 5, 25, 125, 625, ______?
    options:
      A: 10th
      B: 8th
      C: 9th
      D: 7th
    answer: B
    explanation: The series is 5¹, 5², 5³, …, and 390625 = 5⁸, so it is the 8th term.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q006
    difficulty: medium
    stem: Zainab is standing facing a particular direction initially. Then she turns 90° clockwise, after that she turns 180° anticlockwise. Then she turns 135° anticlockwise. She finally turns 180° clockwise. Now she is facing the north-east direction. In which direction was Zainab facing initially before taking any turns?
    options:
      A: South
      B: East
      C: West
      D: North-west
    answer: B
    explanation: Net turn = 90° cw − 180° − 135° + 180° cw = 45° anticlockwise. Undoing that from north-east (45° clockwise) gives east.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q008
    difficulty: medium
    stem: If the numbers ‘18’ and ‘30’ are interchanged, then which of the following equations can be correctly balanced?
    options:
      A: 35 ÷ 5 × 5 + 30 – 18 = 23
      B: 14 × 5 – 18 ÷ 6 + 30 = 73
      C: 64 + 18 × 5 ÷ 3 – 30 = 98
      D: 12 – 30 × 18 ÷ 3 + 16 = 174
    answer: A
    explanation: After swapping, 35 ÷ 5 × 5 + 18 − 30 = 35 + 18 − 30 = 23.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q009
    difficulty: medium
    stem: In a coaching institute, the number of students in class 10 is 1/3 more than the number of students in class 12. If the total number of students of class 10 and class 12 in the institute is 112, find the number of students in class 10 in that institute.
    options:
      A: "64"
      B: "52"
      C: "48"
      D: "70"
    answer: A
    explanation: Class 10 = 4/3 of class 12, so 7/3 × class 12 = 112. Class 12 = 48 and class 10 = 64.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q010
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.

      84 * 42 * 7 * 5 * 21 * 93
    options:
      A: ×, ÷, +, −, =
      B: +, ÷, ×, −, =
      C: +, ÷, −, ×, =
      D: ÷, +, ×, −, =
    answer: B
    explanation: 84 + 42 ÷ 7 × 5 − 21 = 93 gives 84 + 30 − 21 = 93.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q011
    difficulty: medium
    stem: Pointing towards a boy, Shalini said, “He is my daughter’s father’s wife’s father’s wife’s only son”. How is Shalini related to the boy?
    options:
      A: Daughter-in-law
      B: Daughter
      C: Sister
      D: Sister-in-law
    answer: C
    explanation: Her daughter's father's wife is Shalini herself. Shalini's father's wife is her mother, and her mother's only son is Shalini's brother. So Shalini is his sister.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q012
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      TMDS, PHXL, LCRE, HXLX, ?, ZNZJ
    options:
      A: DSFQ
      B: DSFR
      C: DRGQ
      D: ESFQ
    answer: A
    explanation: "Position by position, the letters move back by 4, 5, 6 and 7: T→P→L→H→D, M→H→C→X→S, D→X→R→L→F, S→L→E→X→Q. That gives DSFQ."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q013
    difficulty: medium
    stem: In a certain code language, ‘NAILS’ is written as ‘PYGNU’, and ‘TEXT’ is written as ‘VCZV. How will ‘FOREST’ be written in that language?
    options:
      A: HMTCUV
      B: HMNUCV
      C: HQTGUV
      D: DMPCUU
    answer: A
    explanation: Consonants move +2 and vowels move −2 (NAILS → PYGNU). So FOREST → H M T C U V.
    tags:
      - reasoning
