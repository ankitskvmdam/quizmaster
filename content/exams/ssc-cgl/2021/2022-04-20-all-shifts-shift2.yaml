  - slug: cgl-2022-04-20-all-ss-shift2-q021
    difficulty: medium
    stem: In a certain code language, ‘MOST’ is written as ‘134’ and ‘FUR’ is written as ‘90’. How will ‘SUCCESS’ be written in that language?
    options:
      A: "89"
      B: "178"
      C: "215"
      D: "175"
    answer: B
    explanation: "Code = 2 × (sum of letter positions): MOST = 2 × 67 = 134 and FUR = 2 × 45 = 90. SUCCESS = 2 × 89 = 178."
