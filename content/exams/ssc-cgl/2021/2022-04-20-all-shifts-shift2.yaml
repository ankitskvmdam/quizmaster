  - slug: cgl-2022-04-20-all-ss-shift2-q015
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      8 6 76

      12 10 ?

      7 13 113
    options:
      A: "117"
      B: "120"
      C: "128"
      D: "110"
    answer: B
    explanation: "In each row, (a + b) × 5 + b = c: (8 + 6) × 5 + 6 = 76 and (7 + 13) × 5 + 13 = 113. So (12 + 10) × 5 + 10 = 120."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q017
    difficulty: medium
    stem: Four letter-clusters have been given out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: WTGD
      B: FCXB
      C: MJQN
      D: KHSP
    answer: B
    explanation: WTGD, MJQN and KHSP go −3 within each pair (W→T, G→D). In FCXB, X→B is +4, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q018
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster.

      FPD : UKI :: LWP : ?
    options:
      A: PUX
      B: PHV
      C: ODU
      D: ODT
    answer: C
    explanation: The first two letters become their opposites (F→U, P→K) and the third moves +5 (D→I). So LWP → O D U.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift2-q019
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      32, 34, 43, 71, 136, ?
    options:
      A: "149"
      B: "277"
      C: "188"
      D: "262"
    answer: D
    explanation: The differences are 2, 9, 28, 65 = n³ + 1. The next is 5³ + 1 = 126, so 136 + 126 = 262.
