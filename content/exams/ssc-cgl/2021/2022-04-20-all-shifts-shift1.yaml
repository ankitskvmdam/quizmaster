    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q025
    difficulty: medium
    stem: Vijendra walks a certain distance, say X metres, from his home towards the west. Then he turns left and walks 23 metres. After that, he turns left and walks 36 metres. Then he turns left again to walk 23 metres. He finally turns left and walks 18 metres to reach his home. Find the value of X.
    options:
      A: "41"
      B: "18"
      C: "20"
      D: "22"
    answer: B
    explanation: He goes X m west, 23 m south, 36 m east, 23 m north and 18 m west. The north–south moves cancel, so −X + 36 − 18 = 0 and X = 18.
    tags:
      - reasoning
