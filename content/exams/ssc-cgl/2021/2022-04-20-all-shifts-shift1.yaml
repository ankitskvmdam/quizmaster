  - slug: cgl-2022-04-20-all-ss-shift1-q059
    difficulty: medium
    stem: A college hostel mess has provisions for 25 days for 350 boys. At the end of 10 days, when some boys were shifted to another hostel, it was found that now the provisions will last for 21 more days. How many boys were shifted to another hostel?
