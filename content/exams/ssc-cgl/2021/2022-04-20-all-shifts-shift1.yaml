  - slug: cgl-2022-04-20-all-ss-shift1-q062
    difficulty: medium
    stem: The difference between compound interest compounded annually and simple interest on a certain sum at a rate of 15% per annum for 2 years is ₹1,944. Find the compound interest compounded annually (in ₹) on the same sum for the same period at a rate of 10% per annum.
    options:
