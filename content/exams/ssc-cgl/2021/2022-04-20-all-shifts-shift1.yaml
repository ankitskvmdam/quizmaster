    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q015
    difficulty: medium
    stem: Prakash, Qadir, Ramesh, Saurabh and Tariq are friends. Ramesh is taller than Qadir but shorter than Saurabh. Prakash is the shortest, and Tariq is taller than Saurabh. Who is the tallest among them?
    options:
      A: Tariq
      B: Saurabh
      C: Qadir
      D: Ramesh
    answer: A
    explanation: Qadir < Ramesh < Saurabh < Tariq, and Prakash is the shortest, so Tariq is the tallest.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q017
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

      CARNATIC : SBDMZDJU :: FREEDOMS : ?
    options:
      A: FSGVWTNP
      B: FSGVXPNP
      C: FSGUNPEV
      D: GSFVWPEP
    answer: A
    explanation: "CARN is reordered as R, A, C, N and coded +1, +1, +1, then opposite letter (N→M): SBDM. ATIC is reordered as A, C, I, T and coded opposite (A→Z), then +1, +1, +1: ZDJU. FREEDOMS in the same way gives FSGV + WTNP."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q018
    difficulty: medium
    stem: A cube of side 18 cm is painted yellow on all the faces and then cut into smaller cubes of sides 3 cm each. Find the number of smaller cubes that have only two faces painted.
    options:
      A: "36"
      B: "48"
      C: "20"
      D: "64"
    answer: B
    explanation: "Each edge has 18 ÷ 3 = 6 small cubes. Cubes with exactly two painted faces lie on the 12 edges, excluding the corners: 12 × (6 − 2) = 48."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q019
    difficulty: medium
    stem: |-
      Which two signs need to be interchanged to make the following equation correct?

      189 ÷ 27 − 3 + 29 × 2 = 48
    options:
      A: − and ×
      B: − and +
      C: + and ×
      D: ÷ and −
    answer: A
    explanation: Swapping − and × gives 189 ÷ 27 × 3 + 29 − 2 = 21 + 29 − 2 = 48.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q020
    difficulty: medium
    stem: |-
