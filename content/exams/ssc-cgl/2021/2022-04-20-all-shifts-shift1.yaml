  - slug: cgl-2022-04-20-all-ss-shift1-q061
    difficulty: medium
    stem: Manjeet bought a second-hand motorbike for ₹22,000 and spent ₹3,000 on its overhauling and maintenance. He then sold it with 12% profit. If he had sold it for ₹500 less, then what would have been his profit percentage?
