questions:
  - slug: cgl-2022-04-20-all-ss-shift1-q001
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      147 : 222 :: 158 : ?
    options:
      A: "264"
      B: "225"
      C: "287"
      D: "233"
    answer: D
    explanation: 147 + 75 = 222, so 158 + 75 = 233.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q002
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: QPJ
      B: YXS
      C: SRM
      D: RQL
    answer: A
    explanation: In YXS, SRM and RQL the letters go −1 then −5 (Y→X→S). QPJ goes −1 then −6, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q003
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Pediculate  
      2. Pandemonium  
      3. Pancytopenia  
      4. Panelist  
      5. Panegyric
    options:
      A: 1, 3, 2, 5, 4
      B: 3, 2, 5, 4, 1
      C: 3, 2, 4, 5, 1
      D: 2, 3, 5, 4, 1
    answer: B
    explanation: "Pancytopenia, Pandemonium, Panegyric, Panelist (pane-g before pane-l), Pediculate: 3, 2, 5, 4, 1."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q004
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      LAS, NFW, MKD, OPH, LUS, ?
    options:
      A: NZH
      B: MYX
      C: NZW
      D: MXW
    answer: C
    explanation: Middle letters go A, F, K, P, U, Z (+5). First letters repeat L, N, M, O and third letters repeat S, W, D, H in blocks of four, so the next term is N Z W.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q006
    difficulty: medium
    stem: In a certain code language, ‘FILE’ is coded as 8357 and ‘SINK’ is coded as 9364. How will ‘NIKE’ be coded in that language?
    options:
      A: "3647"
      B: "6473"
      C: "6347"
      D: "6437"
    answer: C
    explanation: "Codes go letter by letter: F=8, I=3, L=5, E=7, S=9, N=6, K=4. So NIKE = 6 3 4 7."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q007
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:  
      Some telephones are mobiles.  
      All mobiles are tablets.  
      Some tablets are laptops.

      Conclusions:  
      I. Some mobiles are laptops.  
      II. All telephones are tablets.  
      III. Some telephones are tablets.
    options:
      A: Only conclusion III follows.
      B: Only conclusions I and II follow.
      C: Only conclusion II follows.
      D: All conclusions I, II and III follow.
    answer: A
    explanation: Some telephones are mobiles and all mobiles are tablets, so some telephones are tablets (III). Nothing links mobiles to laptops (I), and not all telephones need be tablets (II).
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q008
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 9 | 7 | 9 |
      | 5 | 4 | 7 |
      | 43 | 26 | ? |
    options:
      A: "48"
      B: "61"
      C: "35"
      D: "29"
    answer: B
    explanation: "In each column, top × middle − 2 = bottom: 9×5−2 = 43, 7×4−2 = 26, so 9×7−2 = 61."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q009
    difficulty: medium
    stem: Vinita and Amita are the sisters of Gaurav. Ashish is the father of Vinita. Ansh is the son of Amita. How is Ashish related to Ansh?
    options:
      A: Maternal uncle
      B: Paternal grandfather
      C: Paternal uncle
      D: Maternal grandfather
    answer: D
    explanation: "Ashish is the father of Vinita, Amita and Gaurav. Ansh is Amita's son, so Ashish is his mother's father: maternal grandfather."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift1-q010
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      38, 53, 70, 89, ?
    options:
      A: "92"
      B: "110"
      C: "124"
      D: "98"
