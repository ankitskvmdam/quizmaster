  - slug: cgl-2022-04-20-all-ss-shift1-q052
    difficulty: medium
    stem: |-
      Study the given bar graph and answer the question that follows.

      The bar graph shows the exports of cars of type A and B (in ₹ millions) from 2014 to 2018.

      | Years | A | B |
      |---|---|---|
      | 2014 | 200 | 225 |
      | 2015 | 150 | 250 |
      | 2016 | 275 | 200 |
      | 2017 | 175 | 275 |
      | 2018 | 300 | 325 |

      The total exports of cars of type A from 2014 to 2016 is approximately what percentage less than the total exports of cars of type B from 2015 to 2017 (correct to one decimal place)?

      *(Figure: Bar graph (Exports in ₹ millions vs Years, blue bars A and red bars B, y-axis 0 to 350); bar values are given in the table.)*
    options:
      A: 10.4%
      B: 11.7%
      C: 11.3%
      D: 13.8%
    answer: D
    explanation: A from 2014 to 2016 = 200 + 150 + 275 = 625. B from 2015 to 2017 = 250 + 200 + 275 = 725. (725 − 625)/725 × 100 ≈ 13.8%.
    tags:
      - quant
  - slug: cgl-2022-04-20-all-ss-shift1-q053
    difficulty: medium
    stem: |-
      Simplify the following expression:  
      cosec⁴A(1 − cos⁴A) − 2 cot²A − 1
    options:
      A: sin²A
      B: cosec²A
      C: "1"
      D: "0"
    answer: D
    explanation: cosec⁴A(1 − cos²A)(1 + cos²A) = cosec²A(1 + cos²A) = cosec²A + cot²A. Subtracting 2cot²A + 1 leaves cosec²A − cot²A − 1 = 0.
    tags:
      - quant
  - slug: cgl-2022-04-20-all-ss-shift1-q054
    difficulty: medium
    stem: The average of eleven consecutive positive integers is d. If the last two numbers are excluded, by how much will the average increase or decrease?
    options:
      A: Will decrease by 1
      B: Will increase by 2
      C: Will decrease by 2
