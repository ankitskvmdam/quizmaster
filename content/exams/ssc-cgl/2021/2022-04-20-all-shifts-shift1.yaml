  - slug: cgl-2022-04-20-all-ss-shift1-q064
    difficulty: medium
    stem: The inner circumference of a circular path enclosed between two concentric circles is 264 m. The uniform width of the circular path is 3 m. What is the area (in m², to the nearest whole number) of the path? (Take π = 22/7)
