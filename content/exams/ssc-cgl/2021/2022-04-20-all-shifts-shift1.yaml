  - slug: cgl-2022-04-20-all-ss-shift1-q063
    difficulty: medium
    stem: A shopkeeper allows a 28% discount on the marked price of an article and still makes a profit of 20%. If he gains ₹30.80 on the sale of one article, then what is the selling price (in ₹) of the article?
