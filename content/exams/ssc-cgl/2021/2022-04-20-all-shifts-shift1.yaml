  - slug: cgl-2022-04-20-all-ss-shift1-q023
    difficulty: medium
    stem: The radius of a circle is 90 cm. If the radius of this circle is increased to 99 cm, then what will be the percentage increase in the area of this circle?
    options:
      A: 22.5%
      B: 21%
      C: 25%
      D: 20%
    answer: B
