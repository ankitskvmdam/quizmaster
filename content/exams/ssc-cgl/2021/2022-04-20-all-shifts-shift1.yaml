  - slug: cgl-2022-04-20-all-ss-shift1-q021
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.

      X _ U _ B _ O _ Z _ X _ U _ B
    options:
      A: O X Z U B O Z
      B: O Z X U B Z O
      C: O Z X B U O Z
      D: O Z X U B O Z
    answer: D
    explanation: "The block X O U Z B repeats: X O U Z B X O U Z B X O U Z B, so the blanks are O, Z, X, U, B, O, Z."
