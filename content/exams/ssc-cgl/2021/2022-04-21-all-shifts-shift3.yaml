      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q020
    difficulty: medium
    stem: In a certain code, 692425 means ‘School education is free in India’ and 7926 means ‘College education is costly’. Which of the following is the code for ‘I want to become graduate’?
