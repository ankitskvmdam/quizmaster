  - slug: cgl-2022-04-21-all-ss-shift3-q017
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Photographic  
      2. Photocopier  
      3. Photography  
      4. Photographer  
      5. Photocopy
    options:
      A: 2, 5, 4, 1, 3
      B: 4, 1, 5, 3, 2
      C: 1, 2, 3, 4, 5
      D: 3, 5, 1, 4, 2
    answer: A
    explanation: "Photocopier comes before Photocopy (i before y), then Photographer, Photographic, Photography (e, i, y): 2, 5, 4, 1, 3."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q018
    difficulty: medium
    stem: In a certain code language, 'RAHUL' is coded as 180, and 'POOJA' is coded as 171. How will 'RAJIV' be coded in the same language?
    options:
      A: "122"
      B: "85"
      C: "61"
      D: "180"
    answer: D
    explanation: "Code = 3 × sum of letter positions: RAHUL = 60 → 180, POOJA = 57 → 171. RAJIV = 18+1+10+9+22 = 60 → 180."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q019
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

