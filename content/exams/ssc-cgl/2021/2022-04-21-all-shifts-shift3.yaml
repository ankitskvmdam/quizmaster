  - slug: cgl-2022-04-21-all-ss-shift3-q065
    difficulty: medium
    stem: Ankita’s weight is 20% less than that of her grandmother. The grandmother weighs 26 kg less than grandmother’s husband, whose weight is 81 kg. If Ankita’s brother is 8 kg heavier than Ankita, then what is the weight (in kg) of Anikita’s brother?
