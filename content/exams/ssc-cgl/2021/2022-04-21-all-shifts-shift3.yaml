  - slug: cgl-2022-04-21-all-ss-shift3-q056
    difficulty: medium
    stem: A vegetable vendor sold 1 kg of potatoes for ₹25 and earned 25% profit. In the evening, he started selling potatoes with only 10% profit. At what cost (in ₹) per kg did he sell the potatoes in the evening?
