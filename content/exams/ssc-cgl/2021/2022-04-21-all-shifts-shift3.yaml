  - slug: cgl-2022-04-21-all-ss-shift3-q064
    difficulty: medium
    stem: In a triangle ABC, points P and Q are on AB and AC, respectively, such that AP = 4 cm, PB = 6 cm, AQ = 5 cm and QC = 7.5 cm. If PQ = 6 cm, then find BC (in cm).
