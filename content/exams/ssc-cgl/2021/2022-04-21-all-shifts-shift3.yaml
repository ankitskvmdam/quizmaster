  - slug: cgl-2022-04-21-all-ss-shift3-q053
    difficulty: medium
    stem: A borrows a sum of ₹90,000 for 4 years at 5% simple interest. He lends it to B at 7% for 4 years at simple interest. What is his gain (in ₹)?
