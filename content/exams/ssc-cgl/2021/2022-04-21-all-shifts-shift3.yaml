  - slug: cgl-2022-04-21-all-ss-shift3-q067
    difficulty: medium
    stem: The length of the shadow of a vertical tower on level ground increases by 8.4 cm when the altitude of the sun changes from 45° to 30°. What is the height of the tower (in m)?
