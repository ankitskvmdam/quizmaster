  - slug: cgl-2022-04-21-all-ss-shift3-q054
    difficulty: medium
    stem: Three partners X, Y and Z started their business by investing ₹40,000, ₹38,000 and ₹30,000, respectively. After 6 months, X and Z made additional investments of ₹20,000 and ₹15,000 respectively, whereas Y withdrew ₹8,000. Find the share of Y (in ₹) in the total profit of ₹38,880 made at the end of the year.
    options:
      A: 10,880
      B: 10,950
      C: 9,800
      D: 10,200
    answer: A
    explanation: "Capital-months: X 600000, Y 38000×6 + 30000×6 = 408000, Z 450000. Y's share = 408/1458 × 38880 = ₹10,880."
