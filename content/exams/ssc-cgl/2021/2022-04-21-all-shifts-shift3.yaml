  - slug: cgl-2022-04-21-all-ss-shift3-q062
    difficulty: medium
    stem: If sec²α + 4cos²α = 4 and 0° ≤ α ≤ 90°, then find the value of α.
    options:
      A: 30°
      B: 0°
      C: 45°
      D: 60°
    answer: C
