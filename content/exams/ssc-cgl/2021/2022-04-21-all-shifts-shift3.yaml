  - slug: cgl-2022-04-21-all-ss-shift3-q025
    difficulty: medium
    stem: Pointing towards the photograph of a lady, Varun said, “She is my father-in-law’s son’s only sister’s mother-in-law”. How is Varun related to that lady?
    options:
      A: Brother
      B: Son
      C: Husband
      D: Son-in-law
    answer: B
    explanation: Father-in-law's son = wife's brother; his only sister = Varun's wife; her mother-in-law = Varun's mother. So Varun is her son.
