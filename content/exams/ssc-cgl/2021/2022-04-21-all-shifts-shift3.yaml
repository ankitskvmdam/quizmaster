      *(Figure: Histogram: x-axis ‘Percentage of Marks’ (40, 50, 60, 70, 80, 90, 100), y-axis ‘Number of students’. Bars: 40–50: 10, 50–60: 30, 60–70: 80, 70–80: 65, 80–90: 40, 90–100: 25.)*
    options:
