source: "SSC candidate response sheet with the official answer marked (via https://docs.aglasem.com/view/b92ddd0e-db03-11ed-a1a8-0a5e36bc6706). Left out (picture-only options or incomplete in the source): Q2, Q10, Q11, Q21, Q24."
questions:
  - slug: cgl-2022-04-21-all-ss-shift3-q001
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it.

      13 6 75  
      15 8 ?  
      18 4 70
    options:
      A: "116"
      B: "96"
      C: "76"
      D: "84"
    answer: A
    explanation: "Third = first × second − second ÷ 2: 13×6 − 3 = 75, 18×4 − 2 = 70. So 15×8 − 4 = 116."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q003
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.

      P _ _ N _ _ S R _ Q P _ R _ _ _ S _ N Q
    options:
      A: Q, R, S, P, N, S, N, Q, P, R
      B: S, R, Q, R, N, Q, N, S, P, R
      C: R, S, Q, P, R, S, R, Q, P, N
      D: S, R, Q, P, N, S, N, Q, P, R
    answer: D
    explanation: Filling S, R, Q, P, N, S, N, Q, P, R gives PSRNQ repeated four times.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q004
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.

      54 * 36 * 12 * 18 * 24 * 24
    options:
      A: ÷, +, ×, −, =
      B: ÷, ×, −, +, =
      C: ÷, ×, +, −, =
      D: +, ×, −, ÷, =
    answer: B
    explanation: 54 ÷ 36 × 12 − 18 + 24 = 18 − 18 + 24 = 24, so both sides are equal.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q005
    difficulty: medium
    stem: |-
      In the following Venn diagram, the oval stands for ‘chartered accountants’, the pentagon stands for ‘males’, the triangle stands for ‘full-time employees’, and the square stands for ‘tax-payers’. The given numbers represent the number of persons in that particular category.

      How many male chartered accountants are NEITHER tax-payers NOR full-time employees?

      *(Figure: Venn diagram of an oval, a pentagon, a triangle and a square overlapping, with region numbers 13, 1, 8, 17, 9, 4, 14, 22, 23, 11, 18, 2 and 16. The region inside the pentagon and the oval but outside the square and the triangle holds 22.)*
    options:
      A: "17"
      B: "14"
      C: "22"
      D: "8"
    answer: C
    explanation: "Male chartered accountants who are neither tax-payers nor full-time employees lie inside the pentagon and oval only, outside the square and triangle: 22."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q006
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      50, 67, 86, 107, ?
    options:
      A: "124"
      B: "118"
      C: "136"
      D: "130"
    answer: D
    explanation: "Differences rise by 2: 17, 19, 21, 23. 107 + 23 = 130."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q007
    difficulty: medium
    stem: |-
      A cube is made by folding the given sheet. In the cube so formed, which of the following pairs of numbers will be on opposite faces?

      *(Figure: Net of a cube: top row of three squares 1, 5, 4; bottom row of three squares 2, 3, 6, with 2 directly below 4.)*
    options:
      A: 3 and 5
      B: 1 and 5
      C: 4 and 6
      D: 2 and 4
    answer: A
    explanation: "In a row of three faces the first and third are opposite: 1 opposite 4 and 2 opposite 6. That leaves 3 opposite 5."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q008
    difficulty: medium
    stem: In a certain code language, BACHELOR is written as YZXSVOLI. How will EDUCATION be written as in that language?
    options:
      A: GFWECVKRM
      B: MLRGZXFWV
      C: FEVDBUJPM
      D: VWFXZGRLM
    answer: D
    explanation: "Each letter is replaced by its opposite letter (A↔Z, B↔Y …): B→Y, A→Z, C→X. So EDUCATION → VWFXZGRLM."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q009
    difficulty: medium
    stem: Eight friends, P, Q, R, S, T, U, V and W, are sitting in the same order anticlockwise around a circular table at equal distances between them, with all facing the centre of the table. If Q is sitting in the south-east, then in which direction is W sitting?
    options:
      A: North
      B: South
      C: South-west
      D: North-east
    answer: C
    explanation: "Going anticlockwise from Q at south-east: R east, S north-east, T north, U north-west, V west, W south-west."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q012
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:

      All wires are chargers.  
      Some chargers are phones.  
      All chargers are equipment.

      Conclusions:

      I. Some equipment are phones.  
      II. All wires are phones.
    options:
      A: Only conclusion I follows
      B: Both the conclusions follow
      C: Only conclusion II follows
      D: Neither conclusion I nor II follows
    answer: A
    explanation: The chargers that are phones are also equipment, so 'Some equipment are phones' follows. Nothing links all wires to phones, so II does not follow.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q013
    difficulty: medium
    stem: |-
      Which two numbers should be interchanged to make the given equation correct?

      52 + 69 − 46 ÷ 23 × 26 = 20
    options:
      A: 69 and 46
      B: 46 and 23
      C: 52 and 26
      D: 52 and 69
    answer: A
    explanation: "Swapping 69 and 46: 52 + 46 − 69 ÷ 23 × 26 = 98 − 78 = 20."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q014
    difficulty: medium
    stem: "In a group of 110 students, 23 students did not participate in any of the two games: Badminton and Chess. 45 students participated in Badminton and 61 students participated in Chess. How many students participated in Badminton only?"
    options:
      A: "26"
      B: "18"
      C: "42"
      D: "28"
    answer: A
    explanation: 110 − 23 = 87 played at least one game; both = 45 + 61 − 87 = 19. Badminton only = 45 − 19 = 26.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q015
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the one that is different.
    options:
      A: HJM
      B: GIM
      C: MOS
      D: LNR
    answer: A
    explanation: GIM, MOS and LNR follow +2, +4; HJM follows +2, +3.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift3-q016
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      45, 47, 52, 62, 79, ?
    options:
      A: "85"
      B: "92"
      C: "105"
      D: "112"
    answer: C
    explanation: Differences 2, 5, 10, 17 are n² + 1 (n = 1 to 4); next is 26, so 79 + 26 = 105.
