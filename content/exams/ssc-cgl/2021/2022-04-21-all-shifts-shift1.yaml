questions:
  - slug: cgl-2022-04-21-all-ss-shift1-q001
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      13 : 1331 :: 17 : ?
    options:
      A: "2642"
      B: "1453"
      C: "3375"
      D: "1829"
    answer: C
    explanation: 1331 = 11³ = (13 − 2)³. So 17 → (17 − 2)³ = 15³ = 3375.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q003
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster.

      JST : HPX :: PWJ : ?
    options:
      A: NTN
      B: MSR
      C: MTN
      D: NSP
    answer: A
    explanation: "Letters shift −2, −3, +4: J→H, S→P, T→X. So P→N, W→T, J→N gives NTN."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q004
    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      16 − 18 × 216 ÷ 432 + 40 = 20
    options:
      A: + and −
      B: × and ÷
      C: × and +
      D: ÷ and −
    answer: B
    explanation: "Swapping × and ÷: 16 − 18 ÷ 216 × 432 + 40 = 16 − 36 + 40 = 20."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q005
    difficulty: medium
    stem: |-
      If A denotes ‘addition’, B denotes ‘multiplication’, C denotes ‘subtraction’, and D denotes ‘division’, then what will be the value of the following expression?

      (45 D 9) B 5 A 8 B (7 A 3 C 6) C (28 D (4 D 4))
    options:
      A: "82"
      B: "32"
      C: "29"
      D: "38"
    answer: C
    explanation: (45 ÷ 9) × 5 + 8 × (7 + 3 − 6) − (28 ÷ (4 ÷ 4)) = 25 + 32 − 28 = 29.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q007
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Serenity  
      2. Serpent  
      3. Serviceable  
      4. Sericulture  
      5. Serotonin
    options:
      A: 1, 4, 5, 2, 3
      B: 1, 4, 2, 5, 3
      C: 3, 4, 5, 2, 1
      D: 2, 4, 5, 3, 1
    answer: A
    explanation: "Compare the letter after 'Ser': Sere-, Seri-, Sero-, Serp-, Serv-. So Serenity, Sericulture, Serotonin, Serpent, Serviceable = 1, 4, 5, 2, 3."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q009
    difficulty: medium
    stem: In a certain code language, 'TULIPS' is written as ‘GFORKH’. How will 'GARDEN' be written in that language?
    options:
      A: SZIXVM
      B: TZIWUM
      C: TBIWVK
      D: TZIWVM
    answer: D
    explanation: "Each letter is replaced by its opposite letter (A↔Z, B↔Y …): T→G, U→F, L→O. So GARDEN → TZIWVM."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q011
    difficulty: medium
    stem: In a certain code language, 'GANGA' is coded as 21-3-42-21-3 and 'KOSHI' is coded as 33-45-57-24-27. How will 'GOMTI' be coded in that language?
    options:
      A: 14-45-26-60-27
      B: 21-45-39-60-27
      C: 21-30-39-40-18
      D: 14-30-39-40-18
    answer: B
    explanation: Each letter's alphabet position is multiplied by 3 (G = 7 → 21, A = 1 → 3). GOMTI = 21-45-39-60-27.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q013
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Study the same and identify which of the following statements is correct.

      *(Figure: Three views of the dice (top, front, right): (1, 3, 2); (1, 2, 5); (6, 5, 2).)*
    options:
      A: 1 is opposite to 4
      B: 3 is opposite to 6
      C: 6 is opposite to 1
      D: 5 is opposite to 2
    answer: C
    explanation: 2 is adjacent to 1, 3, 5 and 6, so 2 is opposite 4. 1 is adjacent to 3, 2 and 5, so 1 is opposite the remaining number, 6.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q015
    difficulty: medium
    stem: "The ratio of the sum of and the difference between two numbers is 6 : 5. Find the ratio of these two numbers."
    options:
      A: "3 : 2"
      B: "7 : 5"
      C: "2 : 3"
      D: "11 : 1"
    answer: D
    explanation: "(a + b) : (a − b) = 6 : 5 gives 5a + 5b = 6a − 6b, so a = 11b. Ratio = 11 : 1."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q016
    difficulty: medium
    stem: |-
      ‘A # B’ means ‘A is the sister of B’;  
      ‘A ＄ B’ means ‘A is the father of B’.  
      ‘A @ B’ means ‘A is the wife of B’.  
      ‘A % B’ means ‘A is the brother of B’.  
      Which of the following options means ‘J is the father of R’?
    options:
      A: "C @ J % K ＄ M # R"
      B: "C @ R ＄ K % M # J"
      C: "C @ J ＄ K % M # R"
      D: "J @ C ＄ K % M # R"
    answer: C
    explanation: "C @ J ＄ K % M # R: J is the father of K; K is the brother of M and M is the sister of R, so all three are siblings and J is the father of R."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q019
    difficulty: medium
    stem: In a certain code language, ‘are you ready’ is written as ‘541’, ‘we are going’ is written as ‘261’, and ‘she is ready’ is written as ‘498’. How will ‘you’ be written in that language?
    options:
      A: "6"
      B: "1"
      C: "5"
      D: "4"
    answer: C
    explanation: "'are' is common to the first two codes (1) and 'ready' to the first and third (4). So 'you' = 5."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q020
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      1, 1, 2, 2, 6, 10, 42, ?, 1806
    options:
      A: "1302"
      B: "1203"
      C: "1010"
      D: "1389"
    answer: C
    explanation: "Odd places 1, 2, 6, 42, 1806 follow n × (n + 1). Even places 1, 2, 10, ? follow n × (n² + 1): 10 × 101 = 1010."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q021
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true even if it appears to be at variance with commonly known facts decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      All peelers are funnels.  
      Some peelers are spatulas.

      **Conclusions:**

      I. Some peelers are not funnels.  
      II. Some spatulas are peelers.
    options:
      A: Both conclusions I and II follow.
      B: Only conclusion II follows.
      C: Neither conclusion I nor II follows.
      D: Only conclusion I follows.
    answer: B
    explanation: "'All peelers are funnels' makes I false. 'Some peelers are spatulas' converts to 'Some spatulas are peelers', so II follows."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q022
    difficulty: medium
    stem: |-
      Select the letter from among the given options that can replace the question mark (?) in the following series.

      E, F, I, N, U, ?
    options:
      A: A
      B: D
      C: N
      D: Z
    answer: B
    explanation: Positions 5, 6, 9, 14, 21 rise by 1, 3, 5, 7; next +9 gives 30, i.e. 30 − 26 = 4 = D.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q023
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: EVAF
      B: CXBH
      C: KPUZ
      D: TGLQ
    answer: B
