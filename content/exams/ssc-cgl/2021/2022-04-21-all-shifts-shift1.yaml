    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q025
    difficulty: medium
    stem: Eight friends, A, B, C, D, E, F, G and H, are sitting in two lines of four persons each. Both the lines are facing each other. A is facing D. E is to the immediate left of G. H is to the immediate right of B. C is facing G. F is facing H. B is to the immediate right of the person who is facing G. D is to the immediate left of F. Which four persons are sitting in the same line?
    options:
      A: A, B, C, H
      B: B, C, D, H
      C: A, C, F, G
      D: C, D, E, F
    answer: A
    explanation: "Facing pairs: A-D, C-G, F-H, B-E. E sits next to G and D next to F, so one line is D, E, F, G and the other is A, B, C, H."
    tags:
      - reasoning
