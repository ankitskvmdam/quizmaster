    stem: Anil lent a sum of ₹5,000 on simple interest for 10 years in such a way that the rate of interest is 6% per annum for the first 2 years, 8% per annum for the next 2 years and 10% per annum beyond 4 years. How much interest (in ₹) will he earn at the end of 10 years?
