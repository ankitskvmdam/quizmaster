    stem: |-
      The breakup of the total number of employees of a company working in different offices (A to E), in degrees, is given in the pie chart.

      Total number of employees = 2400.

      | Office | Degrees |
      |---|---|
      | A | 126° |
      | B | 18° |
      | C | 54° |
      | D | 90° |
      | E | 72° |

      If 40% of the number of employees in office A are shifted equally to office B and E, then what will be the sum of the number of employees in B and C?

      *(Figure: Pie chart of offices A to E with central angles transcribed as the table in the stem.)*
    options:
      A: "648"
      B: "735"
      C: "545"
      D: "72"
    answer: A
    explanation: A = 840, B = 120, C = 360. 40% of A = 336; half (168) goes to B, making 288. B + C = 288 + 360 = 648.
