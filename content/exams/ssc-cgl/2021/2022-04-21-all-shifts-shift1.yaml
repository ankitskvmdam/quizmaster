  - slug: cgl-2022-04-21-all-ss-shift1-q070
    difficulty: medium
    stem: O is the centre of a circle of radius 10 cm. P is a point outside the circle and PQ is a tangent to the circle. What is the length (in cm) of PQ if the length OP is 26 cm?
