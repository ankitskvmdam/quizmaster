      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift1-q024
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      CALI, ZEGO, WIBU, TMWA, ?
    options:
      A: QPSF
      B: QRQE
      C: QQRE
      D: QSPF
    answer: C
