  - slug: cgl-2022-04-21-all-ss-shift1-q053
    difficulty: medium
    stem: |-
      Find the value of the following expression:

      [4 1/3 + 3 1/3 × 1 4/5 ÷ 3 3/4 × (6 1/4 of 1 1/15)] ÷ [2/3 ÷ 5/6 × 2/3]
    options:
      A: 28 1/8
      B: 1/8
      C: 289 3/8
      D: 12 1/2
    answer: A
    explanation: "6 1/4 of 1 1/15 = 20/3; 10/3 × 9/5 ÷ 15/4 × 20/3 = 32/3; plus 13/3 = 15. Divisor: 2/3 ÷ 5/6 × 2/3 = 8/15. 15 ÷ 8/15 = 225/8 = 28 1/8."
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q054
    difficulty: medium
    stem: Find the smallest number which should be added to the smallest number divisible by 6, 9 and 15 to make it a perfect square.
    options:
      A: "10"
      B: "9"
      C: "19"
      D: "21"
    answer: A
