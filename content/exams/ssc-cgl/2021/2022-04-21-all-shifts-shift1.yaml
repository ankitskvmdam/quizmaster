  - slug: cgl-2022-04-21-all-ss-shift1-q058
    difficulty: medium
    stem: If 5x − 1/(4x) = 6, x > 0, then find the value of 25x² − 1/(16x²).
    options:
      A: 6√41
      B: "36"
      C: √246
      D: 6√31
    answer: A
    explanation: (5x + 1/(4x))² = (5x − 1/(4x))² + 5 = 41. So 25x² − 1/(16x²) = 6 × √41 = 6√41.
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q059
    difficulty: medium
    stem: In triangle ABC, the bisector of angle BAC meets BC at point D in such a way that AB = 10 cm, AC = 15 cm and BD = 6 cm. Find the length of BC (in cm).
    options:
      A: "17"
      B: "11"
      C: "15"
      D: "9"
    answer: C
    explanation: "Angle-bisector theorem: BD/DC = AB/AC = 10/15, so DC = 9 and BC = 6 + 9 = 15 cm."
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q060
    difficulty: medium
    stem: A and B working alone can complete a work in 8 days and 12 days, respectively. They started working together, but A left 2 days before completion of the work. In how many days was the work completed?
    options:
      A: "6"
      B: "5"
      C: "8"
      D: "10"
    answer: A
    explanation: "If the work took T days: (T − 2)/8 + T/12 = 1, so 5T = 30 and T = 6."
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q061
    difficulty: medium
    stem: Person A started a business by investing ₹65,000. After a few months, B joined him by investing ₹50,000. Three months after the joining of B, C joined the two with an investment of ₹55,000. At the end of the year, A got 50% of profit as his share. For how many months did A alone finance the business?
    options:
      A: "2"
      B: "3"
      C: "5"
      D: "4"
    answer: B
    explanation: "If A was alone for x months: 65000 × 12 = 50000(12 − x) + 55000(9 − x), so 105000x = 315000 and x = 3."
    tags:
      - quant
