    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q055
    difficulty: medium
    stem: The radii of two concentric circles with centre O are 26 cm and 16 cm. Chord AB of the larger circle is tangent to the smaller circle at C and AD is a diameter. What is the length of CD?
    options:
      A: 42 cm
      B: 36 cm
      C: 35 cm
      D: 38 cm
    answer: D
    explanation: AC = √(26² − 16²) = √420. Angle ABD = 90° and BD = 2 × OC = 32, so CD = √(420 + 1024) = √1444 = 38 cm.
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q056
    difficulty: medium
    stem: Find the sum of the greatest and the smallest number which may replace k in the number 3281k6 to make the number divisible by 6.
    options:
      A: "9"
      B: "8"
      C: "5"
      D: "4"
    answer: B
    explanation: The number is even; for divisibility by 3, 20 + k must be a multiple of 3, so k = 1, 4 or 7. 7 + 1 = 8.
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift1-q057
    difficulty: medium
