    difficulty: medium
    stem: "Chords AB and CD of a circle intersect externally at P. If AB = 7 cm, CD = 1 cm and PD = 5 cm, then the length of PB (in cm) is:"
    options:
      A: "3"
      B: "10"
      C: "8"
      D: "5"
