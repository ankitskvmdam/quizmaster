questions:
  - slug: cgl-2022-04-13-all-ss-shift2-q001
    difficulty: medium
    stem: Seven friends, E, F, G, H, I, J and K, are sitting along a circular table facing towards the centre. F and I are sitting to the immediate left and right of G, respectively. H is sitting third to the left of G. E and I are the neighbours of J. Who is sitting to the immediate right of H?
    options:
      A: H
      B: F
      C: K
      D: E
    answer: C
    explanation: "Seat G and go round: F is immediately left and I immediately right of G, H is third to G's left, and J sits between I and E. The only remaining seat for K is immediately right of H."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q002
    difficulty: medium
    stem: In a certain code language, 'ONION' is coded as 201 and 'POTATO' is coded as 261. How will 'MANGO' be coded in that language?
    options:
      A: "208"
      B: "178"
      C: "150"
      D: "228"
    answer: C
    explanation: "Code = 3 × sum of letter positions: ONION = 67 × 3 = 201, POTATO = 87 × 3 = 261, so MANGO = 50 × 3 = 150."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q003
    difficulty: medium
    stem: A cube of side 49 cm is painted purple on all the faces and then cut into smaller cubes of sides 7 cm each. Find the number of smaller cubes having only one face painted.
    options:
      A: "100"
      B: "25"
      C: "50"
      D: "150"
    answer: D
    explanation: 49 ÷ 7 = 7 cubes per edge. Cubes with one painted face = 6 × (7 − 2)² = 6 × 25 = 150.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q004
    difficulty: medium
    stem: In a certain code language, 'first of all' is written as 'kan dan san', 'who is first' is written as 'zan kan ven', and 'this is pale' is written as 'ven gen len'. How will 'who' be written in that language?
    options:
      A: zan
      B: yen
      C: kan
      D: gen
    answer: A
    explanation: "'first' = kan (statements 1, 2) and 'is' = ven (statements 2, 3), so the remaining code in 'who is first', zan, means 'who'."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q006
    difficulty: medium
    stem: "Five years ago, the ratio of the ages of Tarun and Saurabh was 4 : 1. After five years, the ratio of their ages will be 2 : 1. What is the present age (in years) of Saurabh?"
    options:
      A: "14"
      B: "10"
      C: "8"
      D: "12"
    answer: B
    explanation: T − 5 = 4(S − 5) and T + 5 = 2(S + 5). Then T = 4S − 15, so 4S − 10 = 2S + 10, giving S = 10.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q007
    difficulty: medium
    stem: Mahesh is the father of Riva and paternal grandfather of Vansh. Aakash is the brother of Riva and father of Vansh and Ritu. Ritu is the only daughter of Aakash and Maya. How is Maya related to Mahesh?
    options:
      A: Daughter-in-law
      B: Aunt
      C: Sister
      D: Daughter
    answer: A
    explanation: Maya is Aakash's wife and Aakash is Mahesh's son, so Maya is Mahesh's daughter-in-law.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q008
    difficulty: medium
    stem: |-
      Which two numbers need to be interchanged to make the following equation correct?

      7 + 56 ÷ 8 × 2 – 13 = 11
    options:
      A: 7 and 13
      B: 7 and 2
      C: 8 and 2
      D: 7 and 8
    answer: D
    explanation: Swapping 7 and 8 gives 8 + 56 ÷ 7 × 2 − 13 = 8 + 16 − 13 = 11.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q009
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 15 | 9 | 144 |
      | 18 | 12 | ? |
      | 22 | 17 | 195 |
    options:
      A: "188"
      B: "255"
      C: "180"
      D: "224"
    answer: C
    explanation: "Third number = first² − second²: 15² − 9² = 144 and 22² − 17² = 195, so 18² − 12² = 324 − 144 = 180."
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q010
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      Some pencils are pens.  
      All pens are papers.  
      All pencils are colours.

      **Conclusions:**

      I. All colours are pens.  
      II. Some colours are pencils.  
      III. Some papers are pens.
    options:
      A: Only conclusion II follows.
      B: All conclusions I, II and III follow.
      C: Only conclusions II and III follow.
      D: Only conclusions I and II follow.
    answer: C
    explanation: Some pencils are pens and all pencils are colours, so some colours are pencils (II). Pens exist and all are papers, so some papers are pens (III). Nothing says all colours are pens (I).
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q012
    difficulty: medium
    stem: Sahasra started running from her house towards the north. After 40 meters she turned left and ran for 75 meters. She then turned right and ran for 30 meters, and again turned right to run 75 meters. In which direction was she running finally?
    options:
      A: South
      B: North
      C: West
      D: East
    answer: D
    explanation: North 40 m, left (west) 75 m, right (north) 30 m, right again (east) 75 m. She ends up running east.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q013
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      61, 99, 152, 222, 312, ?
    options:
      A: "452"
      B: "426"
      C: "396"
      D: "412"
    answer: B
    explanation: Differences 38, 53, 70, 90 grow by 15, 17, 20 (which themselves grow by 2, 3, 4). Next growth is 24, so the difference is 114 and 312 + 114 = 426.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q014
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and make the given equation correct.

      88 * 120 * 42 * 240 * 48 * 2
    options:
      A: +, ÷, –, =, ×
      B: ×, ÷, =, –, +
      C: =, ×, +, ÷, –
      D: =, –, +, ÷, ×
    answer: D
    explanation: 88 = 120 − 42 + 240 ÷ 48 × 2 = 120 − 42 + 10 = 88.
    tags:
      - reasoning
  - slug: cgl-2022-04-13-all-ss-shift2-q015
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      298, 217, 168, 143, ?
    options:
      A: "138"
      B: "134"
      C: "112"
      D: "126"
    answer: B
    explanation: Differences are 81, 49, 25 (9², 7², 5²). Next is 3² = 9, so 143 − 9 = 134.
