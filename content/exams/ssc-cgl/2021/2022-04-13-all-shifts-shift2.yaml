  - slug: cgl-2022-04-13-all-ss-shift2-q024
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      CAF, HEJ, SIQ, XMU, CQF, ?
    options:
      A: MUU
      B: HUJ
      C: TUK
      D: MUJ
    answer: B
    explanation: First letters +5, +11 alternately (C, H, S, X, C, H); middle letters +4 (A, E, I, M, Q, U); last letters +4, +7 alternately (F, J, Q, U, F, J). So HUJ.
