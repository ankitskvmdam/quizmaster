      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q024
    difficulty: medium
    stem: |-
      Select the correct option that indicates the arrangement of the given words in the order in which they appear in an English dictionary.

      1. Malice  
      2. Malignant  
      3. Mallows  
      4. Malfunction  
      5. Malware
    options:
      A: 4, 2, 1, 3, 5
      B: 1, 4, 3, 2, 5
      C: 4, 1, 2, 5, 3
      D: 4, 1, 2, 3, 5
