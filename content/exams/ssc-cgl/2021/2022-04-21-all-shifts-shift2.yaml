    difficulty: medium
    stem: |-
      In the following figure, AD bisects angle BAC. Find the length (in cm) of BD.

      *(Figure: Triangle ABC with D on BC; AD bisects angle BAC. AB = 6 cm, AC = 2x−3, BD = x−2, DC = x.)*
    options:
      A: "4"
      B: "5"
      C: "9"
