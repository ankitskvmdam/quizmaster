  - slug: cgl-2022-04-21-all-ss-shift2-q052
    difficulty: medium
    stem: If cosec A = sec B, where A and B are acute angles, then what is the value of (A + B)?
    options:
      A: 0°
      B: 135°
      C: 90°
      D: 45°
    answer: C
    explanation: cosec A = sec(90° − A), so sec B = sec(90° − A) and A + B = 90°.
    tags:
      - quant
  - slug: cgl-2022-04-21-all-ss-shift2-q053
    difficulty: medium
    stem: In ΔABC, the perpendiculars drawn from A, B and C meet the opposite sides at points D, E and F, respectively. AD, BE and CF intersect at point P. If ∠EPD = 110° and the bisectors of ∠A and ∠B meet at point Q, then ∠AQB = ?
    options:
      A: 115°
      B: 110°
      C: 135°
      D: 125°
    answer: D
    explanation: In quadrilateral CDPE two angles are 90°, so ∠C = 180° − 110° = 70°. The bisectors of A and B meet at ∠AQB = 90° + C/2 = 125°.
    tags:
      - quant
