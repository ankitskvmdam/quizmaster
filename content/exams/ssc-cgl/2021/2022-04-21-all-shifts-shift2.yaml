    stem: A tyre has two punctures. The first puncture alone would have made the tyre flat in 45 minutes, and the second puncture alone would have done it in 90 minutes. If air leaks out at a constant rate, then how long (in minutes) does it take for both the punctures together to make the tyre flat?
    options:
      A: "30"
      B: "15"
      C: "40"
      D: "45"
    answer: A
