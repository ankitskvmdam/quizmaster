questions:
  - slug: cgl-2022-04-21-all-ss-shift2-q001
    difficulty: medium
    stem: Four friends, H, I, J and K, are sitting at the four corners of a square facing towards the centre. H and J are sitting at diagonally opposite corners. I is sitting to the immediate left of H. Who is sitting to the immediate right of J?
    options:
      A: H
      B: K
      C: J
      D: I
    answer: D
    explanation: Put H at the bottom corner facing the centre; I is to H's left, J is opposite H and K is the remaining corner. Facing the centre, J's immediate right is I.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q003
    difficulty: medium
    stem: In a certain code, ‘Tim Dim Kim’ means ‘India Is Big’ and ‘Dim Gim Kim Se Rim’ means ‘Tiger Is A Big Cat’. Which of the following is the code for ‘India’?
    options:
      A: Tim
      B: Dim
      C: Gim
      D: Kim
    answer: A
    explanation: "'Dim' and 'Kim' appear in both codes, so they stand for 'Is' and 'Big'. That leaves 'Tim' = 'India'."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q004
    difficulty: medium
    stem: If 80% of a number is 768, what will be 40% of 5% of that number?
    options:
      A: "16.4"
      B: "13.5"
      C: "19.2"
      D: "20.6"
    answer: C
    explanation: The number is 768 ÷ 0.8 = 960. 5% of 960 = 48, and 40% of 48 = 19.2.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q006
    difficulty: medium
    stem: In a certain code language, ‘MOHAN’ is coded as 39-45-24-3-42 and ‘KABIR’ is coded as 33-3-6-27-54. How will ‘RAGHU’ be coded in that language?
    options:
      A: 54-3-21-24-63
      B: 36-2-14-24-42
      C: 36-3-14-16-63
      D: 54-2-21-16-42
    answer: A
    explanation: Each letter's alphabet position is multiplied by 3 (M = 13 → 39). RAGHU = 54-3-21-24-63.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q007
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      Some spades are knives.

      All knives are rakes.

      **Conclusions:**

      I. Some knives are spades.

      II. Some rakes are knives.
    options:
      A: Both conclusions I and II follow.
      B: Only conclusion II follows.
      C: Only conclusion I follows.
      D: Neither conclusion I nor II follows.
    answer: A
    explanation: "'Some spades are knives' converts to 'Some knives are spades' (I). 'All knives are rakes' gives 'Some rakes are knives' (II). Both follow."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q008
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      13 : 1728 :: 17 : ?
    options:
      A: "1928"
      B: "4096"
      C: "3218"
      D: "2043"
    answer: B
    explanation: 1728 = 12³ = (13 − 1)³. So 17 → 16³ = 4096.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q009
    difficulty: medium
    stem: Introducing Reshma to a guest, a lady, Karishma, said, “She is the daughter of my father-in-law’s daughter”. How is Reshma related to Karishma?
    options:
      A: sister-in-law
      B: Sister
      C: Cousin
      D: Niece
    answer: D
    explanation: Karishma's father-in-law's daughter is her husband's sister; that sister's daughter is Karishma's niece.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q011
    difficulty: medium
    stem: |-
      Select the option that is related to the third letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster.

      GTQ : JVP :: SDK : ?
    options:
      A: VFJ
      B: UGF
      C: UEK
      D: VGK
    answer: A
    explanation: "Letters shift +3, +2, −1: G→J, T→V, Q→P. So S→V, D→F, K→J gives VFJ."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q012
    difficulty: medium
    stem: |-
      Three different positions of the same dice are shown. Select the letter that will be on the face opposite to the face having the letter ‘C’.

      *(Figure: Three views of the dice: (1) B on top, F and D on the visible side faces; (2) B on top, E and C on the visible side faces; (3) E on top, D and A on the visible side faces.)*
    options:
      A: A
      B: B
      C: E
      D: D
    answer: D
    explanation: B touches F, D, E and C, so B is opposite A. E touches B, C, D and A, so E is opposite F. That leaves C opposite D.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q013
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      CLAY, DIFX, EFKW, FCPV, ?
    options:
      A: HZUW
      B: GZUU
      C: HUZT
      D: GUZU
    answer: B
    explanation: First letters +1 (G), second −3 (C→Z), third +5 (P→U), fourth −1 (V→U). So GZUU.
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q014
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the one that is different.
    options:
      A: CEV
      B: QSH
      C: KMN
      D: MPI
    answer: D
    explanation: In CEV, QSH and KMN the second letter is two places after the first; in MPI it is three places after (M→P).
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q015
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      14, 20, 34, 72, 182, ?
    options:
      A: "308"
      B: "508"
      C: "580"
      D: "380"
    answer: B
    explanation: "Differences 6, 14, 38, 110 themselves differ by 8, 24, 72 (×3). Next: 72 × 3 = 216, so the difference is 326 and 182 + 326 = 508."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q016
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      74, 101, 128, 155, ?
    options:
      A: "198"
      B: "173"
      C: "210"
      D: "182"
    answer: D
    explanation: "Each term is 27 more than the previous one: 155 + 27 = 182."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q017
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number from among the given options that can replace the question mark (?) in it.

      12 36 60

      72 3 4 63 4 12 98 ? 15

      12 9 14

      *(Figure: The pattern is printed as flattened text in three lines (its original figure layout is lost); copied as printed.)*
    options:
      A: "4"
      B: "5"
      C: "2"
      D: "3"
    answer: D
    explanation: "Reading each figure as top, left, centre, right, bottom: centre = left ÷ bottom − top ÷ right. 72/12 − 12/4 = 3, 63/9 − 36/12 = 4, so 98/14 − 60/15 = 7 − 4 = 3."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q019
    difficulty: medium
    stem: |-
      Which two numbers (NOT digits) need to be interchanged to make the following equation correct?

      8 + 48 ÷ 12 × 5 − 13 = 29
    options:
      A: 8 and 5
      B: 13 and 8
      C: 8 and 12
      D: 12 and 13
    answer: C
    explanation: "Swapping 8 and 12: 12 + 48 ÷ 8 × 5 − 13 = 12 + 30 − 13 = 29."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q022
    difficulty: medium
    stem: |-
      Which two signs should be interchanged to make the given equation correct?

      13+15×8 ÷96−4=109
    options:
      A: ÷ and −
      B: + and ÷
      C: − and +
      D: × and −
    answer: A
    explanation: "Swapping ÷ and −: 13 + 15 × 8 − 96 ÷ 4 = 13 + 120 − 24 = 109."
    tags:
      - reasoning
  - slug: cgl-2022-04-21-all-ss-shift2-q023
    difficulty: medium
    stem: |-
      Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.

