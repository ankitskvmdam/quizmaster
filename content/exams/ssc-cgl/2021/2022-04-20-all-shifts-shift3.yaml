  - slug: cgl-2022-04-20-all-ss-shift3-q053
    difficulty: medium
    stem: |-
      The number of cars passing the road near a colony from 6 am to 12 noon has been shown in the following histogram.

      During which hour(s) is the number of cars passed less than the average number of cars passed from 7 am to 12 noon?

      | Time of the day | 6–7 | 7–8 | 8–9 | 9–10 | 10–11 | 11–12 |
      |---|---|---|---|---|---|---|
      | Number of Cars | 70 | 105 | 130 | 115 | 95 | 45 |

      *(Figure: Histogram (x-axis: Time of the day, 6 to 12; y-axis: Number of Cars) with bars 70, 105, 130, 115, 95, 45 for the hours 6–7 to 11–12; transcribed as a table in the stem.)*
    options:
      A: 6–7, 10–11, 11–12
      B: 10–11, 11–12
      C: 7–8, 8–9, 9–10
      D: 6–7, 11–12
    answer: A
    explanation: The average from 7 am to 12 noon is (105 + 130 + 115 + 95 + 45)/5 = 98. The hours below 98 are 6–7 (70), 10–11 (95) and 11–12 (45).
    tags:
      - quant
