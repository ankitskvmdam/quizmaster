    difficulty: medium
    stem: A and B can do a work in 12 days and 18 days, respectively. They worked together for 4 days after which B was replaced by C and the remaining work was completed by A and C in the next 4 days. In how many days will C alone complete 50% of the same work?
    options:
      A: "24"
      B: "18"
      C: "21"
      D: "36"
    answer: B
    explanation: A and B do 4 × (1/12 + 1/18) = 5/9 in 4 days. A then does 4/12 = 3/9, so C did 1/9 in 4 days. C alone needs 36 days for the whole work, or 18 days for half.
    tags:
