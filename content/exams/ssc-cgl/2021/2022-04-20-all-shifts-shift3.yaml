  - slug: cgl-2022-04-20-all-ss-shift3-q024
    difficulty: medium
    stem: Six students, Abhay, Bhanu, Charu, David, Ekta and Farheen, are the top six rank holders in a school. The rank of Bhanu is between the ranks of Charu and David. Bhanu is on the fourth rank. There are two students between the ranks of Ekta and David. Ekta is at the lowest rank among all the given students. The rank of Abhay is immediately below the rank of Farheen. Who is on the fifth rank?
    options:
      A: Ekta
      B: Charu
      C: David
      D: Abhay
