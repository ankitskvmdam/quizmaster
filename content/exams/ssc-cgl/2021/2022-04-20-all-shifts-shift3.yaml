  - slug: cgl-2022-04-20-all-ss-shift3-q026
    difficulty: medium
    stem: Decrease in which of the following factors leads to an increase in the rate of evaporation?
    options:
      A: Ambient temperature
      B: Humidity
      C: Area of the free surface of the liquid concerned
      D: Wind speed above the surface of the liquid
