      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q025
    difficulty: medium
    stem: Vaidehi got 92% marks in an examination and Kavyanjali got 78% marks in the same examination. If the difference between the marks obtained by Vaidehi and Kavyanjali is 105, find the marks obtained by Vaidehi in the examination.
    options:
      A: "736"
      B: "644"
      C: "690"
      D: "598"
    answer: C
    explanation: 92% − 78% = 14% of the total = 105, so the total is 750. Vaidehi got 92% of 750 = 690.
