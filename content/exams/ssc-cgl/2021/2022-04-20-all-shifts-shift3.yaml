questions:
  - slug: cgl-2022-04-20-all-ss-shift3-q001
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      55, 63, ?, 343, 855, 1855
    options:
      A: "135"
      B: "117"
      C: "223"
      D: "127"
    answer: D
    explanation: "The differences are even cubes: 2³ = 8, 4³ = 64, 6³ = 216, 8³ = 512, 10³ = 1000. So the missing term is 63 + 64 = 127."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q002
    difficulty: medium
    stem: Shashank walks a certain distance, say X m, towards the west, then turns left and walks 35 m, and then turns right and walks 18 m. From there, he turns left and walks 9 m, and then turns left again and walks 60 m. From there, he turns left and walks 9 m, and then turns left again and walks 12 m. He finally turns right and walks 35 m to reach a point that is exactly 10 m to the east of the starting point. What is the value of X?
    options:
      A: "20"
      B: "22"
      C: "30"
      D: "36"
    answer: A
    explanation: Adding up the moves, the north–south legs cancel and the net east–west position is −X − 18 + 60 − 12 = 30 − X. This equals +10 m (east), so X = 20.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q003
    difficulty: medium
    stem: |-
      Select the number-pair in which the two numbers share the same relationship as that shared by the given pair of numbers.

      14 : 421
    options:
      A: "13 : 310"
      B: "11 : 265"
      C: "18 : 611"
      D: "16 : 421"
    answer: B
    explanation: 421 = 14² + 15² (n² + (n + 1)²). Likewise 11² + 12² = 121 + 144 = 265.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q004
    difficulty: medium
    stem: If the signs ‘–’ and ‘×’ are interchanged, then which of the following equations can be correctly balanced?
    options:
      A: 64 ÷ 8 – 22 × 3 + 30 = 103
      B: 36 + 14 × 18 ÷ 3 – 12 = 72
      C: 119 ÷ 17 – 6 + 24 × 34 = 32
      D: 42 ÷ 6 – 18 + 30 × 7 = 146
    answer: C
    explanation: After swapping, 119 ÷ 17 × 6 + 24 − 34 = 42 + 24 − 34 = 32.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q005
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      9, 29, 67, 129, ?, 349
    options:
      A: "242"
      B: "185"
      C: "221"
      D: "178"
    answer: C
    explanation: "Terms are n³ + (n − 1) for n = 2 to 7: 8+1, 27+2, 64+3, 125+4, 216+5 = 221, 343+6 = 349."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q006
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:  
      Some locks are keys.  
      No key is a chain.  
      All springs are chains.

      Conclusions:  
      I. Some keys are springs.  
      II. No key is a spring.  
      III. No lock is a spring.
    options:
      A: Only conclusion II follows.
      B: Only conclusions I and II follow.
      C: None of the conclusions follow.
      D: Either conclusion I or II follows.
    answer: A
    explanation: All springs are chains and no key is a chain, so no key is a spring (II). I is false, and III cannot be concluded.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q007
    difficulty: medium
    stem: In a certain code language, 'PENCIL' is written as 'MKFRJV' and 'ERASER' is written as 'SGVEWK'. How will 'MASTER' be written in that language?
    options:
      A: REWWGT
      B: SGWWFS
      C: RFWVES
      D: SFWYFT
    answer: B
    explanation: Reverse the word, then add 1, 2, 3, 4, 5, 6 in turn. MASTER → RETSAM → S G W W F S.
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q008
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 12 | 7 | 70 |
      | 15 | 6 | 78 |
      | 11 | 9 | ? |
    options:
      A: "75"
      B: "85"
      C: "81"
      D: "76"
    answer: C
    explanation: "In each row, (first − 2) × second = third: 10 × 7 = 70, 13 × 6 = 78, so 9 × 9 = 81."
    tags:
      - reasoning
  - slug: cgl-2022-04-20-all-ss-shift3-q009
    difficulty: medium
    stem: In a certain code language, 'STREAM' is coded as 161418445228. How will 'PERIOD' be coded in that language?
