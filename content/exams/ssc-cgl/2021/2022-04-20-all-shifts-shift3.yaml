    stem: In a right-angled triangle PQR, ∠Q = 90°. A and B are the mid-points of PQ and PR, respectively. If PQ = 16 cm, QR = 30 cm and PR = 34 cm, what is perimeter (in cm) of the trapezium ABRQ?
