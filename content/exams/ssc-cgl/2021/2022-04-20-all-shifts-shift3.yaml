    stem: "If a + b + c = 6, a² + b² + c² = 32, and a³ + b³ + c³ = 189, then the value of 4abc is:"
    options:
      A: "12"
      B: "16"
      C: "9"
      D: "8"
    answer: A
    explanation: ab + bc + ca = (36 − 32)/2 = 2. a³ + b³ + c³ − 3abc = 6(32 − 2) = 180, so 3abc = 9, abc = 3 and 4abc = 12.
    tags:
      - quant
