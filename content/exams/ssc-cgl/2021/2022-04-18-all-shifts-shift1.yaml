questions:
  - slug: cgl-2022-04-18-all-ss-shift1-q001
    difficulty: medium
    stem: In a certain code, 6218 means ‘Laptop is a computer’ and 8217 means ‘Computer is a machine’. Which of the following is the code for ‘Machine makes our life easy’?
    options:
      A: "75344"
      B: "75894"
      C: "58795"
      D: "76834"
    answer: A
    explanation: "The common digits 2, 1, 8 stand for ‘is’, ‘a’, ‘computer’, so ‘machine’ = 7 and ‘laptop’ = 6. The new code must contain 7 and none of 1, 2, 6, 8: only 75344 fits."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q002
    difficulty: medium
    stem: |-
      Six letters, D, d, E, e, F and f, are written on the different faces of a dice. Two positions of this dice are shown. Select the letter that will be on the face opposite to the face having the letter ‘D’.

      *(Figure: Two views of the dice: first shows e on top, F and D on the visible side faces; second shows e on top, d and f on the visible side faces.)*
    options:
      A: E
      B: f
      C: e
      D: d
    answer: B
    explanation: e is on top in both views, so D, F, d and f are the four side faces. Going round from the views, the order is F, D, d, f, so D is opposite f.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q003
    difficulty: medium
    stem: Nine employees, K, L, M, N, O, P, Q, R and S, are sitting in the office in a straight line, all facing the east. O is third to the right of M. K is third to the left of P. Q is between P and S. N is fourth to the right of M. P is to the immediate right of N. R is fourth to the left of O. Which of the following statements is NOT correct?
    options:
      A: R and S are sitting at the corners.
      B: L is sitting third to the left of O.
      C: Q is sitting fourth to the right of K.
      D: O is sitting between K and N.
    answer: B
    explanation: The row (left to right) is R M L K O N P Q S. L is second, not third, to the left of O, so statement B is wrong.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q005
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the one that is different.
    options:
      A: TWY
      B: GJM
      C: LOQ
      D: BEG
    answer: B
    explanation: TWY, LOQ and BEG go +3 then +2 (T→W→Y). GJM goes +3, +3, so it is the odd one.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q006
    difficulty: medium
    stem: |-
      Select the option that is related to the third term in the same way as the second term is related to the first term.

      HARMONY : BMLGUDK :: RESOLVE : ?
    options:
      A: VEOIVHU
      B: OVEJUHV
      C: EVOJHVU
      D: VOEIUVH
    answer: A
    explanation: "Reverse the word (YNOMRAH), write the opposite letters of the first three (Y→B, N→M, O→L), move the 4th back 6 (M→G) and the rest forward 3 (R→U, A→D, H→K). RESOLVE → EVLOSER → V E O, then O→I, S→V, E→H, R→U: VEOIVHU."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q007
    difficulty: medium
    stem: In a certain code language, if ESTEEM is written as HVWHHP, then how will DOCTOR be written in the same code language?
    options:
      A: GRFWRU
      B: GRGVST
      C: FQEVQT
      D: HSGXSV
    answer: A
    explanation: Each letter moves +3 (E→H, S→V, T→W, M→P). DOCTOR → GRFWRU.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q008
    difficulty: medium
    stem: |-
      If A denotes ‘addition’, B denotes ‘multiplication’, C denotes ‘subtraction’, and D denotes ‘division’, then what will be the value of the following expression?

      66 A (132 D 12) C (4 A 3) B (15 D 5) A 16 B (−3)
    options:
      A: "8"
      B: "10"
      C: "6"
      D: "56"
    answer: A
    explanation: 66 + (132 ÷ 12) − (4 + 3) × (15 ÷ 5) + 16 × (−3) = 66 + 11 − 21 − 48 = 8.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q009
    difficulty: medium
    stem: |-
      If '@' means 'addition', '%' means 'multiplication', 'S' means 'division', and '#' means 'subtraction', then find the value of the following expression.

      23 @ 105 S 15 % 6 # 29
    options:
      A: "23"
      B: "28"
      C: "36"
      D: "40"
    answer: C
    explanation: 23 + 105 ÷ 15 × 6 − 29 = 23 + 42 − 29 = 36.
    tags:
      - reasoning
