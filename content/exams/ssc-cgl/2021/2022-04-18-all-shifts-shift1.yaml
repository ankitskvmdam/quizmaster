  - slug: cgl-2022-04-18-all-ss-shift1-q014
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number and the sixth number is related to the fifth number.

      21 : 112 :: 36 : ? :: 51 : 272
    options:
      A: "192"
      B: "252"
      C: "72"
      D: "198"
    answer: A
    explanation: 112 = 21 × 16/3 and 272 = 51 × 16/3, so 36 × 16/3 = 192.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q015
    difficulty: medium
    stem: The average salary of the entire teaching staff in a college is ₹2,000 per day. The average salary of the male teachers is ₹2,500 and that of the female teachers is ₹1,200. If the number of male teachers is 16, then find the number of female teachers in the college.
    options:
      A: "12"
      B: "10"
      C: "18"
      D: "14"
    answer: B
    explanation: "Men are ₹500 above the average: 16 × 500 = 8,000. Each woman is ₹800 below it, so 8,000 ÷ 800 = 10 women."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q016
    difficulty: medium
    stem: |-
      Study the given matrix carefully and select the number from among the given options that can replace the question mark (?) in it.

      12 8 100  
      18 6 111  
      15 4 ?
    options:
      A: "102"
      B: "108"
      C: "62"
      D: "78"
    answer: C
    explanation: "Row rule: first × second + second ÷ 2: 12 × 8 + 4 = 100, 18 × 6 + 3 = 111, so 15 × 4 + 2 = 62."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q017
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:  
      All bats are birds.  
      Some rats are bats.

      Conclusions:  
      I. Some rats are birds.  
      II. Some birds are bats.  
      III. All rats are bats.
    options:
      A: Only conclusion II follows.
      B: Only conclusions I and II follow.
      C: Only conclusions I and III follow.
      D: Only conclusion I follows.
    answer: B
    explanation: Some rats are bats and all bats are birds, so some rats are birds (I); all bats are birds gives some birds are bats (II). III does not follow.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q018
    difficulty: medium
    stem: |-
      Six letters A, B, C, D, E and F are written on different faces of a dice. Two positions of the same dice are shown. Select the letter that will be on the face opposite to the face having the letter ‘C’.

      *(Figure: Two views of the dice: first shows A on top with C and F on the side faces; second shows A on top with E and D on the side faces.)*
    options:
      A: F
      B: D
      C: B
      D: E
    answer: D
    explanation: A is on top in both views, so C, F, E and D are the side faces. Going round in order C, F, E, D, the face opposite C is E.
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q019
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      3, 11, 31, 69, 131, ?
    options:
      A: "152"
      B: "163"
      C: "198"
      D: "223"
    answer: D
    explanation: "Terms are n³ + (n + 1): 1+2, 8+3, 27+4, 64+5, 125+6, so next is 216 + 7 = 223."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q021
    difficulty: medium
    stem: In a certain code language ‘ROUBST’ is coded as 61. How will ‘FORTUNATE’ be coded in that language?
    options:
      A: "124"
      B: "114"
      C: "141"
      D: "142"
    answer: B
    explanation: "Code = sum of reverse alphabet positions (A=26 … Z=1) minus the number of letters. ROUBST: 67 − 6 = 61. FORTUNATE: 123 − 9 = 114."
    tags:
      - reasoning
  - slug: cgl-2022-04-18-all-ss-shift1-q022
