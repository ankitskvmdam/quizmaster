  - slug: cgl-2022-04-18-all-ss-shift1-q025
    difficulty: medium
    stem: |-
      ‘A + B’ means ‘A is the daughter of B’.  
      ‘A # B’ means ‘A is the husband of B’.  
      ‘A @ B’ means ‘A is the brother of B’.  
      ‘A & B’ means ‘A is the mother of B’.  
      ‘A % B’ means ‘A is the son of B’.

      If ‘W @ S % K # G & U & T @ R + C’, then which of the following statements is correct?
    options:
      A: G is the maternal grandmother of R.
      B: G is the father of W.
      C: C is the father-in-law of K.
      D: C is the wife of U.
    answer: A
    explanation: "K is G’s husband; G is U’s mother; U is the mother of T and R (R is C’s daughter, so C is U’s husband). G is the mother of R’s mother: maternal grandmother."
    tags:
      - reasoning
