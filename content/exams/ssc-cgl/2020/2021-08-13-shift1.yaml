questions:
  - slug: cgl-2021-08-13-s1-q001
    difficulty: medium
    stem: |-
      Select the option in which the words share the same relationship as that shared by the given pair of words.

      Horses : Neigh
    options:
      A: "Pigs : Buzz"
      B: "Hares : Boom"
      C: "Ducks : Quack"
      D: "Parrots : Bray"
    answer: C
    explanation: A horse's cry is a neigh; a duck's cry is a quack.
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q002
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      **Statements:**

      All polygons are angles.  
      All angles are diagonals.  
      All cones are cubes.  
      All cubes are decagons.  
      No diagonal is a cube.

      **Conclusions:**

      I. Some diagonals are polygons.  
      II. All diagonals are decagons.  
      III. No polygon is a cone.  
      IV. Some cubes are angles.
    options:
      A: Both conclusions II and IV follow
      B: Both conclusions I and III follow
      C: Both conclusions I and II follow
      D: Only conclusion I follows
    answer: B
    explanation: |-
      Polygons lie inside angles, which lie inside diagonals, so some diagonals are polygons (I).
      Cones lie inside cubes and no diagonal is a cube, so no polygon (a diagonal) can be a cone (III). II and IV do not follow.
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q005
    difficulty: medium
    stem: |-
      A cube is made by folding the given sheet. In the cube so formed, what would be the symbol on the opposite side of the # symbol?

      *(Figure: Net of six squares: a right-hand column of three squares (& at top, @ below it, # below that); % sits to the left of #, and below % are ＄ and then +.)*
    options:
      A: ＄
      B: +
      C: "&"
      D: "%"
    answer: C
    explanation: "&, @ and # lie in one straight column of three squares, so the first and third (& and #) are opposite faces."
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q006
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      24, 35, 51, 73, 102, ?
    options:
      A: "139"
      B: "151"
      C: "131"
      D: "149"
    answer: A
    explanation: "The differences are 11, 16, 22, 29, which themselves grow by 5, 6, 7. The next difference is 37: 102 + 37 = 139."
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q007
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number.

      12 : 60 :: 16 : ?
    options:
      A: "121"
      B: "210"
      C: "112"
      D: "201"
    answer: C
    explanation: 60 = 12 × (12/2 − 1) = 12 × 5. So 16 × (16/2 − 1) = 16 × 7 = 112.
    tags:
      - reasoning
