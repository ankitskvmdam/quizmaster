  - slug: cgl-2021-08-13-s1-q022
    difficulty: medium
    stem: In a certain code language, ‘AROUND’ is coded as ‘52182412144’ and ‘FIX’ is coded as ‘63624’. How will ‘PLASTIC’ be coded in that language?
    options:
      A: "1612522021363"
      B: "1612261920183"
      C: "1812521920383"
      D: "1612521920363"
    answer: D
    explanation: |-
      Consonants keep their alphabet position; each vowel becomes twice its reverse position (A = 26 × 2 = 52, I = 18 × 2 = 36).
      PLASTIC = 16, 12, 52, 19, 20, 36, 3 = 1612521920363.
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q023
