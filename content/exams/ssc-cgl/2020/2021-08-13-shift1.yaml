  - slug: cgl-2021-08-13-s1-q014
    difficulty: medium
    stem: Out of the total number of players, 100/3 % are in hotel X and the remaining are in hotel Y. If 20 players from hotel Y are shifted to hotel X, then the number of players in hotel X becomes 50% of the total number of players. If 20 players from hotel X are shifted to hotel Y, then the number of players in hotel X becomes what per cent of the total number of players?
    options:
      A: 16.67%
      B: 20.67%
      C: 12.75%
      D: 26.34%
    answer: A
    explanation: |-
      X = T/3. Adding 20 makes X half the total: T/3 + 20 = T/2, so T = 120 and X = 40.
      Moving 20 out instead leaves 20 = 20/120 = 16.67%.
    tags:
      - reasoning
