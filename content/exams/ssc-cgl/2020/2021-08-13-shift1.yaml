    stem: "Let Δ ABC ~Δ PQR and ar(ΔABC)/ar(ΔQPR) = 144/49. If AB = 12 cm, BC = 7 cm and AC = 9 cm, then PR (in cm) is equal to:"
    options:
      A: 49/12
      B: 108/7
