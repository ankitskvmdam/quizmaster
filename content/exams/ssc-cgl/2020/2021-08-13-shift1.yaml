  - slug: cgl-2021-08-13-s1-q016
    difficulty: medium
    stem: |-
      How many triangles are there in the given figure?

      *(Figure: A long rectangle divided by a vertical line; a large right triangle rises above its left part (vertical side up from the rectangle, hypotenuse sloping down to the right through the rectangle), and two further slanted lines inside the rectangle form small triangles.)*
    options:
      A: "10"
      B: "12"
      C: "11"
      D: "13"
    answer: C
    explanation: |-
      From the point where the slanting lines meet the top edge: 3 triangles each on the short horizontal and on the base = 6.
      Add 3 using the top vertex of the tall triangle, the triangle left of the left slanting line, and the small one at the top-right corner: 11.
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q017
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      PNNA, RPPE, TRRI, VTTO, ?
    options:
      A: YVVU
      B: XWWU
      C: YUUV
      D: XVVU
    answer: D
    explanation: "The first letter moves +2 (P, R, T, V, X), the 2nd and 3rd letters move +2 (N, P, R, T, V), and the last letter runs through the vowels A, E, I, O, U: XVVU."
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q019
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      | | | |
      |---|---|---|
      | 4 | 7 | 6 |
      | 15 | ? | 21 |
      | 44 | 68 | 60 |
    options:
      A: "18"
      B: "20"
      C: "24"
      D: "19"
    answer: C
    explanation: |-
      Bottom = 2 × (top + middle) + 6: 2 × (4 + 15) + 6 = 44, 2 × (6 + 21) + 6 = 60.
      So 2 × (7 + ?) + 6 = 68 gives ? = 24.
    tags:
      - reasoning
  - slug: cgl-2021-08-13-s1-q020
