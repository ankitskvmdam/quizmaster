    difficulty: medium
    stem: In a certain code language, 'PERMIT' is written as 'VVLNOG'. How will 'INERTIA' be written in that language?
    options:
      A: OMYIZRU
      B: XOYHCZU
      C: XYOHBCU
      D: OHYXZCU
    answer: A
    explanation: |-
      Letters in positions 1, 3, 5, 7 move +6, −6, +6, −6; letters in positions 2, 4, 6 are replaced by their opposites (E↔V, M↔N, T↔G).
      INERTIA → O, M, Y, I, Z, R, U = OMYIZRU.
