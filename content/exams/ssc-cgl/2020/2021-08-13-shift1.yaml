  - slug: cgl-2021-08-13-s1-q011
    difficulty: medium
    stem: |-
      Select the correct combination of mathematical signs that can sequentially replace the * signs and balance the given equation.

      42 * 7 * 64 * 11 * 6 *4
    options:
      A: ÷, +, −, ×, =
      B: ×, +, −, ÷, =
      C: ÷, −, +, ×, =
      D: ×, −, +, ÷, =
    answer: A
    explanation: 42 ÷ 7 + 64 − 11 × 6 = 6 + 64 − 66 = 4, which balances the equation.
    tags:
