  - slug: cgl-2021-08-13-s1-q010
    difficulty: medium
    stem: P, L, T, B, N and D are six members of a business family. N is the son of B, who is not the mother of N. L is the brother of B. D and B are a married couple. T is the daughter of D, who is the sister of P. How is N related to T?
    options:
      A: Sister
      B: Mother
      C: Father
      D: Brother
    answer: D
    explanation: B is N's father and D, B's wife, is the mother. T is D's daughter, so N and T are siblings and N, being a son, is T's brother.
