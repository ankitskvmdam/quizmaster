questions:
  - slug: cgl-2021-08-16-s2-q002
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      5, 13, 22, 34, 51, 75, 108, 152, ?
    options:
      A: "230"
      B: "203"
      C: "209"
      D: "290"
    answer: C
    explanation: |-
      Differences are 8, 9, 12, 17, 24, 33, 44, and these grow by 1, 3, 5, 7, 9, 11.
      The next difference is 44 + 13 = 57, so 152 + 57 = 209.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q003
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      GCB, JHE, MMH, PRK, ?
    options:
      A: RVM
      B: TXO
      C: SWN
      D: SXM
    answer: C
    explanation: |-
      First letters G, J, M, P, S (+3); second letters C, H, M, R, W (+5); third letters B, E, H, K, N (+3).
      So the next cluster is SWN.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q004
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: IDWG
      B: BTGN
      C: FJQL
      D: EMNK
    answer: C
    explanation: |-
      Sum of letter positions: IDWG = 9+4+23+7 = 43, BTGN = 43, EMNK = 43, but FJQL = 6+10+17+12 = 45.
      So FJQL is the odd one.
    tags:
      - reasoning
