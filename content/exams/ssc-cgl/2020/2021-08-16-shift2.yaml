      C: cosec²θ sec²θ
      D: sin²θ cosθ
    answer: A
    explanation: |-
      The first two terms are cos³θ/sinθ + sin³θ/cosθ = (cos⁴θ + sin⁴θ)/(sinθ cosθ). Adding 2 sinθ cosθ gives (cos²θ + sin²θ)²/(sinθ cosθ).
