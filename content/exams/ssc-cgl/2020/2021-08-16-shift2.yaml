  - slug: cgl-2021-08-16-s2-q007
    difficulty: medium
    stem: The present age of a father is three times that of his elder son. Four years hence, the age of the father will be four times that of his younger son. If the difference between the present ages of the elder and younger child is 6 years, what is the present age of the father?
    options:
      A: 36 years
      B: 32 years
      C: 38 years
      D: 42 years
    answer: A
    explanation: |-
      Father = 36 gives elder son 12 and younger son 6; in four years 40 = 4 × 10, which fits.
      So the father is 36 years old.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q009
    difficulty: medium
    stem: |-
      Select the correct sequence of mathematical signs that can sequentially replace the * signs and balance the given equation.

      6 * 10 * 55 * 162 * 9 = 23
    options:
      A: ×, −, +, ÷
      B: ×, ÷, −, +
      C: ÷, +, ×, −
      D: +, −, ÷, ×
    answer: A
    explanation: "With ×, −, +, ÷: 6 × 10 − 55 + 162 ÷ 9 = 60 − 55 + 18 = 23."
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q010
    difficulty: medium
    stem: |-
      Select the option that is related to the third number in the same way as the second number is related to the first number and the sixth number is related to the fifth number.

      15 : 135 :: 16 : ? :: 18 : 189
    options:
      A: "152"
      B: "121"
      C: "131"
      D: "141"
    answer: A
    explanation: |-
      Rule: n → n(n + 3)/2. 15 × 18/2 = 135 and 18 × 21/2 = 189.
      So 16 → 16 × 19/2 = 152.
    tags:
      - reasoning
