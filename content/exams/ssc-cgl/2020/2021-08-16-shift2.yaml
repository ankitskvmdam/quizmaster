  - slug: cgl-2021-08-16-s2-q023
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      22 32 7  
      18 24 5  
      32 40 ?
    options:
      A: "4"
      B: "8"
      C: "12"
      D: "10"
    answer: B
    explanation: |-
      Column-wise, third row = 3 × second row − first row: 3 × 18 − 22 = 32 and 3 × 24 − 32 = 40.
      So 3 × 5 − 7 = 8.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q024
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follows from the statements.

      Statements:  
      All computers are laptops.  
      All hard disks are pen drives.  
      No pen drive is a keyboard.  
      No computer is a hard disk.

      Conclusions:  
      I. Some pen drives are not laptops.  
      II. No keyboard is a computer.  
      III. No hard disk is a laptop.  
      IV. All pen drives are not keyboards.
    options:
      A: Only conclusion III follows
      B: Only conclusion I follows
      C: Only conclusion II follows
      D: Only conclusion IV follows
    answer: D
    explanation: |-
      "All pen drives are not keyboards" just restates "No pen drive is a keyboard", so IV follows.
      I, II and III are possible but not certain.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q025
    difficulty: medium
    stem: |-
      Study the given pattern carefully and select the number that can replace the question mark (?) in it.

      6 11 14  
      8 3 ?  
      62 47 89
    options:
      A: "15"
      B: "5"
      C: "6"
      D: "4"
    answer: B
    explanation: |-
      Third row = a × b + a + b: 6×8 + 6 + 8 = 62 and 11×3 + 11 + 3 = 47.
      For the last column, 14x + 14 + x = 89, so x = 5.
    tags:
      - reasoning
