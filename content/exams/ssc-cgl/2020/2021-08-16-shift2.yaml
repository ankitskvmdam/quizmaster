    stem: If 4x⁴ − 37x² + 9 = 0, x > √(3/2), then what is the value of 8x³ − 27/x³ ?
    options:
      A: "35"
      B: "215"
      C: "-215"
      D: "-35"
    answer: B
    explanation: |-
      Solving 4x⁴ − 37x² + 9 = 0 gives x² = 9 or 1/4; since x > √1.5, x = 3.
