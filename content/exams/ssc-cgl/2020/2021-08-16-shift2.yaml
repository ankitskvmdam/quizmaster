  - slug: cgl-2021-08-16-s2-q016
    difficulty: medium
    stem: In a certain code language, 'MORBID' is written as 'THGMID'. How will 'OBTAIN' be written in that language?
    options:
      A: GFOJDS
      B: JOFGSD
      C: GJFOSD
      D: JGOFDS
    answer: C
    explanation: |-
      Split MORBID into pairs MO RB ID, swap each pair (OM BR DI), then +5 on the first letter and −5 on the second: TH GM ID.
      OBTAIN → BO AT NI → GJ FO SD = GJFOSD.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q017
    difficulty: medium
    stem: Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the number-pair that is different.
    options:
      A: "169 : 55"
      B: "289 : 70"
      C: "256 : 61"
      D: "324 : 64"
    answer: D
    explanation: |-
      Second number = 3 × √(first) + digit sum of first: 169 → 39 + 16 = 55, 289 → 51 + 19 = 70, 256 → 48 + 13 = 61.
      324 → 54 + 9 = 63, not 64, so 324 : 64 is the odd pair.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q018
    difficulty: medium
    stem: Introducing Rajat to a guest, Ajay said, "He is the only son of my father's daughter-in law". How is Ajay related to Rajat?
    options:
      A: Paternal grandfather
      B: Maternal grandfather
      C: Brother
      D: Either father or uncle
    answer: D
    explanation: |-
      Ajay's father's daughter-in-law is Ajay's wife or his brother's wife, so her only son Rajat is Ajay's son or nephew.
      Ajay is either Rajat's father or his uncle.
    tags:
      - reasoning
