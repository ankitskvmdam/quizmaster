  - slug: cgl-2021-08-16-s2-q059
    difficulty: medium
    stem: A and B can complete a work in 15 days and 10 days respectively. They started doing the work together but after 4 days B had to leave. Then A working with a new worker C completed the remaining work in 3 days. If C works alone, in how many days he can do 40% of the same work?
