  - slug: cgl-2021-08-16-s2-q062
    difficulty: medium
    stem: If the nine-digit number 7p5964q28 is completely divisible by 88, what is the value of (p² − q), for the largest value of q, where p and q are natural numbers?
    options:
      A: "81"
      B: "9"
      C: "0"
      D: "72"
    answer: D
    explanation: |-
      For 8: q28 must be divisible by 8, so q is odd. For 11: (7+5+6+q+8) − (p+9+4+2) = 11 + q − p, so q = p.
      The largest q is 9, so p = 9 and p² − q = 81 − 9 = 72.
