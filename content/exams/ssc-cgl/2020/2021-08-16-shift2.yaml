  - slug: cgl-2021-08-16-s2-q012
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown, the six faces of which are marked as 'AT', 'IN', 'SO', 'WE', 'GO' and 'TO'. Select the word that will be on the face opposite to the face showing the word 'TO'.

      *(Figure: Dice 1: top TO, front WE, right AT. Dice 2: top WE, front IN, right GO.)*
    options:
      A: AT
      B: SO
      C: GO
      D: IN
    answer: C
    explanation: |-
      WE is common to both dice, and TO, AT, IN, GO all touch WE, so SO is opposite WE.
      Turning dice 2 to match dice 1 puts GO on the face opposite TO.
    tags:
      - reasoning
  - slug: cgl-2021-08-16-s2-q013
    difficulty: medium
    stem: In a certain code language, ‘ALPINE’ is coded as ‘171’ and ‘SPRING’ is coded as ‘83’. How will ‘CAPITAL’ be coded in that language?
    options:
      A: "124"
      B: "93"
      C: "62"
      D: "186"
    answer: D
    explanation: |-
      Code = (sum of letter positions) × (number of vowels): ALPINE 57 × 3 = 171, SPRING 83 × 1 = 83.
      CAPITAL = 3+1+16+9+20+1+12 = 62, with 3 vowels → 186.
    tags:
      - reasoning
