  - slug: cgl-2021-08-16-s2-q053
    difficulty: medium
    stem: |-
      Table shows income (in ₹) received by 4 employees of a company during the month of December 2020 and all their income sources.

      | Source | Amit | Suresh | Nitin | Varun |
      |---|---|---|---|---|
      | Salary | 35000 | 38500 | 29000 | 42000 |
      | Arrears | 6000 | 6300 | 5000 | 7500 |
