      B: 8 1/2
      C: "8"
      D: "10"
    answer: A
    explanation: |-
      In 4 days A and B finish 4 × (1/15 + 1/10) = 2/3. A and C do the remaining 1/3 in 3 days, so A + C = 1/9 per day and C = 1/9 − 1/15 = 2/45 per day.
