      B: cosec²θ
      C: cotθ
      D: tanθ
    answer: A
    explanation: |-
      √(sec²θ + cosec²θ) = 1/(sinθ cosθ). The fraction is sinθ(1 + cosθ)/(cosθ(1 + cosθ)) = tanθ.
