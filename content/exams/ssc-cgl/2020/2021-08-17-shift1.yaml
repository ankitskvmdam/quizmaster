  - slug: cgl-2021-08-17-s1-q022
    difficulty: medium
    stem: |-
      Select the option that is related to the fourth number in the same way as the first number is related to the second number and the fifth number is related to the sixth number.

      1008 : 8 :: ? : 6 :: 220 : 4
    options:
      A: "524"
      B: "443"
      C: "518"
      D: "350"
    answer: C
    explanation: |-
      First = (n + 2)³ + n for second number n: 10³ + 8 = 1008 and 6³ + 4 = 220.
      For 6: 8³ + 6 = 518.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q024
    difficulty: medium
    stem: "Rajesh purchased 6 mangoes, 3 bananas and 10 guavas in ₹136. If the ratio of the cost (per piece) of mangoes, bananas and guavas is 3 : 2 : 1, what will be the total cost of 1 mango, 2 bananas and 3 guavas?"
    options:
      A: ₹27
      B: ₹40
      C: ₹46
      D: ₹38
    answer: B
    explanation: |-
      With prices 3x, 2x, x: 18x + 6x + 10x = 34x = 136, so x = 4.
      1 mango + 2 bananas + 3 guavas = 12 + 16 + 12 = ₹40.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q025
    difficulty: medium
    stem: |-
      Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.

      Statements:  
      Some cards are postcards.  
      Some cards are envelopes.  
      All envelopes are copies.

      Conclusions:  
      I. Some copies are envelopes.  
      II. Some postcards are copies.  
      III. Some cards are copies.
    options:
      A: Only conclusions II and III follow
      B: Only conclusions I and II follow
      C: Only conclusion I follows
      D: Only conclusions I and III follow
    answer: D
    explanation: |-
      "All envelopes are copies" gives "some copies are envelopes" (I). Some cards are envelopes, and all envelopes are copies, so some cards are copies (III).
      II is not certain.
    tags:
      - reasoning
