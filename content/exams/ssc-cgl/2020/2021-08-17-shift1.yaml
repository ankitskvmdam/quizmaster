    difficulty: medium
    stem: In △ABC, D and E are the points on sides AB and AC, respectively and DE ∥ BC. BC = 8 cm and DE = 5 cm. If the area of △ADE = 45 cm², then what is the area (in cm²) of △ABC?
    options:
      A: "115.2"
      B: "105.2"
      C: "125"
      D: "64"
    answer: A
    explanation: |-
      △ADE ~ △ABC with ratio 5 : 8, so the areas are in the ratio 25 : 64.
      Area of △ABC = 45 × 64/25 = 115.2 cm².
    tags:
      - quant
  - slug: cgl-2021-08-17-s1-q052
    difficulty: medium
    stem: A △ABC has sides 5 cm, 6 cm and 7 cm. AB extended touches a circle at P and AC extended touches the same circle at Q. Find the length (in cm) of AQ.
    options:
      A: "13"
      B: "9"
      C: "11"
      D: "12"
    answer: B
    explanation: The circle is the excircle opposite A, so AP = AQ = the semi-perimeter = (5 + 6 + 7)/2 = 9 cm.
    tags:
      - quant
  - slug: cgl-2021-08-17-s1-q053
    difficulty: medium
    stem: Two men and 7 women can complete a work in 28 days whereas 6 men and 16 women can do the same work in 11 days. In how many days can 7 men complete the same work?
    options:
      A: "11"
      B: "22"
      C: "12"
      D: "24"
    answer: B
    explanation: |-
      28(2m + 7w) = 11(6m + 16w) gives 10m = 20w, so 1 man = 2 women.
      The work is 28 × 11w = 308w = 154m, so 7 men take 154/7 = 22 days.
    tags:
      - quant
  - slug: cgl-2021-08-17-s1-q054
    difficulty: medium
    stem: In a triangle ABC, a point D lies on AB and points E and F lie on BC such that DF is parallel to AC and DE is parallel to AF. If BE = 4 cm, EF = 6cm, then find the length (in cm) of BC.
    options:
      A: "30"
      B: "20"
      C: "25"
      D: "15"
    answer: C
    explanation: |-
      DF ∥ AC and DE ∥ AF give BF² = BE × BC.
      BF = 10, so BC = 100/4 = 25 cm.
    tags:
      - quant
  - slug: cgl-2021-08-17-s1-q055
    difficulty: medium
    stem: "The value of 32 ÷ 12 of 3 × [5 − (15 − 12) ÷ 9] of 3/7 + 4 − 8 ÷ 2 of 4 is:"
    options:
      A: 3 1/3
      B: 4 7/9
      C: 3 1/6
      D: 1 7/9
    answer: B
    explanation: |-
      "of" comes first: 32 ÷ 36 = 8/9; [5 − 1/3] of 3/7 = 14/3 × 3/7 = 2; 8 ÷ (2 of 4) = 1.
