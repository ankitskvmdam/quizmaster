      C: "Wrestling : Dipa Karmakar"
      D: "Chess : Saina Nehwal"
    answer: A
    explanation: |-
      Shikhar Dhawan plays cricket and Mary Kom boxes.
      The other pairs are mismatched: Rani Rampal plays hockey, Dipa Karmakar is a gymnast, Saina Nehwal plays badminton.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q018
    difficulty: medium
    stem: Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the number-pair that is different.
    options:
      A: "182 : 12"
      B: "461 : 20"
      C: "239 : 14"
      D: "305 : 16"
    answer: A
    explanation: |-
      First = n² + 3n + 1 for second number n: 20 → 461, 14 → 239, 16 → 305.
      12 would give 181, not 182.
    tags:
      - reasoning
