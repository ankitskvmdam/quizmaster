    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q012
    difficulty: medium
    stem: |-
      Select the letter-cluster from among the given options that can replace the question mark (?) in the following series.

      WUW, TSV, QQU, NOT, ?
    options:
      A: KMS
      B: LNT
      C: MNS
      D: JNT
    answer: A
    explanation: |-
      First letters W, T, Q, N, K (−3); second letters U, S, Q, O, M (−2); third letters W, V, U, T, S (−1).
      So the next cluster is KMS.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q013
    difficulty: medium
    stem: |-
      Select the letter from among the given options that can replace the question mark (?) in the following series.

      P, N, J, H, ?
    options:
      A: D
      B: B
      C: E
      D: C
    answer: A
    explanation: "The letters move back by 2 and 4 alternately: P(−2)N(−4)J(−2)H(−4)D."
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q015
    difficulty: medium
    stem: |-
      Two different positions of the same dice are shown, the six faces of which are marked from A to F. Select the letter that will be on the face opposite to the face showing the letter 'C'.

      *(Figure: Dice 1: top F, front E, right C. Dice 2: top D, front B, right F.)*
    options:
      A: F
      B: B
      C: A
      D: D
    answer: B
    explanation: |-
      F is common to both dice and touches E, C, D and B, so A is opposite F.
      Turning dice 2 so that F is on top matches it to dice 1 and places B opposite C.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q017
    difficulty: medium
    stem: |-
      Select the option in which the words share the same relationship as that shared by the given pair of words.

      Cricket : Shikhar Dhawan
