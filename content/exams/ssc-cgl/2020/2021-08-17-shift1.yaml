questions:
  - slug: cgl-2021-08-17-s1-q002
    difficulty: medium
    stem: P is the brother of Q. S is the father of P. R is the brother of S. If T is the mother of R, then how is P related to T?
    options:
      A: Uncle
      B: Father
      C: Brother
      D: Grandson
    answer: D
    explanation: |-
      T is the mother of R and of R's brother S, and S is P's father.
      So T is P's grandmother and P is her grandson.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q003
    difficulty: medium
    stem: Four words have been given, out of which three are alike in some manner and one is different. Select the word that is different.
    options:
      A: Agitation
      B: Contention
      C: Turmoil
      D: Tranquillity
    answer: D
    explanation: Agitation, contention and turmoil all mean disturbance or conflict; tranquillity means calm.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q004
    difficulty: medium
    stem: |-
      Select the options in which the numbers are related in the same way as are the numbers of the following set.

      (541, 14, 737)
    options:
      A: (697, 13, 866)
      B: (635, 18, 924)
      C: (432, 25, 1108)
      D: (832, 8, 895)
    answer: A
    explanation: |-
      Third − first = (second)²: 737 − 541 = 196 = 14².
      Likewise 866 − 697 = 169 = 13².
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q005
    difficulty: medium
    stem: |-
      Select the number from among the given options that can replace the question mark (?) in the following series.

      24, 48, 51, 204, 209, ?
    options:
      A: "1047"
      B: "215"
      C: "1254"
      D: "416"
    answer: C
    explanation: |-
      The steps alternate between multiplying and adding: ×2, +3, ×4, +5, ×6.
      So 209 × 6 = 1254.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q006
    difficulty: medium
    stem: |-
      Find the number of triangles in the given figure.

      *(Figure: A circle with a tall triangle (tower shape) drawn inside it, divided by a vertical centre line, two horizontal lines and crossing diagonals; the triangle's sides extend to the circle.)*
    options:
      A: "22"
      B: "23"
      C: "24"
      D: "20"
    answer: C
    explanation: Count the triangles systematically in each region of the tower shape and where its lines cross; SSC's count is 24.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q007
    difficulty: medium
    stem: In a certain code language, 'MARGIN' is written as 'SBNOJH'. How will 'PRAYER' be written in that language?
    options:
      A: BSQQFZ
      B: BSQSFZ
      C: QSBSFZ
      D: BSQZFS
    answer: B
    explanation: |-
      Split MARGIN into MAR and GIN, add 1 to each letter (NBS, HJO), then reverse each half: SBN OJH.
      PRAYER → QSB, ZFS → BSQ SFZ.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q009
    difficulty: medium
    stem: |-
      Select the option in which the numbers are related in the same way as are the numbers of the following set.

      (15, 315, 7)
    options:
      A: (11, 188, 6)
      B: (17, 401, 12)
      C: (18, 486, 9)
      D: (14, 197, 4)
    answer: C
    explanation: |-
      Middle number = first × third × 3: 15 × 7 × 3 = 315.
      Likewise 18 × 9 × 3 = 486.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q010
    difficulty: medium
    stem: Four letter-clusters have been given, out of which three are alike in some manner and one is different. Select the letter-cluster that is different.
    options:
      A: NSY
      B: TYE
      C: PUB
      D: LQW
    answer: C
    explanation: NSY, TYE and LQW step forward by +5 and +6 (counting round the alphabet). PUB steps +5 and +7.
    tags:
      - reasoning
  - slug: cgl-2021-08-17-s1-q011
    difficulty: medium
    stem: |-
      Select the option that is related to the third word in the same way as the second word is related to the first word.

      Cartridge : Printer :: Motherboard : ?
