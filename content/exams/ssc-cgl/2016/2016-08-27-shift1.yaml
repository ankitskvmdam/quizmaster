  - slug: cgl-2016-08-27-s1-q058
    difficulty: medium
    stem: If x = 1 + √2 + √3, then the value of x² − 2x − 4 is
    options:
      A: √6
      B: 2√3
      C: 3√2
      D: 2√6
    answer: D
    explanation: x − 1 = √2 + √3, so (x − 1)² = 5 + 2√6. Then x² − 2x − 4 = (x − 1)² − 5 = 2√6.
    tags:
      - quant
  - slug: cgl-2016-08-27-s1-q059
    difficulty: medium
    stem: If, (a + b)/√ab = 2/1, then the value of (a − b) is
    options:
