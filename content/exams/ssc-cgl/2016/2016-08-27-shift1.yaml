      B: 16/3 cm
      C: 23/3 cm
      D: 25/3 cm
    answer: D
    explanation: ∠POR = 90°, so PR = √(OP² + OR²) = √(400/9 + 225/9) = √(625/9) = 25/3 cm.
    tags:
