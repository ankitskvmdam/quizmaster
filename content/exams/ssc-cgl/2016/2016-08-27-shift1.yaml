  - slug: cgl-2016-08-27-s1-q064
    difficulty: medium
    stem: The average of fruits offered in a temple in a week was 75. The average of fruits offered in six days excluding Tuesday was 72. How many fruits were offered on Tuesday?
    options:
      A: "90"
      B: "93"
      C: "72"
      D: "92"
    answer: B
    explanation: Total for the week = 7 × 75 = 525. The other six days = 6 × 72 = 432. Tuesday = 525 − 432 = 93.
    tags:
      - quant
  - slug: cgl-2016-08-27-s1-q066
    difficulty: medium
    stem: If x + 1/x = 5, then the value of 6x/(x² + x + 1) is,
    options:
      A: "1"
      B: "2"
      C: "3"
      D: "4"
    answer: A
    explanation: "Divide top and bottom by x: 6/(x + 1 + 1/x) = 6/(5 + 1) = 1."
    tags:
