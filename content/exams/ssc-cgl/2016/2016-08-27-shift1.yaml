  - slug: cgl-2016-08-27-s1-q063
    difficulty: medium
    stem: "The least number of square tiles of side 41 cms required to pave the ceiling of a room of size 15m 17cm long and 9m 2 cm broad is:"
    options:
      A: "902"
      B: "656"
      C: "738"
      D: "814"
    answer: D
