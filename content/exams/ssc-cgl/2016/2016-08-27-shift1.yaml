  - slug: cgl-2016-08-27-s1-q067
    difficulty: medium
    stem: If a > b > 0, AB = a − b cm, BC = 2√ab cm, then ∠ABC is
    options:
      A: 45°
      B: 60°
      C: 90°
      D: 120°
    answer: C
    explanation: In the standard version CA = a + b. Then AB² + BC² = (a − b)² + 4ab = (a + b)² = CA², so by the converse of Pythagoras ∠ABC = 90°.
    tags:
      - quant
  - slug: cgl-2016-08-27-s1-q068
    difficulty: medium
    stem: "PR is a tangent to a circle with centre O and radius 4 cm at point Q. If ∠POR = 90°, OR = 5 cm and OP = 20/3 cm, then the length of PR is:"
