      - general-awareness
  - slug: cgl-2016-09-10-s2-q050
    difficulty: medium
    stem: '"World Economic Outlook" report is published by which of the following ?'
    options:
      A: IMF
      B: World Bank
      C: RBI
      D: UNCTAD
    answer: A
    explanation: The World Economic Outlook is published by the International Monetary Fund.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q051
    difficulty: medium
    stem: "The rate of working of A and B are in the ratio of 2:3. The number of days taken by them to finish the work is in the ratio:"
    options:
      A: 2:3
      B: 4:9
      C: 3:2
      D: 9:4
    answer: C
    explanation: Time taken is inversely proportional to the rate of working, so the days are in the ratio 3:2.
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q052
    difficulty: medium
    stem: The ratio of two positive numbers is 3:4. The sum of their squares is 400. What is the sum of the numbers?
    options:
      A: "28"
      B: "22"
      C: "24"
      D: "26"
    answer: A
    explanation: "Let the numbers be 3k and 4k: 9k² + 16k² = 400, so k = 4. The numbers are 12 and 16; their sum is 28."
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q053
    difficulty: medium
    stem: If 10% loss is made on selling price, then the rate of loss on the cost price will be
    options:
      A: 11 1/9%
      B: 9 1/11%
      C: 10%
      D: 11%
    answer: A
    explanation: |-
      **Disputed.** SSC's answer is A; our check suggests B.

      SSC's answer 11 1/9% is the loss as a % of SP when the loss is 10% of CP, the reverse case. As worded: loss = 0.1 SP, CP = 1.1 SP, so loss on CP = 0.1/1.1 = 9 1/11%.
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q054
    difficulty: medium
    stem: If "basis points" are defined so that 1 percent is equal to 100 basis points, then by how many basis points is 82.5 percent greater than 62.5 percent?
    options:
      A: "0.2"
      B: "20"
      C: "200"
      D: "2000"
    answer: D
    explanation: 82.5% − 62.5% = 20 percentage points, and 20 × 100 = 2000 basis points.
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q055
    difficulty: medium
    stem: Sound travels at 330 metres per second. The distance (in kilometres) of a thunder cloud when its sound follows the flash after 10 seconds is
    options:
      A: 0.33 km
      B: 3.3 km
      C: 33 km
      D: 33.3 km
    answer: B
    explanation: Distance = 330 m/s × 10 s = 3300 m = 3.3 km.
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q057
    difficulty: medium
    stem: If P² + 1/P² = 47, the value of P + 1/P is
    options:
      A: "5"
      B: "6"
      C: "7"
      D: "8"
    answer: C
    explanation: (P + 1/P)² = P² + 1/P² + 2 = 49, so P + 1/P = 7.
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q058
    difficulty: medium
    stem: The third proportional of the following numbers (x-y)², (x²-y²)² is
    options:
      A: (x+y)³ (x-y)²
      B: (x+y)⁴ (x-y)²
      C: (x+y)² (x-y)²
      D: (x+y)² (x-y)³
    answer: B
    explanation: The third proportional of a and b is b²/a = (x²−y²)⁴/(x−y)² = (x+y)⁴(x−y)².
    tags:
      - quant
  - slug: cgl-2016-09-10-s2-q059
    difficulty: medium
    stem: Two circles touch each other externally. The distance between their centres is 7 cm. If the radius of one circle is 4 cm, then the radius of the other circle will be
    options:
      A: 3 cm
      B: 4 cm
