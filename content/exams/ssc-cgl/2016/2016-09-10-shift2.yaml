source: "SSC candidate response sheet with the official answer marked (via aglasem.com (https://docs.aglasem.com/view/57ee9ad4-dab7-11ed-83c9-0a5e36bc6706)). Left out (picture-only options or incomplete in the source): Q8, Q9, Q16, Q20, Q21, Q22, Q23, Q24, Q56."
questions:
  - slug: cgl-2016-09-10-s2-q001
    difficulty: medium
    stem: |-
      Select the related word/letters/numbers from the given alternatives:

      Dark:Light :: Noise:?
    options:
      A: Music
      B: Quiet
      C: Melody
      D: Vacuum
    answer: B
    explanation: Dark and Light are opposites; the opposite of Noise is Quiet.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q002
    difficulty: medium
    stem: |-
      Select the related word/letters/numbers from the given alternatives:

      BECD:GJHI :: LOMN:?
    options:
      A: PSRQ
      B: PQRS
      C: QTSR
      D: QTRS
    answer: D
    explanation: "Each letter moves 5 places forward: B→G, E→J, C→H, D→I. So L→Q, O→T, M→R, N→S gives QTRS."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q003
    difficulty: medium
    stem: |-
      Select the related word/letters/numbers from the given alternatives:

      27:125 :: 64:?
    options:
      A: "162"
      B: "216"
      C: "273"
      D: "514"
    answer: B
    explanation: 27 = 3³ and 125 = 5³ (cube of the number two higher). 64 = 4³, so the answer is 6³ = 216.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q004
    difficulty: medium
    stem: |-
      For the following questions

      Find the odd word/letters/number pair from the given alternatives
    options:
      A: Meter
      B: Kilometre
      C: Decimetre
      D: Ammeter
    answer: D
    explanation: Metre, kilometre and decimetre are units of length; an ammeter is an instrument that measures current.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q005
    difficulty: medium
    stem: |-
      For the following questions

      Find the odd word/letters/number pair from the given alternatives
    options:
      A: HP
      B: CJ
      C: FN
      D: RZ
    answer: B
    explanation: H(8)→P(16), F(6)→N(14) and R(18)→Z(26) differ by 8; C(3)→J(10) differs by only 7.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q006
    difficulty: medium
    stem: |-
      For the following questions

      Find the odd word/letters/number pair from the given alternatives
    options:
      A: 52-61
      B: 72-81
      C: 54-63
      D: 33-41
    answer: D
    explanation: 52-61, 72-81 and 54-63 each differ by 9; 33-41 differs by 8.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q007
    difficulty: medium
    stem: |-
      Arrange the following words as per their order in the dictionary:

      1) PHYSICAL  
      2) PHYSICS  
      3) PHYSIOLOGY  
      4) PHYSICIAN  
      5) PHONE
    options:
      A: 5,1,4,2,3
      B: 5,1,2,3,4
      C: 1,4,5,2,3
      D: 1,5,4,3,2
    answer: A
    explanation: "PHONE comes first (O < Y); then PHYSICAL < PHYSICIAN < PHYSICS (A < I < S at the 7th letter) < PHYSIOLOGY: 5, 1, 4, 2, 3."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q010
    difficulty: medium
    stem: Mohan said 'This girl is the wife of grand-son of my mother'. How is Mohan related to that girl?
    options:
      A: Grand-father
      B: Husband
      C: Father
      D: Father-in-law
    answer: D
    explanation: The grandson of Mohan's mother is Mohan's son, so the girl is his daughter-in-law and Mohan is her father-in-law.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q011
    difficulty: medium
    stem: Of the six members of a panel sitting in a row, A is to the right of C, but left of B. E is sitting left of C and right of D, who is sitting to the right of F. Find the members sitting at the two ends of the row.
    options:
      A: D.F
      B: A.B
      C: D.B
      D: F.B
    answer: D
    explanation: From left to right the row is F, D, E, C, A, B, so F and B sit at the two ends.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q012
    difficulty: medium
    stem: |-
      From the given alternative words, select the word which cannot be formed using the letters of the given word:

      LEGIBILITY
    options:
      A: BILL
      B: ABILITY
      C: BIG
      D: LEG
    answer: B
    explanation: LEGIBILITY has no letter A, so ABILITY cannot be formed.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q013
    difficulty: medium
    stem: If REDUCE= 56, RECYCLE = 71 then REUSE=?
    options:
      A: "65"
      B: "68"
      C: "69"
      D: "70"
    answer: B
    explanation: "The code is the sum of letter positions: REDUCE = 18+5+4+21+3+5 = 56. REUSE = 18+5+21+19+5 = 68."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q014
    difficulty: medium
    stem: |-
      If '+' means 'divided by', '-' means 'multiplied by', 'x' means 'minus' and ' ÷ ' means 'plus', which of the following will be the value of the expression:

      16 ÷ 8 - 4 + 2 x 4 = ?
    options:
      A: "16"
      B: "28"
      C: "32"
      D: "44"
    answer: B
    explanation: "After swapping the signs: 16 + 8 × 4 ÷ 2 − 4 = 16 + 16 − 4 = 28."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q015
    difficulty: medium
    stem: |-
      Some equations have been solved on the basis of a certain pattern. Find the correct answer for the unsolved equation on that basis:

      2*3*5= 523  
      6*4*1= 164  
      8*2*4=482,  
      then 6*8*2=?
    options:
      A: "826"
      B: "268"
      C: "286"
      D: "628"
    answer: B
    explanation: "The digits are written in the order third, first, second: 2*3*5 → 523. So 6*8*2 → 268."
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q017
    difficulty: medium
    stem: From her house Rimi went 20 km to the north. Then she turned west and covered 15 km. Then she turned south and covered 10 Km. Finally turning to east, she covered 15 km. In which direction is she from her house?
    options:
      A: East
      B: West
      C: North
      D: South
    answer: C
    explanation: North 20 km, south 10 km leaves 10 km north; west 15 km and east 15 km cancel. She is north of her house.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q018
    difficulty: medium
    stem: |-
      Consider the given statement/s to be true and decide which of the given conclusions/assumptions can definitely be drawn from the given statement.

      **Statements:** Some cars are buses.  
      All cars are caves.

      **Conclusion:** Ⅰ . Some caves are not buses  
      Ⅱ .Some caves are buses  
      Ⅲ . No cave is a bus  
      Ⅳ. Some caves are cars
    options:
      A: Only Ⅰ Conclusion follows
      B: Only Ⅱ conclusion follows
      C: Only conclusions Ⅱ and Ⅳ follows
      D: Only conclusion Ⅳ follows
    answer: C
    explanation: Since some cars are buses and all cars are caves, some caves are buses (II) and some caves are cars (IV). I and III do not follow.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q019
    difficulty: medium
    stem: |-
      6 faces of the cube are painted with different colours as shown below. In figure 3, which colour is opposite to RED?

      *(Figure: Four numbered views of a cube (top / front / right side):
      1) PINK / ORANGE / YELLOW; 2) PINK / RED / BLACK; 3) BLUE / RED / YELLOW; 4) BLUE / ORANGE / BLACK.)*
    options:
      A: Black
      B: Yellow
      C: Orange
      D: Pink
    answer: C
    explanation: Pink is adjacent to orange, yellow, red and black, so pink is opposite blue. Red touches yellow (view 3) and black (view 2), so red is opposite orange.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q025
    difficulty: medium
    stem: |-
      In the question, a word is represented by only one set of numbers as given in any one of the alternatives. The sets of numbers given in the alternatives are represented by two classes of alphabets as in two matrices given below. The columns and rows of Matrix I are numbered from 0 to 4 and that of Matrix II are numbered from 5 to 9. A letter from these matrices can be represented first by its row and next by its column, e.g., 'B' can be represented by 00,13, etc. , and 'O' can be represented by 56, 68,etc. Similarly, you have to identify the set for the word '**TEAR**'.

      MATRIX 1

      |   | 0 | 1 | 2 | 3 | 5 |
      |---|---|---|---|---|---|
      | 0 | B | C | D | E | A |
      | 1 | D | E | A | B | C |
      | 2 | C | D | E | A | B |
      | 3 | A | B | C | D | E |
      | 4 | E | A | B | C | D |

      MATRIX 2

      |   | 5 | 6 | 7 | 8 | 9 |
      |---|---|---|---|---|---|
      | 5 | R | O | N | T | U |
      | 6 | T | U | R | O | N |
      | 7 | O | N | T | U | R |
      | 8 | U | R | O | N | T |
      | 9 | N | T | U | R | O |
    options:
      A: 58,34,21,67
      B: 96,11,26,12
      C: 65,40,23,79
      D: 77,58,21,98
    answer: C
    explanation: In option C, 65 = T, 40 = E, 23 = A and 79 = R, which spells TEAR.
    tags:
      - reasoning
  - slug: cgl-2016-09-10-s2-q026
    difficulty: medium
    stem: Which of the following was not actively engaged in social and religious reforms in India ?
    options:
      A: Raja Ram Mohan Roy
      B: Pandit Iswar Chandra Vidyasagar
      C: Jotiba Phule
      D: Bharatendu Harish Chandra
    answer: D
    explanation: Bharatendu Harishchandra was a Hindi writer and poet; Ram Mohan Roy, Vidyasagar and Jyotiba Phule were social and religious reformers.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q027
    difficulty: medium
    stem: The main effect of Direct Taxes is on
    options:
      A: Food prices
      B: Consumer goods
      C: Capital goods
      D: Income
    answer: D
    explanation: Direct taxes, such as income tax, are levied on income and wealth, so their main effect is on income.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q028
    difficulty: medium
    stem: Who has the power to prorogue the Lok Sabha ?
    options:
      A: The Speaker
      B: The Prime Minister
      C: The Minister for Parliamentary Affairs
      D: The President
    answer: D
    explanation: Under Article 85 the President summons and prorogues the Houses of Parliament.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q029
    difficulty: medium
    stem: The first Europeans to come to India were
    options:
      A: British
      B: Dutch
      C: French
      D: Portugese
    answer: D
    explanation: "The Portuguese came first: Vasco da Gama reached Calicut in 1498."
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q030
    difficulty: medium
    stem: The term 'Dumping' refers to
    options:
      A: The sale of a sub-standard commodity
      B: Sale in a foreign market of a commodity at a price below marginal cost
      C: Sale in a foreign market of a commodity just at marginal cost with too much of profit
      D: Smuggling of goods without paying any customs duty
    answer: B
    explanation: Dumping is selling a good in a foreign market at a price below its cost or its home-market price.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q031
    difficulty: medium
    stem: When does the sun shine vertically on the Equator ?
    options:
      A: Throughout the year
      B: For six months
      C: Twice a year
      D: Once a year
    answer: C
    explanation: The sun is overhead at the Equator twice a year, at the equinoxes (around 21 March and 23 September).
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q032
    difficulty: medium
    stem: Lichen is an association between which of the two ?
    options:
      A: Algae and fungus
      B: Algae and tree
      C: Fungus and tree
      D: Bacteria and legume plant
    answer: A
    explanation: A lichen is a symbiotic association of an alga (or cyanobacterium) with a fungus.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q033
    difficulty: medium
    stem: Among the given nutrients, milk is a poor source of which of the following ?
    options:
      A: Vitamin 'C'
      B: Calcium
      C: Protein
      D: Carbohydrate
    answer: A
    explanation: Milk is rich in calcium, protein and lactose but is a poor source of vitamin C (and of iron).
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q034
    difficulty: medium
    stem: What is a Pepper plant ?
    options:
      A: Bush
      B: Shrub
      C: Vine
      D: Tree
    answer: C
    explanation: Black pepper (Piper nigrum) is a perennial climbing vine.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q035
    difficulty: medium
    stem: Why does a cannon recoil after firing ?
    options:
      A: Conservation of energy
      B: Backward thrust of gases produced
      C: Newton's third law of motion
      D: Newton's first law of motion
    answer: C
    explanation: "The shell is pushed forward and the cannon is pushed back with an equal and opposite force: Newton's third law."
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q036
    difficulty: medium
    stem: Which of the following statement is true?
    options:
      A: A Primary key is also a candidate key
      B: Each relation has at least one foreign key
      C: Foreign keys can't have null values
      D: A Primary key is also an alternate key
    answer: A
    explanation: A primary key is the candidate key chosen to identify rows, so every primary key is a candidate key.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q037
    difficulty: medium
    stem: Which of the following is used as non-stick coating for cooking utensils?
    options:
      A: Perspex
      B: Styrofoam
      C: Polystyrene
      D: Teflon
    answer: D
    explanation: Teflon (PTFE) is the non-stick coating used on cookware.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q038
    difficulty: medium
    stem: '"Tsunami" is the name given to which of the following?'
    options:
      A: Earthquake
      B: Cyclone
      C: Tidal Waves
      D: Undersea Waves
    answer: C
    explanation: A tsunami is a series of giant sea waves caused by undersea earthquakes; it is popularly called a "tidal wave".
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q039
    difficulty: medium
    stem: The first Indian citizen to get commercial Pilot's Licence was
    options:
      A: Vijaypat Singhania
      B: J.R.D.Tata
      C: Captain Gopinath
      D: Vijay Mallya
    answer: B
    explanation: J.R.D. Tata got India's first commercial pilot's licence in 1929.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q040
    difficulty: medium
    stem: |-
      Which of the following is/are 'rain cloud'?

      1. Cirrus

      2. Nimbostratus

      3. Cumulonimbus

      4. Altocumulus
    options:
      A: 1 and 2 only
      B: 2 and 3 only
      C: 3 and 4 only
      D: 1 and 4 only
    answer: B
    explanation: Nimbostratus and cumulonimbus are the rain-bearing clouds ("nimbus" means rain).
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q041
    difficulty: medium
    stem: According to the Indian Constitution, who has the power to declare emergency ?
    options:
      A: Prime Minister
      B: President
      C: Chief Justice
      D: Parliament
    answer: B
    explanation: Under Articles 352, 356 and 360 the President proclaims emergencies.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q042
    difficulty: medium
    stem: Particulates (< 1 µm size) remaining suspended in air indefinitely and transported by wind currents are called
    options:
      A: Mists
      B: Fumes
      C: Aerosols
      D: Smoke
    answer: C
    explanation: Fine solid or liquid particles that stay suspended in air and are carried by wind are called aerosols.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q043
    difficulty: medium
    stem: "The least preferred technique in the disposal of Municipal Solid Waste is :"
    options:
      A: Incineration
      B: Composting
      C: Land filling
      D: Bricketting
    answer: D
    explanation: "SSC's answer is briquetting, the least used technique; incineration, composting and landfilling are the mainstream methods. Note: in the waste-management hierarchy landfilling is usually called the least preferred option."
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q044
    difficulty: medium
    stem: A bomb explodes on the moon. You will hear its sound on earth after _________
    options:
      A: 20 minutes
      B: 2 hrs 20 minutes
      C: 3.7 hours
      D: You cannot hear the sound of explosion
    answer: D
    explanation: Sound needs a medium; there is no air between the Moon and the Earth, so the sound cannot be heard.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q045
    difficulty: medium
    stem: Which one of the following takes place during a nuclear fusion?
    options:
      A: a heavy nucleus bombarded by neutrons breaks up
      B: a heavy nucleus breaks up spontaneously
      C: two light nuclei combine to form a heavy nucleus
      D: a light nucleus breaks up spontaneously
    answer: C
    explanation: In nuclear fusion two light nuclei combine to form a heavier nucleus and release energy.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q046
    difficulty: medium
    stem: |-
      Arrange the following cities in an order from North to South

      1) Bhubaneshwar

      2) Chennai

      3) Hyderabad

      4) Cochin
    options:
      A: 1 3 2 4
      B: 1 2 3 4
      C: 1 2 4 3
      D: 1 3 4 2
