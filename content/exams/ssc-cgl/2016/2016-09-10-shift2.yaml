      - general-awareness
  - slug: cgl-2016-09-10-s2-q047
    difficulty: medium
    stem: British achieved political power in India after which of the following ?
    options:
      A: Battle of Plassey
      B: Battle of Panipat
      C: Battle of Buxar
      D: Battle of Wandiwash
    answer: A
    explanation: Victory at Plassey (1757) gave the British political power in Bengal, the start of their rule in India.
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q048
    difficulty: medium
    stem: The number of permanent members of the U.N. Security Council is
    options:
      A: "5"
      B: "15"
      C: "10"
      D: "25"
    answer: A
    explanation: "The UN Security Council has 5 permanent members: the USA, the UK, France, Russia and China."
    tags:
      - general-awareness
  - slug: cgl-2016-09-10-s2-q049
    difficulty: medium
    stem: |-
      Match list (I) with list (II)

      | I | II |
      |---|---|
      | a. SARAS | i)battle tank |
      | b.BHISHMA | ii)multipurpose civil aircraft |
      | c.BRAHMOS | iii)satellite |
      | d.INSAT-3C | iv)missile |
    options:
      A: a-i , b-ii , c-iii , d-iv
      B: a-iii , b-ii , c-iv , d-i
      C: a-iv , b-iii , c-i , d-ii
