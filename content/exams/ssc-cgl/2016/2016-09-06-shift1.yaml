  - slug: cgl-2016-09-06-s1-q063
    difficulty: medium
    stem: The value of (3×9ⁿ⁺¹ + 9×3²ⁿ⁻¹)/(9×3²ⁿ − 6×9ⁿ⁻¹) is equal to?
    options:
      A: 3 3/5
      B: 3 2/5
      C: 3 1/5
      D: "3"
    answer: A
    explanation: Numerator = 3^(2n)(27 + 3) = 30·3^(2n). Denominator = 3^(2n)(9 − 2/3) = (25/3)·3^(2n). Ratio = 90/25 = 3 3/5.
    tags:
