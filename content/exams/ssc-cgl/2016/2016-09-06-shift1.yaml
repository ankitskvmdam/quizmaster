    stem: If the average age of four children is 12 years and the average age of these children and their fathers is 20 years, what is the age of the father?
    options:
      A: 52 years
      B: 48 years
      C: 62 years
      D: 54 years
    answer: A
    explanation: The five ages total 5 × 20 = 100 and the children's total 4 × 12 = 48. So the father is 100 − 48 = 52.
