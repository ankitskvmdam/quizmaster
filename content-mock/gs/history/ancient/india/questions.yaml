- slug: mock-maurya-1
  difficulty: easy
  stem: "Who founded the Mauryan Empire?"
  options: { A: "Ashoka", B: "Chandragupta Maurya", C: "Bindusara", D: "Bimbisara" }
  answer: B
  explanation: "Chandragupta Maurya founded the empire around 321 BCE."
- slug: mock-maurya-2
  difficulty: easy
  stem: "What was the capital of the Mauryan Empire?"
  options: { A: "Rajagriha", B: "Vaishali", C: "Pataliputra", D: "Ujjain" }
  answer: C
  explanation: "Pataliputra, present-day Patna."
- slug: mock-maurya-3
  difficulty: easy
  stem: "Who wrote *Indica*?"
  options: { A: "Megasthenes", B: "Fa-Hien", C: "Kautilya", D: "Herodotus" }
  answer: A
  explanation: "Megasthenes, the Greek ambassador at the Mauryan court."
- slug: mock-maurya-4
  difficulty: easy
  stem: "Which war led Ashoka to embrace Buddhism?"
  options: { A: "Battle of Hydaspes", B: "Kalinga war", C: "Battle of Tarain", D: "Battle of the Ten Kings" }
  answer: B
  explanation: "The Kalinga war."
- slug: mock-maurya-5
  difficulty: medium
  stem: "The *Arthashastra* is attributed to"
  options: { A: "Kalidasa", B: "Banabhatta", C: "Kautilya", D: "Vishakhadatta" }
  answer: C
  explanation: "Kautilya (Chanakya)."
